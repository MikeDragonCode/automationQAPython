image: python:3.12-slim

stages:
  - test-fast
  - test-ui

before_script:
  - pip install -r requirements.txt

unit-and-api:
  stage: test-fast
  script:
    - pytest -m "unit or api" --alluredir=allure-results
  artifacts:
    when: always
    paths:
      - allure-results

ui:
  stage: test-ui
  needs: ["unit-and-api"]
  before_script:
    - pip install -r requirements.txt
    - playwright install --with-deps chromium
  script:
    - pytest -m ui --alluredir=allure-results
  artifacts:
    when: always
    paths:
      - allure-results
