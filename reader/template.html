<meta charset="utf-8">
<title>QA Course Reader</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<style>
  :root{
    --paper:#f2f4f0;
    --surface:#e7ebe4;
    --surface-2:#dde3d9;
    --line:#cdd5c8;
    --ink:#1a2320;
    --muted:#5c6660;
    --accent:#1f6f5c;
    --accent-ink:#f3faf6;
    --accent-soft:#d9ebe2;
    --danger:#a8432f;
    --code-bg:#e6ebe3;
    --shadow: 0 1px 0 rgba(20,30,25,.04);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#101513;
      --surface:#171d1a;
      --surface-2:#1e2622;
      --line:#2b3530;
      --ink:#e8ede9;
      --muted:#8b9993;
      --accent:#54d8ae;
      --accent-ink:#062018;
      --accent-soft:#1c3a30;
      --danger:#e08a75;
      --code-bg:#151b18;
      --shadow: 0 1px 0 rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"]{
    --paper:#101513;
    --surface:#171d1a;
    --surface-2:#1e2622;
    --line:#2b3530;
    --ink:#e8ede9;
    --muted:#8b9993;
    --accent:#54d8ae;
    --accent-ink:#062018;
    --accent-soft:#1c3a30;
    --danger:#e08a75;
    --code-bg:#151b18;
    --shadow: 0 1px 0 rgba(0,0,0,.3);
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Source Serif 4', Georgia, 'Times New Roman', serif;
    height:100dvh;
    overflow:hidden;
  }
  .mono{font-family:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;}

  a{color:var(--accent);}
  ::selection{background:var(--accent-soft);}

  .app{
    display:grid;
    grid-template-columns: 320px 1fr;
    height:100dvh;
  }

  /* ---------- Sidebar ---------- */
  .sidebar{
    background:var(--surface);
    border-right:1px solid var(--line);
    display:flex;
    flex-direction:column;
    min-width:0;
    height:100dvh;
  }
  .brand{
    padding:20px 18px 14px;
    border-bottom:1px solid var(--line);
  }
  .brand-title{
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size:13px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--ink);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .brand-title .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block;flex:none;}
  .brand-sub{margin-top:4px;font-size:12px;color:var(--muted);}

  .progress-wrap{padding:12px 18px;border-bottom:1px solid var(--line);}
  .progress-line{
    display:flex;justify-content:space-between;align-items:baseline;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;color:var(--muted);letter-spacing:.03em;margin-bottom:6px;
  }
  .progress-line b{color:var(--ink);font-weight:600;}
  .progress-track{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line);}
  .progress-fill{height:100%;background:var(--accent);border-radius:3px 0 0 3px;transition:width .25s ease;}

  .search-wrap{padding:10px 18px;border-bottom:1px solid var(--line);}
  .search-input{
    width:100%;
    font:13px/1.4 'JetBrains Mono', monospace;
    padding:7px 10px;
    border:1px solid var(--line);
    border-radius:6px;
    background:var(--paper);
    color:var(--ink);
  }
  .search-input:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .search-input::placeholder{color:var(--muted);}

  .nav{
    flex:1;
    overflow-y:auto;
    padding:8px 0 24px;
  }
  .nav-section{border-bottom:1px solid var(--line);}
  .nav-section:last-child{border-bottom:none;}
  .nav-section summary{
    list-style:none;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding:10px 18px;
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    font-weight:600;
    letter-spacing:.02em;
    color:var(--ink);
  }
  .nav-section summary::-webkit-details-marker{display:none;}
  .nav-section summary .chev{color:var(--muted);transition:transform .15s ease;flex:none;}
  .nav-section[open] summary .chev{transform:rotate(90deg);}
  .nav-section summary .count{color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums;}
  .nav-body{padding-bottom:6px;}

  .nav-subgroup-label{
    padding:6px 18px 4px 26px;
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--muted);
  }

  .nav-item{
    display:flex;
    width:100%;
    align-items:flex-start;
    gap:8px;
    padding:6px 18px 6px 26px;
    background:none;
    border:none;
    text-align:left;
    cursor:pointer;
    font-family:inherit;
    color:var(--ink);
  }
  .nav-item:hover{background:var(--surface-2);}
  .nav-item.active{background:var(--accent-soft);}
  .nav-item .status{
    flex:none;
    width:9px;height:9px;
    margin-top:5px;
    border-radius:50%;
    border:1.5px solid var(--muted);
    background:transparent;
  }
  .nav-item.done .status{background:var(--accent);border-color:var(--accent);}
  .nav-item .num{
    flex:none;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--muted);
    margin-top:1px;
    min-width:30px;
  }
  .nav-item .label{font-size:13.5px;line-height:1.35;}
  .nav-item.overview .label{font-weight:600;}
  .nav-item[hidden]{display:none;}

  /* ---------- Content ---------- */
  .content-scroll{
    height:100dvh;
    overflow-y:auto;
  }
  .content-header{
    position:sticky;top:0;
    background:var(--paper);
    border-bottom:1px solid var(--line);
    padding:14px 40px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    z-index:2;
  }
  .crumb{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:var(--muted);
    letter-spacing:.02em;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .crumb b{color:var(--ink);}
  .header-actions{display:flex;align-items:center;gap:10px;flex:none;}
  .btn{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    font-weight:600;
    padding:7px 12px;
    border-radius:6px;
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--ink);
    cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;
    white-space:nowrap;
  }
  .btn:hover{border-color:var(--accent);}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .btn.done{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
  .btn.icon{padding:7px 9px;}

  .article-wrap{padding:8px 40px 96px;display:flex;justify-content:center;}
  .article{width:100%;max-width:70ch;padding-top:28px;}

  .kicker{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:var(--accent);
    text-transform:uppercase;
    letter-spacing:.08em;
    margin:0 0 10px;
  }

  .article h1{
    font-family:'Source Serif 4', serif;
    font-size:32px;
    font-weight:700;
    line-height:1.2;
    text-wrap:balance;
    margin:0 0 22px;
    padding-bottom:16px;
    border-bottom:2px solid var(--ink);
  }
  .article h2{
    font-family:'JetBrains Mono', monospace;
    font-size:12.5px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--accent);
    margin:36px 0 12px;
    padding-bottom:8px;
    border-bottom:1px solid var(--line);
  }
  .article h3{
    font-family:'JetBrains Mono', monospace;
    font-size:14px;
    font-weight:600;
    margin:26px 0 8px;
    color:var(--ink);
  }
  .article p{font-size:16.5px;line-height:1.68;margin:0 0 16px;}
  .article ul, .article ol{font-size:16.5px;line-height:1.68;margin:0 0 16px;padding-left:1.3em;}
  .article li{margin-bottom:6px;}
  .article li > ul, .article li > ol{margin-top:6px;}
  .article strong{font-weight:700;}
  .article blockquote{
    margin:0 0 16px;
    padding:2px 18px;
    border-left:3px solid var(--accent);
    color:var(--muted);
    font-style:italic;
  }
  .article blockquote p{margin:8px 0;}
  .article hr{border:none;border-top:1px solid var(--line);margin:32px 0;}

  .article code{
    font-family:'JetBrains Mono', monospace;
    font-size:.88em;
    background:var(--code-bg);
    border:1px solid var(--line);
    border-radius:4px;
    padding:.12em .4em;
  }
  .article pre{
    background:var(--code-bg);
    border:1px solid var(--line);
    border-left:3px solid var(--accent);
    border-radius:6px;
    padding:14px 16px;
    overflow-x:auto;
    margin:0 0 20px;
  }
  .article pre code{
    background:none;border:none;padding:0;
    font-size:13px;line-height:1.6;
  }

  .article table{border-collapse:collapse;width:100%;margin:0 0 20px;font-size:14.5px;}
  .article table{overflow-x:auto;display:block;}
  .article th, .article td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top;}
  .article th{background:var(--surface);font-family:'JetBrains Mono', monospace;font-size:12px;text-transform:uppercase;letter-spacing:.03em;}
  .article td code, .article th code{white-space:nowrap;}

  .article img{max-width:100%;border-radius:6px;border:1px solid var(--line);}

  .pager{
    max-width:70ch;margin:44px auto 0;
    display:flex;justify-content:space-between;gap:16px;
    border-top:1px solid var(--line);
    padding-top:20px;
  }
  .pager-btn{
    flex:1;max-width:48%;
    display:flex;flex-direction:column;gap:4px;
    padding:12px 14px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--surface);
    color:var(--ink);
    cursor:pointer;
    text-align:left;
  }
  .pager-btn:hover{border-color:var(--accent);}
  .pager-btn.next{margin-left:auto;text-align:right;align-items:flex-end;}
  .pager-btn .dir{font-family:'JetBrains Mono', monospace;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}
  .pager-btn .ttl{font-size:14px;font-weight:600;}
  .pager-spacer{flex:1;max-width:48%;}
  .pager-btn.disabled{opacity:.5;cursor:not-allowed;}
  .pager-btn.disabled:hover{border-color:var(--line);}

  /* ---------- lock state ---------- */
  .nav-item.locked{opacity:.4;cursor:not-allowed;}
  .nav-item.locked:hover{background:none;}
  .lock-icon{flex:none;width:9px;height:9px;margin-top:5px;color:var(--muted);}
  .lock-icon svg{display:block;width:100%;height:100%;}

  /* ---------- gate: practice check + quiz ---------- */
  .gate{
    margin-top:36px;
    border:1px solid var(--line);
    border-radius:10px;
    background:var(--surface);
    padding:20px 22px;
  }
  .gate-title{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
    color:var(--ink);margin:0 0 16px;
    display:flex;align-items:center;gap:8px;
  }
  .gate-row{margin-bottom:18px;}
  .gate-row:last-child{margin-bottom:0;}
  .gate-check{display:flex;align-items:flex-start;gap:10px;font-size:14.5px;cursor:pointer;line-height:1.5;}
  .gate-check input{margin-top:4px;flex:none;width:15px;height:15px;accent-color:var(--accent);}
  .gate-q{font-size:15.5px;font-weight:600;margin:0 0 12px;line-height:1.45;}
  .gate-options{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;}
  .gate-option{
    display:flex;align-items:flex-start;gap:10px;
    padding:10px 12px;border:1px solid var(--line);border-radius:7px;
    cursor:pointer;font-size:14.5px;line-height:1.45;background:var(--paper);
  }
  .gate-option:hover{border-color:var(--accent);}
  .gate-option input{margin-top:3px;flex:none;width:14px;height:14px;accent-color:var(--accent);}
  .gate-option.picked{border-color:var(--accent);}
  .gate-option.correct{border-color:var(--accent);background:var(--accent-soft);}
  .gate-option.wrong{border-color:var(--danger);background:rgba(168,67,47,.1);}
  .gate-option.disabled{cursor:default;}
  .gate-feedback{font-size:14px;padding:10px 12px;border-radius:7px;margin-bottom:14px;}
  .gate-feedback.ok{background:var(--accent-soft);color:var(--ink);}
  .gate-feedback.bad{background:rgba(168,67,47,.12);color:var(--ink);}
  .gate-done{display:flex;align-items:center;gap:8px;color:var(--accent);font-weight:600;font-size:14px;}
  .gate-hint{font-size:13px;color:var(--muted);margin-top:10px;}
  .gate-check-btn{margin-top:2px;}

  /* ---------- Mobile ---------- */
  .menu-btn{display:none;}
  .scrim{
    position:fixed;inset:0;background:rgba(10,14,12,.45);
    opacity:0;pointer-events:none;transition:opacity .2s ease;z-index:9;
  }
  .scrim.show{opacity:1;pointer-events:auto;}
  @media (max-width:820px){
    .app{grid-template-columns:1fr;}
    .sidebar{
      position:fixed;inset:0 auto 0 0;
      width:86vw;max-width:340px;
      transform:translateX(-100%);
      transition:transform .2s ease;
      z-index:10;
      box-shadow:2px 0 24px rgba(0,0,0,.25);
    }
    .sidebar.open{transform:translateX(0);}
    .menu-btn{display:inline-flex;}
    .content-header{padding:12px 18px;}
    .article-wrap{padding:8px 18px 72px;}
    .crumb{display:none;}
  }

  [hidden]{display:none !important;}

  /* ---------- syntax highlighting (hljs classes), tied to tokens ---------- */
  .hljs{color:var(--ink);}
  .hljs-comment, .hljs-quote{color:var(--muted);font-style:italic;}
  .hljs-keyword, .hljs-selector-tag, .hljs-literal, .hljs-subst{color:var(--accent);font-weight:600;}
  .hljs-string, .hljs-doctag, .hljs-regexp{color:#a1662f;}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .hljs-string{color:#e0a86a;} }
  :root[data-theme="dark"] .hljs-string{color:#e0a86a;}
  .hljs-number, .hljs-symbol{color:#7a6fd6;}
  .hljs-title, .hljs-title.function_, .hljs-title.class_, .hljs-section{color:var(--ink);font-weight:700;}
  .hljs-attr, .hljs-attribute, .hljs-variable, .hljs-template-variable, .hljs-params{color:var(--ink);}
  .hljs-built_in, .hljs-type, .hljs-class{color:#3a7bd5;}
  .hljs-meta, .hljs-meta .hljs-keyword{color:var(--muted);}
  .hljs-deletion{background:rgba(168,67,47,.15);}
  .hljs-addition{background:rgba(31,111,92,.15);}
  .hljs-emphasis{font-style:italic;}
  .hljs-strong{font-weight:700;}
</style>

<div class="app">
  <div class="scrim" id="scrim"></div>
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-title"><span class="dot"></span>QA AUTOMATION COURSE</div>
      <div class="brand-sub">Python · pytest · requests · Playwright</div>
    </div>
    <div class="progress-wrap">
      <div class="progress-line"><span>Пройдено</span><span class="mono"><b id="progress-count">0</b> / <span id="progress-total">0</span></span></div>
      <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    </div>
    <div class="search-wrap">
      <input class="search-input" id="search" type="text" placeholder="Найти урок…" autocomplete="off">
    </div>
    <nav class="nav" id="nav"></nav>
  </aside>

  <main class="content-scroll" id="content-scroll">
    <div class="content-header">
      <button class="btn icon menu-btn" id="menu-btn" aria-label="Открыть оглавление">☰</button>
      <div class="crumb" id="crumb"></div>
      <div class="header-actions">
        <button class="btn" id="done-btn"></button>
      </div>
    </div>
    <div class="article-wrap">
      <article class="article" id="article"></article>
    </div>
    <div class="pager" id="pager"></div>
  </main>
</div>

<script id="course-data" type="application/json">__COURSE_DATA_JSON__</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
(function(){
  "use strict";

  var PAGES = JSON.parse(document.getElementById('course-data').textContent);
  var byId = {};
  PAGES.forEach(function(p){ byId[p.id] = p; });

  marked.setOptions({
    gfm:true,
    breaks:false,
    highlight:function(code, lang){
      try{
        if(lang && hljs.getLanguage(lang)){
          return hljs.highlight(code, {language:lang}).value;
        }
        return hljs.highlightAuto(code).value;
      }catch(e){ return code; }
    }
  });

  // ---------- progress storage ----------
  var STORE_KEY = 'qa-course-reader-progress-v1';
  var LAST_KEY = 'qa-course-reader-last-v1';

  function loadProgress(){
    try{
      var raw = localStorage.getItem(STORE_KEY);
      return raw ? JSON.parse(raw) : {};
    }catch(e){ return {}; }
  }
  function saveProgress(p){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(p)); }catch(e){}
  }
  function loadLast(){
    try{ return localStorage.getItem(LAST_KEY); }catch(e){ return null; }
  }
  function saveLast(id){
    try{ localStorage.setItem(LAST_KEY, id); }catch(e){}
  }

  var progress = loadProgress();

  function isDone(id){ return !!progress[id]; }
  function setDone(id, val){
    if(val) progress[id] = true; else delete progress[id];
    saveProgress(progress);
    renderProgress();
    refreshLocks();
    var row = navEl.querySelector('[data-id="'+id+'"]');
    if(row) row.classList.toggle('done', isDone(id));
  }
  function toggleDone(id){ setDone(id, !isDone(id)); }

  // ---------- build grouped structure ----------
  var groups = []; // { section, entries:[ {subgroup, items:[page,...]} ], flatIds:[...] }
  PAGES.forEach(function(p){
    var g = groups[groups.length-1];
    if(!g || g.section !== p.section){
      g = { section:p.section, entries:[] };
      groups.push(g);
    }
    var e = g.entries[g.entries.length-1];
    if(!e || e.subgroup !== p.subgroup){
      e = { subgroup:p.subgroup, items:[] };
      g.entries.push(e);
    }
    e.items.push(p);
  });
  groups.forEach(function(g){
    g.flatIds = g.entries.flatMap(function(e){ return e.items.map(function(p){ return p.id; }); });
  });

  // id -> { list, index } within its own section, for sequential-lock checks
  var lockIndex = {};
  groups.forEach(function(g){
    g.flatIds.forEach(function(id, i){ lockIndex[id] = { list:g.flatIds, index:i }; });
  });
  function isLocked(id){
    var pos = lockIndex[id];
    if(!pos || pos.index === 0) return false;
    var prevId = pos.list[pos.index-1];
    return !isDone(prevId);
  }
  function lockRequirement(id){
    // the immediately preceding lesson in the same section that must be done first
    var pos = lockIndex[id];
    if(!pos || pos.index === 0) return null;
    return byId[pos.list[pos.index-1]];
  }
  function refreshLocks(){
    navEl.querySelectorAll('.nav-item').forEach(function(item){
      var locked = isLocked(item.dataset.id);
      item.classList.toggle('locked', locked);
      var statusEl = item.querySelector('.status, .lock-icon');
      if(statusEl){
        if(locked && statusEl.classList.contains('status')){
          var lock = document.createElement('span');
          lock.className = 'lock-icon';
          lock.innerHTML = LOCK_SVG;
          statusEl.replaceWith(lock);
        } else if(!locked && statusEl.classList.contains('lock-icon')){
          var dot = document.createElement('span');
          dot.className = 'status';
          statusEl.replaceWith(dot);
        }
      }
    });
  }
  var LOCK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="9" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>';

  var navEl = document.getElementById('nav');
  var totalCount = PAGES.length;
  document.getElementById('progress-total').textContent = totalCount;

  function countDoneIn(list){
    var n=0; list.forEach(function(p){ if(isDone(p.id)) n++; }); return n;
  }

  groups.forEach(function(g, gi){
    var details = document.createElement('details');
    details.className = 'nav-section';
    if(gi === 0) details.open = true;

    var allIds = [];
    g.entries.forEach(function(e){ e.items.forEach(function(p){ allIds.push(p.id); }); });

    var summary = document.createElement('summary');
    summary.innerHTML =
      '<span><span class="chev">▸</span> ' + escapeHtml(g.section) + '</span>' +
      '<span class="count mono" data-count-for="'+gi+'">'+countDoneIn(g.entries.flatMap(function(e){return e.items;}))+'/'+allIds.length+'</span>';
    details.appendChild(summary);

    var body = document.createElement('div');
    body.className = 'nav-body';

    g.entries.forEach(function(e){
      if(e.subgroup){
        var lbl = document.createElement('div');
        lbl.className = 'nav-subgroup-label';
        lbl.textContent = e.subgroup;
        body.appendChild(lbl);
      }
      e.items.forEach(function(p){
        var locked = isLocked(p.id);
        var btn = document.createElement('button');
        btn.className = 'nav-item' + (isDone(p.id) ? ' done':'') + (p.isOverview ? ' overview':'') + (locked ? ' locked':'');
        btn.dataset.id = p.id;
        btn.dataset.search = (p.title + ' ' + (p.num||'')).toLowerCase();
        btn.innerHTML =
          (locked ? '<span class="lock-icon">'+LOCK_SVG+'</span>' : '<span class="status"></span>') +
          (p.num ? '<span class="num mono">'+escapeHtml(p.num)+'</span>' : '<span class="num mono">·</span>') +
          '<span class="label">'+escapeHtml(p.title)+'</span>';
        btn.addEventListener('click', function(){
          if(isLocked(p.id)) return;
          navigate(p.id); closeMobileNav();
        });
        body.appendChild(btn);
      });
    });

    details.appendChild(body);
    navEl.appendChild(details);
  });

  function renderProgress(){
    var done = PAGES.filter(function(p){ return isDone(p.id); }).length;
    document.getElementById('progress-count').textContent = done;
    document.getElementById('progress-fill').style.width = (totalCount ? (done/totalCount*100) : 0) + '%';
    groups.forEach(function(g, gi){
      var all = g.entries.flatMap(function(e){ return e.items; });
      var el = navEl.querySelector('[data-count-for="'+gi+'"]');
      if(el) el.textContent = countDoneIn(all) + '/' + all.length;
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  // ---------- rendering current page ----------
  var articleEl = document.getElementById('article');
  var crumbEl = document.getElementById('crumb');
  var doneBtn = document.getElementById('done-btn');
  var pagerEl = document.getElementById('pager');
  var scrollEl = document.getElementById('content-scroll');

  var currentId = null;

  function navigate(id){
    var page = byId[id];
    if(!page) return;
    currentId = id;
    saveLast(id);

    navEl.querySelectorAll('.nav-item.active').forEach(function(el){ el.classList.remove('active'); });
    var row = navEl.querySelector('[data-id="'+id+'"]');
    if(row){
      row.classList.add('active');
      var parentDetails = row.closest('details');
      if(parentDetails) parentDetails.open = true;
      row.scrollIntoView({block:'nearest'});
    }

    var crumbParts = [page.section];
    if(page.subgroup) crumbParts.push(page.subgroup);
    crumbEl.innerHTML = crumbParts.map(function(c,i){
      return (i===crumbParts.length-1) ? '<b>'+escapeHtml(c)+'</b>' : escapeHtml(c);
    }).join(' <span style="opacity:.5">›</span> ');

    var kicker = page.subgroup ? page.section + ' · ' + page.subgroup : page.section;
    articleEl.innerHTML =
      '<p class="kicker">'+escapeHtml(kicker)+'</p>' +
      marked.parse(page.content);

    articleEl.querySelectorAll('a[href^="#p"]').forEach(function(a){
      var targetId = a.getAttribute('href').slice(1);
      a.addEventListener('click', function(ev){
        ev.preventDefault();
        if(isLocked(targetId)) return;
        navigate(targetId);
      });
    });

    var gateNode = buildGate(page);
    if(gateNode) articleEl.appendChild(gateNode);
    doneBtn.hidden = !!(page.quiz || page.hasPractice);
    if(!doneBtn.hidden) updateDoneBtn();

    renderPager();
    scrollEl.scrollTop = 0;
  }

  function updateDoneBtn(){
    var done = isDone(currentId);
    doneBtn.textContent = done ? '✓ Пройдено' : 'Отметить пройденным';
    doneBtn.classList.toggle('done', done);
  }
  doneBtn.addEventListener('click', function(){
    toggleDone(currentId);
    updateDoneBtn();
  });

  // ---------- gate: mini-task self-check + quiz question ----------
  function buildGate(page){
    var quiz = page.quiz;
    if(!quiz && !page.hasPractice) return null;

    var wrap = document.createElement('div');
    wrap.className = 'gate';

    if(isDone(page.id)){
      wrap.innerHTML =
        '<p class="gate-title">✓ Проверка урока</p>' +
        '<p class="gate-done">Мини-задание и тест пройдены</p>' +
        (quiz ? '<button type="button" class="btn gate-check-btn" id="gate-review-btn">Показать вопрос ещё раз</button>' +
                '<div id="gate-review" hidden></div>' : '');
      if(quiz){
        var reviewBtn = wrap.querySelector('#gate-review-btn');
        var reviewBox = wrap.querySelector('#gate-review');
        reviewBtn.addEventListener('click', function(){
          reviewBox.hidden = !reviewBox.hidden;
          if(!reviewBox.hidden && !reviewBox.dataset.filled){
            reviewBox.dataset.filled = '1';
            reviewBox.style.marginTop = '14px';
            reviewBox.innerHTML =
              '<p class="gate-q">'+escapeHtml(quiz.question)+'</p>' +
              '<div class="gate-options">' + quiz.options.map(function(opt, i){
                return '<div class="gate-option disabled'+(i===quiz.correct?' correct':'')+'">'+escapeHtml(opt)+'</div>';
              }).join('') + '</div>' +
              '<div class="gate-feedback ok">'+escapeHtml(quiz.explain)+'</div>';
          }
        });
      }
      return wrap;
    }

    var practiceChecked = !page.hasPractice;
    var quizPassed = !quiz;
    var picked = null;

    var html = '<p class="gate-title">Проверка урока</p>';
    if(page.hasPractice){
      html += '<div class="gate-row"><label class="gate-check"><input type="checkbox" id="gate-practice"> Я выполнил(а) мини-задание из этого урока</label></div>';
    }
    if(quiz){
      html += '<div class="gate-row">' +
        '<p class="gate-q">'+escapeHtml(quiz.question)+'</p>' +
        '<div class="gate-options" id="gate-options">' +
        quiz.options.map(function(opt, i){
          return '<label class="gate-option" data-i="'+i+'"><input type="radio" name="gate-quiz"> <span>'+escapeHtml(opt)+'</span></label>';
        }).join('') +
        '</div>' +
        '<div id="gate-feedback"></div>' +
        '<button type="button" class="btn gate-check-btn" id="gate-check-btn">Проверить ответ</button>' +
        '</div>';
    }
    html += '<p class="gate-hint">Следующий урок откроется, когда ' +
      (page.hasPractice && quiz ? 'чекбокс отмечен и тест решён верно.' : quiz ? 'тест решён верно.' : 'чекбокс отмечен.') +
      '</p>';
    wrap.innerHTML = html;

    function tryComplete(){
      if(practiceChecked && quizPassed){
        setDone(page.id, true);
        navigate(page.id);
      }
    }

    if(page.hasPractice){
      wrap.querySelector('#gate-practice').addEventListener('change', function(ev){
        practiceChecked = ev.target.checked;
        tryComplete();
      });
    }

    if(quiz){
      var optionsEl = wrap.querySelector('#gate-options');
      var feedbackEl = wrap.querySelector('#gate-feedback');
      var checkBtn = wrap.querySelector('#gate-check-btn');

      optionsEl.querySelectorAll('.gate-option').forEach(function(optEl){
        optEl.addEventListener('click', function(){
          if(quizPassed) return;
          picked = parseInt(optEl.dataset.i, 10);
          optionsEl.querySelectorAll('.gate-option').forEach(function(o){ o.classList.remove('picked'); });
          optEl.classList.add('picked');
          optEl.querySelector('input').checked = true;
        });
      });

      checkBtn.addEventListener('click', function(){
        if(picked === null){
          feedbackEl.innerHTML = '<div class="gate-feedback bad">Выбери один из вариантов.</div>';
          return;
        }
        if(picked === quiz.correct){
          quizPassed = true;
          optionsEl.querySelectorAll('.gate-option').forEach(function(o){
            o.classList.add('disabled');
            if(parseInt(o.dataset.i, 10) === quiz.correct) o.classList.add('correct');
          });
          checkBtn.disabled = true;
          feedbackEl.innerHTML = '<div class="gate-feedback ok">Верно! '+escapeHtml(quiz.explain)+'</div>';
          tryComplete();
        } else {
          feedbackEl.innerHTML = '<div class="gate-feedback bad">Неверно, попробуй ещё раз.</div>';
        }
      });
    }

    return wrap;
  }

  function renderPager(){
    var idx = PAGES.findIndex(function(p){ return p.id === currentId; });
    var prev = idx > 0 ? PAGES[idx-1] : null;
    var next = idx < PAGES.length-1 ? PAGES[idx+1] : null;
    pagerEl.innerHTML = '';
    if(prev){
      var pb = document.createElement('button');
      pb.className = 'pager-btn prev';
      pb.innerHTML = '<span class="dir">← Назад</span><span class="ttl">'+escapeHtml(prev.title)+'</span>';
      pb.addEventListener('click', function(){ navigate(prev.id); });
      pagerEl.appendChild(pb);
    } else {
      var sp = document.createElement('div'); sp.className='pager-spacer'; pagerEl.appendChild(sp);
    }
    if(next){
      var nb = document.createElement('button');
      var locked = isLocked(next.id);
      nb.className = 'pager-btn next' + (locked ? ' disabled' : '');
      if(locked){
        nb.disabled = true;
        nb.innerHTML = '<span class="dir">Заблокировано</span><span class="ttl">Сначала пройди этот урок</span>';
      } else {
        nb.innerHTML = '<span class="dir">Далее →</span><span class="ttl">'+escapeHtml(next.title)+'</span>';
        nb.addEventListener('click', function(){ navigate(next.id); });
      }
      pagerEl.appendChild(nb);
    } else {
      var sp2 = document.createElement('div'); sp2.className='pager-spacer'; pagerEl.appendChild(sp2);
    }
  }

  renderProgress();

  // ---------- search ----------
  var searchInput = document.getElementById('search');
  searchInput.addEventListener('input', function(){
    var q = searchInput.value.trim().toLowerCase();
    navEl.querySelectorAll('.nav-item').forEach(function(item){
      var match = !q || item.dataset.search.indexOf(q) !== -1;
      item.hidden = !match;
    });
    navEl.querySelectorAll('.nav-section').forEach(function(section){
      var visible = section.querySelectorAll('.nav-item:not([hidden])').length > 0;
      section.hidden = q && !visible;
      if(q && visible) section.open = true;
    });
    navEl.querySelectorAll('.nav-subgroup-label').forEach(function(lbl){
      var next = lbl.nextElementSibling;
      var any = false;
      while(next && next.classList && next.classList.contains('nav-item')){
        if(!next.hidden) any = true;
        next = next.nextElementSibling;
      }
      lbl.hidden = q && !any;
    });
  });

  // ---------- mobile nav ----------
  var sidebar = document.getElementById('sidebar');
  var scrim = document.getElementById('scrim');
  document.getElementById('menu-btn').addEventListener('click', function(){
    sidebar.classList.add('open'); scrim.classList.add('show');
  });
  function closeMobileNav(){
    sidebar.classList.remove('open'); scrim.classList.remove('show');
  }
  scrim.addEventListener('click', closeMobileNav);

  // ---------- initial page ----------
  var startId = loadLast();
  if(!startId || !byId[startId]) startId = PAGES[0].id;
  navigate(startId);
})();
</script>
