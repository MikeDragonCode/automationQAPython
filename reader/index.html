ами"], "correct": 3, "explain": "Page Object переносит локаторы и технические детали работы со страницей в отдельный класс, чтобы они не копировались в каждом тесте и не ломались все разом при изменении вёрстки."}, {"question": "Что произойдёт, если локатор поля email используется напрямую в десяти тестах и разработчик изменит разметку?", "options": ["Все десять тестов автоматически удалятся", "Потребуется вручную исправить локатор в каждом из десяти мест, где он продублирован", "Ничего, Playwright автоматически обновит локатор во всех тестах", "pytest сам определит новый локатор по названию поля"], "correct": 1, "explain": "Без Page Object дублированный локатор придётся исправлять в каждом месте, где он скопирован — это увеличивает объём правок и риск что-то пропустить."}, {"question": "Верно ли утверждение: «PageObject — это специальная возможность pytest»?", "options": ["Да, но только в связке с pytest-playwright", "Нет, это архитектурный паттерн организации автотестов, не привязанный к конкретному инструменту", "Да, PageObject реализован внутри библиотеки pytest", "Нет, это встроенная функция Playwright"], "correct": 1, "explain": "PageObject — общий архитектурный паттерн, который используется во многих инструментах автоматизации, а не особенность pytest или Playwright."}, {"question": "Как выглядит тест после перехода на PageObject, если сравнивать с прямым использованием Playwright?", "options": ["Тест перестаёт использовать pytest вообще", "Тест становится длиннее, потому что добавляются классы страниц", "Тест описывает действия пользователя на более высоком уровне (например, fill_registration_form()), а не технические детали (page.locator(...))", "Тест теряет возможность делать проверки через expect()"], "correct": 2, "explain": "После перехода на PageObject тест читается как описание пользовательского сценария, а не как набор технических вызовов Playwright."}, {"question": "Как в паттерне PageObject распределяется ответственность между тестом и классом страницы?", "options": ["Тест описывает, что делает пользователь, а класс страницы знает, как это реализовано технически (локаторы, поиск элементов)", "Класс страницы отвечает только за проверки, а весь остальной код остаётся в тесте", "И тест, и класс страницы должны содержать одинаковый набор локаторов для надёжности", "Тест отвечает за локаторы, а класс страницы — за сценарий"], "correct": 0, "explain": "Тест отвечает на вопрос «что делает пользователь», а класс страницы — на вопрос «как именно это реализовано» (локаторы, поиск элементов, детали Playwright)."}]}, {"id": "p63", "section": "Модуль 4 · Playwright + POM", "subgroup": "Неделя 10", "isOverview": false, "num": "4.12", "title": "Разбираем BasePage построчно", "content": "# 4.12. Разбираем BasePage построчно\n\n## Зачем это нужно\n\n`BasePage` — это фундамент, от которого наследуются все страницы в `boilerplate/`, включая ту, которую ты добавишь в домашнем задании. Прежде чем писать новый Page Object, нужно точно понимать, что уже \"достаётся бесплатно\" через наследование, а что нужно реализовывать самому.\n\n## Теория\n\nОткрой файл `boilerplate/pages/base_page.py` — весь его код уместился в 19 строк:\n\n```python\nfrom playwright.sync_api import Page, expect\n\n\nclass BasePage:\n    \"\"\"\n    Общая функциональность для всех страниц приложения: хранение объекта page,\n    открытие страницы по URL, проверка текущего адреса.\n    Конкретные страницы (RegistrationPage, DashboardPage, ...) наследуются от него.\n    \"\"\"\n\n    def __init__(self, page: Page):\n        self.page = page\n\n    def open(self, url: str) -> None:\n        self.page.goto(url)\n\n    def check_current_url(self, expected_url: str) -> None:\n        expect(self.page).to_have_url(expected_url)\n```\n\nРазберём каждую часть.\n\n### Импорты\n\n```python\nfrom playwright.sync_api import Page, expect\n```\n\n`Page` — тип объекта Playwright, представляющего вкладку браузера (тот самый `page`, с которым мы работали на неделе 9). Он импортируется здесь для аннотации типа в конструкторе — сам класс `Page` не создаётся, а только используется для подсказки, что именно ожидается на вход. `expect` — та же функция для проверок, которую мы разбирали в уроке 4.7.\n\n### Конструктор\n\n```python\ndef __init__(self, page: Page):\n    self.page = page\n```\n\nКогда позже будет создаваться объект конкретной страницы (например, `RegistrationPage(page)`), внутрь передаётся объект Playwright `page`, полученный из фикстуры `pytest-playwright`. Конструктор `BasePage` сохраняет его в атрибуте `self.page`. После этого любой метод любой страницы, унаследованной от `BasePage`, может обращаться к браузеру через `self.page.goto(...)`, `self.page.locator(...)` и так далее.\n\nПочему это важно понимать заранее: каждая новая страница, которую ты создашь, должна вызвать этот конструктор через `super().__init__(page)` — иначе `self.page` не появится, и все методы, которые на него полагаются, сломаются. Мы увидим это в следующем уроке на примере `RegistrationPage`.\n\n### Метод `open`\n\n```python\ndef open(self, url: str) -> None:\n    self.page.goto(url)\n```\n\nПринимает URL и открывает его через Playwright. Метод сам по себе не делает ничего особенного — это обёртка над `page.goto(...)`. Ценность не в сложности реализации, а в том, что это единая точка, через которую любая страница проекта открывается по URL. Если понадобится, например, логировать каждое открытие страницы — это единственное место, которое нужно будет изменить.\n\n### Метод `check_current_url`\n\n```python\ndef check_current_url(self, expected_url: str) -> None:\n    expect(self.page).to_have_url(expected_url)\n```\n\nПроверяет, что текущий URL страницы совпадает с ожидаемым. Обрати внимание: здесь используется `expect(self.page).to_have_url(...)`, а не `assert self.page.url == expected_url`. Как мы разобрали на уроке 4.7, `expect()` умеет ждать нужное состояние — если переход на страницу занимает долю секунды, `expect()` подождёт, а обычный `assert` мог бы сработать слишком рано и дать ложное падение теста.\n\n## Пример\n\n`BasePage` сам по себе не используется напрямую в тестах — он не описывает никакую конкретную страницу приложения. Его роль видна только через наследование:\n\n```python\nclass RegistrationPage(BasePage):\n    ...\n\nclass DashboardPage(BasePage):\n    ...\n```\n\nОбе страницы автоматически получают `self.page`, `open()` и `check_current_url()`, не переписывая их заново. Это и есть смысл базового класса: общая функциональность реализована один раз, а не дублируется в каждой странице.\n\n## Частые ошибки\n\n- Пытаться сразу расширить `BasePage` большим количеством \"универсальных\" методов — в реальных проектах базовый класс страницы действительно может содержать больше возможностей (ожидания загрузки, работу с попапами, общие проверки), но в этом курсе он специально оставлен простым, чтобы не размывать саму идею наследования. Если для домашнего задания тебе не хватает какого-то общего метода — сначала подумай, действительно ли он общий для нескольких страниц, а не специфичен для одной.\n- Забыть, что `open()` и `check_current_url()` уже существуют в `BasePage`, и продублировать их в новой странице вместо использования через `super()`.\n- Менять сам `base_page.py` под задачи конкретной страницы — если новой странице нужно что-то своё, это должно жить в её собственном классе, а не в общем `BasePage` (иначе следующая правка \"под одну страницу\" начнёт ломать остальные).\n\n## Мини-задание\n\nНе открывая следующий урок, попробуй предположить: если бы тебе нужно было создать `LoginPage` для страницы входа, какие два метода из `BasePage` ты бы точно унаследовал без изменений? Запиши ответ, а на уроке 4.16 сверишь его с реальным решением.\n", "hasPractice": true, "quiz": [{"question": "Что произойдёт, если в наследнике BasePage забыть вызвать super().__init__(page) в конструкторе?", "options": ["Тест завершится успешно, но локаторы будут работать медленнее", "Playwright автоматически запустит новый браузер вместо переданного page", "Ничего — Python автоматически вызовет конструктор родительского класса", "Атрибут self.page не будет создан, и методы, которые на него полагаются, вызовут ошибку"], "correct": 3, "explain": "super().__init__(page) выполняет конструктор BasePage, который сохраняет page в self.page. Без этого вызова атрибут self.page не появится, и методы вроде open() или check_current_url() сломаются."}, {"question": "Что сохраняется в атрибуте self.page внутри конструктора BasePage?", "options": ["Строка с текущим URL страницы", "Объект Page из Playwright, переданный при создании страницы", "Список всех локаторов страницы", "Фикстура pytest"], "correct": 1, "explain": "self.page хранит объект Page из Playwright, полученный из фикстуры pytest-playwright, — через него любой метод любой страницы может обращаться к браузеру."}, {"question": "Что делает метод open(self, url) в BasePage?", "options": ["Создаёт новый объект страницы", "Открывает страницу по указанному адресу через self.page.goto(url)", "Закрывает текущую вкладку браузера", "Проверяет, что текущий URL совпадает с переданным"], "correct": 1, "explain": "Метод open принимает URL и открывает его через self.page.goto(url) — это единая точка, через которую любая страница проекта открывается по адресу."}, {"question": "Почему check_current_url использует expect(self.page).to_have_url(...), а не assert self.page.url == expected_url?", "options": ["assert нельзя использовать вне тестовых функций pytest", "assert работает медленнее, чем expect()", "expect() умеет ждать нужное состояние страницы, а обычный assert проверяет значение только один раз", "self.page.url не существует как атрибут в Playwright"], "correct": 2, "explain": "Если переход на другую страницу занимает время, expect() подождёт нужный URL, тогда как обычный assert может сработать раньше и дать ложное падение теста."}, {"question": "Почему в этом курсе BasePage сознательно оставлен маленьким, а не расширен множеством «универсальных» методов?", "options": ["Потому что pytest не поддерживает большие базовые классы", "Потому что Playwright технически ограничивает размер базового класса", "Потому что BasePage не может содержать больше двух методов технически", "Чтобы не размывать саму идею наследования и не добавлять то, что реально не нужно текущим страницам"], "correct": 3, "explain": "Учебная цель — показать саму идею наследования и Page Object на минимальном примере; в реальных проектах базовый класс страницы действительно может быть больше."}]}, {"id": "p64", "section": "Модуль 4 · Playwright + POM", "subgroup": "Неделя 10", "isOverview": false, "num": "4.13", "title": "Разбираем RegistrationPage построчно", "content": "# 4.13. Разбираем RegistrationPage построчно\n\n## Зачем это нужно\n\n`RegistrationPage` — это первый полноценный Page Object в проекте и, что важнее, это тот самый образец, по которому ты будешь строить свой `LoginPage` в домашнем задании. Каждая деталь в этом файле — не случайность, а конкретное архитектурное решение, которое стоит понимать, а не просто копировать.\n\n## Теория\n\nОткрой `boilerplate/pages/registration_page.py`:\n\n```python\nfrom playwright.sync_api import Page, expect\n\nfrom pages.base_page import BasePage\n\n\nclass RegistrationPage(BasePage):\n    URL = \"https://nikita-filonov.github.io/qa-automation-engineer-ui-course/#/auth/registration\"\n\n    def __init__(self, page: Page):\n        super().__init__(page)\n\n        self.email_input = page.locator(\"[data-testid='registration-form-email-input'] input\")\n        self.username_input = page.locator(\"[data-testid='registration-form-username-input'] input\")\n        self.password_input = page.locator(\"[data-testid='registration-form-password-input'] input\")\n        self.registration_button = page.locator(\"[data-testid='registration-page-registration-button']\")\n\n    def open_page(self) -> None:\n        super().open(self.URL)\n\n    def fill_registration_form(self, email: str, username: str, password: str) -> None:\n        self.email_input.fill(email)\n        self.username_input.fill(username)\n        self.password_input.fill(password)\n\n    def click_registration_button(self) -> None:\n        self.registration_button.click()\n\n    def check_visible_registration_form(self) -> None:\n        expect(self.email_input).to_be_visible()\n        expect(self.username_input).to_be_visible()\n        expect(self.password_input).to_be_visible()\n        expect(self.registration_button).to_be_visible()\n```\n\nРазберём построчно.\n\n### Наследование\n\n```python\nclass RegistrationPage(BasePage):\n```\n\n`RegistrationPage(BasePage)` означает \"`RegistrationPage` является наследником `BasePage`\". Благодаря этому класс автоматически получает `self.page`, `open()` и `check_current_url()`, разобранные в прошлом уроке, — их не нужно писать заново.\n\n### URL как атрибут класса\n\n```python\nURL = \"https://nikita-filonov.github.io/qa-automation-engineer-ui-course/#/auth/registration\"\n```\n\nАдрес страницы хранится внутри самого класса, а не передаётся снаружи и не живёт в тесте. Если адрес когда-нибудь изменится, исправлять его нужно будет только в одном месте.\n\n### Конструктор и `super().__init__(page)`\n\n```python\ndef __init__(self, page: Page):\n    super().__init__(page)\n```\n\n`super().__init__(page)` вызывает конструктор родительского класса `BasePage`, который мы разобрали в прошлом уроке, — тот самый, что сохраняет `page` в `self.page`. Без этой строки атрибут `self.page` не появится, и все последующие строки конструктора, которые обращаются к `page.locator(...)`, работали бы (потому что `page` доступен как параметр функции), но методы вроде `open_page()`, использующие `self.page` через `BasePage`, — сломались бы.\n\n### Локаторы в конструкторе\n\n```python\nself.email_input = page.locator(\"[data-testid='registration-form-email-input'] input\")\nself.username_input = page.locator(\"[data-testid='registration-form-username-input'] input\")\nself.password_input = page.locator(\"[data-testid='registration-form-password-input'] input\")\nself.registration_button = page.locator(\"[data-testid='registration-page-registration-button']\")\n```\n\nЭто ровно те локаторы, которые мы собрали в таблицу на уроке 4.4. Ключевое архитектурное решение: локаторы создаются один раз, в конструкторе, и сохраняются в атрибуты (`self.email_input` и так далее). Дальше ни один метод класса не пишет CSS-селектор заново — все они используют уже готовые атрибуты. Это даёт три вещи: страницу проще читать, локатор при изменении интерфейса правится только тут, а тесты вообще перестают что-либо знать про CSS-селекторы.\n\n### Метод `open_page`\n\n```python\ndef open_page(self) -> None:\n    super().open(self.URL)\n```\n\nОборачивает метод `open()` из `BasePage`, подставляя в него собственный `self.URL`. Теперь открыть страницу можно одной понятной командой `registration_page.open_page()` — вызывающему коду (тесту) не нужно знать сам адрес.\n\n### Метод `fill_registration_form`\n\n```python\ndef fill_registration_form(self, email: str, username: str, password: str) -> None:\n    self.email_input.fill(email)\n    self.username_input.fill(username)\n    self.password_input.fill(password)\n```\n\nОдин метод вместо трёх отдельных вызовов `.fill()`. Это не техническое ограничение Playwright, а осознанное решение: в нашем сценарии пользователь всегда заполняет форму целиком, поэтому один метод, отражающий это целиком, естественнее, чем `fill_email()`, `fill_username()`, `fill_password()` по отдельности. Такой метод лучше отражает реальное действие пользователя, а не техническую последовательность операций.\n\n### Метод `click_registration_button`\n\n```python\ndef click_registration_button(self) -> None:\n    self.registration_button.click()\n```\n\nОборачивает `.click()` над уже готовым локатором кнопки. Тест теперь может вызвать `registration_page.click_registration_button()`, не зная, что за этим скрывается CSS-локатор.\n\n### Метод `check_visible_registration_form`\n\n```python\ndef check_visible_registration_form(self) -> None:\n    expect(self.email_input).to_be_visible()\n    expect(self.username_input).to_be_visible()\n    expect(self.password_input).to_be_visible()\n    expect(self.registration_button).to_be_visible()\n```\n\nПроверяет, что все основные элементы формы действительно отображаются. Такую проверку удобно вызывать сразу после открытия страницы — если что-то не загрузилось, тест упадёт здесь с понятной ошибкой, а не позже, при попытке заполнить несуществующее поле.\n\n## Пример\n\nСобранный воедино, класс уже умеет всё, что нужно для сценария регистрации: открыть страницу, убедиться, что форма видна, заполнить её и нажать кнопку — четыре понятных вызова без единого CSS-локатора снаружи класса:\n\n```python\nregistration_page.open_page()\nregistration_page.check_visible_registration_form()\nregistration_page.fill_registration_form(email=\"a@b.com\", username=\"user\", password=\"pass123\")\nregistration_page.click_registration_button()\n```\n\n## Частые ошибки\n\n- Забыть вызвать `super().__init__(page)` в конструкторе новой страницы — тогда `self.page` не появится, и любой метод, который на него опирается (в том числе унаследованные из `BasePage`), выдаст `AttributeError`.\n- Создавать локаторы заново внутри каждого метода (`page.locator(...)` прямо в `click_registration_button`), а не один раз в конструкторе — это работает, но нарушает принцип \"локаторы в одном месте\", ради которого и затевался Page Object.\n- Делать один метод, который и заполняет форму, и кликает кнопку, и проверяет результат — такие методы становится сложно переиспользовать по отдельности в разных сценариях (например, для негативного теста нужно заполнить форму, но не проверять успешный переход).\n\n## Мини-задание\n\nНайди в `boilerplate/pages/registration_page.py` строку, отвечающую за проверку видимости кнопки Registration, и объясни (себе или напарнику), почему она использует `expect(self.registration_button)`, а не, например, `expect(page.locator(\"[data-testid='registration-page-registration-button']\"))` заново.\n", "hasPractice": true, "quiz": [{"question": "Почему локаторы в RegistrationPage создаются один раз в конструкторе и сохраняются в атрибуты (self.email_input и т.д.), а не создаются заново внутри каждого метода?", "options": ["Так тест выполняется быстрее, потому что Playwright кэширует локаторы только при таком подходе", "Playwright технически не позволяет создавать локаторы внутри обычных методов класса", "Это обязательное требование pytest-playwright для корректной работы фикстур", "Так локаторы хранятся в одном месте, и при изменении вёрстки их нужно поправить только там"], "correct": 3, "explain": "Централизованное хранение локаторов в конструкторе — ключевая идея Page Object: если разметка страницы изменится, локатор правится в одном месте, а не в каждом методе, где он использовался."}, {"question": "Где хранится адрес страницы регистрации в RegistrationPage?", "options": ["Внутри метода open_page() как аргумент по умолчанию", "В фикстуре conftest.py", "В атрибуте класса URL", "В отдельном файле urls.py"], "correct": 2, "explain": "URL хранится как атрибут класса RegistrationPage — если адрес изменится, исправить его нужно будет только в одном месте."}, {"question": "Почему fill_registration_form() принимает сразу три параметра (email, username, password) и заполняет все поля за один вызов, а не три отдельных метода fill_email()/fill_username()/fill_password()?", "options": ["В сценарии курса пользователь всегда заполняет форму целиком, и один метод лучше отражает это реальное действие", "Три отдельных метода работали бы медленнее", "fill() технически нельзя вызвать больше одного раза в одном тесте", "Playwright не поддерживает несколько маленьких методов в одном классе"], "correct": 0, "explain": "Один метод, отражающий заполнение формы целиком, естественнее описывает реальное действие пользователя, чем три отдельных технических вызова."}, {"question": "Зачем в RegistrationPage вызывается super().__init__(page) перед созданием локаторов?", "options": ["Чтобы выполнить конструктор BasePage и сохранить page в self.page, на который опираются остальные методы", "Чтобы создать фикстуру registration_page", "Чтобы открыть страницу регистрации автоматически", "Это необязательный вызов, добавленный для красоты кода"], "correct": 0, "explain": "Без super().__init__(page) атрибут self.page не появится, и унаследованные из BasePage методы (open, check_current_url) не смогут работать."}, {"question": "Зачем метод check_visible_registration_form() вызывается сразу после открытия страницы, до заполнения формы?", "options": ["Чтобы автоматически создать локаторы полей", "Потому что Playwright требует проверку видимости перед каждым fill()", "Чтобы обнаружить проблему загрузки страницы раньше, с понятной ошибкой, а не при попытке заполнить несуществующее поле", "Чтобы ускорить выполнение теста"], "correct": 2, "explain": "Ранняя проверка видимости формы — это диагностика: если страница загрузится некорректно, тест упадёт сразу с понятной ошибкой, а не позже при попытке взаимодействия с отсутствующим полем."}]}, {"id": "p65", "section": "Модуль 4 · Playwright + POM", "subgroup": "Неделя 10", "isOverview": false, "num": "4.14", "title": "Разбираем DashboardPage построчно", "content": "# 4.14. Разбираем DashboardPage построчно\n\n## Зачем это нужно\n\n`DashboardPage` показывает важную вещь, которую легко упустить: Page Object не обязан быть большим классом со множеством методов. Он должен содержать ровно столько, сколько реально нужно тестам — не больше. Это прямо пригодится в домашнем задании: твой `LoginPage` тоже не должен разрастаться \"про запас\".\n\n## Теория\n\nОткрой `boilerplate/pages/dashboard_page.py` — это всего 19 строк:\n\n```python\nfrom playwright.sync_api import Page, expect\n\nfrom pages.base_page import BasePage\n\n\nclass DashboardPage(BasePage):\n    URL = \"https://nikita-filonov.github.io/qa-automation-engineer-ui-course/#/dashboard\"\n\n    def __init__(self, page: Page):\n        super().__init__(page)\n\n        self.toolbar_title = page.locator(\"[data-testid='dashboard-toolbar-title-text']\")\n\n    def check_opened(self) -> None:\n        self.check_current_url(self.URL)\n\n    def check_visible_toolbar_title(self) -> None:\n        expect(self.toolbar_title).to_be_visible()\n        expect(self.toolbar_title).to_have_text(\"Dashboard\")\n```\n\n### Наследование и URL\n\n```python\nclass DashboardPage(BasePage):\n    URL = \"https://nikita-filonov.github.io/qa-automation-engineer-ui-course/#/dashboard\"\n```\n\nТак же, как в `RegistrationPage`: наследование от `BasePage` и адрес страницы в виде атрибута класса.\n\n### Конструктор и единственный локатор\n\n```python\ndef __init__(self, page: Page):\n    super().__init__(page)\n\n    self.toolbar_title = page.locator(\"[data-testid='dashboard-toolbar-title-text']\")\n```\n\nВ отличие от `RegistrationPage`, тут всего один локатор — заголовок страницы. Заметь: у `DashboardPage` нет метода `open_page()`. Это осознанное решение, а не недосмотр — в нашем сценарии пользователь никогда не открывает Dashboard напрямую по URL, он попадает туда только через клик по кнопке Registration. Метод, который никогда не будет вызван, не добавляется просто \"для полноты\".\n\n### Метод `check_opened`\n\n```python\ndef check_opened(self) -> None:\n    self.check_current_url(self.URL)\n```\n\nЭто самая показательная строка во всём модуле. `DashboardPage` не проверяет URL заново своими силами — он переиспользует `check_current_url()`, унаследованный от `BasePage` (урок 4.12), просто подставляя туда собственный `self.URL`. Никакого дублирования логики проверки URL между страницами нет — она реализована один раз, в базовом классе.\n\nНазвание метода — `check_opened`, а не, скажем, `check_url` — читается как законченное утверждение \"проверить, что страница открыта\". Снаружи тесту не важно, что внутри используется именно проверка URL — он вызывает метод, который отвечает на вопрос по существу.\n\n### Метод `check_visible_toolbar_title`\n\n```python\ndef check_visible_toolbar_title(self) -> None:\n    expect(self.toolbar_title).to_be_visible()\n    expect(self.toolbar_title).to_have_text(\"Dashboard\")\n```\n\nДве отдельные проверки: сначала — что заголовок вообще виден, затем — что в нём правильный текст. Обрати внимание, что `check_opened()` и `check_visible_toolbar_title()` — это два разных метода, а не один общий `check_dashboard_page()`. Это тоже осознанное разделение: одна проверка отвечает на вопрос \"мы на нужной странице?\" (по URL), а другая — на вопрос \"на странице отображается ожидаемое содержимое?\" (по заголовку). Разделение по смыслу делает каждый метод маленьким, понятным и пригодным для переиспользования отдельно от другого — например, где-то в другом сценарии может понадобиться проверить только переход, без проверки заголовка.\n\n## Пример\n\nВ тесте эти два метода читаются как два последовательных, но разных по смыслу утверждения:\n\n```python\ndashboard_page.check_opened()\ndashboard_page.check_visible_toolbar_title()\n```\n\nПервая строка: \"мы попали туда, куда нужно\". Вторая строка: \"и там отображается то, что ожидалось\". Тест не знает ни про URL, ни про локатор заголовка, ни про то, что `check_opened()` внутри себя вызывает метод из `BasePage`, — вся эта механика скрыта внутри `DashboardPage`.\n\n## Частые ошибки\n\n- Добавлять в `DashboardPage` метод `open_page()` \"по аналогии с RegistrationPage\" — если в реальных сценариях страница никогда не открывается напрямую, такой метод не нужен: лишний код без применения так же вредит читаемости, как и его нехватка.\n- Сливать `check_opened()` и `check_visible_toolbar_title()` в один метод — это будет работать, но лишит тест возможности использовать одну проверку без другой и усложнит диагностику, если тест упадёт (непонятно сразу, что именно не выполнилось: переход или отрисовка).\n- Писать `expect(page.locator(\"[data-testid='dashboard-toolbar-title-text']\"))` заново внутри `check_visible_toolbar_title()`, вместо использования готового `self.toolbar_title` из конструктора.\n\n## Мини-задание\n\nСравни объём кода `RegistrationPage` (урок 4.13) и `DashboardPage` (этот урок). `DashboardPage` заметно меньше — попробуй сформулировать своими словами, почему это нормально и не является признаком \"недоделанного\" Page Object.\n", "hasPractice": true, "quiz": [{"question": "Почему в DashboardPage нет метода open_page(), в отличие от RegistrationPage?", "options": ["Потому что открытие страницы по URL в Playwright вообще невозможно", "Потому что метод open() отсутствует в самом BasePage", "Потому что в сценарии курса пользователь никогда не открывает Dashboard напрямую по URL — он попадает туда только после регистрации", "Потому что DashboardPage не наследуется от BasePage"], "correct": 2, "explain": "Page Object должен содержать только то, что реально используется в сценариях: раз Dashboard в курсе открывается только через переход после регистрации, отдельный метод open_page() ему не нужен."}, {"question": "Какой метод из BasePage переиспользует check_opened() в DashboardPage?", "options": ["__init__()", "check_current_url()", "goto()", "open()"], "correct": 1, "explain": "check_opened() вызывает self.check_current_url(self.URL) — готовую проверку из BasePage, не дублируя логику проверки URL заново."}, {"question": "Почему проверки check_opened() и check_visible_toolbar_title() разделены на два отдельных метода, а не объединены в один check_dashboard_page()?", "options": ["Разделение отражает два разных смысла: переход на нужную страницу и содержимое страницы, что упрощает диагностику при падении теста", "pytest требует минимум два метода проверки на каждый Page Object", "Это ускоряет выполнение проверок", "Playwright технически запрещает объединять несколько expect() в одном методе"], "correct": 0, "explain": "Одна проверка отвечает на вопрос «мы на нужной странице?», другая — «отображается ли ожидаемое содержимое?»; разделение по смыслу упрощает чтение и диагностику."}, {"question": "Сколько локаторов хранится в конструкторе DashboardPage в рамках сценария этого курса?", "options": ["Четыре, включая URL", "Три — по одному на каждый пункт меню", "Один — локатор заголовка toolbar_title", "Ни одного"], "correct": 2, "explain": "DashboardPage используется в курсе только для финальной проверки, поэтому в конструкторе достаточно одного локатора — заголовка страницы."}, {"question": "Что находится в атрибуте класса URL в DashboardPage?", "options": ["Имя фикстуры, создающей объект страницы", "Адрес страницы Dashboard", "Текст, который должен отображаться в заголовке", "Локатор заголовка страницы"], "correct": 1, "explain": "URL — атрибут класса, хранящий адрес страницы Dashboard; он используется методом check_opened() для проверки перехода."}]}, {"id": "p66", "section": "Модуль 4 · Playwright + POM", "subgroup": "Неделя 10", "isOverview": false, "num": "4.15", "title": "Фикстуры для Page Object в conftest.py", "content": "# 4.15. Фикстуры для Page Object в conftest.py\n\n## Зачем это нужно\n\nУ нас уже есть `RegistrationPage` и `DashboardPage`, но если создавать их прямо внутри теста, в тест вернётся техническая подготовка, от которой мы как раз пытались избавиться в уроке 4.11. Фикстуры pytest (модуль 1) и Page Object (уроки 4.12–4.14) вместе закрывают эту проблему — и именно так организован `boilerplate/conftest.py`.\n\n## Теория\n\n### Проблема: создание объектов страниц внутри теста\n\nЕсли бы мы использовали `RegistrationPage` и `DashboardPage` \"в лоб\", тест выглядел бы так:\n\n```python\n@pytest.mark.ui\ndef test_successful_registration(page: Page, user_data: dict[str, str]):\n    registration_page = RegistrationPage(page)\n    dashboard_page = DashboardPage(page)\n\n    registration_page.open_page()\n    ...\n```\n\nКод рабочий, но первые две строки — не действие пользователя и не проверка, а чисто техническая подготовка объектов. Чем больше таких строк накапливается в начале каждого теста, тем сильнее тест отвлекается от описания сценария.\n\n### Решение: фикстуры возвращают готовые объекты страниц\n\nВ модуле 1 мы уже создавали фикстуры, возвращающие данные:\n\n```python\n@pytest.fixture\ndef user_data() -> dict[str, str]:\n    return {...}\n```\n\nТочно так же фикстура может возвращать не данные, а готовый объект класса. В `boilerplate/conftest.py` это выглядит так:\n\n```python\n@pytest.fixture\ndef registration_page(page: Page) -> RegistrationPage:\n    return RegistrationPage(page)\n\n\n@pytest.fixture\ndef dashboard_page(page: Page) -> DashboardPage:\n    return DashboardPage(page)\n```\n\nРазберём сигнатуру `def registration_page(page: Page) -> RegistrationPage`. Параметр `page` — это не наш объект, а встроенная фикстура из плагина `pytest-playwright` (мы пользовались ей ещё в уроке 4.6, просто не через фикстуру, а через ручной запуск `sync_playwright()`). Когда pytest видит, что тесту нужна фикстура `registration_page`, он сначала подготавливает фикстуру `page`, от которой она зависит, и только потом передаёт результат внутрь. Это одна из сильных сторон pytest — **фикстуры могут зависеть друг от друга**, образуя цепочку:\n\n```\npytest-playwright → page → registration_page → RegistrationPage(page)\n```\n\n### Как эти фикстуры используются в тесте\n\nТест из `boilerplate/tests/ui/test_registration.py` получает готовые объекты страниц прямо через параметры функции:\n\n```python\ndef test_successful_registration(\n        self,\n        user_data: dict[str, str],\n        registration_page: RegistrationPage,\n        dashboard_page: DashboardPage,\n):\n```\n\nОбрати внимание: в параметрах теста нет `page` — тест вообще не запрашивает \"сырой\" объект Playwright, потому что вся работа с ним уже упакована внутрь `RegistrationPage` и `DashboardPage`.\n\n### Зачем нужны аннотации типов\n\n```python\nregistration_page: RegistrationPage\n```\n\nНа поиск фикстуры pytest это не влияет — фикстуры ищутся по имени (`registration_page`), а не по типу. Аннотация нужна для IDE: автодополнение методов, подсказки параметров, переход к определению класса. На небольшом проекте это не критично, но при росте кодовой базы такие подсказки экономят много времени — особенно когда Page Object'ов становится десяток и больше.\n\n### Почему фикстура лучше создания объекта в тесте\n\nСравним ещё раз. Было:\n\n```python\nregistration_page = RegistrationPage(page)\ndashboard_page = DashboardPage(page)\n```\n\nСтало:\n\n```python\ndef test_successful_registration(\n        registration_page: RegistrationPage,\n        dashboard_page: DashboardPage,\n):\n```\n\nВо втором варианте тест описывает только сценарий — подготовка объектов спрятана в `conftest.py`, где ей и место. Это тот же принцип, что мы применили к локаторам в уроках 4.12–4.14: техническая деталь вынесена туда, где она нужна один раз, а не туда, где её приходится видеть постоянно.\n\n## Пример\n\nОткрой `boilerplate/conftest.py` целиком — там всего три фикстуры, относящиеся к модулю 4 (плюс отдельно фикстуры для модуля 3 и allure-хук для модуля 5, их пока игнорируй):\n\n```python\n@pytest.fixture\ndef user_data() -> dict[str, str]:\n    return {\n        \"email\": get_random_email(),\n        \"username\": get_random_username(),\n        \"password\": get_random_password(),\n    }\n\n\n@pytest.fixture\ndef registration_page(page: Page) -> RegistrationPage:\n    return RegistrationPage(page)\n\n\n@pytest.fixture\ndef dashboard_page(page: Page) -> DashboardPage:\n    return DashboardPage(page)\n```\n\nИменно к этому файлу ты будешь добавлять фикстуру для своего `LoginPage` в домашнем задании — рядом с уже существующими, а не вместо них.\n\n## Частые ошибки\n\n- Создавать объект страницы внутри тестовой функции \"для простоты\", вместо того чтобы вынести это в фикстуру — работать будет, но это возвращает проблему, которую мы решали в этом уроке.\n- Добавлять фикстуре побочные действия сверх создания объекта (например, сразу вызывать `open_page()` внутри фикстуры) — фикстура `registration_page` в `boilerplate/` только создаёт объект, а открытие страницы остаётся явным действием внутри теста, потому что это часть сценария, а не подготовки.\n- Забывать аннотацию возвращаемого типа у фикстуры — код будет работать и без неё, но IDE перестанет подсказывать методы объекта там, где фикстура используется.\n\n## Мини-задание\n\nОткрой `boilerplate/conftest.py` и найди фикстуру `user_data`. Определи, зависит ли она от фикстуры `page` так же, как `registration_page` и `dashboard_page`, или устроена независимо. Обоснуй разницу тем, что именно возвращает каждая из фикстур.\n", "hasPractice": true, "quiz": [{"question": "От какой фикстуры зависит фикстура registration_page в conftest.py boilerplate?", "options": ["От фикстуры dashboard_page", "От фикстуры user_data", "От фикстуры page, предоставляемой плагином pytest-playwright", "Ни от какой — она создаёт объект RegistrationPage без каких-либо параметров"], "correct": 2, "explain": "Сигнатура def registration_page(page: Page) -> RegistrationPage показывает, что фикстура запрашивает встроенную фикстуру page от pytest-playwright и на её основе создаёт объект страницы."}, {"question": "На основании чего pytest находит нужную фикстуру для параметра теста, например registration_page: RegistrationPage?", "options": ["По порядку объявления фикстур в conftest.py", "По типу параметра (RegistrationPage)", "По алфавитному порядку имён классов", "По имени параметра (registration_page)"], "correct": 3, "explain": "pytest ищет фикстуры по имени параметра, а не по аннотации типа — аннотация нужна только для подсказок IDE."}, {"question": "Зачем нужны аннотации типов, например registration_page: RegistrationPage, в параметрах теста, если pytest их не использует для поиска фикстуры?", "options": ["Они дают IDE возможность подсказывать методы объекта и упрощают навигацию по коду", "Они ускоряют выполнение теста", "Они автоматически создают документацию Allure", "Они обязательны технически, без них тест не запустится"], "correct": 0, "explain": "Аннотации типов не влияют на работу pytest, но дают IDE автодополнение, подсказки параметров и переход к определению класса."}, {"question": "Что возвращает фикстура dashboard_page в conftest.py boilerplate?", "options": ["Словарь user_data", "Объект DashboardPage", "Объект RegistrationPage", "Ничего, только выполняет побочные действия"], "correct": 1, "explain": "Фикстура dashboard_page создаёт и возвращает объект DashboardPage(page), готовый к использованию в тесте."}, {"question": "Какую проблему решает перенос создания объектов страниц (RegistrationPage(page), DashboardPage(page)) из теста в фикстуры?", "options": ["Убирает из теста техническую подготовку объектов, оставляя только описание сценария", "Автоматически генерирует locators на основе фикстур", "Ускоряет запуск браузера", "Позволяет запускать тесты без установки Playwright"], "correct": 0, "explain": "Когда объекты страниц создаются в фикстурах, тест перестаёт содержать техническую подготовку и описывает только сам сценарий."}]}, {"id": "p67", "section": "Модуль 4 · Playwright + POM", "subgroup": "Неделя 10", "isOverview": false, "num": "4.16", "title": "Добавляем новый Page Object: шаблон на примере LoginPage", "content": "# 4.16. Добавляем новый Page Object: шаблон на примере LoginPage\n\n## Зачем это нужно\n\nЭто последний теоретический урок модуля — и он же самый практический. Дальше домашнее задание попросит тебя сделать ровно то, что мы сейчас разберём: добавить в `boilerplate/pages/` новый Page Object по образцу уже существующих. Здесь мы соберём этот процесс в пошаговый чек-лист на примере `LoginPage` для страницы логина учебного приложения.\n\n## Теория\n\nУ учебного приложения есть страница логина по адресу `.../#/auth/login`. Через DevTools на ней найдены такие `data-testid`:\n\n| Элемент | `data-testid` | Особенность |\n|---|---|---|\n| Поле Email | `login-form-email-input` | на внешнем `div`, `input` вложен внутрь — как в `RegistrationPage` |\n| Поле Password | `login-form-password-input` | так же, `input` вложен внутрь |\n| Кнопка LOGIN | `login-page-login-button` | стоит прямо на `<button>` |\n| Ссылка \"Registration\" | `login-page-registration-link` | стоит прямо на `<a>` |\n\nСтруктура полностью повторяет то, что мы разбирали в уроках 4.3–4.4 для формы регистрации: и `login-form-email-input`, и `login-form-password-input` — это контейнеры, а не сами поля ввода, поэтому в локаторе нужно добавлять `input`. У кнопки и ссылки `data-testid` стоит прямо на элементе, поэтому без уточнения.\n\n### Шаг 1. Создать файл рядом с существующими\n\n```\nboilerplate/pages/login_page.py\n```\n\nНе в отдельной папке, не с другим именованием — рядом с `base_page.py`, `registration_page.py`, `dashboard_page.py`, в том же стиле именования (`snake_case`, суффикс `_page`).\n\n### Шаг 2. Импорты и наследование\n\n```python\nfrom playwright.sync_api import Page, expect\n\nfrom pages.base_page import BasePage\n\n\nclass LoginPage(BasePage):\n    URL = \"https://nikita-filonov.github.io/qa-automation-engineer-ui-course/#/auth/login\"\n```\n\nТот же набор импортов, что у `RegistrationPage` и `DashboardPage`: `Page` для аннотации типа, `expect` для проверок, `BasePage` для наследования. `URL` — атрибут класса, как и в остальных страницах.\n\n### Шаг 3. Конструктор с `super().__init__` и локаторами\n\n```python\n    def __init__(self, page: Page):\n        super().__init__(page)\n\n        self.email_input = page.locator(\"[data-testid='login-form-email-input'] input\")\n        self.password_input = page.locator(\"[data-testid='login-form-password-input'] input\")\n        self.login_button = page.locator(\"[data-testid='login-page-login-button']\")\n```\n\nОбязательный первый вызов — `super().__init__(page)`, иначе `self.page` не появится (урок 4.12). Дальше — локаторы, по одному на каждый нужный элемент, сохранённые в атрибуты, а не пересоздаваемые внутри методов (урок 4.13).\n\n### Шаг 4. Метод открытия страницы\n\n```python\n    def open_page(self) -> None:\n        super().open(self.URL)\n```\n\nВ отличие от `DashboardPage`, здесь метод открытия нужен: пользователь может зайти на страницу логина напрямую.\n\n### Шаг 5. Действия пользователя\n\n```python\n    def fill_login_form(self, email: str, password: str) -> None:\n        self.email_input.fill(email)\n        self.password_input.fill(password)\n\n    def click_login_button(self) -> None:\n        self.login_button.click()\n```\n\nОдин метод на осмысленное действие пользователя — заполнение формы целиком, отдельно клик по кнопке. Так же, как в `RegistrationPage.fill_registration_form()`.\n\n### Шаг 6. Проверки\n\n```python\n    def check_visible_login_form(self) -> None:\n        expect(self.email_input).to_be_visible()\n        expect(self.password_input).to_be_visible()\n        expect(self.login_button).to_be_visible()\n```\n\nПроверка отображения формы — по тому же шаблону, что `check_visible_registration_form()`.\n\n### Итоговый файл\n\n```python\nfrom playwright.sync_api import Page, expect\n\nfrom pages.base_page import BasePage\n\n\nclass LoginPage(BasePage):\n    URL = \"https://nikita-filonov.github.io/qa-automation-engineer-ui-course/#/auth/login\"\n\n    def __init__(self, page: Page):\n        super().__init__(page)\n\n        self.email_input = page.locator(\"[data-testid='login-form-email-input'] input\")\n        self.password_input = page.locator(\"[data-testid='login-form-password-input'] input\")\n        self.login_button = page.locator(\"[data-testid='login-page-login-button']\")\n\n    def open_page(self) -> None:\n        super().open(self.URL)\n\n    def fill_login_form(self, email: str, password: str) -> None:\n        self.email_input.fill(email)\n        self.password_input.fill(password)\n\n    def click_login_button(self) -> None:\n        self.login_button.click()\n\n    def check_visible_login_form(self) -> None:\n        expect(self.email_input).to_be_visible()\n        expect(self.password_input).to_be_visible()\n        expect(self.login_button).to_be_visible()\n```\n\n### Шаг 7. Фикстура в conftest.py\n\nПо образцу урока 4.15, в `boilerplate/conftest.py` добавляется фикстура рядом с уже существующими — не вместо них:\n\n```python\nfrom pages.login_page import LoginPage\n\n\n@pytest.fixture\ndef login_page(page: Page) -> LoginPage:\n    return LoginPage(page)\n```\n\n### Шаг 8. Использование в тесте\n\n```python\n@pytest.mark.ui\ndef test_login_with_valid_credentials(login_page: LoginPage, dashboard_page: DashboardPage):\n    login_page.open_page()\n    login_page.check_visible_login_form()\n    login_page.fill_login_form(email=\"user@example.com\", password=\"password123\")\n    login_page.click_login_button()\n\n    dashboard_page.check_opened()\n```\n\nТест снова не содержит ни одного `page.locator(...)` и ни одного URL — вся техническая часть спрятана внутри `LoginPage` и `DashboardPage`.\n\n## Пример\n\nПолный чек-лист, по которому добавляется любой новый Page Object в этом проекте:\n\n1. Новый файл в `pages/`, имя в `snake_case` с суффиксом `_page`.\n2. Класс наследуется от `BasePage`.\n3. `URL` как атрибут класса (если у страницы есть собственный адрес).\n4. Конструктор начинается с `super().__init__(page)`.\n5. Локаторы создаются один раз в конструкторе и сохраняются в `self.*`.\n6. Один метод — одно осмысленное действие пользователя.\n7. Проверки — отдельными методами, разделёнными по смыслу (переход vs содержимое, как в `DashboardPage`).\n8. Фикстура в `conftest.py`, добавленная рядом с существующими.\n9. Тест использует только методы Page Object, ни одного `page.locator(...)` напрямую.\n\n## Частые ошибки\n\n- Копировать `RegistrationPage` целиком и просто менять названия переменных, не проверив реальные `data-testid` новой страницы через DevTools — на других страницах приложения атрибуты могут называться иначе.\n- Забыть добавить фикстуру в `conftest.py` и создавать `LoginPage(page)` прямо в тесте — это откат к проблеме, которую мы решали в уроке 4.15.\n- Помещать новый файл не в `pages/`, а рядом с тестами или в корень проекта — ломает структуру, которую видят и используют все остальные участники общего репозитория.\n\n## Мини-задание\n\nПрежде чем переходить к домашнему заданию, самостоятельно (без копирования из этого урока) допиши в свой черновик `LoginPage` метод `check_opened`, аналогичный `DashboardPage.check_opened()` из урока 4.14 — с использованием `check_current_url()` из `BasePage`.\n", "hasPractice": true, "quiz": [{"question": "Согласно шаблону добавления нового Page Object, куда нужно добавить фикстуру для новой страницы, например LoginPage?", "options": ["В conftest.py, рядом с уже существующими фикстурами registration_page и dashboard_page", "Внутрь тестовой функции, которая использует эту страницу", "В сам файл login_page.py, рядом с классом LoginPage", "В отдельный новый файл fixtures.py, специально созданный для новой страницы"], "correct": 0, "explain": "Фикстуры для Page Object в этом проекте живут в conftest.py — новую фикстуру login_page нужно добавить туда же, рядом с уже существующими registration_page и dashboard_page, а не заводить для неё отдельное место."}, {"question": "Какое имя файла соответствует стилю именования Page Object в этом проекте для страницы логина?", "options": ["Login-Page.py", "LoginPageObject.py", "login_page.py", "pageLogin.py"], "correct": 2, "explain": "Файлы страниц в pages/ именуются в snake_case с суффиксом _page — например, base_page.py, registration_page.py, login_page.py."}, {"question": "Почему локатор поля email на странице логина тоже требует уточнения input в конце, как и в форме регистрации?", "options": ["Потому что data-testid у поля стоит на внешнем контейнере, а сам тег input вложен внутрь — та же структура, что и в RegistrationPage", "Потому что это требование самого Playwright для всех текстовых полей", "Потому что поле email на странице логина скрыто по умолчанию", "Потому что так короче писать код"], "correct": 0, "explain": "На странице логина используется та же структура разметки, что и на регистрации: data-testid стоит на контейнере, а не на самом input, поэтому нужен доп. поиск input внутри."}, {"question": "Что должно быть первой строкой внутри конструктора любого нового Page Object, наследующего BasePage?", "options": ["Создание первого локатора", "Импорт expect", "Открытие страницы через open_page()", "super().__init__(page)"], "correct": 3, "explain": "super().__init__(page) должен вызываться первым, чтобы сохранить self.page ещё до того, как конструктор начнёт создавать локаторы через page.locator(...)."}, {"question": "Какое из перечисленных требований к готовому Page Object указано в чек-листе урока?", "options": ["Тест должен содержать хотя бы один прямой вызов page.locator(...) для надёжности", "Тест должен использовать только методы Page Object, без единого page.locator(...) напрямую", "Фикстуру нужно создавать в самом файле страницы, а не в conftest.py", "Все локаторы страницы должны создаваться внутри каждого метода заново"], "correct": 1, "explain": "Чек-лист явно требует, чтобы тест не содержал ни одного page.locator(...) напрямую — вся работа с локаторами должна быть скрыта внутри методов Page Object."}]}, {"id": "p68", "section": "Модуль 4 · Playwright + POM", "subgroup": "Неделя 10", "isOverview": false, "num": "4.17", "title": "Домашнее задание", "content": "# 4.17. Домашнее задание\n\n## Формулировка\n\nОткрой PR в свой форк общего репозитория (`boilerplate/`) с 2–3 новыми UI-тестами на Playwright. Тесты должны работать через Page Object по образцу `RegistrationPage`/`DashboardPage` (уроки 4.12–4.14), а не через голые вызовы `page.locator(...)` внутри теста.\n\nМинимальный набор изменений:\n\n1. **Добавь новый Page Object.** Проще всего — `LoginPage` для страницы `.../#/auth/login`, по шаблону из урока 4.16. Класс должен наследоваться от `BasePage`, хранить `URL`, создавать локаторы в конструкторе через `super().__init__(page)` и содержать отдельные методы-действия (`open_page`, `fill_login_form`, `click_login_button`) и метод-проверку (`check_visible_login_form`).\n2. **Добавь фикстуру `login_page`** в `boilerplate/conftest.py`, рядом с уже существующими `registration_page`/`dashboard_page`, по образцу урока 4.15.\n3. **Напиши 2–3 UI-теста** в `tests/ui/` (можно новый файл `test_login.py`, можно дополнить `test_registration.py` — смотри по смыслу сценария). Как минимум один тест должен быть happy path, как минимум один — негативный сценарий.\n\n### Из чего выбрать сценарии\n\nНиже — варианты, поведение которых мы заранее проверили вручную на реальном приложении, чтобы домашнее задание не строилось на догадках о том, как оно себя ведёт.\n\n**Happy path: логин после регистрации.** У приложения нет заранее созданных тестовых пользователей — единственный способ получить рабочие email/пароль для логина — сначала зарегистрироваться. Сценарий: зарегистрировать нового пользователя через `registration_page` (как в `test_registration.py`), разлогиниться, затем залогиниться этими же данными через `login_page` и проверить, что снова открылся Dashboard.\n\n**Негативный сценарий №1: регистрация с уже занятым email.** Если отправить форму регистрации с email, который уже зарегистрирован, приложение **не переходит на Dashboard** — URL остаётся `.../#/auth/registration`, а над формой появляется предупреждение с текстом `User already exists` (у него есть собственный `data-testid=\"registration-page-user-already-exists-alert\"` — найдёшь его в DevTools так же, как в уроке 4.2). Тест: зарегистрировать пользователя один раз, затем повторить регистрацию с тем же email (и любым другим username) и проверить, что появилось это предупреждение, а URL не изменился.\n\n**Негативный сценарий №2: валидация пустой формы.** Если открыть страницу регистрации и ничего не заполнять, кнопка `Registration` находится в заблокированном состоянии (атрибут `disabled`). Тест: открыть страницу регистрации и проверить через `expect(registration_button).to_be_disabled()`, что кнопка неактивна, пока форма не заполнена (это же можно проверить и для `LoginPage`, если её кнопка ведёт себя аналогично — проверь вручную перед тем, как писать тест).\n\nВыбери любые 2–3 сценария из перечисленных (или похожие по духу) — необязательно реализовывать все три.\n\n### Allure\n\nВ существующих тестах (`test_registration.py`) уже используются `@allure.epic`, `@allure.feature`, `@allure.title` на уровне класса/теста и `allure.step(...)` внутри теста. Подробно Allure разберём в модуле 5, но декоратор и шаги уже нужны в этом домашнем задании — bери `test_registration.py` как образец оформления, не изобретая новый стиль.\n\n## Критерии \"готово\"\n\n- [ ] Новый Page Object (например, `LoginPage`) добавлен в `pages/`, наследуется от `BasePage` по образцу `RegistrationPage`/`DashboardPage` — не переизобретает архитектуру заново.\n- [ ] Локаторы созданы один раз в конструкторе и сохранены в атрибуты `self.*`, а не пересоздаются внутри методов.\n- [ ] Фикстура для нового Page Object добавлена в `conftest.py` рядом с существующими (`registration_page`, `dashboard_page`).\n- [ ] Есть минимум 2 новых UI-теста, среди них — минимум один явно негативный сценарий (не только happy path).\n- [ ] Все тесты используют `@pytest.mark.ui` и `allure.step(...)` внутри теста (по образцу `test_registration.py`).\n- [ ] Ни один тест не содержит `page.locator(...)` напрямую — только вызовы методов Page Object.\n- [ ] `pytest -m ui -v` проходит локально зелёным целиком, включая уже существовавший до тебя `test_registration.py`.\n- [ ] PR открыт в общий репозиторий, в описании — что сделано и как проверить (см. правила PR в `boilerplate/README.md`).\n\n## Что не входит в это домашнее задание\n\n- Подробная работа с Allure-отчётами (вложения, категории, окружение) — это модуль 5. Здесь достаточно декораторов и шагов на уровне, который уже есть в `test_registration.py`.\n- CI — модуль 6. Проверяй тесты локально, зелёный пайплайн для этого PR пока не обязателен.\n- Попапы и нативные диалоги браузера (урок 4.9) — в текущих сценариях учебного приложения их нет, специально их встраивать в домашнее задание не нужно.\n", "hasPractice": false}, {"id": "p69", "section": "Модуль 4 · Playwright + POM", "subgroup": "Неделя 8", "isOverview": false, "num": "4.1", "title": "HTML и DOM: как устроена веб-страница", "content": "# 4.1. HTML и DOM: как устроена веб-страница\n\n## Зачем это нужно\n\nЧерез несколько уроков ты начнёшь писать код, который открывает страницу, находит на ней поле `Email` и вводит туда текст. Чтобы код мог найти это поле, он должен понимать страницу не так, как её понимает человек (\"вижу поле сверху слева\"), а так, как её понимает браузер — как структуру элементов. Без этого понимания локаторы в следующих уроках будут выглядеть как магические заклинания, а не как логичные конструкции.\n\n## Теория\n\n**HTML** — язык разметки, который описывает, из каких элементов состоит страница. Он не отвечает за поведение теста, только за структуру: где кнопка, где поле ввода, где текст.\n\nУпрощённая форма регистрации в HTML:\n\n```html\n<form>\n    <input type=\"email\" name=\"email\" />\n    <input type=\"text\" name=\"username\" />\n    <input type=\"password\" name=\"password\" />\n    <button>Registration<\/button>\n<\/form>\n```\n\nЗдесь `<form>` — это форма, `<input>` — поле ввода, `<button>` — кнопка. У каждого тега могут быть **атрибуты** — дополнительная информация об элементе:\n\n```html\n<input type=\"email\" name=\"email\" placeholder=\"Email\" />\n```\n\n`type=\"email\"` говорит, что поле для email, `name=\"email\"` отличает это поле от других. Атрибуты — это то, за что в первую очередь будут цепляться наши локаторы.\n\nМы не изучаем вёрстку и не разбираем все теги HTML — для автоматизации достаточно узнавать в разметке несколько повторяющихся вещей: поля форм (`input`, `textarea`, `select`), кнопки (`button`), ссылки (`a`), тексты и заголовки (`p`, `span`, `h1`–`h6`), контейнеры (`div`, `section`) и специальные тестовые атрибуты.\n\n**DOM (Document Object Model)** — это внутренняя модель страницы, которую браузер строит на основе HTML. DOM представляет страницу как дерево объектов: каждый элемент HTML становится узлом этого дерева, с которым можно работать программно — искать, читать текст, кликать, вводить данные.\n\nНаша форма в виде дерева:\n\n```\nform\n├── input type=\"email\" name=\"email\"\n├── input type=\"text\" name=\"username\"\n├── input type=\"password\" name=\"password\"\n└── button \"Registration\"\n```\n\nКогда мы пишем:\n\n```python\npage.locator(\"input[name='email']\").fill(\"user@example.com\")\n```\n\nмы не говорим браузеру \"найди красивое поле слева сверху\". Мы даём точное техническое указание: \"найди в DOM элемент `input`, у которого атрибут `name` равен `email`, и введи в него текст\". Playwright всегда работает именно с DOM-деревом, а не с картинкой на экране.\n\n### Атрибуты, которые важны для автотестов\n\n- `id` — уникальный идентификатор, хорош, если не сгенерирован автоматически (`id=\"mui-12345\"` — плохой пример).\n- `name` — часто встречается у полей форм, хорошо подходит для локаторов.\n- `class` — обычно про стили, часто автогенерируется сборщиками (`class=\"css-1a2b3c\"`) и не годится для стабильных тестов.\n- `data-testid` (и его варианты `data-test-id`, `data-qa`, `qa-id`) — атрибут, который разработчики добавляют специально для автотестов. Не влияет на вёрстку и обычно не меняется при рефакторинге — лучший кандидат для локатора.\n- `role`, `aria-*` — атрибуты доступности, тоже пригодны для поиска элементов.\n\n## Пример\n\nТри поля формы регистрации выглядят в HTML почти одинаково — все они `input` — но у каждого свой набор атрибутов:\n\n```html\n<input type=\"email\" name=\"email\" />\n<input type=\"text\" name=\"username\" />\n<input type=\"password\" name=\"password\" />\n```\n\nИменно атрибуты позволяют тесту отличить одно поле от другого, хотя тег `input` у них общий.\n\n## Частые ошибки\n\n- Пытаться выучить все теги HTML и правила вёрстки — для автотестов это лишнее, нужен только практический минимум для поиска элементов.\n- Путать тег (`<button>`) и элемент целиком (`<button>Registration<\/button>`) — на практике разница не критична, но полезно понимать оба термина.\n- Строить локаторы по автогенерированным `class` или `id`, не проверив, стабильны ли они между запусками.\n\n## Мини-задание\n\nОткрой любую веб-страницу (например, github.com), нажми правой кнопкой мыши на любую кнопку и выбери \"Просмотреть код\" / \"Inspect\". Найди в открывшемся HTML: тег элемента, хотя бы два его атрибута и текст внутри тега. Не ищи ничего в DevTools специально — просто зафиксируй, что видишь.\n", "hasPractice": true, "quiz": [{"question": "Какой атрибут HTML-элемента считается наиболее стабильным для построения локатора в автотестах?", "options": ["data-testid", "автоматически сгенерированный id (например, id=\"mui-12345\")", "style", "class"], "correct": 0, "explain": "data-testid добавляется разработчиками специально для автотестов, не влияет на вёрстку и обычно не меняется при рефакторинге стилей или структуры страницы."}, {"question": "Что такое DOM?", "options": ["Библиотека для запуска UI-автотестов", "Внутренняя модель страницы, которую браузер строит на основе HTML", "Формат хранения настроек pytest", "Отдельный язык программирования для браузера"], "correct": 1, "explain": "DOM (Document Object Model) — это дерево объектов, которое браузер строит на основе HTML-разметки; именно с этим деревом работает Playwright."}, {"question": "На странице есть несколько полей <input> с разными атрибутами. Как автотест отличает одно поле от другого?", "options": ["По атрибутам элемента (например, name или data-testid)", "По размеру шрифта текста внутри поля", "Playwright сам угадывает нужное поле по контексту теста", "По порядку появления в CSS-файле"], "correct": 0, "explain": "Тег input у всех полей может быть одинаковым, но именно атрибуты (name, type, data-testid) позволяют однозначно отличить одно поле от другого."}, {"question": "Почему атрибут class часто не подходит для построения стабильного локатора?", "options": ["class нельзя использовать в CSS-селекторах", "Playwright игнорирует атрибут class при поиске элементов", "class обычно отвечает за стили и может быть автогенерирован сборщиком (например, class=\"css-1a2b3c\")", "У элемента не может быть больше одного класса одновременно"], "correct": 2, "explain": "Классы часто генерируются автоматически сборщиками фронтенда и меняются при обновлении проекта, из-за чего локаторы на их основе легко ломаются."}, {"question": "Как правильнее всего описать то, с чем работает Playwright, когда выполняет page.locator(...).click()?", "options": ["С историей действий пользователя в браузере", "С визуальным изображением страницы, как это делает человек", "С файлом HTML на сервере, до его загрузки в браузер", "С деревом элементов DOM, находя нужный узел по описанию"], "correct": 3, "explain": "Playwright всегда работает с DOM-деревом страницы, а не с картинкой на экране — именно поэтому важно понимать структуру HTML и DOM."}]}, {"id": "p70", "section": "Модуль 4 · Playwright + POM", "subgroup": "Неделя 8", "isOverview": false, "num": "4.2", "title": "DevTools: смотрим на страницу глазами браузера", "content": "# 4.2. DevTools: смотрим на страницу глазами браузера\n\n## Зачем это нужно\n\nПеред тем как писать локаторы, их нужно откуда-то взять. В реальной работе QA automation engineer не угадывает локаторы и не гуглит их — он открывает страницу, смотрит на её HTML-структуру через инструменты разработчика и сам решает, по какому атрибуту искать элемент. Это один из самых частых действий в повседневной работе, и его стоит довести до автоматизма.\n\n## Теория\n\n**DevTools** (Developer Tools) — встроенный набор инструментов браузера. Он есть в Chrome, Edge, Brave, Opera, Firefox — во всех современных браузерах, устроен похоже. Мы будем использовать DevTools в первую очередь для поиска элементов и построения локаторов, хотя инструмент умеет намного больше: смотреть сетевые запросы, ошибки JavaScript, стили CSS.\n\n### Как открыть DevTools\n\n- Клавиша **F12**.\n- Горячие клавиши: `Ctrl + Shift + I` (Windows/Linux), `Cmd + Option + I` (macOS).\n- Через контекстное меню: клик правой кнопкой по элементу страницы → **Inspect** (или **Просмотреть код**). Этот способ удобнее всего, когда нужно быстро найти конкретный элемент — DevTools сразу откроется на нужном месте дерева.\n\n### Вкладка Elements\n\nПосле открытия DevTools переходи на вкладку **Elements** — там показано DOM-дерево страницы, то есть та самая структура, о которой шла речь в прошлом уроке. Дерево может выглядеть громоздким — это нормально, не нужно понимать в нём каждую строку. Достаточно уметь находить нужные элементы и читать их атрибуты.\n\nПолезная функция DevTools — подсветка при наведении: если навести курсор на узел в дереве, браузер подсветит соответствующий элемент на странице, и наоборот — клик правой кнопкой по элементу на странице и выбор Inspect откроет DevTools ровно на этом узле.\n\n### Автоматический селектор — не панацея\n\nDevTools умеет копировать готовый селектор элемента (клик правой кнопкой по узлу в дереве → **Copy** → **Copy selector** / **Copy XPath**). Это полезно для быстрого исследования страницы, но браузер не знает, какой из атрибутов элемента стабилен, а какой сгенерирован автоматически — поэтому такие селекторы часто получаются длинными, привязанными к структуре вёрстки и хрупкими. В следующем уроке разберём, как выбирать локатор осознанно, а не копировать первое, что предложил браузер.\n\n## Пример\n\nОткрой страницу регистрации учебного приложения: `https://nikita-filonov.github.io/qa-automation-engineer-ui-course/#/auth/registration`.\n\n1. Открой DevTools (F12).\n2. Перейди на вкладку Elements.\n3. Кликни правой кнопкой по полю Email на странице → Inspect.\n4. Посмотри, какие атрибуты видны у элемента и у его родителя — обрати внимание на `data-testid`, `type`, `name`.\n\nПовтори то же самое для поля Password и кнопки Registration.\n\n## Частые ошибки\n\n- Пытаться прочитать и понять весь HTML-документ целиком вместо того, чтобы искать конкретный элемент через Inspect.\n- Слепо копировать `Copy selector` из DevTools в тест, не проверив, не завязан ли он на автогенерированный класс или порядковый номер `div`.\n- Искать элемент во вкладке **Elements**, забыв, что там отображается текущее состояние DOM, которое может отличаться от исходного HTML-файла (JS мог изменить страницу после загрузки).\n\n## Мини-задание\n\nНа странице регистрации учебного приложения (`.../#/auth/registration`) через Inspect найди все три поля формы (Email, Username, Password) и кнопку Registration. Для каждого элемента выпиши в блокнот (или заметку), какой атрибут выглядит наиболее стабильным для локатора — пока не пиши сам локатор, просто определи атрибут-кандидат.\n", "hasPractice": true, "quiz": [{"question": "Почему локатор, скопированный через DevTools (Copy selector), часто оказывается плохим выбором для автотеста?", "options": ["Playwright не поддерживает локаторы, скопированные из DevTools", "Copy selector работает только в Firefox", "DevTools не умеет копировать локаторы для кнопок", "Такой локатор часто завязан на структуру вёрстки или автогенерированные классы и легко ломается при её изменении"], "correct": 3, "explain": "Браузер не знает, какой атрибут элемента стабилен, поэтому автоматически предложенный селектор часто получается длинным и привязанным к порядку div'ов или сгенерированным классам."}, {"question": "Какая вкладка DevTools показывает DOM-дерево страницы и используется автоматизатором для поиска элементов?", "options": ["Network", "Console", "Sources", "Elements"], "correct": 3, "explain": "Вкладка Elements отображает HTML-разметку и DOM-дерево страницы — именно там ищут элементы и их атрибуты для построения локаторов."}, {"question": "Что происходит, если навести курсор на узел в дереве DOM во вкладке Elements?", "options": ["Соответствующий элемент подсвечивается на странице", "Открывается редактор кода страницы", "Запускается автотест на этом элементе", "Элемент автоматически удаляется со страницы"], "correct": 0, "explain": "DevTools подсвечивает на странице элемент, соответствующий узлу, на который наведён курсор в дереве — это удобно для быстрой ориентации в разметке."}, {"question": "Какой способ позволяет быстро открыть DevTools сразу на нужном элементе страницы?", "options": ["Кликнуть правой кнопкой по элементу и выбрать Inspect (\"Просмотреть код\")", "Обновить страницу с зажатым Shift", "Открыть вкладку Network и найти элемент там", "Нажать F5 несколько раз подряд"], "correct": 0, "explain": "Клик правой кнопкой по элементу на странице и выбор Inspect сразу открывает DevTools на нужном узле дерева — это самый быстрый способ найти конкретный элемент."}, {"question": "Какая комбинация клавиш открывает DevTools на Windows/Linux?", "options": ["Ctrl + Shift + I", "Alt + F4", "Cmd + Option + I", "Ctrl + P"], "correct": 0, "explain": "На Windows/Linux DevTools открывается по Ctrl+Shift+I (на macOS — Cmd+Option+I), либо просто клавишей F12 в большинстве браузеров."}]}, {"id": "p71", "section": "Модуль 4 · Playwright + POM", "subgroup": "Неделя 8", "isOverview": false, "num": "4.3", "title": "CSS-локаторы", "content": "# 4.3. CSS-локаторы\n\n## Зачем это нужно\n\nВся UI-автоматизация сводится к двум действиям: найти элемент и что-то с ним сделать (кликнуть, ввести текст, проверить состояние). Про \"что-то сделать\" мы поговорим на неделе 9. Сейчас — про \"найти элемент\", и это самый важный навык UI Automation Engineer, потому что без него ни одно действие и ни одна проверка не сработают.\n\n## Теория\n\n**Локатор** — это описание элемента, по которому Playwright находит его на странице. Можно представить локатор как адрес: как человек ищет дом по адресу, так Playwright ищет элемент по локатору.\n\n```python\npage.locator(\"[data-testid='registration-page-registration-button']\")\n```\n\nЭта строка означает: \"найди элемент, у которого атрибут `data-testid` равен `registration-page-registration-button`\". После того как элемент найден, с ним можно работать:\n\n```python\npage.locator(\"[data-testid='registration-page-registration-button']\").click()\n```\n\nОдин из самых распространённых способов описывать локаторы — **CSS-локаторы** (CSS-селекторы). Не пугайся слова CSS: нам не нужно изучать CSS как язык стилизации, нужен только его синтаксис поиска элементов по тегу, атрибутам, классам, `id` и вложенности.\n\n### Простейшие CSS-локаторы\n\nПоиск по тегу — находит все элементы этого тега сразу:\n\n```python\npage.locator(\"input\")   # все поля ввода\npage.locator(\"button\")  # все кнопки\n```\n\nНа практике такие локаторы почти не используются — на странице обычно несколько кнопок и полей, а тесту нужен конкретный элемент.\n\nПоиск по атрибуту — намного полезнее:\n\n```python\npage.locator(\"input[name='email']\")\n```\n\nЧитается как: \"найди тег `input`, у которого атрибут `name` равен `email`\".\n\nМожно вообще не указывать тег:\n\n```python\npage.locator(\"[data-testid='email-input']\")\n```\n\nЭто значит: \"найди любой элемент с атрибутом `data-testid='email-input'`\". Такая запись — один из самых частых видов локаторов в реальных проектах.\n\n### Поиск вложенных элементов\n\nИногда нужный элемент находится внутри другого. Например, в React-приложениях (и в нашем учебном приложении тоже) `data-testid` часто ставят на внешний контейнер, а не на сам `input`:\n\n```html\n<div data-testid=\"registration-form-email-input\">\n    <input type=\"text\">\n<\/div>\n```\n\nЧтобы получить именно `<input>`, а не внешний `<div>`, между двумя частями локатора ставится пробел:\n\n```python\npage.locator(\"[data-testid='registration-form-email-input'] input\")\n```\n\nПробел означает \"внутри\". Читается так: \"найди элемент с этим `data-testid`, а внутри него — тег `input`\".\n\n### Какие атрибуты выбирать, а какие — нет\n\nХорошие кандидаты для локатора:\n\n- **`data-testid`** — лучший вариант. Добавляется специально для автотестов, не влияет на вёрстку, обычно не меняется при рефакторинге.\n- **`id`**, если он осмысленный и стабильный (`id=\"registration-button\"`, а не `id=\"mui-12345\"`).\n- **`name`** — часто встречается в формах: `input[name=\"email\"]`.\n\nПлохие кандидаты:\n\n- Автогенерированные классы: `class=\"css-1ruewdp\"`.\n- Автогенерированные `id`: `id=\"mui-12345\"`, `id=\":rd:\"` (в нашем учебном приложении поля формы как раз используют такие динамические `id` — поэтому мы их не используем).\n- Длинные цепочки вложенности: `div > div > div > button` или `.MuiContainer-root .MuiGrid2-root .MuiButton-root` — любое изменение вёрстки их ломает.\n\nКроме CSS существуют и **XPath-локаторы** — другой популярный синтаксис (например, поиск по тексту `//button[text()=\"Registration\"]`). В этом курсе мы сознательно остаёмся на CSS-локаторах и `data-testid`: для нашего учебного приложения этого достаточно, а локаторы получаются короче и понятнее. Если продолжишь развиваться в UI-автоматизации, с XPath ты обязательно познакомишься отдельно.\n\n## Пример\n\nДля страницы регистрации нашего учебного приложения локаторы полей строятся с уточнением `input`, потому что `data-testid` стоит на контейнере:\n\n```python\npage.locator(\"[data-testid='registration-form-email-input'] input\")\npage.locator(\"[data-testid='registration-form-username-input'] input\")\npage.locator(\"[data-testid='registration-form-password-input'] input\")\n```\n\nА для кнопки регистрации `data-testid` стоит прямо на `<button>`, поэтому уточнение не нужно:\n\n```python\npage.locator(\"[data-testid='registration-page-registration-button']\")\n```\n\nИменно эти локаторы позже войдут в `RegistrationPage` (`boilerplate/pages/registration_page.py`) — можешь свериться, они совпадают дословно.\n\n## Частые ошибки\n\n- Забыть пробел перед `input`, когда `data-testid` стоит на внешнем контейнере — локатор не найдёт элемент или найдёт не тот.\n- Строить локатор по классу, не проверив в DevTools, не сгенерирован ли он автоматически.\n- Использовать слишком общий локатор (`page.locator(\"button\")`) там, где на странице несколько кнопок — Playwright either найдёт \"не ту\" кнопку, либо, если используется `expect()`, сообщит об ошибке из-за нескольких совпадений.\n\n## Мини-задание\n\nОткрой страницу Dashboard учебного приложения (`.../#/dashboard`) в DevTools и найди заголовок `Dashboard`. Определи, на каком именно теге стоит атрибут `data-testid`, и напиши CSS-локатор для этого заголовка самостоятельно, не подглядывая в следующий урок.\n", "hasPractice": true, "quiz": [{"question": "Что означает пробел в CSS-локаторе [data-testid='registration-form-email-input'] input?", "options": ["Нужно найти элемент, соседний с указанным data-testid", "Нужно найти тег input внутри элемента с этим data-testid", "Локатор содержит синтаксическую ошибку", "Нужно искать элемент, у которого одновременно два указанных атрибута"], "correct": 1, "explain": "Пробел в CSS-локаторе означает поиск вложенного элемента: сначала находится контейнер с этим data-testid, а затем внутри него — тег input."}, {"question": "Что такое локатор в контексте Playwright?", "options": ["Скорость загрузки страницы в браузере", "Название теста в pytest", "Часть CSS-файла, отвечающая за отступы элемента", "Описание элемента, по которому Playwright находит его на странице"], "correct": 3, "explain": "Локатор — это способ описать элемент так, чтобы Playwright мог однозначно найти его на странице, аналог адреса дома для человека."}, {"question": "Почему локатор вида page.locator(\"button\") на практике используется редко?", "options": ["На странице обычно несколько кнопок, и такой локатор слишком общий, чтобы найти нужную", "Playwright не поддерживает поиск по тегу", "Такой локатор работает только в Firefox", "Тег button всегда содержит ошибку разметки"], "correct": 0, "explain": "Поиск по одному тегу находит сразу все совпадающие элементы страницы; для конкретного элемента нужен более точный локатор, обычно по атрибуту."}, {"question": "Почему локатор вида div > div > div > button считается плохим?", "options": ["Такой локатор всегда находит больше одного элемента", "Playwright не умеет кликать по элементам, вложенным глубже двух уровней", "Он жёстко зависит от структуры вёрстки и легко ломается при её изменении", "Символ > запрещён в CSS-локаторах Playwright"], "correct": 2, "explain": "Любое изменение вёрстки (новый div, изменённый порядок блоков) может сломать такой локатор — он завязан на структуру, а не на смысл элемента."}, {"question": "Какой синтаксис курс использует в качестве основного способа локаторов, сознательно оставляя XPath за рамками?", "options": ["XPath-локаторы", "Поиск по цвету элемента", "Поиск по координатам на экране", "CSS-локаторы и атрибут data-testid"], "correct": 3, "explain": "Для учебного приложения курса достаточно CSS-локаторов на основе data-testid — они короче и понятнее, чем XPath, хотя XPath тоже существует и поддерживается Playwright."}]}, {"id": "p72", "section": "Модуль 4 · Playwright + POM", "subgroup": "Неделя 8", "isOverview": false, "num": "4.4", "title": "Локаторы учебного приложения", "content": "# 4.4. Локаторы учебного приложения\n\n## Зачем это нужно\n\nПрежде чем на неделе 9 писать первый код на Playwright, полезно заранее знать все локаторы, которые понадобятся для сценария регистрации. Это стандартная практика: перед автоматизацией сценария сначала вручную (глазами и через DevTools) проходишь его шаги и выписываешь локаторы, а уже потом садишься писать код.\n\n## Теория\n\nНаш первый сценарий — регистрация нового пользователя:\n\n1. Открыть страницу регистрации.\n2. Заполнить Email.\n3. Заполнить Username.\n4. Заполнить Password.\n5. Нажать кнопку Registration.\n6. Дождаться перехода на Dashboard.\n7. Убедиться, что регистрация прошла успешно.\n\nДля этого нам нужно уметь находить: поле Email, поле Username, поле Password, кнопку Registration, а после перехода — заголовок страницы Dashboard.\n\n### Поля формы регистрации\n\nУ всех трёх полей одна и та же особенность: `data-testid` стоит не на самом `<input>`, а на его внешнем контейнере:\n\n```html\n<div data-testid=\"registration-form-email-input\">\n    ...\n<\/div>\n```\n\nПоэтому локатор всегда состоит из двух частей — контейнер и вложенный `input`:\n\n```python\npage.locator(\"[data-testid='registration-form-email-input'] input\")\npage.locator(\"[data-testid='registration-form-username-input'] input\")\npage.locator(\"[data-testid='registration-form-password-input'] input\")\n```\n\n### Кнопка Registration\n\nЗдесь `data-testid` расположен прямо на `<button>`, поэтому дополнительный `input` не нужен:\n\n```python\npage.locator(\"[data-testid='registration-page-registration-button']\")\n```\n\n### Заголовок Dashboard\n\nПосле успешной регистрации приложение перенаправляет на `.../#/dashboard`. Убедиться, что это действительно произошло, можно двумя способами: проверить URL и проверить заголовок страницы. Заголовок в HTML выглядит так:\n\n```html\n<h6 data-testid=\"dashboard-toolbar-title-text\">\n    Dashboard\n<\/h6>\n```\n\nЛокатор:\n\n```python\npage.locator(\"[data-testid='dashboard-toolbar-title-text']\")\n```\n\n### Почему именно `data-testid`\n\nУ элементов есть множество атрибутов — `class`, `id`, `type`, `role`, `aria-*`. Технически можно построить локатор почти по любому из них. Но в нашем приложении разработчики специально подготовили `data-testid` для каждого важного элемента — это самый стабильный вариант, и именно на него мы будем опираться на протяжении всего курса. Такой подход широко распространён и в реальных проектах.\n\n## Пример\n\nСводная таблица локаторов, с которыми мы будем работать в следующих уроках:\n\n| Элемент | Локатор |\n|---|---|\n| Email | `[data-testid='registration-form-email-input'] input` |\n| Username | `[data-testid='registration-form-username-input'] input` |\n| Password | `[data-testid='registration-form-password-input'] input` |\n| Кнопка Registration | `[data-testid='registration-page-registration-button']` |\n| Заголовок Dashboard | `[data-testid='dashboard-toolbar-title-text']` |\n\nДержи эту таблицу под рукой — именно эти локаторы уже используются в готовых `RegistrationPage` и `DashboardPage` в `boilerplate/pages/`, и на неделе 10 мы разберём их построчно.\n\n## Частые ошибки\n\n- Пропустить `input` в локаторе поля формы, потому что визуально контейнер и поле выглядят как один элемент.\n- Спутать локатор заголовка Dashboard с локатором самой кнопки Registration — легко перепутать, если не смотреть в DevTools, а копировать по памяти.\n- Проверять только URL после регистрации и не проверять, что страница реально отрисовалась (заголовок виден) — если приложение \"зависло\" на пустом экране, проверка URL всё равно пройдёт.\n\n## Мини-задание\n\nОткрой учебное приложение и вручную (мышкой) пройди весь сценарий: заполни форму регистрации любыми данными и нажми Registration. После перехода на Dashboard через DevTools убедись, что локатор `[data-testid='dashboard-toolbar-title-text']` из таблицы выше действительно указывает на видимый заголовок \"Dashboard\".\n", "hasPractice": true, "quiz": [{"question": "Почему локатор кнопки [data-testid='registration-page-registration-button'] не требует добавления input в конце, в отличие от локаторов полей формы?", "options": ["Потому что у кнопки нет атрибута data-testid", "Потому что кнопки в этом приложении вообще не нужно искать точно", "Потому что Playwright автоматически ищет кнопки без уточнения тега", "Потому что data-testid у кнопки стоит прямо на теге <button>, а не на внешнем контейнере"], "correct": 3, "explain": "У полей формы data-testid расположен на внешнем div-контейнере, поэтому нужен дополнительный поиск input внутри него; у кнопки data-testid стоит прямо на элементе <button>, уточнение не требуется."}, {"question": "Сколько полей нужно заполнить в сценарии регистрации нашего учебного приложения?", "options": ["Два (email и password)", "Одно (только email)", "Три (email, username, password)", "Четыре, включая подтверждение пароля"], "correct": 2, "explain": "Сценарий регистрации предполагает заполнение трёх полей: Email, Username и Password, после чего нажимается кнопка Registration."}, {"question": "Какой локатор используется в этом курсе для проверки того, что после регистрации открылась страница Dashboard?", "options": ["h1.dashboard-title", "[data-testid='registration-success-message']", "[data-testid='dashboard-page-link']", "[data-testid='dashboard-toolbar-title-text']"], "correct": 3, "explain": "Заголовок страницы Dashboard находится по локатору [data-testid='dashboard-toolbar-title-text'] — это h6-элемент с текстом Dashboard."}, {"question": "Локатор поля Username выглядит как [data-testid='registration-form-username-input'] input. Почему в конце добавлен input?", "options": ["Потому что так требует синтаксис Playwright для всех локаторов", "Потому что data-testid стоит на внешнем контейнере, а не на самом теге input", "Потому что это XPath-выражение, а не CSS", "Потому что поле Username всегда пустое при загрузке страницы"], "correct": 1, "explain": "У полей формы регистрации data-testid размещён на внешнем div, а реальный <input> находится внутри него, поэтому локатор состоит из двух частей."}, {"question": "Какие два признака вместе подтверждают, что после регистрации открылась именно страница Dashboard?", "options": ["Количество элементов в DOM и время загрузки", "Название вкладки браузера и favicon", "URL страницы и видимый заголовок Dashboard", "Цвет фона страницы и размер шрифта"], "correct": 2, "explain": "Проверка URL подтверждает переход на нужный маршрут, а проверка видимого заголовка Dashboard подтверждает, что страница действительно отрисовалась — вместе они дают более уверенный результат."}]}, {"id": "p73", "section": "Модуль 4 · Playwright + POM", "subgroup": "Неделя 8", "isOverview": false, "num": "4.5", "title": "Что такое Playwright и зачем он нужен", "content": "# 4.5. Что такое Playwright и зачем он нужен\n\n## За
