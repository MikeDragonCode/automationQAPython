  // ---------- playground: Pyodide-powered code exercise ----------
  var PY_RUNNER_SRC = [
    "import json, io, contextlib",
    "",
    "def __run_checks(student_code, tests_code):",
    "    ns = {}",
    "    out = io.StringIO()",
    "    result = {'compileError': None, 'stdout': '', 'tests': []}",
    "    try:",
    "        with contextlib.redirect_stdout(out):",
    "            exec(student_code, ns)",
    "    except Exception as e:",
    "        result['compileError'] = type(e).__name__ + ': ' + str(e)",
    "        result['stdout'] = out.getvalue()",
    "        return json.dumps(result)",
    "    try:",
    "        exec(tests_code, ns)",
    "    except Exception as e:",
    "        result['compileError'] = 'Ошибка в проверочном коде: ' + type(e).__name__ + ': ' + str(e)",
    "        result['stdout'] = out.getvalue()",
    "        return json.dumps(result)",
    "    names = sorted(k for k, v in ns.items() if k.startswith('test_') and callable(v))",
    "    for name in names:",
    "        try:",
    "            with contextlib.redirect_stdout(out):",
    "                ns[name]()",
    "            result['tests'].append({'name': name, 'passed': True, 'message': ''})",
    "        except AssertionError as e:",
    "            result['tests'].append({'name': name, 'passed': False, 'message': str(e) or 'Условие не выполнено'})",
    "        except Exception as e:",
    "            result['tests'].append({'name': name, 'passed': False, 'message': type(e).__name__ + ': ' + str(e)})",
    "    result['stdout'] = out.getvalue()",
    "    return json.dumps(result)"
  ].join("\n");

  var pyodidePromise = null;
  function ensurePyodide(onStatus){
    if(pyodidePromise) return pyodidePromise;
    pyodidePromise = new Promise(function(resolve, reject){
      if(onStatus) onStatus('Загружаю Python в браузере (Pyodide)… обычно 10-20 секунд в первый раз.');
      var script = document.createElement('script');
      script.src = 'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js';
      script.onload = function(){
        loadPyodide().then(function(pyodide){
          pyodide.runPython(PY_RUNNER_SRC);
          resolve(pyodide);
        }).catch(reject);
      };
      script.onerror = function(){ reject(new Error('не удалось загрузить Pyodide с CDN')); };
      document.head.appendChild(script);
    });
    return pyodidePromise;
  }

  function buildPlayground(page, onAllPass){
    var ex = page.exercise;
    var box = document.createElement('div');
    box.className = 'pg';

    var storeKey = 'qa-course-code-' + page.id;
    var savedCode = null;
    try{ savedCode = localStorage.getItem(storeKey); }catch(e){}

    var editorId = 'pg-editor-' + page.id + '-' + Math.random().toString(36).slice(2, 7);
    box.innerHTML =
      '<p class="pg-prompt">'+escapeHtml(ex.prompt)+'</p>' +
      '<div class="pg-editor" id="'+editorId+'"></div>' +
      '<div class="pg-toolbar">' +
        '<button type="button" class="btn" id="pg-run">▶ Запустить</button>' +
        '<button type="button" class="btn" id="pg-reset">Сбросить код</button>' +
        '<span class="pg-status" id="pg-status"></span>' +
      '</div>' +
      '<div class="pg-output" id="pg-output"></div>';

    var cm = CodeMirror(box.querySelector('#'+editorId), {
      value: savedCode || ex.starter,
      mode: 'python',
      lineNumbers: true,
      indentUnit: 4,
      tabSize: 4,
      indentWithTabs: false,
      viewportMargin: Infinity,
      extraKeys: { Tab: function(cmInst){ cmInst.replaceSelection('    '); } }
    });
    cm.on('change', function(){
      try{ localStorage.setItem(storeKey, cm.getValue()); }catch(e){}
    });
    box._cm = cm;

    var runBtn = box.querySelector('#pg-run');
    var resetBtn = box.querySelector('#pg-reset');
    var statusEl = box.querySelector('#pg-status');
    var outputEl = box.querySelector('#pg-output');

    resetBtn.addEventListener('click', function(){
      cm.setValue(ex.starter);
      try{ localStorage.removeItem(storeKey); }catch(e){}
      outputEl.innerHTML = '';
      statusEl.textContent = '';
    });

    function renderResult(result){
      if(result.compileError){
        outputEl.innerHTML = '<div class="gate-feedback bad">'+escapeHtml(result.compileError)+'</div>' +
          (result.stdout ? '<div class="pg-stdout">'+escapeHtml(result.stdout)+'</div>' : '');
        return;
      }
      if(!result.tests.length){
        outputEl.innerHTML = '<div class="gate-feedback bad">Не найдено ни одной проверки в этом упражнении.</div>';
        return;
      }
      var passedCount = result.tests.filter(function(t){ return t.passed; }).length;
      var allPassed = passedCount === result.tests.length;
      var rows = result.tests.map(function(t){
        return '<div class="pg-test-row '+(t.passed?'pass':'fail')+'">' +
          '<span class="pg-test-mark">'+(t.passed?'✓':'✗')+'</span>' +
          '<span><div>'+escapeHtml(t.name)+'</div>' +
          (t.passed ? '' : '<div class="pg-test-msg">'+escapeHtml(t.message)+'</div>') +
          '</span></div>';
      }).join('');
      outputEl.innerHTML = rows +
        (result.stdout ? '<div class="pg-stdout">'+escapeHtml(result.stdout)+'</div>' : '') +
        '<p class="pg-summary '+(allPassed?'ok':'bad')+'">'+passedCount+' / '+result.tests.length+' проверок пройдено'+(allPassed?' — отлично!':'')+'</p>';
      if(allPassed) onAllPass();
    }

    runBtn.addEventListener('click', function(){
      runBtn.disabled = true;
      outputEl.innerHTML = '';
      statusEl.textContent = 'Запускаю…';
      ensurePyodide(function(msg){ statusEl.textContent = msg; }).then(function(pyodide){
        statusEl.textContent = 'Выполняю код…';
        var code = cm.getValue();
        pyodide.globals.set('__student_code', code);
        pyodide.globals.set('__tests_code', ex.tests);
        var resultJson;
        try{
          resultJson = pyodide.runPython('__run_checks(__student_code, __tests_code)');
        }catch(e){
          statusEl.textContent = '';
          outputEl.innerHTML = '<div class="gate-feedback bad">Внутренняя ошибка запуска: '+escapeHtml(String(e))+'</div>';
          runBtn.disabled = false;
          return;
        }
        statusEl.textContent = '';
        renderResult(JSON.parse(resultJson));
        runBtn.disabled = false;
      }).catch(function(e){
        statusEl.textContent = '';
        outputEl.innerHTML = '<div class="gate-feedback bad">Не получилось загрузить Python в браузере: '+escapeHtml(String(e))+'. Проверь интернет-соединение и попробуй ещё раз.</div>';
        runBtn.disabled = false;
      });
    });

    return box;
  }

  // ---------- gate: mini-task self-check + sequential quiz questions ----------
  function buildGate(page){
    var quiz = page.quiz; // array of {question, options, correct, explain} or undefined
    var exercise = page.exercise; // {prompt, starter, tests} or undefined
    if(!quiz && !page.hasPractice && !exercise) return null;

    var wrap = document.createElement('div');
    wrap.className = 'gate';

    if(isDone(page.id)){
      wrap.innerHTML =
        '<p class="gate-title">✓ Проверка урока</p>' +
        '<p class="gate-done">'+(exercise?'Код-задание':'Мини-задание')+' и тест ('+(quiz?quiz.length:0)+(quiz?' вопр.':'')+') пройдены</p>' +
        '<div class="gate-done-actions">' +
        (exercise ? '<button type="button" class="btn gate-check-btn" id="gate-pg-reopen">Открыть код ещё раз</button>' : '') +
        (quiz ? '<button type="button" class="btn gate-check-btn" id="gate-review-btn">Показать вопросы ещё раз</button>' : '') +
        '<button type="button" class="btn gate-check-btn gate-retake" id="gate-retake">↻ Пройти урок заново</button>' +
        '</div>' +
        (exercise ? '<div id="gate-pg-reopen-box" hidden></div>' : '') +
        (quiz ? '<div id="gate-review" hidden></div>' : '');

      wrap.querySelector('#gate-retake').addEventListener('click', function(){
        setDone(page.id, false);
        navigate(page.id);
      });

      if(exercise){
        var reopenBtn = wrap.querySelector('#gate-pg-reopen');
        var reopenBox = wrap.querySelector('#gate-pg-reopen-box');
        reopenBtn.addEventListener('click', function(){
          reopenBox.hidden = !reopenBox.hidden;
          if(!reopenBox.hidden && !reopenBox.dataset.filled){
            reopenBox.dataset.filled = '1';
            reopenBox.style.marginTop = '14px';
            var pgBox = buildPlayground(page, function(){});
            reopenBox.appendChild(pgBox);
            pgBox._cm.refresh();
          }
        });
      }
      if(quiz){
        var reviewBtn = wrap.querySelector('#gate-review-btn');
        var reviewBox = wrap.querySelector('#gate-review');
        reviewBtn.addEventListener('click', function(){
          reviewBox.hidden = !reviewBox.hidden;
          if(!reviewBox.hidden && !reviewBox.dataset.filled){
            reviewBox.dataset.filled = '1';
            reviewBox.style.marginTop = '14px';
            reviewBox.innerHTML = quiz.map(function(q, qi){
              return '<div class="gate-row"><p class="gate-q">'+(qi+1)+'. '+escapeHtml(q.question)+'</p>' +
                '<div class="gate-options">' + q.options.map(function(opt, i){
                  return '<div class="gate-option disabled'+(i===q.correct?' correct':'')+'">'+escapeHtml(opt)+'</div>';
                }).join('') + '</div>' +
                '<div class="gate-feedback ok">'+escapeHtml(q.explain)+'</div></div>';
            }).join('');
          }
        });
      }
      return wrap;
    }

    var practiceChecked = !page.hasPractice && !exercise;
    var quizPassed = !quiz;
    var qIndex = 0;

    var html = '<p class="gate-title">Проверка урока</p>';
    if(exercise){
      html += '<div class="gate-row" id="gate-exercise-row"></div>';
    } else if(page.hasPractice){
      html += '<div class="gate-row"><label class="gate-check"><input type="checkbox" id="gate-practice"> Я выполнил(а) мини-задание из этого урока</label></div>';
    }
    if(quiz){
      html += '<div class="gate-row" id="gate-quiz-row"></div>';
    }
    html += '<p class="gate-hint">Следующий урок откроется, когда ' +
      (exercise && quiz ? 'код проходит все проверки и все вопросы решены верно.' :
       exercise ? 'код проходит все проверки.' :
       page.hasPractice && quiz ? 'чекбокс отмечен и все вопросы решены верно.' : quiz ? 'все вопросы решены верно.' : 'чекбокс отмечен.') +
      '</p>';
    wrap.innerHTML = html;

    function tryComplete(){
      if(practiceChecked && quizPassed){
        setDone(page.id, true);
        navigate(page.id);
      }
    }

    if(exercise){
      var exBox = buildPlayground(page, function(){
        practiceChecked = true;
        tryComplete();
      });
      wrap.querySelector('#gate-exercise-row').appendChild(exBox);
      wrap._cm = exBox._cm;
    } else if(page.hasPractice){
      wrap.querySelector('#gate-practice').addEventListener('change', function(ev){
        practiceChecked = ev.target.checked;
        tryComplete();
      });
    }

    if(quiz){
      var quizRow = wrap.querySelector('#gate-quiz-row');

      function renderQuestion(){
        var q = quiz[qIndex];
        var picked = null;
        quizRow.innerHTML =
          '<p class="gate-progress mono">Вопрос '+(qIndex+1)+' из '+quiz.length+'</p>' +
          '<p class="gate-q">'+escapeHtml(q.question)+'</p>' +
          '<div class="gate-options" id="gate-options">' +
          q.options.map(function(opt, i){
            return '<label class="gate-option" data-i="'+i+'"><input type="radio" name="gate-quiz-'+qIndex+'"> <span>'+escapeHtml(opt)+'</span></label>';
          }).join('') +
          '</div>' +
          '<div id="gate-feedback"></div>' +
          '<button type="button" class="btn gate-check-btn" id="gate-check-btn">Проверить ответ</button>';

        var optionsEl = quizRow.querySelector('#gate-options');
        var feedbackEl = quizRow.querySelector('#gate-feedback');
        var checkBtn = quizRow.querySelector('#gate-check-btn');

        optionsEl.querySelectorAll('.gate-option').forEach(function(optEl){
          optEl.addEventListener('click', function(){
            picked = parseInt(optEl.dataset.i, 10);
            optionsEl.querySelectorAll('.gate-option').forEach(function(o){ o.classList.remove('picked'); });
            optEl.classList.add('picked');
            optEl.querySelector('input').checked = true;
          });
        });

        checkBtn.addEventListener('click', function(){
          if(picked === null){
            feedbackEl.innerHTML = '<div class="gate-feedback bad">Выбери один из вариантов.</div>';
            return;
          }
          if(picked === q.correct){
            optionsEl.querySelectorAll('.gate-option').forEach(function(o){
              o.classList.add('disabled');
              if(parseInt(o.dataset.i, 10) === q.correct) o.classList.add('correct');
            });
            checkBtn.disabled = true;
            var isLast = qIndex === quiz.length - 1;
            feedbackEl.innerHTML = '<div class="gate-feedback ok">Верно! '+escapeHtml(q.explain)+'</div>';
            if(isLast){
              quizPassed = true;
              tryComplete();
            } else {
              var nextBtn = document.createElement('button');
              nextBtn.type = 'button';
              nextBtn.className = 'btn gate-check-btn';
              nextBtn.style.marginTop = '10px';
              nextBtn.textContent = 'Следующий вопрос →';
              nextBtn.addEventListener('click', function(){ qIndex++; renderQuestion(); });
              quizRow.appendChild(nextBtn);
            }
          } else {
            feedbackEl.innerHTML = '<div class="gate-feedback bad">Неверно, попробуй ещё раз.</div>';
          }
        });
      }

      renderQuestion();
    }

    return wrap;
  }

  function renderPager(){
    var idx = PAGES.findIndex(function(p){ return p.id === currentId; });
    var prev = idx > 0 ? PAGES[idx-1] : null;

      var nb = document.createElement('button');

        nb.disabled = true;
        nb.innerHTML = '<span class="dir">Заблокировано</span><span class="ttl">Сначала пройди этот урок</span>';
      } else {
        nb.innerHTML = '<span class="dir">Далее →</span><span class="ttl">'+escapeHtml(next.title)+'</span>';
        nb.addEventListener('click', function(){ navigate(next.id); });
      }
      pagerEl.appendChild(nb);
    } else {
      var sp2 = document.createElement('div'); sp2.className='pager-spacer'; pagerEl.appendChild(sp2);
    }
  }

  renderProgress();

  // ---------- search ----------
  var searchInput = document.getElementById('search');
  searchInput.addEventListener('input', function(){
    var q = searchInput.value.trim().toLowerCase();
    navEl.querySelectorAll('.nav-item').forEach(function(item){
      var match = !q || item.dataset.search.indexOf(q) !== -1;
      item.hidden = !match;
    });
    navEl.querySelectorAll('.nav-section').forEach(function(section){
      var visible = section.querySelectorAll('.nav-item:not([hidden])').length > 0;
      section.hidden = q && !visible;
      if(q && visible) section.open = true;
    });
    navEl.querySelectorAll('.nav-subgroup-label').forEach(function(lbl){
      var next = lbl.nextElementSibling;
      var any = false;
      while(next && next.classList && next.classList.contains('nav-item')){
        if(!next.hidden) any = true;
        next = next.nextElementSibling;
      }
      lbl.hidden = q && !any;
    });
  });

  // ---------- mobile nav ----------
  var sidebar = document.getElementById('sidebar');
  var scrim = document.getElementById('scrim');
  document.getElementById('menu-btn').addEventListener('click', function(){
    sidebar.classList.add('open'); scrim.classList.add('show');
  });
  function closeMobileNav(){
    sidebar.classList.remove('open'); scrim.classList.remove('show');
  }
  scrim.addEventListener('click', closeMobileNav);

  // ---------- browser back/forward ----------
  window.addEventListener('popstate', function(){
    var id = location.hash.slice(1);
    if(id && byId[id]) navigate(id, {fromHash:true});
  });

  // ---------- initial page ----------
  var startId = location.hash.slice(1);
  if(!startId || !byId[startId]) startId = AUTH.lastId;
  if(!startId || !byId[startId]) startId = PAGES[0].id;
  try{ history.replaceState({id:startId}, '', '#'+startId); }catch(e){}
  navigate(startId, {fromHash:true});

  // ---------- logout ----------
  document.getElementById('logout-btn').addEventListener('click', function(){
    AUTH.signOut();
  });
  if(AUTH.badgeText){
    document.getElementById('user-badge').textContent = AUTH.badgeText;
  }
  })();
}

// =================== auth bootstrap + teacher dashboard ===================
// Отдельно от initReader: логин, подгрузка прогресса из своего /api (Vercel
// Functions + Neon) и роль (student -> обычный ридер, teacher -> дашборд
// ниже) решаются один раз, до того как основной ридер вообще инициализируется.

var LEGACY_STORE_KEY = 'qa-course-reader-progress-v1';
var LEGACY_LAST_KEY = 'qa-course-reader-last-v1';

function readLegacyLocalProgress(){
  try{
    var raw = localStorage.getItem(LEGACY_STORE_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function readLegacyLast(){
  try{ return localStorage.getItem(LEGACY_LAST_KEY); }catch(e){ return null; }
}
function clearLegacyLocal(){
  try{
    localStorage.removeItem(LEGACY_STORE_KEY);
    localStorage.removeItem(LEGACY_LAST_KEY);
  }catch(e){}
}

function escapeHtmlTD(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function showAuthGate(message){
  document.getElementById('auth-gate').hidden = false;
  var errEl = document.getElementById('auth-error');
  if(message){
    errEl.textContent = message;
    errEl.hidden = false;
  } else {
    errEl.hidden = true;
  }
}
function hideAuthGate(){
  document.getElementById('auth-gate').hidden = true;
}

function signOut(){
  api('/auth/logout', {method:'POST'}).catch(function(){}).then(function(){ location.reload(); });
}

function buildAuthState(me){
  return api('/progress').then(function(progressRes){
    var progressMap = {};
    (progressRes.lessonIds || []).forEach(function(id){ progressMap[id] = true; });
    return {
      displayName: me.displayName,
      role: me.role,
      lastLessonId: me.lastLessonId,
      progressMap: progressMap
    };
  });
}

// Перенос локального прогресса (с прошлой, безаккаунтной версии ридера) в БД
// при самом первом входе — чтобы не терять то, что уже было пройдено локально.
function migrateLegacyIfNeeded(state){
  if(Object.keys(state.progressMap).length > 0) return state;
  var legacy = readLegacyLocalProgress();
  var legacyIds = legacy ? Object.keys(legacy) : [];
  if(!legacyIds.length) return state;
  return api('/progress/bulk', {method:'POST', body:{lessonIds: legacyIds}}).then(function(){
    legacyIds.forEach(function(id){ state.progressMap[id] = true; });
    var legacyLast = readLegacyLast();
    if(!legacyLast){ clearLegacyLocal(); return state; }
    return api('/last-lesson', {method:'POST', body:{lessonId: legacyLast}}).then(function(){
      state.lastLessonId = legacyLast;
      clearLegacyLocal();
      return state;
    });
  });
}

function startForState(state){
  if(state.role === 'teacher'){
    document.getElementById('teacher-badge').textContent = state.displayName || '';
    document.getElementById('teacher-logout-btn').addEventListener('click', signOut);
    document.getElementById('teacher-dash').hidden = false;
    renderTeacherDashboard();
    return;
  }
  document.getElementById('app-root').hidden = false;
  initReader({
    progress: state.progressMap,
    lastId: state.lastLessonId,
    badgeText: state.displayName || '',
    signOut: signOut,
    persistDone: function(id, val){
      api('/progress', {method:'POST', body:{lessonId:id, done:val}}).catch(function(e){ console.error(e); });
    },
    persistLast: function(id){
      api('/last-lesson', {method:'POST', body:{lessonId:id}}).catch(function(e){ console.error(e); });
    }
  });
}

function renderTeacherDashboard(){
  var moduleOrder = [];
  PAGES.forEach(function(p){
    if(moduleOrder.indexOf(p.section) === -1) moduleOrder.push(p.section);
  });
  var moduleTotal = {};
  moduleOrder.forEach(function(m){ moduleTotal[m] = 0; });
  PAGES.forEach(function(p){ moduleTotal[p.section]++; });

  api('/teacher/students').then(function(data){
    var students = data.students || [];
    var rows = data.progress || [];
    var byUser = {};
    rows.forEach(function(r){
      if(!byUser[r.user_id]) byUser[r.user_id] = { done:{}, lastAt:null };
      byUser[r.user_id].done[r.lesson_id] = true;
      if(!byUser[r.user_id].lastAt || r.done_at > byUser[r.user_id].lastAt){
        byUser[r.user_id].lastAt = r.done_at;
      }
    });

    var totalAll = PAGES.length;
    var html = '<thead><tr><th>Ученик</th><th>Всего</th>' +
      moduleOrder.map(function(m){ return '<th>'+escapeHtmlTD(m)+'</th>'; }).join('') +
      '<th>Последняя активность</th></tr></thead><tbody>';

    if(!students.length){
      html += '<tr><td colspan="'+(moduleOrder.length+3)+'">Пока нет ни одного ученика</td></tr>';
    }

    students.forEach(function(s){
      var u = byUser[s.id] || { done:{}, lastAt:null };
      var doneCount = Object.keys(u.done).length;
      html += '<tr><td>'+escapeHtmlTD(s.display_name || s.email)+'</td>' +
        '<td class="mono">'+doneCount+' / '+totalAll+'</td>' +
        moduleOrder.map(function(m){
          var done = 0;
          PAGES.forEach(function(p){ if(p.section === m && u.done[p.id]) done++; });
          return '<td class="mono">'+done+'/'+moduleTotal[m]+'</td>';
        }).join('') +
        '<td class="mono">'+(u.lastAt ? new Date(u.lastAt).toLocaleString('ru-RU') : '—')+'</td></tr>';
    });
    html += '</tbody>';
    document.getElementById('teacher-table').innerHTML = html;
  }).catch(function(e){
    document.getElementById('teacher-table').innerHTML = '<tbody><tr><td>Не удалось загрузить: '+escapeHtmlTD(e.message)+'</td></tr></tbody>';
  });
}

function onSignedIn(me){
  buildAuthState(me)
    .then(migrateLegacyIfNeeded)
    .then(startForState)
    .catch(function(e){
      console.error(e);
      showAuthGate('Не удалось загрузить профиль: ' + e.message);
    });
}

(function bootstrap(){
  document.getElementById('auth-form').addEventListener('submit', function(ev){
    ev.preventDefault();
    var email = document.getElementById('auth-email').value.trim();
    var password = document.getElementById('auth-password').value;
    var errEl = document.getElementById('auth-error');
    errEl.hidden = true;
    var submitBtn = document.getElementById('auth-submit');
    submitBtn.disabled = true;
    api('/auth/login', {method:'POST', body:{email:email, password:password}}).then(function(me){
      submitBtn.disabled = false;
      hideAuthGate();
      onSignedIn(me);
    }).catch(function(e){
      submitBtn.disabled = false;
      errEl.textContent = e.message;
      errEl.hidden = false;
    });
  });

  api('/me').then(function(me){
    hideAuthGate();
    onSignedIn(me);
  }).catch(function(){
    showAuthGate();
  });
})();
</script>
