негативных тестов и проверки статус-кода.\n- `update_user` сразу возвращает провалидированный `UserSchema` — пригодится для happy-path тестов, где удобно проверить конкретные поля через атрибуты.\n\n### Шаг 3. Импорт новой схемы\n\nНе забудь обновить импорт в начале `users_client.py`:\n\n```python\nfrom clients.users.users_schema import (\n    CreateUserRequestSchema,\n    CreateUserResponseSchema,\n    UpdateUserRequestSchema,  # добавили\n    UserSchema,\n)\n```\n\n## Пример\n\nИспользование нового метода в тесте — по тому же паттерну, что и `test_create_user` из урока 3.12:\n\n```python\ndef test_update_user_name(users_client: UsersClient):\n    request = UpdateUserRequestSchema(name=\"New Name\")\n\n    updated_user = users_client.update_user(user_id=1, request=request)\n\n    assert updated_user.name == \"New Name\"\n```\n\nА вот пример клиентской (не серверной) негативной проверки, о которой шла речь выше — она не делает ни одного сетевого запроса:\n\n```python\nimport pytest\nfrom pydantic import ValidationError\n\n\ndef test_update_user_invalid_email_is_rejected_by_schema():\n    with pytest.raises(ValidationError):\n        UpdateUserRequestSchema(email=\"not-an-email\")\n```\n\nТакой тест ловит ошибку валидации раньше, чем она вообще могла бы стать проблемой на реальном API — это ценно само по себе, независимо от того, как именно ведёт себя конкретный бэкенд.\n\n## Частые ошибки\n\n- Забыть `exclude_none=True` при сериализации `UpdateUserRequestSchema` — тогда в PATCH-запрос уйдут лишние поля со значением `null`, и метод перестанет вести себя как частичное обновление.\n- Сделать все поля в схеме запроса обязательными — тогда придётся передавать вообще все поля пользователя при любом, даже самом маленьком, изменении, что противоречит смыслу PATCH.\n- Добавить новый метод в середину класса произвольным образом, ломая порядок \"сначала все `_api`-методы, потом высокоуровневые\" — нарушение уже сложившегося в файле соглашения затрудняет чтение кода для следующего человека.\n- Не обновить импорты после добавления новой схемы и словить `NameError` при первом запуске.\n\n## Мини-задание\n\nВ своём форке `boilerplate/` добавь `UpdateUserRequestSchema` в `users_schema.py` и `update_user_api`/`update_user` в `users_client.py`, как показано выше. Напиши и запусти локально (`pytest -m api -v`) тест `test_update_user_name`, проверяющий, что после `update_user(user_id=1, request=UpdateUserRequestSchema(name=\"New Name\"))` поле `name` в ответе действительно равно `\"New Name\"`. Это и есть первый шаг домашнего задания — подробное описание и критерии готовности смотри в следующем уроке.\n", "hasPractice": true, "quiz": {"question": "Почему при сериализации UpdateUserRequestSchema перед отправкой PATCH-запроса используется request.model_dump(exclude_none=True), а не просто request.model_dump()?", "options": ["Потому что model_dump() без аргументов вообще не работает для моделей с опциональными полями", "Чтобы автоматически перевести все поля в camelCase перед отправкой", "Чтобы ускорить сериализацию модели в JSON", "Чтобы в тело запроса попали только реально переданные (изменяемые) поля, а не все поля со значением None — иначе PATCH перестанет быть частичным обновлением"], "correct": 3, "explain": "Все поля UpdateUserRequestSchema опциональны и по умолчанию равны None. exclude_none=True убирает из запроса незаполненные поля, сохраняя семантику PATCH — отправлять только то, что реально нужно изменить."}}, {"id": "p60", "section": "Модуль 3 · API-тестирование", "subgroup": "Неделя 7", "isOverview": false, "num": "3.14", "title": "Домашнее задание", "content": "# 3.14. Домашнее задание\n\n## Формулировка\n\nОткрой PR в свой форк общего репозитория (`boilerplate/`) с 5–7 новыми API-тестами. Тесты должны опираться на новые методы `UsersClient`, которые ты добавишь по образцу урока 3.13, а не на голые вызовы `requests`.\n\nМинимальный набор изменений:\n\n1. **Добавь `UpdateUserRequestSchema`** в `clients/users/users_schema.py` — все поля опциональны (`name`, `username`, `email`), под частичное обновление через PATCH. Используй `EmailStr` для поля `email`, как в уже существующей `UserSchema`.\n2. **Добавь `update_user_api` и `update_user`** в `clients/users/users_client.py` — по паттерну \"низкоуровневый метод возвращает `Response`, высокоуровневый — Pydantic-модель\", как показано в уроке 3.13. Не забудь `exclude_none=True` при сериализации запроса.\n3. **Напиши тесты на `update_user_api`/`update_user`** — как минимум один happy-path тест (обновление одного поля, проверка через атрибуты ответа).\n4. **Напиши тесты на уже существующий, но пока непокрытый `delete_user_api`** — как минимум один тест, проверяющий успешный статус-код.\n5. **Добавь минимум один \"несчастливый\" тест**, который проверяет не happy path. Хорошие варианты для нашего демо-API (см. пояснение ниже, почему не любой негативный сценарий сюда подходит):\n   - `UpdateUserRequestSchema(email=\"not-an-email\")` должна упасть с `pydantic.ValidationError` ещё до похода в сеть — это валидный и полезный негативный тест, не зависящий от поведения конкретного сервера.\n   - Запрос несуществующего пользователя через `get_user_api` (метод уже есть и уже покрыт тестом в `test_users.py` — используй его как образец, если хочешь написать вариацию, например, с другим граничным id).\n\nИтого у тебя должно получиться 5–7 тестов в `tests/api/test_users.py` (можно дописать в существующий класс `TestUsers` или добавить новые тестовые методы рядом).\n\n### Почему не \"PATCH/DELETE несуществующего пользователя → 404\"\n\nJSONPlaceholder — фейковый API: ничего не сохраняет по-настоящему, а на `PATCH`/`DELETE` для **любого** id (даже несуществующего) отвечает `200 OK`, просто эхом возвращая присланные данные. Это легко проверить самостоятельно:\n\n```bash\ncurl -i -X PATCH https://jsonplaceholder.typicode.com/users/9999 \\\n     -H \"Content-Type: application/json\" -d '{\"name\": \"x\"}'\n# HTTP/1.1 200 OK — а не 404, как можно было бы ожидать от настоящего API\n```\n\nПоэтому тест вида \"обнови несуществующего пользователя и жди 404\" **не сработает** — не из-за ошибки в твоём коде, а потому что сам демо-сервис так не умеет. Это не баг задания, а особенность конкретного публичного API, с которой полезно познакомиться: **не пиши негативный тест, не проверив вручную, как API реально ведёт себя** (через `curl` или Postman) — иначе тест либо не будет иметь смысла, либо будет falsely red/green. Именно поэтому пункт 5 выше явно указывает на клиентскую (Pydantic) валидацию как на надёжный источник негативного сценария для этого демо-API — она не зависит от поведения сервера.\n\n## Критерии \"готово\"\n\n- [ ] Новый метод `update_user_api` (и, по желанию, `update_user`) добавлен в `UsersClient`, который по-прежнему наследуется от `APIClient` — новая архитектура не вводится, используется существующая.\n- [ ] Для запроса на обновление есть Pydantic-схема (`UpdateUserRequestSchema`) с опциональными полями; для ответа переиспользована существующая `UserSchema`.\n- [ ] Все новые тесты используют фикстуру `users_client`, а не создают клиент вручную и не вызывают `requests` напрямую.\n- [ ] Есть минимум 5 тестов, среди них — минимум один явно негативный/граничный сценарий (не только happy path).\n- [ ] Один из тестов проверяет уже существующий `delete_user_api` (ранее непокрытый).\n- [ ] `pytest -m api -v` проходит локально зелёным целиком, включая уже существовавшие до тебя тесты.\n- [ ] PR открыт в общий репозиторий, в описании — что сделано и как проверить (см. правила PR в `boilerplate/README.md`).\n\n## Что не входит в это домашнее задание\n\nAllure-разметка (`allure.step`, `allure.title`) — это тема модуля 5. В существующих тестах она уже есть, и ты можешь по аналогии добавить её в свои новые тесты (это не будет лишним), но отсутствие Allure-декораторов не считается недочётом на этом этапе — критерии \"готово\" выше их не требуют.\n", "hasPractice": false}, {"id": "p61", "section": "Модуль 4 · Playwright + POM", "subgroup": null, "isOverview": true, "num": null, "title": "Модуль 4. Playwright (Python) + Page Object Model", "content": "# Модуль 4. Playwright (Python) + Page Object Model\n\nНедели 8–10. Источник материала: `stepik-playwright-ui-testing` (разделы 03, 04, 06), переписано под этот курс и под `boilerplate/`.\n\nК концу модуля ты умеешь открывать реальную веб-страницу, находить на ней элементы через локаторы, взаимодействовать с формами и проверять результат — и делаешь это не как набор разрозненных вызовов Playwright внутри теста, а через Page Object, наследуемый от общего `BasePage` из `boilerplate/`.\n\n## Неделя 8 — HTML, DOM, локаторы, Playwright\n\n| Урок | Тема |\n|---|---|\n| 4.1 | HTML и DOM: как устроена веб-страница с точки зрения автотеста |\n| 4.2 | DevTools: смотрим на страницу глазами браузера |\n| 4.3 | CSS-локаторы: как объяснить Playwright, что искать |\n| 4.4 | Локаторы учебного приложения: собираем таблицу для будущих тестов |\n| 4.5 | Что такое Playwright и зачем он нужен |\n\n## Неделя 9 — первый скрипт, ожидания, формы, попапы\n\n| Урок | Тема |\n|---|---|\n| 4.6 | Первый Playwright-скрипт: goto, locator, fill, click |\n| 4.7 | Автоматические ожидания и `expect()` |\n| 4.8 | Работа с формами: fill, click, select, чекбоксы |\n| 4.9 | Попапы, алерты и модальные окна |\n| 4.10 | Проверка состояния страницы через `expect()` |\n\n## Неделя 10 — Page Object Model на примере boilerplate\n\n| Урок | Тема |\n|---|---|\n| 4.11 | Зачем нужен PageObject: проблема \"тест знает слишком много\" |\n| 4.12 | Разбираем `BasePage` построчно |\n| 4.13 | Разбираем `RegistrationPage` построчно |\n| 4.14 | Разбираем `DashboardPage` построчно |\n| 4.15 | Фикстуры для Page Object в `conftest.py` |\n| 4.16 | Добавляем новый Page Object: шаблон на примере `LoginPage` |\n| — | Домашнее задание модуля (`99_Домашнее_задание.md`) |\n\n## Итог модуля\n\n2–3 UI-теста на реальном учебном приложении, оформленные как PR в общий репозиторий `boilerplate/`: новый Page Object по образцу `RegistrationPage`/`DashboardPage`, фикстуры в `conftest.py`, тесты с `@pytest.mark.ui` и `allure.step`.\n\n## Что уже должно быть готово к старту модуля\n\n- Форкнутый `boilerplate/` (с модуля 2).\n- Рабочее окружение: `pip install -r requirements.txt`, `playwright install chromium`.\n- Пройденный модуль 1 (pytest, fixtures, conftest) — в модуле 4 мы не объясняем `pytest` заново, только используем уже знакомую фикстуру `page` от `pytest-playwright`.\n", "hasPractice": false}, {"id": "p62", "section": "Модуль 4 · Playwright + POM", "subgroup": "Неделя 10", "isOverview": false, "num": "4.11", "title": "Зачем нужен PageObject: проблема \"тест знает слишком много\"", "content": "# 4.11. Зачем нужен PageObject: проблема \"тест знает слишком много\"\n\n## Зачем это нужно\n\nС этого урока мы переходим от отдельных скриптов к архитектуре, на которой построен весь `boilerplate/` — общий репозиторий, в который ты будешь сдавать домашки начиная с модуля 2. Понимание того, зачем нужен Page Object, важно не для сдачи теста на знание термина, а для того, чтобы твои будущие Page Object'ы (например, `LoginPage` в домашнем задании этого модуля) вписывались в существующую архитектуру, а не ломали её.\n\n## Теория\n\n### Тест, который писали бы без Page Object\n\nК концу недели 9 у нас есть рабочий сценарий регистрации. Если записать его прямо в тестовую функцию, получится примерно так:\n\n```python\npage.goto(\"https://nikita-filonov.github.io/qa-automation-engineer-ui-course/#/auth/registration\")\n\npage.locator(\"[data-testid='registration-form-email-input'] input\").fill(user_data[\"email\"])\npage.locator(\"[data-testid='registration-form-username-input'] input\").fill(user_data[\"username\"])\npage.locator(\"[data-testid='registration-form-password-input'] input\").fill(user_data[\"password\"])\npage.locator(\"[data-testid='registration-page-registration-button']\").click()\n```\n\nСейчас, пока в проекте один тест и один сценарий, это выглядит нормально. Но представим, что проект начал расти — появились новые проверки: регистрация с пустым паролем, с уже занятым email, с некорректным email, логин, выход из системы. Практически каждый такой тест будет заново использовать одни и те же локаторы:\n\n```python\n\"[data-testid='registration-form-email-input'] input\"\n\"[data-testid='registration-form-username-input'] input\"\n\"[data-testid='registration-form-password-input'] input\"\n\"[data-testid='registration-page-registration-button']\"\n```\n\n### Почему дублирование локаторов — это проблема\n\nПредставим, что разработчик поменял разметку и локатор поля email превратился из `[data-testid='registration-form-email-input']` в `[data-testid='registration-email-input']`. Если этот локатор скопирован в десять тестов — исправлять придётся в десяти местах. В пятьдесят тестов — в пятидесяти. Причём проблема не только в объёме правок: чем больше копий одного и того же кода, тем выше шанс что-то пропустить и получить нестабильные тесты, которые проходят или падают в зависимости от того, где именно забыли обновить локатор.\n\n### Почему это делает тест менее читаемым\n\nДаже если бы локаторы никогда не менялись, есть вторая проблема. Представь не четыре строки с `page.locator(...)`, а сорок. Тест начинает описывать не сценарий пользователя, а технические детали реализации страницы: CSS-селекторы, вызовы Playwright, промежуточные переменные. При этом реальный сценарий очень простой:\n\n1. Открыть страницу регистрации.\n2. Заполнить форму.\n3. Нажать кнопку регистрации.\n4. Проверить, что открылся Dashboard.\n\nПолучается, что для компьютера тест понятен, а для человека — уже не очень.\n\n### Идея Page Object\n\nРешение — паттерн **Page Object**. Каждая страница приложения описывается отдельным классом (`RegistrationPage`, `DashboardPage`). Внутри такого класса находятся локаторы, действия пользователя и проверки, относящиеся именно к этой странице. Тест перестаёт работать напрямую с локаторами — вместо этого он работает с объектами страниц.\n\nБыло (тест разговаривает с Playwright напрямую):\n\n```\nнайди поле email\nзаполни поле email\nнайди поле username\nзаполни поле username\nнайди кнопку\nнажми кнопку\n```\n\nСтало (тест разговаривает на уровне пользовательских действий):\n\n```python\nregistration_page.fill_registration_form(...)\nregistration_page.click_registration_button()\n```\n\nПоявляется разделение ответственности: тест отвечает на вопрос \"что делает пользователь\", а класс страницы — на вопрос \"как именно это реализовано технически\" (какие локаторы, как найти кнопку, как проверить состояние). Если локатор поля email изменится, исправление потребуется внести только в одном месте — внутри `RegistrationPage`. Все тесты, использующие эту страницу, продолжат работать без изменений.\n\nВажно понимать: Page Object — это не особенность Playwright и не возможность pytest. Это архитектурный паттерн организации автотестов, который используется во многих инструментах и языках.\n\n## Пример\n\nВ `boilerplate/` этот паттерн уже реализован и работает — не как учебный пример \"как могло бы быть\", а как проверенный код, против которого реально проходит `pytest -m ui`:\n\n```\nboilerplate/\n├── pages/\n│   ├── base_page.py\n│   ├── registration_page.py\n│   └── dashboard_page.py\n├── tests/ui/\n│   └── test_registration.py\n└── conftest.py\n```\n\nВ следующих четырёх уроках мы разберём эти файлы построчно — не для того, чтобы переписать их (их менять не нужно), а чтобы понимать, по какому образцу добавлять новые страницы.\n\n## Частые ошибки\n\n- Считать, что Page Object — это обязательно много кода и сложная архитектура. На практике, как ты увидишь в `DashboardPage`, класс может быть совсем небольшим — ровно настолько большим, насколько того требуют тесты.\n- Пытаться засунуть в один Page Object сразу несколько разных страниц приложения \"для экономии файлов\" — это возвращает ту же проблему дублирования и путаницы, от которой паттерн должен избавлять.\n- Путать Page Object с фикстурами pytest — это разные вещи, которые, как мы увидим на уроке 4.15, отлично работают вместе: фикстура создаёт объект Page Object и передаёт его в тест.\n\n## Мини-задание\n\nОткрой `boilerplate/tests/ui/test_registration.py` и `boilerplate/pages/registration_page.py`. Не читая пока подробностей реализации, просто сосчитай: сколько раз в тесте встречается `page.locator(...)` напрямую и сколько раз — вызов метода объекта `registration_page`. Сравни с тем, как выглядел бы этот же тест без Page Object (пример в начале урока).\n", "hasPractice": true, "quiz": {"question": "В чём главная проблема, которую решает паттерн Page Object?", "options": ["Он ускоряет выполнение тестов за счёт параллельного запуска браузеров", "Он убирает необходимость использовать pytest в UI-тестах", "Он устраняет дублирование локаторов и деталей реализации страницы между тестами", "Он автоматически генерирует локаторы по скриншоту страницы"], "correct": 2, "explain": "Page Object переносит локаторы и технические детали работы со страницей в отдельный класс, чтобы они не копировались в каждом тесте и не ломались все разом при изменении вёрстки."}}, {"id": "p63", "section": "Модуль 4 · Playwright + POM", "subgroup": "Неделя 10", "isOverview": false, "num": "4.12", "title": "Разбираем BasePage построчно", "content": "# 4.12. Разбираем BasePage построчно\n\n## Зачем это нужно\n\n`BasePage` — это фундамент, от которого наследуются все страницы в `boilerplate/`, включая ту, которую ты добавишь в домашнем задании. Прежде чем писать новый Page Object, нужно точно понимать, что уже \"достаётся бесплатно\" через наследование, а что нужно реализовывать самому.\n\n## Теория\n\nОткрой файл `boilerplate/pages/base_page.py` — весь его код уместился в 19 строк:\n\n```python\nfrom playwright.sync_api import Page, expect\n\n\nclass BasePage:\n    \"\"\"\n    Общая функциональность для всех страниц приложения: хранение объекта page,\n    открытие страницы по URL, проверка текущего адреса.\n    Конкретные страницы (RegistrationPage, DashboardPage, ...) наследуются от него.\n    \"\"\"\n\n    def __init__(self, page: Page):\n        self.page = page\n\n    def open(self, url: str) -> None:\n        self.page.goto(url)\n\n    def check_current_url(self, expected_url: str) -> None:\n        expect(self.page).to_have_url(expected_url)\n```\n\nРазберём каждую часть.\n\n### Импорты\n\n```python\nfrom playwright.sync_api import Page, expect\n```\n\n`Page` — тип объекта Playwright, представляющего вкладку браузера (тот самый `page`, с которым мы работали на неделе 9). Он импортируется здесь для аннотации типа в конструкторе — сам класс `Page` не создаётся, а только используется для подсказки, что именно ожидается на вход. `expect` — та же функция для проверок, которую мы разбирали в уроке 4.7.\n\n### Конструктор\n\n```python\ndef __init__(self, page: Page):\n    self.page = page\n```\n\nКогда позже будет создаваться объект конкретной страницы (например, `RegistrationPage(page)`), внутрь передаётся объект Playwright `page`, полученный из фикстуры `pytest-playwright`. Конструктор `BasePage` сохраняет его в атрибуте `self.page`. После этого любой метод любой страницы, унаследованной от `BasePage`, может обращаться к браузеру через `self.page.goto(...)`, `self.page.locator(...)` и так далее.\n\nПочему это важно понимать заранее: каждая новая страница, которую ты создашь, должна вызвать этот конструктор через `super().__init__(page)` — иначе `self.page` не появится, и все методы, которые на него полагаются, сломаются. Мы увидим это в следующем уроке на примере `RegistrationPage`.\n\n### Метод `open`\n\n```python\ndef open(self, url: str) -> None:\n    self.page.goto(url)\n```\n\nПринимает URL и открывает его через Playwright. Метод сам по себе не делает ничего особенного — это обёртка над `page.goto(...)`. Ценность не в сложности реализации, а в том, что это единая точка, через которую любая страница проекта открывается по URL. Если понадобится, например, логировать каждое открытие страницы — это единственное место, которое нужно будет изменить.\n\n### Метод `check_current_url`\n\n```python\ndef check_current_url(self, expected_url: str) -> None:\n    expect(self.page).to_have_url(expected_url)\n```\n\nПроверяет, что текущий URL страницы совпадает с ожидаемым. Обрати внимание: здесь используется `expect(self.page).to_have_url(...)`, а не `assert self.page.url == expected_url`. Как мы разобрали на уроке 4.7, `expect()` умеет ждать нужное состояние — если переход на страницу занимает долю секунды, `expect()` подождёт, а обычный `assert` мог бы сработать слишком рано и дать ложное падение теста.\n\n## Пример\n\n`BasePage` сам по себе не используется напрямую в тестах — он не описывает никакую конкретную страницу приложения. Его роль видна только через наследование:\n\n```python\nclass RegistrationPage(BasePage):\n    ...\n\nclass DashboardPage(BasePage):\n    ...\n```\n\nОбе страницы автоматически получают `self.page`, `open()` и `check_current_url()`, не переписывая их заново. Это и есть смысл базового класса: общая функциональность реализована один раз, а не дублируется в каждой странице.\n\n## Частые ошибки\n\n- Пытаться сразу расширить `BasePage` большим количеством \"универсальных\" методов — в реальных проектах базовый класс страницы действительно может содержать больше возможностей (ожидания загрузки, работу с попапами, общие проверки), но в этом курсе он специально оставлен простым, чтобы не размывать саму идею наследования. Если для домашнего задания тебе не хватает какого-то общего метода — сначала подумай, действительно ли он общий для нескольких страниц, а не специфичен для одной.\n- Забыть, что `open()` и `check_current_url()` уже существуют в `BasePage`, и продублировать их в новой странице вместо использования через `super()`.\n- Менять сам `base_page.py` под задачи конкретной страницы — если новой странице нужно что-то своё, это должно жить в её собственном классе, а не в общем `BasePage` (иначе следующая правка \"под одну страницу\" начнёт ломать остальные).\n\n## Мини-задание\n\nНе открывая следующий урок, попробуй предположить: если бы тебе нужно было создать `LoginPage` для страницы входа, какие два метода из `BasePage` ты бы точно унаследовал без изменений? Запиши ответ, а на уроке 4.16 сверишь его с реальным решением.\n", "hasPractice": true, "quiz": {"question": "Что произойдёт, если в наследнике BasePage забыть вызвать super().__init__(page) в конструкторе?", "options": ["Ничего — Python автоматически вызовет конструктор родительского класса", "Атрибут self.page не будет создан, и методы, которые на него полагаются, вызовут ошибку", "Playwright автоматически запустит новый браузер вместо переданного page", "Тест завершится успешно, но локаторы будут работать медленнее"], "correct": 1, "explain": "super().__init__(page) выполняет конструктор BasePage, который сохраняет page в self.page. Без этого вызова атрибут self.page не появится, и методы вроде open() или check_current_url() сломаются."}}, {"id": "p64", "section": "Модуль 4 · Playwright + POM", "subgroup": "Неделя 10", "isOverview": false, "num": "4.13", "title": "Разбираем RegistrationPage построчно", "content": "# 4.13. Разбираем RegistrationPage построчно\n\n## Зачем это нужно\n\n`RegistrationPage` — это первый полноценный Page Object в проекте и, что важнее, это тот самый образец, по которому ты будешь строить свой `LoginPage` в домашнем задании. Каждая деталь в этом файле — не случайность, а конкретное архитектурное решение, которое стоит понимать, а не просто копировать.\n\n## Теория\n\nОткрой `boilerplate/pages/registration_page.py`:\n\n```python\nfrom playwright.sync_api import Page, expect\n\nfrom pages.base_page import BasePage\n\n\nclass RegistrationPage(BasePage):\n    URL = \"https://nikita-filonov.github.io/qa-automation-engineer-ui-course/#/auth/registration\"\n\n    def __init__(self, page: Page):\n        super().__init__(page)\n\n        self.email_input = page.locator(\"[data-testid='registration-form-email-input'] input\")\n        self.username_input = page.locator(\"[data-testid='registration-form-username-input'] input\")\n        self.password_input = page.locator(\"[data-testid='registration-form-password-input'] input\")\n        self.registration_button = page.locator(\"[data-testid='registration-page-registration-button']\")\n\n    def open_page(self) -> None:\n        super().open(self.URL)\n\n    def fill_registration_form(self, email: str, username: str, password: str) -> None:\n        self.email_input.fill(email)\n        self.username_input.fill(username)\n        self.password_input.fill(password)\n\n    def click_registration_button(self) -> None:\n        self.registration_button.click()\n\n    def check_visible_registration_form(self) -> None:\n        expect(self.email_input).to_be_visible()\n        expect(self.username_input).to_be_visible()\n        expect(self.password_input).to_be_visible()\n        expect(self.registration_button).to_be_visible()\n```\n\nРазберём построчно.\n\n### Наследование\n\n```python\nclass RegistrationPage(BasePage):\n```\n\n`RegistrationPage(BasePage)` означает \"`RegistrationPage` является наследником `BasePage`\". Благодаря этому класс автоматически получает `self.page`, `open()` и `check_current_url()`, разобранные в прошлом уроке, — их не нужно писать заново.\n\n### URL как атрибут класса\n\n```python\nURL = \"https://nikita-filonov.github.io/qa-automation-engineer-ui-course/#/auth/registration\"\n```\n\nАдрес страницы хранится внутри самого класса, а не передаётся снаружи и не живёт в тесте. Если адрес когда-нибудь изменится, исправлять его нужно будет только в одном месте.\n\n### Конструктор и `super().__init__(page)`\n\n```python\ndef __init__(self, page: Page):\n    super().__init__(page)\n```\n\n`super().__init__(page)` вызывает конструктор родительского класса `BasePage`, который мы разобрали в прошлом уроке, — тот самый, что сохраняет `page` в `self.page`. Без этой строки атрибут `self.page` не появится, и все последующие строки конструктора, которые обращаются к `page.locator(...)`, работали бы (потому что `page` доступен как параметр функции), но методы вроде `open_page()`, использующие `self.page` через `BasePage`, — сломались бы.\n\n### Локаторы в конструкторе\n\n```python\nself.email_input = page.locator(\"[data-testid='registration-form-email-input'] input\")\nself.username_input = page.locator(\"[data-testid='registration-form-username-input'] input\")\nself.password_input = page.locator(\"[data-testid='registration-form-password-input'] input\")\nself.registration_button = page.locator(\"[data-testid='registration-page-registration-button']\")\n```\n\nЭто ровно те локаторы, которые мы собрали в таблицу на уроке 4.4. Ключевое архитектурное решение: локаторы создаются один раз, в конструкторе, и сохраняются в атрибуты (`self.email_input` и так далее). Дальше ни один метод класса не пишет CSS-селектор заново — все они используют уже готовые атрибуты. Это даёт три вещи: страницу проще читать, локатор при изменении интерфейса правится только тут, а тесты вообще перестают что-либо знать про CSS-селекторы.\n\n### Метод `open_page`\n\n```python\ndef open_page(self) -> None:\n    super().open(self.URL)\n```\n\nОборачивает метод `open()` из `BasePage`, подставляя в него собственный `self.URL`. Теперь открыть страницу можно одной понятной командой `registration_page.open_page()` — вызывающему коду (тесту) не нужно знать сам адрес.\n\n### Метод `fill_registration_form`\n\n```python\ndef fill_registration_form(self, email: str, username: str, password: str) -> None:\n    self.email_input.fill(email)\n    self.username_input.fill(username)\n    self.password_input.fill(password)\n```\n\nОдин метод вместо трёх отдельных вызовов `.fill()`. Это не техническое ограничение Playwright, а осознанное решение: в нашем сценарии пользователь всегда заполняет форму целиком, поэтому один метод, отражающий это целиком, естественнее, чем `fill_email()`, `fill_username()`, `fill_password()` по отдельности. Такой метод лучше отражает реальное действие пользователя, а не техническую последовательность операций.\n\n### Метод `click_registration_button`\n\n```python\ndef click_registration_button(self) -> None:\n    self.registration_button.click()\n```\n\nОборачивает `.click()` над уже готовым локатором кнопки. Тест теперь может вызвать `registration_page.click_registration_button()`, не зная, что за этим скрывается CSS-локатор.\n\n### Метод `check_visible_registration_form`\n\n```python\ndef check_visible_registration_form(self) -> None:\n    expect(self.email_input).to_be_visible()\n    expect(self.username_input).to_be_visible()\n    expect(self.password_input).to_be_visible()\n    expect(self.registration_button).to_be_visible()\n```\n\nПроверяет, что все основные элементы формы действительно отображаются. Такую проверку удобно вызывать сразу после открытия страницы — если что-то не загрузилось, тест упадёт здесь с понятной ошибкой, а не позже, при попытке заполнить несуществующее поле.\n\n## Пример\n\nСобранный воедино, класс уже умеет всё, что нужно для сценария регистрации: открыть страницу, убедиться, что форма видна, заполнить её и нажать кнопку — четыре понятных вызова без единого CSS-локатора снаружи класса:\n\n```python\nregistration_page.open_page()\nregistration_page.check_visible_registration_form()\nregistration_page.fill_registration_form(email=\"a@b.com\", username=\"user\", password=\"pass123\")\nregistration_page.click_registration_button()\n```\n\n## Частые ошибки\n\n- Забыть вызвать `super().__init__(page)` в конструкторе новой страницы — тогда `self.page` не появится, и любой метод, который на него опирается (в том числе унаследованные из `BasePage`), выдаст `AttributeError`.\n- Создавать локаторы заново внутри каждого метода (`page.locator(...)` прямо в `click_registration_button`), а не один раз в конструкторе — это работает, но нарушает принцип \"локаторы в одном месте\", ради которого и затевался Page Object.\n- Делать один метод, который и заполняет форму, и кликает кнопку, и проверяет результат — такие методы становится сложно переиспользовать по отдельности в разных сценариях (например, для негативного теста нужно заполнить форму, но не проверять успешный переход).\n\n## Мини-задание\n\nНайди в `boilerplate/pages/registration_page.py` строку, отвечающую за проверку видимости кнопки Registration, и объясни (себе или напарнику), почему она использует `expect(self.registration_button)`, а не, например, `expect(page.locator(\"[data-testid='registration-page-registration-button']\"))` заново.\n", "hasPractice": true, "quiz": {"question": "Почему локаторы в RegistrationPage создаются один раз в конструкторе и сохраняются в атрибуты (self.email_input и т.д.), а не создаются заново внутри каждого метода?", "options": ["Так тест выполняется быстрее, потому что Playwright кэширует локаторы только при таком подходе", "Так локаторы хранятся в одном месте, и при изменении вёрстки их нужно поправить только там", "Playwright технически не позволяет создавать локаторы внутри обычных методов класса", "Это обязательное требование pytest-playwright для корректной работы фикстур"], "correct": 1, "explain": "Централизованное хранение локаторов в конструкторе — ключевая идея Page Object: если разметка страницы изменится, локатор правится в одном месте, а не в каждом методе, где он использовался."}}, {"id": "p65", "section": "Модуль 4 · Playwright + POM", "subgroup": "Неделя 10", "isOverview": false, "num": "4.14", "title": "Разбираем DashboardPage построчно", "content": "# 4.14. Разбираем DashboardPage построчно\n\n## Зачем это нужно\n\n`DashboardPage` показывает важную вещь, которую легко упустить: Page Object не обязан быть большим классом со множеством методов. Он должен содержать ровно столько, сколько реально нужно тестам — не больше. Это прямо пригодится в домашнем задании: твой `LoginPage` тоже не должен разрастаться \"про запас\".\n\n## Теория\n\nОткрой `boilerplate/pages/dashboard_page.py` — это всего 19 строк:\n\n```python\nfrom playwright.sync_api import Page, expect\n\nfrom pages.base_page import BasePage\n\n\nclass DashboardPage(BasePage):\n    URL = \"https://nikita-filonov.github.io/qa-automation-engineer-ui-course/#/dashboard\"\n\n    def __init__(self, page: Page):\n        super().__init__(page)\n\n        self.toolbar_title = page.locator(\"[data-testid='dashboard-toolbar-title-text']\")\n\n    def check_opened(self) -> None:\n        self.check_current_url(self.URL)\n\n    def check_visible_toolbar_title(self) -> None:\n        expect(self.toolbar_title).to_be_visible()\n        expect(self.toolbar_title).to_have_text(\"Dashboard\")\n```\n\n### Наследование и URL\n\n```python\nclass DashboardPage(BasePage):\n    URL = \"https://nikita-filonov.github.io/qa-automation-engineer-ui-course/#/dashboard\"\n```\n\nТак же, как в `RegistrationPage`: наследование от `BasePage` и адрес страницы в виде атрибута класса.\n\n### Конструктор и единственный локатор\n\n```python\ndef __init__(self, page: Page):\n    super().__init__(page)\n\n    self.toolbar_title = page.locator(\"[data-testid='dashboard-toolbar-title-text']\")\n```\n\nВ отличие от `RegistrationPage`, тут всего один локатор — заголовок страницы. Заметь: у `DashboardPage` нет метода `open_page()`. Это осознанное решение, а не недосмотр — в нашем сценарии пользователь никогда не открывает Dashboard напрямую по URL, он попадает туда только через клик по кнопке Registration. Метод, который никогда не будет вызван, не добавляется просто \"для полноты\".\n\n### Метод `check_opened`\n\n```python\ndef check_opened(self) -> None:\n    self.check_current_url(self.URL)\n```\n\nЭто самая показательная строка во всём модуле. `DashboardPage` не проверяет URL заново своими силами — он переиспользует `check_current_url()`, унаследованный от `BasePage` (урок 4.12), просто подставляя туда собственный `self.URL`. Никакого дублирования логики проверки URL между страницами нет — она реализована один раз, в базовом классе.\n\nНазвание метода — `check_opened`, а не, скажем, `check_url` — читается как законченное утверждение \"проверить, что страница открыта\". Снаружи тесту не важно, что внутри используется именно проверка URL — он вызывает метод, который отвечает на вопрос по существу.\n\n### Метод `check_visible_toolbar_title`\n\n```python\ndef check_visible_toolbar_title(self) -> None:\n    expect(self.toolbar_title).to_be_visible()\n    expect(self.toolbar_title).to_have_text(\"Dashboard\")\n```\n\nДве отдельные проверки: сначала — что заголовок вообще виден, затем — что в нём правильный текст. Обрати внимание, что `check_opened()` и `check_visible_toolbar_title()` — это два разных метода, а не один общий `check_dashboard_page()`. Это тоже осознанное разделение: одна проверка отвечает на вопрос \"мы на нужной странице?\" (по URL), а другая — на вопрос \"на странице отображается ожидаемое содержимое?\" (по заголовку). Разделение по смыслу делает каждый метод маленьким, понятным и пригодным для переиспользования отдельно от другого — например, где-то в другом сценарии может понадобиться проверить только переход, без проверки заголовка.\n\n## Пример\n\nВ тесте эти два метода читаются как два последовательных, но разных по смыслу утверждения:\n\n```python\ndashboard_page.check_opened()\ndashboard_page.check_visible_toolbar_title()\n```\n\nПервая строка: \"мы попали туда, куда нужно\". Вторая строка: \"и там отображается то, что ожидалось\". Тест не знает ни про URL, ни про локатор заголовка, ни про то, что `check_opened()` внутри себя вызывает метод из `BasePage`, — вся эта механика скрыта внутри `DashboardPage`.\n\n## Частые ошибки\n\n- Добавлять в `DashboardPage` метод `open_page()` \"по аналогии с RegistrationPage\" — если в реальных сценариях страница никогда не открывается напрямую, такой метод не нужен: лишний код без применения так же вредит читаемости, как и его нехватка.\n- Сливать `check_opened()` и `check_visible_toolbar_title()` в один метод — это будет работать, но лишит тест возможности использовать одну проверку без другой и усложнит диагностику, если тест упадёт (непонятно сразу, что именно не выполнилось: переход или отрисовка).\n- Писать `expect(page.locator(\"[data-testid='dashboard-toolbar-title-text']\"))` заново внутри `check_visible_toolbar_title()`, вместо использования готового `self.toolbar_title` из конструктора.\n\n## Мини-задание\n\nСравни объём кода `RegistrationPage` (урок 4.13) и `DashboardPage` (этот урок). `DashboardPage` заметно меньше — попробуй сформулировать своими словами, почему это нормально и не является признаком \"недоделанного\" Page Object.\n", "hasPractice": true, "quiz": {"question": "Почему в DashboardPage нет метода open_page(), в отличие от RegistrationPage?", "options": ["Потому что DashboardPage не наследуется от BasePage", "Потому что в сценарии курса пользователь никогда не открывает Dashboard напрямую по URL — он попадает туда только после регистрации", "Потому что открытие страницы по URL в Playwright вообще невозможно", "Потому что метод open() отсутствует в самом BasePage"], "correct": 1, "explain": "Page Object должен содержать только то, что реально используется в сценариях: раз Dashboard в курсе открывается только через переход после регистрации, отдельный метод open_page() ему не нужен."}}, {"id": "p66", "section": "Модуль 4 · Playwright + POM", "subgroup": "Неделя 10", "isOverview": false, "num": "4.15", "title": "Фикстуры для Page Object в conftest.py", "content": "# 4.15. Фикстуры для Page Object в conftest.py\n\n## Зачем это нужно\n\nУ нас уже есть `RegistrationPage` и `DashboardPage`, но если создавать их прямо внутри теста, в тест вернётся техническая подготовка, от которой мы как раз пытались избавиться в уроке 4.11. Фикстуры pytest (модуль 1) и Page Object (уроки 4.12–4.14) вместе закрывают эту проблему — и именно так организован `boilerplate/conftest.py`.\n\n## Теория\n\n### Проблема: создание объектов страниц внутри теста\n\nЕсли бы мы использовали `RegistrationPage` и `DashboardPage` \"в лоб\", тест выглядел бы так:\n\n```python\n@pytest.mark.ui\ndef test_successful_registration(page: Page, user_data: dict[str, str]):\n    registration_page = RegistrationPage(page)\n    dashboard_page = DashboardPage(page)\n\n    registration_page.open_page()\n    ...\n```\n\nКод рабочий, но первые две строки — не действие пользователя и не проверка, а чисто техническая подготовка объектов. Чем больше таких строк накапливается в начале каждого теста, тем сильнее тест отвлекается от описания сценария.\n\n### Решение: фикстуры возвращают готовые объекты страниц\n\nВ модуле 1 мы уже создавали фикстуры, возвращающие данные:\n\n```python\n@pytest.fixture\ndef user_data() -> dict[str, str]:\n    return {...}\n```\n\nТочно так же фикстура может возвращать не данные, а готовый объект класса. В `boilerplate/conftest.py` это выглядит так:\n\n```python\n@pytest.fixture\ndef registration_page(page: Page) -> RegistrationPage:\n    return RegistrationPage(page)\n\n\n@pytest.fixture\ndef dashboard_page(page: Page) -> DashboardPage:\n    return DashboardPage(page)\n```\n\nРазберём сигнатуру `def registration_page(page: Page) -> RegistrationPage`. Параметр `page` — это не наш объект, а встроенная фикстура из плагина `pytest-playwright` (мы пользовались ей ещё в уроке 4.6, просто не через фикстуру, а через ручной запуск `sync_playwright()`). Когда pytest видит, что тесту нужна фикстура `registration_page`, он сначала подготавливает фикстуру `page`, от которой она зависит, и только потом передаёт результат внутрь. Это одна из сильных сторон pytest — **фикстуры могут зависеть друг от друга**, образуя цепочку:\n\n```\npytest-playwright → page → registration_page → RegistrationPage(page)\n```\n\n### Как эти фикстуры используются в тесте\n\nТест из `boilerplate/tests/ui/test_registration.py` получает готовые объекты страниц прямо через параметры функции:\n\n```python\ndef test_successful_registration(\n        self,\n        user_data: dict[str, str],\n        registration_page: RegistrationPage,\n        dashboard_page: DashboardPage,\n):\n```\n\nОбрати внимание: в параметрах теста нет `page` — тест вообще не запрашивает \"сырой\" объект Playwright, потому что вся работа с ним уже упакована внутрь `RegistrationPage` и `DashboardPage`.\n\n### Зачем нужны аннотации типов\n\n```python\nregistration_page: RegistrationPage\n```\n\nНа поиск фикстуры pytest это не влияет — фикстуры ищутся по имени (`registration_page`), а не по типу. Аннотация нужна для IDE: автодополнение методов, подсказки параметров, переход к определению класса. На небольшом проекте это не критично, но при росте кодовой базы такие подсказки экономят много времени — особенно когда Page Object'ов становится десяток и больше.\n\n### Почему фикстура лучше создания объекта в тесте\n\nСравним ещё раз. Было:\n\n```python\nregistration_page = RegistrationPage(page)\ndashboard_page = DashboardPage(page)\n```\n\nСтало:\n\n```python\ndef test_successful_registration(\n        registration_page: RegistrationPage,\n        dashboard_page: DashboardPage,\n):\n```\n\nВо втором варианте тест описывает только сценарий — подготовка объектов спрятана в `conftest.py`, где ей и место. Это тот же принцип, что мы применили к локаторам в уроках 4.12–4.14: техническая деталь вынесена туда, где она нужна один раз, а не туда, где её приходится видеть постоянно.\n\n## Пример\n\nОткрой `boilerplate/conftest.py` целиком — там всего три фикстуры, относящиеся к модулю 4 (плюс отдельно фикстуры для модуля 3 и allure-хук для модуля 5, их пока игнорируй):\n\n```python\n@pytest.fixture\ndef user_data() -> dict[str, str]:\n    return {\n        \"email\": get_random_email(),\n        \"username\": get_random_username(),\n        \"password\": get_random_password(),\n    }\n\n\n@pytest.fixture\ndef registration_page(page: Page) -> RegistrationPage:\n    return RegistrationPage(page)\n\n\n@pytest.fixture\ndef dashboard_page(page: Page) -> DashboardPage:\n    return DashboardPage(page)\n```\n\nИменно к этому файлу ты будешь добавлять фикстуру для своего `LoginPage` в домашнем задании — рядом с уже существующими, а не вместо них.\n\n## Частые ошибки\n\n- Создавать объект страницы внутри тестовой функции \"для простоты\", вместо того чтобы вынести это в фикстуру — работать будет, но это возвращает проблему, которую мы решали в этом уроке.\n- Добавлять фикстуре побочные действия сверх создания объекта (например, сразу вызывать `open_page()` внутри фикстуры) — фикстура `registration_page` в `boilerplate/` только создаёт объект, а открытие страницы остаётся явным действием внутри теста, потому что это часть сценария, а не подготовки.\n- Забывать аннотацию возвращаемого типа у фикстуры — код будет работать и без неё, но IDE перестанет подсказывать методы объекта там, где фикстура используется.\n\n## Мини-задание\n\nОткрой `boilerplate/conftest.py` и найди фикстуру `user_data`. Определи, зависит ли она от фикстуры `page` так же, как `registration_page` и `dashboard_page`, или устроена независимо. Обоснуй разницу тем, что именно возвращает каждая из фикстур.\n", "hasPractice": true, "quiz": {"question": "От какой фикстуры зависит фикстура registration_page в conftest.py boilerplate?", "options": ["От фикстуры user_data", "От фикстуры page, предоставляемой плагином pytest-playwright", "Ни от какой — она создаёт объект RegistrationPage без каких-либо параметров", "От фикстуры dashboard_page"], "correct": 1, "explain": "Сигнатура def registration_page(page: Page) -> RegistrationPage показывает, что фикстура запрашивает встроенную фикстуру page от pytest-playwright и на её основе создаёт объект страницы."}}, {"id": "p67", "section": "Модуль 4 · Playwright + POM", "subgroup": "Неделя 10", "isOverview": false, "num": "4.16", "title": "Добавляем новый Page Object: шаблон на примере LoginPage", "content": "# 4.16. Добавляем новый Page Object: шаблон на примере LoginPage\n\n## Зачем это нужно\n\nЭто последний теоретический урок модуля — и он же самый практический. Дальше домашнее задание попросит тебя сделать ровно то, что мы сейчас разберём: добавить в `boilerplate/pages/` новый Page Object по образцу уже существующих. Здесь мы соберём этот процесс в пошаговый чек-лист на примере `LoginPage` для страницы логина учебного приложения.\n\n## Теория\n\nУ учебного приложения есть страница логина по адресу `.../#/auth/login`. Через DevTools на ней найдены такие `data-testid`:\n\n| Элемент | `data-testid` | Особенность |\n|---|---|---|\n| Поле Email | `login-form-email-input` | на внешнем `div`, `input` вложен внутрь — как в `RegistrationPage` |\n| Поле Password | `login-form-password-input` | так же, `input` вложен внутрь |\n| Кнопка LOGIN | `login-page-login-button` | стоит прямо на `<button>` |\n| Ссылка \"Registration\" | `login-page-registration-link` | стоит прямо на `<a>` |\n\nСтруктура полностью повторяет то, что мы разбирали в уроках 4.3–4.4 для формы регистрации: и `login-form-email-input`, и `login-form-password-input` — это контейнеры, а не сами поля ввода, поэтому в локаторе нужно добавлять `input`. У кнопки и ссылки `data-testid` стоит прямо на элементе, поэтому без уточнения.\n\n### Шаг 1. Создать файл рядом с существующими\n\n```\nboilerplate/pages/login_page.py\n```\n\nНе в отдельной папке, не с другим именованием — рядом с `base_page.py`, `registration_page.py`, `dashboard_page.py`, в том же стиле именования (`snake_case`, суффикс `_page`).\n\n### Шаг 2. Импорты и наследование\n\n```python\nfrom playwright.sync_api import Page, expect\n\nfrom pages.base_page import BasePage\n\n\nclass LoginPage(BasePage):\n    URL = \"https://nikita-filonov.github.io/qa-automation-engineer-ui-course/#/auth/login\"\n```\n\nТот же набор импортов, что у `RegistrationPage` и `DashboardPage`: `Page` для аннотации типа, `expect` для проверок, `BasePage` для наследования. `URL` — атрибут класса, как и в остальных страницах.\n\n### Шаг 3. Конструктор с `super().__init__` и локаторами\n\n```python\n    def __init__(self, page: Page):\n        super().__init__(page)\n\n        self.email_input = page.locator(\"[data-testid='login-form-email-input'] input\")\n        self.password_input = page.locator(\"[data-testid='login-form-password-input'] input\")\n        self.login_button = page.locator(\"[data-testid='login-page-login-button']\")\n```\n\nОбязательный первый вызов — `super().__init__(page)`, иначе `self.page` не появится (урок 4.12). Дальше — локаторы, по одному на каждый нужный элемент, сохранённые в атрибуты, а не пересоздаваемые внутри методов (урок 4.13).\n\n### Шаг 4. Метод открытия страницы\n\n```python\n    def open_page(self) -> None:\n        super().open(self.URL)\n```\n\nВ отличие от `DashboardPage`, здесь метод открытия нужен: пользователь может зайти на страницу логина напрямую.\n\n### Шаг 5. Действия пользователя\n\n```python\n    def fill_login_form(self, email: str, password: str) -> None:\n        self.email_input.fill(email)\n        self.password_input.fill(password)\n\n    def click_login_button(self) -> None:\n        self.login_button.click()\n```\n\nОдин метод на осмысленное действие пользователя — заполнение формы целиком, отдельно клик по кнопке. Так же, как в `RegistrationPage.fill_registration_form()`.\n\n### Шаг 6. Проверки\n\n```python\n    def check_visible_login_form(self) -> None:\n        expect(self.email_input).to_be_visible()\n        expect(self.password_input).to_be_visible()\n        expect(self.login_button).to_be_visible()\n```\n\nПроверка отображения формы — по тому же шаблону, что `check_visible_registration_form()`.\n\n### Итоговый файл\n\n```python\nfrom playwright.sync_api import Page, expect\n\nfrom pages.base_page import BasePage\n\n\nclass LoginPage(BasePage):\n    URL = \"https://nikita-filonov.github.io/qa-automation-engineer-ui-course/#/auth/login\"\n\n    def __init__(self, page: Page):\n        super().__init__(page)\n\n        self.email_input = page.locator(\"[data-testid='login-form-email-input'] input\")\n        self.password_input = page.locator(\"[data-testid='login-form-password-input'] input\")\n        self.login_button = page.locator(\"[data-testid='login-page-login-button']\")\n\n    def open_page(self) -> None:\n        super().open(self.URL)\n\n    def fill_login_form(self, email: str, password: str) -> None:\n        self.email_input.fill(email)\n        self.password_input.fill(password)\n\n    def click_login_button(self) -> None:\n        self.login_button.click()\n\n    def check_visible_login_form(self) -> None:\n        expect(self.email_input).to_be_visible()\n        expect(self.password_input).to_be_visible()\n        expect(self.login_button).to_be_visible()\n```\n\n### Шаг 7. Фикстура в conftest.py\n\nПо образцу урока 4.15, в `boilerplate/conftest.py` добавляется фикстура рядом с уже существующими — не вместо них:\n\n```python\nfrom pages.login_page import LoginPage\n\n\n@pytest.fixture\ndef login_page(page: Page) -> LoginPage:\n    return LoginPage(page)\n```\n\n### Шаг 8. Использование в тесте\n\n```python\n@pytest.mark.ui\ndef test_login_with_valid_credentials(login_page: LoginPage, dashboard_page: DashboardPage):\n    login_page.open_page()\n    login_page.check_visible_login_form()\n    login_page.fill_login_form(email=\"user@example.com\", password=\"password123\")\n    login_page.click_login_button()\n\n    dashboard_page.check_opened()\n```\n\nТест снова не содержит ни одного `page.locator(...)` и ни одного URL — вся техническая часть спрятана внутри `LoginPage` и `DashboardPage`.\n\n## Пример\n\nПолный чек-лист, по которому добавляется любой новый Page Object в этом проекте:\n\n1. Новый файл в `pages/`, имя в `snake_case` с суффиксом `_page`.\n2. Класс наследуется от `BasePage`.\n3. `URL` как атрибут класса (если у страницы есть собственный адрес).\n4. Конструктор начинается с `super().__init__(page)`.\n5. Локаторы создаются один раз в конструкторе и сохраняются в `self.*`.\n6. Один метод — одно осмысленное действие пользователя.\n7. Проверки — отдельными методами, разделёнными по смыслу (переход vs содержимое, как в `DashboardPage`).\n8. Фикстура в `conftest.py`, добавленная рядом с существующими.\n9. Тест использует только методы Page Object, ни одного `page.locator(...)` напрямую.\n\n## Частые ошибки\n\n- Копировать `RegistrationPage` целиком и просто менять названия переменных, не проверив реальные `data-testid` новой страницы через DevTools — на других страницах приложения атрибуты могут называться иначе.\n- Забыть добавить фикстуру в `conftest.py` и создавать `LoginPage(page)` прямо в тесте — это откат к проблеме, которую мы решали в уроке 4.15.\n- Помещать новый файл не в `pages/`, а рядом с тестами или в корень проекта — ломает структуру, которую видят и используют все остальные участники общего репозитория.\n\n## Мини-задание\n\nПрежде чем переходить к домашнему заданию, самостоятельно (без копирования из этого урока) допиши в свой черновик `LoginPage` метод `check_opened`, аналогичный `DashboardPage.check_opened()` из урока 4.14 — с использованием `check_current_url()` из `BasePage`.\n", "hasPractice": true, "quiz": {"question": "Согласно шаблону добавления нового Page Object, куда нужно добавить фикстуру для новой страницы, например LoginPage?", "options": ["В сам файл login_page.py, рядом с классом LoginPage", "В conftest.py, рядом с уже существующими фикстурами registration_page и dashboard_page", "Внутрь тестовой функции, которая использует эту страницу", "В отдельный новый файл fixtures.py, специально созданный для новой страницы"], "correct": 1, "explain": "Фикстуры для Page Object в этом проекте живут в conftest.py — новую фикстуру login_page нужно добавить туда же, рядом с уже существующими registration_page и dashboard_page, а не заводить для неё отдельное место."}}, {"id": "p68", "section": "Модуль 4 · Playwright + POM", "subgroup": "Неделя 10", "isOverview": false, "num": "4.17", "title": "Домашнее задание", "content": "# 4.17. Домашнее задание\n\n## Формулировка\n\nОткрой PR в свой форк общего репозитория (`boilerplate/`) с 2–3 новыми UI-тестами на Playwright. Тесты должны работать через Page Object по образцу `RegistrationPage`/`DashboardPage` (уроки 4.12–4.14), а не через голые вызовы `page.locator(...)` внутри теста.\n\nМинимальный набор изменений:\n\n1. **Добавь новый Page Object.** Проще всего — `LoginPage` для страницы `.../#/auth/login`, по шаблону из урока 4.16. Класс должен наследоваться от `BasePage`, хранить `URL`, создавать локаторы в конструкторе через `super().__init__(page)` и содержать отдельные методы-действия (`open_page`, `fill_login_form`, `click_login_button`) и метод-проверку (`check_visible_login_form`).\n2. **Добавь фикстуру `login_page`** в `boilerplate/conftest.py`, рядом с уже существующими `registration_page`/`dashboard_page`, по образцу урока 4.15.\n3. **Напиши 2–3 UI-теста** в `tests/ui/` (можно новый файл `test_login.py`, можно дополнить `test_registration.py` — смотри по смыслу сценария). Как минимум один тест должен быть happy path, как минимум один — негативный сценарий.\n\n### Из чего выбрать сценарии\n\nНиже — варианты, поведение которых мы заранее проверили вручную на реальном приложении, чтобы домашнее задание не строилось на догадках о том, как оно себя ведёт.\n\n**Happy path: логин после регистрации.** У приложения нет заранее созданных тестовых пользователей — единственный способ получить рабочие email/пароль для логина — сначала зарегистрироваться. Сценарий: зарегистрировать нового пользователя через `registration_page` (как в `test_registration.py`), разлогиниться, затем залогиниться этими же данными через `login_page` и проверить, что снова открылся Dashboard.\n\n**Негативный сценарий №1: регистрация с уже занятым email.** Если отправить форму регистрации с email, который уже зарегистрирован, приложение **не переходит на Dashboard** — URL остаётся `.../#/auth/registration`, а над формой появляется предупреждение с текстом `User already exists` (у него есть собственный `data-testid=\"registration-page-user-already-exists-alert\"` — найдёшь его в DevTools так же, как в уроке 4.2). Тест: зарегистрировать пользователя один раз, затем повторить регистрацию с тем же email (и любым другим username) и проверить, что появилось это предупреждение, а URL не изменился.\n\n**Негативный сценарий №2: валидация пустой формы.** Если открыть страницу регистрации и ничего не заполнять, кнопка `Registration` находится в заблокированном состоянии (атрибут `disabled`). Тест: открыть страницу регистрации и проверить через `expect(registration_button).to_be_disabled()`, что кнопка неактивна, пока форма не заполнена (это же можно проверить и для `LoginPage`, если её кнопка ведёт себя аналогично — проверь вручную перед тем, как писать тест).\n\nВыбери любые 2–3 сценария из перечисленных (или похожие по духу) — необязательно реализовывать все три.\n\n### Allure\n\nВ существующих тестах (`test_registration.py`) уже используются `@allure.epic`, `@allure.feature`, `@allure.title` на уровне класса/теста и `allure.step(...)` внутри теста. Подробно Allure разберём в модуле 5, но декоратор и шаги уже нужны в этом домашнем задании — bери `test_registration.py` как образец оформления, не изобретая новый стиль.\n\n## Критерии \"готово\"\n\n- [ ] Новый Page Object (например, `LoginPage`) добавлен в `pages/`, наследуется от `BasePage` по образцу `RegistrationPage`/`DashboardPage` — не переизобретает архитектуру заново.\n- [ ] Локаторы созданы один раз в конструкторе и сохранены в атрибуты `self.*`, а не пересоздаются внутри методов.\n- [ ] Фикстура для нового Page Object добавлена в `conftest.py` рядом с существующими (`registration_page`, `dashboard_page`).\n- [ ] Есть минимум 2 новых UI-теста, среди них — минимум один явно негативный сценарий (не только happy path).\n- [ ] Все тесты используют `@pytest.mark.ui` и `allure.step(...)` внутри теста (по образцу `test_registration.py`).\n- [ ] Ни один тест не содержит `page.locator(...)` напрямую — только вызовы методов Page Object.\n- [ ] `pytest -m ui -v` проходит локально зелёным целиком, включая уже существовавший до тебя `test_registration.py`.\n- [ ] PR открыт в общий репозиторий, в описании — что сделано и как проверить (см. правила PR в `boilerplate/README.md`).\n\n## Что не входит в это домашнее задание\n\n- Подробная работа с Allure-отчётами (вложения, категории, окружение) — это модуль 5. Здесь достаточно декораторов и шагов на уровне, который уже есть в `test_registration.py`.\n- CI — модуль 6. Проверяй тесты локально, зелёный пайплайн для этого PR пока не обязателен.\n- Попапы и нативные диалоги браузера (урок 4.9) — в текущих сценариях учебного приложения их нет, специально их встраивать в домашнее задание не нужно.\n", "hasPractice": false}, {"id": "p69", "section": "Модуль 4 · Playwright + POM", "subgroup": "Неделя 8", "isOverview": false, "num": "4.1", "title": "HTML и DOM: как устроена веб-страница", "content": "# 4.1. HTML и DOM: как устроена веб-страница\n\n## Зачем это нужно\n\nЧерез несколько уроков ты начнёшь писать код, который открывает страницу, находит на ней поле `Email` и вводит туда текст. Чтобы код мог найти это поле, он должен понимать страницу не так, как её понимает человек (\"вижу поле сверху слева\"), а так, как её понимает браузер — как структуру элементов. Без этого понимания локаторы в следующих уроках будут выглядеть как магические заклинания, а не как логичные конструкции.\n\n## Теория\n\n**HTML** — язык разметки, который описывает, из каких элементов состоит страница. Он не отвечает за поведение теста, только за структуру: где кнопка, где поле ввода, где текст.\n\nУпрощённая форма регистрации в HTML:\n\n```html\n<form>\n    <input type=\"email\" name=\"email\" />\n    <input type=\"text\" name=\"username\" />\n    <input type=\"password\" name=\"password\" />\n    <button>Registration<\/button>\n<\/form>\n```\n\nЗдесь `<form>` — это форма, `<input>` — поле ввода, `<button>` — кнопка. У каждого тега могут быть **атрибуты** — дополнительная информация об элементе:\n\n```html\n<input type=\"email\" name=\"email\" placeholder=\"Email\" />\n```\n\n`type=\"email\"` говорит, что поле для email, `name=\"email\"` отличает это поле от других. Атрибуты — это то, за что в первую очередь будут цепляться наши локаторы.\n\nМы не изучаем вёрстку и не разбираем все теги HTML — для автоматизации достаточно узнавать в разметке несколько повторяющихся вещей: поля форм (`input`, `textarea`, `select`), кнопки (`button`), ссылки (`a`), тексты и заголовки (`p`, `span`, `h1`–`h6`), контейнеры (`div`, `section`) и специальные тестовые атрибуты.\n\n**DOM (Document Object Model)** — это внутренняя модель страницы, которую браузер строит на основе HTML. DOM представляет страницу как дерево объектов: каждый элемент HTML становится узлом этого дерева, с которым можно работать программно — искать, читать текст, кликать, вводить данные.\n\nНаша форма в виде дерева:\n\n```\nform\n├── input type=\"email\" name=\"email\"\n├── input type=\"text\" name=\"username\"\n├── input type=\"password\" name=\"password\"\n└── button \"Registration\"\n```\n\nКогда мы пишем:\n\n```python\npage.locator(\"input[name='email']\").fill(\"user@example.com\")\n```\n\nмы не говорим браузеру \"найди красивое поле слева сверху\". Мы даём точное техническое указание: \"найди в DOM элемент `input`, у которого атрибут `name` равен `email`, и введи в него текст\". Playwright всегда работает именно с DOM-деревом, а не с картинкой на экране.\n\n### Атрибуты, которые важны для автотестов\n\n- `id` — уникальный идентификатор, хорош, если не сгенерирован автоматически (`id=\"mui-12345\"` — плохой пример).\n- `name` — часто встречается у полей форм, хорошо подходит для локаторов.\n- `class` — обычно про стили, часто автогенерируется сборщиками (`class=\"css-1a2b3c\"`) и не годится для стабильных тестов.\n- `data-testid` (и его варианты `data-test-id`, `data-qa`, `qa-id`) — атрибут, который разработчики добавляют специально для автотестов. Не влияет на вёрстку и обычно не меняется при рефакторинге — лучший кандидат для локатора.\n- `role`, `aria-*` — атрибуты доступности, тоже пригодны для поиска элементов.\n\n## Пример\n\nТри поля формы регистрации выглядят в HTML почти одинаково — все они `input` — но у каждого свой набор атрибутов:\n\n```html\n<input type=\"email\" name=\"email\" />\n<input type=\"text\" name=\"username\" />\n<input type=\"password\" name=\"password\" />\n```\n\nИменно атрибуты позволяют тесту отличить одно поле от другого, хотя тег `input` у них общий.\n\n## Частые ошибки\n\n- Пытаться выучить все теги HTML и правила вёрстки — для автотестов это лишнее, нужен только практический минимум для поиска элементов.\n- Путать тег (`<button>`) и элемент целиком (`<button>Registration<\/button>`) — на практике разница не критична, но полезно понимать оба термина.\n- Строить локаторы по автогенерированным `class` или `id`, не проверив, стабильны ли они между запусками.\n\n## Мини-задание\n\nОткрой любую веб-страницу (например, github.com), нажми правой кнопкой мыши на любую кнопку и выбери \"Просмотреть код\" / \"Inspect\". Найди в открывшемся HTML: тег элемента, хотя бы два его атрибута и текст внутри тега. Не ищи ничего в DevTools специально — просто зафиксируй, что видишь.\n", "hasPractice": true, "quiz": {"question": "Какой атрибут HTML-элемента считается наиболее стабильным для построения локатора в автотестах?", "options": ["class", "автоматически сгенерированный id (например, id=\"mui-12345\")", "data-testid", "style"], "correct": 2, "explain": "data-testid добавляется разработчиками специально для автотестов, не влияет на вёрстку и обычно не меняется при рефакторинге стилей или структуры страницы."}}, {"id": "p70", "section": "Модуль 4 · Playwright + POM", "subgroup": "Неделя 8", "isOverview": false, "num": "4.2", "title": "DevTools: смотрим на страницу глазами браузера", "content": "# 4.2. DevTools: смотрим на страницу глазами браузера\n\n## Зачем это нужно\n\nПеред тем как писать локаторы, их нужно откуда-то взять. В реальной работе QA automation engineer не угадывает локаторы и не гуглит их — он открывает страницу, смотрит на её HTML-структуру через инструменты разработчика и сам решает, по какому атрибуту искать элемент. Это один из самых частых действий в повседневной работе, и его стоит довести до автоматизма.\n\n## Теория\n\n**DevTools** (Developer Tools) — встроенный набор инструментов браузера. Он есть в Chrome, Edge, Brave, Opera, Firefox — во всех современных браузерах, устроен похоже. Мы будем использовать DevTools в первую очередь для поиска элементов и построения локаторов, хотя инструмент умеет намного больше: смотреть сетевые запросы, ошибки JavaScript, стили CSS.\n\n### Как открыть DevTools\n\n- Клавиша **F12**.\n- Горячие клавиши: `Ctrl + Shift + I` (Windows/Linux), `Cmd + Option + I` (macOS).\n- Через контекстное меню: клик правой кнопкой по элементу страницы → **Inspect** (или **Просмотреть код**). Этот способ удобнее всего, когда нужно быстро найти конкретный элемент — DevTools сразу откроется на нужном месте дерева.\n\n### Вкладка Elements\n\nПосле открытия DevTools переходи на вкладку **Elements** — там показано DOM-дерево страницы, то есть та самая структура, о которой шла речь в прошлом уроке. Дерево может выглядеть громоздким — это нормально, не нужно понимать в нём каждую строку. Достаточно уметь находить нужные элементы и читать их атрибуты.\n\nПолезная функция DevTools — подсветка при наведении: если навести курсор на узел в дереве, браузер подсветит соответствующий элемент на странице, и наоборот — клик правой кнопкой по элементу на странице и выбор Inspect откроет DevTools ровно на этом узле.\n\n### Автоматический селектор — не панацея\n\nDevTools умеет копировать готовый селектор элемента (клик правой кнопкой по узлу в дереве → **Copy** → **Copy selector** / **Copy XPath**). Это полезно для быстрого исследования страницы, но браузер не знает, какой из атрибутов элемента стабилен, а какой сгенерирован автоматически — поэтому такие селекторы часто получаются длинными, привязанными к структуре вёрстки и хрупкими. В следующем уроке разберём, как выбирать локатор осознанно, а не копировать первое, что предложил браузер.\n\n## Пример\n\nОткрой страницу регистрации учебного приложения: `https://nikita-filonov.github.io/qa-automation-engineer-ui-course/#/auth/registration`.\n\n1. Открой DevTools (F12).\n2. Перейди на вкладку Elements.\n3. Кликни правой кнопкой по полю Email на странице → Inspect.\n4. Посмотри, какие атрибуты видны у элемента и у его родителя — обрати внимание на `data-testid`, `type`, `name`.\n\nПовтори то же самое для поля Password и кнопки Registration.\n\n## Частые ошибки\n\n- Пытаться прочитать и понять весь HTML-документ целиком вместо того, чтобы искать конкретный элемент через Inspect.\n- Слепо копировать `Copy selector` из DevTools в тест, не проверив, не завязан ли он на автогенерированный класс или порядковый номер `div`.\n- Искать элемент во вкладке **Elements**, забыв, что там отображается текущее состояние DOM, которое может отличаться от исходного HTML-файла (JS мог изменить страницу после загрузки).\n\n## Мини-задание\n\nНа странице регистрации учебного приложения (`.../#/auth/registration`) через Inspect найди все три поля формы (Email, Username, Password) и кнопку Registration. Для каждого элемента выпиши в блокнот (или заметку), какой атрибут выглядит наиболее стабильным для локатора — пока не пиши сам локатор, просто определи атрибут-кандидат.\n", "hasPractice": true, "quiz": {"question": "Почему локатор, скопированный через DevTools (Copy selector), часто оказывается плохим выбором для автотеста?", "options": ["DevTools не умеет копировать локаторы для кнопок", "Такой локатор часто завязан на структуру вёрстки или автогенерированные классы и легко ломается при её изменении", "Playwright не поддерживает локаторы, скопированные из DevTools", "Copy selector работает только в Firefox"], "correct": 1, "explain": "Браузер не знает, какой атрибут элемента стабилен, поэтому автоматически предложенный селектор часто получается длинным и привязанным к порядку div'ов или сгенерированным классам."}}, {"id": "p71", "section": "Модуль 4 · Playwright + POM", "subgroup": "Неделя 8", "isOverview": false, "num": "4.3", "title": "CSS-локаторы", "content": "# 4.3. CSS-локаторы\n\n## Зачем это нужно\n\nВся UI-автоматизация сводится к двум действиям: найти элемент и что-то с ним сделать (кликнуть, ввести текст, проверить состояние). Про \"что-то сделать\" мы поговорим на неделе 9. Сейчас — про \"найти элемент\", и это самый важный навык UI Automation Engineer, потому что без него ни одно действие и ни одна проверка не сработают.\n\n## Теория\n\n**Локатор** — это описание элемента, по которому Playwright находит его на странице. Можно представить локатор как адрес: как человек ищет дом по адресу, так Playwright ищет элемент по локатору.\n\n```python\npage.locator(\"[data-testid='registration-page-registration-button']\")\n```\n\nЭта строка означает: \"найди элемент, у которого атрибут `data-testid` равен `registration-page-registration-button`\". После того как элемент найден, с ним можно работать:\n\n```python\npage.locator(\"[data-testid='registration-page-registration-button']\").click()\n```\n\nОдин из самых распространённых способов описывать локаторы — **CSS-локаторы** (CSS-селекторы). Не пугайся слова CSS: нам не нужно изучать CSS как язык стилизации, нужен только его синтаксис поиска элементов по тегу, атрибутам, классам, `id` и вложенности.\n\n### Простейшие CSS-локаторы\n\nПоиск по тегу — находит все элементы этого тега сразу:\n\n```python\npage.locator(\"input\")   # все поля ввода\npage.locator(\"button\")  # все кнопки\n```\n\nНа практике такие локаторы почти не используются — на странице обычно несколько кнопок и полей, а тесту нужен конкретный элемент.\n\nПоиск по атрибуту — намного полезнее:\n\n```python\npage.locator(\"input[name='email']\")\n```\n\nЧитается как: \"найди тег `input`, у которого атрибут `name` равен `email`\".\n\nМожно вообще не указывать тег:\n\n```python\npage.locator(\"[data-testid='email-input']\")\n```\n\nЭто значит: \"найди любой элемент с атрибутом `data-testid='email-input'`\". Такая запись — один из самых частых видов локаторов в реальных проектах.\n\n### Поиск вложенных элементов\n\nИногда нужный элемент находится внутри другого. Например, в React-приложениях (и в нашем учебном приложении тоже) `data-testid` часто ставят на внешний контейнер, а не на сам `input`:\n\n```html\n<div data-testid=\"registration-form-email-input\">\n    <input type=\"text\">\n<\/div>\n```\n\nЧтобы получить именно `<input>`, а не внешний `<div>`, между двумя частями локатора ставится пробел:\n\n```python\npage.locator(\"[data-testid='registration-form-email-input'] input\")\n```\n\nПробел означает \"внутри\". Читается так: \"найди элемент с этим `data-testid`, а внутри него — тег `input`\".\n\n### Какие атрибуты выбирать, а какие — нет\n\nХорошие кандидаты для локатора:\n\n- **`data-testid`** — лучший вариант. Добавляется специально для автотестов, не влияет на вёрстку, обычно не меняется при рефакторинге.\n- **`id`**, если он осмысленный и стабильный (`id=\"registration-button\"`, а не `id=\"mui-12345\"`).\n- **`name`** — часто встречается в формах: `input[name=\"email\"]`.\n\nПлохие кандидаты:\n\n- Автогенерированные классы: `class=\"css-1ruewdp\"`.\n- Автогенерированные `id`: `id=\"mui-12345\"`, `id=\":rd:\"` (в нашем учебном приложении поля формы как раз используют такие динамические `id` — поэтому мы их не используем).\n- Длинные цепочки вложенности: `div > div > div > button` или `.MuiContainer-root .MuiGrid2-root .MuiButton-root` — любое изменение вёрстки их ломает.\n\nКроме CSS существуют и **XPath-локаторы** — другой популярный синтаксис (например, поиск по тексту `//button[text()=\"Registration\"]`). В этом курсе мы сознательно остаёмся на CSS-локаторах и `data-testid`: для нашего учебного приложения этого достаточно, а локаторы получаются короче и понятнее. Если продолжишь развиваться в UI-автоматизации, с XPath ты обязательно познакомишься отдельно.\n\n## Пример\n\nДля страницы регистрации нашего учебного приложения локаторы полей строятся с уточнением `input`, потому что `data-testid` стоит на контейнере:\n\n```python\npage.locator(\"[data-testid='registration-form-email-input'] input\")\npage.locator(\"[data-testid='registration-form-username-input'] input\")\npage.locator(\"[data-testid='registration-form-password-input'] input\")\n```\n\nА для кнопки регистрации `data-testid` стоит прямо на `<button>`, поэтому уточнение не нужно:\n\n```python\npage.locator(\"[data-testid='registration-page-registration-button']\")\n```\n\nИменно эти локаторы позже войдут в `RegistrationPage` (`boilerplate/pages/registration_page.py`) — можешь свериться, они совпадают дословно.\n\n## Частые ошибки\n\n- Забыть пробел перед `input`, когда `data-testid` стоит на внешнем контейнере — локатор не найдёт элемент или найдёт не тот.\n- Строить локатор по классу, не проверив в DevTools, не сгенерирован ли он автоматически.\n- Использовать слишком общий локатор (`page.locator(\"button\")`) там, где на странице несколько кнопок — Playwright either найдёт \"не ту\" кнопку, либо, если используется `expect()`, сообщит об ошибке из-за нескольких совпадений.\n\n## Мини-задание\n\nОткрой страницу Dashboard учебного приложения (`.../#/dashboard`) в DevTools и найди заголовок `Dashboard`. Определи, на каком именно теге стоит атрибут `data-testid`, и напиши CSS-локатор для этого заголовка самостоятельно, не подглядывая в следующий урок.\n", "hasPractice": true, "quiz": {"question": "Что означает пробел в CSS-локаторе [data-testid='registration-form-email-input'] input?", "options": ["Локатор содержит синтаксическую ошибку", "Нужно искать элемент, у которого одновременно два указанных атрибута", "Нужно найти тег input внутри элемента с этим data-testid", "Нужно найти элемент, соседний с указанным data-testid"], "correct": 2, "explain": "Пробел в CSS-локаторе означает поиск вложенного элемента: сначала находится контейнер с этим data-testid, а затем внутри него — тег input."}}, {"id": "p72", "section": "Модуль 4 · Playwright + POM", "subgroup": "Неделя 8", "isOverview": false, "num": "4.4", "title": "Локаторы учебного приложения", "content": "# 4.4. Локаторы учебного приложения\n\n## Зачем это нужно\n\nПрежде чем на неделе 9 писать первый код на Playwright, полезно заранее знать все локаторы, которые понадобятся для сценария регистрации. Это стандартная практика: перед автоматизацией сценария сначала вручную (глазами и через DevTools) проходишь его шаги и выписываешь локаторы, а уже потом садишься писать код.\n\n## Теория\n\nНаш первый сценарий — регистрация нового пользователя:\n\n1. Открыть страницу регистрации.\n2. Заполнить Email.\n3. Заполнить Username.\n4. Заполнить Password.\n5. Нажать кнопку Registration.\n6. Дождаться перехода на Dashboard.\n7. Убедиться, что регистрация прошла успешно.\n\nДля этого нам нужно уметь находить: поле Email, поле Username, поле Password, кнопку Registration, а после перехода — заголовок страницы Dashboard.\n\n### Поля формы регистрации\n\nУ всех трёх полей одна и та же особенность: `data-testid` стоит не на самом `<input>`, а на его внешнем контейнере:\n\n```html\n<div data-testid=\"registration-form-email-input\">\n    ...\n<\/div>\n```\n\nПоэтому локатор всегда состоит из двух частей — контейнер и вложенный `input`:\n\n```python\npage.locator(\"[data-testid='registration-form-email-input'] input\")\npage.locator(\"[data-testid='registration-form-username-input'] input\")\npage.locator(\"[data-testid='registration-form-password-input'] input\")\n```\n\n### Кнопка Registration\n\nЗдесь `data-testid` расположен прямо на `<button>`, поэтому дополнительный `input` не нужен:\n\n```python\npage.locator(\"[data-testid='registration-page-registration-button']\")\n```\n\n### Заголовок Dashboard\n\nПосле успешной регистрации приложение перенаправляет на `.../#/dashboard`. Убедиться, что это действительно произошло, можно двумя способами: проверить URL и проверить заголовок страницы. Заголовок в HTML выглядит так:\n\n```html\n<h6 data-testid=\"dashboard-toolbar-title-text\">\n    Dashboard\n<\/h6>\n```\n\nЛокатор:\n\n```python\npage.locator(\"[data-testid='dashboard-toolbar-title-text']\")\n```\n\n### Почему именно `data-testid`\n\nУ элементов есть множество атрибутов — `class`, `id`, `type`, `role`, `aria-*`. Технически можно построить локатор почти по любому из них. Но в нашем приложении разработчики специально подготовили `data-testid` для каждого важного элемента — это самый стабильный вариант, и именно на него мы будем опираться на протяжении всего курса. Такой подход широко распространён и в реальных проектах.\n\n## Пример\n\nСводная таблица локаторов, с которыми мы будем работать в следующих уроках:\n\n| Элемент | Локатор |\n|---|---|\n| Email | `[data-testid='registration-form-email-input'] input` |\n| Username | `[data-testid='registration-form-username-input'] input` |\n| Password | `[data-testid='registration-form-password-input'] input` |\n| Кнопка Registration | `[data-testid='registration-page-registration-button']` |\n| Заголовок Dashboard | `[data-testid='dashboard-toolbar-title-text']` |\n\nДержи эту таблицу под рукой — именно эти локаторы уже используются в готовых `RegistrationPage` и `DashboardPage` в `boilerplate/pages/`, и на неделе 10 мы разберём их построчно.\n\n## Частые ошибки\n\n- Пропустить `input` в локаторе поля формы, потому что визуально контейнер и поле выглядят как один элемент.\n- Спутать локатор заголовка Dashboard с локатором самой кнопки Registration — легко перепутать, если не смотреть в DevTools, а копировать по памяти.\n- Проверять только URL после регистрации и не проверять, что страница реально отрисовалась (заголовок виден) — если приложение \"зависло\" на пустом экране, проверка URL всё равно пройдёт.\n\n## Мини-задание\n\nОткрой учебное приложение и вручную (мышкой) пройди весь сценарий: заполни форму регистрации любыми данными и нажми Registration. После перехода на Dashboard через DevTools убедись, что локатор `[data-testid='dashboard-toolbar-title-text']` из таблицы выше действительно указывает на видимый заголовок \"Dashboard\".\n", "hasPractice": true, "quiz": {"question": "Почему локатор кнопки [data-testid='registration-page-registration-button'] не требует добавления input в конце, в отличие от локаторов полей формы?", "options": ["Потому что кнопки в этом приложении вообще не нужно искать точно", "Потому что data-testid у кнопки стоит прямо на теге <button>, а не на внешнем контейнере", "Потому что Playwright автоматически ищет кнопки без уточнения тега", "Потому что у кнопки нет атрибута data-testid"], "correct": 1, "explain": "У полей формы data-testid расположен на внешнем div-контейнере, поэтому нужен дополнительный поиск input внутри него; у кнопки data-testid стоит прямо на элементе <button>, уточнение не требуется."}}, {"id": "p73", "section": "Модуль 4 · Playwright + POM", "subgroup": "Неделя 8", "isOverview": false, "num": "4.5", "title": "Что такое Playwright и зачем он нужен", "content": "# 4.5. Что такое Playwright и зачем он нужен\n\n## Зачем это нужно\n\nВсё, что мы делали на этой неделе — HTML, DOM, DevTools, локаторы — было подготовкой к тому, чтобы понимать, с чем работает инструмент автоматизации. Теперь пора познакомиться с самим инструментом, который будет открывать браузер, находить элементы по нашим локаторам и выполнять действия. В этом курсе это [Playwright](https://playwright.dev/python/).\n\n## Теория\n\n**Playwright** — библиотека для автоматизации браузеров. Из Python-кода она умеет открывать страницы, находить элементы, вводить текст, кликать по кнопкам и проверять результат — то есть выполнять программно те же действия, которые обычно делает руками пользователь.\n\nНапример, пользователь открывает страницу регистрации, заполняет Email, Username, Password, нажимает Registration и видит Dashboard. Для Playwright это последовательность команд: открыть страницу → найти поле → ввести текст → найти кнопку → кликнуть → проверить результат. Именно такую последовательность мы соберём в следующих уроках.\n\n### Как это устроено в общих чертах\n\nПочти любой сценарий на Playwright строится по одной схеме:\n\n1. Запустить браузер.\n2. Открыть нужную страницу по URL.\n3. Найти элементы через локаторы.\n4. Выполнить действия (ввод текста, клики).\n5. Проверить, что приложение отработало правильно.\n\nЛокатор поля Email мы уже знаем с прошлой недели:\n\n```python\npage.locator(\"[data-testid='registration-form-email-input'] input\")\n```\n\nНа прошлой неделе это была просто строка из урока про CSS-локаторы. Теперь она станет частью настоящего кода на Playwright.\n\n### Какой браузер используем\n\nPlaywright умеет управлять разными браузерами, в курсе мы используем **Chromium** — движок, на котором построены Chrome, Edge, Brave и другие. Запуск браузера выглядит так:\n\n```python\nbrowser = p.chromium.launch(headless=False)\n```\n\nПока не нужно разбирать эту строку целиком — в следующем уроке пройдёмся по каждой части. Важно понять главное: эта команда запускает браузер, которым дальше управляет Playwright.\n\n### Что значит `headless=False`\n\nПараметр `headless=False` означает, что браузер откроется в обычном видимом окне — ты своими глазами увидишь, как Playwright заполняет поля и нажимает кнопки. Это удобно на старте: не нужно гадать, что происходит внутри теста.\n\nКогда тесты уже стабильны, их часто запускают в `headless`-режиме — без видимого окна. Это удобно для серверов и CI/CD (об этом — в модуле 6), но пока видимый браузер понятнее.\n\n## Пример\n\nПока у нас нет кода — только идея. В следующем уроке (4.6) мы напишем первый рабочий скрипт, который запускает Chromium, открывает вкладку и закрывает браузер. Это и станет первым практическим применением всего, что мы обсудили.\n\n## Частые ошибки\n\n- Ожидать, что Playwright \"видит\" страницу так же, как человек — на самом деле он всегда работает через DOM и локаторы, а не через распознавание картинки.\n- Путать Playwright с расширением браузера или инструментом для вёрстки — это библиотека
