м конце."}, {"question": "Почему нельзя надёжно удалять элементы из списка прямо во время итерации по нему в цикле for?", "options": ["Python выбросит SyntaxError", "Такой цикл выполнится в обратном порядке", "Индексы элементов сдвигаются при удалении, и часть элементов будет пропущена непредсказуемым образом", "Список автоматически станет неизменяемым во время выполнения цикла"], "correct": 2, "explain": "При удалении элемента список сдвигается, а цикл продолжает использовать старые позиции — из-за этого часть элементов может быть пропущена без предупреждения."}], "exercise": {"prompt": "Дан список response_codes. Напиши функцию successful_codes(response_codes), которая через генератор списков возвращает только коды из диапазона [200; 299]. Напиши функцию format_errors_with_index(response_codes), которая обычным циклом for с enumerate() возвращает список строк 'index: code' для кодов >= 400.", "starter": "def successful_codes(response_codes):\n    # верни список кодов из диапазона [200; 299] (используй генератор списков)\n    pass\n\n\ndef format_errors_with_index(response_codes):\n    # верни список строк \"index: code\" для элементов с кодом >= 400\n    # используй обычный цикл for с enumerate()\n    pass\n", "tests": "def test_successful_codes():\n    codes = [200, 404, 200, 500, 301, 200, 403]\n    assert successful_codes(codes) == [200, 200, 200], \"должны остаться только коды из диапазона [200; 299]\"\n\n\ndef test_successful_codes_empty():\n    assert successful_codes([404, 500, 301]) == [], \"если успешных кодов нет, должен вернуться пустой список\"\n\n\ndef test_format_errors_with_index():\n    codes = [200, 404, 200, 500, 301, 200, 403]\n    result = format_errors_with_index(codes)\n    assert result == [\"1: 404\", \"3: 500\", \"6: 403\"], f\"ожидались строки с индексом и кодом >= 400, получено {result}\"\n\n\ndef test_format_errors_with_index_none():\n    assert format_errors_with_index([200, 201, 204]) == [], \"если ошибок нет, список должен быть пустым\"\n"}}, {"id": "p12", "section": "Модуль 0 · Python-база", "subgroup": "Неделя 1", "isOverview": false, "num": "0.7", "title": "Словари, кортежи и множества", "content": "# 0.7. Словари, кортежи и множества\n\n## Зачем это нужно\n\nТело JSON-ответа API — это, по сути, словарь Python (мы явно свяжем это в модуле 3, но структура та же уже сейчас). Кортежи используются там, где данные не должны меняться (например, фиксированные тестовые константы), а множества — там, где важна уникальность и быстрая проверка \"есть ли значение в наборе\". Без этих трёх коллекций читать реальный тестовый код будет тяжело.\n\n## Теория\n\n### Словари (dict)\n\nАссоциативный массив: значения хранятся не по числовому индексу, а по ключу.\n\n```python\nuser = {\"id\": 1, \"username\": \"ivan\", \"is_active\": True}\nuser[\"username\"]           # 'ivan'\nuser[\"email\"]              # KeyError! такого ключа нет\nuser.get(\"email\")          # None — безопасный доступ, без ошибки\nuser.get(\"email\", \"n/a\")   # 'n/a' — значение по умолчанию\n```\n\nКлючами могут быть только неизменяемые типы (строки, числа, кортежи), значениями — что угодно. Словарь — изменяемый тип: можно добавлять, менять и удалять пары ключ-значение:\n\n```python\nuser[\"email\"] = \"ivan@example.com\"   # добавили новый ключ\ndel user[\"is_active\"]                 # удалили ключ\n```\n\nПеребор словаря чаще всего делают так:\n\n```python\nfor key, value in user.items():\n    print(key, value)\n```\n\nПолезные методы: `.keys()`, `.values()`, `.items()`, `.get(key, default)`, `.update(other_dict)`.\n\n### Кортежи (tuple)\n\nКак список, но **неизменяемый**:\n\n```python\npoint = (10, 20)\npoint[0] = 5   # ошибка — кортеж нельзя менять\n```\n\nЗачем нужны, если есть списки? Во-первых, неизменяемость иногда — гарантия, что данные случайно не испортят по ходу программы. Во-вторых, кортеж (в отличие от списка) можно использовать как ключ словаря. В-третьих, функция может вернуть сразу несколько значений именно через кортеж:\n\n```python\ndef get_min_max(numbers):\n    return min(numbers), max(numbers)   # неявно создаётся кортеж\n\nlow, high = get_min_max([3, 1, 4, 1, 5])\n```\n\n### Множества (set)\n\nНеупорядоченная коллекция **уникальных** значений:\n\n```python\ncities = {\"Moscow\", \"Tver\", \"Moscow\", \"Ufa\"}\nprint(cities)   # {'Moscow', 'Tver', 'Ufa'} — дубликат исчез\n```\n\nОтличный инструмент, чтобы быстро убрать дубликаты из списка: `unique = set(some_list)`. Поддерживает операции пересечения (`&`), объединения (`|`) и разности (`-`) — удобно, например, сравнить, какие тестовые ID есть в одном прогоне, но отсутствуют в другом.\n\nПустое множество нельзя создать через `{}` — это создаст словарь. Нужно писать `set()`.\n\n### Comprehension для множеств и словарей\n\nПо аналогии со списками:\n\n```python\nunique_lengths = {len(city) for city in cities}          # множество\nlengths_by_city = {city: len(city) for city in cities}   # словарь\n```\n\n## Пример\n\n```python\nresponse = {\n    \"status\": \"ok\",\n    \"data\": {\"id\": 1, \"name\": \"Test User\"},\n    \"errors\": [],\n}\n\nprint(response.get(\"status\"))              # ok\nprint(response.get(\"message\", \"no message\"))  # no message — ключа нет, но ошибки не будет\n\nuser_ids_run_1 = {1, 2, 3, 4}\nuser_ids_run_2 = {3, 4, 5, 6}\n\nmissing_in_run_2 = user_ids_run_1 - user_ids_run_2\nprint(missing_in_run_2)   # {1, 2}\n\nSTATUS_LABELS = {\n    200: \"OK\",\n    404: \"Not Found\",\n    500: \"Server Error\",\n}\nprint(STATUS_LABELS.get(403, \"Unknown status\"))  # Unknown status\n```\n\n## Частые ошибки\n\n- Обращаться к несуществующему ключу через `d[key]` вместо безопасного `d.get(key)` — падает `KeyError` там, где можно было аккуратно обработать отсутствие значения.\n- Пытаться создать пустое множество через `{}` — получится словарь.\n- Пытаться изменить кортеж и удивляться ошибке — это его основное назначение.\n- Полагаться на порядок элементов множества — `set` не гарантирует порядок (в отличие от списка и, начиная с Python 3.7, словаря).\n\n## Домашнее задание\n\nДан список результатов тестового прогона в виде списка словарей:\n\n```python\nrun_results = [\n    {\"test\": \"test_login\", \"status\": \"passed\", \"duration_ms\": 120},\n    {\"test\": \"test_logout\", \"status\": \"passed\", \"duration_ms\": 95},\n    {\"test\": \"test_registration\", \"status\": \"failed\", \"duration_ms\": 340},\n    {\"test\": \"test_password_reset\", \"status\": \"failed\", \"duration_ms\": 210},\n    {\"test\": \"test_profile_update\", \"status\": \"passed\", \"duration_ms\": 150},\n]\n```\n\nНапиши скрипт, который:\n\n1. Считает и выводит количество тестов со статусом `passed` и `failed`.\n2. Собирает в список названия всех упавших тестов (`failed`).\n3. Считает суммарное и среднее время выполнения (`duration_ms`) по всем тестам, округлённое до целого.\n4. Выводит итоговую сводку в формате:\n   ```\n   Passed: 3, Failed: 2\n   Failed tests: test_registration, test_password_reset\n   Total duration: 915 ms, average: 183 ms\n   ```\n\n**Критерии готово**: скрипт запускается без ошибок командой `python homework_week1.py`, использует хотя бы один генератор списков и словарь `.get()` там, где это уместно, вывод точно соответствует формату из примера (числа могут отличаться, если ты меняешь исходные данные для проверки).\n", "hasPractice": false, "quiz": [{"question": "Как безопаснее всего получить значение по ключу 'email' из словаря user, если этот ключ может отсутствовать?", "options": ["user.get('email')", "user['email']", "user.pop('email')", "user.email"], "correct": 0, "explain": "user.get('email') вернёт None (или значение по умолчанию), если ключа нет, тогда как user['email'] выбросит KeyError и прервёт выполнение скрипта."}, {"question": "Что произойдёт при выполнении: point = (10, 20); point[0] = 5?", "options": ["Возникнет ошибка — кортежи нельзя изменять после создания", "Ничего не произойдёт, изменение будет молча проигнорировано", "point станет [5, 20] — тип автоматически поменяется на список", "point станет (5, 20)"], "correct": 0, "explain": "Кортеж — неизменяемый тип данных. Попытка присвоить значение по индексу приводит к ошибке точно так же, как и попытка изменить символ строки."}, {"question": "Как правильно создать пустое множество (set) в Python?", "options": ["empty = ()", "empty = set()", "empty = []", "empty = {}"], "correct": 1, "explain": "{} создаёт пустой словарь, а не множество. Единственный способ получить именно пустое множество — вызвать функцию set()."}, {"question": "Даны два множества user_ids_run_1 и user_ids_run_2. Как узнать, какие ID были в первом прогоне, но отсутствуют во втором?", "options": ["user_ids_run_1 & user_ids_run_2", "user_ids_run_1 | user_ids_run_2", "user_ids_run_1 == user_ids_run_2", "user_ids_run_1 - user_ids_run_2"], "correct": 3, "explain": "Оператор - вычисляет разность множеств: все элементы первого множества, которых нет во втором — ровно то, что нужно для сравнения двух прогонов тестов."}, {"question": "Как с помощью словарного comprehension получить словарь {город: длина названия} из множества cities?", "options": ["{len(city) for city in cities}", "[city: len(city) for city in cities]", "{city for city in cities: len(city)}", "{city: len(city) for city in cities}"], "correct": 3, "explain": "Синтаксис словарного comprehension — {ключ: значение for переменная in источник}, в фигурных скобках и с двоеточием между ключом и значением."}], "exercise": {"prompt": "Дан список результатов тестового прогона в виде списка словарей (RUN_RESULTS). Напиши функцию count_by_status(run_results), возвращающую кортеж (passed, failed). Напиши функцию failed_test_names(run_results), возвращающую список названий упавших тестов. Напиши функцию duration_stats(run_results), возвращающую кортеж (total_duration, average_duration), где среднее округлено до целого.", "starter": "def count_by_status(run_results):\n    # верни кортеж (passed, failed) - количество записей со status == \"passed\" и \"failed\"\n    pass\n\n\ndef failed_test_names(run_results):\n    # верни список значений \"test\" для всех записей со статусом \"failed\" (в порядке появления)\n    pass\n\n\ndef duration_stats(run_results):\n    # верни кортеж (total_duration, average_duration) - сумма и среднее по полю \"duration_ms\"\n    # среднее округли до целого числа функцией round()\n    pass\n", "tests": "RUN_RESULTS = [\n    {\"test\": \"test_login\", \"status\": \"passed\", \"duration_ms\": 120},\n    {\"test\": \"test_logout\", \"status\": \"passed\", \"duration_ms\": 95},\n    {\"test\": \"test_registration\", \"status\": \"failed\", \"duration_ms\": 340},\n    {\"test\": \"test_password_reset\", \"status\": \"failed\", \"duration_ms\": 210},\n    {\"test\": \"test_profile_update\", \"status\": \"passed\", \"duration_ms\": 150},\n]\n\n\ndef test_count_by_status():\n    passed, failed = count_by_status(RUN_RESULTS)\n    assert passed == 3, f\"ожидалось 3 успешных теста, получено {passed}\"\n    assert failed == 2, f\"ожидалось 2 упавших теста, получено {failed}\"\n\n\ndef test_failed_test_names():\n    names = failed_test_names(RUN_RESULTS)\n    assert names == [\"test_registration\", \"test_password_reset\"], f\"неверный список упавших тестов: {names}\"\n\n\ndef test_duration_stats_total():\n    total, average = duration_stats(RUN_RESULTS)\n    assert total == 915, f\"суммарная длительность должна быть 915, получено {total}\"\n\n\ndef test_duration_stats_average():\n    total, average = duration_stats(RUN_RESULTS)\n    assert average == 183, f\"средняя длительность должна быть округлена до 183, получено {average}\"\n"}}, {"id": "p13", "section": "Модуль 0 · Python-база", "subgroup": "Неделя 2", "isOverview": false, "num": "0.8", "title": "Функции: def, return, аргументы", "content": "# 0.8. Функции: def, return, аргументы\n\n## Зачем это нужно\n\nЛюбой тестовый фреймворк построен вокруг функций: сами тесты — это функции, вспомогательные шаги (\"залогиниться\", \"создать тестового пользователя\") — тоже функции. Не научившись выделять повторяющийся код в функцию, ты будешь копировать одни и те же пять строк в каждый тест — а это первое, за что бракуют код-ревью.\n\n## Теория\n\nФункция объявляется ключевым словом `def`, вызывается — именем со скобками:\n\n```python\ndef send_request():\n    print(\"sending request...\")\n\nsend_request()   # вызов — без скобок это была бы просто ссылка на функцию, не вызов\n```\n\nЗначения внутри скобок при объявлении называются **параметрами**, а то, что передаётся при вызове — **аргументами**. Порядок важен: первому параметру соответствует первый аргумент и так далее (это называется **позиционными** аргументами).\n\n```python\ndef build_url(host, path):\n    return f\"{host}/{path}\"\n\nbuild_url(\"https://api.example.com\", \"users\")\n```\n\n### return\n\nОператор `return` завершает выполнение функции и возвращает значение вызывающему коду. Без `return` функция всегда возвращает `None`. Как только выполнен `return`, весь код после него в этой же ветке уже не выполняется:\n\n```python\ndef get_status_label(code):\n    if 200 <= code < 300:\n        return \"success\"\n    return \"error\"\n```\n\nВернуть можно сразу несколько значений — на самом деле это упаковка в кортеж:\n\n```python\ndef get_min_max(numbers):\n    return min(numbers), max(numbers)\n\nlow, high = get_min_max([5, 2, 9, 1])\n```\n\n### Именованные аргументы и значения по умолчанию\n\nАргументы можно передавать не только по позиции, но и по имени — тогда порядок неважен:\n\n```python\nbuild_url(path=\"users\", host=\"https://api.example.com\")\n```\n\nПараметру можно задать значение по умолчанию — тогда при вызове его можно не указывать:\n\n```python\ndef get_users(base_url, page=1, per_page=20):\n    return f\"{base_url}/users?page={page}&per_page={per_page}\"\n\nget_users(\"https://api.example.com\")               # page и per_page возьмутся по умолчанию\nget_users(\"https://api.example.com\", per_page=50)   # меняем только один параметр\n```\n\n**Важная ловушка**: никогда не используй изменяемый объект (список, словарь) как значение по умолчанию — он создаётся один раз при объявлении функции и переиспользуется между всеми вызовами:\n\n```python\ndef add_item(item, items=[]):   # плохо!\n    items.append(item)\n    return items\n\nadd_item(1)   # [1]\nadd_item(2)   # [1, 2] — а не [2], как можно было ожидать!\n```\n\nПравильный способ — использовать `None` как значение по умолчанию и создавать новый объект внутри функции:\n\n```python\ndef add_item(item, items=None):\n    if items is None:\n        items = []\n    items.append(item)\n    return items\n```\n\n### Область видимости\n\nПеременная, созданная внутри функции, — **локальная**: она не существует за пределами функции. Функция при этом видит переменные, объявленные снаружи (глобальные), но не может напрямую их *изменить* — присваивание внутри функции создаст новую локальную переменную с тем же именем. Если действительно нужно изменить глобальную переменную из функции, используется ключевое слово `global` — но на практике в тестовом коде такая необходимость возникает редко и обычно говорит о том, что стоит пересмотреть архитектуру (передавать значение через аргумент и возврат, а не через глобальное состояние).\n\n## Пример\n\n```python\ndef calculate_discounted_price(price, discount_percent=10):\n    return round(price * (100 - discount_percent) / 100, 2)\n\n\nprint(calculate_discounted_price(1999.99))          # скидка по умолчанию — 10%\nprint(calculate_discounted_price(1999.99, 25))      # позиционный аргумент\nprint(calculate_discounted_price(price=500, discount_percent=0))  # именованные\n```\n\n## Частые ошибки\n\n- Забыть `return` и удивляться, почему результат функции — `None`.\n- Изменяемое значение по умолчанию (`def f(items=[])`) — данные \"утекают\" между вызовами.\n- Путать параметр (в объявлении) и аргумент (при вызове) в разговоре с коллегами — мелочь, но профессиональная лексика важна.\n- Пытаться менять глобальную переменную внутри функции без `global` и не понимать, почему изменение \"не сохраняется\" снаружи.\n\n## Мини-задание\n\nНапиши функцию `format_test_report(test_name, passed, duration_ms=0)`, которая возвращает строку вида `\"[PASSED] test_login (120 ms)\"` или `\"[FAILED] test_login (120 ms)\"` в зависимости от значения `passed`. Параметр `duration_ms` должен иметь значение по умолчанию `0`. Вызови функцию три раза с разными комбинациями позиционных и именованных аргументов.\n", "hasPractice": true, "quiz": [{"question": "Почему не стоит использовать изменяемый объект (например, список) как значение по умолчанию для параметра функции: def add_item(item, items=[])?", "options": ["Потому что списки нельзя передавать в функции", "Потому что список создаётся один раз при объявлении функции и переиспользуется между всеми вызовами", "Потому что это вызовет SyntaxError при запуске", "Потому что параметры со значением по умолчанию обязаны быть числами"], "correct": 1, "explain": "Значение по умолчанию вычисляется один раз, в момент объявления функции, а не при каждом вызове — поэтому изменяемый объект «утекает» между вызовами. Правильно использовать None и создавать новый объект внутри функции."}, {"question": "Функция объявлена так:\ndef get_status_label(code):\n    if 200 <= code < 300:\n        \"success\"\nЧто вернёт get_status_label(200)?", "options": ["SyntaxError", "None", "\"success\"", "True"], "correct": 1, "explain": "Без явного оператора return функция всегда возвращает None, даже если внутри неё что-то вычисляется — само по себе выражение результат не возвращает."}, {"question": "Функция объявлена: def build_url(host, path). Что произойдёт при вызове build_url(path=\"users\", host=\"https://api.example.com\")?", "options": ["SyntaxError, потому что аргументы переданы не в том порядке, что в объявлении", "path получит значение host, а host получит значение path", "TypeError: функция получила слишком много аргументов", "Функция отработает корректно — при именованных аргументах порядок передачи не важен"], "correct": 3, "explain": "Именованные аргументы связываются с параметрами по имени, а не по позиции, поэтому их можно передавать в любом порядке."}, {"question": "Функция объявлена: def get_min_max(numbers): return min(numbers), max(numbers). Что именно она возвращает?", "options": ["Кортеж из двух чисел", "Словарь с ключами min и max", "Два отдельных значения, которые нельзя сохранить одной переменной", "Список из двух чисел"], "correct": 0, "explain": "return a, b — это неявная упаковка значений в кортеж. Функция всегда возвращает один объект, и в данном случае это кортеж из двух чисел."}, {"question": "Есть глобальная переменная total = 0 и функция def add(): total = total + 1 (без global). Что произойдёт при вызове add()?", "options": ["Возникнет ошибка, потому что присваивание делает total локальной переменной, а такую переменную нельзя использовать в вычислении до присваивания", "Глобальная переменная total успешно увеличится на 1", "Функция изменит total, но только временно, на время своего выполнения", "Ничего не произойдёт, Python молча проигнорирует эту строку"], "correct": 0, "explain": "Любое присваивание переменной внутри функции делает её локальной для всей функции. Так как total читается в правой части до того, как локальная переменная получит значение, возникает ошибка — без global изменить глобальную переменную так нельзя."}], "exercise": {"prompt": "Напиши функцию format_test_report(test_name, passed, duration_ms=0), которая возвращает строку '[PASSED] test_login (120 ms)' или '[FAILED] test_login (120 ms)' в зависимости от passed. duration_ms должен иметь значение по умолчанию 0.", "starter": "def format_test_report(test_name, passed, duration_ms=0):\n    # верни строку \"[PASSED] <test_name> (<duration_ms> ms)\" или \"[FAILED] <test_name> (<duration_ms> ms)\"\n    pass\n", "tests": "def test_passed_report():\n    assert format_test_report(\"test_login\", True, 120) == \"[PASSED] test_login (120 ms)\", \"неверный формат для успешного теста\"\n\n\ndef test_failed_report():\n    assert format_test_report(\"test_logout\", False, 95) == \"[FAILED] test_logout (95 ms)\", \"неверный формат для упавшего теста\"\n\n\ndef test_default_duration():\n    assert format_test_report(\"test_registration\", False) == \"[FAILED] test_registration (0 ms)\", \"duration_ms по умолчанию должен быть равен 0\"\n\n\ndef test_keyword_arguments():\n    result = format_test_report(test_name=\"test_profile\", passed=True, duration_ms=50)\n    assert result == \"[PASSED] test_profile (50 ms)\", \"функция должна корректно работать с именованными аргументами\"\n"}}, {"id": "p14", "section": "Модуль 0 · Python-база", "subgroup": "Неделя 2", "isOverview": false, "num": "0.9", "title": "*args, **kwargs, распаковка, лямбды", "content": "# 0.9. *args, **kwargs, распаковка, лямбды\n\n## Зачем это нужно\n\nКогда начнёшь читать код фреймворков (pytest, requests, Playwright) — везде будут встречаться сигнатуры вроде `def request(method, url, **kwargs)`. Не понимая `*args`/`**kwargs`, невозможно разобраться, что вообще можно передать в такую функцию. Лямбды же — стандартный инструмент для сортировки и фильтрации данных одной строкой.\n\n## Теория\n\n### *args — произвольное число позиционных аргументов\n\nЕсли поставить `*` перед именем параметра, все \"лишние\" позиционные аргументы соберутся в кортеж:\n\n```python\ndef join_path(*parts):\n    return \"/\".join(parts)\n\njoin_path(\"api\", \"v1\", \"users\")   # 'api/v1/users' — 3 аргумента, а не 1 список\n```\n\nВнутри функции `parts` — обычный кортеж, с ним можно делать всё то же, что с любым кортежем.\n\n### **kwargs — произвольное число именованных аргументов\n\nАналогично, но для именованных аргументов — они собираются в словарь:\n\n```python\ndef build_query(**params):\n    return \"&\".join(f\"{key}={value}\" for key, value in params.items())\n\nbuild_query(page=1, per_page=20)   # 'page=1&per_page=20'\n```\n\nОба варианта можно комбинировать в одной функции — но строго в таком порядке: сначала обычные позиционные параметры, потом `*args`, потом именованные параметры со значением по умолчанию, потом `**kwargs`:\n\n```python\ndef make_request(method, url, *args, timeout=30, **kwargs):\n    print(method, url, args, timeout, kwargs)\n\nmake_request(\"GET\", \"/users\", verbose=True, retries=3)\n# GET /users () 30 {'verbose': True, 'retries': 3}\n```\n\nЕсли в сигнатуре после `*args` (или просто одинокой `*`) идут ещё параметры — их можно передать **только по имени**, позиционно уже не получится. Это частый приём в реальных библиотеках, чтобы заставить вызывающий код быть явным.\n\n### Упаковка и распаковка коллекций\n\nТот же символ `*` умеет работать и в обратную сторону — **распаковывать** коллекцию в отдельные аргументы:\n\n```python\nnumbers = (5, 3, 8)\nprint(max(*numbers))   # эквивалент print(max(5, 3, 8))\n\ndef get_v(a, b, c):\n    return a * b * c\n\ndimensions = (2, 3, 4)\nget_v(*dimensions)   # 24\n```\n\nДля словарей та же идея работает с `**` — распаковка пар ключ-значение в именованные аргументы:\n\n```python\nuser_data = {\"username\": \"ivan\", \"age\": 25}\n\ndef create_user(username, age):\n    return f\"{username}, {age}\"\n\ncreate_user(**user_data)\n```\n\nПохожий приём используют, чтобы объединить два словаря в один:\n\n```python\ndefaults = {\"timeout\": 30, \"retries\": 3}\noverrides = {\"retries\": 5}\nconfig = {**defaults, **overrides}   # {'timeout': 30, 'retries': 5}\n```\n\n### Лямбда-функции\n\nЛямбда — короткая безымянная функция из одного выражения:\n\n```python\nsquare = lambda x: x ** 2\nsquare(5)   # 25\n```\n\nЛямбды почти никогда не объявляют \"про запас\" в переменную (для этого есть обычный `def`) — их главное применение — передавать \"на лету\" в качестве аргумента другим функциям, например для сортировки (см. урок 0.14):\n\n```python\nusers = [{\"name\": \"Ivan\", \"age\": 25}, {\"name\": \"Olga\", \"age\": 30}]\nsorted(users, key=lambda u: u[\"age\"])\n```\n\nВ лямбде можно записать только одно выражение — ни `if/else`-блоков, ни нескольких строк, ни присваиваний. Если логика не помещается в одну строку — это сигнал, что нужна обычная функция через `def`.\n\n## Пример\n\n```python\ndef log_message(*parts, sep=\" | \"):\n    return sep.join(str(p) for p in parts)\n\n\nprint(log_message(\"2024-01-15\", \"ERROR\", \"connection failed\"))\n# 2024-01-15 | ERROR | connection failed\n\nprint(log_message(\"INFO\", \"started\", sep=\" -> \"))\n# INFO -> started\n\n# распаковка при вызове\ntimestamps = (\"12:00\", \"12:05\", \"12:10\")\nprint(log_message(*timestamps))\n# 12:00 | 12:05 | 12:10\n\nis_even = lambda n: n % 2 == 0\nprint(list(filter(is_even, [1, 2, 3, 4, 5, 6])))\n# [2, 4, 6]\n```\n\n## Частые ошибки\n\n- Пытаться передать именованный аргумент туда, где ожидается только `*args`, и наоборот.\n- Засовывать в лямбду многострочную логику — она туда физически не помещается, будет `SyntaxError`.\n- Путать `*args` (кортеж позиционных) и `**kwargs` (словарь именованных) местами в объявлении функции.\n- Нарушать порядок параметров: обычные → `*args` → именованные со значением по умолчанию → `**kwargs`.\n\n## Мини-задание\n\nНапиши функцию `merge_configs(*configs)`, которая принимает произвольное число словарей и объединяет их в один (более поздний словарь перезаписывает значения предыдущих) — используй распаковку `**`. Затем напиши lambda-выражение, которое по словарю с ключом `\"duration_ms\"` возвращает значение этого ключа, и используй его в `sorted()`, чтобы отсортировать список тестовых результатов по длительности.\n", "hasPractice": true, "quiz": [{"question": "Дана функция def make_request(method, url, *args, timeout=30, **kwargs). Как можно передать значение timeout при вызове?", "options": ["Только по имени: make_request(\"GET\", \"/users\", timeout=60)", "Через **kwargs явно: make_request(\"GET\", \"/users\", kwargs={\"timeout\": 60})", "Никак — timeout нельзя переопределить при вызове", "Только позиционно — третьим аргументом при вызове"], "correct": 0, "explain": "Все параметры, объявленные после *args, можно передать только именованным аргументом — позиционно они уже недоступны, потому что после *args любые лишние позиционные значения некуда деть."}, {"question": "Функция объявлена как def f(*args, **kwargs). Каким типом данных внутри функции будут args и kwargs?", "options": ["args — словарь, kwargs — кортеж", "Оба — множества", "args — кортеж, kwargs — словарь", "Оба — списки"], "correct": 2, "explain": "Оператор * упаковывает произвольное число позиционных аргументов в кортеж, а ** упаковывает именованные аргументы в словарь — это базовое поведение обеих конструкций."}, {"question": "Дан кортеж dimensions = (2, 3, 4) и функция def get_v(a, b, c). Как передать все три значения из dimensions одним выражением?", "options": ["get_v(dimensions)", "get_v(**dimensions)", "get_v(dimensions[0], dimensions[1], dimensions[2], dimensions[3])", "get_v(*dimensions)"], "correct": 3, "explain": "Оператор * перед коллекцией распаковывает её элементы в отдельные позиционные аргументы — get_v(*dimensions) эквивалентно get_v(2, 3, 4)."}, {"question": "Как объединить два словаря defaults и overrides в новый словарь, где значения overrides перезаписывают defaults?", "options": ["config = {**defaults, **overrides}", "config = [defaults, overrides]", "config = defaults + overrides", "config = defaults & overrides"], "correct": 0, "explain": "Двойная звёздочка распаковывает пары ключ-значение словаря. При объединении {**defaults, **overrides} ключи из overrides, идущего вторым, перезаписывают одноимённые ключи из defaults."}, {"question": "Почему нельзя записать в lambda многострочный блок if/else с несколькими операторами?", "options": ["Это можно сделать, просто нужно использовать точку с запятой между строками", "Лямбда вообще не поддерживает условия", "Лямбда автоматически конвертируется в обычную функцию при попытке добавить условие", "Лямбда может содержать только одно выражение — для сложной логики нужна обычная функция через def"], "correct": 3, "explain": "Синтаксически lambda ограничена одним выражением (можно использовать тернарный оператор для простого условия), но не многострочным блоком кода — для такой логики нужен обычный def."}], "exercise": {"prompt": "Напиши функцию merge_configs(*configs), которая принимает произвольное число словарей и объединяет их в один через распаковку ** (более поздний словарь перезаписывает значения предыдущих). Напиши функцию sort_by_duration(results), которая через sorted() и lambda-key сортирует список словарей по полю 'duration_ms'.", "starter": "def merge_configs(*configs):\n    # объедини произвольное число словарей в один, используя **\n    # более поздний словарь должен перезаписывать значения предыдущих\n    pass\n\n\ndef sort_by_duration(results):\n    # верни список словарей results, отсортированный по возрастанию поля \"duration_ms\"\n    # используй sorted() с key= и lambda\n    pass\n", "tests": "def test_merge_configs_basic():\n    result = merge_configs({\"timeout\": 30}, {\"retries\": 3})\n    assert result == {\"timeout\": 30, \"retries\": 3}, f\"словари должны объединиться без потерь: {result}\"\n\n\ndef test_merge_configs_override():\n    result = merge_configs({\"timeout\": 30, \"retries\": 3}, {\"retries\": 5})\n    assert result == {\"timeout\": 30, \"retries\": 5}, \"значение из более позднего словаря должно перезаписать предыдущее\"\n\n\ndef test_merge_configs_no_args():\n    assert merge_configs() == {}, \"без аргументов должен вернуться пустой словарь\"\n\n\ndef test_sort_by_duration():\n    results = [{\"name\": \"t1\", \"duration_ms\": 300}, {\"name\": \"t2\", \"duration_ms\": 50}, {\"name\": \"t3\", \"duration_ms\": 120}]\n    sorted_results = sort_by_duration(results)\n    names = [r[\"name\"] for r in sorted_results]\n    assert names == [\"t2\", \"t3\", \"t1\"], f\"результаты должны быть отсортированы по возрастанию duration_ms: {names}\"\n"}}, {"id": "p15", "section": "Модуль 0 · Python-база", "subgroup": "Неделя 2", "isOverview": false, "num": "0.10", "title": "Базовое ООП: классы, __init__, self", "content": "# 0.10. Базовое ООП: классы, __init__, self\n\n## Зачем это нужно\n\nНачиная с модуля 4 ты будешь работать с Page Object Model — подходом, где каждая страница сайта описывается отдельным классом (`LoginPage`, `RegistrationPage` и т.п.). В модуле 3 API-клиент тоже будет классом. Если сейчас не разобраться, что такое класс, `__init__` и `self`, весь этот код превратится в набор непонятных символов. Цель этого урока — ровно наоборот: чтобы, открыв любой чужой класс, ты понимал, что происходит.\n\nВажная оговорка: этот раздел не входит в исходный Stepik-курс — там глав про классы вообще нет. Материал написан отдельно для этого курса, специально под тот минимум ООП, который нужен, чтобы читать тестовый фреймворк. Здесь нет наследования интерфейсов, множественного наследования, метаклассов и прочих продвинутых тем — только то, что реально встретится в коде.\n\n## Теория\n\nДо сих пор мы хранили связанные данные либо в отдельных переменных, либо в словаре:\n\n```python\nuser = {\"username\": \"ivan\", \"age\": 25}\n```\n\nУ словаря есть неудобство: рядом с данными нет действий, которые к ним относятся. Хочешь проверить, совершеннолетний ли пользователь — пишешь отдельную функцию `is_adult(user)` где-то в стороне, и связь между данными и функцией видна только по договорённости, а не по коду.\n\n**Класс** — это шаблон, который описывает и данные (**атрибуты**), и действия над ними (**методы**) вместе, в одном месте. **Объект** (или **экземпляр**) — это конкретная \"вещь\", созданная по этому шаблону.\n\n```python\nclass TestUser:\n    def __init__(self, username, age):\n        self.username = username\n        self.age = age\n\n    def is_adult(self):\n        return self.age >= 18\n\n\nuser = TestUser(\"ivan\", 25)   # создали экземпляр класса\nprint(user.username)          # ivan — обращение к атрибуту\nprint(user.is_adult())        # True — вызов метода\n```\n\nРазберём это по частям.\n\n**`class TestUser:`** — объявление класса. По договорённости имена классов пишут в `CamelCase` (`TestUser`, `BasePage`), а не в `snake_case`, как переменные и функции — это сразу помогает отличить класс от обычной переменной при чтении чужого кода.\n\n**`__init__`** — специальный метод-**конструктор**, который автоматически вызывается в момент создания объекта (`TestUser(\"ivan\", 25)`). Его задача — заполнить начальные атрибуты объекта. Имя с двумя подчёркиваниями с обеих сторон (`__init__`) — соглашение Python для \"магических\" методов со специальным поведением; сейчас достаточно запомнить именно этот один.\n\n**`self`** — первый параметр любого метода класса, через который метод обращается к атрибутам *этого конкретного* объекта. Когда ты пишешь `user.is_adult()`, Python сам подставляет `user` в качестве `self` — тебе не нужно передавать его вручную при вызове. Но при *объявлении* метода `self` нужно прописывать явно первым параметром всегда — это не опция, а обязательное правило синтаксиса:\n\n```python\ndef is_adult(self):       # self — обязателен при объявлении\n    return self.age >= 18\n\nuser.is_adult()            # а при вызове self не передаём — он подставится сам\n```\n\nВнутри `__init__` строчка `self.username = username` создаёт атрибут `username` именно у *этого* объекта. Если создать два объекта — у каждого будут свои независимые значения атрибутов:\n\n```python\nuser1 = TestUser(\"ivan\", 25)\nuser2 = TestUser(\"olga\", 17)\nprint(user1.is_adult())   # True\nprint(user2.is_adult())   # False — те же методы, но своё состояние\n```\n\n### Чем это лучше словаря\n\nВ словаре ничего не мешает случайно записать ключ с опечаткой (`user[\"usrname\"]`) — ошибку заметишь не сразу. У класса опечатка в имени атрибута (`user.usrname`) обычно сразу видна в среде разработки. Но главное — методы объекта живут рядом с данными и явно показывают, какие действия для этих данных предусмотрены: открыть `BasePage` и увидеть его методы — куда понятнее, чем гадать, какие функции \"где-то\" работают с конкретным словарём.\n\n## Пример\n\nСобственный класс для представления ответа API — то, с чем ты будешь работать в модуле 3, но уже на своих данных, без реальных запросов:\n\n```python\nclass ApiResponse:\n    def __init__(self, status_code, body):\n        self.status_code = status_code\n        self.body = body\n\n    def is_success(self):\n        return 200 <= self.status_code < 300\n\n    def get_field(self, field_name):\n        return self.body.get(field_name)\n\n\nresponse = ApiResponse(200, {\"id\": 1, \"username\": \"ivan\"})\nprint(response.is_success())            # True\nprint(response.get_field(\"username\"))   # ivan\n\nerror_response = ApiResponse(404, {\"error\": \"not found\"})\nprint(error_response.is_success())      # False\n```\n\n## Частые ошибки\n\n- Забыть `self` первым параметром в объявлении метода — получишь `TypeError: takes 0 positional arguments but 1 was given` при вызове (Python сам подставляет объект первым аргументом, а метод его \"не ждёт\").\n- Обратиться к атрибуту без `self.` внутри метода (`username = username` вместо `self.username = username`) — атрибут не создастся, а внутри `__init__` просто исчезнет параметр в никуда.\n- Спутать класс (шаблон, `TestUser`) с объектом (конкретный экземпляр, `user`) — методы вызываются на объекте, а не на классе.\n- Хранить общие для всех объектов данные не в `__init__` (через `self.`), а прямо в теле класса — тогда это будет один общий атрибут на все экземпляры сразу, а не у каждого свой (эта тонкость подробно разбирается уже за рамками этого курса, но полезно знать, что разница есть).\n\n## Мини-задание\n\nНапиши класс `ApiResponse` (как в примере) и добавь ему метод `has_error()`, который возвращает `True`, если в `self.body` есть ключ `\"error\"`. Создай два объекта: один — успешный ответ с данными, второй — ответ с ошибкой, и проверь оба метода на них.\n", "hasPractice": true, "quiz": [{"question": "Что произойдёт, если при объявлении метода класса забыть указать self первым параметром?", "options": ["Python автоматически подставит self сам, ничего не заметив", "При вызове метода на объекте возникнет TypeError о лишнем аргументе", "Метод будет работать точно так же — self не обязателен", "Атрибуты класса станут доступны без создания объекта"], "correct": 1, "explain": "Python при вызове метода на объекте (user.method()) всегда подставляет сам объект первым аргументом. Если метод объявлен без self, этот \"лишний\" аргумент девать некуда — возникает TypeError."}, {"question": "Когда автоматически вызывается метод __init__ класса?", "options": ["Только если явно написать user.__init__()", "В момент создания нового объекта класса, например при TestUser(\"ivan\", 25)", "При импорте модуля, где объявлен класс", "Каждый раз, когда вызывается любой метод объекта"], "correct": 1, "explain": "__init__ — специальный метод-конструктор, который Python вызывает автоматически сразу после создания нового объекта, чтобы заполнить его начальные атрибуты."}, {"question": "Создали user1 = TestUser(\"ivan\", 25) и user2 = TestUser(\"olga\", 17). Повлияет ли изменение user1.age на user2.age?", "options": ["Это вызовет ошибку — нельзя создавать два объекта одного класса", "Только если оба объекта созданы в одной строке кода", "Да, у обоих объектов общий атрибут age", "Нет — у каждого объекта свои независимые атрибуты, заполненные в __init__ отдельно"], "correct": 3, "explain": "Каждый вызов __init__ создаёт атрибуты именно для того объекта, который в этот момент создаётся (через self). У разных объектов одного класса — независимое состояние."}, {"question": "В __init__ по ошибке написали username = username вместо self.username = username. Что произойдёт?", "options": ["Атрибут self.username всё равно создастся автоматически", "Атрибут username не будет сохранён в объекте — обращение к user.username вызовет ошибку", "username станет глобальной переменной, доступной во всей программе", "Программа не запустится — SyntaxError"], "correct": 1, "explain": "Без self. это обычная локальная переменная внутри __init__, которая исчезает сразу после завершения метода — объект не получает такого атрибута."}, {"question": "У объекта response есть атрибут status_code и метод is_success(). Как правильно проверить, успешен ли ответ?", "options": ["response.is_success()", "response[is_success]", "is_success(response.status_code)", "response.is_success"], "correct": 0, "explain": "Метод нужно вызывать со скобками, чтобы он реально выполнился и вернул значение. Без скобок response.is_success — это просто ссылка на сам метод, а не результат его работы."}], "exercise": {"prompt": "Дан класс ApiResponse (как в примере урока) с __init__, is_success() и get_field(). Добавь ему метод has_error(), который возвращает True, если в self.body есть ключ 'error'. Создай два объекта — успешный ответ и ответ с ошибкой — и проверь оба метода на них.", "starter": "class ApiResponse:\n    def __init__(self, status_code, body):\n        self.status_code = status_code\n        self.body = body\n\n    def is_success(self):\n        return 200 <= self.status_code < 300\n\n    def get_field(self, field_name):\n        return self.body.get(field_name)\n\n    def has_error(self):\n        # верни True, если в self.body есть ключ \"error\", иначе False\n        pass\n", "tests": "def test_has_error_true():\n    response = ApiResponse(404, {\"error\": \"not found\"})\n    assert response.has_error() is True, \"если в body есть ключ 'error', has_error() должен вернуть True\"\n\n\ndef test_has_error_false():\n    response = ApiResponse(200, {\"id\": 1, \"username\": \"ivan\"})\n    assert response.has_error() is False, \"если ключа 'error' нет, has_error() должен вернуть False\"\n\n\ndef test_is_success_still_works():\n    response = ApiResponse(200, {\"id\": 1})\n    assert response.is_success() is True, \"унаследованная из примера логика is_success() не должна ломаться\"\n\n\ndef test_two_independent_objects():\n    success_response = ApiResponse(200, {\"id\": 1})\n    error_response = ApiResponse(500, {\"error\": \"server error\"})\n    assert success_response.has_error() is False, \"успешный ответ не должен считаться ошибкой\"\n    assert error_response.has_error() is True, \"ответ с ключом error должен считаться ошибкой\"\n"}}, {"id": "p16", "section": "Модуль 0 · Python-база", "subgroup": "Неделя 2", "isOverview": false, "num": "0.11", "title": "Наследование", "content": "# 0.11. Наследование\n\n## Зачем это нужно\n\nВ Page Object Model у всех страниц сайта есть что-то общее (например, объект браузерной страницы, метод перехода по URL), но у каждой страницы — свои уникальные элементы и действия. Дублировать общий код в каждом классе — плохая практика (тот же принцип DRY, что и с функциями). Наследование позволяет описать общее один раз в \"базовом\" классе, а в каждом конкретном классе — дописать только то, что отличается. Именно так устроен `boilerplate/pages/`, с которым ты будешь работать с модуля 4.\n\nКак и предыдущий урок, этот материал написан отдельно для курса — в исходном Stepik-курсе темы наследования нет вообще.\n\n## Теория\n\nКласс может **наследоваться** от другого класса — тогда он автоматически получает все его атрибуты и методы, и может добавить свои или переопределить существующие:\n\n```python\nclass Animal:\n    def __init__(self, name):\n        self.name = name\n\n    def make_sound(self):\n        return \"...\"\n\n\nclass Dog(Animal):          # Dog наследуется от Animal\n    def make_sound(self):    # переопределяем метод\n        return \"Woof!\"\n\n\nrex = Dog(\"Rex\")\nprint(rex.name)          # Rex — атрибут получен от Animal, ничего лишний раз не писали\nprint(rex.make_sound())  # Woof! — а этот метод у Dog свой\n```\n\n`class Dog(Animal):` — в скобках после имени класса указывается родительский класс (**базовый**, или **родительский**). `Dog` — **дочерний** класс (или **наследник**). Дочерний класс автоматически \"видит\" все методы родителя, если не определит собственный метод с тем же именем — тогда сработает именно его, дочерний, вариант (это называется **переопределением метода**).\n\n### super() — обращение к родителю\n\nЕсли у родителя есть `__init__` с полезной логикой, а у дочернего класса появляются дополнительные атрибуты — не нужно копировать код родительского `__init__`. Вместо этого дочерний класс вызывает родительский конструктор через `super()`:\n\n```python\nclass Animal:\n    def __init__(self, name):\n        self.name = name\n\n\nclass Dog(Animal):\n    def __init__(self, name, breed):\n        super().__init__(name)   # вызываем __init__ родителя — он заполнит self.name\n        self.breed = breed        # а это — уже своё, новое поле\n\n\nrex = Dog(\"Rex\", \"Labrador\")\nprint(rex.name, rex.breed)   # Rex Labrador\n```\n\n`super().__init__(name)` — эквивалент \"выполни код родительского `__init__` для этого же объекта\". Без этой строчки атрибут `self.name` у `Dog` вообще не появился бы — пришлось бы дублировать `self.name = name` вручную, а это как раз то дублирование, которого наследование призвано избежать.\n\n### Зачем это в тестовом коде\n\nОбщий паттерн: `BasePage` хранит то, что нужно любой странице (сама страница браузера, метод открытия по URL), а каждая конкретная страница (`RegistrationPage`, `LoginPage`, `DashboardPage`) наследуется от него и добавляет свои локаторы элементов и свои действия.\n\n## Пример: код из `boilerplate/`, который ты скоро будешь читать (и писать)\n\nНиже — два реальных файла из `boilerplate/pages/` этого курса. Их код использует Playwright, с которым мы познакомимся только в модуле 4 — но структурно это ровно то же наследование, что и в примере с `Animal`/`Dog` выше. Не пытайся понять здесь, что делает Playwright — смотри только на связку класс/наследование/`super()`.\n\n`boilerplate/pages/base_page.py`:\n\n```python\nfrom playwright.sync_api import Page, expect\n\n\nclass BasePage:\n    \"\"\"\n    Общая функциональность для всех страниц приложения: хранение объекта page,\n    открытие страницы по URL, проверка текущего адреса.\n    Конкретные страницы (RegistrationPage, DashboardPage, ...) наследуются от него.\n    \"\"\"\n\n    def __init__(self, page: Page):\n        self.page = page\n\n    def open(self, url: str) -> None:\n        self.page.goto(url)\n\n    def check_current_url(self, expected_url: str) -> None:\n        expect(self.page).to_have_url(expected_url)\n```\n\n`boilerplate/pages/registration_page.py`:\n\n```python\nfrom playwright.sync_api import Page, expect\n\nfrom pages.base_page import BasePage\n\n\nclass RegistrationPage(BasePage):\n    URL = \"https://nikita-filonov.github.io/qa-automation-engineer-ui-course/#/auth/registration\"\n\n    def __init__(self, page: Page):\n        super().__init__(page)\n\n        self.email_input = page.locator(\"[data-testid='registration-form-email-input'] input\")\n        self.username_input = page.locator(\"[data-testid='registration-form-username-input'] input\")\n        self.password_input = page.locator(\"[data-testid='registration-form-password-input'] input\")\n        self.registration_button = page.locator(\"[data-testid='registration-page-registration-button']\")\n\n    def open_page(self) -> None:\n        super().open(self.URL)\n\n    def fill_registration_form(self, email: str, username: str, password: str) -> None:\n        self.email_input.fill(email)\n        self.username_input.fill(username)\n        self.password_input.fill(password)\n\n    def click_registration_button(self) -> None:\n        self.registration_button.click()\n\n    def check_visible_registration_form(self) -> None:\n        expect(self.email_input).to_be_visible()\n        expect(self.username_input).to_be_visible()\n        expect(self.password_input).to_be_visible()\n        expect(self.registration_button).to_be_visible()\n```\n\nТеперь разложи это по тому, что ты уже знаешь:\n\n- `class RegistrationPage(BasePage):` — `RegistrationPage` наследуется от `BasePage`, значит автоматически получает `self.page`, метод `open()` и метод `check_current_url()`.\n- `super().__init__(page)` в `__init__` регистрационной страницы — вызывает конструктор `BasePage`, который сохраняет `self.page = page`. Без этой строчки объект `RegistrationPage` не имел бы атрибута `self.page`, которым пользуются локаторы ниже.\n- После вызова `super().__init__()` класс добавляет **свои** атрибуты — `email_input`, `username_input` и т.д. Это ровно то же самое, что `self.breed = breed` после `super().__init__(name)` в примере с `Dog`.\n- `def open_page(self): super().open(self.URL)` — переопределённый метод, который **не заменяет**, а **переиспользует** логику родителя: вызывает `open()` из `BasePage`, просто подставляя уже готовый `self.URL`. Это ещё один способ использовать `super()` — не только в `__init__`.\n- `URL` — атрибут класса (не объекта): значение одно и то же для всех страниц регистрации, поэтому не нужно передавать его в `__init__`.\n\nЕсли бы `RegistrationPage` не наследовалась от `BasePage`, пришлось бы в каждом классе страницы заново писать `self.page = page`, `open()` и `check_current_url()` — то самое дублирование кода, о котором шла речь ещё в уроке про функции.\n\n## Частые ошибки\n\n- Забыть вызвать `super().__init__(...)` в дочернем классе — тогда атрибуты родителя (`self.page` в примере выше) просто не появятся, и любой метод, который на них рассчитывает, упадёт с `AttributeError`.\n- Переопределить метод с другой сигнатурой (другим набором параметров), чем в родителе, — вызывающий код, рассчитывающий на родительскую сигнатуру, сломается.\n- Слишком глубокая цепочка наследования (класс от класса от класса от класса) — так же вредно для читаемости, как и слишком глубокая вложенность условий.\n- Путать переопределение метода (одноимённый метод в дочернем классе) с добавлением нового метода — это разные вещи с разным эффектом.\n\n## Мини-задание\n\nВозьми класс `TestUser` из прошлого урока (с `username`, `age`, `is_adult()`). Создай на его основе класс `AdminUser(TestUser)`, который в `__init__` принимает дополнительный параметр `permissions` (список строк) и сохраняет его в `self.permissions`, не забыв вызвать `super().__init__(...)` для username и age. Добавь методу `AdminUser` метод `has_permission(name)`, возвращающий `True`, если `name` есть в `self.permissions`.\n", "hasPractice": true, "quiz": [{"question": "В классе RegistrationPage(BasePage) из __init__ убрали вызов super().__init__(page). Что произойдёт?", "options": ["Ничего не изменится — self.page создастся автоматически", "self.page не будет создан, и любой метод, использующий self.page (например open()), упадёт с AttributeError", "RegistrationPage перестанет наследоваться от BasePage", "Возникнет ошибка ещё на этапе объявления класса RegistrationPage"], "correct": 1, "explain": "Атрибут self.page создаётся именно в __init__ родительского класса BasePage. Без вызова super().__init__(page) этот код не выполнится, и обращение к self.page в унаследованных методах вызовет AttributeError."}, {"question": "Что означает запись class RegistrationPage(BasePage):?", "options": ["RegistrationPage и BasePage — два независимых класса без связи", "Это создаёт объект класса BasePage с именем RegistrationPage", "RegistrationPage наследуется от BasePage и автоматически получает его атрибуты и методы", "BasePage наследуется от RegistrationPage"], "correct": 2, "explain": "Имя в скобках после имени класса — это родительский класс. RegistrationPage становится дочерним классом и получает всё, что определено в BasePage, если явно не переопределит это сам."}, {"question": "В базовом классе Animal есть метод make_sound(), возвращающий '...'. В классе Dog(Animal) объявлен свой метод make_sound(), возвращающий 'Woof!'. Что вернёт Dog('Rex').make_sound()?", "options": ["Оба значения сразу: '...Woof!'", "Ошибка — нельзя объявлять метод с тем же именем, что и у родителя", "'Woof!' — переопределённый метод дочернего класса используется вместо родительского", "'...' — метод родителя всегда имеет приоритет"], "correct": 2, "explain": "Если дочерний класс объявляет метод с тем же именем, что и у родителя, вызывается именно версия дочернего класса — это и называется переопределением метода."}, {"question": "В RegistrationPage метод open_page() реализован так: def open_page(self): super().open(self.URL). Что делает эта строчка?", "options": ["Вызывает метод open() из родительского класса BasePage, передавая туда self.URL", "Переопределяет метод open() в родительском классе", "Создаёт новый объект класса BasePage", "Ничего не делает — super() без __init__ не имеет смысла"], "correct": 0, "explain": "super() позволяет обращаться не только к __init__, но и к любому другому методу родителя. Здесь open_page() переиспользует готовую логику BasePage.open(), просто подставляя уже известный self.URL."}, {"question": "В RegistrationPage атрибут URL объявлен прямо в теле класса, а не через self.URL внутри __init__. Почему?", "options": ["Потому что значение одно и то же для всех объектов этого класса, и не нужно передавать его через __init__", "Потому что URL нельзя использовать как имя атрибута", "Разницы нет, оба варианта работают ровно одинаково в любых случаях", "Потому что self.URL — синтаксическая ошибка"], "correct": 0, "explain": "URL страницы регистрации не меняется от объекта к объекту, поэтому его логично объявить один раз на уровне класса, а не заполнять индивидуально в конструкторе каждого экземпляра."}], "exercise": {"prompt": "Дан класс TestUser (username, age, is_adult()). Создай класс AdminUser(TestUser), который в __init__ принимает дополнительный параметр permissions (список строк), вызывает super().__init__(...) для username и age, и сохраняет permissions в self.permissions. Добавь метод has_permission(name).", "starter": "class TestUser:\n    def __init__(self, username, age):\n        self.username = username\n        self.age = age\n\n    def is_adult(self):\n        return self.age >= 18\n\n\nclass AdminUser(TestUser):\n    def __init__(self, username, age, permissions):\n        # вызови super().__init__(...) для username и age\n        # сохрани permissions в self.permissions\n        pass\n\n    def has_permission(self, name):\n        # верни True, если name есть в self.permissions, иначе False\n        pass\n", "tests": "def test_admin_inherits_username_and_age():\n    admin = AdminUser(\"ivan\", 30, [\"view_reports\"])\n    assert admin.username == \"ivan\", \"AdminUser должен получить username через super().__init__()\"\n    assert admin.age == 30, \"AdminUser должен получить age через super().__init__()\"\n\n\ndef test_admin_is_adult_inherited():\n    admin = AdminUser(\"ivan\", 30, [])\n    assert admin.is_adult() is True, \"AdminUser должен унаследовать метод is_adult() без переопределения\"\n\n\ndef test_has_permission_true():\n    admin = AdminUser(\"ivan\", 30, [\"view_reports\", \"edit_users\"])\n    assert admin.has_permission(\"edit_users\") is True, \"edit_users есть в списке permissions\"\n\n\ndef test_has_permission_false():\n    admin = AdminUser(\"ivan\", 30, [\"view_reports\"])\n    assert admin.has_permission(\"delete_users\") is False, \"delete_users нет в списке permissions\"\n"}}, {"id": "p17", "section": "Модуль 0 · Python-база", "subgroup": "Неделя 2", "isOverview": false, "num": "0.12", "title": "Модули и пакеты", "content": "# 0.12. Модули и пакеты\n\n## Зачем это нужно\n\n`boilerplate/` — это не один файл, а десятки файлов, разложенных по папкам (`pages/`, позже `api/`, `tests/`). Чтобы код из одного файла мог использовать классы и функции из другого, нужен импорт. Именно поэтому в начале `registration_page.py` (см. прошлый урок) стоит строчка `from pages.base_page import BasePage` — без понимания модулей и пакетов эта строчка выглядит как магия.\n\n## Теория\n\n**Модуль** — это просто один `.py`-файл. Если в файле `mymodule.py` объявлена функция и переменная:\n\n```python\n# mymodule.py\nGREETING = \"hello\"\n\ndef shout(text):\n    return text.upper() + \"!\"\n```\n\nто из другого файла в том же каталоге их можно импортировать:\n\n```python\nimport mymodule\n\nprint(mymodule.GREETING)\nprint(mymodule.shout(\"hi\"))\n```\n\nИли, если нужны только конкретные имена — без обращения через точку:\n\n```python\nfrom mymodule import shout\n\nprint(shout(\"hi\"))\n```\n\nДля длинных или часто встречающихся имён модулей используют псевдоним через `as` — так делают, например, стандартно для `pandas as pd` в аналитике; в тестовом коде это тоже иногда встречается для сокращения:\n\n```python\nimport mymodule as mm\n```\n\nСтандартная библиотека Python — это набор готовых модулей, которые не нужно ничего доустанавливать: `math`, `random`, `json`, `datetime`, `os` и десятки других. Импортируются они точно так же, как свои модули: `import math`.\n\n**Важно**: не используй `from module import *` (импорт вообще всего) — так легко случайно затереть чужое имя своим или своё чужим, и непонятно, откуда взялась та или иная функция при чтении кода. Явный импорт конкретных имён — лучшая практика.\n\n### __name__ == \"__main__\"\n\nУ каждого модуля есть служебная переменная `__name__`. Если файл запускают напрямую (`python mymodule.py`), она равна `\"__main__\"`. Если файл импортируют из другого файла — она равна имени модуля. Эта проверка часто встречается в реальном коде, чтобы отделить \"код, который выполняется только при прямом запуске\" (например, ручной тест модуля) от того, что должно работать и при импорте:\n\n```python\ndef main():\n    print(\"Running as a script\")\n\nif __name__ == \"__main__\":\n    main()\n```\n\n### Пакеты\n\n**Пакет** — это каталог с модулями, который сам может импортироваться как единое целое. Таков `pages/` в `boilerplate/` — это пакет, а `base_page.py` и `registration_page.py` внутри него — модули этого пакета. Импорт из пакета выглядит как путь через точку:\n\n```python\nfrom pages.base_page import BasePage\n```\n\nЗдесь `pages` — имя пакета (каталога), `base_page` — имя модуля (файла `base_page.py` внутри него), `BasePage` — класс, объявленный в этом модуле. Именно так устроена вторая строчка импорта в `registration_page.py`, который ты уже видел в прошлом уроке.\n\nРаньше для того, чтобы Python воспринимал каталог как пакет, требовался пустой файл `__init__.py` внутри него. В современном Python (3.3+) это не обязательно, но такой файл всё ещё часто встречается в проектах — в том числе как место для настройки того, что именно \"видно\" при импорте всего пакета целиком.\n\n## Пример\n\nСтруктура из двух файлов в одном каталоге:\n\n```\nproject/\n├── formatters.py\n└── main.py\n```\n\n`formatters.py`:\n\n```python\ndef format_report(test_name, passed):\n    status = \"PASSED\" if passed else \"FAILED\"\n    return f\"[{status}] {test_name}\"\n```\n\n`main.py`:\n\n```python\nfrom formatters import format_report\n\nprint(format_report(\"test_login\", True))\n# [PASSED] test_login\n\nif __name__ == \"__main__\":\n    print(\"Script started directly\")\n```\n\nА вот как это выглядит на уровне пакета — ровно структура `boilerplate/pages/`:\n\n```\nboilerplate/\n└── pages/\n    ├── base_page.py         # class BasePage\n    └── registration_page.py  # class RegistrationPage(BasePage)\n```\n\n```python\n# в любом другом файле проекта\nfrom pages.base_page import BasePage\nfrom pages.registration_page import RegistrationPage\n```\n\n## Частые ошибки\n\n- `from module import *` — импортирует всё подряд, включая то, что может незаметно конфликтовать с уже существующими именами.\n- Забыть, что модуль выполняется целиком в момент импорта — если в модуле \"на верхнем уровне\" (не внутри функции) написан код с побочными эффектами (например, `print(...)`), он выполнится при каждом импорте.\n- Путать `import module` (обращение через `module.name`) и `from module import name` (обращение напрямую как `name`) — это разные способы, выбирай осознанно, а не смешивай хаотично.\n- Циклический импорт (модуль А импортирует Б, а Б импортирует А) — приводит к трудноуловимым ошибкам; обычно решается пересмотром структуры кода.\n\n## Мини-задание\n\nСоздай два файла в одной папке: `calculators.py` с функцией `calculate_discount(price, percent)` (возвращает цену со скидкой) и `main.py`, который импортирует эту функцию через `from calculators import calculate_discount` и печатает результат для пары значений. Добавь в `main.py` проверку `if __name__ == \"__main__\":` вокруг вызова.\n", "hasPractice": true, "quiz": [{"question": "Почему в реальном коде не рекомендуется писать from module import * вместо явного импорта конкретных имён?", "options": ["Потому что такая запись вызывает SyntaxError", "Потому что так легко случайно затереть имя из текущего кода или не понять, откуда взялась функция при чтении", "Потому что она работает только для встроенных модулей, но не для своих", "Потому что она делает импорт заметно медленнее"], "correct": 1, "explain": "Импорт * подключает сразу всё содержимое модуля, из-за чего легко получить конфликт имён и потерять возможность понять при чтении кода, откуда взялось то или иное имя."}, {"question": "После import mymodule как обратиться к функции shout, объявленной в mymodule.py?", "options": ["mymodule.shout(\"hi\")", "from.shout(\"hi\")", "mymodule::shout(\"hi\")", "shout(\"hi\")"], "correct": 0, "explain": "import module подключает всё пространство имён модуля целиком, и обращаться к его содержимому нужно через точку: module.name. Прямой доступ по имени (shout(...)) работает только при from module import shout."}, {"question": "Для чего используется конструкция if __name__ == \"__main__\": в модуле?", "options": ["Чтобы код внутри неё выполнялся только при прямом запуске файла, но не при его импорте из другого модуля", "Это обязательная конструкция, без которой файл вообще нельзя импортировать", "Чтобы отметить главный (самый важный) модуль в проекте для документации", "Чтобы Python быстрее находил этот модуль при импорте"], "correct": 0, "explain": "__name__ равен \"__main__\" только при прямом запуске файла (python file.py) и имени модуля — при импорте из другого файла. Проверка позволяет разделить эти два сценария."}, {"question": "Дан пакет pages/ с файлом base_page.py, где объявлен класс BasePage. Как импортировать этот класс из другого файла проекта?", "options": ["import pages as BasePage", "import BasePage", "from base_page.pages import BasePage", "from pages.base_page import BasePage"], "correct": 3, "explain": "Путь импорта через точку повторяет структуру каталогов: pages — имя пакета, base_page — модуль внутри него, BasePage — класс, объявленный в этом модуле."}, {"question": "В модуле course.py на верхнем уровне (вне функций) написана строчка print(\"loaded\"). Что произойдёт при import course в другом файле?", "options": ["Строка \"loaded\" выведется в консоль в момент импорта", "Возникнет ошибка — print() нельзя использовать вне функций", "Строка выведется только при повторном импорте этого же модуля", "Ничего — код модуля не выполняется при импорте, только определения функций/классов регистрируются"], "correct": 0, "explain": "Модуль выполняется целиком в момент первого импорта — весь код на верхнем уровне отработает, включая print() и любые другие побочные эффекты."}], "exercise": {"prompt": "В уроке предлагается разнести calculate_discount(price, percent) в отдельный модуль calculators.py и импортировать её в main.py. В песочнице нет файловой системы и реального import, поэтому здесь ты проверяешь саму функцию calculate_discount(price, percent), которую в реальном проекте вынес бы в модуль.", "starter": "def calculate_discount(price, percent):\n    # верни цену со скидкой percent процентов\n    pass\n", "tests": "def test_discount_basic():\n    assert calculate_discount(1000, 10) == 900, \"скидка 10% от 1000 должна давать 900\"\n\n\ndef test_discount_zero_percent():\n    assert calculate_discount(500, 0) == 500, \"при скидке 0% цена не должна меняться\"\n\n\ndef test_discount_full():\n    assert calculate_discount(200, 100) == 0, \"при скидке 100% итоговая цена должна быть 0\"\n\n\ndef test_discount_float_result():\n    assert calculate_discount(150, 20) == 120, \"скидка 20% от 150 должна давать 120\"\n"}}, {"id": "p18", "section": "Модуль 0 · Python-база", "subgroup": "Неделя 2", "isOverview": false, "num": "0.13", "title": "Файлы и JSON", "content": "# 0.13. Файлы и JSON\n\n## Зачем это нужно\n\nТестовые данные (логины, ожидаемые ответы) часто хранят в отдельных файлах, а не прямо в коде — так их проще менять, не трогая сам тест. Ответы большинства современных API приходят в формате JSON, и структура JSON почти один в один совпадает со словарями и списками Python, которые ты уже знаешь. Это последний кусочек синтаксиса перед итоговым проектом модуля — скриптом, который реально дёргает публичное API и обрабатывает его JSON-ответ.\n\n## Теория\n\n### Открытие и закрытие файлов\n\nФункция `open(path, mode, encoding=...)` открывает файл. По умолчанию — режим чтения (`\"r\"`). Другие частые режимы: `\"w\"` (запись, стирает старое содержимое!), `\"a\"` (дозапись в конец, не стирая). Всегда указывай `encoding=\"utf-8\"` явно — иначе поведение может зависеть от настроек операционной системы.\n\nОткрытый файл обязательно нужно закрывать после использования (`file.close()`), иначе данные могут не сохраниться или файл останется заблокированным. Вместо того чтобы помнить об этом вручную, используют **менеджер контекста** `with` — он гарантированно закроет файл, даже если внутри блока произойдёт ошибка:\n\n```python\nwith open(\"data.txt\", encoding=\"utf-8\") as file:\n    content = file.read()\n# файл уже закрыт здесь, даже если что-то пошло не так внутри блока\n```\n\nМетоды чтения: `.read()` — весь файл одной строкой, `.readline()` — одна строка, `.readlines()` — список всех строк. Чаще всего для построчной обработки используют цикл, потому что файл сам по себе — итерируемый объект:\n\n```python\nwith open(\"data.txt\", encoding=\"utf-8\") as file:\n    for line in file:\n        print(line.strip())   # .strip() убирает символ переноса строки '\\n'\n```\n\nЗапись — методом `.write()` (принимает строку, не добавляет перенос строки автоматически) или `.writelines()` (список строк):\n\n```python\nwith open(\"out.txt\", \"w\", encoding=\"utf-8\") as file:\n    file.write(\"first line\\n\")\n    file.write(\"second line\\n\")\n```\n\n### Обработка отсутствующего файла\n\nЕсли файла не существует, `open()` на чтение вызовет исключение `FileNotFoundError`, и программа аварийно завершится. Чтобы этого не происходило, ошибку оборачивают в `try/except`:\n\n```python\ntry:\n    with open(\"data.txt\", encoding=\"utf-8\") as file:\n        content = file.read()\nexcept FileNotFoundError:\n    print(\"Файл не найден, использую значения по умолчанию\")\n    content = \"\"\n```\n\nЭто единственная конструкция обработки исключений, которая нужна на этом этапе курса — подробно `try/except` разберём позже, когда он понадобится для более сложных сценариев (в API-тестах, например).\n\n### Модуль json\n\nJSON (JavaScript Object Notation) — текстовый формат данных, который выглядит почти как словари и списки Python: `{}` — объект (словарь), `[]` — массив (список), строки в двойных кавычках, числа, `true`/`false`/`null` (в Python эквивалентны `True`/`False`/`None`).\n\nМодуль `json` из стандартной библиотеки умеет превращать JSON-текст в Python-объекты и обратно:\n\n| Функция | Что делает |\n|---|---|\n| `json.loads(text)` | строка JSON → объект Python (словарь/список) |\n| `json.dumps(obj)` | объект Python → строка JSON |\n| `json.load(file)` | читает JSON прямо из открытого файла → объект Python |\n| `json.dump(obj, file)` | записывает объект Python в файл в формате JSON |\n\n```python\nimport json\n\ndata = {\"id\": 1, \"username\": \"ivan\", \"is_active\": True}\n\n# в строку и обратно\njson_text = json.dumps(data)\nprint(json_text)                    # '{\"id\": 1, \"username\": \"ivan\", \"is_active\": true}'\nrestored = json.loads(json_text)\nprint(restored[\"username\"])         # ivan\n\n# в файл и обратно\nwith open(\"user.json\", \"w\", encoding=\"utf-8\") as file:\n    json.dump(data, file, ensure_ascii=False, indent=2)\n\nwith open(\"user.json\", encoding=\"utf-8\") as file:\n    loaded = json.load(file)\n    print(loaded)\n```\n\nПараметр `indent=2` в `json.dump()` делает файл читаемым для человека (с отступами), а `ensure_ascii=False` — чтобы кириллица сохранялась как есть, а не превращалась в `\\uXXXX`-последовательности.\n\n## Пример\n\n```python\nimport json\n\ntest_results = [\n    {\"test\": \"test_login\", \"status\": \"passed\"},\n    {\"test\": \"test_registration\", \"status\": \"failed\"},\n]\n\n# сохраняем результаты в файл\nwith open(\"results.json\", \"w\", encoding=\"utf-8\") as file:\n    json.dump(test_results, file, ensure_ascii=False, indent=2)\n\n# читаем обратно и считаем упавшие тесты\ntry:\n    with open(\"results.json\", encoding=\"utf-8\") as file:\n        loaded_results = json.load(file)\nexcept FileNotFoundError:\n    loaded_results = []\n\nfailed = [r[\"test\"] for r in loaded_results if r[\"status\"] == \"failed\"]\nprint(f\"Failed tests: {failed}\")\n# Failed tests: ['test_registration']\n```\n\n## Частые ошибки\n\n- Забыть `encoding=\"utf-8\"` — на некоторых системах кириллица и спецсимволы читаются/пишутся некорректно.\n- Открыть файл в режиме `\"w\"`, рассчитывая дозаписать в конец, — режим `\"w\"` стирает старое содержимое, для дозаписи нужен `\"a\"`.\n- Не обработать `FileNotFoundError` — скрипт падает с трудночитаемым traceback вместо понятного сообщения.\n- Перепутать `json.dump`/`json.load` (работают с открытым файлом) и `json.dumps`/`json.loads` (работают со строкой) — буква `s` на конце означает \"string\".\n\n## Мини-задание\n\nСоздай список из 3–4 словарей, описывающих тестовых пользователей (`username`, `email`, `age`). Сохрани его в файл `users.json` с помощью `json.dump` (с отступами и поддержкой кириллицы). Затем открой этот файл заново, прочитай через `json.load`, оберни чтение в `try/except FileNotFoundError` и выведи количество пользователей старше 18 лет.\n", "hasPractice": true, "quiz": [{"question": "Чем json.dump() отличается от json.dumps()?", "options": ["dumps() записывает данные в файл, а dump() возвращает строку", "dump() работает только с числами, а dumps() — только со строками", "Это два названия одной и той же функции", "dump() пишет данные сразу в открытый файл, а dumps() возвращает строку JSON"], "correct": 3, "explain": "Буква 's' на конце (dumps/loads) означает работу со строкой (string). dump()/load() без 's' работают напрямую с уже открытым файлом."}, {"question": "В чём главное преимущество использования with open(...) as file: по сравнению с обычным file = open(...) без with?", "options": ["with работает быстрее при любых объёмах данных", "with — единственный способ читать файлы в кодировке UTF-8", "with гарантированно закроет файл даже при возникновении ошибки внутри блока", "with позволяет открывать сразу несколько файлов одной командой"], "correct": 2, "explain": "Менеджер контекста with автоматически вызывает закрытие файла при выходе из блока, в том числе если внутри произошло исключение — в отличие от ручного file.close(), которое легко забыть выполнить при ошибке."}, {"question": "Как правильно обработать ситуацию, когда открываемого на чтение файла не существует?", "options": ["Обернуть open() в try/except FileNotFoundError, чтобы скрипт не падал с traceback", "Такую ситуацию невозможно обработать, только перезапустить скрипт", "Просто игнорировать ошибку — Python сам создаст пустой файл при чтении", "Использовать режим 'w' вместо 'r', тогда ошибки не будет"], "correct": 0, "explain": "open() на чтение несуществующего файла выбрасывает FileNotFoundError. Обработка через try/except позволяет скрипту продолжить работу вместо аварийного завершения."}, {"question": "Что произойдёт с существующим содержимым файла out.txt при выполнении open(\"out.txt\", \"w\")?", "options": ["Файл откроется только на чтение", "Новые данные допишутся в конец, старое содержимое сохранится", "Старое содержимое будет полностью стёрто", "Возникнет ошибка, если файл уже существует"], "correct": 2, "explain": "Режим \"w\" при открытии сразу очищает файл. Для дозаписи в конец существующего содержимого нужен режим \"a\"."}, {"question": "Дан ответ сервера в виде обычной строки Python (не файл): response_text = '{\"id\": 1}'. Какой функцией правильно превратить её в словарь?", "options": ["json.dumps(response_text)", "json.loads(response_text)", "json.dump(response_text)", "json.load(response_text)"], "correct": 1, "explain": "json.loads() (с 's' на конце) принимает строку JSON и возвращает объект Python. json.load() рассчитан на открытый файловый объект, а не на строку."}], "exercise": {"prompt": "В уроке предлагается сохранить список тестовых пользователей в users.json и прочитать обратно. В песочнице нет диска, поэтому здесь ты работаешь с той же сериализацией через json.dumps/json.loads на строке: напиши serialize_users(users), deserialize_users(json_text) и count_adults(users) (количество пользователей старше 18 лет).", "starter": "import json\n\n\ndef serialize_users(users):\n    # верни JSON-строку, представляющую список users (используй json.dumps)\n    pass\n\n\ndef deserialize_users(json_text):\n    # верни список пользователей, восстановленный из JSON-строки (используй json.loads)\n    pass\n\n\ndef count_adults(users):\n    # верни количество пользователей старше 18 лет (age > 18)\n    pass\n", "tests": "USERS = [\n    {\"username\": \"ivan\", \"email\": \"ivan@example.com\", \"age\": 25},\n    {\"username\": \"olga\", \"email\": \"olga@example.com\", \"age\": 17},\n    {\"username\": \"petr\", \"email\": \"petr@example.com\", \"age\": 19},\n]\n\n\ndef test_serialize_returns_string():\n    result = serialize_users(USERS)\n    assert isinstance(result, str), \"serialize_users должна возвращать строку JSON, а не список\"\n\n\ndef test_roundtrip_preserves_data():\n    json_text = serialize_users(USERS)\n    restored = deserialize_users(json_text)\n    assert restored == USERS, \"после сериализации и обратного разбора данные должны совпадать с исходными\"\n\n\ndef test_count_adults():\n    assert count_adults(USERS) == 2, \"среди USERS двое старше 18 лет (ivan и petr)\"\n\n\ndef test_count_adults_empty():\n    assert count_adults([]) == 0, \"для пустого списка количество взрослых должно быть 0\"\n"}}, {"id": "p19", "section": "Модуль 0 · Python-база", "subgroup": "Неделя 2", "isOverview": false, "num": "0.14", "title": "Генераторы и полезные функции: map, filter, zip, sorted", "content": "# 0.14. Генераторы и полезные функции: map, filter, zip, sorted\n\n## Зачем это нужно\n\nОбработка списка ответов API, сравнение двух наборов тестовых данных, сортировка результатов по времени выполнения — типичные задачи, для которых Python предлагает готовые компактные инструменты вместо ручных циклов. Эти функции повсеместно встречаются в чужом коде, и без них любой более-менее плотный кусок обработки данных будет выглядеть нечитаемым набором `for`-циклов.\n\n## Теория\n\n### map() — применить функцию к каждому элементу\n\n```python\nmap(function, iterable)\n```\n\nВозвращает **итератор** (объект, который можно перебрать один раз), а не готовый список — поэтому результат часто оборачивают в `list()`:\n\n```python\nprices = [\"10\", \"25\", \"99\"]\nprices_as_numbers = list(map(int, prices))\nprint(prices_as_numbers)   # [10, 25, 99]\n```\n\nЭквивалент через генератор списков (чаще выбирают его, если функция простая):\n\n```python\nprices_as_numbers = [int(p) for p in prices]\n```\n\n### filter() — отобрать элементы по условию\n\n```python\nfilter(function, iterable)\n```\n\nОставляет только те элементы, для которых `function` вернула `True`. Тоже возвращает итератор:\n\n```python\nnumbers = [1, 2, 3, 4, 5, 6]\neven = list(filter(lambda x: x % 2 == 0, numbers))\nprint(even)   # [2, 4, 6]\n```\n\nЭквивалент через генератор списков: `[x for x in numbers if x % 2 == 0]` — обе формы равноправны, выбор часто дело вкуса и читаемости.\n\n### zip() — \"сшить\" несколько коллекций поэлементно\n\n```python\nnames = [\"ivan\", \"olga\"]\nages = [25, 30]\n\nfor name, age in zip(names, ages):\n    print(name, age)\n# ivan 25\n# olga 30\n```\n\nОстанавливается на самой короткой из переданных коллекций. Полезно, когда данные приходят раздельными списками, а обрабатывать их нужно парами.\n\n### sorted() с аргументом key\n\n`sorted(iterable, key=..., reverse=...)` — уже знакомая функция, но с аргументом `key` она раскрывается по-настоящему: `key` — это функция, которая вычисляет \"значение для сравнения\" для каждого элемента, вместо сравнения элементов напрямую.\n\n```python\nusers = [\n    {\"name\": \"Ivan\", \"age\": 25},\n    {\"name\": \"Olga\", \"age\": 19},\n    {\"name\": \"Petr\", \"age\": 40},\n]\n\nby_age = sorted(users, key=lambda u: u[\"age\"])\nby_age_desc = sorted(users, key=lambda u: u[\"age\"], reverse=True)\n```\n\nБез `key` Python не знает, как сравнивать два словаря между собой — `key` явно указывает, по какому полю сортировать.\n\n### all() и any()\n\n`all(iterable)` — `True`, если **все** элементы истинны; `any(iterable)` — `True`, если истинен **хотя бы один**. Удобно комбинировать с `map()` для проверки условия по всей коллекции без ручного цикла:\n\n```python\nstatuses = [200, 200, 200]\nprint(all(s == 200 for s in statuses))   # True — все запросы успешны\n\nstatuses_with_error = [200, 500, 200]\nprint(any(s >= 500 for s in statuses_with_error))   # True — хотя бы одна ошибка сервера\n```\n\nОбрати внимание на запись `(s == 200 for s in statuses)` — это **генератор**, синтаксически похожий на генератор списков, но в круглых, а не квадратных скобках. Разница с `[s == 200 for s in statuses]` в том, что генератор не строит список целиком в памяти, а отдаёт значения по одному, \"на лету\" — для `all()`/`any()`/`sum()` этого достаточно, и это немного экономнее по памяти на больших данных. На этом уровне достаточно знать, что такая форма существует и означает то же самое, что и генератор списков, только \"ленивее\".\n\n## Пример\n\nТипичная обработка списка ответов API — то, чем ты будешь заниматься в итоговом проекте этого модуля:\n\n```python\nresponses = [\n    {\"id\": 1, \"status\": 200, \"duration_ms\": 120},\n    {\"id\": 2, \"status\": 404, \"duration_ms\": 80},\n    {\"id\": 3, \"status\": 200, \"duration_ms\": 340},\n    {\"id\": 4, \"status\": 500, \"duration_ms\": 50},\n]\n\n# только успешные ответы\nsuccessful = list(filter(lambda r: r[\"status\"] == 200, responses))\nprint(len(successful))   # 2\n\n# длительности всех запросов\ndurations = list(map(lambda r: r[\"duration_ms\"], responses))\nprint(durations)   # [120, 80, 340, 50]\n\n# самый медленный запрос\nslowest = sorted(responses, key=lambda r: r[\"duration_ms\"], reverse=True)[0]\nprint(slowest[\"id\"])   # 3\n\n# есть ли хоть одна ошибка сервера (5xx)?\nhas_server_error = any(r[\"status\"] >= 500 for r in responses)\nprint(has_server_error)   # True\n\n# id и статус попарно\nfor id_, status in zip(map(lambda r: r[\"id\"], responses), map(lambda r: r[\"status\"], responses)):\n    print(id_, status)\n```\n\n## Частые ошибки\n\n- Забыть обернуть `map()`/`filter()` в `list()`, если нужен именно список, а не одноразовый итератор — попытка второй раз пройтись по нему циклом ничего не даст.\n- Использовать `map`/`filter` там, где обычный генератор списков читается понятнее — выбор инструмента должен улучшать читаемость, а не демонстрировать знание синтаксиса.\n- Забыть `key` в `sorted()` при сортировке списка словарей/объектов — Python не поймёт, как их сравнивать, и выбросит ошибку.\n- Перепутать `all()` (все обязаны быть истинными) и `any()` (достаточно одного) — логическая ошибка, которую легко не заметить в собственном тесте.\n\n## Мини-задание\n\nДан список словарей с результатами тестов: `[{\"name\": \"t1\", \"duration_ms\": 120}, {\"name\": \"t2\", \"duration_ms\": 45}, {\"name\": \"t3\", \"duration_ms\": 300}]`. С помощью `sorted()` и `key` получи список названий тестов, отсортированных по возрастанию длительности. С помощью `filter` и `lambda` оставь только тесты длиннее 100 мс. С помощью `any()` проверь, есть ли тест длиннее 250 мс.\n", "hasPractice": true, "quiz": [{"question": "Что нужно сделать, чтобы получить обычный список из результата map(int, ['1', '2', '3'])?", "options": ["Обернуть результат в list(): list(map(int, ['1', '2', '3']))", "Вызвать .to_list() у результата map()", "Ничего не нужно — map() уже возвращает список", "Использовать map вместо filter"], "correct": 0, "explain": "map() возвращает итератор, а не готовый список — его нужно явно обернуть в list(), если требуется сохранить или несколько раз использовать результат."}, {"question": "Есть список словарей users = [{'name': 'Ivan', 'age': 25}, {'name': 'Olga', 'age': 19}]. Что произойдёт при вызове sorted(users) без параметра key?", "options": ["Возникнет ошибка — Python не знает, как сравнивать два словаря между собой без key", "Функция вернёт список в исходном порядке без изменений", "Список отсортируется по полю 'name' автоматически", "Список отсортируется по полю 'age' автоматически"], "correct": 0, "explain": "Словари сами по себе не поддерживают сравнение больше/меньше. Параметр key явно указывает, какое значение из каждого элемента использовать для сравнения при сортировке."}, {"question": "Что делает filter(lambda x: x % 2 == 0, numbers)?", "options": ["Удаляет из numbers все чётные элементы", "Оставляет только те элементы numbers, для которых lambda вернула True", "Сортирует numbers по чётности элементов", "Применяет lambda к каждому элементу и возвращает список результатов вызова"], "correct": 1, "explain": "filter() проверяет каждый элемент функцией-предикатом и оставляет только те, для которых она вернула True — в данном случае это чётные числа."}, {"question": "Дано names = ['ivan', 'olga', 'petr'] и ages = [25, 30]. Сколько пар вернёт zip(names, ages)?", "options": ["0 пар — списки разной длины нельзя передавать в zip", "2 пары —
