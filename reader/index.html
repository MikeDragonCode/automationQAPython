zip останавливается на самой короткой коллекции", "Ошибка выполнения", "3 пары, для третьего имени age будет None"], "correct": 1, "explain": "zip() перебирает коллекции параллельно и останавливается, как только заканчивается самая короткая из них — недостающих значений он не придумывает и не выбрасывает ошибку."}, {"question": "Дан список statuses = [200, 500, 200]. Что вернёт any(s >= 500 for s in statuses)?", "options": ["False — не все элементы удовлетворяют условию", "Список из булевых значений [False, True, False]", "True — хотя бы один элемент удовлетворяет условию", "500 — само значение, которое подошло"], "correct": 2, "explain": "any() возвращает True, если истинен хотя бы один элемент. Здесь второй статус (500) удовлетворяет условию s >= 500, этого достаточно для True."}], "exercise": {"prompt": "Дан список словарей с результатами тестов (name, duration_ms). Напиши sorted_names_by_duration(results) (sorted() + key), slow_tests(results, threshold=100) (filter + lambda) и has_test_longer_than(results, threshold) (any()).", "starter": "def sorted_names_by_duration(results):\n    # верни список названий (name), отсортированных по возрастанию duration_ms\n    pass\n\n\ndef slow_tests(results, threshold=100):\n    # верни список результатов (словарей), у которых duration_ms > threshold\n    # используй filter и lambda\n    pass\n\n\ndef has_test_longer_than(results, threshold):\n    # верни True, если хотя бы один тест длиннее threshold мс (используй any())\n    pass\n", "tests": "RESULTS = [{\"name\": \"t1\", \"duration_ms\": 120}, {\"name\": \"t2\", \"duration_ms\": 45}, {\"name\": \"t3\", \"duration_ms\": 300}]\n\n\ndef test_sorted_names_by_duration():\n    assert sorted_names_by_duration(RESULTS) == [\"t2\", \"t1\", \"t3\"], \"имена должны идти в порядке возрастания duration_ms\"\n\n\ndef test_slow_tests_default_threshold():\n    result = slow_tests(RESULTS)\n    names = [r[\"name\"] for r in result]\n    assert names == [\"t1\", \"t3\"], f\"должны остаться только тесты с duration_ms > 100: {names}\"\n\n\ndef test_slow_tests_custom_threshold():\n    result = slow_tests(RESULTS, threshold=200)\n    names = [r[\"name\"] for r in result]\n    assert names == [\"t3\"], f\"с порогом 200 должен остаться только t3: {names}\"\n\n\ndef test_has_test_longer_than_true():\n    assert has_test_longer_than(RESULTS, 250) is True, \"t3 длится 300 мс, что больше 250\"\n\n\ndef test_has_test_longer_than_false():\n    assert has_test_longer_than(RESULTS, 1000) is False, \"ни один тест не длится дольше 1000 мс\"\n"}}, {"id": "p20", "section": "Модуль 0 · Python-база", "subgroup": "Неделя 2", "isOverview": false, "num": "0.15", "title": "Итоговый проект модуля — скрипт-парсер публичного API", "content": "# 0.15. Итоговый проект модуля — скрипт-парсер публичного API\n\n## Зачем это нужно\n\nЭто первая проверка, что синтаксис Python реально усвоен, а не просто \"пройден по конспекту\". Никакого pytest и никаких фреймворков здесь ещё нет — это придёт в модуле 1. Сейчас важно ровно одно: написать самостоятельный рабочий скрипт от начала до конца, который берёт данные снаружи (из интернета), а не только из захардкоженных в коде списков, и что-то осмысленное с ними делает. Это ровно то, чем ежедневно занимается automation engineer при подготовке тестовых данных или разборе логов ответа API — только пока без тестового фреймворка вокруг.\n\n## Что нужно сделать\n\nНапиши скрипт `final_project.py`, который:\n\n1. Обращается к публичному API без ключей и токенов. Рекомендуемый вариант — [JSONPlaceholder](https://jsonplaceholder.typicode.com/), например к эндпоинту `https://jsonplaceholder.typicode.com/todos` (список задач с полями `userId`, `id`, `title`, `completed`). Подойдёт и любой другой публичный открытый API без авторизации, если он отдаёт JSON — например что-то из каталога [publicapis.org](https://publicapis.org/).\n2. Делает HTTP-запрос модулем `urllib.request` из стандартной библиотеки (ничего дополнительно устанавливать не нужно) **или** модулем `requests`, если он у тебя уже установлен и ты хочешь попробовать. Для `urllib` это выглядит примерно так:\n\n   ```python\n   import json\n   import urllib.request\n\n   with urllib.request.urlopen(\"https://jsonplaceholder.typicode.com/todos\") as response:\n       raw_data = response.read()\n\n   todos = json.loads(raw_data)\n   ```\n\n3. Разбирает полученный JSON в обычные Python-объекты (список словарей) — используя `json.loads()` (для `urllib`) или `.json()` (для `requests`).\n4. Выполняет над данными хотя бы одну содержательную обработку — не просто печатает всё подряд. Например (выбери один вариант или придумай свой в том же духе):\n   - посчитать количество выполненных (`completed: true`) и невыполненных задач по каждому `userId`;\n   - отфильтровать и оставить только задачи одного конкретного пользователя;\n   - найти пользователя с наибольшим числом выполненных задач.\n5. Сохраняет результат обработки (не исходные \"сырые\" данные, а именно то, что получилось после обработки) в локальный файл `result.json` через `json.dump()`, с `ensure_ascii=False` и `indent=2`.\n6. Также печатает короткую человекочитаемую сводку в консоль (2–5 строк).\n7. Оборачивает сетевой запрос в `try/except`, чтобы при отсутствии интернета или ошибке сервера скрипт не падал с длинным traceback, а печатал понятное сообщение и корректно завершался.\n\n## Ограничения\n\n- Никакого `pytest`, `unittest` и вообще тестовых фреймворков — они будут в модуле 1. Это обычный Python-скрипт, запускаемый как `python final_project.py`.\n- Никаких API с ключами/токенами/регистрацией — только полностью открытые.\n- Используй минимум 2 собственные функции (`def`) — весь код одним куском без единой функции не принимается.\n- Код должен реально запускаться и завершаться без необработанных исключений (кроме случая намеренной проверки отсутствия сети — там должно быть корректное сообщение, а не traceback).\n\n## Критерии \"готово\"\n\n- [ ] Скрипт запускается командой `python final_project.py` и не падает.\n- [ ] Делает реальный HTTP GET-запрос к публичному API (`urllib.request` или `requests`).\n- [ ] Полученный ответ распарсен в Python-объекты через `json` (не руками через `.split()` и подобное).\n- [ ] Есть минимум одна агрегация/фильтрация данных (не просто вывод \"как есть\").\n- [ ] Результат обработки сохранён в `result.json` в текущей папке — с отступами и читаемой кириллицей, если она есть.\n- [ ] В консоль выводится краткая сводка результата.\n- [ ] Сетевая ошибка (например, при выключенном интернете) обрабатывается через `try/except` и не приводит к падению с traceback.\n- [ ] В коде есть минимум 2 функции с понятными именами и docstring или комментарием, объясняющим, что функция делает.\n\n## Подсказка по структуре (не обязательна к дословному повторению)\n\n```python\nimport json\nimport urllib.request\nimport urllib.error\n\n\ndef fetch_todos(url):\n    \"\"\"Делает GET-запрос и возвращает список словарей из JSON-ответа.\"\"\"\n    with urllib.request.urlopen(url, timeout=10) as response:\n        raw_data = response.read()\n    return json.loads(raw_data)\n\n\ndef summarize_by_user(todos):\n    \"\"\"Считает количество выполненных и невыполненных задач по каждому userId.\"\"\"\n    summary = {}\n    for todo in todos:\n        user_id = todo[\"userId\"]\n        summary.setdefault(user_id, {\"completed\": 0, \"not_completed\": 0})\n        key = \"completed\" if todo[\"completed\"] else \"not_completed\"\n        summary[user_id][key] += 1\n    return summary\n\n\ndef main():\n    url = \"https://jsonplaceholder.typicode.com/todos\"\n\n    try:\n        todos = fetch_todos(url)\n    except (urllib.error.URLError, TimeoutError) as error:\n        print(f\"Не удалось получить данные: {error}\")\n        return\n\n    summary = summarize_by_user(todos)\n\n    with open(\"result.json\", \"w\", encoding=\"utf-8\") as file:\n        json.dump(summary, file, ensure_ascii=False, indent=2)\n\n    print(f\"Обработано пользователей: {len(summary)}\")\n    for user_id, stats in summary.items():\n        print(f\"User {user_id}: completed={stats['completed']}, not_completed={stats['not_completed']}\")\n\n\nif __name__ == \"__main__\":\n    main()\n```\n\nСдавай сам файл `final_project.py` (в модулях 0–1 домашки сдаются как файлы, PR в общий репозиторий начнётся с модуля 2). Приложи также получившийся `result.json`, чтобы было видно результат реального запуска.\n", "hasPractice": false}, {"id": "p21", "section": "Модуль 1 · pytest как среда", "subgroup": null, "isOverview": true, "num": null, "title": "Модуль 1. pytest как среда", "content": "# Модуль 1. pytest как среда\n\nНедели 3–4. Источник материала: `stepik-playwright-ui-testing` (раздел 05 «Управление автотестами с Pytest») — идеи о находке тестов, маркерах и фикстурах переизложены на простых функциях, без Playwright; темы scope фикстур, параметризация, `pytest.ini`/`pyproject.toml` и assert-паттерны на исключениях и структурах написаны самостоятельно, по стандартным практикам pytest.\n\nПринципиальное ограничение модуля: **без UI и без API**. Все примеры — на чистых Python-функциях (`boilerplate/utils/string_utils.py` и собственные функции студента). Цель — довести базовые механики pytest до автоматизма, прежде чем в модулях 3–4 в тестах появятся HTTP и браузер.\n\n## Неделя 3. Основы: тесты, assert, параметризация, маркеры\n\n1. [1.1. Что такое pytest и зачем он нужен](#p22)\n2. [1.2. Как pytest находит тесты](#p23)\n3. [1.3. Первый тест и простые assert](#p24)\n4. [1.4. Параметризация тестов (@pytest.mark.parametrize)](#p25)\n5. [1.5. Маркеры тестов: @pytest.mark и запуск через -m](#p26)\n6. [1.6. Регистрация маркеров и --strict-markers](#p27)\n\n## Неделя 4. Фикстуры, conftest.py, продвинутые assert\n\n7. [1.7. Фикстуры: зачем нужны и как объявляются](#p28)\n8. [1.8. Фикстуры, которые зависят друг от друга](#p29)\n9. [1.9. Scope фикстур: function, class, session](#p30)\n10. [1.10. conftest.py: общие фикстуры для нескольких файлов](#p31)\n11. [1.11. Assert-паттерны: исключения и сложные структуры](#p32)\n12. [1.12. pytest.ini vs pyproject.toml](#p33)\n\n## Итог модуля\n\n[Домашнее задание](#p34): 10–15 тестов на простых утилитах (`boilerplate/utils/string_utils.py` и/или собственные функции) с фикстурами, параметризацией, маркерами и `conftest.py`. Сдаётся файлами — PR-флоу в общий репозиторий начнётся в модуле 2.\n", "hasPractice": false}, {"id": "p22", "section": "Модуль 1 · pytest как среда", "subgroup": "Неделя 3", "isOverview": false, "num": "1.1", "title": "Что такое pytest и зачем он нужен", "content": "# 1.1. Что такое pytest и зачем он нужен\n\n## Зачем это нужно\n\nВ любой вакансии QA Automation Engineer на Python встречается слово `pytest`. Это не совпадение: pytest — фактический стандарт для запуска тестов в Python-экосистеме, и дальше в этом курсе он будет использоваться в каждом модуле — для unit-тестов, API-тестов и UI-тестов на Playwright. Прежде чем усложнять тесты браузером или HTTP-запросами, важно понять, что вообще делает pytest и почему обычный Python-скрипт с проверками — это не то же самое, что автотест.\n\n## Теория\n\nДо этого модуля вы писали Python-код, который выполняется сверху вниз: скрипт запускается, делает свою работу и завершается. Если внутри есть `assert`, программа просто упадёт с ошибкой при первом же нарушении условия — и на этом всё.\n\nТакой подход работает, пока в проекте одна проверка. Но что происходит, когда проверок становится десять, пятьдесят, сто? Возникают вопросы:\n\n* Какие проверки нужно запустить — все или только часть?\n* Какие из них прошли успешно, а какие нет?\n* Если проверка не прошла — где именно и почему?\n* Как запустить только「быстрые」тесты, а не все сразу?\n\nОбычный скрипт не даёт ответов на эти вопросы «из коробки». Именно для этого существуют тестовые фреймворки, и pytest — самый популярный из них для Python.\n\n**pytest не выполняет действия за вас** (не открывает браузер, не делает HTTP-запросы) — это делают другие библиотеки (Playwright, requests). Задача pytest — организовывать, находить, запускать тесты и красиво показывать результат.\n\nКоротко: если ваш код выполняет действия — это делает *другая* библиотека. Если код проверяет, что действия дали ожидаемый результат, и pytest управляет тем, как и когда это проверяется — это тест.\n\n### Установка и запуск\n\npytest устанавливается как обычный пакет:\n\n```bash\npip install pytest\n```\n\nВ `boilerplate/requirements.txt` пакет уже указан — при установке зависимостей проекта pytest ставится автоматически.\n\nЗапустить тесты можно двумя способами:\n\n```bash\npytest\n```\n\n```bash\npython -m pytest\n```\n\nРазница на первый взгляд незаметна, но важна: `python -m pytest` добавляет текущую директорию в `sys.path`, поэтому импорты вида `from utils.string_utils import slugify` работают надёжнее независимо от того, откуда именно вы запускаете команду. В этом курсе везде используется именно `python -m pytest`.\n\nПосле запуска pytest самостоятельно найдёт тестовые файлы и функции (как именно — тема следующего урока), выполнит каждую как отдельный, независимый друг от друга тест и покажет итоговую статистику: сколько тестов прошло, сколько упало и где именно.\n\n## Пример\n\nВ `boilerplate` уже есть готовый пример — файл `boilerplate/tests/unit/test_string_utils.py`, который тестирует функции из `boilerplate/utils/string_utils.py` (`is_palindrome`, `slugify`, `chunk_list`, `count_vowels`). Запустите его в подробном режиме:\n\n```bash\npython -m pytest tests/unit/test_string_utils.py -v\n```\n\nВывод будет примерно таким:\n\n```\n======================== test session starts ========================\ncollected 11 items\n\ntests/unit/test_string_utils.py::test_is_palindrome[racecar-True] PASSED\ntests/unit/test_string_utils.py::test_is_palindrome[A man a plan a canal Panama-True] PASSED\ntests/unit/test_string_utils.py::test_is_palindrome[hello-False] PASSED\ntests/unit/test_string_utils.py::test_is_palindrome[-True] PASSED\ntests/unit/test_string_utils.py::test_slugify[Hello World-hello-world] PASSED\n...\ntests/unit/test_string_utils.py::test_count_vowels_counts_ru_and_en PASSED\n\n========================= 11 passed in 0.02s =========================\n```\n\npytest сам нашёл файл, нашёл все тестовые функции внутри него (включая параметризованные варианты — про них будет отдельный урок), выполнил их и посчитал итог. Ничего из этого не пришлось писать руками.\n\nДля сравнения попробуйте запустить тот же файл как обычный Python-скрипт:\n\n```bash\npython tests/unit/test_string_utils.py\n```\n\nНичего не произойдёт — файл просто отработает и завершится без вывода, потому что в нём нет кода, который вызывает тестовые функции напрямую. Тестовые функции существуют только для того, чтобы их находил и запускал pytest.\n\n## Частые ошибки\n\n* Пытаться запустить тестовый файл как обычный скрипт (`python test_file.py`) и удивляться, что «ничего не происходит» — тестовые функции просто не вызываются сами по себе.\n* Забыть установить pytest или активировать виртуальное окружение проекта перед запуском — команда `pytest` не найдётся или тесты будут использовать не те версии зависимостей.\n* Добавлять в тестовый файл блок `if __name__ == \"__main__\":`, пытаясь «запускать тест как скрипт» — это не нужно и не является тем, как принято работать с pytest.\n* Путать pytest с `unittest` (встроенным в Python модулем тестирования) — в pytest тесты пишутся как обычные функции с обычным `assert`, без классов `TestCase` и методов `self.assertEqual(...)`.\n\n## Мини-задание\n\n1. Убедитесь, что pytest установлен: `pip show pytest`.\n2. Запустите `python -m pytest tests/unit/test_string_utils.py -v` в `boilerplate` и посчитайте: сколько тестов было собрано (`collected`) и сколько прошло (`passed`).\n3. Попробуйте запустить этот же файл напрямую через `python tests/unit/test_string_utils.py` и в одном предложении объясните, почему ничего не произошло.\n", "hasPractice": true, "quiz": [{"question": "Что произойдёт, если запустить тестовый файл обычной командой `python tests/unit/test_string_utils.py` вместо `python -m pytest`?", "options": ["Файл отработает и завершится, но ни одна тестовая функция вызвана не будет", "Будет автоматически найден и запущен только первый тест в файле", "Тесты выполнятся точно так же, как через pytest, просто без красивого вывода", "Python выдаст синтаксическую ошибку, потому что файл содержит assert"], "correct": 0, "explain": "Тестовые функции существуют только для того, чтобы их находил и вызывал pytest. Обычный запуск файла через python не вызывает их сам по себе — файл просто выполнится сверху вниз без вывода о тестах."}, {"question": "Что из перечисленного делает pytest, а что — задача других библиотек (Playwright, requests)?", "options": ["pytest сам открывает браузер и делает HTTP-запросы, а Playwright и requests только проверяют результат", "pytest нужен только для API-тестов, для UI используется отдельный аналог", "pytest и Playwright выполняют одну и ту же работу параллельно для надёжности", "pytest организует, находит и запускает тесты, показывает результат, а сами действия (открыть браузер, сделать запрос) выполняют другие библиотеки"], "correct": 3, "explain": "pytest не управляет браузером и не делает запросы — этим занимаются Playwright и requests. Задача pytest — организовывать, находить, запускать тесты и агрегировать результат."}, {"question": "Почему в этом курсе для запуска тестов рекомендуется команда `python -m pytest`, а не просто `pytest`?", "options": ["`python -m pytest` добавляет текущую директорию в sys.path, из-за чего локальные импорты вида `from utils...` работают надёжнее", "`python -m pytest` работает быстрее, потому что пропускает discovery", "`python -m pytest` автоматически устанавливает недостающие зависимости проекта", "Команда `pytest` в принципе не существует отдельно от `python -m pytest`"], "correct": 0, "explain": "Разница именно в sys.path: `python -m pytest` запускает pytest как модуль из текущего интерпретатора, добавляя рабочую директорию в путь поиска модулей, что делает импорты вида `from utils.string_utils import slugify` более надёжными."}, {"question": "Чем `assert result == expected` в pytest удобнее эквивалентной проверки `self.assertEqual(result, expected)` из unittest?", "options": ["Используется обычное ключевое слово Python assert вместо набора специальных методов, при этом pytest всё равно показывает подробный диф значений при падении", "pytest не поддерживает сравнение через ==, поэтому assert — единственный вариант", "assert можно использовать только внутри классов TestCase, как и assertEqual", "assert выполняется быстрее, потому что не создаёт объект AssertionError"], "correct": 0, "explain": "В pytest не нужны специальные assert-методы: пишется обычный `assert`, а инструмент сам переписывает выражение (assertion rewriting) так, чтобы при падении показать подробности сравнения."}, {"question": "Какую из задач по мере роста числа проверок в проекте НЕ решает обычный Python-скрипт без тестового фреймворка?", "options": ["Использование переменных и функций", "Импорт сторонних библиотек вроде requests", "Выполнение кода сверху вниз", "Сбор общей статистики: сколько проверок прошло, сколько упало и где именно"], "correct": 3, "explain": "Обычный скрипт просто падает при первом же нарушенном assert и не умеет сам по себе собирать сводку по множеству независимых проверок — это и есть задача, которую решает pytest."}]}, {"id": "p23", "section": "Модуль 1 · pytest как среда", "subgroup": "Неделя 3", "isOverview": false, "num": "1.2", "title": "Как pytest находит тесты", "content": "# 1.2. Как pytest находит тесты\n\n## Зачем это нужно\n\nСамая частая проблема новичков с pytest — «я написал тест, а он не запускается». В 9 случаях из 10 причина в том, что файл или функция названы не по правилам, которые pytest использует для поиска тестов. Разобравшись один раз в правилах discovery, вы перестанете терять на этом время.\n\n## Теория\n\nКогда вы выполняете `pytest` без аргументов, инструмент не запускает все `.py`-файлы подряд — он ищет файлы и функции по конкретным правилам именования.\n\n### Правило для файлов\n\nПо умолчанию pytest ищет файлы, которые называются `test_*.py` (или `*_test.py`). Все остальные `.py`-файлы игнорируются как тестовые — в них может быть любой код, но pytest не станет заглядывать внутрь в поисках тестов.\n\n```\ntest_string_utils.py     # найдёт\nstring_utils_test.py     # тоже найдёт\nstring_utils.py          # проигнорирует — это код под тестом, не тест\nhelpers.py                # проигнорирует\n```\n\nВ этом курсе договорились всегда использовать префикс `test_` — так же делает и `boilerplate` (`tests/unit/test_string_utils.py`).\n\n### Правило для функций\n\nВнутри найденного файла pytest ищет функции, имя которых тоже начинается с `test_`.\n\n```python\ndef test_is_palindrome_true_for_racecar():   # найдёт и выполнит\n    ...\n\ndef is_palindrome_true_for_racecar():        # проигнорирует\n    ...\n```\n\nФункция без префикса `test_` для pytest — обычный Python-код, не тест. Ошибок и предупреждений при этом не будет: pytest просто молча её не соберёт.\n\n### testpaths и rootdir\n\nВ файле `boilerplate/pytest.ini` есть строка:\n\n```ini\ntestpaths = tests\n```\n\nОна говорит pytest: «ищи тесты только внутри папки `tests/`, не сканируй весь проект». Это ускоряет поиск и защищает от случайного попадания в сборку постороннего кода. `pytest.ini` также определяет **rootdir** — корень проекта, от которого считаются все относительные пути (`testpaths` в том числе).\n\n### Node id — как указать конкретный тест\n\nЕсли нужно запустить не всё подряд, а один файл, класс или даже одну функцию, используется node id — путь к файлу плюс `::` и имя теста:\n\n```bash\npython -m pytest tests/unit/test_string_utils.py\npython -m pytest tests/unit/test_string_utils.py::test_chunk_list_splits_evenly\n```\n\nЕщё один полезный инструмент отбора — флаг `-k`, который фильтрует тесты по подстроке в имени:\n\n```bash\npython -m pytest -k slugify\n```\n\nЭта команда запустит все тесты, в имени (и в id параметризованных вариантов) которых встречается `slugify` — например, `test_slugify[Hello World-hello-world]`.\n\n## Пример\n\nСтруктура `boilerplate` показывает типичный подход:\n\n```\nboilerplate/\n├── pytest.ini            # testpaths = tests\n└── tests/\n    ├── unit/\n    │   └── test_string_utils.py\n    ├── api/\n    │   └── test_users.py\n    └── ui/\n        └── test_registration.py\n```\n\nВсе тестовые файлы лежат в `tests/`, названы с префиксом `test_`, все тестовые функции внутри них тоже названы с префиксом `test_`. Благодаря `testpaths = tests` команда `python -m pytest`, запущенная из корня `boilerplate`, найдёт их все, а вот файл `utils/string_utils.py` даже не будет рассмотрен как потенциальный источник тестов — в нём просто нет функций с префиксом `test_`, да и лежит он вне `tests/`.\n\n## Частые ошибки\n\n* Файл лежит не в директории из `testpaths` (например, тест по ошибке создан в корне проекта, а не в `tests/`) — pytest его не найдёт при обычном запуске `python -m pytest`, хотя явный путь `python -m pytest my_test.py` сработает.\n* Тестовая функция названа без префикса `test_` (например, `check_palindrome()`) — pytest молча пропустит её, никакой ошибки не будет, и это легко не заметить.\n* Тестовый класс с собственным `__init__` — pytest не может создавать экземпляры таких классов и пропускает их со специальным предупреждением. В этом курсе тесты в основном пишутся как функции, а не как классы, именно чтобы не сталкиваться с этим ограничением.\n* Ожидание, что `-k слово` работает как точное совпадение имени — на самом деле это подстрока, и `-k user` заодно найдёт `test_user_data`, `test_users_client` и всё, что содержит эту подстроку.\n\n## Мини-задание\n\nВ своём учебном проекте (не в `boilerplate`) создайте файл `tests/test_discovery_demo.py` с двумя функциями:\n\n```python\ndef test_this_will_run():\n    assert 1 + 1 == 2\n\ndef this_will_not_run():\n    assert 1 + 1 == 3\n```\n\nЗапустите `python -m pytest -v` и убедитесь, что pytest собрал (`collected`) только один тест, а не два. Затем запустите этот же тест по node id: `python -m pytest tests/test_discovery_demo.py::test_this_will_run`.\n", "hasPractice": true, "quiz": [{"question": "Какая из следующих функций будет найдена и запущена pytest'ом по умолчанию?", "options": ["def Test_slugify():", "def slugify_test_case():", "def test_slugify_removes_spaces():", "def check_slugify_result():"], "correct": 2, "explain": "По умолчанию pytest ищет функции, имя которых начинается с 'test_' (именно с маленькой буквы и именно как префикс). Суффикс '_test' на конце имени функции, в отличие от имени файла, не подходит, как и вариант с заглавной 'Test_'."}, {"question": "Какой из перечисленных файлов pytest найдёт автоматически по стандартным правилам поиска тестовых файлов?", "options": ["check_string_utils.py", "utils_string.py", "helpers_for_tests.py", "string_utils_test.py"], "correct": 3, "explain": "По умолчанию pytest ищет файлы вида test_*.py или *_test.py. string_utils_test.py подходит под второй шаблон, остальные варианты не начинаются и не заканчиваются на test."}, {"question": "Для чего в pytest.ini используется настройка `testpaths = tests`?", "options": ["Она ограничивает поиск тестов директорией tests, ускоряя запуск и защищая от случайного сбора постороннего кода", "Без неё pytest вообще не сможет найти ни одного теста в проекте", "Она указывает pytest игнорировать все тесты внутри папки tests", "Она переименовывает папку с тестами в tests при каждом запуске"], "correct": 0, "explain": "testpaths говорит pytest, где именно искать тесты, вместо сканирования всего проекта — это и быстрее, и безопаснее с точки зрения случайного попадания постороннего кода в сборку."}, {"question": "Как запустить только одну конкретную тестовую функцию `test_chunk_list_splits_evenly` из файла `tests/unit/test_string_utils.py`?", "options": ["pytest -k tests/unit/test_string_utils.py", "pytest tests/unit/test_string_utils.py.test_chunk_list_splits_evenly", "pytest tests/unit/test_string_utils.py::test_chunk_list_splits_evenly", "pytest tests/unit/test_string_utils.py -only test_chunk_list_splits_evenly"], "correct": 2, "explain": "Node id строится как путь к файлу, символ :: и имя тестовой функции — именно так pytest адресует конкретный тест внутри файла."}, {"question": "В проекте есть тесты test_user_data, test_users_client и test_password. Что запустит команда `pytest -k user`?", "options": ["test_user_data и test_users_client, потому что -k ищет по подстроке в имени теста", "Только test_user_data, потому что имя совпадает точнее", "Все три теста, потому что -k не фильтрует, а только помечает совпадения", "Ни одного теста, потому что -k требует точного совпадения имени"], "correct": 0, "explain": "-k фильтрует тесты по подстроке, а не по точному совпадению, поэтому запустятся оба теста, в имени которых есть 'user' — test_user_data и test_users_client."}]}, {"id": "p24", "section": "Модуль 1 · pytest как среда", "subgroup": "Неделя 3", "isOverview": false, "num": "1.3", "title": "Первый тест и простые assert", "content": "# 1.3. Первый тест и простые assert\n\n## Зачем это нужно\n\nСам по себе тест без проверок ничего не стоит — pytest умеет находить и запускать функции, но именно `assert` внутри них решает, работает код или нет. Умение писать понятные, однозначные проверки и быстро читать вывод pytest при падении теста — базовый навык, без которого невозможно работать с автотестами дальше, будь то API или UI.\n\n## Теория\n\nВ отличие от `unittest` (модуль тестирования, встроенный в стандартную библиотеку Python), где нужно писать `self.assertEqual(a, b)`, `self.assertTrue(x)` и десятки похожих методов, в pytest используется обычное ключевое слово Python:\n\n```python\nassert условие\n```\n\nЕсли условие истинно — ничего не происходит, тест продолжается. Если ложно — pytest поднимает `AssertionError` и помечает тест как упавший.\n\nКлючевая особенность pytest — **assertion rewriting**: pytest переписывает `assert`-выражения так, чтобы при падении показать не просто «AssertionError», а подробности — какие именно значения сравнивались и чем они отличаются. Это то, что отличает `assert a == b` в pytest от того же кода в обычном Python-скрипте: в pytest вы получаете читаемый диф, а не голое исключение.\n\n### Что можно проверять через assert\n\n```python\nassert result == expected        # равенство\nassert result != expected        # неравенство\nassert \"abc\" in result           # вхождение\nassert result                    # истинность (truthy)\nassert not result                # ложность (falsy)\nassert result is None\nassert result is not None\n```\n\nОтдельных «специальных» функций для этого не нужно — весь арсенал сравнений Python работает напрямую.\n\n### Один тест — одна проверяемая идея\n\nТест может содержать несколько `assert` подряд, но как только первый из них не выполнится, выполнение теста немедленно прерывается — строки после упавшего `assert` не выполнятся вообще. Поэтому хорошая практика — называть тест так, чтобы по имени было понятно, какое именно поведение он проверяет, и держать в тесте связанные между собой проверки одного сценария, а не собирать в одну функцию проверки разных, не связанных друг с другом вещей.\n\n### Структура теста: Arrange-Act-Assert\n\nУдобный способ организовать тело теста — три условных шага:\n\n1. **Arrange** — подготовить входные данные.\n2. **Act** — вызвать проверяемую функцию.\n3. **Assert** — сравнить результат с ожиданием.\n\nДля маленьких тестов на чистых функциях первый шаг часто вырождается в одну строку или вовсе отсутствует.\n\n## Пример\n\nВозьмём функцию `count_vowels` из `boilerplate/utils/string_utils.py` и напишем для неё простой, непараметризованный тест (параметризацию разберём в следующем уроке):\n\n```python\nfrom utils.string_utils import count_vowels\n\n\ndef test_count_vowels_counts_ru_and_en():\n    # Act\n    result = count_vowels(\"Hello Привет\")\n\n    # Assert\n    assert result == 4\n```\n\nЕсли бы функция считала неверно и вернула, скажем, `3`, pytest показал бы примерно такое падение:\n\n```\ndef test_count_vowels_counts_ru_and_en():\n        result = count_vowels(\"Hello Привет\")\n>       assert result == 4\nE       assert 3 == 4\n\ntests/unit/test_string_utils.py:52: AssertionError\n```\n\nОбратите внимание: pytest сам подставил конкретные значения (`3 == 4`) — это и есть assertion rewriting в действии, вам не нужно было писать сообщение об ошибке вручную.\n\n## Частые ошибки\n\n* **Классическая ловушка**: `assert (result == expected, \"сообщение об ошибке\")`. Это выражение — не проверка с сообщением, а сравнение с непустым кортежем `(False, \"сообщение\")` или `(True, \"сообщение\")`, который в Python **всегда истинен**, потому что это непустой объект. Такой тест никогда не упадёт, даже если `result != expected`. Правильно передавать сообщение через запятую вне скобок: `assert result == expected, \"сообщение об ошибке\"`.\n* Сравнивать вычисленные дробные числа через `==` — из-за особенностей чисел с плавающей точкой `0.1 + 0.2 == 0.3` в Python равно `False`. Для таких случаев есть отдельный инструмент — `pytest.approx` (разберём в модуле 1, неделя 4).\n* Заворачивать `assert` в `try/except`, «чтобы тест не падал» — это не чинит проблему, а прячет её; тест перестаёт быть полезным.\n* Проверять сразу несколько независимых сценариев в одной функции («и так, и так, и ещё вот так») — при падении неясно, какая именно часть сломалась, а часть проверок после первого падения вообще не выполнится.\n\n## Мини-задание\n\nДля функции `slugify` из `boilerplate/utils/string_utils.py` напишите (в своём учебном проекте, без параметризации) три отдельных теста с говорящими именами:\n\n1. текст уже в нижнем регистре без изменений;\n2. текст, состоящий только из знаков препинания и пробелов (проверьте, что результат — пустая строка);\n3. текст с пробелами по краям.\n\nЗапустите их и убедитесь, что все три проходят.\n", "hasPractice": true, "quiz": [{"question": "Тест `assert (result == expected, \"значения не совпадают\")` никогда не падает, даже если result != expected. Почему?", "options": ["Потому что result и expected сравниваются как строки, а не как исходные типы", "Потому что для сравнения значений нужно использовать self.assertEqual, а не ==", "Потому что pytest по умолчанию игнорирует текстовые сообщения внутри assert", "Потому что assert в этой записи проверяет истинность непустого кортежа, а он всегда True"], "correct": 3, "explain": "Скобки превращают выражение в кортеж (result == expected, \"сообщение\"). Такой кортеж непустой, а значит всегда истинен в Python независимо от первого элемента — поэтому assert никогда не падает. Сообщение нужно передавать через запятую вне скобок: assert result == expected, \"сообщение\"."}, {"question": "В чём заключается 'assertion rewriting' в pytest?", "options": ["pytest переписывает тесты в формат unittest перед запуском", "При падении assert pytest показывает подробности — какие именно значения сравнивались и чем они отличаются, а не просто голое AssertionError", "pytest автоматически исправляет неверные assert на верные", "Assertion rewriting ускоряет выполнение тестов за счёт кеширования результатов"], "correct": 1, "explain": "pytest переписывает выражения assert так, чтобы при падении выводить читаемый диф сравниваемых значений — это и есть assertion rewriting, ключевое отличие от обычного Python-скрипта."}, {"question": "В тесте подряд идут три assert. Первый из них падает. Что произойдёт с оставшимися двумя?", "options": ["Тест будет автоматически помечен как skipped", "pytest пропустит первый assert и продолжит со второго", "Они всё равно выполнятся, и в отчёте будет видно, сколько всего assert упало", "Выполнение теста немедленно прервётся, оставшиеся assert не будут выполнены"], "correct": 3, "explain": "Как только первый assert поднимает AssertionError, выполнение функции теста прерывается сразу же — строки после него, включая другие assert, не выполняются вообще."}, {"question": "Почему сравнивать через == вычисленные значения с плавающей точкой (например, результат 0.1 + 0.2) считается плохой практикой в тестах?", "options": ["Это не проблема, если тест использует assertion rewriting", "Из-за особенностей внутреннего представления чисел с плавающей точкой такое сравнение может неожиданно оказаться False даже при верном по сути результате", "Python вообще не поддерживает сравнение float через ==", "== для float работает только внутри классов TestCase"], "correct": 1, "explain": "0.1 + 0.2 == 0.3 в Python равно False из-за округления при представлении дробных чисел — для таких сравнений в pytest есть отдельный инструмент, pytest.approx."}, {"question": "Почему оборачивать assert в try/except, «чтобы тест не падал», считается частой ошибкой новичков?", "options": ["Это замедляет выполнение теста в несколько раз", "Это не устраняет проблему в проверяемом коде, а лишь прячет её — тест перестаёт быть полезным сигналом о поломке", "try/except в Python работает только с исключениями типа ValueError", "pytest вообще не позволяет использовать try/except внутри тестовых функций"], "correct": 1, "explain": "Если завернуть assert в try/except и подавить исключение, тест будет проходить даже при реальной поломке кода — теряется весь смысл проверки."}]}, {"id": "p25", "section": "Модуль 1 · pytest как среда", "subgroup": "Неделя 3", "isOverview": false, "num": "1.4", "title": "Параметризация тестов (@pytest.mark.parametrize)", "content": "# 1.4. Параметризация тестов (@pytest.mark.parametrize)\n\n## Зачем это нужно\n\nОдна и та же функция обычно проверяется не на одном входном значении, а на нескольких: типичный случай, граничный случай, некорректный ввод. Копировать тестовую функцию под каждый набор данных — плохая идея: код дублируется, а при изменении логики проверки придётся править её в десяти местах. `@pytest.mark.parametrize` решает эту задачу — один тест, много входных данных.\n\n## Теория\n\nДекоратор `@pytest.mark.parametrize` принимает два аргумента:\n\n1. строку с именами аргументов через запятую;\n2. список наборов значений — по одному набору на тестовый «прогон».\n\n```python\n@pytest.mark.parametrize(\n    \"text, expected\",\n    [\n        (\"racecar\", True),\n        (\"hello\", False),\n    ],\n)\ndef test_is_palindrome(text, expected):\n    assert is_palindrome(text) is expected\n```\n\npytest превращает это в **два независимых теста** — по одному на каждую строку из списка. Каждый из них получает свои значения `text` и `expected` и падает или проходит отдельно от других: если один набор данных сломает функцию, остальные всё равно будут выполнены и покажут свой результат.\n\n### Как выглядят id параметризованных тестов\n\nВ выводе pytest каждый вариант получает собственный, автоматически сгенерированный идентификатор на основе переданных значений:\n\n```\ntest_is_palindrome[racecar-True]\ntest_is_palindrome[hello-False]\n```\n\nЭти id можно использовать и для точечного запуска: `python -m pytest tests/unit/test_string_utils.py -k racecar`.\n\nЕсли автоматические id получаются длинными или нечитаемыми (например, для сложных объектов), их можно задать вручную через параметр `ids`:\n\n```python\n@pytest.mark.parametrize(\n    \"text, expected\",\n    [(\"racecar\", True), (\"hello\", False)],\n    ids=[\"palindrome\", \"not-a-palindrome\"],\n)\n```\n\n### Несколько параметризаций на одном тесте\n\nЕсли применить `@pytest.mark.parametrize` дважды к одной функции, pytest выполнит тест для **всех комбинаций** значений из обоих декораторов (декартово произведение). Это мощный, но редко нужный на практике приём — используйте его аккуратно, чтобы не получить сотни тестов там, где хватило бы одного списка кортежей.\n\n## Пример\n\nЭто ровно то, что уже сделано в `boilerplate/tests/unit/test_string_utils.py`:\n\n```python\nimport pytest\n\nfrom utils.string_utils import chunk_list, count_vowels, is_palindrome, slugify\n\n\n@pytest.mark.unit\n@pytest.mark.parametrize(\n    \"text, expected\",\n    [\n        (\"racecar\", True),\n        (\"A man a plan a canal Panama\", True),\n        (\"hello\", False),\n        (\"\", True),\n    ],\n)\ndef test_is_palindrome(text, expected):\n    assert is_palindrome(text) is expected\n```\n\nОдин тест `test_is_palindrome` при запуске `python -m pytest -v` превращается в четыре строки вывода:\n\n```\ntest_is_palindrome[racecar-True] PASSED\ntest_is_palindrome[A man a plan a canal Panama-True] PASSED\ntest_is_palindrome[hello-False] PASSED\ntest_is_palindrome[-True] PASSED\n```\n\nОбратите внимание: имена аргументов в строке `\"text, expected\"` — это одновременно и параметры функции `def test_is_palindrome(text, expected):`, и заголовки колонок для списка кортежей ниже. Порядок значений внутри каждого кортежа должен совпадать с порядком имён в строке.\n\n## Частые ошибки\n\n* Количество значений в кортеже не совпадает с количеством имён аргументов (например, названы `\"text, expected\"`, а в кортеже три значения) — pytest упадёт с ошибкой уже на этапе сбора тестов (`collection error`), а не во время выполнения.\n* Для одного аргумента оборачивать значения в лишние кортежи из одного элемента: если аргумент один, список выглядит как `[\"racecar\", \"hello\"]`, а не `[(\"racecar\",), (\"hello\",)]`.\n* Не давать `ids` там, где автоматические идентификаторы получаются нечитаемыми (например, для списков или словарей) — в выводе pytest тогда появляются что-то вроде `test_x[data0]`, `test_x[data1]`, по которым невозможно понять, какой именно случай упал.\n* Игнорировать параметризацию и продолжать писать пять почти одинаковых тестовых функций подряд «по старой памяти» — если тело теста и логика проверки одинаковы, а отличаются только данные, это сигнал использовать `parametrize`.\n\n## Мини-задание\n\nВозьмите функцию `count_vowels` из `boilerplate/utils/string_utils.py` и напишите для неё параметризованный тест минимум с 4 наборами данных: смешанный русский/английский текст, текст в верхнем регистре, текст без гласных (например, `\"rhythm gym\"`), пустая строка.\n", "hasPractice": true, "quiz": [{"question": "В коде `@pytest.mark.parametrize(\"text, expected\", [(\"racecar\", True, \"extra\")])` кортеж содержит три значения, а имён аргументов указано только два. Что произойдёт при запуске?", "options": ["Будет создано два отдельных теста: один с text и expected, второй с extra", "pytest упадёт с ошибкой ещё на этапе сбора тестов, до их выполнения", "Тест выполнится, а третье значение станет доступно как отдельный параметр extra", "pytest проигнорирует лишнее значение, и тест выполнится с двумя первыми значениями"], "correct": 1, "explain": "Количество значений в каждом наборе parametrize должно совпадать с количеством имён аргументов. Несовпадение — это ошибка конфигурации теста, и pytest сообщает о ней сразу при сборе тестов, а не пытается угадать, куда девать лишнее значение."}, {"question": "Тест декорирован `@pytest.mark.parametrize(\"text, expected\", [(\"racecar\", True), (\"hello\", False), (\"\", True)])`. Сколько отдельных прогонов теста создаст pytest?", "options": ["Один — все данные передаются в один общий вызов теста", "Шесть — по числу всех значений во всех кортежах суммарно", "Два — pytest объединяет прогоны с одинаковым типом ожидаемого результата", "Три — по одному прогону на каждый кортеж значений в списке"], "correct": 3, "explain": "Каждый кортеж из списка parametrize превращается в отдельный, независимый прогон теста — здесь три кортежа, значит будет три прогона со своими id в выводе."}, {"question": "Зачем в @pytest.mark.parametrize нужен необязательный параметр ids?", "options": ["Он задаёт понятные, читаемые идентификаторы для каждого набора данных вместо автоматически сгенерированных", "Он определяет порядок, в котором должны выполняться параметризованные прогоны", "Он подставляет случайные значения id для защиты от повторного запуска одних и тех же тестов", "Без него pytest вообще откажется запускать параметризованный тест"], "correct": 0, "explain": "Когда автоматические id получаются длинными или нечитаемыми (например, для сложных объектов), ids позволяет вручную задать понятные подписи для каждого набора параметров в выводе pytest."}, {"question": "Что произойдёт, если применить @pytest.mark.parametrize дважды к одной тестовой функции с разными наборами данных?", "options": ["Значения из обоих декораторов объединятся в один общий плоский список", "Сработает только последний по порядку декоратор, первый будет проигнорирован", "pytest выполнит тест для всех комбинаций значений из обоих декораторов (декартово произведение)", "pytest выдаст ошибку — двойная параметризация запрещена"], "correct": 2, "explain": "Два декоратора parametrize на одной функции комбинируются как декартово произведение — pytest выполнит тест для каждой пары значений из первого и второго набора."}, {"question": "В проекте есть 5 однотипных тестовых функций, отличающихся только входным значением и ожидаемым результатом при одинаковой логике проверки. Что стоит сделать по практике этого урока?", "options": ["Удалить 4 из них, оставив только один «репрезентативный» тест", "Объединить их в один тест с @pytest.mark.parametrize, передав все 5 наборов данных", "Оставить как есть — параметризация оправдана только начиная с 10+ наборов данных", "Переписать логику через pytest.raises, чтобы сократить количество строк кода"], "correct": 1, "explain": "Если тело теста и логика проверки одинаковы, а различаются только данные — это прямой сигнал использовать parametrize вместо копирования почти идентичных функций."}]}, {"id": "p26", "section": "Модуль 1 · pytest как среда", "subgroup": "Неделя 3", "isOverview": false, "num": "1.5", "title": "Маркеры тестов: @pytest.mark и запуск через -m", "content": "# 1.5. Маркеры тестов: @pytest.mark и запуск через -m\n\n## Зачем это нужно\n\nКогда в проекте появляются разные виды тестов — unit, API, UI — почти всегда нужно уметь запускать не всё сразу, а только нужную группу: например, только быстрые unit-тесты во время разработки и полный набор перед мержем. Именно для такого разделения существуют маркеры — и `boilerplate/pytest.ini` уже содержит готовый набор (`ui`, `api`, `unit`, `smoke`, `regress`), которым вы будете пользоваться весь курс.\n\n## Теория\n\nМаркер — это метка, которую можно повесить на тест с помощью декоратора `@pytest.mark.<имя>`:\n\n```python\nimport pytest\n\n\n@pytest.mark.unit\ndef test_something():\n    ...\n```\n\nВажно понимать: **маркер сам по себе никак не влияет на выполнение теста**. Он не меняет логику, не добавляет проверок — это чистая метаинформация, которую можно использовать при отборе тестов для запуска.\n\nНа один тест можно повесить сразу несколько маркеров:\n\n```python\n@pytest.mark.unit\n@pytest.mark.smoke\ndef test_something():\n    ...\n```\n\n### Запуск по маркеру\n\nФлаг `-m` фильтрует тесты по выражению с маркерами:\n\n```bash\npython -m pytest -m unit\n```\n\nВыполнит только тесты, помеченные `@pytest.mark.unit`.\n\nВыражение после `-m` поддерживает булеву логику — `and`, `or`, `not`:\n\n```bash\npython -m pytest -m \"unit and not smoke\"\npython -m pytest -m \"api or ui\"\n```\n\nЕсли выражение содержит пробелы, в shell его нужно обязательно взять в кавычки — иначе `and`/`or`/`not` будут восприняты как отдельные аргументы командной строки, а не части одного выражения.\n\n### Что если тестов с таким маркером нет\n\nЕсли под маркер не подошёл ни один тест, pytest не считает это ошибкой — он просто сообщит `no tests ran` и завершится с отдельным кодом возврата (это стоит иметь в виду, если вы настраиваете CI-скрипты, которые проверяют код завершения команды).\n\n## Пример\n\nВ `boilerplate/pytest.ini` уже зарегистрированы маркеры:\n\n```ini\n[pytest]\nmarkers =\n    ui: UI-тесты (Playwright)\n    api: API-тесты (requests)\n    unit: тесты чистых функций/утилит, без сети и без браузера\n    smoke: быстрый набор критичных проверок\n    regress: полный регрессионный набор\n```\n\nА в `boilerplate/tests/unit/test_string_utils.py` каждый тест помечен маркером `unit`:\n\n```python\n@pytest.mark.unit\n@pytest.mark.parametrize(...)\ndef test_is_palindrome(text, expected):\n    ...\n```\n\nЗапустите:\n\n```bash\npython -m pytest -m unit -v\n```\n\nи увидите только тесты из `test_string_utils.py` (в этом модуле других тестов, кроме unit, вы ещё не пишете). А команда:\n\n```bash\npython -m pytest -m \"api or ui\"\n```\n\nв самом `boilerplate` найдёт тесты из `tests/api/` и `tests/ui/` — они относятся к более поздним модулям курса, но уже сейчас можно увидеть, как один и тот же набор тестов делится на группы одной и той же командой `-m`.\n\n## Частые ошибки\n\n* Опечатка в имени маркера (`@pytest.mark.unti` вместо `unit`) — тест окажется помечен другим, несуществующим маркером и просто не попадёт в нужную выборку; без дополнительной настройки (см. следующий урок про `--strict-markers`) pytest в лучшем случае покажет предупреждение, которое легко пропустить.\n* Думать, что `-m` как-то ускоряет или распараллеливает выполнение — это не так, `-m` только выбирает подмножество уже найденных тестов, ничего не меняя в том, как каждый из них выполняется.\n* Забывать кавычки вокруг составного выражения с `and`/`or`/`not` в shell.\n* Помечать маркером тесты «на всякий случай», без чёткого критерия — если непонятно, что означает маркер и когда его использовать, он быстро теряет смысл как инструмент фильтрации.\n\n## Мини-задание\n\nВ `boilerplate` выполните `python -m pytest -m unit -v` и убедитесь, что в выводе только тесты из `test_string_utils.py`. Затем выполните `python -m pytest -m \"api or ui\"` и объясните в одно предложение, что означает получившийся результат (сколько тестов запустилось и почему).\n", "hasPractice": true, "quiz": [{"question": "Как запустить только тесты с маркером unit, исключив при этом тесты, которые дополнительно помечены маркером smoke?", "options": ["pytest -m unit smoke", "pytest -m \"unit, not smoke\"", "pytest --marker unit --exclude smoke", "pytest -m \"unit and not smoke\""], "correct": 3, "explain": "Флаг -m принимает выражение с булевой логикой (and, or, not). Выражение \"unit and not smoke\" выбирает тесты, помеченные unit, но при этом не помеченные smoke. Такое составное выражение нужно брать в кавычки, чтобы shell не разбил его на отдельные аргументы."}, {"question": "Верно ли утверждение: «маркер @pytest.mark.smoke сам по себе меняет логику выполнения теста, например делает его быстрее»?", "options": ["Нет, маркер влияет на порядок запуска тестов, но не на их логику", "Да, но только если маркер зарегистрирован в pytest.ini", "Да, маркеры автоматически оптимизируют скорость выполнения помеченных тестов", "Нет, маркер — это чистая метаинформация для последующего отбора тестов, на выполнение самого теста он не влияет"], "correct": 3, "explain": "Маркер не добавляет и не убирает никакой логики в тесте — это метка, по которой можно фильтровать тесты при запуске через -m, и только."}, {"question": "Можно ли повесить на один тест сразу два маркера, например unit и smoke?", "options": ["Да, но только если оба маркера относятся к одной группе (все UI или все API)", "Нет, у одного теста может быть только один маркер", "Нет, для нескольких маркеров нужен отдельный декоратор @pytest.mark.multi", "Да — достаточно написать оба декоратора @pytest.mark.unit и @pytest.mark.smoke подряд над функцией теста"], "correct": 3, "explain": "Маркеры складываются: над тестовой функцией можно указать сколько угодно декораторов @pytest.mark.<имя>, и тест будет откликаться на фильтрацию по любому из них."}, {"question": "Что произойдёт при запуске `pytest -m regress`, если в проекте пока нет ни одного теста с маркером regress?", "options": ["Будут запущены все тесты без маркеров вообще", "pytest автоматически удалит маркер regress из pytest.ini как неиспользуемый", "pytest сообщит, что тестов не запущено (no tests ran) — это не ошибка поиска, а нормальный результат фильтрации", "pytest завершится с ошибкой, потому что маркер ни разу не используется в коде"], "correct": 2, "explain": "Если под маркер не подошёл ни один тест, pytest не считает это ошибкой — просто сообщает, что ничего не запущено, хотя это стоит учитывать при настройке CI-скриптов."}, {"question": "Почему команда `pytest -m unit and not smoke` (без кавычек вокруг выражения) может отработать не так, как ожидалось в терминале?", "options": ["Без кавычек shell разобьёт выражение на отдельные аргументы, и and/not не будут восприняты как единое выражение для -m", "pytest вообще не поддерживает такой синтаксис ни в каком виде", "and и not — зарезервированные слова Python, их нельзя использовать в командной строке вообще", "Такая команда всегда возвращает ошибку PytestUnknownMarkWarning"], "correct": 0, "explain": "Составное выражение для -m обязательно нужно брать в кавычки — иначе shell передаст and, not и остальные слова как отдельные аргументы командной строки, а не как одно логическое выражение."}]}, {"id": "p27", "section": "Модуль 1 · pytest как среда", "subgroup": "Неделя 3", "isOverview": false, "num": "1.6", "title": "Регистрация маркеров и --strict-markers", "content": "# 1.6. Регистрация маркеров и --strict-markers\n\n## Зачем это нужно\n\nМаркер с опечаткой — одна из самых незаметных проблем в тестовых проектах: тест продолжает «зелёным» проходить локально, просто перестаёт попадать в нужную выборку по `-m`, и это может остаться незамеченным неделями, пока кто-то не спросит: «а почему в CI не запустился ни один smoke-тест?». `--strict-markers`, уже включённый в `boilerplate/pytest.ini`, превращает такую опечатку из тихой проблемы в громкую ошибку прямо на старте.\n\n## Теория\n\nЕсли использовать маркер, не сообщив о нём pytest заранее, появится предупреждение:\n\n```\nPytestUnknownMarkWarning: Unknown pytest.mark.something - is this a typo?\n```\n\nТест при этом всё равно выполнится — это только предупреждение, а не ошибка. Проблема в том, что предупреждения легко теряются в общем выводе, особенно в CI, где логов много.\n\n### Регистрация маркеров\n\nЧтобы pytest знал о маркере, его нужно зарегистрировать в конфиге — в этом курсе это `pytest.ini`:\n\n```ini\n[pytest]\nmarkers =\n    ui: UI-тесты (Playwright)\n    api: API-тесты (requests)\n    unit: тесты чистых функций/утилит, без сети и без браузера\n    smoke: быстрый набор критичных проверок\n    regress: полный регрессионный набор\n```\n\nФормат простой: имя маркера, двоеточие, короткое описание. Описание — не формальность: оно показывается в `pytest --markers` и помогает всей команде понимать, что означает каждый маркер, не заглядывая в код.\n\n### --strict-markers\n\nСама по себе регистрация в `markers =` убирает предупреждение, но не запрещает использовать незарегистрированные маркеры — предупреждение просто не появится для того, что не зарегистрировано, зато не появится и ошибки для нового, случайно написанного с опечаткой маркера. Флаг `--strict-markers` меняет поведение: любой маркер, отсутствующий в списке `markers =`, превращается в **ошибку** уже на этапе сбора тестов, и запуск падает целиком, а не продолжается с предупреждением.\n\nВ `boilerplate/pytest.ini` это уже включено через `addopts`:\n\n```ini\naddopts = -ra --strict-markers\ntestpaths = tests\n```\n\n`addopts` — список флагов командной строки, которые pytest подставляет автоматически при каждом запуске, как если бы вы вписывали их вручную в `python -m pytest ...`. Помимо `--strict-markers`, здесь есть `-ra` — флаг, включающий короткую сводку в конце запуска по всем тестам, результат которых отличается от простого «прошёл» (упавшие, пропущенные, ожидаемо неудавшиеся и т. п.), чтобы такие тесты не терялись в потоке точек и `PASSED`.\n\n## Пример\n\nДопустим, вы добавили тесту новый маркер, не вписав его в `pytest.ini`:\n\n```python\n@pytest.mark.slow\ndef test_something_heavy():\n    ...\n```\n\nПри `--strict-markers` запуск `python -m pytest` завершится ошибкой ещё до выполнения тестов:\n\n```\n'slow' not found in `markers` configuration option\n```\n\nЧтобы исправить, маркер нужно зарегистрировать точно так же, как уже сделано для остальных:\n\n```ini\n[pytest]\nmarkers =\n    ui: UI-тесты (Playwright)\n    api: API-тесты (requests)\n    unit: тесты чистых функций/утилит, без сети и без браузера\n    smoke: быстрый набор критичных проверок\n    regress: полный регрессионный набор\n    slow: тесты с заметным временем выполнения\n```\n\nПосле этого ошибка исчезает, а маркер `slow` становится полноценной, задокументированной частью проекта — как и остальные пять.\n\n## Частые ошибки\n\n* Добавить новый маркер в код теста и забыть зарегистрировать его в `pytest.ini` — с `--strict-markers` весь запуск (а не только один тест) остановится с ошибкой ещё до выполнения.\n* Зарегистрировать маркер без описания после двоеточия — формально сработает, но другим разработчикам придётся гадать, что маркер означает.\n* Считать, что `--strict-markers` также проверяет корректность имён фикстур — это не так, это два независимых механизма: незарегистрированная фикстура и так даёт отдельную понятную ошибку `fixture '...' not found`, `--strict-markers` касается исключительно маркеров.\n* Копировать `addopts` из чужого проекта без понимания, что означает каждый флаг — например, слепо добавлять флаги, специфичные для другого CI-окружения.\n\n## Мини-задание\n\nВ своём учебном проекте с настроенным `pytest.ini` (по образцу `boilerplate/pytest.ini`, включая `--strict-markers`) добавьте к одному из тестов маркер `@pytest.mark.wip`, не регистрируя его. Запустите `python -m pytest` и сохраните текст ошибки. Затем зарегистрируйте `wip` в `pytest.ini` и убедитесь, что запуск снова проходит без ошибок.\n", "hasPractice": true, "quiz": [{"question": "В pytest.ini включён --strict-markers. Кто-то добавил тесту @pytest.mark.slow, не вписав slow в список markers. Что произойдёт при запуске python -m pytest?", "options": ["Только этот тест будет пропущен (skipped), остальные выполнятся как обычно", "Тест выполнится, но в выводе появится предупреждение PytestUnknownMarkWarning", "Весь запуск завершится ошибкой ещё до выполнения тестов", "pytest сам автоматически допишет маркер slow в pytest.ini"], "correct": 2, "explain": "--strict-markers превращает использование незарегистрированного маркера из предупреждения в ошибку на этапе сбора тестов. Из-за неё падает весь запуск целиком, а не только тест с этим маркером — именно поэтому лишние маркеры нужно сразу регистрировать в pytest.ini."}, {"question": "Что происходит с тестом, если использовать незарегистрированный маркер БЕЗ включённого --strict-markers?", "options": ["Запуск pytest завершится ошибкой ещё до выполнения тестов", "pytest автоматически зарегистрирует такой маркер в pytest.ini", "Тест выполнится, но появится предупреждение PytestUnknownMarkWarning", "Тест не будет выполнен вовсе"], "correct": 2, "explain": "Без --strict-markers незарегистрированный маркер даёт только предупреждение — тест при этом всё равно выполняется, и предупреждение легко потерять в общем выводе."}, {"question": "Зачем в pytest.ini после имени маркера и двоеточия пишут короткое описание, например `unit: тесты чистых функций/утилит, без сети и без браузера`?", "options": ["Без описания pytest откажется регистрировать маркер", "Описание определяет, какие именно тесты автоматически попадут под этот маркер", "Описание используется для сортировки тестов по алфавиту в отчёте", "Описание — это документация для команды: оно показывается в pytest --markers и объясняет назначение маркера"], "correct": 3, "explain": "Формально pytest не требует непустого описания, но оно нужно как документация — чтобы любой участник команды понимал смысл маркера, не заглядывая в код тестов."}, {"question": "Что такое addopts в pytest.ini?", "options": ["Список флагов командной строки, которые pytest подставляет автоматически при каждом запуске", "Список тестов, которые нужно пропускать при каждом запуске", "Список дополнительных плагинов, устанавливаемых перед стартом тестов", "Список путей, где искать файлы conftest.py"], "correct": 0, "explain": "addopts — это флаги, которые pytest как будто дописывает к каждой команде запуска сам, без необходимости вводить их вручную каждый раз."}, {"question": "Проверяет ли --strict-markers корректность имён фикстур, используемых в тестах (например, опечатку в имени фикстуры)?", "options": ["Нет — это два независимых механизма; для незарегистрированной фикстуры pytest и так выдаёт отдельную понятную ошибку «fixture not found»", "Да, но только если фикстура определена в conftest.py", "Нет, ошибки в именах фикстур в pytest вообще никак не отслеживаются", "Да, это тот же самый механизм, что и для маркеров"], "correct": 0, "explain": "--strict-markers касается исключительно маркеров. Опечатки в именах фикстур обрабатываются другим, отдельным механизмом pytest, который и без strict-режима сразу выдаёт понятную ошибку."}]}, {"id": "p28", "section": "Модуль 1 · pytest как среда", "subgroup": "Неделя 4", "isOverview": false, "num": "1.7", "title": "Фикстуры: зачем нужны и как объявляются", "content": "# 1.7. Фикстуры: зачем нужны и как объявляются\n\n## Зачем это нужно\n\nНачиная с модуля 3 в `boilerplate/conftest.py` появятся фикстуры вроде `users_client` (готовый API-клиент) и `registration_page` (готовый Page Object). Вы будете получать их в тестах просто как параметр функции, даже не задумываясь, откуда они берутся. Чтобы это не выглядело магией, нужно один раз разобраться в механизме на простом примере — без API и без браузера.\n\n## Теория\n\n**Фикстура** — это функция, которая готовит данные или окружение для теста. pytest вызывает её сам и передаёт результат в тест — достаточно указать имя фикстуры как параметр тестовой функции.\n\nФикстура объявляется декоратором `@pytest.fixture`:\n\n```python\nimport pytest\n\n\n@pytest.fixture\ndef numbers():\n    return list(range(1, 11))\n```\n\nА используется так — просто как аргумент теста, без единого импорта:\n\n```python\ndef test_numbers_length(numbers):\n    assert len(numbers) == 10\n```\n\nКогда pytest видит параметр `numbers` в сигнатуре теста, он ищет фикстуру с таким именем, вызывает её и подставляет результат в переменную `numbers` внутри теста. Вы никогда не вызываете фикстуру напрямую — `numbers()` — этим занимается pytest.\n\n### Чем фикстура отличается от параметризации\n\nПараметризация (прошлый урок) — это несколько *разных* прогонов одного теста с разными входными данными. Фикстура — это подготовка *одних и тех же* (или предсказуемо подготовленных) данных или объекта, которые нужны тесту для работы, но не являются предметом самой проверки. Один и тот же тест обычно не «параметризуется через фикстуру» — для вариативности данных внутри одного теста используется `parametrize`, а фикстура отвечает за подготовку окружения.\n\n### yield-фикстуры: подготовка и очистка\n\nЕсли фикстуре нужно не только подготовить, но и «убрать за собой» после теста (закрыть файл, удалить временные данные, разорвать соединение), вместо `return` используется `yield`:\n\n```python\n@pytest.fixture\ndef tracked_numbers():\n    print(\"\\n[setup] готовим данные\")\n    data = list(range(1, 6))\n    yield data\n    print(\"[teardown] очистка после теста\")\n```\n\nКод до `yield` выполняется перед тестом, само значение после `yield` передаётся в тест, а код после `yield` выполняется после того, как тест завершится — независимо от того, прошёл он или упал.\n\n## Пример\n\nФикстура и тесты для функции `chunk_list` из `boilerplate/utils/string_utils.py`:\n\n```python\nimport pytest\n\nfrom utils.string_utils import chunk_list\n\n\n@pytest.fixture\ndef numbers():\n    return list(range(1, 11))\n\n\ndef test_chunk_list_by_three(numbers):\n    result = chunk_list(numbers, 3)\n    assert result[0] == [1, 2, 3]\n\n\ndef test_chunk_list_last_chunk_size(numbers):\n    result = chunk_list(numbers, 3)\n    assert result[-1] == [10]\n```\n\nОбе тестовые функции получают свежий список `[1, 2, ..., 10]`, ни разу не создавая его внутри тела теста напрямую. Если запустить эти тесты с флагами `-s -v` вместе с yield-версией фикстуры (`tracked_numbers`), в выводе будет видно, что `[setup]` печатается перед каждым тестом, а `[teardown]` — сразу после:\n\n```\n[setup] готовим данные\ntests/test_fixtures_demo.py::test_one PASSED\n[teardown] очистка после теста\n[setup] готовим данные\ntests/test_fixtures_demo.py::test_two PASSED\n[teardown] очистка после теста\n```\n\nЭто происходит потому, что фикстура без явно указанного `scope` пересоздаётся для *каждого* теста — подробнее об этом в следующем уроке.\n\n## Частые ошибки\n\n* Объявить `@pytest.fixture`, но не указать её имя в параметрах теста — тогда pytest просто не вызовет эту фикстуру для этого теста, и данные окажутся недоступны.\n* Вызывать фикстуру как обычную функцию: `data = numbers()` — так фикстуры не используются, это ломает саму идею (pytest должен вызывать её сам, с учётом scope и кеширования).\n* Писать код после `yield`, забыв, что до этого места фикстура «висит» в подготовленном состоянии на протяжении всего теста — если в setup-части (до `yield`) возникает исключение, тест не выполнится вовсе, а teardown-часть (после `yield`) не будет вызвана.\n* Использовать `return` и `yield` одновременно в одной фикстуре — до первого `return`/`yield` доходит выполнение, а код ниже становится недостижимым и не выполняется никогда.\n\n## Мини-задание\n\nНапишите фикстуру `sample_words`, возвращающую список из 5 слов (часть — палиндромы, часть — нет), и два теста, которые её используют: один проверяет длину списка, второй — что `is_palindrome(...)` для конкретного слова из списка возвращает ожидаемое значение.\n", "hasPractice": true, "quiz": [{"question": "Есть фикстура `@pytest.fixture def numbers(): return list(range(1, 11))`. Как правильно получить её результат внутри теста?", "options": ["Указать numbers как параметр тестовой функции", "Добавить декоратор @pytest.mark.numbers над тестом", "Вызвать её напрямую: data = numbers()", "Импортировать её: from conftest import numbers"], "correct": 0, "explain": "Фикстуры не вызываются вручную и не импортируются как обычные функции — pytest сам находит фикстуру по имени параметра тестовой функции, вызывает её и подставляет результат."}, {"question": "Чем фикстура принципиально отличается от параметризации (@pytest.mark.parametrize)?", "options": ["Parametrize даёт несколько прогонов теста с разными входными данными, а фикстура подготавливает данные или окружение, не порождая новых прогонов теста", "Фикстура даёт несколько разных прогонов одного теста с разными входными данными, а parametrize подготавливает окружение", "Фикстуры работают только с числами, а parametrize — только со строками", "Это два названия одного и того же механизма pytest"], "correct": 0, "explain": "Parametrize отвечает за вариативность входных данных одного теста, а фикстура — за подготовку окружения или данных, которые сами по себе не являются предметом сравнения разных вариантов теста."}, {"question": "В yield-фикстуре код расположен так: подготовка данных, `yield data`, затем код очистки. Когда выполнится код очистки?", "options": ["Только если тест завершился успешно", "После завершения теста, который использовал фикстуру, независимо от того, прошёл он или упал", "Код после yield в фикстурах не выполняется никогда", "Сразу после вызова фикстуры, ещё до начала теста"], "correct": 1, "explain": "Код до yield — это setup, значение после yield передаётся в тест, а код после yield — teardown, который pytest выполняет после теста в любом случае, вне зависимости от результата теста."}, {"question": "Что произойдёт, если объявить @pytest.fixture, но не указать её имя в параметрах ни одной тестовой функции?", "options": ["pytest не вызовет эту фикстуру вовсе — она просто не используется", "pytest выдаст ошибку о неиспользуемой фикстуре при сборе тестов", "Фикстура выполнится один раз в начале тестовой сессии по умолчанию", "pytest вызовет фикстуру автоматически для всех тестов в файле"], "correct": 0, "explain": "Фикстура вызывается только тогда, когда её имя явно указано как параметр теста (или другой фикстуры). Если ни один тест её не запрашивает, pytest её просто не вызывает."}, {"question": "В фикстуре сначала стоит `return data`, а следующей строкой — недостижимый код с `yield`. Что здесь не так?", "options": ["Ничего, pytest выполнит оба варианта по очереди", "pytest выберет yield, если тест ожидает генератор, и return — в противном случае", "Это стандартный способ создать фикстуру с двумя возможными результатами", "return и yield нельзя одновременно использовать так, чтобы оба реально сработали — выполнение остановится на первом из них, а код после станет недостижимым"], "correct": 3, "explain": "Функция фикстуры завершает выполнение на первом встреченном return или yield — если return стоит раньше, код с yield ниже уже никогда не выполнится, и teardown-логики не будет."}]}, {"id": "p29", "section": "Модуль 1 · pytest как среда", "subgroup": "Неделя 4", "isOverview": false, "num": "1.8", "title": "Фикстуры, которые зависят друг от друга", "content": "# 1.8. Фикстуры, которые зависят друг от друга\n\n## Зачем это нужно\n\nРеальная подготовка окружения редко бывает одноуровневой. Например, в модуле 4 вы встретите фикстуру `registration_page(page: Page)` — она сама зависит от другой фикстуры, `page`, которую предоставляет `pytest-playwright`. pytest умеет строить и разрешать такие цепочки автоматически, и это одна из самых полезных возможностей фреймворка — если понимать, как она работает.\n\n## Теория\n\nФикстура может запрашивать другую фикстуру точно так же, как это делает тест — просто указав её имя как свой параметр:\n\n```python\n@pytest.fixture\ndef registration_page(page: Page) -> RegistrationPage:\n    return RegistrationPage(page)\n```\n\nЗдесь `registration_page` зависит от `page`. Когда какой-то тест запрашивает `registration_page`, pytest сначала находит и вызывает `page`, передаёт её результат в `registration_page`, и только затем результат `registration_page` попадает в тест. Вся цепочка разрешается автоматически — вам не нужно вручную прописывать порядок вызова.\n\nЦепочки могут быть длиннее одного уровня: фикстура A зависит от B, B зависит от C — pytest построит граф зависимостей и вызовет всё в правильном порядке, от «самой глубокой» зависимости к «самой верхней».\n\n### Важная деталь: кеширование в пределах одного теста\n\nЕсли в одном тесте фикстура запрашивается сразу двумя способами — напрямую и через другую фикстуру, которая от неё зависит, — pytest вызовет эту фикстуру **только один раз** и переиспользует один и тот же результат в обоих местах. Это справедливо даже для фикстур с областью видимости по умолчанию (`function`, о которой пойдёт речь в следующем уроке): кеш действует не «на весь прогон», а «в пределах одного теста, который её запросил».\n\n## Пример\n\nПостроим двухуровневую цепочку на функциях из `boilerplate/utils/string_utils.py`:\n\n```python\nimport pytest\n\nfrom utils.string_utils import slugify\n\n\n@pytest.fixture\ndef raw_titles():\n    return [\"Hello World\", \"  Python  QA  \", \"Already-Slug\"]\n\n\n@pytest.fixture\ndef slugified_titles(raw_titles):\n    return [slugify(title) for title in raw_titles]\n\n\ndef test_slugified_titles_have_no_spaces(slugified_titles):\n    assert all(\" \" not in title for title in slugified_titles)\n\n\ndef test_slugified_titles_count_matches_source(slugified_titles, raw_titles):\n    assert len(slugified_titles) == len(raw_titles)\n```\n\nВо втором тесте запрошены сразу обе фикстуры — и `slugified_titles`, и `raw_titles`, от которой она зависит. Несмотря на это, `raw_titles` будет вызвана всего один раз за этот тест, а не дважды: один и тот же список `[\"Hello World\", \"  Python  QA  \", \"Already-Slug\"]` окажется и в переменной `raw_titles`, и внутри `slugified_titles`.\n\n## Частые ошибки\n\n* Строить циклическую зависимость (фикстура A запрашивает B, а B — снова A) — pytest не сможет разрешить такой граф и завершится ошибкой ещё на этапе сбора тестов.\n* Делать цепочки из четырёх-пяти уровней «просто потому что можно» — чем длиннее цепочка, тем сложнее понять, что на самом деле получает тест и в каком порядке всё собирается; там, где хватает одного уровня, не стоит усложнять.\n* Ожидать, что зависимая фикстура пересоздаст «родительскую» заново при повторном упоминании в том же тесте — как показано выше, в пределах одного теста результат кешируется и переиспользуется, а не вычисляется с нуля каждый раз.\n* Давать фикстурам имена, которые случайно совпадают с локальными переменными или именами функций в том же файле — это не сломает код, но будет сбивать с толку при чтении.\n\n## Мини-задание\n\nДобавьте третью фикстуру `unique_slugified_titles`, которая зависит от `slugified_titles` и убирает из списка дубликаты, сохраняя порядок (подсказка: `list(dict.fromkeys(...))`). Напишите тест, который проверяет, что в результате нет повторяющихся значений.\n", "hasPractice": true, "quiz": [{"question": "Тест одновременно запрашивает raw_titles и slugified_titles, при этом slugified_titles сама зависит от raw_titles. Сколько раз pytest вызовет фикстуру raw_titles в рамках этого одного теста?", "options": ["Столько раз, сколько элементов в списке, который она возвращает", "Два раза — один раз напрямую и один раз через slugified_titles", "Ни разу — pytest возьмёт данные прямо из результата slugified_titles", "Один раз — результат переиспользуется в обоих местах"], "correct": 3, "explain": "В пределах одного теста pytest вызывает каждую запрошенную фикстуру только один раз и кеширует результат — даже если на неё ссылаются несколько раз, напрямую и через зависимую фикстуру."}, {"question": "Как фикстура `registration_page(page: Page)` объявляет зависимость от другой фикстуры, `page`?", "options": ["Просто указав page как параметр функции самой фикстуры registration_page", "Через вызов page() внутри тела фикстуры registration_page", "Через специальный декоратор @pytest.fixture(depends_on=\"page\")", "Через импорт: from conftest import page"], "correct": 0, "explain": "Фикстура запрашивает другую фикстуру точно так же, как это делает тест — указывая её имя как свой параметр. Никакого специального синтаксиса для зависимостей фикстур не существует."}, {"question": "Что произойдёт, если фикстура A запросит фикстуру B, а фикстура B, в свою очередь, запросит фикстуру A?", "options": ["Будет создан бесконечный цикл вызовов, который прервётся по таймауту", "pytest выполнит обе по очереди, подставив значения по умолчанию", "pytest не сможет разрешить такой граф зависимостей и завершится ошибкой ещё на этапе сбора тестов", "Такая ситуация технически невозможна — Python не позволит объявить такие фикстуры"], "correct": 2, "explain": "Циклическая зависимость фикстур — ошибка конфигурации: pytest не может определить, с какой из них начать вызов, и сообщает об этом уже на этапе сбора тестов, до их выполнения."}, {"question": "Почему в уроке не рекомендуется без необходимости строить цепочки фикстур из четырёх-пяти уровней зависимости?", "options": ["Длинные цепочки фикстур несовместимы со scope=\"function\"", "pytest технически ограничивает глубину цепочки тремя уровнями", "Каждый дополнительный уровень цепочки заметно замедляет выполнение тестов", "Чем длиннее цепочка, тем сложнее понять, что именно получает тест и в каком порядке всё собирается"], "correct": 3, "explain": "Формальных ограничений на глубину цепочки нет, но чем она длиннее, тем труднее читать и поддерживать код — это вопрос читаемости, а не технического ограничения pytest."}, {"question": "Тест запрашивает только фикстуру slugified_titles, которая зависит от raw_titles, но сам тест raw_titles в своих параметрах не указывает. Может ли тест напрямую обратиться к результату raw_titles?", "options": ["Нет, потому что цепочки фикстур запрещено использовать без явного импорта", "Нет — тест получает только то, что явно указано в его собственных параметрах; raw_titles доступен только внутри slugified_titles", "Да, pytest автоматически добавляет все транзитивные зависимости фикстуры как переменные в тест", "Да, но только если обе фикстуры объявлены с scope=\"session\""], "correct": 1, "explain": "Каждая функция (тест или фикстура) получает только то, что явно указано в её собственной сигнатуре. Промежуточные зависимости фикстур не «протекают» автоматически в тест, если он их не запросил сам."}]}, {"id": "p30", "section": "Модуль 1 · pytest как среда", "subgroup": "Неделя 4", "isOverview": false, "num": "1.9", "title": "Scope фикстур: function, class, session", "content": "# 1.9. Scope фикстур: function, class, session\n\n## Зачем это нужно\n\nПозже в курсе вы будете создавать фикстуры для дорогих в подготовке ресурсов — HTTP-клиента, браузера, соединения с окружением. Пересоздавать их перед каждым тестом иногда расточительно по времени, но и делать «одну на всех» рискованно, если тест может случайно изменить то, что получил. `scope` — это именно тот рычаг, который управляет этим компромиссом, и его нужно понимать до того, как в фикстуре появится что-то дороже списка чисел.\n\n## Теория\n\nПо умолчанию у фикстуры область видимости (`scope`) равна `\"function\"` — она создаётся заново для **каждого** теста, который её запрашивает, и после теста не переживает. Это самый безопасный вариант: тесты полностью изолированы друг от друга и не могут случайно повлиять друг на друга через общий объект.\n\npytest поддерживает несколько значений `scope`; в этом уроке — три самых важных для старта:\n\n* **`function`** (по умолчанию) — новый экземпляр на каждый тест.\n* **`class`** — один экземпляр на весь тестовый класс: все тестовые методы внутри одного `class Test...` получают один и тот же объект, а для другого класса будет создан новый.\n* **`session`** — один экземпляр на весь запуск pytest целиком: все тесты во всех файлах получают ровно один и тот же объект.\n\nУказывается scope так:\n\n```python\n@pytest.fixture(scope=\"session\")\ndef something():\n    ...\n```\n\nСуществуют и более широкие/промежуточные scope (`module`, `package`), но для начала важнее твёрдо усвоить разницу между этими тремя.\n\n### Главный компромисс: безопасность против переиспользования\n\nБолее широкий scope означает, что объект **переживает несколько тестов**. Если этот объект — изменяемый (список, словарь) и один тест его модифицирует, изменение «утечёт» в следующий тест, который получит тот же самый объект, а не свежую копию. Это классический источник тестов, которые проходят по отдельности, но падают в другом порядке или все вместе — потому что на самом деле они не независимы, а тайно делят состояние.\n\nОбщее правило: используйте `function`-scope по умолчанию для всего, что тест может изменить. Расширяйте scope только для того, что дорого создавать и что безопасно читать, не изменяя (например, клиент для HTTP-запросов, который не хранит изменяемое состояние теста).\n\n> Забегая вперёд: именно поэтому в `boilerplate/conftest.py` фикстура `users_client` объявлена с `scope=\"session\"` — создать HTTP-клиент один раз на весь прогон дёшево и безопасно, а вот `user_data` (данные конкретного пользователя, которые должны быть разными в разных тестах) оставлена с scope по умолчанию.\n\n## Пример\n\n### function против session: утечка изменений\n\n```python\nimport pytest\n\n\n@pytest.fixture(scope=\"function\")\ndef function_scoped_words():\n    return [\"kayak\", \"hello\"]\n\n\n@pytest.fixture(scope=\"session\")\ndef session_scoped_words():\n    return [\"kayak\", \"hello\"]\n\n\ndef test_mutate_function_scoped(function_scoped_words):\n    function_scoped_words.append(\"racecar\")\n    assert len(function_scoped_words) == 3\n\n\ndef test_function_scoped_is_fresh_again(function_scoped_words):\n    # function-scope: для каждого теста — новый список\n    assert function_scoped_words == [\"kayak\", \"hello\"]\n\n\ndef test_mutate_session_scoped(session_scoped_words):\n    session_scoped_words.append(\"racecar\")\n    assert len(session_scoped_words) == 3\n\n\ndef test_session_scoped_keeps_the_mutation(session_scoped_words):\n    # session-scope: это тот же самый объект, что и в предыдущем тесте!\n    assert \"racecar\" in session_scoped_words\n```\n\nВторой тест из первой пары проходит именно потому, что `function_scoped_words` пересоздаётся заново. Второй тест из второй пары проходит по прямо противоположной причине — фикстура **не** пересоздаётся, и мутация из предыдущего теста никуда не делась.\n\n### class: одна фикстура на весь класс\n\n```python\nimport pytest\n\n\ncreation_log = []\n\n\n@pytest.fixture(scope=\"class\")\ndef big_dataset():\n    creation_log.append(\"created\")\n    return list(range(1, 1001))\n\n\nclass TestChunkingOnBigDataset:\n    def test_first_elements(self, big_dataset):\n        assert big_dataset[:3] == [1, 2, 3]\n\n    def test_dataset_length(self, big_dataset):\n        assert len(big_dataset) == 1000\n        assert len(creation_log) == 1  # фикстура создана один раз на весь класс\n```\n\nОба метода внутри `TestChunkingOnBigDataset` получают один и тот же список — `creation_log` после выполнения обоих тестов содержит только одну запись, хотя фикстуру запросили дважды.\n\n## Частые ошибки\n\n* Не учитывать, что более широкий scope означает общий, а не заново созданный объект, и мутировать его в тесте — самая частая причина «тестов, которые ломаются только вместе, а по отдельности проходят».\n* Ставить `scope=\"session\"` «для скорости» там, где создание объекта и без того дешёвое (например, для короткого списка или словаря) — выигрыш по времени незаметен, а риск случайно расшарить состояние остаётся.\n* Пытаться сделать fixture с `scope=\"session\"`, которая при этом зависит от `function`-scoped фикстуры — pytest не позволит этого (`ScopeMismatch`), потому что fixture с более широкой областью видимости не может опираться на то, что живёт меньше, чем она сама.\n* Путать `class`-scope с «на весь файл» — на самом деле область действия строго ограничена одним классом; тесты вне класса или в другом классе получат отдельный, новый экземпляр.\n\n## Мини-задание\n\nНапиши
