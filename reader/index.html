<meta charset="utf-8">
<title>QA Course Reader</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<style>
  :root{
    --paper:#f2f4f0;
    --surface:#e7ebe4;
    --surface-2:#dde3d9;
    --line:#cdd5c8;
    --ink:#1a2320;
    --muted:#5c6660;
    --accent:#1f6f5c;
    --accent-ink:#f3faf6;
    --accent-soft:#d9ebe2;
    --danger:#a8432f;
    --code-bg:#e6ebe3;
    --shadow: 0 1px 0 rgba(20,30,25,.04);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#101513;
      --surface:#171d1a;
      --surface-2:#1e2622;
      --line:#2b3530;
      --ink:#e8ede9;
      --muted:#8b9993;
      --accent:#54d8ae;
      --accent-ink:#062018;
      --accent-soft:#1c3a30;
      --danger:#e08a75;
      --code-bg:#151b18;
      --shadow: 0 1px 0 rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"]{
    --paper:#101513;
    --surface:#171d1a;
    --surface-2:#1e2622;
    --line:#2b3530;
    --ink:#e8ede9;
    --muted:#8b9993;
    --accent:#54d8ae;
    --accent-ink:#062018;
    --accent-soft:#1c3a30;
    --danger:#e08a75;
    --code-bg:#151b18;
    --shadow: 0 1px 0 rgba(0,0,0,.3);
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Source Serif 4', Georgia, 'Times New Roman', serif;
    height:100dvh;
    overflow:hidden;
  }
  .mono{font-family:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;}

  a{color:var(--accent);}
  ::selection{background:var(--accent-soft);}

  .app{
    display:grid;
    grid-template-columns: 320px 1fr;
    height:100dvh;
  }

  /* ---------- Sidebar ---------- */
  .sidebar{
    background:var(--surface);
    border-right:1px solid var(--line);
    display:flex;
    flex-direction:column;
    min-width:0;
    height:100dvh;
  }
  .brand{
    padding:20px 18px 14px;
    border-bottom:1px solid var(--line);
  }
  .brand-title{
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size:13px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--ink);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .brand-title .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block;flex:none;}
  .brand-sub{margin-top:4px;font-size:12px;color:var(--muted);}

  .progress-wrap{padding:12px 18px;border-bottom:1px solid var(--line);}
  .progress-line{
    display:flex;justify-content:space-between;align-items:baseline;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;color:var(--muted);letter-spacing:.03em;margin-bottom:6px;
  }
  .progress-line b{color:var(--ink);font-weight:600;}
  .progress-track{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line);}
  .progress-fill{height:100%;background:var(--accent);border-radius:3px 0 0 3px;transition:width .25s ease;}

  .search-wrap{padding:10px 18px;border-bottom:1px solid var(--line);}
  .search-input{
    width:100%;
    font:13px/1.4 'JetBrains Mono', monospace;
    padding:7px 10px;
    border:1px solid var(--line);
    border-radius:6px;
    background:var(--paper);
    color:var(--ink);
  }
  .search-input:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .search-input::placeholder{color:var(--muted);}

  .nav{
    flex:1;
    overflow-y:auto;
    padding:8px 0 24px;
  }
  .nav-section{border-bottom:1px solid var(--line);}
  .nav-section:last-child{border-bottom:none;}
  .nav-section summary{
    list-style:none;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding:10px 18px;
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    font-weight:600;
    letter-spacing:.02em;
    color:var(--ink);
  }
  .nav-section summary::-webkit-details-marker{display:none;}
  .nav-section summary .chev{color:var(--muted);transition:transform .15s ease;flex:none;}
  .nav-section[open] summary .chev{transform:rotate(90deg);}
  .nav-section summary .count{color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums;}
  .nav-body{padding-bottom:6px;}

  .nav-subgroup-label{
    padding:6px 18px 4px 26px;
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--muted);
  }

  .nav-item{
    display:flex;
    width:100%;
    align-items:flex-start;
    gap:8px;
    padding:6px 18px 6px 26px;
    background:none;
    border:none;
    text-align:left;
    cursor:pointer;
    font-family:inherit;
    color:var(--ink);
  }
  .nav-item:hover{background:var(--surface-2);}
  .nav-item.active{background:var(--accent-soft);}
  .nav-item .status{
    flex:none;
    width:9px;height:9px;
    margin-top:5px;
    border-radius:50%;
    border:1.5px solid var(--muted);
    background:transparent;
  }
  .nav-item.done .status{background:var(--accent);border-color:var(--accent);}
  .nav-item .num{
    flex:none;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--muted);
    margin-top:1px;
    min-width:30px;
  }
  .nav-item .label{font-size:13.5px;line-height:1.35;}
  .nav-item.overview .label{font-weight:600;}
  .nav-item[hidden]{display:none;}

  /* ---------- Content ---------- */
  .content-scroll{
    height:100dvh;
    overflow-y:auto;
  }
  .content-header{
    position:sticky;top:0;
    background:var(--paper);
    border-bottom:1px solid var(--line);
    padding:14px 40px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    z-index:2;
  }
  .crumb{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:var(--muted);
    letter-spacing:.02em;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .crumb b{color:var(--ink);}
  .header-actions{display:flex;align-items:center;gap:10px;flex:none;}
  .btn{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    font-weight:600;
    padding:7px 12px;
    border-radius:6px;
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--ink);
    cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;
    white-space:nowrap;
  }
  .btn:hover{border-color:var(--accent);}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .btn.done{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
  .btn.icon{padding:7px 9px;}

  .article-wrap{padding:8px 40px 96px;display:flex;justify-content:center;}
  .article{width:100%;max-width:70ch;padding-top:28px;}

  .kicker{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:var(--accent);
    text-transform:uppercase;
    letter-spacing:.08em;
    margin:0 0 10px;
  }

  .article h1{
    font-family:'Source Serif 4', serif;
    font-size:32px;
    font-weight:700;
    line-height:1.2;
    text-wrap:balance;
    margin:0 0 22px;
    padding-bottom:16px;
    border-bottom:2px solid var(--ink);
  }
  .article h2{
    font-family:'JetBrains Mono', monospace;
    font-size:12.5px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--accent);
    margin:36px 0 12px;
    padding-bottom:8px;
    border-bottom:1px solid var(--line);
  }
  .article h3{
    font-family:'JetBrains Mono', monospace;
    font-size:14px;
    font-weight:600;
    margin:26px 0 8px;
    color:var(--ink);
  }
  .article p{font-size:16.5px;line-height:1.68;margin:0 0 16px;}
  .article ul, .article ol{font-size:16.5px;line-height:1.68;margin:0 0 16px;padding-left:1.3em;}
  .article li{margin-bottom:6px;}
  .article li > ul, .article li > ol{margin-top:6px;}
  .article strong{font-weight:700;}
  .article blockquote{
    margin:0 0 16px;
    padding:2px 18px;
    border-left:3px solid var(--accent);
    color:var(--muted);
    font-style:italic;
  }
  .article blockquote p{margin:8px 0;}
  .article hr{border:none;border-top:1px solid var(--line);margin:32px 0;}

  .article code{
    font-family:'JetBrains Mono', monospace;
    font-size:.88em;
    background:var(--code-bg);
    border:1px solid var(--line);
    border-radius:4px;
    padding:.12em .4em;
  }
  .article pre{
    background:var(--code-bg);
    border:1px solid var(--line);
    border-left:3px solid var(--accent);
    border-radius:6px;
    padding:14px 16px;
    overflow-x:auto;
    margin:0 0 20px;
  }
  .article pre code{
    background:none;border:none;padding:0;
    font-size:13px;line-height:1.6;
  }

  .article table{border-collapse:collapse;width:100%;margin:0 0 20px;font-size:14.5px;}
  .article table{overflow-x:auto;display:block;}
  .article th, .article td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top;}
  .article th{background:var(--surface);font-family:'JetBrains Mono', monospace;font-size:12px;text-transform:uppercase;letter-spacing:.03em;}
  .article td code, .article th code{white-space:nowrap;}

  .article img{max-width:100%;border-radius:6px;border:1px solid var(--line);}

  .pager{
    max-width:70ch;margin:44px auto 0;
    display:flex;justify-content:space-between;gap:16px;
    border-top:1px solid var(--line);
    padding-top:20px;
  }
  .pager-btn{
    flex:1;max-width:48%;
    display:flex;flex-direction:column;gap:4px;
    padding:12px 14px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--surface);
    color:var(--ink);
    cursor:pointer;
    text-align:left;
  }
  .pager-btn:hover{border-color:var(--accent);}
  .pager-btn.next{margin-left:auto;text-align:right;align-items:flex-end;}
  .pager-btn .dir{font-family:'JetBrains Mono', monospace;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}
  .pager-btn .ttl{font-size:14px;font-weight:600;}
  .pager-spacer{flex:1;max-width:48%;}
  .pager-btn.disabled{opacity:.5;cursor:not-allowed;}
  .pager-btn.disabled:hover{border-color:var(--line);}

  /* ---------- lock state ---------- */
  .nav-item.locked{opacity:.4;cursor:not-allowed;}
  .nav-item.locked:hover{background:none;}
  .lock-icon{flex:none;width:9px;height:9px;margin-top:5px;color:var(--muted);}
  .lock-icon svg{display:block;width:100%;height:100%;}

  /* ---------- gate: practice check + quiz ---------- */
  .gate{
    margin-top:36px;
    border:1px solid var(--line);
    border-radius:10px;
    background:var(--surface);
    padding:20px 22px;
  }
  .gate-title{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
    color:var(--ink);margin:0 0 16px;
    display:flex;align-items:center;gap:8px;
  }
  .gate-row{margin-bottom:18px;}
  .gate-row:last-child{margin-bottom:0;}
  .gate-check{display:flex;align-items:flex-start;gap:10px;font-size:14.5px;cursor:pointer;line-height:1.5;}
  .gate-check input{margin-top:4px;flex:none;width:15px;height:15px;accent-color:var(--accent);}
  .gate-q{font-size:15.5px;font-weight:600;margin:0 0 12px;line-height:1.45;}
  .gate-options{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;}
  .gate-option{
    display:flex;align-items:flex-start;gap:10px;
    padding:10px 12px;border:1px solid var(--line);border-radius:7px;
    cursor:pointer;font-size:14.5px;line-height:1.45;background:var(--paper);
  }
  .gate-option:hover{border-color:var(--accent);}
  .gate-option input{margin-top:3px;flex:none;width:14px;height:14px;accent-color:var(--accent);}
  .gate-option.picked{border-color:var(--accent);}
  .gate-option.correct{border-color:var(--accent);background:var(--accent-soft);}
  .gate-option.wrong{border-color:var(--danger);background:rgba(168,67,47,.1);}
  .gate-option.disabled{cursor:default;}
  .gate-feedback{font-size:14px;padding:10px 12px;border-radius:7px;margin-bottom:14px;}
  .gate-feedback.ok{background:var(--accent-soft);color:var(--ink);}
  .gate-feedback.bad{background:rgba(168,67,47,.12);color:var(--ink);}
  .gate-done{display:flex;align-items:center;gap:8px;color:var(--accent);font-weight:600;font-size:14px;}
  .gate-hint{font-size:13px;color:var(--muted);margin-top:10px;}
  .gate-check-btn{margin-top:2px;}

  /* ---------- Mobile ---------- */
  .menu-btn{display:none;}
  .scrim{
    position:fixed;inset:0;background:rgba(10,14,12,.45);
    opacity:0;pointer-events:none;transition:opacity .2s ease;z-index:9;
  }
  .scrim.show{opacity:1;pointer-events:auto;}
  @media (max-width:820px){
    .app{grid-template-columns:1fr;}
    .sidebar{
      position:fixed;inset:0 auto 0 0;
      width:86vw;max-width:340px;
      transform:translateX(-100%);
      transition:transform .2s ease;
      z-index:10;
      box-shadow:2px 0 24px rgba(0,0,0,.25);
    }
    .sidebar.open{transform:translateX(0);}
    .menu-btn{display:inline-flex;}
    .content-header{padding:12px 18px;}
    .article-wrap{padding:8px 18px 72px;}
    .crumb{display:none;}
  }

  [hidden]{display:none !important;}

  /* ---------- syntax highlighting (hljs classes), tied to tokens ---------- */
  .hljs{color:var(--ink);}
  .hljs-comment, .hljs-quote{color:var(--muted);font-style:italic;}
  .hljs-keyword, .hljs-selector-tag, .hljs-literal, .hljs-subst{color:var(--accent);font-weight:600;}
  .hljs-string, .hljs-doctag, .hljs-regexp{color:#a1662f;}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .hljs-string{color:#e0a86a;} }
  :root[data-theme="dark"] .hljs-string{color:#e0a86a;}
  .hljs-number, .hljs-symbol{color:#7a6fd6;}
  .hljs-title, .hljs-title.function_, .hljs-title.class_, .hljs-section{color:var(--ink);font-weight:700;}
  .hljs-attr, .hljs-attribute, .hljs-variable, .hljs-template-variable, .hljs-params{color:var(--ink);}
  .hljs-built_in, .hljs-type, .hljs-class{color:#3a7bd5;}
  .hljs-meta, .hljs-meta .hljs-keyword{color:var(--muted);}
  .hljs-deletion{background:rgba(168,67,47,.15);}
  .hljs-addition{background:rgba(31,111,92,.15);}
  .hljs-emphasis{font-style:italic;}
  .hljs-strong{font-weight:700;}
</style>

<div class="app">
  <div class="scrim" id="scrim"></div>
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-title"><span class="dot"></span>QA AUTOMATION COURSE</div>
      <div class="brand-sub">Python · pytest · requests · Playwright</div>
    </div>
    <div class="progress-wrap">
      <div class="progress-line"><span>Пройдено</span><span class="mono"><b id="progress-count">0</b> / <span id="progress-total">0</span></span></div>
      <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    </div>
    <div class="search-wrap">
      <input class="search-input" id="search" type="text" placeholder="Найти урок…" autocomplete="off">
    </div>
    <nav class="nav" id="nav"></nav>
  </aside>

  <main class="content-scroll" id="content-scroll">
    <div class="content-header">
      <button class="btn icon menu-btn" id="menu-btn" aria-label="Открыть оглавление">☰</button>
      <div class="crumb" id="crumb"></div>
      <div class="header-actions">
        <button class="btn" id="done-btn"></button>
      </div>
    </div>
    <div class="article-wrap">
      <article class="article" id="article"></article>
    </div>
    <div class="pager" id="pager"></div>
  </main>
</div>

<script id="course-data" type="application/json">[{"id": "p1", "section": "О курсе", "subgroup": null, "isOverview": true, "num": null, "title": "QA Automation Course (Python)", "content": "# QA Automation Course (Python)\n\nКурс подготовки QA Automation Engineer с нуля до уровня \"готов к первой работе\": Python → pytest → Git/командная работа → API-тестирование → Playwright/UI → Allure → CI/CD → работа над тикетами в общем репозитории.\n\nКурс собран на основе трёх исходных курсов (Stepik):\n- `stepik-dobry-python-course` — база Python (С. Балакирев)\n- `stepik-playwright-ui-testing` — UI-автоматизация на Playwright\n- `stepik-api-testing-advanced` — API-автоматизация (главы 1–7; главы 8–15 в источнике оказались заглушками платформы, поэтому весь материал по Pytest/Allure/CI/CD в этом курсе написан заново)\n\nФормат: 14 недель, 8 модулей + постоянный параллельный джобсерч-трек с недели 6.\n\n## Структура репозитория\n\n```\nqa-automation-course/\n├── ROADMAP.md               — недельный план, модули, milestones\n├── STYLE_GUIDE.md           — единый формат урока (для авторов и для проверки консистентности)\n├── course_book/             — теория + код + задания по модулям/неделям\n│   ├── 00_module0_python_base/\n│   ├── 01_module1_pytest_env/\n│   ├── 02_module2_git_teamwork/\n│   ├── 03_module3_api_testing/\n│   ├── 04_module4_playwright_pom/\n│   ├── 05_module5_allure/\n│   ├── 06_module6_ci/\n│   └── 07_module7_final_sprint/\n├── boilerplate/              — \"общий репозиторий\": стартовый фреймворк pytest+requests+playwright,\n│                                который студенты форкают начиная с модуля 2\n└── jobsearch_track/          — резюме/поиск работы/английский, отдельно для РФ и Сербии\n```\n\n## Как это использовать\n\n1. Модули 0–1 студент проходит соло (`course_book/00_...`, `01_...`), сдаёт домашки как файлы.\n2. С модуля 2 студент форкает `boilerplate/` в свой GitHub/GitLab — с этого момента все домашки оформляются как PR в общий репозиторий.\n3. Модули 3–5 — это PR к уже существующему `boilerplate/` (API-клиент, Page Object'ы, Allure-шаги), а не вещи \"с нуля\".\n4. Модуль 6 — студент учится читать CI, а не писать pipeline с нуля.\n5. Модуль 7 — \"боевые\" тикеты: багфиксы, ревью, рефакторинг чужого кода в общем репозитории.\n", "hasPractice": false}, {"id": "p2", "section": "О курсе", "subgroup": null, "isOverview": false, "num": null, "title": "Roadmap курса", "content": "# Roadmap курса\n\n14 недель, 8 модулей. С модуля 2 работа идёт в общем репозитории (`boilerplate/`).\nПараллельно, с модуля 6 (не блокирует техническую часть) — джобсерч-трек (`jobsearch_track/`), отдельный для РФ и Сербии.\n\n| Модуль | Недели | Тема | Источник материала | Итог модуля |\n|---|---|---|---|---|\n| 0 | 1–2 | Python-база: синтаксис, типы, функции, файлы/JSON, базовое ООП | `stepik-dobry-python-course` (главы 01–10) | скрипт-парсер публичного API |\n| 1 | 3–4 | pytest как среда: fixtures, conftest, parametrize, маркеры, assert | `stepik-playwright-ui-testing` (05), собственный материал | 10–15 тестов на простых утилитах |\n| 2 | 5+ | Git и командная работа. Старт общего репозитория | `stepik-api-testing-advanced` (04) | первый смёрженный PR в общий репо |\n| 3 | 6–7 | API-тестирование на `requests`: методы, статусы, auth, Pydantic, API-клиент | `stepik-api-testing-advanced` (05–07, HTTPX→requests) | 5–7 API-тестов, PR к существующему api-модулю |\n| 4 | 8–10 | Playwright + Page Object Model | `stepik-playwright-ui-testing` (01–07) | 2–3 UI-теста, PR в общий репозиторий |\n| 5 | 11 | Allure: шаги, título, вложения, отчёт | написано заново (источник — заглушка) | все тесты студента снабжены allure-шагами |\n| 6 | 12 | CI на уровне пользователя: чтение pipeline, диагностика падений | написано заново (источник — заглушка) | студент сам чинит сломанный тест по логам CI |\n| 7 | 13–14 | Финальный спринт: багфиксы, ревью, рефакторинг чужих тестов | — | 10+ PR с ревью в истории каждого студента |\n\n## Почему источники по Allure/CI/API-практике написаны заново\n\nПри выгрузке `stepik-api-testing-advanced` разделы 8–15 (Pytest-практика, Allure, улучшение автотестов, CI/CD, покрытие, AI Review) оказались заблокированы Stepik progression-gate — в файлах только заголовки уроков, без содержимого. Модули 5 и 6 этого курса, а также практическая часть модуля 3, написаны самостоятельно с опорой на структуру из `stepik-playwright-ui-testing` (там есть рабочий раздел про pytest+Playwright) и на стандартные практики индустрии.\n\n## Job-search трек (параллельно, с модуля 6)\n\n- **RU:** резюме, hh.ru/Habr Career, разбор вакансий junior QA automation.\n- **RS (Сербия):** резюме на английском раньше и активнее, LinkedIn, английский для технического собеседования — стартует с модуля 3, а не с модуля 6, т.к. языковой барьер требует больше времени на разгон.\n", "hasPractice": false}, {"id": "p3", "section": "О курсе", "subgroup": null, "isOverview": false, "num": null, "title": "Style guide для уроков курса", "content": "# Style guide для уроков курса\n\nЕдиный формат — чтобы весь курс читался как одна книга, а не как склейка трёх разных.\n\n## Структура файла урока\n\n```markdown\n# N.M. Название урока\n\n## Зачем это нужно\n2–4 предложения: где это встретится в реальной работе QA automation engineer.\n\n## Теория\nОбъяснение своими словами (не копипаста из источника), с минимумом воды.\nКод — во **fenced code block** с указанием языка (```python, ```bash, ```yaml).\n\n## Пример\nРабочий, самодостаточный пример кода. Если это про boilerplate — показать,\nкак метод/тест встраивается в существующую структуру `boilerplate/`, а не\nкак отдельный файл в вакууме.\n\n## Частые ошибки\n2–4 пункта: что обычно ломается у новичков на этой теме.\n\n## Мини-задание\nНебольшая практическая задача на 10–20 минут, привязанная к теме урока.\n\n## Домашнее задание\n(указывается только в последнем уроке недели/темы)\nЧёткая формулировка + критерии \"готово\" (что именно проверяется).\nНачиная с модуля 2 — явно указано, что сдаётся PR-ом в общий репозиторий.\n```\n\n## Язык и тон\n\n- Русский язык, на \"ты\", без канцелярита.\n- Термины — по-английски там, где так принято в индустрии (fixture, assert, locator, pipeline), не изобретать русские кальки.\n- Код и имена переменных/функций — только на английском.\n- Никаких выдуманных фактов про инструменты — если не уверены в деталях версии/API, пишем общий принцип, а не конкретную цифру.\n\n## Нумерация\n\n`N.M` — модуль.урок (например `3.2` = модуль 3, второй урок). Внутри модуля недели — просто подпапки `weekX/`.\n\n## Проверочный вопрос урока (для ридера)\n\nКаждый обычный урок (не `00_overview.md`, не `99_*.md`) сопровождается файлом\n`<то же имя>.quiz.json` рядом с уроком — один вопрос с выбором ответа,\nкоторый ридер использует как условие разблокировки следующего урока.\n\nФормат:\n\n```json\n{\n  \"question\": \"Текст вопроса — строго по содержимому ЭТОГО урока\",\n  \"options\": [\"вариант A\", \"вариант B\", \"вариант C\", \"вариант D\"],\n  \"correct\": 2,\n  \"explain\": \"1-2 предложения, почему это верный ответ (показывается после правильного ответа)\"\n}\n```\n\nПравила:\n- Ровно один вопрос, ровно 4 варианта, ровно один верный (`correct` — индекс с 0).\n- Вопрос должен быть решаем строго по материалу этого урока — не по будущим темам и не по общей эрудиции.\n- Проверяем то, что реально понадобится QA automation инженеру (решение, частую ошибку, \"почему так, а не иначе\") — не дату выхода Python, не синтаксическую экзотику мимо практики курса.\n- Неверные варианты — правдоподобные ошибки новичка, а не абсурдный отвлекающий мусор.\n- Уровень сложности вопроса = уровень изложения теории в уроке: не проще и не сложнее.\n\n## Как работает переиспользование источников\n\n- Материал из трёх исходных курсов **переписывается**, а не копируется дословно — сохраняем идею, примеры адаптируем под общий репозиторий и единый стиль.\n- Если пример кода в источнике использует несовместимую с курсом библиотеку (например HTTPX там, где у нас `requests`), — адаптируем на лету, сохраняя суть, но не оставляем несоответствий.\n- Исходные курсы (`stepik-*`) — только на чтение, в них ничего не меняем.\n", "hasPractice": false}, {"id": "p4", "section": "О курсе", "subgroup": null, "isOverview": false, "num": null, "title": "boilerplate — общий репозиторий курса", "content": "# boilerplate — общий репозиторий курса\n\nСтартовый фреймворк: `pytest` + `requests` + `playwright`. Именно этот репозиторий студенты\nфоркают начиная с модуля 2 — дальше все домашки оформляются как PR сюда, а не как отдельные проекты.\n\n## Быстрый старт\n\n```bash\npython -m venv .venv && source .venv/bin/activate\npip install -r requirements.txt\nplaywright install chromium\n```\n\nЗапуск всех тестов:\n\n```bash\npytest\n```\n\nЗапуск по группам (маркеры из `pytest.ini`):\n\n```bash\npytest -m unit   # чистые функции, без сети и браузера — модуль 1\npytest -m api    # API-тесты на requests — модуль 3\npytest -m ui     # UI-тесты на Playwright — модуль 4\n```\n\nС Allure-отчётом:\n\n```bash\npytest --alluredir=allure-results\nallure serve allure-results\n```\n\n## Структура\n\n```\nboilerplate/\n├── clients/            # API-клиенты (модуль 3)\n│   ├── api_client.py   # базовый APIClient + BaseUrlSession поверх requests.Session\n│   └── users/          # UsersClient — https://jsonplaceholder.typicode.com\n├── pages/               # Page Object (модуль 4)\n│   ├── base_page.py\n│   ├── registration_page.py\n│   └── dashboard_page.py\n├── tests/\n│   ├── unit/            # модуль 1 — pytest на чистых функциях\n│   ├── api/             # модуль 3\n│   └── ui/              # модуль 4\n├── utils/               # fakers, string_utils\n├── conftest.py          # общие фикстуры + allure-скриншот при падении UI-теста\n├── pytest.ini\n└── .github/workflows/ci.yml, .gitlab-ci.yml   # модуль 6\n```\n\n## На чём построены примеры\n\n- **UI** — публичное учебное приложение из курса Н. Филонова: https://nikita-filonov.github.io/qa-automation-engineer-ui-course/ (страницы регистрации и Dashboard).\n- **API** — публичный демо-API https://jsonplaceholder.typicode.com/users (не требует авторизации, всегда доступен, подходит для отработки GET/POST/PUT/DELETE и Pydantic-схем).\n\n## Правила для PR (с модуля 2)\n\n1. Одна задача — одна ветка — один PR.\n2. В описании PR — что сделано и как проверить.\n3. Перед мёржем — зелёный CI и минимум одно ревью от одногруппника.\n4. Новый API-клиент/Page Object добавляется **рядом** с существующими, по тому же паттерну — не переписывает архитектуру заново.\n", "hasPractice": false}, {"id": "p5", "section": "Модуль 0 · Python-база", "subgroup": null, "isOverview": true, "num": null, "title": "Модуль 0. Python-база", "content": "# Модуль 0. Python-база\n\nНедели 1–2 курса. Цель модуля — не \"выучить Python\", а дойти ровно до того уровня, на котором можно писать простые самостоятельные скрипты и **читать чужой код**, не пугаясь незнакомых конструкций. Именно с этим уровнем ты придёшь в модуль 1 (pytest) и модуль 2 (общий репозиторий), где уже придётся разбираться в чужих файлах, а не только писать свои.\n\nИсточник материала — `stepik-dobry-python-course` (главы 01–09), переработанный под формат курса. Раздел про классы и наследование в исходном курсе отсутствовал — он написан для этого курса отдельно и сразу привязан к реальному коду из `boilerplate/pages/`, с которым ты будешь работать начиная с модуля 4.\n\n## Неделя 1 — синтаксис и типы данных\n\nОт переменных и чисел до словарей и множеств: как Python хранит и обрабатывает данные, какие у него базовые коллекции (списки, кортежи, множества, словари) и как ими пользоваться — включая условные операторы, циклы и генераторы списков. Это тот минимум, без которого невозможно прочитать ни одну строчку тестового кода.\n\n- [0.1. Переменные, типы данных, type() и id()](#p6)\n- [0.2. Числа, логика и сравнения](#p7)\n- [0.3. Строки: индексы, срезы, методы, f-строки](#p8)\n- [0.4. Списки: индексы, срезы, методы, вложенные списки](#p9)\n- [0.5. Условия: if / elif / else, тернарный оператор](#p10)\n- [0.6. Циклы и генераторы списков](#p11)\n- [0.7. Словари, кортежи и множества](#p12)\n\n## Неделя 2 — функции, ООП, файлы и итог модуля\n\nОт функций и `*args/**kwargs` — к первому знакомству с классами и наследованием (на примере `BasePage`/`RegistrationPage` из `boilerplate/`), затем модули и пакеты, работа с файлами и JSON, и набор функциональных инструментов (`map`, `filter`, `zip`, `sorted`). Неделя и модуль завершаются итоговым проектом — самостоятельным скриптом-парсером публичного API.\n\n- [0.8. Функции: def, return, аргументы](#p13)\n- [0.9. *args, **kwargs, распаковка, лямбды](#p14)\n- [0.10. Базовое ООП: классы, __init__, self](#p15)\n- [0.11. Наследование](#p16)\n- [0.12. Модули и пакеты](#p17)\n- [0.13. Файлы и JSON](#p18)\n- [0.14. Генераторы и полезные функции: map, filter, zip, sorted](#p19)\n- [0.15. Итоговый проект модуля — скрипт-парсер публичного API](#p20)\n", "hasPractice": false}, {"id": "p6", "section": "Модуль 0 · Python-база", "subgroup": "Неделя 1", "isOverview": false, "num": "0.1", "title": "Переменные, типы данных, type() и id()", "content": "# 0.1. Переменные, типы данных, type() и id()\n\n## Зачем это нужно\n\nЛюбой тест начинается с данных: логин, пароль, ожидаемый статус-код, тестовый ID. Всё это — переменные. Прежде чем писать `assert`, нужно понимать, что на самом деле происходит, когда ты пишешь `x = 5`, и почему `a = b` в Python — это не копирование значения, а нечто другое. Ошибки, связанные с этим непониманием, — одна из самых частых причин \"тест ведёт себя не так, как я ожидал\".\n\n## Теория\n\nВ Python переменная — это не \"коробка со значением\", а **ссылка на объект**. Когда ты пишешь:\n\n```python\nuser_id = 42\n```\n\nPython создаёт объект-число `42` где-то в памяти, а переменная `user_id` — это просто именованная ссылка на него. Отсюда важное следствие: если присвоить одну переменную другой,\n\n```python\na = [1, 2, 3]\nb = a\n```\n\nто `a` и `b` указывают на один и тот же объект. Изменишь список через `b` — увидишь изменение и через `a` (подробнее об этом — в уроке про списки, там это критично; для чисел и строк разница не так заметна, потому что они неизменяемые).\n\nТип переменной определяется не в момент объявления, а в момент присваивания значения — это называется **динамической типизацией**. Одна и та же переменная в течение программы может ссылаться сначала на число, потом на строку:\n\n```python\nvalue = 5\nvalue = \"теперь я строка\"\n```\n\nТак поступать в реальном коде не стоит (это сбивает с толку), но знать, что Python это позволяет, важно.\n\nУзнать тип объекта, на который ссылается переменная, можно функцией `type()`:\n\n```python\nprint(type(user_id))   # <class 'int'>\n```\n\nА узнать идентификатор объекта в памяти — функцией `id()`. Она пригодится, когда нужно проверить, ссылаются ли две переменные на один и тот же объект или на разные:\n\n```python\nprint(id(a) == id(b))  # True, если a и b — одна и та же ссылка\n```\n\nPython поддерживает **множественное присваивание** (каждая переменная получает свой объект) и **каскадное** (все переменные ссылаются на один и тот же объект):\n\n```python\na, b = 1, 2          # множественное — разные объекты\nx = y = 0             # каскадное — общий объект\na, b = b, a           # классический обмен значениями без временной переменной\n```\n\n### Имена переменных\n\nПравила простые: имя начинается с буквы или `_`, дальше могут идти буквы, цифры и `_`. Регистр важен: `user` и `User` — разные переменные. Нельзя использовать ключевые слова (`if`, `class`, `True` и т.п.) и не стоит переопределять имена встроенных функций (`print`, `list`, `id`) — это молча \"сломает\" их для остальной программы.\n\nДоговорённость по стилю (PEP8), которой стоит следовать сразу: имена переменных — `snake_case`, осмысленные, отражающие суть данных: `expected_status`, `response_body`, а не `x`, `tmp2`.\n\n## Пример\n\n```python\n# типичные переменные тестового скрипта\nbase_url = \"https://api.example.com\"\nuser_id = 42\nis_active = True\nexpected_status = 200\n\nprint(type(base_url), type(user_id), type(is_active))\n# <class 'str'> <class 'int'> <class 'bool'>\n\n# каскадное присваивание — общий счётчик для нескольких переменных\nretries_left = max_retries = 3\nprint(id(retries_left) == id(max_retries))  # True\n```\n\n## Частые ошибки\n\n- Путать `=` (присваивание) и `==` (сравнение) — придёт позже, но ошибка настолько частая, что стоит запомнить сразу.\n- Обращаться к переменной до её создания (\"сначала присвоить, потом использовать\" — работает только в этом порядке).\n- Давать переменным имена встроенных функций (`list = [1, 2, 3]`), после чего `list()` перестаёт работать в этом файле.\n- Ожидать, что `a = b` создаёт копию данных — для изменяемых типов (списки, словари) это не так.\n\n## Мини-задание\n\nЗаведи пять переменных, описывающих тестового пользователя: `username`, `age`, `email`, `is_admin`, `balance` — подбери подходящие типы данных для каждой. Выведи на экран имя каждой переменной и её тип с помощью `type()`. Затем через каскадное присваивание создай три переменные `attempt_1 = attempt_2 = attempt_3 = 0` и проверь функцией `id()`, что все три ссылаются на один объект.\n", "hasPractice": true, "quiz": {"question": "После выполнения кода a = [1, 2, 3]; b = a; b.append(4) — что будет в переменной a?", "options": ["[1, 2, 3], потому что b — это независимая копия a", "[1, 2, 3, 4], потому что b и a ссылаются на один и тот же объект", "Ошибка, так как нельзя присваивать список другой переменной", "[4], потому что b перезаписывает содержимое a"], "correct": 1, "explain": "Присваивание b = a не копирует список, а создаёт вторую ссылку на тот же объект в памяти — поэтому изменение через b видно и через a."}}, {"id": "p7", "section": "Модуль 0 · Python-база", "subgroup": "Неделя 1", "isOverview": false, "num": "0.2", "title": "Числа, логика и сравнения", "content": "# 0.2. Числа, логика и сравнения\n\n## Зачем это нужно\n\nПроверка ожидаемого результата почти всегда сводится к сравнению чисел: код ответа сервера, время выполнения запроса, количество элементов в списке. А булева логика (`and`, `or`, `not`) — это то, из чего потом строятся условия и `assert`-ы в тестах.\n\n## Теория\n\n### Числа\n\nВ Python два основных числовых типа: `int` (целые) и `float` (вещественные). Диапазон `int` практически не ограничен. Базовые арифметические операторы:\n\n| Оператор | Смысл | Пример |\n|---|---|---|\n| `+` `-` `*` | сложение, вычитание, умножение | `2 + 3` |\n| `/` | деление, **всегда** возвращает `float` | `8 / 2` → `4.0` |\n| `//` | целочисленное деление (округление вниз) | `7 // 2` → `3` |\n| `%` | остаток от деления | `10 % 3` → `1` |\n| `**` | возведение в степень | `2 ** 10` → `1024` |\n\nПриоритет операций такой же, как в математике: сначала `**`, потом `*`, `/`, `//`, `%`, потом `+`, `-`. Скобки меняют порядок вычислений. Есть один частый сюрприз: при делении отрицательных чисел `//` и `%` округляются \"в сторону минус бесконечности\", а не к нулю: `-7 // 2` даёт `-4`, а не `-3`.\n\nСокращённые операторы присваивания экономят строки: `i += 1` вместо `i = i + 1`, аналогично `-=`, `*=`, `/=`.\n\nФункция `round()` округляет число, но не по школьным правилам, а по **банковскому округлению** — до ближайшего чётного при равном расстоянии: `round(2.5)` → `2`, `round(3.5)` → `4`. У неё есть второй параметр — количество знаков после запятой: `round(3.14159, 2)` → `3.14`.\n\nДля более сложной математики есть модуль `math`:\n\n```python\nimport math\n\nmath.ceil(4.1)    # 5 — округление вверх\nmath.floor(4.9)   # 4 — округление вниз\nmath.sqrt(49)     # 7.0\nmath.pi           # 3.141592653589793\n```\n\n### Логический тип и сравнения\n\nТип `bool` — это `True`/`False`. Операторы сравнения:\n\n```\n<   >   <=   >=   ==   !=\n```\n\nОбрати внимание: `==` — сравнение, `=` — присваивание, это разные операторы, и путаница между ними — классическая ошибка новичков.\n\nСоставные условия строятся через `and`, `or`, `not`. Приоритет: `not` выше, чем `and`, а `and` выше, чем `or` — то есть `not` выполняется первым. Python также позволяет \"математическую\" запись диапазона:\n\n```python\n-2 <= y <= 5   # эквивалент y >= -2 and y <= 5\n```\n\nФункция `bool()` приводит любое значение к `True`/`False` по правилу \"пустое — ложь\": `0`, `\"\"`, `[]`, `{}`, `None` — все дают `False`, всё остальное — `True`. Это правило часто используется неявно, например в условии `if some_list:` вместо `if len(some_list) > 0:`.\n\n## Пример\n\n```python\nprice = 1999.99\ndiscount_percent = 15\n\ndiscounted_price = round(price * (100 - discount_percent) / 100, 2)\nprint(discounted_price)  # 1699.99\n\nexpected_status = 200\nactual_status = 201\nis_success = 200 <= actual_status < 300\nprint(is_success)  # True — 201 тоже \"успешный\" HTTP-код\n\n# сравнение вещественных чисел \"в лоб\" опасно из-за погрешности округления\nresult = 0.1 + 0.2\nprint(result == 0.3)                  # False, неожиданно!\nprint(abs(result - 0.3) < 1e-9)       # True — правильный способ сравнить float\n```\n\n## Частые ошибки\n\n- Сравнивать вещественные числа через `==` — из-за особенностей хранения `float` в памяти `0.1 + 0.2 != 0.3`. Сравнивай через допустимую погрешность (`abs(a - b) < 1e-9`).\n- Путать `/` и `//` — `/` всегда даёт `float`, даже `10 / 2` → `5.0`.\n- Забывать про банковское округление в `round()` и удивляться, почему `round(0.5)` — это `0`, а не `1`.\n- Писать `if flag == True:` вместо `if flag:` — работает, но не по стилю Python.\n\n## Мини-задание\n\nДан заказ на сумму `price = 2450` рублей со скидкой `discount = 12` (в процентах). Посчитай итоговую сумму с округлением до копеек. Затем напиши составное условие, проверяющее, что HTTP-код `actual_status` находится в диапазоне `[200; 299]` **или** равен `304`, и выведи результат как `bool`.\n", "hasPractice": true, "quiz": {"question": "Почему в тесте опасно сравнивать результат вычисления с float напрямую через == (например, result == 0.3)?", "options": ["Потому что оператор == в Python не работает с числами типа float", "Потому что float нельзя использовать в условиях if", "Потому что из-за особенностей хранения float в памяти результат может отличаться на крошечную величину — сравнивать нужно с допустимой погрешностью", "Потому что == сравнивает только целые числа, а float нужно сравнивать через is"], "correct": 2, "explain": "Вещественные числа хранятся с погрешностью округления (0.1 + 0.2 != 0.3), поэтому для float используют сравнение через допустимую погрешность, например abs(a - b) < 1e-9."}}, {"id": "p8", "section": "Модуль 0 · Python-база", "subgroup": "Неделя 1", "isOverview": false, "num": "0.3", "title": "Строки: индексы, срезы, методы, f-строки", "content": "# 0.3. Строки: индексы, срезы, методы, f-строки\n\n## Зачем это нужно\n\nТексты ошибок, тела ответов API, URL, логи — почти всё, с чем сталкивается QA automation engineer на старте, представлено строками. Умение вырезать нужный кусок строки, склеить сообщение об ошибке или отформатировать URL с параметрами — база, без которой не напишешь ни одного полезного скрипта.\n\n## Теория\n\nСтрока задаётся в одинарных или двойных кавычках — разницы нет, кроме удобства (если внутри текста есть кавычки одного вида, снаружи используй другой). Тройные кавычки (`'''` или `\"\"\"`) позволяют задавать многострочный текст.\n\nСтроки в Python — **неизменяемый** тип данных: нельзя поменять символ по индексу (`s[0] = \"H\"` вызовет ошибку). Любая \"модификация\" строки на самом деле создаёт новую строку.\n\n### Индексы и срезы\n\nКаждый символ строки имеет номер (индекс), начиная с `0`. Отрицательные индексы считают с конца:\n\n```python\ns = \"hello python\"\ns[0]     # 'h'\ns[-1]    # 'n'\n```\n\nСрез `s[start:stop:step]` вырезает подстроку от `start` до `stop` (не включая `stop`), с шагом `step`:\n\n```python\ns[0:5]    # 'hello'\ns[:5]     # то же самое\ns[6:]     # 'python'\ns[::-1]   # разворот строки: 'nohtyp olleh'\n```\n\n### Основные методы\n\n| Метод | Что делает |\n|---|---|\n| `.upper()` / `.lower()` | регистр |\n| `.strip()` / `.lstrip()` / `.rstrip()` | удаление пробелов и переносов строк по краям |\n| `.split(sep)` | разбить строку на список по разделителю |\n| `.join(list)` | собрать список строк в одну через разделитель |\n| `.replace(old, new)` | замена подстроки |\n| `.find(sub)` | индекс первого вхождения, `-1` если не найдено |\n| `.startswith(...)` / `.endswith(...)` | проверка начала/конца строки |\n| `.isdigit()` / `.isalpha()` | проверка состава строки |\n\nМетоды **не изменяют** исходную строку — они возвращают новую. `s.upper()` без присваивания результата ни на что не влияет.\n\n### Форматирование строк\n\nСамый удобный способ — **f-строки** (с версии Python 3.6): перед кавычками ставится `f`, а внутри `{}` можно писать любое выражение Python.\n\n```python\nname = \"Sergey\"\nage = 35\nprint(f\"User {name}, age {age}, next year: {age + 1}\")\n```\n\nДо f-строк использовался метод `.format()` — иногда он всё ещё встречается в чужом коде:\n\n```python\n\"User {0}, age {1}\".format(name, age)\n```\n\n## Пример\n\n```python\nlog_line = \"  2024-01-15 12:30:01 ERROR failed to connect  \"\n\n# приводим строку в порядок и разбираем на части\nclean_line = log_line.strip()\nparts = clean_line.split(\" \", maxsplit=2)\ndate, time, message = parts\n\nprint(f\"[{date} {time}] {message}\")\n# [2024-01-15 12:30:01 ERROR failed to connect]\n\nbase_url = \"https://api.example.com\"\nendpoint = \"users\"\nuser_id = 42\nfull_url = f\"{base_url}/{endpoint}/{user_id}\"\nprint(full_url)\n# https://api.example.com/users/42\n```\n\n## Частые ошибки\n\n- Забывать, что строки неизменяемы, и пытаться менять символ по индексу.\n- Вызывать метод и не сохранять результат: `s.strip()` без `s = s.strip()` ничего не меняет в `s`.\n- Путать `.find()` (вернёт `-1`, если не нашёл) и `.index()` (вызовет ошибку, если не нашёл).\n- Склеивать строки через `+` там, где f-строка читается в разы понятнее.\n- Забывать `.strip()` перед сравнением строк, считанных из файла или ввода — лишний `\\n` на конце ломает сравнение.\n\n## Мини-задание\n\nДана строка `\"user@example.com:Qwerty123\"`. Раздели её на email и пароль (разделитель — `:`). Проверь, что email содержит символ `@` и хотя бы одну точку после него. Собери и выведи сообщение через f-строку: `\"Login: <email>, password length: <N>\"`.\n", "hasPractice": true, "quiz": {"question": "Что будет выведено в результате выполнения кода?\ns = \"hello\"\ns.upper()\nprint(s)", "options": ["HELLO", "hello", "Ошибка выполнения", "None"], "correct": 1, "explain": "Строки неизменяемы: .upper() возвращает новую строку, но не меняет саму s. Без s = s.upper() исходная переменная останется прежней."}}, {"id": "p9", "section": "Модуль 0 · Python-база", "subgroup": "Неделя 1", "isOverview": false, "num": "0.4", "title": "Списки: индексы, срезы, методы, вложенные списки", "content": "# 0.4. Списки: индексы, срезы, методы, вложенные списки\n\n## Зачем это нужно\n\nСписок тестовых пользователей, список ожидаемых элементов на странице, набор HTTP-кодов, которые нужно проверить в цикле — списки встречаются в тестовом коде постоянно. В отличие от строк, списки можно изменять \"на месте\", и это удобно, но и источник частых ошибок.\n\n## Теория\n\nСписок задаётся квадратными скобками, элементы через запятую, может содержать данные разных типов:\n\n```python\nmarks = [2, 3, 4, 3, 5, 2]\nmixed = [\"Москва\", 1320, 5.8, True]\n```\n\nСписок — **изменяемый** тип: можно поменять значение по индексу, добавить или удалить элемент, и это не создаёт новый объект, а меняет существующий:\n\n```python\nmarks[0] = 5\n```\n\nИндексация и срезы работают так же, как у строк (`marks[0]`, `marks[-1]`, `marks[1:3]`, `marks[::-1]`). Важное отличие от строк: полный срез `marks[:]` создаёт **копию** списка, а не ссылку на тот же объект (в отличие от кортежей, где `t[:]` вернёт тот же объект — это разберём в уроке 0.7).\n\n### Функции и методы\n\nВстроенные функции, применимые к любой числовой коллекции: `len()`, `max()`, `min()`, `sum()`, `sorted()` (возвращает **новый** отсортированный список, исходный не трогает).\n\nМетоды списка, которые меняют сам список \"на месте\" и обычно ничего не возвращают:\n\n| Метод | Что делает |\n|---|---|\n| `.append(x)` | добавить элемент в конец |\n| `.insert(i, x)` | вставить элемент по индексу |\n| `.remove(x)` | удалить первый элемент со значением `x` |\n| `.pop(i=-1)` | удалить и вернуть элемент (по умолчанию последний) |\n| `.sort(reverse=False)` | отсортировать список на месте |\n| `.reverse()` | развернуть порядок элементов |\n\nЧастая ошибка — писать `a = a.append(1)`: `append()` возвращает `None`, и после такой строчки `a` станет равен `None`, а не изменённому списку.\n\n### Вложенные списки\n\nСписок может содержать другие списки — так представляют таблицы и матрицы:\n\n```python\nusers = [\n    [\"Ivan\", 25, True],\n    [\"Olga\", 30, False],\n]\nusers[0]        # ['Ivan', 25, True]\nusers[0][1]     # 25\n```\n\n## Пример\n\n```python\nresponse_times_ms = [120, 340, 95, 210, 800, 150]\n\nprint(min(response_times_ms), max(response_times_ms))\n# 95 800\n\naverage = sum(response_times_ms) / len(response_times_ms)\nprint(round(average, 1))\n# 285.8\n\nslow_requests = sorted(response_times_ms, reverse=True)[:3]\nprint(slow_requests)\n# [800, 340, 210] — три самых медленных запроса\n\n# добавляем новый результат, не трогая исходный список через sorted()\nresponse_times_ms.append(500)\nprint(response_times_ms)\n# [120, 340, 95, 210, 800, 150, 500]\n```\n\n## Частые ошибки\n\n- Путать `.sort()` (меняет список, ничего не возвращает) и `sorted()` (возвращает новый список, исходный не меняет).\n- Писать `a = a.append(x)` и терять список (получая `None`).\n- Забывать, что `b = a` не копирует список — обе переменные ссылаются на один и тот же объект; для копии нужен срез `a[:]` или `a.copy()`.\n- Путать номер элемента (считая с 1, \"по-человечески\") с индексом (считается с 0).\n\n## Мини-задание\n\nДан список результатов тестового прогона: `results = [True, True, False, True, False, False, True]`. Посчитай количество успешных (`True`) и провалившихся (`False`) тестов без использования `.count()` (циклом — пройдём в следующем уроке — пока можно через `results.count(True)`, если знаком; иначе просто индексами). Выведи сообщение `\"Passed: N, Failed: M\"`. Отдельно получи срез с последними тремя результатами.\n", "hasPractice": true, "quiz": {"question": "Какая из строк приведёт к тому, что переменная result станет ссылаться на None вместо списка?", "options": ["numbers = [3, 1, 2]; result = sorted(numbers)", "numbers = [3, 1, 2]; result = list(numbers)", "numbers = [3, 1, 2]; result = numbers[:]", "numbers = [3, 1, 2]; result = numbers.append(4)"], "correct": 3, "explain": "Метод append() изменяет список на месте и ничего не возвращает (None). sorted(), list() и срез [:] — все возвращают настоящий список."}}, {"id": "p10", "section": "Модуль 0 · Python-база", "subgroup": "Неделя 1", "isOverview": false, "num": "0.5", "title": "Условия: if / elif / else, тернарный оператор", "content": "# 0.5. Условия: if / elif / else, тернарный оператор\n\n## Зачем это нужно\n\nЛюбая проверка вида \"если статус-код не 200 — тест упал\" — это условный оператор. В будущем `assert` в pytest во многом заменит явные `if`, но логика ветвления в тестовом коде (подготовка данных, обработка разных сценариев ответа) остаётся ровно такой же.\n\n## Теория\n\nСинтаксис условного оператора:\n\n```python\nif condition:\n    # выполняется, если condition истинно\nelif other_condition:\n    # проверяется, если предыдущие условия ложны\nelse:\n    # выполняется, если ни одно условие не сработало\n```\n\nКлючевое для Python — **отступы**. Блок кода, относящийся к `if`, определяется отступом (обычно 4 пробела), а не скобками, как в других языках. Это не просто стиль — это часть синтаксиса: неправильный отступ реально меняет логику программы.\n\n`elif` можно повторять сколько угодно раз, `else` — не обязателен и может отсутствовать. Порядок строго такой: сначала `if`, потом (не обязательно) любое число `elif`, потом (не обязательно) один `else`.\n\nВ условии может быть любое выражение, приводимое к `bool` — не только явное сравнение:\n\n```python\nif response_body:      # сработает, если словарь/список не пустой\n    ...\n```\n\n### Тернарный оператор\n\nКомпактная запись условия, которая **возвращает значение** (в отличие от обычного `if`, который сам по себе ничего не возвращает):\n\n```python\nstatus_label = \"OK\" if response.status_code == 200 else \"FAIL\"\n```\n\nСинтаксис: `<значение если True> if <условие> else <значение если False>`. Удобен для простых случаев — присвоить одно из двух значений. Для сложной логики с несколькими шагами тернарный оператор быстро становится нечитаемым, и в таких случаях лучше вернуться к обычному `if/elif/else`.\n\n## Пример\n\n```python\nstatus_code = 404\n\nif 200 <= status_code < 300:\n    result = \"success\"\nelif 400 <= status_code < 500:\n    result = \"client error\"\nelif 500 <= status_code < 600:\n    result = \"server error\"\nelse:\n    result = \"unknown\"\n\nprint(result)  # client error\n\n# то же самое одним выражением для простого бинарного случая\nis_ok = \"yes\" if status_code == 200 else \"no\"\nprint(is_ok)  # no\n```\n\n## Частые ошибки\n\n- Неправильный отступ — код \"уезжает\" в блок `if`, хотя логически должен быть после него.\n- Вложенность условий более 2–3 уровней — код становится нечитаемым; часто это признак того, что стоит пересмотреть структуру, а не самой логики.\n- Попытка засунуть сложную многошаговую логику в тернарный оператор \"для краткости\" — читаемость страдает больше, чем экономится строк.\n- `if flag == True:` вместо `if flag:` — работает, но не идиоматично для Python.\n\n## Мини-задание\n\nНапиши классификатор HTTP-статусов: для введённого `status_code` вывести `\"2xx success\"`, `\"3xx redirect\"`, `\"4xx client error\"`, `\"5xx server error\"` или `\"unknown\"` для всего остального. Затем перепиши проверку \"код успешный или нет\" (только эти два варианта) через тернарный оператор.\n", "hasPractice": true, "quiz": {"question": "Что будет выведено в результате выполнения кода?\nx = 5\nif x < 0:\n    x = -x\n    print(x)\nprint(\"done\")", "options": ["5\ndone", "-5\ndone", "done", "Ошибка выполнения"], "correct": 2, "explain": "print(x) находится внутри блока if (определяется отступом) и выполнится только при x < 0. Здесь x = 5, условие ложно, поэтому выведется только 'done'."}}, {"id": "p11", "section": "Модуль 0 · Python-база", "subgroup": "Неделя 1", "isOverview": false, "num": "0.6", "title": "Циклы и генераторы списков", "content": "# 0.6. Циклы и генераторы списков\n\n## Зачем это нужно\n\nПрогнать проверку по списку из 50 тестовых пользователей, подождать (с ограничением по попыткам), пока элемент появится на странице, отфильтровать только упавшие тесты из общего списка результатов — всё это циклы. List comprehension (генератор списков) — идиома, которую ты будешь видеть в почти любом чужом Python-коде, включая тестовые фреймворки.\n\n## Теория\n\n### while\n\nВыполняется, пока условие истинно. Хорош для ситуаций, когда заранее не известно число повторений — например, ожидание с ретраями:\n\n```python\nattempts = 0\nmax_attempts = 5\nsuccess = False\n\nwhile attempts < max_attempts and not success:\n    attempts += 1\n    success = try_something()  # условная функция, которую напишем позже\n```\n\n`break` прерывает цикл досрочно, `continue` пропускает оставшуюся часть текущей итерации и переходит к следующей. У циклов (и `while`, и `for`) есть необязательный блок `else` — он выполняется, только если цикл завершился \"штатно\" (по условию), а не через `break`. На практике используется редко, но встречается в чужом коде, поэтому знать про него стоит.\n\n### for и range\n\n`for` перебирает элементы **итерируемого объекта** — списка, строки, результата `range()`:\n\n```python\nfor i in range(5):        # 0, 1, 2, 3, 4 — верхняя граница не включается\n    print(i)\n\nfor user in users_list:\n    print(user)\n```\n\n`enumerate()` даёт одновременно индекс и значение — удобнее, чем городить отдельный счётчик:\n\n```python\nfor index, user in enumerate(users_list):\n    print(index, user)\n```\n\n### List comprehension (генератор списков)\n\nКомпактная запись цикла, который строит новый список:\n\n```python\nsquares = [x ** 2 for x in range(5)]\n# эквивалент:\n# squares = []\n# for x in range(5):\n#     squares.append(x ** 2)\n```\n\nМожно добавить условие фильтрации:\n\n```python\nfailed_only = [name for name, passed in test_results if not passed]\n```\n\nСинтаксис: `[<что положить в список> for <переменная> in <источник> if <условие>]`. Часть `if` — необязательна. Такая запись работает быстрее обычного цикла и считается более \"питоничной\", но злоупотреблять ей не стоит: если выражение перестаёт помещаться в одну понятную строку — лучше вернуться к обычному циклу `for`.\n\n## Пример\n\n```python\ntest_results = [\n    (\"test_login\", True),\n    (\"test_logout\", True),\n    (\"test_registration\", False),\n    (\"test_password_reset\", False),\n]\n\n# обычный цикл: печатаем только упавшие тесты\nfor name, passed in test_results:\n    if not passed:\n        print(f\"FAILED: {name}\")\n\n# то же самое — генератор списков, если нужен именно список имён\nfailed_tests = [name for name, passed in test_results if not passed]\nprint(failed_tests)\n# ['test_registration', 'test_password_reset']\n\n# ретрай с ограничением попыток\nattempts = 0\nmax_attempts = 3\nfound = False\n\nwhile attempts < max_attempts and not found:\n    attempts += 1\n    print(f\"Attempt {attempts}: checking...\")\n    found = attempts == 3  # условно \"получилось\" на третьей попытке\n\nprint(\"Found!\" if found else \"Gave up.\")\n```\n\n## Частые ошибки\n\n- Забыть увеличить счётчик в `while` — бесконечный цикл, который \"подвешивает\" скрипт.\n- Перепутать `range(5)` (числа 0–4) с \"числами от 1 до 5\" — верхняя граница `range()` не включается.\n- Изменять список, по которому в этот момент итерируешься через `for` (`for x in lst: lst.remove(x)`) — элементы будут пропущены непредсказуемым образом.\n- Писать генератор списков с тремя вложенными условиями и двумя `for` \"для краткости\" — такой код сложнее читать, чем обычный цикл.\n\n## Мини-задание\n\nДан список чисел `response_codes = [200, 404, 200, 500, 301, 200, 403]`. С помощью генератора списков получи список только \"успешных\" кодов (200–299). Отдельно — обычным циклом `for` с `enumerate()` — выведи `\"index: code\"` для каждого элемента, у которого код больше или равен 400.\n", "hasPractice": true, "quiz": {"question": "Сколько чисел и каких выведет цикл for i in range(5): print(i)?", "options": ["5 чисел: 1, 2, 3, 4, 5", "5 чисел: 0, 1, 2, 3, 4", "6 чисел: 0, 1, 2, 3, 4, 5", "4 числа: 1, 2, 3, 4"], "correct": 1, "explain": "range(5) генерирует последовательность от 0 до 4 включительно — верхняя граница в range() не включается в диапазон."}}, {"id": "p12", "section": "Модуль 0 · Python-база", "subgroup": "Неделя 1", "isOverview": false, "num": "0.7", "title": "Словари, кортежи и множества", "content": "# 0.7. Словари, кортежи и множества\n\n## Зачем это нужно\n\nТело JSON-ответа API — это, по сути, словарь Python (мы явно свяжем это в модуле 3, но структура та же уже сейчас). Кортежи используются там, где данные не должны меняться (например, фиксированные тестовые константы), а множества — там, где важна уникальность и быстрая проверка \"есть ли значение в наборе\". Без этих трёх коллекций читать реальный тестовый код будет тяжело.\n\n## Теория\n\n### Словари (dict)\n\nАссоциативный массив: значения хранятся не по числовому индексу, а по ключу.\n\n```python\nuser = {\"id\": 1, \"username\": \"ivan\", \"is_active\": True}\nuser[\"username\"]           # 'ivan'\nuser[\"email\"]              # KeyError! такого ключа нет\nuser.get(\"email\")          # None — безопасный доступ, без ошибки\nuser.get(\"email\", \"n/a\")   # 'n/a' — значение по умолчанию\n```\n\nКлючами могут быть только неизменяемые типы (строки, числа, кортежи), значениями — что угодно. Словарь — изменяемый тип: можно добавлять, менять и удалять пары ключ-значение:\n\n```python\nuser[\"email\"] = \"ivan@example.com\"   # добавили новый ключ\ndel user[\"is_active\"]                 # удалили ключ\n```\n\nПеребор словаря чаще всего делают так:\n\n```python\nfor key, value in user.items():\n    print(key, value)\n```\n\nПолезные методы: `.keys()`, `.values()`, `.items()`, `.get(key, default)`, `.update(other_dict)`.\n\n### Кортежи (tuple)\n\nКак список, но **неизменяемый**:\n\n```python\npoint = (10, 20)\npoint[0] = 5   # ошибка — кортеж нельзя менять\n```\n\nЗачем нужны, если есть списки? Во-первых, неизменяемость иногда — гарантия, что данные случайно не испортят по ходу программы. Во-вторых, кортеж (в отличие от списка) можно использовать как ключ словаря. В-третьих, функция может вернуть сразу несколько значений именно через кортеж:\n\n```python\ndef get_min_max(numbers):\n    return min(numbers), max(numbers)   # неявно создаётся кортеж\n\nlow, high = get_min_max([3, 1, 4, 1, 5])\n```\n\n### Множества (set)\n\nНеупорядоченная коллекция **уникальных** значений:\n\n```python\ncities = {\"Moscow\", \"Tver\", \"Moscow\", \"Ufa\"}\nprint(cities)   # {'Moscow', 'Tver', 'Ufa'} — дубликат исчез\n```\n\nОтличный инструмент, чтобы быстро убрать дубликаты из списка: `unique = set(some_list)`. Поддерживает операции пересечения (`&`), объединения (`|`) и разности (`-`) — удобно, например, сравнить, какие тестовые ID есть в одном прогоне, но отсутствуют в другом.\n\nПустое множество нельзя создать через `{}` — это создаст словарь. Нужно писать `set()`.\n\n### Comprehension для множеств и словарей\n\nПо аналогии со списками:\n\n```python\nunique_lengths = {len(city) for city in cities}          # множество\nlengths_by_city = {city: len(city) for city in cities}   # словарь\n```\n\n## Пример\n\n```python\nresponse = {\n    \"status\": \"ok\",\n    \"data\": {\"id\": 1, \"name\": \"Test User\"},\n    \"errors\": [],\n}\n\nprint(response.get(\"status\"))              # ok\nprint(response.get(\"message\", \"no message\"))  # no message — ключа нет, но ошибки не будет\n\nuser_ids_run_1 = {1, 2, 3, 4}\nuser_ids_run_2 = {3, 4, 5, 6}\n\nmissing_in_run_2 = user_ids_run_1 - user_ids_run_2\nprint(missing_in_run_2)   # {1, 2}\n\nSTATUS_LABELS = {\n    200: \"OK\",\n    404: \"Not Found\",\n    500: \"Server Error\",\n}\nprint(STATUS_LABELS.get(403, \"Unknown status\"))  # Unknown status\n```\n\n## Частые ошибки\n\n- Обращаться к несуществующему ключу через `d[key]` вместо безопасного `d.get(key)` — падает `KeyError` там, где можно было аккуратно обработать отсутствие значения.\n- Пытаться создать пустое множество через `{}` — получится словарь.\n- Пытаться изменить кортеж и удивляться ошибке — это его основное назначение.\n- Полагаться на порядок элементов множества — `set` не гарантирует порядок (в отличие от списка и, начиная с Python 3.7, словаря).\n\n## Домашнее задание\n\nДан список результатов тестового прогона в виде списка словарей:\n\n```python\nrun_results = [\n    {\"test\": \"test_login\", \"status\": \"passed\", \"duration_ms\": 120},\n    {\"test\": \"test_logout\", \"status\": \"passed\", \"duration_ms\": 95},\n    {\"test\": \"test_registration\", \"status\": \"failed\", \"duration_ms\": 340},\n    {\"test\": \"test_password_reset\", \"status\": \"failed\", \"duration_ms\": 210},\n    {\"test\": \"test_profile_update\", \"status\": \"passed\", \"duration_ms\": 150},\n]\n```\n\nНапиши скрипт, который:\n\n1. Считает и выводит количество тестов со статусом `passed` и `failed`.\n2. Собирает в список названия всех упавших тестов (`failed`).\n3. Считает суммарное и среднее время выполнения (`duration_ms`) по всем тестам, округлённое до целого.\n4. Выводит итоговую сводку в формате:\n   ```\n   Passed: 3, Failed: 2\n   Failed tests: test_registration, test_password_reset\n   Total duration: 915 ms, average: 183 ms\n   ```\n\n**Критерии готово**: скрипт запускается без ошибок командой `python homework_week1.py`, использует хотя бы один генератор списков и словарь `.get()` там, где это уместно, вывод точно соответствует формату из примера (числа могут отличаться, если ты меняешь исходные данные для проверки).\n", "hasPractice": false, "quiz": {"question": "Как безопаснее всего получить значение по ключу 'email' из словаря user, если этот ключ может отсутствовать?", "options": ["user['email']", "user.email", "user.pop('email')", "user.get('email')"], "correct": 3, "explain": "user.get('email') вернёт None (или значение по умолчанию), если ключа нет, тогда как user['email'] выбросит KeyError и прервёт выполнение скрипта."}}, {"id": "p13", "section": "Модуль 0 · Python-база", "subgroup": "Неделя 2", "isOverview": false, "num": "0.8", "title": "Функции: def, return, аргументы", "content": "# 0.8. Функции: def, return, аргументы\n\n## Зачем это нужно\n\nЛюбой тестовый фреймворк построен вокруг функций: сами тесты — это функции, вспомогательные шаги (\"залогиниться\", \"создать тестового пользователя\") — тоже функции. Не научившись выделять повторяющийся код в функцию, ты будешь копировать одни и те же пять строк в каждый тест — а это первое, за что бракуют код-ревью.\n\n## Теория\n\nФункция объявляется ключевым словом `def`, вызывается — именем со скобками:\n\n```python\ndef send_request():\n    print(\"sending request...\")\n\nsend_request()   # вызов — без скобок это была бы просто ссылка на функцию, не вызов\n```\n\nЗначения внутри скобок при объявлении называются **параметрами**, а то, что передаётся при вызове — **аргументами**. Порядок важен: первому параметру соответствует первый аргумент и так далее (это называется **позиционными** аргументами).\n\n```python\ndef build_url(host, path):\n    return f\"{host}/{path}\"\n\nbuild_url(\"https://api.example.com\", \"users\")\n```\n\n### return\n\nОператор `return` завершает выполнение функции и возвращает значение вызывающему коду. Без `return` функция всегда возвращает `None`. Как только выполнен `return`, весь код после него в этой же ветке уже не выполняется:\n\n```python\ndef get_status_label(code):\n    if 200 <= code < 300:\n        return \"success\"\n    return \"error\"\n```\n\nВернуть можно сразу несколько значений — на самом деле это упаковка в кортеж:\n\n```python\ndef get_min_max(numbers):\n    return min(numbers), max(numbers)\n\nlow, high = get_min_max([5, 2, 9, 1])\n```\n\n### Именованные аргументы и значения по умолчанию\n\nАргументы можно передавать не только по позиции, но и по имени — тогда порядок неважен:\n\n```python\nbuild_url(path=\"users\", host=\"https://api.example.com\")\n```\n\nПараметру можно задать значение по умолчанию — тогда при вызове его можно не указывать:\n\n```python\ndef get_users(base_url, page=1, per_page=20):\n    return f\"{base_url}/users?page={page}&per_page={per_page}\"\n\nget_users(\"https://api.example.com\")               # page и per_page возьмутся по умолчанию\nget_users(\"https://api.example.com\", per_page=50)   # меняем только один параметр\n```\n\n**Важная ловушка**: никогда не используй изменяемый объект (список, словарь) как значение по умолчанию — он создаётся один раз при объявлении функции и переиспользуется между всеми вызовами:\n\n```python\ndef add_item(item, items=[]):   # плохо!\n    items.append(item)\n    return items\n\nadd_item(1)   # [1]\nadd_item(2)   # [1, 2] — а не [2], как можно было ожидать!\n```\n\nПравильный способ — использовать `None` как значение по умолчанию и создавать новый объект внутри функции:\n\n```python\ndef add_item(item, items=None):\n    if items is None:\n        items = []\n    items.append(item)\n    return items\n```\n\n### Область видимости\n\nПеременная, созданная внутри функции, — **локальная**: она не существует за пределами функции. Функция при этом видит переменные, объявленные снаружи (глобальные), но не может напрямую их *изменить* — присваивание внутри функции создаст новую локальную переменную с тем же именем. Если действительно нужно изменить глобальную переменную из функции, используется ключевое слово `global` — но на практике в тестовом коде такая необходимость возникает редко и обычно говорит о том, что стоит пересмотреть архитектуру (передавать значение через аргумент и возврат, а не через глобальное состояние).\n\n## Пример\n\n```python\ndef calculate_discounted_price(price, discount_percent=10):\n    return round(price * (100 - discount_percent) / 100, 2)\n\n\nprint(calculate_discounted_price(1999.99))          # скидка по умолчанию — 10%\nprint(calculate_discounted_price(1999.99, 25))      # позиционный аргумент\nprint(calculate_discounted_price(price=500, discount_percent=0))  # именованные\n```\n\n## Частые ошибки\n\n- Забыть `return` и удивляться, почему результат функции — `None`.\n- Изменяемое значение по умолчанию (`def f(items=[])`) — данные \"утекают\" между вызовами.\n- Путать параметр (в объявлении) и аргумент (при вызове) в разговоре с коллегами — мелочь, но профессиональная лексика важна.\n- Пытаться менять глобальную переменную внутри функции без `global` и не понимать, почему изменение \"не сохраняется\" снаружи.\n\n## Мини-задание\n\nНапиши функцию `format_test_report(test_name, passed, duration_ms=0)`, которая возвращает строку вида `\"[PASSED] test_login (120 ms)\"` или `\"[FAILED] test_login (120 ms)\"` в зависимости от значения `passed`. Параметр `duration_ms` должен иметь значение по умолчанию `0`. Вызови функцию три раза с разными комбинациями позиционных и именованных аргументов.\n", "hasPractice": true, "quiz": {"question": "Почему не стоит использовать изменяемый объект (например, список) как значение по умолчанию для параметра функции: def add_item(item, items=[])?", "options": ["Потому что списки нельзя передавать в функции", "Потому что список создаётся один раз при объявлении функции и переиспользуется между всеми вызовами", "Потому что это вызовет SyntaxError при запуске", "Потому что параметры со значением по умолчанию обязаны быть числами"], "correct": 1, "explain": "Значение по умолчанию вычисляется один раз, в момент объявления функции, а не при каждом вызове — поэтому изменяемый объект «утекает» между вызовами. Правильно использовать None и создавать новый объект внутри функции."}}, {"id": "p14", "section": "Модуль 0 · Python-база", "subgroup": "Неделя 2", "isOverview": false, "num": "0.9", "title": "*args, **kwargs, распаковка, лямбды", "content": "# 0.9. *args, **kwargs, распаковка, лямбды\n\n## Зачем это нужно\n\nКогда начнёшь читать код фреймворков (pytest, requests, Playwright) — везде будут встречаться сигнатуры вроде `def request(method, url, **kwargs)`. Не понимая `*args`/`**kwargs`, невозможно разобраться, что вообще можно передать в такую функцию. Лямбды же — стандартный инструмент для сортировки и фильтрации данных одной строкой.\n\n## Теория\n\n### *args — произвольное число позиционных аргументов\n\nЕсли поставить `*` перед именем параметра, все \"лишние\" позиционные аргументы соберутся в кортеж:\n\n```python\ndef join_path(*parts):\n    return \"/\".join(parts)\n\njoin_path(\"api\", \"v1\", \"users\")   # 'api/v1/users' — 3 аргумента, а не 1 список\n```\n\nВнутри функции `parts` — обычный кортеж, с ним можно делать всё то же, что с любым кортежем.\n\n### **kwargs — произвольное число именованных аргументов\n\nАналогично, но для именованных аргументов — они собираются в словарь:\n\n```python\ndef build_query(**params):\n    return \"&\".join(f\"{key}={value}\" for key, value in params.items())\n\nbuild_query(page=1, per_page=20)   # 'page=1&per_page=20'\n```\n\nОба варианта можно комбинировать в одной функции — но строго в таком порядке: сначала обычные позиционные параметры, потом `*args`, потом именованные параметры со значением по умолчанию, потом `**kwargs`:\n\n```python\ndef make_request(method, url, *args, timeout=30, **kwargs):\n    print(method, url, args, timeout, kwargs)\n\nmake_request(\"GET\", \"/users\", verbose=True, retries=3)\n# GET /users () 30 {'verbose': True, 'retries': 3}\n```\n\nЕсли в сигнатуре после `*args` (или просто одинокой `*`) идут ещё параметры — их можно передать **только по имени**, позиционно уже не получится. Это частый приём в реальных библиотеках, чтобы заставить вызывающий код быть явным.\n\n### Упаковка и распаковка коллекций\n\nТот же символ `*` умеет работать и в обратную сторону — **распаковывать** коллекцию в отдельные аргументы:\n\n```python\nnumbers = (5, 3, 8)\nprint(max(*numbers))   # эквивалент print(max(5, 3, 8))\n\ndef get_v(a, b, c):\n    return a * b * c\n\ndimensions = (2, 3, 4)\nget_v(*dimensions)   # 24\n```\n\nДля словарей та же идея работает с `**` — распаковка пар ключ-значение в именованные аргументы:\n\n```python\nuser_data = {\"username\": \"ivan\", \"age\": 25}\n\ndef create_user(username, age):\n    return f\"{username}, {age}\"\n\ncreate_user(**user_data)\n```\n\nПохожий приём используют, чтобы объединить два словаря в один:\n\n```python\ndefaults = {\"timeout\": 30, \"retries\": 3}\noverrides = {\"retries\": 5}\nconfig = {**defaults, **overrides}   # {'timeout': 30, 'retries': 5}\n```\n\n### Лямбда-функции\n\nЛямбда — короткая безымянная функция из одного выражения:\n\n```python\nsquare = lambda x: x ** 2\nsquare(5)   # 25\n```\n\nЛямбды почти никогда не объявляют \"про запас\" в переменную (для этого есть обычный `def`) — их главное применение — передавать \"на лету\" в качестве аргумента другим функциям, например для сортировки (см. урок 0.14):\n\n```python\nusers = [{\"name\": \"Ivan\", \"age\": 25}, {\"name\": \"Olga\", \"age\": 30}]\nsorted(users, key=lambda u: u[\"age\"])\n```\n\nВ лямбде можно записать только одно выражение — ни `if/else`-блоков, ни нескольких строк, ни присваиваний. Если логика не помещается в одну строку — это сигнал, что нужна обычная функция через `def`.\n\n## Пример\n\n```python\ndef log_message(*parts, sep=\" | \"):\n    return sep.join(str(p) for p in parts)\n\n\nprint(log_message(\"2024-01-15\", \"ERROR\", \"connection failed\"))\n# 2024-01-15 | ERROR | connection failed\n\nprint(log_message(\"INFO\", \"started\", sep=\" -> \"))\n# INFO -> started\n\n# распаковка при вызове\ntimestamps = (\"12:00\", \"12:05\", \"12:10\")\nprint(log_message(*timestamps))\n# 12:00 | 12:05 | 12:10\n\nis_even = lambda n: n % 2 == 0\nprint(list(filter(is_even, [1, 2, 3, 4, 5, 6])))\n# [2, 4, 6]\n```\n\n## Частые ошибки\n\n- Пытаться передать именованный аргумент туда, где ожидается только `*args`, и наоборот.\n- Засовывать в лямбду многострочную логику — она туда физически не помещается, будет `SyntaxError`.\n- Путать `*args` (кортеж позиционных) и `**kwargs` (словарь именованных) местами в объявлении функции.\n- Нарушать порядок параметров: обычные → `*args` → именованные со значением по умолчанию → `**kwargs`.\n\n## Мини-задание\n\nНапиши функцию `merge_configs(*configs)`, которая принимает произвольное число словарей и объединяет их в один (более поздний словарь перезаписывает значения предыдущих) — используй распаковку `**`. Затем напиши lambda-выражение, которое по словарю с ключом `\"duration_ms\"` возвращает значение этого ключа, и используй его в `sorted()`, чтобы отсортировать список тестовых результатов по длительности.\n", "hasPractice": true, "quiz": {"question": "Дана функция def make_request(method, url, *args, timeout=30, **kwargs). Как можно передать значение timeout при вызове?", "options": ["Только позиционно — третьим аргументом при вызове", "Никак — timeout нельзя переопределить при вызове", "Только по имени: make_request(\"GET\", \"/users\", timeout=60)", "Через **kwargs явно: make_request(\"GET\", \"/users\", kwargs={\"timeout\": 60})"], "correct": 2, "explain": "Все параметры, объявленные после *args, можно передать только именованным аргументом — позиционно они уже недоступны, потому что после *args любые лишние позиционные значения некуда деть."}}, {"id": "p15", "section": "Модуль 0 · Python-база", "subgroup": "Неделя 2", "isOverview": false, "num": "0.10", "title": "Базовое ООП: классы, __init__, self", "content": "# 0.10. Базовое ООП: классы, __init__, self\n\n## Зачем это нужно\n\nНачиная с модуля 4 ты будешь работать с Page Object Model — подходом, где каждая страница сайта описывается отдельным классом (`LoginPage`, `RegistrationPage` и т.п.). В модуле 3 API-клиент тоже будет классом. Если сейчас не разобраться, что такое класс, `__init__` и `self`, весь этот код превратится в набор непонятных символов. Цель этого урока — ровно наоборот: чтобы, открыв любой чужой класс, ты понимал, что происходит.\n\nВажная оговорка: этот раздел не входит в исходный Stepik-курс — там глав про классы вообще нет. Материал написан отдельно для этого курса, специально под тот минимум ООП, который нужен, чтобы читать тестовый фреймворк. Здесь нет наследования интерфейсов, множественного наследования, метаклассов и прочих продвинутых тем — только то, что реально встретится в коде.\n\n## Теория\n\nДо сих пор мы хранили связанные данные либо в отдельных переменных, либо в словаре:\n\n```python\nuser = {\"username\": \"ivan\", \"age\": 25}\n```\n\nУ словаря есть неудобство: рядом с данными нет действий, которые к ним относятся. Хочешь проверить, совершеннолетний ли пользователь — пишешь отдельную функцию `is_adult(user)` где-то в стороне, и связь между данными и функцией видна только по договорённости, а не по коду.\n\n**Класс** — это шаблон, который описывает и данные (**атрибуты**), и действия над ними (**методы**) вместе, в одном месте. **Объект** (или **экземпляр**) — это конкретная \"вещь\", созданная по этому шаблону.\n\n```python\nclass TestUser:\n    def __init__(self, username, age):\n        self.username = username\n        self.age = age\n\n    def is_adult(self):\n        return self.age >= 18\n\n\nuser = TestUser(\"ivan\", 25)   # создали экземпляр класса\nprint(user.username)          # ivan — обращение к атрибуту\nprint(user.is_adult())        # True — вызов метода\n```\n\nРазберём это по частям.\n\n**`class TestUser:`** — объявление класса. По договорённости имена классов пишут в `CamelCase` (`TestUser`, `BasePage`), а не в `snake_case`, как переменные и функции — это сразу помогает отличить класс от обычной переменной при чтении чужого кода.\n\n**`__init__`** — специальный метод-**конструктор**, который автоматически вызывается в момент создания объекта (`TestUser(\"ivan\", 25)`). Его задача — заполнить начальные атрибуты объекта. Имя с двумя подчёркиваниями с обеих сторон (`__init__`) — соглашение Python для \"магических\" методов со специальным поведением; сейчас достаточно запомнить именно этот один.\n\n**`self`** — первый параметр любого метода класса, через который метод обращается к атрибутам *этого конкретного* объекта. Когда ты пишешь `user.is_adult()`, Python сам подставляет `user` в качестве `self` — тебе не нужно передавать его вручную при вызове. Но при *объявлении* метода `self` нужно прописывать явно первым параметром всегда — это не опция, а обязательное правило синтаксиса:\n\n```python\ndef is_adult(self):       # self — обязателен при объявлении\n    return self.age >= 18\n\nuser.is_adult()            # а при вызове self не передаём — он подставится сам\n```\n\nВнутри `__init__` строчка `self.username = username` создаёт атрибут `username` именно у *этого* объекта. Если создать два объекта — у каждого будут свои независимые значения атрибутов:\n\n```python\nuser1 = TestUser(\"ivan\", 25)\nuser2 = TestUser(\"olga\", 17)\nprint(user1.is_adult())   # True\nprint(user2.is_adult())   # False — те же методы, но своё состояние\n```\n\n### Чем это лучше словаря\n\nВ словаре ничего не мешает случайно записать ключ с опечаткой (`user[\"usrname\"]`) — ошибку заметишь не сразу. У класса опечатка в имени атрибута (`user.usrname`) обычно сразу видна в среде разработки. Но главное — методы объекта живут рядом с данными и явно показывают, какие действия для этих данных предусмотрены: открыть `BasePage` и увидеть его методы — куда понятнее, чем гадать, какие функции \"где-то\" работают с конкретным словарём.\n\n## Пример\n\nСобственный класс для представления ответа API — то, с чем ты будешь работать в модуле 3, но уже на своих данных, без реальных запросов:\n\n```python\nclass ApiResponse:\n    def __init__(self, status_code, body):\n        self.status_code = status_code\n        self.body = body\n\n    def is_success(self):\n        return 200 <= self.status_code < 300\n\n    def get_field(self, field_name):\n        return self.body.get(field_name)\n\n\nresponse = ApiResponse(200, {\"id\": 1, \"username\": \"ivan\"})\nprint(response.is_success())            # True\nprint(response.get_field(\"username\"))   # ivan\n\nerror_response = ApiResponse(404, {\"error\": \"not found\"})\nprint(error_response.is_success())      # False\n```\n\n## Частые ошибки\n\n- Забыть `self` первым параметром в объявлении метода — получишь `TypeError: takes 0 positional arguments but 1 was given` при вызове (Python сам подставляет объект первым аргументом, а метод его \"не ждёт\").\n- Обратиться к атрибуту без `self.` внутри метода (`username = username` вместо `self.username = username`) — атрибут не создастся, а внутри `__init__` просто исчезнет параметр в никуда.\n- Спутать класс (шаблон, `TestUser`) с объектом (конкретный экземпляр, `user`) — методы вызываются на объекте, а не на классе.\n- Хранить общие для всех объектов данные не в `__init__` (через `self.`), а прямо в теле класса — тогда это будет один общий атрибут на все экземпляры сразу, а не у каждого свой (эта тонкость подробно разбирается уже за рамками этого курса, но полезно знать, что разница есть).\n\n## Мини-задание\n\nНапиши класс `ApiResponse` (как в примере) и добавь ему метод `has_error()`, который возвращает `True`, если в `self.body` есть ключ `\"error\"`. Создай два объекта: один — успешный ответ с данными, второй — ответ с ошибкой, и проверь оба метода на них.\n", "hasPractice": true, "quiz": {"question": "Что произойдёт, если при объявлении метода класса забыть указать self первым параметром?", "options": ["Метод будет работать точно так же — self не обязателен", "При вызове метода на объекте возникнет TypeError о лишнем аргументе", "Атрибуты класса станут доступны без создания объекта", "Python автоматически подставит self сам, ничего не заметив"], "correct": 1, "explain": "Python при вызове метода на объекте (user.method()) всегда подставляет сам объект первым аргументом. Если метод объявлен без self, этот \"лишний\" аргумент девать некуда — возникает TypeError."}}, {"id": "p16", "section": "Модуль 0 · Python-база", "subgroup": "Неделя 2", "isOverview": false, "num": "0.11", "title": "Наследование", "content": "# 0.11. Наследование\n\n## Зачем это нужно\n\nВ Page Object Model у всех страниц сайта есть что-то общее (например, объект браузерной страницы, метод перехода по URL), но у каждой страницы — свои уникальные элементы и действия. Дублировать общий код в каждом классе — плохая практика (тот же принцип DRY, что и с функциями). Наследование позволяет описать общее один раз в \"базовом\" классе, а в каждом конкретном классе — дописать только то, что отличается. Именно так устроен `boilerplate/pages/`, с которым ты будешь работать с модуля 4.\n\nКак и предыдущий урок, этот материал написан отдельно для курса — в исходном Stepik-курсе темы наследования нет вообще.\n\n## Теория\n\nКласс может **наследоваться** от другого класса — тогда он автоматически получает все его атрибуты и методы, и может добавить свои или переопределить существующие:\n\n```python\nclass Animal:\n    def __init__(self, name):\n        self.name = name\n\n    def make_sound(self):\n        return \"...\"\n\n\nclass Dog(Animal):          # Dog наследуется от Animal\n    def make_sound(self):    # переопределяем метод\n        return \"Woof!\"\n\n\nrex = Dog(\"Rex\")\nprint(rex.name)          # Rex — атрибут получен от Animal, ничего лишний раз не писали\nprint(rex.make_sound())  # Woof! — а этот метод у Dog свой\n```\n\n`class Dog(Animal):` — в скобках после имени класса указывается родительский класс (*
