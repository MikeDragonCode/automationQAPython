те собственный пример с `scope=\"class\"` и фикстурой, возвращающей словарь (например, `{\"count\": 0}`). В первом тестовом методе класса увеличьте значение `count` на единицу. Во втором методе того же класса проверьте (и заранее письменно предположите, до запуска), увидите вы там `0` или уже изменённое значение — а затем запустите тесты и сравните с предположением.\n", "hasPractice": true, "quiz": [{"question": "Фикстура объявлена с scope=\"session\" и возвращает список. Первый тест дописывает в этот список элемент. Что увидит второй тест, который тоже запрашивает эту фикстуру?", "options": ["Тот же список с уже добавленным элементом — это один и тот же объект", "Список без добавленного элемента, так как pytest копирует его перед каждым тестом", "Пустой исходный список — фикстура пересоздаётся перед каждым тестом", "Ошибку ScopeMismatch, потому что список был изменён"], "correct": 0, "explain": "При scope=\"session\" фикстура создаётся один раз на весь прогон и возвращает один и тот же объект всем тестам, которые её запрашивают. Мутация из одного теста остаётся видна в следующем — в этом и состоит риск широких scope для изменяемых данных."}, {"question": "Какой scope у фикстуры, если параметр scope при объявлении @pytest.fixture явно не указан?", "options": ["class — по умолчанию фикстура привязана к тестовому классу", "function — фикстура создаётся заново для каждого теста, который её запрашивает", "session — самый широкий, для надёжности по умолчанию", "module — по умолчанию фикстура одна на файл"], "correct": 1, "explain": "По умолчанию scope равен \"function\" — это самый безопасный вариант, при котором фикстура создаётся заново для каждого теста и полностью изолирует тесты друг от друга."}, {"question": "В примере с `@pytest.fixture(scope=\"class\") def big_dataset()` и списком creation_log, после выполнения двух тестовых методов одного класса len(creation_log) == 1. Почему?", "options": ["Потому что pytest по ошибке засчитал оба теста как один", "Потому что creation_log сбрасывается перед вторым тестом", "Потому что фикстура с scope=\"class\" создаётся один раз на весь класс и переиспользуется в обоих методах", "Потому что второй тест не смог получить доступ к фикстуре и не увеличил счётчик"], "correct": 2, "explain": "scope=\"class\" означает, что фикстура создаётся один раз для всех тестовых методов внутри одного класса — поэтому счётчик создания увеличился только один раз, хотя фикстуру запросили дважды."}, {"question": "Можно ли сделать фикстуру с scope=\"session\", которая при этом зависит от другой фикстуры с scope=\"function\"?", "options": ["Да, pytest создаст function-scoped фикстуру один раз и подставит её в session-scoped", "Нет — pytest выдаст ошибку ScopeMismatch, потому что более широкая по области видимости фикстура не может опираться на то, что живёт меньше неё", "Да, но только если обе фикстуры находятся в одном файле", "Да, это стандартный и рекомендованный способ ускорить тесты"], "correct": 1, "explain": "Фикстура с более широким scope переживает несколько тестов, а function-scoped фикстура пересоздаётся на каждый тест — сделать первую зависимой от второй невозможно логически, и pytest сообщает об этом ошибкой ScopeMismatch."}, {"question": "Согласно правилу компромисса из урока, когда стоит использовать более широкий scope (class/session) для фикстуры?", "options": ["Только для фикстур, возвращающих строки, а не списки или словари", "Для объектов, которые дорого создавать и безопасно переиспользовать без изменения тестами (например, HTTP-клиент)", "Только если в тестовом файле меньше пяти тестов", "Всегда, чтобы тесты выполнялись как можно быстрее"], "correct": 1, "explain": "Общее правило: function-scope по умолчанию для всего, что тест может изменить, и более широкий scope — только для того, что дорого создавать и безопасно читать без изменения."}, {"question": "Тест A относится к классу TestFoo, тест B — к классу TestBar. Оба запрашивают одну и ту же фикстуру с scope=\"class\". Получат ли они один и тот же объект?", "options": ["Да, scope=\"class\" означает «один экземпляр на все классы в файле»", "Да, но только если оба теста находятся в одном файле", "Это зависит от порядка запуска тестов", "Нет — каждый класс получает собственный, отдельно созданный экземпляр фикстуры"], "correct": 3, "explain": "class-scope строго ограничен одним классом: тесты внутри TestFoo получают один общий экземпляр, а TestBar — другой, отдельно созданный, даже если оба класса лежат в одном файле."}]}, {"id": "p31", "section": "Модуль 1 · pytest как среда", "subgroup": "Неделя 4", "isOverview": false, "num": "1.10", "title": "conftest.py: общие фикстуры для нескольких файлов", "content": "# 1.10. conftest.py: общие фикстуры для нескольких файлов\n\n## Зачем это нужно\n\nКак только фикстура нужна больше чем одному тестовому файлу, копировать её в каждый файл — плохая идея: любое изменение придётся синхронизировать вручную во всех копиях. В `boilerplate` уже есть готовый пример такого файла — `boilerplate/conftest.py`, в котором лежат фикстуры для UI-тестов, API-клиента и даже хук для скриншотов при падении. Разобраться, как он работает, важно ещё до того, как вы начнёте его дополнять в следующих модулях.\n\n## Теория\n\n`conftest.py` — специальное имя файла, которое pytest распознаёт автоматически. Фикстуры (и некоторые другие настройки, например хуки), определённые в нём, становятся доступны во всех тестовых файлах, которые находятся **в той же директории или ниже по дереву** — без единого `import`.\n\n```\nmy_practice_project/\n├── conftest.py                 # видно всем тестам ниже\n└── tests/\n    ├── test_string_utils.py\n    └── test_more_utils.py\n```\n\n```python\n# conftest.py\nimport pytest\n\n\n@pytest.fixture\ndef sample_titles():\n    return [\"Hello World\", \"  Python  QA  \", \"Already-Slug\"]\n```\n\n```python\n# tests/test_string_utils.py\nfrom utils.string_utils import slugify\n\n\ndef test_slugify_uses_sample_titles(sample_titles):\n    assert slugify(sample_titles[0]) == \"hello-world\"\n```\n\nФикстура `sample_titles` доступна в `tests/test_string_utils.py`, хотя нигде не импортировалась — pytest сам читает `conftest.py` во время сбора тестов и регистрирует найденные в нём фикстуры.\n\n### Область действия по расположению в дереве папок\n\n`conftest.py` в корне проекта — общий для всех тестов проекта. Если положить дополнительный `conftest.py` внутрь конкретной поддиректории (например, `tests/unit/conftest.py`), его фикстуры будут доступны только тестам внутри `tests/unit/` и ниже, но не тестам в `tests/api/` или `tests/ui/`. Так можно разделять по-настоящему общие фикстуры (в корневом `conftest.py`) и специфичные для одного вида тестов (в локальном `conftest.py` нужной поддиректории).\n\n### conftest.py — это не тестовый файл\n\n`conftest.py` не должен содержать тестовые функции (`test_...`) — его роль другая: хранить общую подготовку (фикстуры, хуки), которую используют тесты из настоящих тестовых файлов. Также не стоит называть его с префиксом `test_` — иначе pytest попытается собрать его как обычный тестовый файл, что не является его назначением.\n\n## Пример\n\nПосмотрите на настоящий `boilerplate/conftest.py` — вот его ключевая часть:\n\n```python\nimport pytest\nfrom playwright.sync_api import Page\n\nfrom clients.users.users_client import UsersClient, get_users_client\n\n\n@pytest.fixture\ndef user_data() -> dict[str, str]:\n    return {\n        \"email\": get_random_email(),\n        \"username\": get_random_username(),\n        \"password\": get_random_password(),\n    }\n\n\n@pytest.fixture(scope=\"session\")\ndef users_client() -> UsersClient:\n    return get_users_client()\n```\n\nЭто ровно та ситуация, которую мы разобрали в предыдущем уроке про `scope`: `user_data` создаётся заново на каждый тест (`scope` по умолчанию — `function`), потому что для разных тестов нужны разные, не пересекающиеся данные пользователя. А `users_client` объявлен с `scope=\"session\"` — HTTP-клиент безопасно создать один раз и переиспользовать во всех тестах, которые к нему обращаются, без риска что-то сломать общей мутацией. Оба этих правила вы уже знаете — теперь видно, как они применяются в реальном, а не учебном коде.\n\nНи `user_data`, ни `users_client` нигде не импортируются в тестовых файлах модулей 3–4 — они просто указываются как параметры тестовых функций, точно так же, как в примере выше с `sample_titles`.\n\n## Частые ошибки\n\n* Пытаться сделать `from conftest import user_data` и вызвать фикстуру вручную (`data = user_data()`) — это ломает саму идею фикстур: пропадает и автоматическое разрешение зависимостей, и корректная работа `scope`. Фикстуру из `conftest.py` нужно использовать так же, как любую другую — указать её имя параметром теста, и всё.\n* Положить `conftest.py` не в ту директорию, ожидая, что он будет виден «всему проекту» — файл действует только на директорию, в которой лежит, и на всё, что вложено ниже, но не «вбок» и не выше.\n* Определить в двух разных `conftest.py` (корневом и вложенном) фикстуру с одинаковым именем и не глазами не заметить — вложенный `conftest.py` переопределяет фикстуру для тестов внутри своей директории, что иногда оказывается неожиданным поведением, если про это не помнить.\n* Назвать файл `test_conftest.py` вместо `conftest.py` — pytest начнёт собирать его как тестовый файл, а фикстуры общими для других файлов не станут.\n\n## Мини-задание\n\nВ своём учебном проекте создайте `conftest.py` в корне с одной-двумя фикстурами (например, `sample_titles` из примера выше) и минимум два тестовых файла, каждый из которых использует хотя бы одну из этих фикстур без единого импорта. Запустите `python -m pytest -v` и убедитесь, что оба файла успешно находят фикстуры.\n", "hasPractice": true, "quiz": [{"question": "В conftest.py объявлена фикстура sample_titles. Как правильно использовать её в файле tests/test_string_utils.py?", "options": ["Написать import conftest и обратиться как conftest.sample_titles()", "Написать from conftest import sample_titles и вызвать sample_titles()", "Указать sample_titles как параметр тестовой функции, без единого импорта", "Скопировать тело фикстуры в начало каждого тестового файла"], "correct": 2, "explain": "pytest сам читает conftest.py во время сбора тестов и делает фикстуры из него доступными во всех тестовых файлах ниже по дереву папок — достаточно указать имя фикстуры как параметр теста, импорт не нужен и ломает саму идею фикстур."}, {"question": "В проекте есть conftest.py в корне и отдельный tests/unit/conftest.py. Где будут видны фикстуры из корневого conftest.py?", "options": ["Во всех тестовых файлах проекта, включая вложенные директории вроде tests/unit/", "Нигде, если во вложенной директории есть свой conftest.py", "Только в файлах, лежащих прямо в корне проекта, но не внутри tests/", "Только в тестах, которые явно импортируют этот файл"], "correct": 0, "explain": "conftest.py действует на директорию, в которой лежит, и на всё, что вложено ниже. Корневой conftest.py виден всем тестам проекта, в том числе внутри tests/unit/."}, {"question": "Почему conftest.py не рекомендуется называть с префиксом test_ (например, test_conftest.py)?", "options": ["pytest попытается собрать его как обычный тестовый файл, а не как файл с общими фикстурами", "Такое имя вызовет ошибку ScopeMismatch при следующем запуске", "pytest вообще не станет читать такой файл", "Это приведёт к дублированию всех фикстур проекта"], "correct": 0, "explain": "Имя файла с префиксом test_ подпадает под правило discovery тестовых файлов — pytest попробует собрать его как тестовый файл, что противоречит его настоящей роли хранилища общих фикстур."}, {"question": "В conftest.py фикстура user_data объявлена со scope по умолчанию (function), а users_client — со scope=\"session\". Чем объясняется эта разница?", "options": ["session-scope обязателен для всех фикстур, которые возвращают объекты, а не словари", "user_data должна быть разной для разных тестов, а users_client — это дорогой и безопасный для переиспользования HTTP-клиент, который можно создать один раз", "function-scope применяется только к фикстурам без зависимостей от других фикстур", "Это случайность, разницы в поведении между ними нет"], "correct": 1, "explain": "Выбор scope здесь — прямое применение правила из предыдущего урока: изменяемые, специфичные для теста данные держат на function-scope, а дорогой и безопасно переиспользуемый клиент — на более широком."}, {"question": "Если во вложенном conftest.py (например, tests/unit/conftest.py) объявить фикстуру с тем же именем, что и в корневом conftest.py, что произойдёт для тестов внутри tests/unit/?", "options": ["pytest случайным образом выберет одну из двух при каждом запуске", "Будет использована фикстура из вложенного conftest.py — она переопределяет одноимённую фикстуру из корневого для тестов внутри своей директории", "Всегда будет использована фикстура из корневого conftest.py, вложенная будет проигнорирована", "pytest выдаст ошибку о дублирующемся имени фикстуры"], "correct": 1, "explain": "Вложенный conftest.py имеет приоритет для тестов внутри своей директории и может переопределять одноимённые фикстуры из родительских conftest.py — это осознанная возможность, а не ошибка конфигурации."}]}, {"id": "p32", "section": "Модуль 1 · pytest как среда", "subgroup": "Неделя 4", "isOverview": false, "num": "1.11", "title": "Assert-паттерны: исключения и сложные структуры", "content": "# 1.11. Assert-паттерны: исключения и сложные структуры\n\n## Зачем это нужно\n\nРеальные функции не только возвращают значения — они ещё и падают на некорректном вводе. `chunk_list` из `boilerplate/utils/string_utils.py` уже поднимает `ValueError`, если передать неположительный размер чанка, и такое поведение тоже нужно проверять тестами. А результаты функций часто оказываются не числом или строкой, а списком или словарём — для них тоже есть свои, стандартные приёмы сравнения. Это ровно те паттерны, которые проверяются в домашнем задании модуля.\n\n## Теория\n\n### Проверка исключений: pytest.raises\n\nЧтобы проверить, что код действительно поднимает нужное исключение, используется контекстный менеджер `pytest.raises`:\n\n```python\nimport pytest\n\nwith pytest.raises(ValueError):\n    chunk_list([1, 2, 3], 0)\n```\n\nТест **пройдёт**, только если внутри блока `with` действительно будет поднято исключение указанного типа (или его подкласс). Если исключения не произойдёт вовсе — тест упадёт с ошибкой о том, что `ValueError` не было поднято. Если будет поднято исключение другого типа — оно просто «пролетит» дальше и тест тоже упадёт, но уже с этим другим исключением.\n\nМожно дополнительно проверить текст сообщения об ошибке через параметр `match` (это регулярное выражение, сверяемое со строковым представлением исключения):\n\n```python\nwith pytest.raises(ValueError, match=\"positive integer\"):\n    chunk_list([1, 2, 3], -1)\n```\n\nЕсли нужен доступ к самому объекту исключения — например, чтобы проверить дополнительные атрибуты, — используется `as`:\n\n```python\nwith pytest.raises(ValueError) as excinfo:\n    chunk_list([1, 2, 3], 0)\n\nassert \"positive integer\" in str(excinfo.value)\n```\n\n### Сравнение списков и словарей\n\nОператор `==` в Python рекурсивно сравнивает списки, словари, кортежи и множества по содержимому — никаких специальных методов не нужно:\n\n```python\nresult = chunk_list([1, 2, 3, 4, 5], 2)\nassert result == [[1, 2], [3, 4], [5]]\n```\n\nЭто работает и для вложенных структур (список словарей, словарь списков) — Python сравнит их поэлементно на любую глубину. При падении такого `assert` pytest покажет структурный диф — какие элементы или ключи отличаются, а не просто «False».\n\n### Когда порядок не важен\n\nЕсли функция не гарантирует порядок элементов, а важен только состав, сравнивайте через `sorted(...)` (для списков) или приведение к `set(...)` (если элементы уникальны и хешируемы):\n\n```python\nresult = chunk_list([\"b\", \"a\", \"c\"], 3)\nassert sorted(result[0]) == [\"a\", \"b\", \"c\"]\n```\n\n### Дроби: pytest.approx\n\nПрямое сравнение вычисленных чисел с плавающей точкой через `==` ненадёжно из-за особенностей их внутреннего представления (`0.1 + 0.2 == 0.3` в Python — `False`). Для таких случаев в pytest есть `pytest.approx`:\n\n```python\nassert 0.1 + 0.2 == pytest.approx(0.3)\n```\n\nОн же прекрасно работает и внутри списков/словарей значений, если такие структуры содержат дробные числа.\n\n## Пример\n\n```python\nimport pytest\n\nfrom utils.string_utils import chunk_list\n\n\ndef test_chunk_list_rejects_non_positive_size():\n    with pytest.raises(ValueError):\n        chunk_list([1, 2, 3], 0)\n\n\ndef test_chunk_list_rejects_negative_size_with_message():\n    with pytest.raises(ValueError, match=\"positive integer\"):\n        chunk_list([1, 2, 3], -1)\n\n\ndef test_chunk_list_result_structure():\n    result = chunk_list([1, 2, 3, 4, 5], 2)\n    assert result == [[1, 2], [3, 4], [5]]\n\n\ndef test_user_data_shape():\n    data = {\n        \"email\": \"user@example.com\",\n        \"username\": \"testuser\",\n        \"password\": \"password123\",\n    }\n    assert data == {\n        \"email\": \"user@example.com\",\n        \"username\": \"testuser\",\n        \"password\": \"password123\",\n    }\n    assert set(data.keys()) == {\"email\", \"username\", \"password\"}\n```\n\nПервые два теста — это ровно та же идея, что уже реализована в `boilerplate/tests/unit/test_string_utils.py` в тесте `test_chunk_list_rejects_non_positive_size`, только с добавлением проверки текста сообщения через `match`. Третий и четвёртый — типовые примеры сравнения структур: список списков (важен порядок) и словарь (сравнение по значению целиком плюс отдельная проверка набора ключей).\n\n## Частые ошибки\n\n* Вызывать проверяемый код **до** блока `with pytest.raises(...)`, а не внутри него — тогда исключение произойдёт до того, как pytest начнёт его «ловить», и тест упадёт с необработанным исключением вместо чёткого сообщения о провале ожидания.\n* Не понимать, что если код внутри `pytest.raises(...)` **не** поднимает исключение — тест **падает**. Это ожидаемое поведение: `pytest.raises` описывает обязательное условие, а не «опциональную подстраховку».\n* Использовать слишком широкий тип исключения, например `pytest.raises(Exception)`, вместо конкретного `ValueError` — тест в этом случае пройдёт даже при неправильном типе исключения, маскируя реальные баги в коде.\n* Сравнивать вычисленные дробные значения через `==` вместо `pytest.approx` и получать редкие, «случайные» падения теста из-за погрешности округления.\n\n## Мини-задание\n\nНапишите ещё один тест на `pytest.raises` для `chunk_list` с другим некорректным значением размера (например, `-5`), и отдельный тест, сравнивающий собранный вручную словарь (свою придуманную структуру данных, например «результат теста»: `{\"name\": ..., \"passed\": ..., \"duration\": ...}`) с ожидаемым словарём через `==`.\n", "hasPractice": true, "quiz": [{"question": "Вызов chunk_list([1, 2, 3], 0), который поднимает ValueError, по ошибке написан ДО блока `with pytest.raises(ValueError):`, а не внутри него. Что произойдёт при запуске теста?", "options": ["Тест пройдёт, потому что ValueError всё равно был поднят где-то в теле теста", "pytest сам переместит вызов внутрь блока with перед выполнением", "Тест упадёт с необработанным ValueError, а не с понятным сообщением pytest.raises", "Тест будет автоматически помечен как skipped"], "correct": 2, "explain": "pytest.raises ловит исключение только внутри своего блока with. Если код, поднимающий исключение, вызван раньше, исключение происходит до того, как pytest начинает его ожидать, и тест падает с необработанным исключением вместо чёткого сообщения о непройденной проверке."}, {"question": "Внутри блока `with pytest.raises(ValueError): ...` код НЕ поднимает никакого исключения. Что произойдёт с тестом?", "options": ["pytest выведет предупреждение, но тест будет засчитан как пройденный", "Тест будет автоматически пропущен (skipped)", "Тест упадёт — pytest.raises ожидает, что исключение обязательно будет поднято", "Тест пройдёт — pytest.raises работает как необязательная подстраховка"], "correct": 2, "explain": "pytest.raises описывает обязательное условие: если внутри блока исключение не было поднято, тест считается упавшим, потому что ожидаемое поведение не подтвердилось."}, {"question": "Зачем нужен параметр match у pytest.raises, например pytest.raises(ValueError, match=\"positive integer\")?", "options": ["Он определяет, в каком файле искать текст ошибки", "Он ограничивает, сколько раз исключение может быть поднято за один тест", "Он дополнительно проверяет текст сообщения исключения по регулярному выражению", "Он подставляет строку match вместо реального сообщения исключения"], "correct": 2, "explain": "match — это регулярное выражение, которое pytest сверяет со строковым представлением поднятого исключения, позволяя проверить не только тип, но и текст сообщения об ошибке."}, {"question": "Почему использование pytest.raises(Exception) вместо pytest.raises(ValueError) считается частой ошибкой, если код должен поднимать именно ValueError?", "options": ["Exception нельзя использовать вместе с параметром match", "Exception работает медленнее, чем конкретные типы исключений", "pytest технически не поддерживает Exception в pytest.raises", "Слишком широкий тип может замаскировать баг — тест пройдёт даже если поднято совсем другое, неожиданное исключение"], "correct": 3, "explain": "Exception — родитель практически всех исключений, поэтому тест с pytest.raises(Exception) пройдёт даже при неправильном типе ошибки, скрывая реальные баги в коде."}, {"question": "Как правильно сравнить результат функции [3, 1, 2] с ожидаемым [1, 2, 3], если порядок элементов не важен, а важен только состав?", "options": ["assert [3, 1, 2] in [1, 2, 3]", "assert [3, 1, 2] is [1, 2, 3]", "assert sorted([3, 1, 2]) == [1, 2, 3]", "assert [3, 1, 2] == [1, 2, 3] — Python сам проигнорирует порядок при сравнении списков"], "correct": 2, "explain": "== сравнивает списки строго поэлементно, с учётом порядка. Если порядок не важен, списки нужно предварительно отсортировать через sorted() (или привести к множеству) перед сравнением."}, {"question": "Почему `assert 0.1 + 0.2 == 0.3` — ненадёжная проверка, и что стоит использовать вместо неё?", "options": ["Нужно сначала привести оба числа к строке и сравнить их как строки", "Нужно сравнивать такие числа через is вместо ==", "Из-за особенностей представления чисел с плавающей точкой сравнение может дать False; вместо == стоит использовать pytest.approx", "Это на самом деле полностью корректная проверка, менять ничего не нужно"], "correct": 2, "explain": "0.1 + 0.2 в Python не равно ровно 0.3 из-за округления при внутреннем представлении дробей. pytest.approx создан именно для сравнения вычисленных float с допустимой погрешностью."}]}, {"id": "p33", "section": "Модуль 1 · pytest как среда", "subgroup": "Неделя 4", "isOverview": false, "num": "1.12", "title": "pytest.ini vs pyproject.toml", "content": "# 1.12. pytest.ini vs pyproject.toml\n\n## Зачем это нужно\n\nОткрыв чужой проект, вы не всегда увидите знакомый `pytest.ini` — конфигурация pytest не менее часто живёт в `pyproject.toml`. Это не два разных инструмента, а два равнозначных места для одних и тех же настроек. Важно узнавать оба формата, чтобы не растеряться на code review или собеседовании, когда конфиг выглядит непривычно.\n\n## Теория\n\npytest ищет свою конфигурацию в нескольких возможных файлах и использует первый найденный (в порядке приоритета: `pytest.ini`, затем `pyproject.toml` с секцией `[tool.pytest.ini_options]`, затем `tox.ini`, затем `setup.cfg`). На практике это означает: в проекте должен быть только один активный источник настроек pytest — если завести сразу два файла с пересекающимися настройками, действовать будет только тот, что найден первым, а изменения во втором будут просто игнорироваться, что легко запутывает.\n\n### Одна и та же настройка в двух форматах\n\n`pytest.ini` — обычный INI-формат:\n\n```ini\n[pytest]\nmarkers =\n    ui: UI-тесты (Playwright)\n    api: API-тесты (requests)\n    unit: тесты чистых функций/утилит, без сети и без браузера\n    smoke: быстрый набор критичных проверок\n    regress: полный регрессионный набор\n\naddopts = -ra --strict-markers\ntestpaths = tests\n```\n\nТа же конфигурация в `pyproject.toml` — формат TOML, секция `[tool.pytest.ini_options]`, списки оформляются как TOML-массивы строк:\n\n```toml\n[tool.pytest.ini_options]\nmarkers = [\n    \"ui: UI-тесты (Playwright)\",\n    \"api: API-тесты (requests)\",\n    \"unit: тесты чистых функций/утилит, без сети и без браузера\",\n    \"smoke: быстрый набор критичных проверок\",\n    \"regress: полный регрессионный набор\",\n]\naddopts = \"-ra --strict-markers\"\ntestpaths = [\"tests\"]\n```\n\nЛогика настроек полностью одинаковая — отличается только синтаксис файла: в INI многострочное значение `markers` — это просто текст с отступами, а в TOML это список строк в квадратных скобках.\n\n### Почему в этом курсе используется pytest.ini\n\n`pyproject.toml` обычно выбирают проекты, где в этом же файле уже настроены другие инструменты — сборка пакета, `black`, `ruff`, `mypy` — так удобнее держать всю конфигурацию в одном месте. Для учебного и в целом самостоятельного тестового проекта, каким является `boilerplate`, отдельный `pytest.ini` читается проще и не требует объяснять синтаксис TOML раньше времени. Поэтому весь курс (и все его последующие модули) работает с `pytest.ini`, но знать про существование альтернативы важно уже сейчас.\n\n## Пример\n\nЕсли бы у `boilerplate` не было `pytest.ini`, а вместо него был `pyproject.toml`, попытка запустить `python -m pytest -m unit` работала бы ровно так же — pytest прочитал бы `[tool.pytest.ini_options]` вместо `[pytest]` и получил бы идентичный набор маркеров, `addopts` и `testpaths`. С точки зрения поведения тестов разницы нет, разница только в том, где именно и в каком синтаксисе записана настройка.\n\n## Частые ошибки\n\n* Держать в проекте одновременно и `pytest.ini`, и `[tool.pytest.ini_options]` в `pyproject.toml` — работать будет только один из них (тот, что найден раньше по правилам поиска), а правки во втором будут незаметно ни на что не влиять.\n* Забывать, что TOML требует списков в квадратных скобках и кавычек вокруг строк — `markers = ui: ..., api: ...` без скобок и кавычек в TOML попросту не будет валидным синтаксисом.\n* Считать, что `pyproject.toml` «более современный и поэтому приоритетнее» — приоритет определяется исключительно порядком поиска файлов, а не тем, какой формат выглядит новее.\n* Копировать секцию `[tool.pytest.ini_options]` один в один из `setup.cfg` без адаптации синтаксиса — это разные форматы файлов (INI и TOML), даже если логическое содержимое настроек совпадает.\n\n## Мини-задание\n\nНе трогая `boilerplate/pytest.ini`, перепишите его содержимое от руки в виде `pyproject.toml` (как в примере выше) в отдельном текстовом файле или в конспекте — это упражнение на чтение и «перевод» между двумя форматами конфигурации, а не на изменение реального проекта.\n", "hasPractice": true, "quiz": [{"question": "В проекте одновременно есть pytest.ini и pyproject.toml с секцией [tool.pytest.ini_options], и в них заданы разные значения testpaths. Что произойдёт?", "options": ["Подействуют настройки из файла, который pytest находит первым по правилам поиска, а второй файл будет проигнорирован", "pytest завершится с ошибкой из-за конфликта конфигураций", "pytest объединит настройки из обоих файлов в одну", "Будет использован pyproject.toml, так как это более новый формат"], "correct": 0, "explain": "pytest ищет конфигурацию по фиксированному порядку файлов (pytest.ini, затем pyproject.toml и так далее) и использует только первый найденный источник. Поэтому держать в проекте два файла с пересекающимися настройками pytest не стоит — второй будет просто молча проигнорирован."}, {"question": "В каком порядке pytest ищет свою конфигурацию, если несколько подходящих файлов существуют одновременно?", "options": ["Все найденные файлы конфигурации автоматически объединяются в один", "Сначала pyproject.toml, затем pytest.ini", "Порядок случайный и зависит от операционной системы", "Сначала pytest.ini, затем pyproject.toml (секция [tool.pytest.ini_options]), затем tox.ini, затем setup.cfg"], "correct": 3, "explain": "У pytest есть фиксированный порядок поиска конфигурационных файлов, и действует только первый найденный в этом порядке — pytest.ini имеет приоритет выше, чем pyproject.toml."}, {"question": "Как в pyproject.toml (в отличие от pytest.ini) правильно оформить список маркеров?", "options": ["Как TOML-массив строк в квадратных скобках, каждая строка в кавычках: markers = [\"unit: ...\", \"api: ...\"]", "Через точку с запятой в одну строку без скобок", "TOML не поддерживает списки, поэтому нужно указывать только один общий маркер", "Точно так же, как в pytest.ini — построчно с отступами, без кавычек"], "correct": 0, "explain": "TOML требует оформления списков как массивов в квадратных скобках с элементами-строками в кавычках — это отличается от простого многострочного текста в INI-формате pytest.ini."}, {"question": "Почему в этом курсе выбран pytest.ini, а не pyproject.toml, хотя оба варианта равнозначны с точки зрения pytest?", "options": ["pyproject.toml нельзя использовать вместе с флагом --strict-markers", "pyproject.toml технически не поддерживает настройки markers и addopts", "pytest.ini работает быстрее при запуске тестов", "pytest.ini проще читается новичкам и не требует объяснять синтаксис TOML раньше времени; pyproject.toml чаще выбирают, когда в нём уже настроены другие инструменты"], "correct": 3, "explain": "Разница чисто в удобстве и контексте проекта: pyproject.toml оправдан, когда там уже живёт конфигурация других инструментов (сборка, линтеры), а для простого учебного проекта pytest.ini читается проще."}, {"question": "Верно ли, что pyproject.toml имеет более высокий приоритет, чем pytest.ini, потому что это «более современный» формат?", "options": ["Да, но только начиная с последних версий pytest", "Да, pytest всегда сначала проверяет pyproject.toml как более актуальный вариант", "Это зависит от того, какой из двух файлов был изменён позже по времени", "Нет, приоритет определяется исключительно порядком поиска файлов, а не тем, какой формат выглядит новее — pytest.ini находится раньше"], "correct": 3, "explain": "«Современность» формата никак не влияет на приоритет — pytest просто идёт по фиксированному списку возможных файлов конфигурации и останавливается на первом найденном, а pytest.ini в этом списке стоит раньше pyproject.toml."}]}, {"id": "p34", "section": "Модуль 1 · pytest как среда", "subgroup": "Неделя 4", "isOverview": false, "num": null, "title": "Домашнее задание: Модуль 1 — pytest как среда", "content": "# Домашнее задание: Модуль 1 — pytest как среда\n\n## Формулировка задания\n\nНапишите **10–15 тестов** на простых Python-утилитах, используя всё, что вы прошли в модуле 1: фикстуры, параметризацию, маркеры, `conftest.py`, `pytest.raises` и сравнение сложных структур.\n\nМатериал для тестирования на выбор (можно совмещать):\n\n* функции из `boilerplate/utils/string_utils.py` — `is_palindrome`, `slugify`, `chunk_list`, `count_vowels` (файл только читаем, не изменяйте его — тесты пишутся в вашем собственном учебном проекте, а не в `boilerplate`);\n* 2–3 своих новых чистых функции без внешних зависимостей (без сети, без файлов, без браузера) — например, функция подсчёта уникальных слов в строке, функция валидации email по простому шаблону, функция округления числа до ближайшего кратного и т. п.\n\nЭто модуль 0–1 курса: домашнее задание сдаётся **файлами** (архив или ссылка на ваш личный репозиторий), а не PR-ом — PR-флоу в общий репозиторий `boilerplate` начнётся в модуле 2.\n\n## Ожидаемая структура проекта\n\n```\nhomework_module1/\n├── pytest.ini\n├── conftest.py\n├── utils/\n│   └── ...            # ваши функции или скопированные string_utils.py\n└── tests/\n    ├── test_....py\n    └── test_....py     # минимум 2 тестовых файла, чтобы conftest.py был реально нужен\n```\n\n## Критерии «готово»\n\nЗадание засчитывается, если выполнено **всё** нижеперечисленное:\n\n- [ ] Не менее **10 тестовых функций** (`def test_...`) в сумме по всем файлам; допускается, что часть из них параметризована несколькими наборами данных.\n- [ ] Использован хотя бы один **`@pytest.mark.parametrize`** минимум с 3 наборами данных.\n- [ ] На тестах расставлены **маркеры** (например, `unit`), и все использованные маркеры **зарегистрированы** в `pytest.ini`.\n- [ ] В `pytest.ini` включён **`--strict-markers`** (через `addopts`), и запуск `python -m pytest` проходит без ошибок о незарегистрированных маркерах.\n- [ ] Указан **`testpaths = tests`** (или аналогичная настройка), команда `python -m pytest` из корня проекта находит все тесты без явного указания пути.\n- [ ] Есть минимум **одна фикстура с областью видимости, отличной от `function`** (`class` или `session`) — и рядом с ней комментарий на 1–2 строки, почему выбран именно такой scope и почему это безопасно (то есть тест не мутирует расшаренные данные).\n- [ ] Есть минимум **одна цепочка зависимых фикстур** (одна фикстура запрашивает другую).\n- [ ] Есть **`conftest.py`**, и хотя бы одна фикстура из него используется минимум в двух разных тестовых файлах без единого `import`.\n- [ ] Есть минимум **один тест на `pytest.raises`** — на исключение, которое ваш код (или `chunk_list`) действительно поднимает при некорректном вводе.\n- [ ] Есть минимум **один тест, сравнивающий сложную структуру** (список списков, список словарей или словарь) через `==`.\n- [ ] Все тесты **проходят** при запуске `python -m pytest -v` без ошибок и без предупреждений о маркерах.\n\n## Как сдавать\n\nПришлите архив проекта (или ссылку на публичный репозиторий/gist) с указанной структурой. В сопроводительном сообщении укажите команду, которой вы проверяли, что все тесты проходят (обычно это `python -m pytest -v`), и её итоговый вывод (сколько тестов собрано и сколько прошло).\n", "hasPractice": false}, {"id": "p35", "section": "Модуль 2 · Git и командная работа", "subgroup": null, "isOverview": true, "num": null, "title": "Модуль 2. Git и командная работа", "content": "# Модуль 2. Git и командная работа\n\nНеделя 5 и дальше — постоянно, до конца курса.\n\n## Что меняется с этого модуля\n\nМодули 0–1 ты проходил соло: писал код, сдавал файлы. Начиная с этого модуля вводится\n**общий репозиторий** — `boilerplate/`, реальный стартовый фреймворк этого курса\n(`pytest` + `requests` + `playwright`). Ты форкаешь его один раз, и с этого момента\n**каждое домашнее задание — это Pull Request в общий репозиторий**, а не отдельный проект.\n\nТак строится работа в любой реальной QA automation команде: тесты живут в общем\nрепозитории, изменения проходят через ветки, PR и ревью, а не пишутся \"в стол\".\n\n## Уроки модуля\n\n1. [2.1 Первые шаги с Git: init, add, commit, .gitignore](<01_Первые шаги с Git.md>)\n2. [2.2 Публикация на GitHub: remote, push, pull, форк](<02_Публикация на GitHub.md>)\n3. [2.3 Ветки: branch, checkout, switch](#p38)\n4. [2.4 Pull Request: что это и зачем](<04_Pull Request.md>)\n5. [2.5 Как оформить понятный PR](<05_Как оформить понятный PR.md>)\n6. [2.6 Конфликты слияния: откуда берутся и как решать](<06_Конфликты слияния.md>)\n7. [2.7 Код-ревью: с обеих сторон](#p42)\n8. [2.8 Rebase vs merge: коротко о том, что это](<08_Rebase vs merge.md>)\n9. [2.9 Git flow этого курса: форк → ветка → PR → ревью → merge](<09_Git flow этого курса.md>)\n\n## Источники материала\n\n- Уроки 2.1–2.2 (базовые команды Git, публикация на GitHub) опираются на главу\n  \"Система контроля версий Git\" курса `stepik-api-testing-advanced`, переписаны своими\n  словами и адаптированы под общий репозиторий курса.\n- Уроки 2.3–2.9 (ветки как часть командного флоу, Pull Request, конфликты, код-ревью,\n  rebase/merge, git flow этого курса) — в источнике этого материала нет (там разобран\n  только соло-сценарий), написаны самостоятельно на основе GitHub flow и стандартных\n  индустриальных практик.\n\n## Итог модуля\n\n[Домашнее задание](#p45) — первый смёрженный Pull Request в общий репозиторий `boilerplate/`.\n", "hasPractice": false}, {"id": "p36", "section": "Модуль 2 · Git и командная работа", "subgroup": null, "isOverview": false, "num": "2.1", "title": "Первые шаги с Git: init, add, commit, .gitignore", "content": "# 2.1 Первые шаги с Git: init, add, commit, .gitignore\n\n## Зачем это нужно\n\nТесты — это код, а код без истории изменений — это код, который страшно менять: непонятно,\nчто было раньше, кто и зачем что-то поправил, и как откатиться, если новая правка всё сломала.\nВ реальной работе QA automation engineer видит Git каждый день: смотрит `git log`, чтобы понять,\nкогда появился баг, использует `git blame`, чтобы найти автора строки, и уж точно не может отдать\nкод на ревью без ветки и коммитов. Начнём с самого фундамента — трёх команд, без которых Git\nвообще не запускается.\n\n## Теория\n\nGit — распределённая система контроля версий: у каждого разработчика есть полная копия истории\nпроекта на своей машине, а не только на сервере. Это значит, что коммитить, смотреть историю и\nоткатывать изменения можно офлайн — синхронизация с сервером (GitHub) происходит отдельным шагом\n(об этом — в следующем уроке).\n\nУ файла в Git есть три состояния:\n\n- **working directory** — то, что ты видишь и редактируешь в IDE прямо сейчас;\n- **staging area (индекс)** — \"черновик\" следующего коммита: сюда ты явно добавляешь то, что\n  хочешь зафиксировать;\n- **repository** — история коммитов, уже сохранённая в `.git`.\n\nРазделение на staging area — не лишняя сложность, а возможность собрать в один коммит только\nсвязанные изменения, даже если в рабочей папке правок больше.\n\nОсновные команды:\n\n```bash\ngit init                  # создать новый локальный репозиторий в текущей папке\ngit status                # что изменилось / что в staging area / что не отслеживается\ngit add <file>            # добавить конкретный файл в staging area\ngit add .                 # добавить все изменённые и новые файлы\ngit commit -m \"сообщение\" # зафиксировать содержимое staging area как новый коммит\ngit log --oneline         # короткая история коммитов\ngit diff                  # что изменилось в рабочей папке относительно последнего коммита\ngit restore <file>        # отменить незакоммиченные изменения в файле\n```\n\nПеред первым коммитом Git нужно один раз представить, кто ты:\n\n```bash\ngit config --global user.name \"Имя Фамилия\"\ngit config --global user.email \"you@example.com\"\n```\n\nЭти данные попадают в каждый коммит как автор — именно по ним в PR будет видно, кто что написал.\n\n### .gitignore\n\nНе всё, что лежит в папке проекта, должно попадать в репозиторий: виртуальное окружение,\nкэш `pytest`, отчёты Allure, файлы IDE — всё это специфично для конкретной машины и раздувает\nрепозиторий без пользы. Список исключений задаётся в файле `.gitignore` в корне проекта —\nGit просто не будет предлагать добавить эти файлы в staging area.\n\nХороший коммит — маленький и про одно: одна логическая правка, а не \"накопил за неделю и залил\nразом\". Сообщение коммита пишется в повелительном наклонении и коротко объясняет суть:\n`Add slugify function`, а не `fix`, `wip` или `changes`.\n\n## Пример\n\nПредставим, что ты только что написал `utils/string_utils.py` и тест к нему (как в модуле 1) и\nхочешь зафиксировать это как первый коммит проекта:\n\n```bash\ncd my_practice_repo\ngit init\n\ngit status\n# видно: utils/, tests/, .venv/, __pycache__/ — всё как untracked\n```\n\nСначала — `.gitignore`, точно такой же принцип использует `boilerplate/.gitignore` в общем\nрепозитории курса:\n\n```\n.venv/\n__pycache__/\n*.pyc\n.pytest_cache/\nallure-results/\nallure-report/\n.env\n.idea/\n.vscode/\n```\n\nТеперь `git status` больше не предлагает добавить `.venv/` и кэш — и можно спокойно добавлять всё\nостальное:\n\n```bash\ngit add .gitignore\ngit commit -m \"Add .gitignore\"\n\ngit add utils/string_utils.py tests/unit/test_string_utils.py\ngit commit -m \"Add string utils with is_palindrome, slugify and tests\"\n\ngit log --oneline\n# a1b2c3d Add string utils with is_palindrome, slugify and tests\n# f4e5d6c Add .gitignore\n```\n\nДва коммита — два самостоятельных смысловых шага, а не одна большая свалка изменений.\n\n## Частые ошибки\n\n- Сделать `git add .` до того, как появился `.gitignore` — в репозиторий улетают `.venv/` и\n  `__pycache__/`, и потом их приходится вычищать отдельным коммитом.\n- Сообщения коммитов вида `fix`, `wip`, `update` — через месяц по такой истории невозможно понять,\n  что вообще произошло.\n- Один гигантский коммит на всю неделю работы — сложно ревьюить, сложно откатить только одну\n  часть, если что-то одно оказалось неудачным.\n- Коммитить не глядя, не проверив `git status` перед `git add` — так в репозиторий попадают\n  случайные файлы (например, настройки IDE, если забыли `.gitignore`).\n\n## Мини-задание\n\nСоздай локальную папку с парой Python-файлов (можно взять свои решения из модуля 1). Инициализируй\nв ней Git-репозиторий, добавь `.gitignore` по образцу из примера выше и сделай три отдельных\nосмысленных коммита: например, отдельно `.gitignore`, отдельно функцию, отдельно тест к ней.\nПроверь результат через `git log --oneline`.\n", "hasPractice": true, "quiz": [{"question": "Ты написал новую функцию в utils/string_utils.py, а git status также показывает как untracked папку .venv/. Что нужно сделать, чтобы Git больше не предлагал добавлять .venv/ в коммит?", "options": ["Добавить .venv/ в .gitignore", "Использовать git add . вместо git add <file>, чтобы Git сам разобрался", "Удалить папку .venv/ с диска перед каждым коммитом", "Выполнить git commit -m \"ignore venv\" без git add"], "correct": 0, "explain": ".gitignore указывает Git, какие пути не отслеживать вовсе — после этого .venv/ перестаёт появляться в git status и не может случайно попасть в staging area."}, {"question": "Что делает команда git add utils/string_utils.py?", "options": ["Добавляет файл в staging area — черновик следующего коммита", "Отправляет файл на GitHub", "Удаляет файл из рабочей директории", "Сразу фиксирует файл в истории репозитория"], "correct": 0, "explain": "git add переносит изменения из рабочей директории в staging area (индекс) — только оттуда git commit фиксирует их как новый коммит."}, {"question": "Какое сообщение коммита оформлено правильно по практике из этого урока?", "options": ["fix", "wip", "changes", "Add slugify function with tests"], "correct": 3, "explain": "Хорошее сообщение коммита короткое, в повелительном наклонении и объясняет суть изменения — в отличие от \"fix\"/\"wip\"/\"changes\", по которым через месяц невозможно понять, что произошло."}, {"question": "Зачем перед первым коммитом нужно один раз выполнить git config --global user.name и user.email?", "options": ["Чтобы автоматически сгенерировался файл .gitignore", "Эти данные записываются как автор в каждый создаваемый коммит", "Это нужно только для git push, а не для git commit", "Чтобы Git проверил доступ к интернету"], "correct": 1, "explain": "user.name и user.email попадают в метаданные каждого коммита как информация об авторе — именно по ним видно, кто что написал, в том числе позже в Pull Request."}, {"question": "Почему один гигантский коммит на всю неделю работы считается плохой практикой?", "options": ["Git физически не позволяет закоммитить больше определённого числа файлов сразу", "Такой коммит сложно ревьюить и невозможно откатить только одну часть изменений, если она окажется неудачной", "GitHub блокирует push коммитов, если в них больше одного файла", "Такой коммит нельзя запушить без флага --force"], "correct": 1, "explain": "Мелкие осмысленные коммиты проще проверять и откатывать по отдельности; один большой коммит смешивает много несвязанных изменений в одну неделимую единицу истории."}]}, {"id": "p37", "section": "Модуль 2 · Git и командная работа", "subgroup": null, "isOverview": false, "num": "2.2", "title": "Публикация на GitHub: remote, push, pull, форк", "content": "# 2.2 Публикация на GitHub: remote, push, pull, форк\n\n## Зачем это нужно\n\nЛокальный репозиторий — это хорошо, но общий репозиторий курса `boilerplate/` живёт на GitHub,\nи с этого модуля именно туда попадают все домашние задания в виде Pull Request. Прежде чем\nговорить про ветки и PR, нужно понять один механический шаг: как локальная копия проекта\nсвязывается с удалённым репозиторием и обменивается с ним изменениями.\n\n## Теория\n\nGitHub — это хостинг для Git-репозиториев плюс набор инструментов поверх него: Pull Request'ы,\nIssues, ревью кода, CI (GitHub Actions). Сам Git не обязан знать про GitHub — это просто ещё один\n\"удалённый репозиторий\", с которым можно синхронизироваться.\n\nСвязь с удалённым репозиторием:\n\n```bash\ngit remote add origin <URL-репозитория>   # добавить удалённый репозиторий с именем origin\ngit remote -v                              # посмотреть, какие remote'ы уже подключены\n```\n\nОбмен изменениями:\n\n```bash\ngit push -u origin main   # отправить локальную ветку main на origin, запомнить связь (-u)\ngit push                  # дальше можно просто push, Git помнит, куда\ngit pull origin main      # забрать изменения с origin и слить их в текущую ветку\n```\n\n`git pull` — это фактически `git fetch` (скачать изменения) + `git merge` (слить их с твоей\nветкой) одной командой.\n\nПолучить копию существующего репозитория целиком — не `init`, а `clone`:\n\n```bash\ngit clone <URL-репозитория>\n```\n\n### Форк vs клон\n\nЕсли у тебя есть права на запись в репозиторий — достаточно `git clone` и `git push` напрямую.\nНо у `boilerplate/` — общего репозитория курса — у тебя таких прав нет и не будет: это стартовый\nшаблон для всех студентов. Поэтому используется схема **fork**:\n\n1. На GitHub нажимаешь **Fork** на странице `boilerplate` — GitHub создаёт полную копию\n   репозитория в твоём аккаунте, с правами на запись.\n2. Клонируешь **свой форк** к себе на компьютер (`git clone <URL-твоего-форка>`) — это станет\n   remote'ом `origin`.\n3. Добавляешь оригинальный `boilerplate` как ещё один remote — по конвенции его называют\n   `upstream`:\n\n```bash\ngit remote add upstream <URL-оригинального-boilerplate>\ngit remote -v\n# origin    <твой форк>       (fetch/push)\n# upstream  <оригинальный boilerplate>  (fetch/push)\n```\n\nДальше `origin` — твоя рабочая копия, в неё пушишь свои ветки. `upstream` — используется только\nдля того, чтобы периодически подтягивать изменения из оригинального репозитория (`git fetch\nupstream` + `git merge upstream/main`), если он обновится.\n\nДля авторизации `git push` на GitHub логин/пароль уже не используются — нужен либо личный токен\nдоступа (Personal Access Token), либо настроенный SSH-ключ. Как именно оформить доступ, зависит\nот того, что использует твоя когорта/платформа — уточни у преподавателя, если возникнут проблемы\nс авторизацией при первом `push`.\n\n## Пример\n\nФоркаем и клонируем общий репозиторий курса:\n\n```bash\n# 1. Нажал Fork на странице boilerplate на GitHub — получил свою копию\n# 2. Клонирую свой форк\ngit clone git@github.com:<your-username>/boilerplate.git\ncd boilerplate\n\n# 3. Добавляю оригинальный репозиторий как upstream\ngit remote add upstream git@github.com:<course-org>/boilerplate.git\ngit remote -v\n\n# 4. Перед началом работы — синхронизирую main с upstream\ngit fetch upstream\ngit switch main\ngit merge upstream/main\ngit push origin main\n```\n\nПосле этого локальная папка `boilerplate/` содержит актуальную структуру общего репозитория\n(`clients/`, `pages/`, `tests/unit|api|ui/`, `conftest.py`, `pytest.ini`) — и готова к тому, чтобы\nот неё создать первую рабочую ветку (следующий урок).\n\n## Частые ошибки\n\n- Пытаться сделать `git push` прямо в оригинальный `boilerplate`, а не в свой форк — GitHub вернёт\n  ошибку доступа: писать можно только в свой форк.\n- Забыть синхронизировать форк с `upstream` перед началом новой задачи — новая ветка создаётся от\n  устаревшего `main`, и потом это выливается в лишние конфликты при открытии PR.\n- Перепутать `origin` и `upstream` местами при добавлении remote'ов.\n- Сделать изменения, забыть `git pull`, и только потом обнаружить, что на сервере уже другая\n  версия файла — это тоже источник конфликтов (урок 2.6).\n\n## Мини-задание\n\nФоркни `boilerplate/` в свой GitHub-аккаунт (по-настоящему — это тот же репозиторий, с которым ты\nбудешь работать весь курс). Склонируй форк локально, добавь `upstream`, указывающий на оригинальный\nрепозиторий, и убедись командой `git remote -v`, что оба remote'а настроены правильно.\n", "hasPractice": true, "quiz": [{"question": "У тебя нет прав на запись в общий репозиторий boilerplate/. Как правильно получить возможность пушить свои изменения и открывать из них Pull Request?", "options": ["Работать только локально и присылать преподавателю файлы по почте", "Попросить у преподавателя логин и пароль от общего аккаунта на GitHub", "Сделать Fork на GitHub, склонировать свой форк, а оригинал добавить отдельным remote'ом upstream", "Склонировать оригинальный boilerplate и делать git push прямо в него"], "correct": 2, "explain": "Fork создаёт твою собственную копию репозитория с правами на запись (remote origin); upstream указывает на оригинал и нужен только для того, чтобы периодически подтягивать из него изменения."}, {"question": "Что делает флаг -u в команде git push -u origin main?", "options": ["Принудительно перезаписывает историю на remote", "Удаляет ветку main на remote перед отправкой", "Запоминает связь локальной ветки с origin/main, чтобы дальше можно было использовать просто git push", "Отправляет push от имени другого пользователя GitHub"], "correct": 2, "explain": "Флаг -u (--set-upstream) один раз связывает локальную ветку с веткой на remote — после этого достаточно просто git push, без указания origin main каждый раз."}, {"question": "Что фактически происходит при выполнении git pull origin main?", "options": ["Выполняется git fetch, а затем git merge — изменения скачиваются и сразу сливаются с текущей веткой", "Выполняется только git merge — слияние без предварительного скачивания", "Выполняется только git fetch — изменения скачиваются, но не сливаются", "Автоматически выполняется git push локальных изменений на remote"], "correct": 0, "explain": "git pull — это комбинация git fetch (скачать изменения) и git merge (слить их с текущей веткой), выполненная одной командой."}, {"question": "Чем git clone отличается от git init?", "options": ["git clone работает только для приватных репозиториев", "git clone скачивает уже существующий репозиторий целиком вместе с историей, а git init создаёт новый пустой локальный репозиторий", "git clone создаёт пустой репозиторий, а git init копирует существующий вместе с историей", "Это два разных названия одной и той же команды"], "correct": 1, "explain": "git init инициализирует новый пустой репозиторий в текущей папке, а git clone скачивает уже существующий репозиторий (например твой форк) вместе со всей его историей коммитов."}, {"question": "Как по конвенции принято называть remote, указывающий на оригинальный (не твой) репозиторий boilerplate после форка?", "options": ["master", "origin", "main", "upstream"], "correct": 3, "explain": "По конвенции origin — это твой собственный форк (для push твоих изменений), а upstream — оригинальный репозиторий, из которого периодически подтягиваются чужие обновления."}, {"question": "Каким способом сейчас авторизуются push-запросы на GitHub по HTTPS, раз обычный пароль от аккаунта для этого не подходит?", "options": ["Персональным токеном доступа (Personal Access Token) или настроенным SSH-ключом", "Паролем от почты, на которую зарегистрирован аккаунт", "Решением капчи перед каждым push", "Номером телефона, привязанным к аккаунту"], "correct": 0, "explain": "GitHub больше не принимает обычный пароль аккаунта для push по HTTPS — нужен либо личный токен доступа, либо настроенный SSH-ключ."}]}, {"id": "p38", "section": "Модуль 2 · Git и командная работа", "subgroup": null, "isOverview": false, "num": "2.3", "title": "Ветки: branch, checkout, switch", "content": "# 2.3 Ветки: branch, checkout, switch\n\n## Зачем это нужно\n\nВ общем репозитории одновременно работает вся группа. Если все коммитят прямо в `main`, любая\nнеудачная правка одного человека ломает работу всех остальных. Ветки решают это: каждая задача\nделается изолированно, и в `main` попадает только то, что уже проверено и одобрено ревьюером.\n\n## Теория\n\nВетка в Git — это не копия файлов, а просто именованный указатель на коммит. Когда ты создаёшь\nветку, Git не копирует проект — он лишь запоминает, \"с какого коммита начинается эта линия\nразработки\". Именно поэтому переключение между ветками — мгновенная операция.\n\n```\nA---B---C           (main)\n         \\\n          D---E---F  (feature/add-slugify)\n```\n\n`A`, `B`, `C` — коммиты в `main`. От коммита `C` создана ветка `feature/add-slugify`, в ней\nпоявляются свои коммиты `D`, `E`, `F`, которые пока никак не влияют на `main`. Когда работа\nготова и прошла ревью, эта ветка сливается обратно (подробно про слияние — в уроках 2.4 и 2.6).\n\nКоманды:\n\n```bash\ngit branch                     # список локальных веток, текущая отмечена *\ngit branch -a                  # включая ветки на remote\ngit branch <name>               # создать ветку (без переключения на неё)\ngit switch <name>               # переключиться на существующую ветку\ngit switch -c <name>            # создать ветку и сразу переключиться на неё\ngit checkout <name>             # старый вариант switch, тоже переключает ветку\ngit checkout -b <name>          # старый вариант switch -c\ngit branch -d <name>             # удалить локальную ветку (только если она уже слита)\n```\n\n`git switch` появился позже как более понятная замена части возможностей `git checkout`\n(у `checkout` слишком много разных задач: переключение веток, откат файлов, создание веток).\nОба варианта рабочие, `switch` просто читается яснее — в этом курсе будем использовать его.\n\nПрактика, которая экономит нервы: **`main` всегда должен быть рабочим**. Вся разработка — в\nотдельных ветках, названных по смыслу задачи: `feature/add-slugify`, `fix/wrong-status-code`.\nОсмысленное имя ветки — это тоже часть коммуникации с командой, по нему сразу понятно, что внутри.\n\n## Пример\n\nРаботаем в своём форке `boilerplate/`. Хотим добавить новую функцию в `utils/string_utils.py`\nи тест к ней — создаём для этого отдельную ветку от актуального `main`:\n\n```bash\ngit switch main\ngit pull origin main                     # убедились, что main свежий\n\ngit switch -c feature/add-reverse-words\n\n# правим utils/string_utils.py, добавляем tests/unit/test_string_utils.py\ngit add utils/string_utils.py tests/unit/test_string_utils.py\ngit commit -m \"Add reverse_words util with tests\"\n\ngit branch\n#   main\n# * feature/add-reverse-words\n```\n\n`main` при этом не тронут — если сейчас переключиться обратно (`git switch main`), новой функции\nтам не будет, она существует только в ветке `feature/add-reverse-words`, пока не будет\nсмёржена через PR.\n\nПосле того как ветка смёржена и в ней больше нет нужды:\n\n```bash\ngit switch main\ngit branch -d feature/add-reverse-words\n```\n\n## Частые ошибки\n\n- Решать несколько разных задач в одной ветке — потом невозможно замёржить одну часть без другой.\n- Не глядя, в какой ветке находишься, и закоммитить правку прямо в `main` (проверяй `git branch`\n  или подсказку текущей ветки в терминале/IDE перед коммитом).\n- Создать ветку от устаревшего `main` (забыли `git pull` перед `git switch -c`) — задачи, которые\n  уже слиты в `main` другими, не попадают в твою ветку, и дальше при открытии PR вылезают лишние\n  конфликты.\n- Пытаться удалить веткой `-d` ветку с ещё не смёрженными коммитами — Git специально\n  откажется это делать (принудительно это можно обойти `-D`, но так легко потерять работу\n  безвозвратно).\n\n## Мини-задание\n\nВ тренировочном репозитории создай две независимые ветки от `main` для двух разных мелких правок\n(например, две разные функции). Переключайся между ними и наблюдай, как меняется содержимое\nфайлов — в каждой ветке видна только \"своя\" работа.\n", "hasPractice": true, "quiz": [{"question": "Что произойдёт, если выполнить git switch -c feature/add-slugify, не сделав перед этим git pull для main?", "options": ["Новая ветка создастся от твоей локальной (возможно устаревшей) версии main, что позже может привести к лишним конфликтам", "Команда завершится ошибкой, пока не выполнишь git pull", "Ветка создастся, но её нельзя будет запушить на GitHub", "Git сам автоматически подтянет последние изменения main перед созданием новой ветки"], "correct": 0, "explain": "git switch -c создаёт ветку от текущего состояния локального main, каким бы оно ни было. Если main давно не обновлялся, новая ветка не увидит чужие уже смёрженные изменения — и это всплывёт как конфликт при открытии PR."}, {"question": "Технически, что представляет собой ветка в Git?", "options": ["Отдельную папку внутри директории .git", "Резервную копию репозитория, хранящуюся на сервере", "Именованный указатель на конкретный коммит", "Полную отдельную копию всех файлов проекта"], "correct": 2, "explain": "Ветка — это не копия файлов, а лёгкий именованный указатель на коммит, поэтому создание и переключение между ветками происходит практически мгновенно."}, {"question": "Чем git switch -c feature/x отличается от git switch feature/x?", "options": ["git switch -c сначала создаёт новую ветку с этим именем и сразу переключается на неё, а git switch feature/x просто переключает на уже существующую ветку", "git switch feature/x создаёт ветку сразу на remote, а -c — только локально", "git switch -c удаляет ветку feature/x, если она уже была", "Ничем, это полные синонимы"], "correct": 0, "explain": "Флаг -c (create) сначала создаёт ветку, а затем переключается на неё; без этого флага команда лишь переключает на уже существующую ветку и завершится ошибкой, если такой ветки нет."}, {"question": "Что произойдёт при попытке git branch -d feature/x, если ветка feature/x ещё не смёржена ни в одну другую ветку?", "options": ["Git откажется удалять ветку, чтобы не потерять несмёрженную работу", "Ветка автоматически смёржится в main перед удалением", "Git удалит ветку без каких-либо предупреждений", "Команда вместо feature/x удалит текущую ветку main"], "correct": 0, "explain": "git branch -d — «безопасное» удаление: Git проверяет, что все коммиты ветки уже есть в другой ветке, и отказывается удалять, если это не так (для принудительного удаления есть -D, но пользоваться им нужно осторожно)."}, {"question": "Почему важно, чтобы ветка main всегда оставалась рабочей и не содержала недоделанный код?", "options": ["Это техническое ограничение, специфичное только для приватных репозиториев", "main нельзя удалить, поэтому в нём можно временно хранить что угодно", "Иначе GitHub заблокирует push в любые другие ветки репозитория", "От main создаются все новые ветки, и сломанный main передаёт свою проблему во всю новую работу с самого начала"], "correct": 3, "explain": "main служит отправной точкой для новых веток; если он нестабилен, любая ветка, созданная от него, наследует эту проблему ещё до того, как в ней начнётся собственная работа."}]}, {"id": "p39", "section": "Модуль 2 · Git и командная работа", "subgroup": null, "isOverview": false, "num": "2.4", "title": "Pull Request: что это и зачем", "content": "# 2.4 Pull Request: что это и зачем\n\n## Зачем это нужно\n\nС этого модуля любое домашнее задание сдаётся Pull Request'ом. Это не формальность \"для галочки\" —\nэто основной механизм, которым код попадает в общий репозиторий в любой команде, где ты будешь\nработать после курса. Разобраться, что такое PR и зачем он нужен, важнее, чем выучить его кнопки.\n\n## Теория\n\nPull Request (PR) — это не примитив самого Git, а функция хостинга (GitHub, GitLab и т. п.):\nзапрос на слияние одной ветки в другую, обёрнутый в обсуждение и ревью. Технически \"взять и\nвлить\" ветку можно и одной командой `git merge` — но тогда никто, кроме тебя, не увидит\nизменения до того, как они уже окажутся в `main`.\n\nСхема, по которой работает весь курс дальше (её называют **GitHub flow**):\n\n```\nmain ──●───────────────────────────────●──   (стабильная ветка)\n         \\                             /\n          ●──●──●  (commits)  ──── PR ●       (feature-ветка)\n       создал ветку   работал   открыл PR → ревью → правки → approve → merge\n```\n\n1. Создаёшь ветку от актуального `main` (урок 2.3).\n2. Делаешь один или несколько коммитов с решением задачи.\n3. Пушишь ветку на GitHub (`git push -u origin <branch>`).\n4. Открываешь Pull Request: указываешь, из какой ветки в какую хочешь влить изменения.\n5. CI (если настроен, подробно — в модуле 6) автоматически прогоняет тесты на твоей ветке.\n6. Ревьюер смотрит diff, оставляет комментарии.\n7. Ты правишь код по комментариям, пушишь новые коммиты — они автоматически появляются в том же PR.\n8. Когда ревьюер согласен — approve, и PR мёржится в `main`.\n\nЗачем этот процесс, а не прямой `push` в `main`:\n\n- **Контроль качества** — второй человек видит код до того, как он попадёт в общую ветку, а не\n  после.\n- **Явная точка для обсуждения** — комментарии привязаны к конкретным строкам кода и остаются в\n  истории, в отличие от устного \"я тебе там в чате написал\".\n- **Проверка перед слиянием** — CI может заблокировать merge, если тесты падают.\n- **Обмен знаниями** — читая чужие PR, ты видишь, как решают задачи другие, а твой код видят и\n  комментируют тоже не в пустоту.\n\nАнатомия страницы PR на GitHub:\n\n- **Title** и **Description** — что и зачем сделано (подробно — в уроке 2.5).\n- **Files changed** — diff: что именно добавлено/удалено/изменено.\n- **Commits** — список коммитов ветки.\n- **Checks** — статус автоматических проверок (CI).\n- **Conversation** — обсуждение и комментарии ревьюеров.\n\nЕсли работа ещё не закончена, но хочется показать прогресс или получить CI-фидбек раньше времени —\nможно открыть **Draft PR**: тот же PR, но помеченный как черновик, чтобы никто не начал ревью\nраньше времени.\n\n## Пример\n\nПродолжаем ветку `feature/add-reverse-words` из предыдущего урока:\n\n```bash\ngit push -u origin feature/add-reverse-words\n```\n\nПосле этого на странице форка на GitHub появляется баннер \"Compare & pull request\" — нажимаешь на\nнего, указываешь:\n\n- **base**: `main` (куда вливаем),\n- **compare**: `feature/add-reverse-words` (что вливаем),\n\nзаполняешь Title и Description (как именно — урок 2.5) и нажимаешь **Create pull request**.\nС этого момента PR открыт, виден всем, и в него можно продолжать пушить новые коммиты по\nрезультатам ревью — они автоматически добавятся в тот же diff.\n\n## Частые ошибки\n\n- Открыть PR из `main` своего форка в `main` оригинального репозитория, потому что забыли создать\n  отдельную ветку — тогда в PR попадает вообще всё, что есть в твоём форке, а не одна задача.\n- Оставить Title вида \"changes\" и пустое Description — ревьюеру приходится самому разбираться,\n  что и зачем сделано.\n- Открыть PR и забыть про него на две недели, пока в `main` не накопились изменения, из-за которых\n  ветка уже не мёржится без конфликтов.\n- Не посмотреть на статус CI перед тем, как звать ревьюера — просить ревью падающего кода.\n\n## Мини-задание\n\nВ своём форке `boilerplate/` (или в любом тренировочном репозитории на GitHub) открой Draft PR\nдля любой маленькой правки. Изучи интерфейс: вкладку Files changed, вкладку Checks, где появляются\nкомментарии. Пока не мёржи — просто разберись, что где находится.\n", "hasPractice": true, "quiz": [{"question": "Слить ветку в main технически можно одной командой git merge. Зачем тогда в GitHub flow используется Pull Request?", "options": ["PR обязателен технически — без него git merge не выполнится", "PR нужен только для того, чтобы запустить CI, само ревью не имеет значения", "PR — это просто отчёт для преподавателя и на сам код не влияет", "PR добавляет этап ревью и обсуждения кода до того, как изменения попадут в общую ветку"], "correct": 3, "explain": "PR — функция хостинга (GitHub), а не Git: он оборачивает merge в обсуждение, привязанные к коду комментарии и проверку другим человеком до того, как изменения окажутся в main."}, {"question": "В терминологии Pull Request на GitHub, что означают base и compare?", "options": ["base — имя файла в diff'е, compare — имя конкретного коммита", "base — твоя ветка с изменениями; compare — куда её нужно влить", "base — ветка, куда вливаем изменения; compare — ветка, из которой их вливаем", "Это два разных названия одной и той же ветки"], "correct": 2, "explain": "base — целевая ветка (обычно main), в которую вливаются изменения; compare — исходная ветка с твоими коммитами, которую сравнивают с base."}, {"question": "Что произойдёт, если после открытия PR запушить в ту же ветку ещё один коммит с исправлением по комментарию ревьюера?", "options": ["Придётся закрыть текущий PR и открыть новый", "Новый коммит автоматически появится в том же PR, а diff обновится", "Коммит будет проигнорирован, пока PR не закроют", "GitHub создаст для этого коммита отдельный новый PR"], "correct": 1, "explain": "PR привязан к ветке — любой новый push в неё автоматически добавляет коммит в тот же diff и в ту же историю обсуждения, без необходимости открывать PR заново."}, {"question": "Зачем нужен Draft PR?", "options": ["Это единственный тип PR, который вообще можно смёржить", "Draft PR автоматически мёржится через сутки без участия человека", "Чтобы навсегда скрыть изменения от остальных участников", "Чтобы показать прогресс или получить ранний CI-фидбек, явно пометив, что полноценное ревью пока не требуется"], "correct": 3, "explain": "Draft PR — тот же PR, но помеченный как черновик, чтобы никто не начал полноценное ревью раньше времени, хотя CI уже может прогонять тесты на этой ветке."}, {"question": "Какую роль в процессе работы с PR играет CI (вкладка Checks)?", "options": ["Автоматически удаляет ветку сразу после её создания", "Автоматически пишет содержательные комментарии вместо ревьюера-человека", "Автоматически прогоняет тесты на ветке PR и показывает их статус ещё до ручного ревью", "Определяет, кто именно будет назначен ревьюером этого PR"], "correct": 2, "explain": "CI автоматически запускает тесты на коде PR и показывает статус во вкладке Checks — это ранний сигнал ещё до того, как ревьюер потратит время на просмотр самого кода."}]}, {"id": "p40", "section": "Модуль 2 · Git и командная работа", "subgroup": null, "isOverview": false, "num": "2.5", "title": "Как оформить понятный PR", "content": "# 2.5 Как оформить понятный PR\n\n## Зачем это нужно\n\nPR, который ревьюер понимает за две минуты, получает фидбек в тот же день. PR на 600 строк без\nописания либо неделю лежит без внимания, либо ревьюер бегло пролистывает его и пропускает баги.\nОформление PR — это не бюрократия, а способ уважать время того, кто будет твой код читать —\nа по кругу и своё собственное, когда ревьюером окажешься ты.\n\n## Теория\n\n**Правило \"одна задача — одна ветка — один PR\"**. Оно уже звучало в уроках про ветки, но именно\nздесь становится понятно, зачем оно нужно: маленький PR можно просмотреть целиком и удержать в\nголове. PR, который чинит баг, добавляет фичу и заодно переформатировал соседний файл — это уже\nтри разных PR, слепленных в один, и ревьюеру придётся распутывать, что из этого относится к делу.\n\n**Маленький diff — осознанный выбор.** Чем больше строк в PR, тем ниже качество ревью: внимание\nревьюера конечно, и после определённого объёма правки просто \"одобряют не глядя\". Если задача\nобъективно большая — её стоит разбить на несколько последовательных PR.\n\n**Понятный заголовок.** Заголовок — это то, что видно в списке PR и в истории `main` после\nmerge. Хорошо: `Add reverse_words util with tests`. Плохо: `update`, `fix`, `changes`.\n\n**Описание — не для галочки.** Минимальный полезный шаблон:\n\n```markdown\n## Что сделано\nДобавлена функция reverse_words в utils/string_utils.py + тесты в tests/unit/test_string_utils.py.\n\n## Почему / зачем\nНужна для тренировки работы с git flow курса (модуль 2, домашнее задание).\n\n## Как проверить\npytest -m unit -k reverse_words\n```\n\nДля UI-изменений (актуально с модуля 4) сюда же стоит добавить скриншот \"было/стало\" — ревьюеру не\nпридётся поднимать ветку локально, чтобы увидеть результат.\n\n**Самопроверка перед тем, как звать ревьюера.** Собственный diff стоит один раз просмотреть на\nGitHub перед тем, как просить ревью: убрать отладочные `print`, закомментированный старый код,\nслучайно попавшие в коммит файлы (снова привет `.gitignore` из урока 2.1). Это экономит ревьюеру\nвремя на то, что ты и сам можешь заметить.\n\n## Пример\n\nPR в `boilerplate/`, который добавляет новую функцию по аналогии с существующими в\n`utils/string_utils.py` — ровно так, как это описано в правилах самого репозитория\n(`boilerplate/README.md`: \"Одна задача — одна ветка — один PR\", \"В описании PR — что сделано и как\nпроверить\"):\n\n**Title:** `Add reverse_words util with unit tests`\n\n**Description:**\n\n```markdown\n## Что сделано\nДобавлена функция `reverse_words(text: str) -> str` в utils/string_utils.py —\nменяет порядок слов в строке местами. Добавлены параметризованные тесты\nв tests/unit/test_string_utils.py по аналогии с существующими тестами модуля.\n\n## Как проверить\npytest -m unit -k reverse_words\n\n## Дополнительно\nНичего в существующих файлах, кроме добавленных строк, не менялось.\n```\n\nТакой PR ревьюер прочитает за минуту, поймёт объём изменений по одному предложению и сразу\nзапустит нужную команду вместо того, чтобы гадать, что тестировать.\n\n## Частые ошибки\n\n- В один PR попадает рефакторинг соседнего файла \"заодно, раз уж открыл\" — вперемешку с основной\n  задачей.\n- Пустое описание или один заголовок без единого пояснения.\n- Diff на сотни строк из-за автоформатирования IDE, которое переформатировало весь файл, а не\n  только изменённые строки (стоит отключить агрессивное автоформатирование для чужих файлов или\n  форматировать точечно).\n- PR отправлен на ревью без единого локального запуска тестов — CI (или ревьюер) находит то, что\n  можно было найти за 10 секунд самому.\n\n## Мини-задание\n\nВозьми одно из своих решений модуля 1 (соло-задание) и оформи для него \"PR-описание\" по шаблону\nвыше — Title + Что сделано / Почему / Как проверить — как будто это реальный PR. Это тренирует\nформулировать суть изменения кратко ещё до того, как есть настоящий общий репозиторий, в который\nможно её отправить.\n", "hasPractice": true, "quiz": [{"question": "Какой из перечисленных PR ревьюер сможет проверить быстрее и качественнее всего?", "options": ["PR с пустым описанием, зато с понятным именем ветки", "Небольшой PR с одной задачей, понятным заголовком и описанием «что сделано / почему / как проверить»", "PR, объединяющий сразу все задачи недели, чтобы не открывать несколько PR подряд", "PR на 500+ строк, где вперемешку правка бага, рефакторинг соседнего файла и переформатирование кода"], "correct": 1, "explain": "Маленький diff с одной задачей и понятным описанием реально помещается во внимание ревьюера — большие смешанные PR либо пролистывают не глядя, либо они неделями лежат без ревью."}, {"question": "Почему в этом курсе действует правило «одна задача — одна ветка — один PR»?", "options": ["Иначе не запустится CI на ветке", "Это требование действует только для приватных репозиториев", "Так проще ревьюить, при необходимости откатить и понять историю изменений — один PR решает ровно одну понятную задачу", "GitHub технически не позволяет открыть два PR одновременно"], "correct": 2, "explain": "Маленький PR с одной задачей можно целиком удержать в голове при ревью и, если нужно, откатить отдельно от остальных изменений в истории."}, {"question": "Что обязательно должно быть в хорошем описании PR по шаблону из этого урока?", "options": ["Полный список всех файлов проекта", "Дословная копия diff в текстовом виде", "Личные данные автора PR", "Что сделано, почему, и как это проверить — например, конкретная команда pytest"], "correct": 3, "explain": "Минимальный полезный шаблон описания — что сделано, зачем и как это проверить конкретной командой — экономит ревьюеру время на то, чтобы понять контекст изменений."}, {"question": "Зачем перед тем, как звать ревьюера, стоит самому просмотреть свой diff на GitHub?", "options": ["Чтобы автоматически запустить CI на ветке", "Чтобы изменить base-ветку у уже открытого PR", "Это обязательное требование GitHub, без которого нельзя открыть PR", "Чтобы заранее заметить и убрать отладочные print, закомментированный код и случайно попавшие файлы"], "correct": 3, "explain": "Самопроверка diff перед ревью убирает очевидный мусор (debug print, мёртвый код) и экономит время ревьюера на том, что автор мог заметить и исправить сам."}, {"question": "Из-за чего diff в PR может стать неоправданно большим, хотя реальная правка маленькая?", "options": ["Это неизбежно и никак не зависит от используемых инструментов", "Потому что GitHub считает изменёнными даже полностью нетронутые файлы", "Из-за агрессивного автоформатирования IDE, которое переформатировало весь файл целиком, а не только изменённые строки", "Из-за того, что Git всегда показывает содержимое всего файла целиком в любом diff"], "correct": 2, "explain": "Если IDE агрессивно переформатировала весь файл при сохранении, diff покажет изменённым весь файл, хотя по сути правка — пара строк; стоит форматировать точечно или отключать авто-переформатирование чужих файлов."}]}, {"id": "p41", "section": "Модуль 2 · Git и командная работа", "subgroup": null, "isOverview": false, "num": "2.6", "title": "Конфликты слияния: откуда берутся и как решать", "content": "# 2.6 Конфликты слияния: откуда берутся и как решать\n\n## Зачем это нужно\n\nКак только над одним репозиторием работает больше одного человека, конфликты слияния —\nэто не \"что-то пошло не так\", а нормальная часть процесса. В общем репозитории `boilerplate/`\nнесколько студентов будут добавлять функции в одни и те же файлы (`utils/string_utils.py`,\n`conftest.py`) — рано или поздно твоя ветка столкнётся с чужой. Важно не бояться этого экрана\nс `<<<<<<<`, а уметь спокойно его разобрать.\n\n## Теория\n\nGit умеет автоматически сливать изменения, если они не пересекаются: ты правил одну часть файла,\nкто-то другой — совсем другую. Конфликт возникает, когда обе стороны изменили **одни и те же\nстроки** одного файла (или одна сторона файл изменила, а другая — удалила) — Git не может\nугадать, какой вариант правильный, и просит решить это тебя.\n\nКонфликт внутри файла выглядит так:\n\n```python\n<<<<<<< HEAD\ndef reverse_words(text: str) -> str:\n    return \" \".join(text.split()[::-1])\n=======\ndef reverse_words(text: str) -> str:\n    words = text.split()\n    words.reverse()\n    return \" \".join(words)\n>>>>>>> feature/add-reverse-words\n```\n\n- Всё между `<<<<<<< HEAD` и `=======` — версия из твоей текущей ветки.\n- Всё между `=======` и `>>>>>>> <имя ветки>` — версия из ветки, которую сливаешь.\n- Сами маркеры `<<<<<<<`, `=======`, `>>>>>>>` — это не часть кода, их нужно убрать вручную после\n  того, как выбран (или скомбинирован) правильный вариант.\n\nПорядок действий при разрешении конфликта локально:\n\n1. Синхронизируй `main`: `git switch main && git pull origin main`.\n2. Вернись в свою ветку: `git switch feature/add-reverse-words`.\n3. Подтяни актуальный `main` в свою ветку: `git merge main` (конфликт, если он есть, покажется\n   именно сейчас — в твоей ветке, а не в общем `main`, где его увидели бы все).\n4. Открой файлы, помеченные как конфликтные (`git status` покажет список), и вручную реши, какой\n   код должен остаться — один из вариантов, оба, или что-то новое, что совмещает оба намерения.\n5. Убери маркеры `<<<<<<<`, `=======`, `>>>>>>>` полностью — если оставить хоть один, файл сломает\n   синтаксис.\n6. Прогони тесты локально — конфликт мог быть разрешён технически верно, но логически неправильно.\n7. `git add <файл>`, затем `git commit` (Git сам предложит сообщение вида \"Merge branch 'main'\n   into ...\", его можно оставить как есть).\n8. `git push` — обновлённая ветка и PR обновятся автоматически.\n\nНебольшой лайфхак, который резко снижает число и размер конфликтов: чаще подтягивай `main` в свою\nветку, не откладывая работу на неделю — чем дольше ветка живёт отдельно, тем больше в ней успевает\nразойтись с `main`.\n\n## Пример\n\nДва студента параллельно добавляют функции в `utils/string_utils.py`. Первый успел смёржить свой\nPR первым — в `main` уже есть чужая функция `reverse_words`. Второй студент, синхронизируя свою\nветку `feature/add-count-words` с `main`, получает конфликт — потому что оба добавляли новую\nфункцию в конец одного и того же файла, и Git не может понять, в каком порядке их сохранить:\n\n```python\n<<<<<<< HEAD\ndef count_words(text: str) -> int:\n    return len(text.split())\n=======\ndef reverse_words(text: str) -> str:\n    return \" \".join(text.split()[::-1])\n>>>>>>> main\n```\n\nРешение здесь простое — обе функции нужны, конфликт \"ложный\" (пересеклись только соседние строки):\n\n```python\ndef count_words(text: str) -> int:\n    return len(text.split())\n\n\ndef reverse_words(text: str) -> str:\n    return \" \".join(text.split()[::-1])\n```\n\nПосле этого — `git add utils/string_utils.py`, `git commit`, прогнать тесты, `git push`.\n\n## Частые ошибки\n\n- В панике удалить целиком \"чужую\" сторону конфликта, не поняв, что она делала — это потеря\n  чужой работы, а не решение конфликта.\n- Забыть убрать один из маркеров (`<<<<<<<` остаётся в файле) — файл перестаёт быть валидным\n  Python-кодом, тесты падают с `SyntaxError`.\n- Запушить разрешённый конфликт, не прогнав тесты — конфликт мог \"разрешиться\" без синтаксических\n  ошибок, но с логической: например, случайно выбрана более старая версия функции.\n- Пытаться разрешать конфликт прямо в `main`, а не в своей feature-ветке — тогда неразрешённое\n  состояние временно оказывается в общей ветке, которой пользуются все.\n\n## Мини-задание\n\nСпециально создай конфликт в тренировочном репозитории: заведи две ветки от одного `main`, в обеих\nизмени одну и ту же строку одного файла по-разному, смёржи одну ветку в `main`, а во второй сделай\n`git merge main` — и разреши получившийся конфликт руками по шагам из этого урока.\n", "hasPractice": true, "quiz": [{"question": "После git merge main в своей ветке ты видишь в файле маркеры <<<<<<<, ======= и >>>>>>>. Что нужно сделать перед тем, как коммитить?", "options": ["Удалить конфликтующий файл целиком и создать его заново с нуля", "Выбрать или скомбинировать нужный код, полностью удалить все маркеры, прогнать тесты и только потом сделать git add и commit", "Оставить маркеры как есть — Git уберёт их сам при следующем push", "Отменить merge и больше не синхронизировать ветку с main до конца задачи"], "correct": 1, "explain": "Маркеры конфликта — не часть кода, их нужно убрать вручную после того, как выбран правильный вариант, а тесты после разрешения конфликта нужно прогнать заново, потому что конфликт мог разрешиться синтаксически, но неверно по логике."}, {"question": "При каком условии в Git вообще возникает конфликт слияния?", "options": ["Всегда, как только в проекте участвует больше одного человека", "Когда обе стороны изменили одни и те же строки одного файла (или одна изменила, а другая удалила его)", "Только при использовании git rebase, а не git merge", "Когда два человека изменили совершенно разные файлы проекта"], "correct": 1, "explain": "Git умеет автоматически сливать непересекающиеся изменения; конфликт возникает именно тогда, когда обе стороны затронули одни и те же строки (или одна изменила файл, а другая удалила его), и Git не может сам выбрать правильный вариант."}, {"question": "В блоке конфликта что находится между маркерами <<<<<<< HEAD и =======?", "options"
