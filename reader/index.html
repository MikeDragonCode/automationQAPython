я", "Машина (часто временный контейнер), на которой реально выполняется job"], "correct": 3, "explain": "Раннер — исполнитель: конкретная машина или контейнер, где физически выполняются команды job'а."}, {"question": "Почему раннер обычно заново устанавливает все зависимости (pip install -r requirements.txt), хотя у разработчика они уже стоят локально?", "options": ["Это баг конфигурации, которого быть не должно", "Раннер — чистое окружение/контейнер без каких-либо локально установленных пакетов разработчика", "requirements.txt обязательно нужно переустанавливать раз в сутки по расписанию", "Чтобы намеренно замедлить пайплайн"], "correct": 1, "explain": "Раннер стартует с чистого окружения при каждом прогоне — поэтому пайплайн всегда явно ставит зависимости с нуля, не полагаясь на состояние конкретной машины разработчика."}]}, {"id": "p87", "section": "Модуль 6 · CI на уровне пользователя", "subgroup": null, "isOverview": false, "num": "6.2", "title": "Читаем GitHub Actions workflow", "content": "# 6.2. Читаем GitHub Actions workflow\n\n## Зачем это нужно\n\nЕсли твой репозиторий живёт на GitHub, пайплайн описывается файлом в `.github/workflows/*.yml`. Уметь прочитать такой файл — значит понимать, что именно выполнится при твоём следующем push, ещё до того, как это произойдёт.\n\n## Теория\n\nКлючевые поля YAML-файла GitHub Actions:\n\n- **`on:`** — триггеры запуска (push, pull_request, расписание, ручной запуск).\n- **`jobs:`** — словарь job'ов, каждый со своим именем.\n- **`runs-on:`** — на какой виртуальной машине выполняется job (например `ubuntu-latest`).\n- **`steps:`** — последовательность шагов внутри job'а: либо готовое действие (`uses: actions/checkout@v4`), либо своя команда (`run: pytest ...`).\n- **`needs:`** — job зависит от другого job'а и не начнётся, пока тот не завершится успешно.\n- **`if: always()`** — шаг выполнится, даже если предыдущие шаги упали (полезно для загрузки артефактов при падении тестов).\n\n## Пример\n\nРазбор `boilerplate/.github/workflows/ci.yml` построчно:\n\n```yaml\non:\n  push:\n    branches: [main]\n  pull_request:\n    branches: [main]\n```\n\nПайплайн запускается на push в `main` и на любой PR, целящийся в `main`. Значит, каждый твой PR в общий репозиторий автоматически прогонит этот workflow.\n\n```yaml\njobs:\n  unit-and-api:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-python@v5\n        with:\n          python-version: \"3.12\"\n      - name: Install dependencies\n        run: pip install -r requirements.txt\n      - name: Run unit + API tests\n        run: pytest -m \"unit or api\" --alluredir=allure-results\n      - name: Upload allure results\n        if: always()\n        uses: actions/upload-artifact@v4\n        with:\n          name: allure-results-api\n          path: allure-results\n```\n\nJob `unit-and-api`: скачивает код (`checkout`), ставит Python 3.12, ставит зависимости, запускает только unit- и API-тесты (`-m \"unit or api\"` — тот же синтаксис маркеров из модуля 1!), и в любом случае (`if: always()`, даже если тесты упали) сохраняет папку `allure-results` как артефакт, который потом можно скачать со страницы прогона.\n\n```yaml\n  ui:\n    runs-on: ubuntu-latest\n    needs: unit-and-api\n    steps:\n      ...\n      - name: Install dependencies\n        run: |\n          pip install -r requirements.txt\n          playwright install --with-deps chromium\n      - name: Run UI tests\n        run: pytest -m ui --alluredir=allure-results\n```\n\nJob `ui` зависит от `unit-and-api` (`needs:`) — то есть UI-тесты (медленные, с браузером) запустятся только если быстрые тесты уже прошли. Дополнительно этот job ставит браузер Chromium (`playwright install`) — шаг, которого нет в первом job'е, потому что там браузер не нужен.\n\n## Частые ошибки\n\n- Не заметить `needs:` и удивляться, почему UI job вообще не запустился — если `unit-and-api` упал, `ui` не стартует.\n- Забыть `if: always()` при добавлении своего шага сохранения артефактов — без него шаг выполнится только при успехе предыдущих, и при падении тестов ты не увидишь allure-results вообще.\n- Путать `uses:` (готовое переиспользуемое действие из marketplace) и `run:` (произвольная shell-команда) — это разные механизмы описания шага.\n\n## Мини-задание\n\nНайди в `ci.yml` строку, отвечающую за версию Python, и ответь: что произойдёт, если у тебя локально Python 3.11, а в CI указан 3.12 — где тесты выполнятся \"по-настоящему\", а где — просто для проверки перед мёржем?\n\n## Как посмотреть результат в интерфейсе GitHub\n\nВкладка **Actions** в репозитории → конкретный workflow run → список jobs слева → клик на job открывает лог каждого шага. Красный крестик у шага — именно там нужно искать причину падения (см. урок 6.4).\n", "hasPractice": true, "quiz": [{"question": "Job `ui` в boilerplate/.github/workflows/ci.yml объявлен с `needs: unit-and-api`. Что это означает?", "options": ["needs передаёт переменные окружения из одного job в другой", "Job ui запустится параллельно с unit-and-api, needs — просто для документации", "Job ui запустится только после успешного завершения job unit-and-api", "needs подключает те же зависимости из requirements.txt автоматически"], "correct": 2, "explain": "`needs:` создаёт явную зависимость между job'ами: следующий стартует только после успеха предыдущего — поэтому медленные UI-тесты не запускаются впустую, если упали быстрые."}, {"question": "Чем отличаются `uses:` и `run:` в шаге GitHub Actions?", "options": ["run нельзя использовать в job'е, где уже есть uses", "uses — готовое переиспользуемое действие из marketplace (например actions/checkout), run — произвольная shell-команда", "Это два взаимозаменяемых синонима одного и того же", "uses работает только на Windows-раннерах"], "correct": 1, "explain": "uses подключает готовое действие (checkout, setup-python, upload-artifact), run выполняет произвольную команду в shell — это разные механизмы описания шага."}, {"question": "Зачем в шаге сохранения allure-results указан `if: always()`?", "options": ["Чтобы шаг выполнился, даже если предыдущие шаги (тесты) упали", "Чтобы ускорить выполнение job'а", "Чтобы шаг выполнялся раз в сутки по расписанию", "always() ничего не меняет технически, это просто стилистическое соглашение"], "correct": 0, "explain": "Без if: always() шаг выполнился бы только при успехе предыдущих — а результаты особенно важно сохранить именно при падении тестов."}, {"question": "Секция `on: pull_request: branches: [main]` означает, что пайплайн запустится...", "options": ["На каждый Pull Request, целящийся в ветку main", "Только когда кто-то вручную нажмёт кнопку запуска в интерфейсе GitHub", "Только раз в неделю по расписанию", "Только при прямом push в main, PR не учитываются"], "correct": 0, "explain": "Эта секция триггеров означает: любой PR, у которого база (target) — main, автоматически запускает workflow."}, {"question": "Job 'ui' в ci.yml ставит Chromium через `playwright install`, а job 'unit-and-api' — нет. Почему?", "options": ["Порядок установки шагов в файле не имеет никакого значения", "Это ошибка в конфигурации, которую нужно исправить", "playwright install нужно вызывать один раз на весь пайплайн, и место вызова не важно", "unit- и API-тесты не открывают браузер, а UI-тестам нужен реальный Chromium"], "correct": 3, "explain": "Установка браузера нужна только там, где тесты реально его используют — добавлять её в job без UI-тестов было бы лишней тратой времени CI."}]}, {"id": "p88", "section": "Модуль 6 · CI на уровне пользователя", "subgroup": null, "isOverview": false, "num": "6.3", "title": "Читаем .gitlab-ci.yml", "content": "# 6.3. Читаем .gitlab-ci.yml\n\n## Зачем это нужно\n\nМногие компании (особенно в РФ и Сербии) держат репозитории на self-hosted GitLab, а не на GitHub. Синтаксис файла другой, но идея та же — важно уметь мысленно \"переводить\" между ними.\n\n## Теория\n\nКлючевые поля `.gitlab-ci.yml`:\n\n- **`image:`** — Docker-образ, в котором будут выполняться jobs (аналог `runs-on`, но задаётся образом контейнера, а не именем виртуалки).\n- **`stages:`** — список этапов пайплайна по порядку. Все jobs одного stage могут выполняться параллельно; следующий stage стартует только после завершения предыдущего.\n- **`before_script:`** — команды, которые выполняются перед каждым job'ом (или конкретным job'ом, если указаны внутри него).\n- **`script:`** — основные команды job'а (аналог `run:` в GitHub Actions).\n- **`needs:`** — как и в GitHub Actions, явная зависимость job'а от другого (без неё порядок определяется только stage).\n- **`artifacts:`** — файлы, которые сохраняются после job'а; `when: always` — сохранять даже при падении.\n\n## Пример\n\nРазбор `boilerplate/.gitlab-ci.yml`:\n\n```yaml\nimage: python:3.12-slim\n\nstages:\n  - test-fast\n  - test-ui\n\nbefore_script:\n  - pip install -r requirements.txt\n```\n\nВсе jobs выполняются в контейнере `python:3.12-slim`. Пайплайн состоит из двух последовательных этапов. `before_script` на верхнем уровне — общий для всех jobs, чтобы не дублировать установку зависимостей.\n\n```yaml\nunit-and-api:\n  stage: test-fast\n  script:\n    - pytest -m \"unit or api\" --alluredir=allure-results\n  artifacts:\n    when: always\n    paths:\n      - allure-results\n```\n\nJob `unit-and-api` относится к первому этапу (`test-fast`), запускает быстрые тесты и сохраняет `allure-results` как артефакт независимо от результата (`when: always`).\n\n```yaml\nui:\n  stage: test-ui\n  needs: [\"unit-and-api\"]\n  before_script:\n    - pip install -r requirements.txt\n    - playwright install --with-deps chromium\n  script:\n    - pytest -m ui --alluredir=allure-results\n```\n\nJob `ui` относится ко второму этапу и явно указывает `needs: [\"unit-and-api\"]` — переопределяет `before_script` (добавляя установку браузера), потому что для UI-тестов нужен ещё и Chromium.\n\n## Сравнение с GitHub Actions\n\n| GitHub Actions | GitLab CI | Смысл |\n|---|---|---|\n| `runs-on` | `image` | где выполняется job |\n| `jobs.<name>` | `<name>:` (в корне файла) | описание job'а |\n| `needs:` | `needs:` | явная зависимость между job'ами |\n| `if: always()` на шаге | `when: always` на artifacts | сохранять данные при падении |\n| `uses: actions/upload-artifact` | `artifacts: paths:` | сохранение файлов после job'а |\n\nКак только видна эта таблица соответствий, читать любой из двух форматов становится вопросом привычки, а не нового знания.\n\n## Частые ошибки\n\n- Думать, что `before_script` выполняется один раз на весь пайплайн — на самом деле он выполняется перед КАЖДЫМ job'ом заново (в своём чистом контейнере), поэтому установка зависимостей повторяется.\n- Не заметить переопределение `before_script` внутри job'а `ui` — оно полностью заменяет верхнеуровневый `before_script` для этого job'а, а не дополняет его.\n- Путать `stage:` (единственное число, к какому этапу относится job) и `stages:` (список всех этапов пайплайна).\n\n## Мини-задание\n\nОткрой пайплайн своего PR (или пример из `.gitlab-ci.yml`) и найди: какой job выполнится, если stage `test-fast` упадёт — выполнится ли `ui`, и почему.\n", "hasPractice": true, "quiz": [{"question": "Если бы before_script job'а 'ui' в .gitlab-ci.yml состоял только из строки playwright install --with-deps chromium (без pip install -r requirements.txt), что произошло бы с зависимостями из requirements.txt для этого job'а?", "options": ["GitLab автоматически допишет их в конец списка команд", "Они всё равно установятся — верхнеуровневый before_script суммируется с job-level", "Пайплайн откажется стартовать из-за ошибки конфигурации", "Они НЕ установятся — before_script job'а полностью заменяет верхнеуровневый, а не дополняет его"], "correct": 3, "explain": "before_script на уровне job'а полностью переопределяет верхнеуровневый — поэтому в реальном ci.yml курса ui-job явно повторяет обе команды: и pip install, и playwright install."}, {"question": "Что задаёт секция `stages:` в начале .gitlab-ci.yml?", "options": ["Список авторов, у которых есть право на мёрж", "Список Docker-образов для каждого job'а", "Список всех этапов пайплайна и порядок их выполнения", "Список тестовых файлов для запуска"], "correct": 2, "explain": "stages: — это именно перечень этапов пайплайна по порядку; jobs внутри одного этапа могут идти параллельно, следующий этап стартует после завершения текущего."}, {"question": "before_script, объявленный на верхнем уровне файла (вне конкретных job), выполняется...", "options": ["Никогда, если у job'а есть свой собственный before_script", "Только перед самым первым job'ом пайплайна", "Перед КАЖДЫМ job'ом заново, в его собственном чистом контейнере", "Один раз перед всем пайплайном целиком"], "correct": 2, "explain": "Каждый job стартует в своём чистом контейнере — поэтому общий before_script повторяется перед каждым из них, а не выполняется единожды."}, {"question": "Согласно таблице сравнения из урока, чему в GitLab CI соответствует `if: always()` на шаге из GitHub Actions?", "options": ["`before_script:`", "`image:` в начале файла", "`when: always` в секции artifacts", "`stage:` у job'а"], "correct": 2, "explain": "Оба механизма решают одну задачу — сохранить данные/артефакты, даже если сам job или тесты упали."}, {"question": "Job 'ui' указывает `needs: [\"unit-and-api\"]`. Какому механизму GitHub Actions это соответствует?", "options": ["Аналогу `runs-on:`", "В GitHub Actions подобного механизма вообще не существует", "Аналогу `uses:`", "Аналогу `needs:` из GitHub Actions — явной зависимости между job'ами"], "correct": 3, "explain": "И в GitHub Actions, и в GitLab CI ключевое слово needs выполняет одну и ту же роль — явно указывает, что job зависит от завершения другого job'а."}]}, {"id": "p89", "section": "Модуль 6 · CI на уровне пользователя", "subgroup": null, "isOverview": false, "num": "6.4", "title": "Диагностика упавшего пайплайна", "content": "# 6.4. Диагностика упавшего пайплайна\n\n## Зачем это нужно\n\nКрасный крестик на PR — самая частая причина, по которой джуниор идёт к более опытному коллеге \"а что это значит\". Цель этого урока — чтобы в 80% случаев ответ находился самостоятельно, за пару минут, по логам.\n\n## Теория\n\nАлгоритм диагностики — один и тот же для GitHub Actions и GitLab CI:\n\n1. **Найти, какой именно job упал.** Если пайплайн состоит из нескольких stages/jobs (как в общем репозитории — сначала `unit-and-api`, потом `ui`), падение одного job'а не означает, что упало всё — смотри конкретно на красный элемент.\n2. **Открыть лог именно упавшего шага**, а не всего job'а целиком. В GitHub Actions шаги разворачиваются по клику, в GitLab CI — лог job'а один сплошной, но упавшая команда обычно выделена и находится в конце.\n3. **Отличить три типа падений:**\n   - **Упал тест** (`assert` не выполнился, exception в тесте) — в логе виден pytest-traceback с именем теста. Это твоя зона ответственности — либо баг в коде, либо баг в тесте.\n   - **Упала установка окружения** (`pip install` не смог поставить пакет, `playwright install` не скачался) — в логе ошибка ДО начала pytest. Часто временная проблема сети/реестра пакетов — можно попробовать перезапустить job.\n   - **Упал сам pipeline-конфиг** (опечатка в YAML, несуществующий job в `needs:`) — тогда тесты вообще не запускаются, ошибка появляется на этапе валидации файла, ещё до логов job'ов.\n4. **Скачать артефакты**, если это не помогло. `allure-results`, которые загружает CI (см. уроки 6.2–6.3), можно скачать и открыть локально через `allure serve` — иногда полный Allure-отчёт нагляднее, чем сырой текстовый лог.\n5. **Перезапустить job вручную**, если причина — временная (сеть, флейковый тест). В GitHub Actions — кнопка \"Re-run jobs\" на странице workflow run. В GitLab CI — кнопка \"Retry\" у конкретного job'а в интерфейсе пайплайна.\n\n## Пример\n\nТипичный сценарий: ты открыл PR с новым API-тестом, job `unit-and-api` красный. Лог показывает:\n\n```\nFAILED tests/api/test_users.py::TestUsers::test_get_user - AssertionError: assert 2 == 1\n```\n\nЭто явно случай 1 — упал тест, а не окружение. Дальше это обычная отладка теста: смотрим, что метод `get_user` вернул `id=2` вместо ожидаемого `id=1` — скорее всего, ошибка в самом тесте (например, скопировали фикстуру и забыли поменять параметр), а не в API.\n\nДругой пример:\n\n```\nERROR: Could not find a version that satisfies the requirement playwright==1.47.0\n```\n\nЭто случай 2 — не установилось окружение, скорее всего временная проблема с реестром пакетов или неверная версия в `requirements.txt`. Здесь сначала стоит попробовать перезапустить job, и только если повторяется — разбираться с версией пакета.\n\n## Частые ошибки\n\n- Смотреть только на итоговый статус (\"Failed\") и не открывать сам лог — почти вся полезная информация внутри развёрнутого шага/job'а.\n- Пытаться чинить локально то, что на самом деле является проблемой самого CI-раннера (например, недоступность внешнего пакетного реестра) — сначала стоит перепроверить: воспроизводится ли падение локально (`pytest -m \"unit or api\"` у себя).\n- Ре-раниться \"на автомате\" при любом падении, не читая лог — если тест действительно падает стабильно (не флейк), повторный запуск просто трижды покажет ту же ошибку и потратит время CI-раннера.\n\n## Мини-задание\n\nСпециально сломай один свой тест (например, поставь заведомо неверный `assert`), запушь ветку/открой PR, дождись падения пайплайна и пройди весь алгоритм: найди упавший job → открой лог упавшего шага → определи тип падения (тест / окружение / конфиг) → откати \"поломку\".\n", "hasPractice": true, "quiz": [{"question": "В логе CI видна ошибка: `ERROR: Could not find a version that satisfies the requirement playwright==1.47.0` — ещё до запуска pytest. К какому из трёх типов падений это относится?", "options": ["Упал сам pipeline-конфиг (ошибка в YAML)", "Это баг в Allure-отчётности", "Упала установка окружения", "Упал тест"], "correct": 2, "explain": "Ошибка возникает на этапе pip install, до всякого запуска тестов — значит, дело не в коде и не в тестах, а в установке зависимостей."}, {"question": "В логе: `FAILED tests/api/test_users.py::test_get_user - AssertionError: assert 2 == 1`. К какому типу падения это относится?", "options": ["Упал тест", "Это ошибка сетевого подключения к Allure", "Упал сам pipeline-конфиг", "Упала установка окружения"], "correct": 0, "explain": "Это классический pytest-traceback с конкретным именем упавшего теста и AssertionError — типичный признак падения именно теста, а не инфраструктуры."}, {"question": "Что нужно сделать В ПЕРВУЮ очередь при красном пайплайне, согласно алгоритму из урока?", "options": ["Сразу нажать Retry, не читая лог", "Удалить ветку и начать заново", "Написать куратору, не разбираясь самостоятельно", "Найти, какой именно job упал, и открыть лог именно упавшего шага"], "correct": 3, "explain": "Почти вся полезная информация находится в развёрнутом логе конкретного упавшего шага — начинать разбор нужно именно с него."}, {"question": "Когда имеет смысл просто перезапустить (retry) job без изменения кода?", "options": ["Когда тест падает стабильно и воспроизводимо — значит, в коде есть баг", "Retry запрещён правилами курса в принципе", "Всегда — retry универсально решает любую проблему CI", "Когда причина, похоже, временная — например, сетевая проблема при установке пакета"], "correct": 3, "explain": "Повторный запуск помогает при разовых, временных сбоях инфраструктуры; для стабильно падающего теста retry просто трижды покажет ту же ошибку и потратит время раннера."}, {"question": "Зачем смотреть allure-results, если текстового лога CI уже недостаточно для диагностики?", "options": ["Текстовый лог CI никогда не содержит полезной информации", "Allure-отчёт даёт более наглядную раскладку по шагам и, для UI, скриншот на момент падения", "allure-results — единственный способ вообще узнать, что тест упал", "allure-results нужен только для UI-тестов, для API он бесполезен"], "correct": 1, "explain": "Полный Allure-отчёт с шагами и вложениями часто нагляднее сырого текстового лога, особенно для UI-тестов со скриншотом на падении."}]}, {"id": "p90", "section": "Модуль 6 · CI на уровне пользователя", "subgroup": null, "isOverview": false, "num": null, "title": "Домашнее задание модуля 6", "content": "# Домашнее задание модуля 6\n\n## Что нужно сделать\n\n1. Открой любой свой предыдущий PR в общем репозитории (или создай новый с любым мелким изменением) и найди в интерфейсе GitHub/GitLab запущенный по нему pipeline.\n2. Опиши текстом (в комментарии к PR или в отдельном файле `ci_report.md` в своей ветке):\n   - сколько jobs/stages в пайплайне и в каком порядке они выполняются;\n   - сколько времени занял прогон каждого job'а;\n   - если что-то падало — какого рода было падение (тест / окружение / конфиг) и как ты это определил.\n3. Специально сломай один тест, дождись красного пайплайна, пройди алгоритм диагностики из урока 6.4, зафиксируй в том же отчёте: какой job упал, что было в логе, как ты бы это чинил. После — верни тест в рабочее состояние отдельным коммитом.\n\n## Критерии \"готово\"\n\n- Отчёт показывает, что ты реально открывал логи конкретных jobs, а не только смотрел на итоговый статус.\n- Правильно определён тип падения (тест / окружение / конфиг) для намеренно сломанного теста.\n- Финальный коммит в ветке — с зелёным пайплайном.\n\n## Что не нужно делать\n\n- Не нужно писать новый pipeline с нуля или менять структуру существующих `.yml`-файлов — модуль про чтение и диагностику, не про авторство CI.\n", "hasPractice": false}, {"id": "p91", "section": "Модуль 7 · Финальный спринт", "subgroup": null, "isOverview": true, "num": null, "title": "Модуль 7. Финальный спринт — \"работа над тикетами\" (недели 13–14)", "content": "# Модуль 7. Финальный спринт — \"работа над тикетами\" (недели 13–14)\n\nЭто не учебные задания в привычном смысле. С этого момента студенты работают с \"боевыми\" тикетами в общем репозитории: багфиксы чужих тестов, ревью PR друг друга, рефакторинг мелких кусков кода. Это имитация первого месяца на реальной работе — с тикет-трекером, чужим кодом и дедлайнами, а не с чистого листа.\n\n## Уроки\n\n1. [Как устроен финальный спринт](#p92) — правила, роли, откуда берутся тикеты\n2. [Багфиксы чужих тестов](#p93)\n3. [Ревью PR друг друга](#p94)\n4. [Рефакторинг без поломок](#p95)\n5. [Итоговые критерии](#p96)\n\n## Итог модуля\n\nУ каждого студента в GitHub — история из 10+ PR с ревью, а не один финальный дамп кода в конце курса.\n", "hasPractice": false}, {"id": "p92", "section": "Модуль 7 · Финальный спринт", "subgroup": null, "isOverview": false, "num": "7.1", "title": "Как устроен финальный спринт", "content": "# 7.1. Как устроен финальный спринт\n\n## Зачем это нужно\n\nНа реальной работе никто не выдаёт джуниору чистый лист \"напиши тест с нуля\" каждую неделю. Реальность — это тикет-трекер с чужими задачами: где-то тест стал нестабильным (флейкует), где-то нужно добавить проверку к уже существующему сценарию, где-то коллега попросил посмотреть его PR. Последние две недели курса имитируют именно это.\n\n## Теория\n\nК началу модуля 7 в общем репозитории уже накопилось: API-клиенты и тесты от модуля 3, Page Object'ы и UI-тесты от модуля 4, allure-разметка от модуля 5 — от **всех** студентов потока. Это уже не игрушечный проект одного человека, а полноценная кодовая база с чужим стилем, чужими решениями и, неизбежно, чужими недочётами.\n\nФормат работы:\n\n- Тикеты формулируются как в обычном таск-трекере: короткое название, описание проблемы или желаемого результата, критерии готовности. Тикет не объясняет, как чинить — только что не так или что нужно.\n- Тикеты не привязаны к тому, кто писал исходный код — багфиксить чужой тест обычной практикой является и на реальной работе.\n- Каждый тикет закрывается отдельным PR (маленьким, по правилам модуля 2) — не накапливаем изменения на неделю в одной ветке.\n- Ревью обязательно от другого студента, не от автора кода, который чинится.\n\n## Пример типов тикетов, которые встретятся в модуле 7\n\n- \"Тест `test_get_user` иногда падает на CI, но проходит локально\" — флейковый тест, нужно разобраться в причине (обычно — гонка состояний или недостаточное ожидание в UI-тесте) и стабилизировать.\n- \"В `UsersClient` не хватает метода для обновления пользователя\" — расширение существующего клиента по уже знакомому из модуля 3 шаблону.\n- \"Дублируется код между `RegistrationPage` и новым `LoginPage`, стоит вынести общее в `BasePage`\" — рефакторинг (см. урок 7.4).\n- \"Проверь мой PR с новым тестом на негативный сценарий\" — чистое ревью, без своего кода.\n\n## Частые ошибки\n\n- Пытаться переписать чужой код \"как я считаю правильным\", вместо того чтобы решить именно то, что написано в тикете. Не каждый тикет — повод для масштабного рефакторинга.\n- Закрывать несколько тикетов одним PR \"чтобы не плодить ветки\" — это усложняет ревью и откат в случае проблем, нарушает правило модуля 2 (\"одна задача — одна ветка — один PR\").\n- Игнорировать существующий стиль кода в репозитории и вносить изменения \"своим\" стилем — согласованность важнее личных предпочтений в общем проекте.\n\n## Мини-задание\n\nПрежде чем брать первый тикет, изучи содержимое `boilerplate/` целиком (или уже разросшийся репозиторий потока, если он общий) — раздели для себя код на три категории: \"это я понимаю полностью\", \"это я примерно понимаю\", \"это я вижу впервые\". Начни с тикетов из первой категории.\n", "hasPractice": true, "quiz": [{"question": "Почему в финальном спринте один тикет должен закрываться ровно одним отдельным PR, а не несколькими тикетами в одном PR?", "options": ["GitHub технически не позволяет открыть два PR из одной ветки", "Это требование действует только для API-тестов", "Чтобы ревью было проще, а откат в случае проблемы — точечным, без побочных изменений", "Так быстрее писать код — меньше переключений между ветками"], "correct": 2, "explain": "Маленький PR на одну задачу проще ревьюить и, если что-то пошло не так, откатить — без риска задеть несвязанные изменения."}, {"question": "Кто обычно чинит баг в чужом тесте на финальном спринте?", "options": ["Любой студент — багфиксить чужой код является обычной практикой на реальной работе", "Только куратор курса", "Только тот, кто изначально написал этот тест", "Тесты на этом этапе уже не чинят, только пишут новые"], "correct": 0, "explain": "Модуль имитирует реальную работу, где тикеты не привязаны к автору исходного кода — багфиксить чужое приходится каждому."}, {"question": "Тикет гласит: «Тест X иногда падает на CI». Что урок явно НЕ рекомендует делать по этому тикету?", "options": ["Заодно полностью переписать архитектуру Page Object, раз уж открыл файл", "Прогнать тест несколько раз, чтобы попытаться воспроизвести падение", "Стабилизировать именно проблемное место", "Разобраться в причине падения"], "correct": 0, "explain": "Не каждый тикет — повод для масштабного рефакторинга; задача — решить именно то, что написано в тикете."}, {"question": "Зачем перед тем, как брать тикеты, рекомендуется разделить код репозитория на категории «понимаю полностью / примерно / вижу впервые»?", "options": ["Это формальное требование, никак не влияющее на результат", "Чтобы отчитаться куратору о процентах прогресса", "Чтобы решить, какие файлы удалить из репозитория", "Чтобы начать с тикетов, которые точно по силам, а не тонуть сразу в незнакомом коде"], "correct": 3, "explain": "Такая самооценка — практический способ выбрать первый тикет с адекватным риском, а не случайно взять самый незнакомый участок кода."}, {"question": "Что именно имитирует формат работы модуля 7?", "options": ["Первый месяц реальной работы: тикеты, чужой код, ревью", "Соло-проект с нуля, как в модуле 0", "Финальный экзамен с закрытыми книгами без доступа к коду", "Код-ревью в теории, без реального кода"], "correct": 0, "explain": "Именно об этом урок: тикеты в общем репозитории, а не учебные задания с чистого листа — репетиция первого месяца в реальной команде."}]}, {"id": "p93", "section": "Модуль 7 · Финальный спринт", "subgroup": null, "isOverview": false, "num": "7.2", "title": "Багфиксы чужих тестов", "content": "# 7.2. Багфиксы чужих тестов\n\n## Зачем это нужно\n\nЧинить чужой тест сложнее, чем свой: нет контекста \"почему я это так написал\", приходится восстанавливать логику по коду и по allure-отчёту. Это ровно тот навык, который отличает \"прошёл курс\" от \"готов работать в команде\".\n\n## Теория\n\nАлгоритм работы с чужим упавшим/сломанным тестом:\n\n1. **Воспроизведи падение локально.** Не чини \"на глаз\" по одному только описанию тикета — сначала запусти тест сам и увидь то же самое.\n2. **Прочитай allure-отчёт теста** (модуль 5) — шаги и, для UI, скриншот на падении часто сразу показывают, где расходится ожидание с реальностью.\n3. **Определи тип проблемы:**\n   - **Баг в тесте** — тест написан некорректно (неверные ожидания, гонка состояний, копипаста без изменения параметров).\n   - **Баг в тестируемом коде** — тест написан верно, а код (Page Object, API-клиент) действительно ведёт себя не так, как ожидается.\n   - **Флейковость** — тест то падает, то проходит без изменений кода; чаще всего из-за недостаточного ожидания в UI или из-за общего состояния данных в API-тестах.\n4. **Исправь минимально необходимое.** Тикет \"почини тест X\" не означает \"перепиши файл с нуля\".\n5. **Прогони весь набор тестов**, не только починенный — исправление могло задеть соседние тесты, использующие тот же Page Object/клиент.\n\n## Пример: разбор флейкового UI-теста\n\nДопустим, тест из `boilerplate/tests/ui/test_registration.py` изредка падает на CI со скриншотом, где форма ещё не полностью прогрузилась. Частая причина — клик или проверка происходят до того, как элемент на самом деле стал интерактивным. В Playwright это почти всегда лечится не добавлением `time.sleep(...)` (антипаттерн — не решает причину и просто тратит время), а использованием встроенных ожиданий (`expect(...)`), которые уже применяются в `RegistrationPage.check_visible_registration_form()`. Если ожидание уже есть, но проблема сохраняется — стоит проверить, не выполняется ли действие с элементом, для которого явного ожидания видимости ещё не добавили.\n\n## Частые ошибки\n\n- Чинить симптом, а не причину: например, просто ослабить проверку (`assert response.status_code in [200, 404]` вместо разбора, почему код вдруг стал 404).\n- Добавлять `time.sleep()` как \"быстрое решение\" флейковости в UI-тестах — маскирует проблему, но не решает её и замедляет весь набор тестов.\n- Не читать существующие комментарии/docstring в коде перед правкой — иногда странное на первый взгляд решение уже было осознанным компромиссом.\n\n## Мини-задание\n\nВозьми любой существующий тест в общем репозитории и сознательно найди в нём одно потенциальное слабое место (жёстко захардкоженное тестовое значение, отсутствие проверки граничного случая, недостаточно узкий assert) — опиши это как тикет для одногруппника по формату из урока 7.1.\n", "hasPractice": true, "quiz": [{"question": "Тест изредка падает на CI, но всегда проходит локально. Какое решение урок явно называет антипаттерном?", "options": ["Разобраться, какого именно элемента не хватает ожидания", "Прогнать тест несколько раз локально, чтобы попытаться воспроизвести падение", "Заменить недостаточное ожидание на expect() из Playwright", "Добавить time.sleep() перед проблемным действием"], "correct": 3, "explain": "time.sleep() маскирует симптом флейковости, но не устраняет причину, и просто замедляет весь набор тестов — урок прямо называет это антипаттерном."}, {"question": "Какой первый шаг алгоритма работы с чужим сломанным тестом?", "options": ["Закрыть тикет как невоспроизводимый", "Спросить в чате, что имел в виду автор теста", "Сразу переписать тест по-своему", "Воспроизвести падение локально самому, а не полагаться только на описание тикета"], "correct": 3, "explain": "Прежде чем что-либо чинить, нужно самому увидеть то же падение — а не чинить «на глаз» по одному описанию."}, {"question": "Тест написан корректно, но код (например, Page Object), который он проверяет, реально ведёт себя не так, как ожидается. Какой это тип проблемы по классификации урока?", "options": ["Флейковость", "Проблема окружения CI", "Баг в тесте", "Баг в тестируемом коде"], "correct": 3, "explain": "Если тест написан верно и стабильно воспроизводит расхождение — проблема в самом коде, а не в тесте."}, {"question": "Что урок называет частой причиной флейковости именно в UI-тестах?", "options": ["Слишком быстрое интернет-соединение", "Слишком много allure.step внутри теста", "Недостаточное ожидание — действие или проверка происходит раньше, чем элемент реально готов", "Использование pytest вместо unittest"], "correct": 2, "explain": "Гонка состояний из-за недостаточного ожидания — самая частая причина, по которой UI-тест то падает, то проходит без изменений в коде."}, {"question": "Почему после локального исправления бага нужно прогнать ВЕСЬ набор тестов, а не только починенный тест?", "options": ["Исправление могло задеть соседние тесты, использующие тот же Page Object или API-клиент", "Это не нужно, если сам починенный тест уже зелёный", "Только чтобы формально порадовать ревьюера", "Чтобы искусственно увеличить время прогона CI"], "correct": 0, "explain": "Общие компоненты (BasePage, APIClient) используются многими тестами — правка в них может неожиданно повлиять на код, который выглядел несвязанным."}]}, {"id": "p94", "section": "Модуль 7 · Финальный спринт", "subgroup": null, "isOverview": false, "num": "7.3", "title": "Ревью PR друг друга", "content": "# 7.3. Ревью PR друг друга\n\n## Зачем это нужно\n\nВ модуле 2 ты уже открывал PR и получал ревью. Теперь — обратная роль: ты ревьюер. Умение читать чужой diff и задавать правильные вопросы — отдельный навык, который на реальной работе занимает значимую часть времени automation-инженера.\n\n## Теория\n\nЧто проверять в PR с автотестами (чек-лист):\n\n1. **Тест действительно проверяет то, что заявлено в названии/allure.title.** Частая проблема — название говорит одно, а assert проверяет совсем другое или не проверяет вообще ничего осмысленного.\n2. **Тест изолирован** — не зависит от порядка запуска других тестов, не оставляет после себя \"мусор\" (созданного пользователя, файл), который повлияет на следующий прогон.\n3. **Новый код следует существующим паттернам** — новый API-клиент наследуется от `APIClient`, как остальные; новый Page Object наследуется от `BasePage`, как остальные (см. модули 3–4).\n4. **Нет \"мёртвого\" кода** — закомментированные старые версии, неиспользуемые импорты, тестовые `print()` для отладки.\n5. **Allure-разметка на месте** (модуль 5) — title, минимум пара шагов.\n6. **CI зелёный** (модуль 6) — ревью содержательного кода имеет смысл начинать после того, как пайплайн уже прошёл; красный CI — это сначала к автору, а не сразу вопросы по логике.\n\n## Как оставлять комментарии\n\n- Комментарий должен объяснять **почему**, а не просто \"переделай\". \"Тут будет падать, если пользователь не найден — стоит явно проверить 404\" полезнее, чем \"тут плохо\".\n- Разделяй blocking-комментарии (без этого мёржить нельзя — баг, нарушение архитектуры) и nit/предложения (стилистика, вкусовщина, \"можно, но не обязательно\").\n- Не превращай ревью в переписывание чужого решения в комментариях целиком — если правка большая, лучше обсудить голосом/в чате и предложить созвониться, а не вести архитектурный спор в комментариях к строчкам кода.\n\n## Как реагировать на комментарии к своему PR\n\n- Комментарий к коду — не комментарий к тебе как автору. Не нужно защищаться, если в комментарии прямо указана техническая проблема.\n- Если не согласен — аргументируй технически (\"этот тест специально не изолирован, потому что...\"), а не просто отклоняй правку.\n- Отвечай на каждый комментарий явно (fix / already fixed / disagree because..., а не тишина) — это ускоряет повторное ревью.\n\n## Частые ошибки ревьюера\n\n- Аппрувить PR, не запустив тесты и не прочитав diff внимательно, \"потому что автор — надёжный человек\".\n- Придираться только к стилистике (пробелы, порядок импортов), игнорируя логические проблемы — для стилистики в реальных проектах обычно есть линтеры, ревьюер нужен для смысловых вещей.\n- Оставлять расплывчатые комментарии (\"не уверен, что это верно\") без конкретного объяснения, что именно смущает.\n\n## Мини-задание\n\nСделай полноценное ревью одного PR одногруппника по чек-листу выше: минимум 2 конкретных комментария (один — обязательный к исправлению, один — предложение) и явный вердикт (approve / request changes).\n", "hasPractice": true, "quiz": [{"question": "В PR все тесты зелёные, но ревьюер видит, что allure.title теста не соответствует тому, что реально проверяет assert внутри. Это повод для...", "options": ["Автоматического отклонения PR без объяснений", "Только nit-комментария, потому что это стилистика", "Blocking-комментария с объяснением расхождения", "Ничего — раз тесты зелёные, замечание не нужно"], "correct": 2, "explain": "Несоответствие названия теста и того, что он реально проверяет — первый пункт чек-листа ревью: это смысловая проблема, а не стилистика, значит комментарий блокирующий."}, {"question": "Тест не оставляет за собой «мусор» (созданного пользователя, файл), который мог бы повлиять на следующий прогон. Какому пункту чек-листа это соответствует?", "options": ["Соответствие существующим паттернам", "Мёртвый код", "Allure-разметка", "Изоляция теста"], "correct": 3, "explain": "Тест, зависящий от состояния, оставленного другим тестом (или оставляющий его сам), нарушает изоляцию — один из ключевых пунктов ревью."}, {"question": "PR ещё не прошёл CI — пайплайн красный. Что рекомендует урок делать ревьюеру?", "options": ["Заблокировать PR навсегда без объяснений", "Содержательное ревью логики имеет смысл начинать после того, как CI уже зелёный", "Сразу поставить approve, разберутся потом", "Полностью игнорировать статус CI при ревью"], "correct": 1, "explain": "Красный CI — сначала вопрос к автору PR, а не повод сразу тратить время на детальный разбор логики, которая может ещё измениться."}, {"question": "В чём разница между blocking-комментарием и nit-комментарием?", "options": ["nit всегда серьёзнее, чем blocking", "Blocking — без исправления мёржить нельзя (баг/нарушение архитектуры), nit — стилистика или необязательное предложение", "Blocking-комментарии имеет право оставлять только куратор", "Это два названия одного и того же типа комментария"], "correct": 1, "explain": "Разделение помогает автору PR понять, что нужно исправить обязательно, а что — просто на усмотрение."}, {"question": "Как правильно реагировать автору PR на технически обоснованный комментарий ревьюера?", "options": ["Удалить комментарий и смёржить PR как есть", "Закрыть PR и никогда не открывать его снова", "Исправить код или явно аргументировать несогласие технически, ответив на комментарий", "Молча проигнорировать"], "correct": 2, "explain": "Комментарий к коду — не комментарий к автору лично; технический ответ (fix / disagree because...) двигает ревью вперёд быстрее, чем тишина."}]}, {"id": "p95", "section": "Модуль 7 · Финальный спринт", "subgroup": null, "isOverview": false, "num": "7.4", "title": "Рефакторинг без поломок", "content": "# 7.4. Рефакторинг без поломок\n\n## Зачем это нужно\n\nК концу курса в общем репозитории накопилось дублирование: несколько похожих Page Object'ов, несколько похожих API-клиентов, возможно — повторяющиеся фикстуры. Рефакторинг мелких кусков — последний практический навык курса: изменить структуру кода, не сломав ни одного существующего теста.\n\n## Теория\n\nБезопасный рефакторинг подчиняется простому правилу: **до и после рефакторинга набор тестов должен быть зелёным, и сами тесты (если они не являются предметом рефакторинга) не должны меняться.** Если для рефакторинга кода пришлось переписать тесты на него — это уже не совсем рефакторинг, а изменение поведения, и тикет стоит переформулировать.\n\nПрактический алгоритм:\n\n1. **Убедись, что зона рефакторинга покрыта тестами.** Если метод, который собираешься менять, вообще не тестируется — рефакторинг рискованный: некому подтвердить, что поведение не изменилось. В этом случае первый шаг — написать тест на текущее поведение, и только потом рефакторить.\n2. **Меняй маленькими шагами.** Например, вынося общий метод из двух Page Object в `BasePage`: сначала добавь метод в `BasePage`, прогони тесты (ничего не должно сломаться, старый код ещё используется); потом замени использование в одном классе, прогони тесты; потом в другом.\n3. **Не смешивай рефакторинг с добавлением новой функциональности** в одном PR — это разные по духу изменения, и в случае проблемы откатить/понять причину гораздо сложнее, если они перемешаны.\n\n## Пример: вынос общего кода из двух Page Object\n\nДопустим, у `RegistrationPage` и нового `LoginPage` появился одинаковый метод проверки видимости всех полей формы. Вместо дублирования:\n\n```python\n# было — похожий код в двух классах\nclass RegistrationPage(BasePage):\n    def check_visible_registration_form(self) -> None:\n        expect(self.email_input).to_be_visible()\n        expect(self.username_input).to_be_visible()\n        expect(self.password_input).to_be_visible()\n        expect(self.registration_button).to_be_visible()\n```\n\nМожно вынести в `BasePage` общий вспомогательный метод, принимающий список локаторов:\n\n```python\n# стало — общая логика в BasePage\nclass BasePage:\n    ...\n    def check_all_visible(self, *locators) -> None:\n        for locator in locators:\n            expect(locator).to_be_visible()\n\n\nclass RegistrationPage(BasePage):\n    def check_visible_registration_form(self) -> None:\n        self.check_all_visible(\n            self.email_input,\n            self.username_input,\n            self.password_input,\n            self.registration_button,\n        )\n```\n\nКлючевой момент: после такого изменения `test_successful_registration` из `boilerplate/tests/ui/test_registration.py` не меняется вообще — он по-прежнему вызывает `registration_page.check_visible_registration_form()` и ожидает того же поведения. Именно так выглядит \"безопасный\" рефакторинг: тест не заметил изменения реализации.\n\n## Частые ошибки\n\n- Рефакторить сразу всё, что \"не нравится\", вместо конкретного тикета — рефакторинг без чёткой границы легко превращается в незаконченный PR на тысячу строк.\n- Не прогонять полный набор тестов после рефакторинга, ограничиваясь только тестами \"по смыслу\" затронутого модуля — используемые повсеместно базовые классы (`BasePage`, `APIClient`) могут повлиять на тесты, которые визуально с рефакторингом не связаны.\n- Переименовывать публичные методы/классы, которые используются в тестах других студентов, без согласования — в общем репозитории это ломает чужой код, а не только свой.\n\n## Мини-задание\n\nНайди в общем репозитории (или предположи по структуре boilerplate) один кандидат на рефакторинг — повторяющийся кусок кода в двух похожих местах — и опиши план: что именно выносится, куда, и какие тесты должны остаться зелёными после изменения, не меняя своего текста.\n", "hasPractice": true, "quiz": [{"question": "Какой признак того, что рефакторинг Page Object выполнен безопасно, согласно уроку?", "options": ["Ревьюер не заметил изменений в дифе PR", "Количество строк кода в файле сократилось минимум вдвое", "Тесты, использующие этот Page Object, пришлось переписать под новую реализацию", "Тесты, использующие этот Page Object, остались без изменений и всё ещё проходят"], "correct": 3, "explain": "Безопасный рефакторинг меняет реализацию, но не поведение — существующие тесты не должны меняться и должны оставаться зелёными до и после."}, {"question": "Метод, который собираешься рефакторить, вообще не покрыт тестами. Что урок рекомендует сделать СНАЧАЛА?", "options": ["Полностью удалить этот метод", "Сначала написать тест на текущее поведение, и только потом рефакторить", "Просто рефакторить — тесты не так уж и важны", "Попросить куратора написать тест вместо себя"], "correct": 1, "explain": "Если некому подтвердить, что поведение не изменилось, рефакторинг рискованный — сначала стоит зафиксировать текущее поведение тестом."}, {"question": "Почему не рекомендуется смешивать рефакторинг с добавлением новой функциональности в одном PR?", "options": ["GitHub ограничивает максимальный размер PR", "Технически Git не позволяет это сделать", "Это ускоряет процесс ревью", "Если что-то ломается, сложнее понять причину и откатить, когда изменения перемешаны"], "correct": 3, "explain": "Рефакторинг и новая функциональность — изменения разного духа; смешивание их в одном PR затрудняет и ревью, и откат при проблеме."}, {"question": "В примере с вынесением check_all_visible в BasePage — что произошло с тестом test_successful_registration после рефакторинга RegistrationPage?", "options": ["Тест пришлось переписать под новую сигнатуру метода", "Тест был удалён как устаревший", "Тест не изменился вообще — он по-прежнему вызывает check_visible_registration_form() и не подозревает о рефакторинге внутри", "Тест стал падать и его временно отключили"], "correct": 2, "explain": "Именно так выглядит «безопасный» рефакторинг: тест не заметил изменения внутренней реализации метода."}, {"question": "Почему после рефакторинга базового класса (например BasePage) стоит прогонять ПОЛНЫЙ набор тестов, а не только тесты «по смыслу» затронутого модуля?", "options": ["Это не нужно — тесты вне модуля точно не пострадают", "Только для галочки в отчёте о проделанной работе", "Базовые классы используются повсеместно, и рефакторинг может неожиданно задеть тесты, на первый взгляд не связанные с изменением", "Чтобы искусственно занять больше времени CI"], "correct": 2, "explain": "Изменение в общем базовом классе может повлиять на любой тест, который через наследование использует его функциональность — даже если это не очевидно из диффа."}]}, {"id": "p96", "section": "Модуль 7 · Финальный спринт", "subgroup": null, "isOverview": false, "num": null, "title": "Итоговые критерии курса", "content": "# Итоговые критерии курса\n\n## Что должно быть в GitHub/GitLab у каждого студента к концу недели 14\n\n- **10+ смёрженных PR** в общий репозиторий за весь курс (не только за модуль 7) — багфиксы, новые тесты, ревью, рефакторинг.\n- **Минимум 3 PR за модуль 7**, закрывающих тикеты из разных категорий: минимум один багфикс чужого теста, минимум одно проведённое ревью с содержательными комментариями, минимум один рефакторинг без изменения поведения тестов.\n- Все тесты студента в общем репозитории — с allure-разметкой (модуль 5) и зелёным CI (модуль 6).\n- Нет ни одного открытого PR \"зависшего\" без ревью или ответа на комментарии дольше нескольких дней — умение доводить задачу до мёржа не менее важно, чем умение её начать.\n\n## Что это даёт на собеседовании\n\nИстория из реальных PR (не один финальный \"дамп\" кода в конце курса) — это готовый материал для разговора на собеседовании: \"расскажи о PR, где ты нашёл баг в чужом тесте\" или \"расскажи о ревью, где не согласился с автором\" — конкретные истории всегда убедительнее общих фраз \"я изучил pytest и Playwright\".\n\n## Дальше — джобсерч-трек\n\nПараллельно с модулем 6 уже должен был начаться джобсерч-трек (см. `jobsearch_track/`) — к этому моменту у тебя уже должно быть готово резюме и понимание, куда откликаться. Модуль 7 даёт финальный материал для раздела \"опыт\" в резюме и для портфолио-ссылки на GitHub.\n", "hasPractice": false}, {"id": "p97", "section": "Job-search", "subgroup": null, "isOverview": true, "num": null, "title": "Job-search трек", "content": "# Job-search трек\n\nПараллельный трек, стартует с модуля 6 (не блокирует техническую часть курса) — за исключением трека для Сербии, который стартует раньше (с модуля 3), потому что языковой барьер требует больше времени на разгон.\n\nМатериал написан заново — в исходных курсах раздел про резюме/собеседования (`stepik-api-testing-advanced`, глава 15) оказался пустой заглушкой (см. `ROADMAP.md`).\n\n- [`ru/`](ru/) — резюме, hh.ru/Habr Career, разбор вакансий junior QA automation в РФ.\n- [`rs/`](rs/) — резюме на английском, LinkedIn, технический английский — для студентов, ориентированных на рынок Сербии/международный рынок.\n\n## Почему треки разные\n\nТребования к junior QA automation в РФ и на международном/сербском рынке отличаются не по сути навыков (стек тот же — Python, pytest, Playwright, API), а по формату подачи: язык резюме, платформы поиска, ожидания от технического интервью на английском. Разделение треков — не про разный уровень, а про разную \"упаковку\" одних и тех же навыков.\n", "hasPractice": false}, {"id": "p98", "section": "Job-search", "subgroup": "RU", "isOverview": false, "num": null, "title": "RU. Резюме junior QA automation engineer", "content": "# RU. Резюме junior QA automation engineer\n\n## Зачем это нужно\n\nРезюме — это фильтр до собеседования. У рекрутера обычно 20-30 секунд на первый просмотр; резюме без конкретики про автоматизацию (\"занимался тестированием\", \"изучал Python\") отсеивается раньше, чем кто-то дочитает до опыта.\n\n## Структура резюме под этот курс\n\n1. **Заголовок и позиция.** \"QA Automation Engineer (Junior)\" — конкретно, не \"тестировщик\" общим словом, если цель именно автоматизация.\n2. **Стек технологий.** Список без воды: Python, pytest, requests, Pydantic, Playwright, Allure, Git, базовое понимание CI (GitHub Actions/GitLab CI). Пиши только то, чем реально пользовался в курсе — на собеседовании про каждый пункт могут спросить.\n3. **Проект/опыт.** Вместо \"проходил курс по автоматизации тестирования\" — конкретно: \"Разработал и поддерживал автотесты (API + UI) в командном репозитории на Python/pytest/Playwright, участвовал в code review, настраивал allure-отчётность\". Это честное описание того, что реально происходило в модулях 2-7.\n4. **Ссылка на GitHub.** Обязательно — ссылка на общий репозиторий курса (или свой форк) с историей PR. Это ЕДИНСТВЕННОЕ, что реально доказывает навыки джуниору без коммерческого опыта — работодатель может открыть и увидеть реальный код, реальные PR, реальные ревью.\n5. **Образование/курсы.** Кратко, в конце. Название курса, продолжительность — не расписывай подробно программу, это не главное.\n\n## Частые ошибки\n\n- Резюме на 2-3 страницы для позиции junior — эйчар не читает длинные резюме от кандидатов без опыта, максимум одна страница.\n- Перечисление технологий, которых не было в реальной практике курса (\"Selenium, TestNG, Java\") \"для солидности\" — на собеседовании это быстро вскрывается и работает против кандидата.\n- Отсутствие ссылки на GitHub — для automation-инженера без коммерческого опыта это самый весомый аргумент, отсутствие ссылки выглядит как нежелание показать код.\n- Общие фразы без цифр/фактов: \"ответственный, обучаемый, коммуникабельный\" — для технической позиции это не то, что решает.\n\n## Мини-задание\n\nНапиши раздел \"Опыт/проект\" своего резюме, опираясь на реальные PR из общего репозитория курса — минимум 3 конкретных пункта (например: \"Реализовал API-клиент для работы с /users, покрыл 5 тестами позитивные и негативные сценарии\", \"Настроил автоматическое приложение скриншотов в Allure при падении UI-тестов\").\n", "hasPractice": true}, {"id": "p99", "section": "Job-search", "subgroup": "RU", "isOverview": false, "num": null, "title": "RU. Где искать вакансии", "content": "# RU. Где искать вакансии\n\n## Зачем это нужно\n\nJunior automation-позиции на массовых площадках теряются среди сотен вакансий \"тестировщик без опыта\" — часто ручного тестирования. Нужно знать, где искать именно автоматизацию и как фильтровать поток вакансий.\n\n## Площадки\n\n- **hh.ru** — основная площадка в РФ. Фильтр по ключевым словам \"QA automation\", \"автотестер\", \"SDET\" даёт более релевантную выдачу, чем просто \"тестировщик\". Стоит настроить сохранённый поиск с уведомлениями.\n- **Habr Career** — более техническая аудитория, чаще встречаются вакансии, где явно указан стек (pytest/Playwright/Selenium) — проще заранее понять, подходит ли вакансия под навыки курса.\n- **Телеграм-каналы с вакансиями QA** — быстрее обновляются, чем агрегаторы, но требуют больше ручного отбора.\n- **Прямые карьерные страницы компаний**, в которых интересно работать — часто вакансии джуниоров туда даже не доходят до агрегаторов.\n\n## Как читать вакансию \"junior QA automation\"\n\nПризнаки, что вакансия реально про автоматизацию (а не ручное тестирование с формальной припиской \"плюсом будет\"):\n\n- В требованиях явно указан язык программирования (Python/Java/JS) и фреймворк тестирования.\n- Есть упоминание CI/CD, Git, code review — значит, ожидают работу в команде с существующим репозиторием, а не соло-написание с нуля.\n- \"Плюсом будет\" про автоматизацию, а обязательный стек — только ручное тестирование, это, скорее всего, позиция ручного тестировщика с перспективой роста в автоматизацию, а не готовая automation-роль.\n\n## Частые ошибки\n\n- Откликаться только на вакансии, где написано \"требуется опыт от 1 года\" и пропускать те, где не указан опыт вообще — многие компании не пишут \"junior\" явно, а просто не указывают требование к опыту.\n- Не адаптировать отклик под конкретную вакансию — сопроводительное письмо в 2-3 предложения о том, почему стек вакансии совпадает с пройденным курсом, повышает шанс на ответ.\n- Останавливаться после первых 5-10 неответов — воронка junior-позиций длинная, отклик без ответа за 1-2 недели — норма, а не сигнал \"я не гожусь\".\n\n## Мини-задание\n\nНайди 5 реальных вакансий \"junior QA automation\" на hh.ru или Habr Career, для каждой отметь: какой стек требуется, совпадает ли он с пройденным курсом, и что из требований у тебя уже закрыто, а что — нет.\n", "hasPractice": true}, {"id": "p100", "section": "Job-search", "subgroup": "RU", "isOverview": false, "num": null, "title": "RU. Подготовка к техническому собеседованию", "content": "# RU. Подготовка к техническому собеседованию\n\n## Зачем это нужно\n\nТехническое интервью на позицию junior automation почти всегда строится вокруг тем, которые уже закрыты этим курсом — вопрос в том, чтобы уметь их объяснить вслух, а не только применять в коде.\n\n## Типичная структура интервью на junior automation\n\n1. **Общие вопросы про опыт** — тут и пригодится история PR из модуля 7 и конкретные формулировки из резюме (урок 01).\n2. **Вопросы про Python** — базовый синтаксис, различие изменяемых/неизменяемых типов, что такое `*args`/`**kwargs`, ООП (модуль 0).\n3. **Вопросы про pytest** — фикстуры и их scope, параметризация, маркеры, чем conftest.py отличается от обычного файла с тестами (модуль 1).\n4. **Вопросы про Git** — разница merge/rebase, что такое конфликт и как его решать, зачем нужны маленькие PR (модуль 2).\n5. **Вопросы про API-тестирование** — разница PUT/PATCH, что проверяют кроме статус-кода, зачем нужна schema validation (модуль 3).\n6. **Вопросы про UI-автоматизацию** — зачем нужен Page Object, разница explicit/implicit wait, как бороться с флейковыми тестами (модуль 4, модуль 7).\n7. **Практическое задание** — часто просят написать небольшой тест или Page Object на месте/дома. Именно поэтому важно реально понимать код в общем репозитории, а не просто скопировать готовое решение с прошлого PR.\n\n## Как готовиться\n\n- Пройдись по каждому модулю курса и сформулируй вслух (можно самому себе, можно с одногруппником) ответ на вопрос \"объясни, что это и зачем\" — не \"покажи код\", а именно объясни словами.\n- Пересмотри свои же PR из модуля 7 — вспомни, какие решения принимал и почему, это частый вопрос на интервью (\"расскажи о задаче, где пришлось разбираться в чужом коде\").\n- Подготовь 2-3 своих вопроса к интервьюеру про процесс тестирования в компании (как устроен CI, кто пишет тест-план, как часто ревьюят PR) — это работает и как демонстрация вовлечённости, и как реальный способ понять, подходит ли тебе команда.\n\n## Частые ошибки\n\n- Зазубривать формулировки без понимания — на уточняющий вопрос \"а почему именно так\" заученный ответ разваливается.\n- Отвечать только теоретически, не имея возможности показать реальный код (отсюда — важность ссылки на GitHub из урока 01).\n- Не признавать честно \"не знаю, но вот как бы я стал разбираться\" — на junior-позиции интервьюер не ждёт, что кандидат знает всё, но ждёт адекватной реакции на пробел в знаниях.\n\n## Мини-задание\n\nПроведи с одногруппником взаимное мини-интервью по списку тем выше (15-20 минут в каждую сторону) — попроси честную обратную связь, где ответ звучал неуверенно.\n", "hasPractice": true}, {"id": "p101", "section": "Job-search", "subgroup": "RS", "isOverview": false, "num": null, "title": "RS. CV на английском", "content": "# RS. CV на английском\n\n## Зачем это нужно\n\nНа сербском и международном рынке резюме на русском не рассматривается почти нигде за пределами русскоязычных компаний. CV на английском — не перевод русского резюме дословно, а отдельный документ со своими принятыми форматами.\n\n## Структура CV (принятый международный формат отличается от привычного российского резюме)\n\n1. **Header.** Имя, роль (\"QA Automation Engineer\"), контакты, ссылка на LinkedIn и GitHub — без фото (в отличие от принятого в РФ формата, на международном рынке фото в CV обычно не ожидается и иногда даже избегается из-за политики non-discrimination).\n2. **Summary (2-3 строки).** Кратко: кто ты, какой стек, что ищешь. Пример: \"Junior QA Automation Engineer with hands-on experience in Python, pytest, Playwright and API testing (requests, Pydantic). Comfortable working in a team repository with Git/PR workflow and CI pipelines.\"\n3. **Skills.** Списком, по категориям: Languages (Python), Testing (pytest, Playwright, API testing, Allure), Tools (Git, GitHub Actions/GitLab CI), Soft skills — по минимуму, международные CV меньше внимания уделяют soft skills в резюме джуниора, больше — на самом интервью.\n4. **Experience/Projects.** Так же, как в русскоязычном треке (см. `ru/01_Резюме.md`) — конкретные формулировки на основе реальных PR, но на английском. Использовать action verbs (Implemented, Built, Configured, Reviewed), избегать пассивного залога.\n5. **Education.** Кратко, в конце.\n\n## Частые ошибки при переводе резюме на английский\n\n- Дословный перевод русских формулировок (\"занимался написанием автотестов\") вместо естественных английских (\"wrote and maintained automated tests\") — резюме, переведённое машинально, заметно рекрутеру.\n- Использование российского формата с фото и датой рождения — на международном рынке это не ожидается и иногда выглядит нестандартно.\n- Не указывать уровень английского явно, если он не C1+ — честная оценка (B1/B2) с указанием того, что достаточно для рабочей переписки и код-ревью, воспринимается лучше, чем невыполненное молчаливое \"по умолчанию свободно\".\n\n## Мини-задание\n\nПереведи свой раздел \"Опыт\" из русскоязычного резюме (`ru/01_Резюме.md`, мини-задание) на английский, используя action verbs, и попроси одногруппника с более уверенным английским проверить формулировки.\n", "hasPractice": true}, {"id": "p102", "section": "Job-search", "subgroup": "RS", "isOverview": false, "num": null, "title": "RS. Где искать и LinkedIn", "content": "# RS. Где искать и LinkedIn\n\n## Зачем это нужно\n\nМеждународный поиск работы устроен иначе, чем в РФ: меньше централизованных агрегаторов вакансий, больше — прямых откликов через LinkedIn и нетворкинг. Профиль LinkedIn для junior automation-инженера — фактически второе резюме, которое видят чаще, чем сам файл CV.\n\n## LinkedIn как основной инструмент\n\n- **Заголовок профиля** — не просто \"Student\" или \"Looking for opportunities\", а конкретно: \"Junior QA Automation Engineer | Python, pytest, Playwright\".\n- **About-секция** — по сути то же summary, что и в CV (см. `01_CV_на_английском.md`), чуть более развёрнуто.\n- **Featured/Projects** — прямая ссылка на GitHub с общим репозиторием курса. Это основной актив junior-профиля без коммерческого опыта.\n- **Активность** — комментарии/репосты по теме QA automation, подключение к людям из индустрии (рекрутерам, automation-инженерам) увеличивают охват профиля, даже если не откликаться на вакансии напрямую.\n\n## Где искать вакансии\n\n- **LinkedIn Jobs** — фильтр по \"QA Automation\", \"SDET\", \"Test Automation Engineer\", уровень \"Entry level\"/\"Internship\" при отсутствии опыта.\n- **Локальные площадки Сербии** (например, HelloWorld.rs, Poslovi.infostud.com) — часто там публикуются вакансии локальных и региональных IT-компаний, которые не всегда доходят до LinkedIn.\n- **Компании с удалённым international-hiring** — многие продуктовые компании нанимают QA automation удалённо без привязки к стране, стоит искать напрямую на карьерных страницах.\n\n## Частые ошибки\n\n- Полностью пустой или заполненный \"для галочки\" профиль LinkedIn — для международного рынка это часто первое, что смотрит рекрутер, ещё до CV.\n- Массовая рассылка одного и того же сообщения в LinkedIn без персонализации — сообщения с конкретной причиной, почему интересна именно эта компания/позиция, получают ответ значительно чаще.\n- Ждать входящих предложений вместо активного отклика — на junior-уровне рынок соискателя, а не наоборот, нужна инициатива.\n\n## Мини-задание\n\nЗаполни/обнови профиль LinkedIn по структуре выше (заголовок, About, Featured со ссылкой на GitHub) и найди 5 вакансий junior QA automation на LinkedIn Jobs или локальных площадках, подходящих под пройденный стек.\n", "hasPractice": true}, {"id": "p103", "section": "Job-search", "subgroup": "RS", "isOverview": false, "num": null, "title": "RS. Английский для технического собеседования", "content": "# RS. Английский для технического собеседования\n\n## Зачем это нужно\n\nТехнические термины (fixture, assert, locator, pipeline) большинство студентов уже используют по-английски (см. `STYLE_GUIDE.md` всего курса) — но объяснить свой код и опыт связной английской речью на интервью значительно сложнее, чем понимать документацию.\n\n## На чём фокусироваться\n\nТехнический английский для собеседования — это не грамматика уровня экзамена, а свободное владение конкретным ограниченным набором конструкций:\n\n1. **Объяснение решения задним числом.** \"I implemented a `UsersClient` that inherits from a base `APIClient`, because it lets us reuse the same GET/POST/PATCH/DELETE logic across all API clients.\" — конструкция \"I did X, because Y\" покрывает большую часть ответов на технические вопросы.\n2. **Описание проблемы и её решения.** \"The test was flaky because the assertion ran before the page finished loading, so I replaced it with an explicit `expect()` wait.\" — эта же конструкция из модуля 7 (багфиксы), но на английском.\n3. **Уточняющие вопросы.** \"Could you clarify what environment this would run in?\", \"Do you mean the request body or the response?\" — уметь переспрашивать важнее, чем бояться показаться не понявшим с первого раза.\n4. **Мышление вслух.** На многих live-coding интервью ожидают, что кандидат объясняет ход мыслей в процессе, а не молча пишет код и объясняет в конце. Фразы вроде \"Let me think about edge cases here\" помогают держать разговор, пока формулируется решение.\n\n## Как готовиться, используя материал курса\n\n- Пройдись по своим PR из модуля 7 и опиши на английском вслух (или письменно) каждый: что за проблема, как её нашёл, как исправил — это прямая тренировка структуры \"I did X because Y\".\n- Прогони mock-интервью с одногруппником полностью на английском по чек-листу тем из `ru/03_Подготовка_к_собеседованию.md` (темы те же, язык другой).\n- Запиши себя на видео/аудио, отвечая на 2-3 типовых вопроса — часто ошибки слышны самому при пересмотре лучше, чем в моменте разговора.\n\n## Частые ошибки\n\n- Учить фразы, не связанные с реальным опытом — заученный ответ \"расскажи о своём проекте\" звучит неестественно без конкретики из собственных PR.\n- Молчать при незнакомом слове/термине вместо того, чтобы переспросить — на реальном собеседовании переспросить нормально, тишина работает против кандидата сильнее.\n- Готовиться только к вопросам \"расскажи о себе\", игнорируя техническую лексику по конкретным темам курса (pytest, Git, API, Playwright) — именно там будут специфичные термины, которые не всплывают в бытовом английском.\n\n## Мини-задание\n\nЗапиши голосовую заметку (2-3 минуты) с ответом на вопрос \"Tell me about a bug you found and fixed in a teammate's test\" на английском, опираясь на реальный PR из модуля 7. Прослушай сам и отметь, какие фразы дались тяжелее всего.\n", "hasPractice": true}]</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script>
"use strict";

var PAGES = JSON.parse(document.getElementById('course-data').textContent);

// ---------- маленький fetch-клиент к своему /api (Vercel Functions + Neon) ----------
function api(path, opts){
  opts = opts || {};
  return fetch('/api' + path, {
    method: opts.method || 'GET',
    credentials: 'same-origin',
    headers: opts.body ? {'Content-Type':'application/json'} : undefined,
    body: opts.body ? JSON.stringify(opts.body) : undefined
  }).then(function(r){
    if(r.status === 204) return {ok:true};
    return r.json().then(function(data){
      if(!r.ok){ var e = new Error(data.error || ('HTTP ' + r.status)); e.status = r.status; throw e; }
      return data;
    });
  });
}

function initReader(AUTH){
  (function(){
  var byId = {};
  PAGES.forEach(function(p){ byId[p.id] = p; });

  marked.setOptions({
    gfm:true,
    breaks:false,
    highlight:function(code, lang){
      try{
        if(lang && hljs.getLanguage(lang)){
          return hljs.highlight(code, {language:lang}).value;
        }
        return hljs.highlightAuto(code).value;
      }catch(e){ return code; }
    }
  });

  // ---------- progress storage (свой /api + Neon, через AUTH из bootstrap) ----------
  var progress = AUTH.progress;

  function isDone(id){ return !!progress[id]; }
  function setDone(id, val){
    if(val) progress[id] = true; else delete progress[id];
    AUTH.persistDone(id, val);
    renderProgress();
    refreshLocks();
    var row = navEl.querySelector('[data-id="'+id+'"]');
    if(row) row.classList.toggle('done', isDone(id));
  }
  function toggleDone(id){ setDone(id, !isDone(id)); }

  // ---------- build grouped structure ----------
  var groups = []; // { section, entries:[ {subgroup, items:[page,...]} ], flatIds:[...] }
  PAGES.forEach(function(p){
    var g = groups[groups.length-1];
    if(!g || g.section !== p.section){
      g = { section:p.section, entries:[] };
      groups.push(g);
    }
    var e = g.entries[g.entries.length-1];
    if(!e || e.subgroup !== p.subgroup){
      e = { subgroup:p.subgroup, items:[] };
      g.entries.push(e);
    }
    e.items.push(p);
  });
  groups.forEach(function(g){
    g.flatIds = g.entries.flatMap(function(e){ return e.items.map(function(p){ return p.id; }); });
  });

  // id -> { list, index } within its own section, for sequential-lock checks
  var lockIndex = {};
  groups.forEach(function(g){
    g.flatIds.forEach(function(id, i){ lockIndex[id] = { list:g.flatIds, index:i }; });
  });
  function isLocked(id){
    if(isDone(id)) return false; // once done, stays reachable even if an earlier lesson gets retaken
    var pos = lockIndex[id];
    if(!pos || pos.index === 0) return false;
    var prevId = pos.list[pos.index-1];
    return !isDone(prevId);
  }
  function lockRequirement(id){
    // the immediately preceding lesson in the same section that must be done first
    var pos = lockIndex[id];
    if(!pos || pos.index === 0) return null;
    return byId[pos.list[pos.index-1]];
  }
  function refreshLocks(){
    navEl.querySelectorAll('.nav-item').forEach(function(item){
      var locked = isLocked(item.dataset.id);
      item.classList.toggle('locked', locked);
      var statusEl = item.querySelector('.status, .lock-icon');
      if(statusEl){
        if(locked && statusEl.classList.contains('status')){
          var lock = document.createElement('span');
          lock.className = 'lock-icon';
          lock.innerHTML = LOCK_SVG;
          statusEl.replaceWith(lock);
        } else if(!locked && statusEl.classList.contains('lock-icon')){
          var dot = document.createElement('span');
          dot.className = 'status';
          statusEl.replaceWith(dot);
        }
      }
    });
  }
  var LOCK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="9" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>';

  var navEl = document.getElementById('nav');
  var totalCount = PAGES.length;
  document.getElementById('progress-total').textContent = totalCount;

  function countDoneIn(list){
    var n=0; list.forEach(function(p){ if(isDone(p.id)) n++; }); return n;
  }

  groups.forEach(function(g, gi){
    var details = document.createElement('details');
    details.className = 'nav-section';
    if(gi === 0) details.open = true;

    var allIds = [];
    g.entries.forEach(function(e){ e.items.forEach(function(p){ allIds.push(p.id); }); });

    var summary = document.createElement('summary');
    summary.innerHTML =
      '<span><span class="chev">▸</span> ' + escapeHtml(g.section) + '</span>' +
      '<span class="count mono" data-count-for="'+gi+'">'+countDoneIn(g.entries.flatMap(function(e){return e.items;}))+'/'+allIds.length+'</span>';
    details.appendChild(summary);

    var body = document.createElement('div');
    body.className = 'nav-body';

    g.entries.forEach(function(e){
      if(e.subgroup){
        var lbl = document.createElement('div');
        lbl.className = 'nav-subgroup-label';
        lbl.textContent = e.subgroup;
        body.appendChild(lbl);
      }
      e.items.forEach(function(p){
        var locked = isLocked(p.id);
        var btn = document.createElement('button');
        btn.className = 'nav-item' + (isDone(p.id) ? ' done':'') + (p.isOverview ? ' overview':'') + (locked ? ' locked':'');
        btn.dataset.id = p.id;
        btn.dataset.search = (p.title + ' ' + (p.num||'')).toLowerCase();
        btn.innerHTML =
          (locked ? '<span class="lock-icon">'+LOCK_SVG+'</span>' : '<span class="status"></span>') +
          (p.num ? '<span class="num mono">'+escapeHtml(p.num)+'</span>' : '<span class="num mono">·</span>') +
          '<span class="label">'+escapeHtml(p.title)+'</span>';
        btn.addEventListener('click', function(){
          if(isLocked(p.id)) return;
          navigate(p.id); closeMobileNav();
        });
        body.appendChild(btn);
      });
    });

    details.appendChild(body);
    navEl.appendChild(details);
  });

  function renderProgress(){
    var done = PAGES.filter(function(p){ return isDone(p.id); }).length;
    document.getElementById('progress-count').textContent = done;
    document.getElementById('progress-fill').style.width = (totalCount ? (done/totalCount*100) : 0) + '%';
    groups.forEach(function(g, gi){
      var all = g.entries.flatMap(function(e){ return e.items; });
      var el = navEl.querySelector('[data-count-for="'+gi+'"]');
      if(el) el.textContent = countDoneIn(all) + '/' + all.length;
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  // ---------- rendering current page ----------
  var articleEl = document.getElementById('article');
  var crumbEl = document.getElementById('crumb');
  var doneBtn = document.getElementById('done-btn');
  var pagerEl = document.getElementById('pager');
  var scrollEl = document.getElementById('content-scroll');

  var currentId = null;

  function navigate(id, opts){
    opts = opts || {};
    var page = byId[id];
    if(!page) return;
    currentId = id;
    AUTH.persistLast(id);
    if(!opts.fromHash && location.hash.slice(1) !== id){
      try{ history.pushState({id:id}, '', '#'+id); }catch(e){}
    }

    navEl.querySelectorAll('.nav-item.active').forEach(function(el){ el.classList.remove('active'); });
    var row = navEl.querySelector('[data-id="'+id+'"]');
    if(row){
      row.classList.add('active');
      var parentDetails = row.closest('details');
      if(parentDetails) parentDetails.open = true;
      row.scrollIntoView({block:'nearest'});
    }

    var crumbParts = [page.section];
    if(page.subgroup) crumbParts.push(page.subgroup);
    crumbEl.innerHTML = crumbParts.map(function(c,i){
      return (i===crumbParts.length-1) ? '<b>'+escapeHtml(c)+'</b>' : escapeHtml(c);
    }).join(' <span style="opacity:.5">›</span> ');

    var kicker = page.subgroup ? page.section + ' · ' + page.subgroup : page.section;
    articleEl.innerHTML =
      '<p class="kicker">'+escapeHtml(kicker)+'</p>' +
      marked.parse(page.content);

    articleEl.querySelectorAll('a[href^="#p"]').forEach(function(a){
      var targetId = a.getAttribute('href').slice(1);
      a.addEventListener('click', function(ev){
        ev.preventDefault();
        if(isLocked(targetId)) return;
        navigate(targetId);
      });
    });

    var gateNode = buildGate(page);
    if(gateNode){
      articleEl.appendChild(gateNode);
      if(gateNode._cm) gateNode._cm.refresh();
    }
    doneBtn.hidden = !!(page.quiz || page.hasPractice || page.exercise);
    if(!doneBtn.hidden) updateDoneBtn();

    buildTocRail();

    renderPager();
    scrollEl.scrollTop = 0;
  }

  var tocRailEl = document.getElementById('toc-rail');
  function buildTocRail(){
    var heads = articleEl.querySelectorAll('h2');
    if(!heads.length){ tocRailEl.hidden = true; tocRailEl.innerHTML = ''; return; }
    tocRailEl.hidden = false;

  function updateDoneBtn(){

    doneBtn.textContent = done ? '✓ Пройдено' : 'Отметить пройденным';
    doneBtn.classList.toggle('done', done);
  }
  doneBtn.addEventListener('click', function(){

    updateDoneBtn();
