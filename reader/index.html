 дальше двигаться некуда: все специализированные клиенты (`UsersClient` и те, что добавишь ты) наследуются именно от него.\n\n## Теория\n\nОткрой файл `boilerplate/clients/api_client.py` — он небольшой, разберём его целиком.\n\n### Проблема: у requests.Session нет base_url\n\nВ уроке 3.6 мы остановились на том, что `requests.Session` умеет хранить общие заголовки, но не умеет хранить базовый URL — в отличие от `httpx.Client(base_url=...)` из библиотеки, на которой изначально построен курс-источник. Наш курс использует `requests`, а не `httpx`, поэтому в репозитории уже написано небольшое решение для этой конкретной проблемы — класс `BaseUrlSession`.\n\n### Разбор BaseUrlSession\n\n```python\nclass BaseUrlSession(Session):\n    def __init__(self, base_url: str):\n        super().__init__()\n        self.base_url = base_url.rstrip(\"/\")\n\n    def request(self, method: str, url: str | bytes, *args: Any, **kwargs: Any) -> Response:\n        full_url = f\"{self.base_url}/{str(url).lstrip('/')}\"\n        return super().request(method, full_url, *args, **kwargs)\n```\n\nРазбираем построчно:\n\n- Класс **наследуется от `requests.Session`** — то есть `BaseUrlSession` это и есть сессия `requests`, просто с добавленным поведением, а не что-то отдельное.\n- `__init__` принимает `base_url`, вызывает конструктор родителя (`super().__init__()`, чтобы сессия проинициализировалась как обычно), а затем сохраняет URL, убрав завершающий слэш (`rstrip(\"/\")`) — это защита от двойного слэша при склейке (`https://example.com/` + `/users` не должно превращаться в `.../ /users`).\n- Метод `request` — это тот самый метод, который `requests.Session` вызывает внутри себя при **любом** обращении: `session.get(...)` под капотом всё равно приходит к `session.request(\"GET\", ...)`, то же самое для `post`, `put`, `patch`, `delete`. Переопределив именно `request`, мы гарантируем, что подстановка `base_url` сработает **для всех** методов сразу, а не только для, скажем, `get`.\n- Внутри `request` мы склеиваем `base_url` и переданный `url`, обрезая лишние слэши с обеих сторон (`str(url).lstrip('/')` — убираем слэш в начале пути, если он там есть), и вызываем оригинальную реализацию через `super().request(...)`, подставляя уже полный URL.\n\nИтог: `BaseUrlSession(\"https://jsonplaceholder.typicode.com\")` ведёт себя как обычная `requests.Session`, но её методы (`.get(\"/users\")`, `.post(\"/users\", json=...)` и т. д.) принимают **относительные** пути, а не полные URL.\n\n### Разбор APIClient\n\n```python\nclass APIClient:\n    def __init__(self, session: Session):\n        self.session = session\n\n    def get(self, url: str, params: dict | None = None) -> Response:\n        return self.session.get(url, params=params)\n\n    def post(self, url, json=None, data=None, files=None) -> Response:\n        return self.session.post(url, json=json, data=data, files=files)\n\n    def put(self, url: str, json: Any | None = None) -> Response:\n        return self.session.put(url, json=json)\n\n    def patch(self, url: str, json: Any | None = None) -> Response:\n        return self.session.patch(url, json=json)\n\n    def delete(self, url: str) -> Response:\n        return self.session.delete(url)\n```\n\n`APIClient` — это базовый класс, от которого будут наследоваться **все** специализированные клиенты проекта (`UsersClient` и любые другие, которые появятся позже). Он не знает ничего про конкретный API или конкретные эндпоинты — он просто задаёт единый интерфейс поверх `requests.Session`: `get`, `post`, `put`, `patch`, `delete`. Обрати внимание, что каждый метод — это тонкая обёртка вокруг одноимённого метода сессии, ничего лишнего.\n\nЗачем нужен этот промежуточный слой, если можно вызывать `self.session.get(...)` напрямую? Дело в том, что именно на этом уровне в будущем удобно добавлять сквозную функциональность — например, логирование каждого запроса, единую обработку ошибок или ретраи. Если это добавить в `APIClient.get`, оно автоматически заработает во всех клиентах, которые от него наследуются, — не придётся править каждый специализированный клиент по отдельности.\n\n### build_http_session — фабрика готовой сессии\n\n```python\ndef build_http_session(base_url: str, timeout: int = 10) -> Session:\n    session = BaseUrlSession(base_url=base_url)\n    session.request = _with_default_timeout(session.request, timeout)\n    return session\n```\n\nЭта функция собирает сессию, готовую к использованию: подставляет `base_url` через `BaseUrlSession` и оборачивает метод `request` так, чтобы у всех запросов был таймаут по умолчанию (10 секунд), даже если вызывающий код не укажет его явно:\n\n```python\ndef _with_default_timeout(request_func, timeout: int):\n    def wrapper(method: str, url: str, *args: Any, **kwargs: Any) -> Response:\n        kwargs.setdefault(\"timeout\", timeout)\n        return request_func(method, url, *args, **kwargs)\n\n    return wrapper\n```\n\n`kwargs.setdefault(\"timeout\", timeout)` — ключевой момент: если вызывающий код **уже** передал свой `timeout`, значение не перезаписывается; таймаут по умолчанию подставляется только тогда, когда его никто не указал.\n\n## Пример\n\nЧтобы получить рабочий клиент \"с нуля\", в терминале (например, в `python -i` или в отдельном скрипте) можно сделать так:\n\n```python\nfrom clients.api_client import APIClient, build_http_session\n\nsession = build_http_session(base_url=\"https://jsonplaceholder.typicode.com\")\nclient = APIClient(session=session)\n\nresponse = client.get(\"/users/1\")\nprint(response.status_code, response.json())\n```\n\nОбрати внимание: мы передали относительный путь `\"/users/1\"`, а не полный URL — именно это и обеспечивает `BaseUrlSession`.\n\n## Частые ошибки\n\n- Пытаться переопределить `get`/`post`/... вместо `request` при попытке добавить сквозную логику в `BaseUrlSession` — тогда логика сработает не для всех методов, а только для переопределённых.\n- Забывать про `rstrip`/`lstrip` при самостоятельной реализации похожего класса и получать URL вида `https://example.com//users` (двойной слэш) — большинство серверов такое не примут как ожидаемый путь.\n- Путать уровень `APIClient` (общие HTTP-методы) и уровень специализированных клиентов вроде `UsersClient` (конкретные эндпоинты) — специфичного для `/users` в `api_client.py` быть не должно.\n\n## Мини-задание\n\nДо того как заглянуть в готовый `APIClient`/`BaseUrlSession` из теории выше, — попробуй сам. Напиши в отдельном скрипте маленький класс `SimpleClient`: конструктор принимает `base_url` и сохраняет его, метод `get(path)` делает `requests.get(...)` на `base_url + path`, метод `post(path, json)` — аналогично `requests.post(...)`. Проверь его на `client.get(\"/users/1\")` и `client.post(\"/posts\", json={\"title\": \"x\"})` — оба вызова должны реально сходить в сеть и вернуть ответ.\n\nТеперь сравни свой `SimpleClient` с настоящим `APIClient`/`BaseUrlSession`: что он делает так же, а что — иначе (единая точка для всех методов через `request`, таймаут по умолчанию)? Переписывать свой класс под эталон не нужно — важно осознанно увидеть разницу, а не просто прочитать чужой код.\n", "hasPractice": true, "quiz": [{"question": "Почему BaseUrlSession в общем репозитории переопределяет именно метод request(), а не отдельно get(), post() и т.д.?", "options": ["Потому что переопределение request() ускоряет выполнение HTTP-запросов", "Потому что метод request() — единственный метод, который умеет работать с JSON", "Потому что requests.Session вызывает request() внутри любого метода (get/post/put/...), и переопределение request() гарантирует подстановку base_url для всех методов сразу", "Потому что requests.Session не позволяет переопределять метод get() вообще"], "correct": 2, "explain": "session.get(...), session.post(...) и остальные методы внутри себя вызывают session.request(...). Переопределив только request(), мы получаем подстановку base_url сразу для всех HTTP-методов."}, {"question": "Зачем в BaseUrlSession используется rstrip('/') для base_url и lstrip('/') для переданного url?", "options": ["Чтобы избежать двойного слэша при склейке base_url и относительного пути (например, https://example.com//users)", "Чтобы ускорить выполнение запроса", "Потому что requests.Session требует URL без слэшей вообще", "Чтобы автоматически добавить HTTPS к адресу"], "correct": 0, "explain": "Обрезка лишних слэшей с обеих сторон перед склейкой защищает от URL с двойным слэшем, который многие серверы не примут как ожидаемый путь."}, {"question": "Зачем нужен промежуточный слой APIClient, если можно было бы вызывать self.session.get(...) напрямую из специализированных клиентов?", "options": ["Без APIClient requests.Session не может выполнять POST-запросы", "На уровне APIClient удобно добавлять сквозную функциональность (логирование, обработку ошибок, ретраи), которая сразу заработает во всех клиентах-наследниках", "APIClient обязателен по требованиям библиотеки requests", "APIClient ускоряет сами сетевые запросы"], "correct": 1, "explain": "Если добавить сквозную логику (например, логирование) в APIClient.get, она автоматически заработает во всех клиентах, унаследованных от APIClient — не придётся править каждый специализированный клиент отдельно."}, {"question": "Что делает kwargs.setdefault(\"timeout\", timeout) внутри build_http_session?", "options": ["Подставляет таймаут по умолчанию только тогда, когда вызывающий код не передал свой timeout явно", "Всегда перезаписывает timeout значением по умолчанию, даже если вызывающий код передал свой", "Устанавливает timeout только для GET-запросов", "Отключает таймаут полностью"], "correct": 0, "explain": "setdefault добавляет ключ в kwargs, только если его там ещё нет — то есть явно переданный timeout не перезаписывается, а таймаут по умолчанию подставляется лишь при его отсутствии."}, {"question": "Что, согласно уроку, НЕ должно находиться в файле api_client.py?", "options": ["Класс BaseUrlSession", "Специфичная логика конкретного ресурса, например методов под /users", "Метод get(), общий для всех клиентов", "Метод post(), общий для всех клиентов"], "correct": 1, "explain": "APIClient не должен ничего знать о конкретных эндпоинтах вроде /users — это задача специализированных клиентов (например, UsersClient), а не базового APIClient."}]}, {"id": "p54", "section": "Модуль 3 · API-тестирование", "subgroup": "Неделя 7", "isOverview": false, "num": "3.8", "title": "UsersClient и фикстура users_client", "content": "# 3.8. UsersClient и фикстура users_client\n\n## Зачем это нужно\n\n`APIClient` из прошлого урока ничего не знает про `/users` — и это правильно, он универсальный. Конкретную логику под конкретный ресурс добавляют специализированные клиенты. `UsersClient` — первый такой клиент в репозитории, и он же — прямой образец для твоего домашнего задания: новые методы ты будешь добавлять именно в него, по тому же паттерну.\n\n## Теория\n\nОткрой `boilerplate/clients/users/users_client.py`:\n\n```python\nfrom requests import Response\n\nfrom clients.api_client import APIClient, build_http_session\nfrom clients.users.users_schema import (\n    CreateUserRequestSchema,\n    CreateUserResponseSchema,\n    UserSchema,\n)\n\nBASE_URL = \"https://jsonplaceholder.typicode.com\"\n\n\nclass UsersClient(APIClient):\n    def get_users_api(self) -> Response:\n        return self.get(\"/users\")\n\n    def get_user_api(self, user_id: int) -> Response:\n        return self.get(f\"/users/{user_id}\")\n\n    def create_user_api(self, request: CreateUserRequestSchema) -> Response:\n        return self.post(\"/users\", json=request.model_dump())\n\n    def delete_user_api(self, user_id: int) -> Response:\n        return self.delete(f\"/users/{user_id}\")\n\n    def get_user(self, user_id: int) -> UserSchema:\n        response = self.get_user_api(user_id)\n        return UserSchema.model_validate_json(response.text)\n\n    def create_user(self, request: CreateUserRequestSchema) -> CreateUserResponseSchema:\n        response = self.create_user_api(request)\n        return CreateUserResponseSchema.model_validate_json(response.text)\n\n\ndef get_users_client() -> UsersClient:\n    return UsersClient(session=build_http_session(base_url=BASE_URL))\n```\n\n### Наследование от APIClient\n\n`class UsersClient(APIClient):` — `UsersClient` получает все методы `get/post/put/patch/delete` бесплатно, просто по факту наследования. Ему остаётся только описать, **какие именно** запросы имеют смысл для ресурса `/users`, и под какими именами их удобно вызывать из тестов.\n\n### Два уровня методов: `_api` и обычные\n\nОбрати внимание на закономерность в названиях:\n\n- `get_users_api`, `get_user_api`, `create_user_api`, `delete_user_api` — методы с суффиксом `_api`. Они возвращают **сырой** `requests.Response`, ничего не валидируя и не преобразуя. Это низкоуровневый слой — нужен, например, когда в тесте важно проверить именно статус-код или сырое тело ответа (в том числе для негативных сценариев, где сервер возвращает не то, что ожидалось).\n- `get_user`, `create_user` — методы **без** суффикса `_api`. Они вызывают соответствующий `_api`-метод и сразу возвращают уже провалидированный Pydantic-объект (`UserSchema`, `CreateUserResponseSchema`) вместо сырого `Response`. Это высокоуровневый слой — удобен, когда тест хочет сразу работать с типизированными полями (`user.email`, `user.id`), а не лезть в `response.json()[\"email\"]`.\n\nТакое разделение — не случайность и не лишняя сложность: оно даёт тесту выбор. Если тест проверяет happy path и хочет удобный доступ к полям — он берёт `get_user()`. Если тест целенаправленно проверяет ошибку (несуществующий пользователь, `404`) — валидировать тело ответа Pydantic-схемой бессмысленно (там и не будет корректного пользователя), поэтому тест берёт `get_user_api()` и проверяет только `response.status_code`.\n\n### get_users_client — фабрика клиента\n\n```python\ndef get_users_client() -> UsersClient:\n    return UsersClient(session=build_http_session(base_url=BASE_URL))\n```\n\nЭто обычная функция (не метод класса), которая скрывает детали сборки: откуда взять `base_url`, как собрать сессию (`build_http_session` из урока 3.7). Тестам и фикстурам не нужно знать эти детали — они просто вызывают `get_users_client()` и получают готовый к работе объект.\n\n### Фикстура users_client в conftest.py\n\nВ `boilerplate/conftest.py` есть:\n\n```python\n@pytest.fixture(scope=\"session\")\ndef users_client() -> UsersClient:\n    return get_users_client()\n```\n\n`scope=\"session\"` означает, что клиент создаётся **один раз** за весь прогон тестов, а не заново для каждого теста — так как `UsersClient` не хранит состояние конкретного теста (никаких \"текущих данных пользователя\" внутри клиента нет), пересоздавать его каждый раз бессмысленно и просто тратит время.\n\nЛюбой тест, которому нужен доступ к API `/users`, просто объявляет параметр `users_client: UsersClient` в сигнатуре теста — pytest сам подставит туда готовый объект благодаря механизму фикстур (это ты уже проходил в модуле 1).\n\n## Пример\n\nИспользование клиента в тесте выглядит так (полный разбор `test_users.py` будет в уроке 3.12):\n\n```python\ndef test_get_user(users_client: UsersClient):\n    user = users_client.get_user(user_id=1)\n    assert user.id == 1\n```\n\nА вот негативный сценарий, где нужен именно `_api`-метод:\n\n```python\ndef test_get_user_not_found(users_client: UsersClient):\n    response = users_client.get_user_api(user_id=999)\n    assert response.status_code == 404\n```\n\n## Частые ошибки\n\n- Добавлять в `UsersClient` метод, который не относится к `/users` (например, работу с постами) — специализированный клиент должен отвечать только за свой ресурс. Для другого ресурса — новый клиент рядом, по тому же паттерну.\n- Реализовывать только высокоуровневый метод (`get_user`) без низкоуровневого (`get_user_api`) — тогда написать негативный тест на ошибку станет неудобно или невозможно, ведь Pydantic-валидация ответа с ошибкой просто упадёт с исключением вместо понятного `assert`.\n- Создавать `UsersClient` вручную в каждом тесте вместо использования фикстуры `users_client` — дублирование той же природы, что и с голым `requests.get(...)` в модуле недели 6.\n\n## Мини-задание\n\nДобавь в свой форк новый метод `find_user_by_username(self, username: str) -> UserSchema | None` в `UsersClient` — по тому же паттерну, что и остальные методы класса. Он должен вызвать уже существующий `get_users_api()`, пройтись по списку пользователей из `response.json()` и вернуть того, чей `username` совпадает с переданным (`UserSchema(**matching_dict)`), либо `None`, если такого нет. Проверь его в отдельном скрипте на реальном username с `https://jsonplaceholder.typicode.com/users` (например, `\"Bret\"`).\n", "hasPractice": true, "quiz": [{"question": "В UsersClient есть get_user_api() (возвращает сырой Response) и get_user() (возвращает провалидированный UserSchema). В каком тесте уместнее использовать именно get_user_api()?", "options": ["В любом тесте — разницы между методами нет", "В негативном тесте, где ожидается ошибка (например, 404) и тело ответа не соответствует UserSchema", "Только когда нужно ускорить выполнение теста", "В тесте, где нужно получить данные пользователя в виде Pydantic-объекта с валидацией полей"], "correct": 1, "explain": "get_user() сразу валидирует ответ через Pydantic-схему и упадёт с ошибкой валидации, если тело не соответствует UserSchema — это мешает негативным тестам. Для них нужен сырой Response из get_user_api()."}, {"question": "Почему фикстура users_client в conftest.py объявлена с scope=\"session\"?", "options": ["Потому что pytest требует scope=\"session\" для всех фикстур с API-клиентами", "Потому что UsersClient технически нельзя создавать больше одного раза за весь прогон тестов", "Потому что UsersClient не хранит состояние конкретного теста, и пересоздавать его для каждого теста бессмысленно и тратит время", "Потому что scope=\"session\" ускоряет сами HTTP-запросы"], "correct": 2, "explain": "Так как UsersClient не хранит состояние конкретного теста, создавать новый объект для каждого теста не нужно — клиент создаётся один раз на сессию и переиспользуется."}, {"question": "Что означает суффикс _api в названиях методов вроде get_user_api, create_user_api?", "options": ["Это метод, который автоматически повторяет запрос при ошибке", "Это приватный метод, недоступный извне класса", "Это метод, который работает только с локальным сервером, а не с реальным API", "Это метод, который возвращает сырой Response, без валидации через Pydantic"], "correct": 3, "explain": "Методы с суффиксом _api — низкоуровневые: они выполняют запрос и возвращают requests.Response как есть, без Pydantic-валидации."}, {"question": "Зачем в users_client.py есть отдельная функция get_users_client(), а не создание UsersClient(...) напрямую в тестах?", "options": ["Потому что класс UsersClient нельзя создать напрямую — только через фабричную функцию", "Она скрывает детали сборки (откуда взять base_url, как собрать сессию), чтобы тестам и фикстурам не нужно было знать эти детали", "Потому что pytest-фикстуры не могут напрямую вызывать конструкторы классов", "Потому что функции в Python выполняются быстрее, чем создание объектов классов"], "correct": 1, "explain": "get_users_client() инкапсулирует детали сборки клиента (base_url, сессия) — фикстуре достаточно вызвать эту функцию, не зная, как именно клиент собирается внутри."}, {"question": "Согласно разделу «Частые ошибки» урока, что не стоит делать с UsersClient?", "options": ["Наследовать его от APIClient", "Добавлять в него методы, не относящиеся к ресурсу /users (например, для постов) — для другого ресурса нужен отдельный клиент", "Использовать в нём метод self.get()", "Возвращать из его методов объект Response"], "correct": 1, "explain": "UsersClient должен отвечать только за свой ресурс (/users). Логика для другого ресурса (например, /posts) должна жить в отдельном специализированном клиенте, по тому же паттерну."}]}, {"id": "p55", "section": "Модуль 3 · API-тестирование", "subgroup": "Неделя 7", "isOverview": false, "num": "3.9", "title": "Знакомство с Pydantic: BaseModel и валидация", "content": "# 3.9. Знакомство с Pydantic: BaseModel и валидация\n\n## Зачем это нужно\n\nВ прошлом уроке ты видел `UserSchema`, `CreateUserRequestSchema` — но пока как чёрный ящик. Пора понять, что это такое и почему в API-тестировании принято описывать структуру запросов и ответов именно через Pydantic, а не работать напрямую со словарями из `response.json()`.\n\n## Теория\n\n**Pydantic** — библиотека для описания структур данных и их автоматической валидации на основе аннотаций типов Python. В `boilerplate/requirements.txt` уже зафиксирована версия `pydantic==2.9.2`.\n\n### Базовая модель\n\n```python\nfrom pydantic import BaseModel\n\n\nclass User(BaseModel):\n    id: int\n    name: str\n    email: str\n\n\nuser = User(id=1, name=\"Alice\", email=\"alice@example.com\")\nprint(user.id)  # 1 — обращение через атрибут, а не user[\"id\"]\n```\n\n`BaseModel` — базовый класс, от которого наследуются все модели Pydantic. При создании объекта Pydantic **проверяет** типы каждого поля. Если типы не совпадают и не могут быть безопасно приведены — будет выброшено исключение `ValidationError`:\n\n```python\nUser(id=\"not_a_number\", name=\"Alice\", email=\"alice@example.com\")\n# pydantic_core._pydantic_core.ValidationError: 1 validation error for User\n# id: Input should be a valid integer, unable to parse string as an integer\n```\n\nОбрати внимание на слово \"приведены\": Pydantic по умолчанию делает разумные автоматические преобразования. Если передать `id=\"123\"` (строку), Pydantic превратит её в `int(123)`, потому что строка однозначно представляет число. А вот `\"not_a_number\"` преобразовать некуда — отсюда ошибка.\n\n### Обязательные и опциональные поля\n\nПоле без значения по умолчанию — обязательное:\n\n```python\nclass User(BaseModel):\n    id: int\n    name: str\n    is_active: bool = True  # опциональное поле со значением по умолчанию\n```\n\nЕсли `is_active` не передать при создании объекта, оно возьмёт `True`. А вот если не передать `id` или `name` — Pydantic бросит ошибку валидации, потому что у этих полей нет значения по умолчанию.\n\nДля полей, которые могут отсутствовать и не иметь никакого разумного значения по умолчанию, используется `| None` вместе с `= None`:\n\n```python\nclass UpdateUserRequestSchema(BaseModel):\n    email: str | None = None\n    username: str | None = None\n```\n\nТакая модель годится для PATCH-запроса: студент передаёт только те поля, которые хочет изменить, а остальные остаются `None` и просто не участвуют в запросе (об этом — в уроке 3.13, когда будем реализовывать `update_user_api`).\n\n### Вложенные модели\n\nPydantic позволяет использовать одну модель как тип поля в другой — так описываются вложенные JSON-объекты:\n\n```python\nclass GeoSchema(BaseModel):\n    lat: str\n    lng: str\n\n\nclass AddressSchema(BaseModel):\n    street: str\n    city: str\n    geo: GeoSchema  # вложенная модель\n\n\naddress = AddressSchema(street=\"Main St\", city=\"Springfield\", geo={\"lat\": \"10\", \"lng\": \"20\"})\nprint(address.geo.lat)  # \"10\" — Pydantic сам превратил вложенный словарь в GeoSchema\n```\n\nВажный момент: даже если ты передашь вложенный объект как обычный словарь (`geo={\"lat\": \"10\", \"lng\": \"20\"}`), Pydantic автоматически провалидирует и превратит его в объект `GeoSchema`. Это ровно та ситуация, которая возникает при разборе ответа реального API — JSON приходит как вложенные словари, а Pydantic превращает всю эту структуру в дерево объектов одним вызовом.\n\n### Три способа создать модель\n\n1. **Через именованные аргументы** — как в примерах выше, `User(id=1, name=\"Alice\", ...)`.\n2. **Через распаковку словаря** — `User(**data)`, где `data` — обычный `dict`. Именно так удобно работать с результатом `response.json()`.\n3. **Через JSON-строку** — `User.model_validate_json(json_string)`. Этот способ мы подробно разберём в уроке 3.11, потому что именно его использует `UsersClient`.\n\n## Пример\n\nНастоящая модель из репозитория — `boilerplate/clients/users/users_schema.py`:\n\n```python\nfrom pydantic import BaseModel, EmailStr\n\n\nclass UserSchema(BaseModel):\n    \"\"\"\n    Описание структуры пользователя из https://jsonplaceholder.typicode.com/users.\n    \"\"\"\n    id: int\n    name: str\n    username: str\n    email: EmailStr\n    address: AddressSchema\n    phone: str\n    website: str\n    company: CompanySchema\n```\n\nОбрати внимание на `EmailStr` вместо обычного `str` — это встроенный в Pydantic тип, который не просто хранит строку, а проверяет, что она похожа на email. Если в ответе API окажется `\"email\": \"not-an-email\"`, модель не соберётся, и ты сразу узнаешь об этом на этапе валидации, а не где-то глубже в тесте.\n\n## Частые ошибки\n\n- Путать `BaseModel` с обычным `dict` и пытаться обращаться к полям через `user[\"id\"]` вместо `user.id`.\n- Забывать, что поле без `= значение` — обязательное, и удивляться `ValidationError` при попытке создать модель без всех полей.\n- Пытаться засунуть в Pydantic-модель бизнес-логику или сетевые вызовы (например, метод, который сам ходит в API) — модель должна отвечать только за структуру и валидацию данных, а не выполнять запросы.\n- Не устанавливать дополнительную зависимость для `EmailStr` (`pydantic[email]`) — без неё этот тип попросту не будет работать.\n\n## Мини-задание\n\nОпиши Pydantic-модель `PostSchema` для ресурса `/posts` API JSONPlaceholder (поля: `userId: int`, `id: int`, `title: str`, `body: str`). Получи через `requests` любой пост (`GET /posts/1`), передай `response.json()` в модель через распаковку словаря (`PostSchema(**response.json())`) и распечатай `post.title` через атрибут.\n", "hasPractice": true, "quiz": [{"question": "В Pydantic-модели поле объявлено как email: str, без значения по умолчанию. Что произойдёт, если создать объект модели, не передав это поле?", "options": ["Поле получит пустую строку \"\"", "Поле автоматически получит значение None", "Pydantic выбросит ValidationError, так как поле без значения по умолчанию обязательно", "Модель создастся успешно, а поле просто не будет существовать у объекта"], "correct": 2, "explain": "Поле без значения по умолчанию (или без | None = None) — обязательное. Если его не передать при создании объекта, Pydantic бросит ValidationError."}, {"question": "Модель имеет поле id: int. Что произойдёт, если передать User(id=\"123\", ...)?", "options": ["Pydantic автоматически преобразует строку \"123\" в число 123, так как она однозначно представляет число", "Pydantic бросит ValidationError, так как передана строка, а не число", "Поле id останется строкой \"123\"", "Модель проигнорирует переданное значение и подставит 0"], "correct": 0, "explain": "Pydantic делает разумные автоматические преобразования: строка, однозначно представляющая число, будет приведена к int. А вот строку вроде \"not_a_number\" преобразовать некуда — там будет ValidationError."}, {"question": "Модель использует вложенное поле geo: GeoSchema. Что произойдёт, если передать geo как обычный dict, например geo={\"lat\": \"10\", \"lng\": \"20\"}?", "options": ["Pydantic автоматически провалидирует словарь и превратит его в объект GeoSchema", "Поле geo останется обычным словарём, а не объектом GeoSchema", "Это сработает только если явно вызвать GeoSchema(**geo) отдельно перед передачей", "Pydantic бросит ошибку — вложенные модели нельзя инициализировать через dict"], "correct": 0, "explain": "Pydantic сам проверяет и превращает вложенный словарь в объект соответствующей модели — именно так удобно разбирать вложенные JSON-объекты из ответа API."}, {"question": "Какой из трёх способов создания Pydantic-модели упоминается в уроке как самый безопасный для разбора ответа API и будет подробно разобран в следующем уроке?", "options": ["User(**data) — через распаковку словаря", "User.model_validate_json(json_string) — через JSON-строку", "User(id=1, name=\"Alice\", ...) — через именованные аргументы", "Ручной парсинг строки без использования Pydantic"], "correct": 1, "explain": "model_validate_json — способ, который использует UsersClient в репозитории; ему посвящён отдельный урок 3.11, где объясняется, почему он надёжнее ручного response.json()."}, {"question": "Почему, согласно уроку, не стоит добавлять в Pydantic-модель метод, который сам выполняет сетевой запрос?", "options": ["Потому что модель должна отвечать только за структуру и валидацию данных, а не за бизнес-логику или сетевые вызовы", "Потому что это вызовет ValidationError при импорте модуля", "Потому что Pydantic-модели вообще не поддерживают методы", "Потому что сетевые вызовы замедляют работу BaseModel.__init__"], "correct": 0, "explain": "Pydantic-модель — это описание структуры данных и их валидация. Сетевые вызовы и бизнес-логика должны жить в API-клиенте, а не в модели."}]}, {"id": "p56", "section": "Модуль 3 · API-тестирование", "subgroup": "Неделя 7", "isOverview": false, "num": "3.10", "title": "Вложенные модели и Field(alias=...): camelCase vs snake_case", "content": "# 3.10. Вложенные модели и Field(alias=...): camelCase vs snake_case\n\n## Зачем это нужно\n\nРеальные API редко возвращают данные в питоновском стиле именования. Рано или поздно тебе встретится поле вроде `firstName` или `createdAt`, и нужно будет решить: либо жить с некрасивым `snake_case`-нарушением в коде, либо настроить Pydantic так, чтобы он сам сопоставлял `camelCase` из JSON с `snake_case` в Python. Разберём оба варианта на реальном примере из репозитория.\n\n## Теория\n\n### Откуда берётся проблема camelCase / snake_case\n\nВ Python принят стиль именования `snake_case` (`first_name`, `created_at`). Во многих API (особенно написанных на JavaScript/TypeScript-бэкендах) принят `camelCase` (`firstName`, `createdAt`). Когда мы описываем Pydantic-модель под такой API, у нас есть выбор:\n\n1. Назвать поле модели точно так же, как в JSON (`firstName: str`) — просто, но нарушает питоновский код-стиль внутри проекта.\n2. Назвать поле в `snake_case` (`first_name: str`), а связь с JSON-ключом `firstName` настроить через `Field(alias=...)`.\n\n### Field(alias=...)\n\n```python\nfrom pydantic import BaseModel, Field\n\n\nclass UserSchema(BaseModel):\n    id: str\n    email: str\n    first_name: str = Field(alias=\"firstName\")\n    last_name: str = Field(alias=\"lastName\")\n```\n\nТеперь при создании модели из JSON-словаря `{\"id\": \"1\", \"email\": \"a@b.com\", \"firstName\": \"Alice\", \"lastName\": \"Smith\"}` Pydantic сам сопоставит `firstName` → `first_name`. В Python-коде дальше работаем как обычно: `user.first_name`, а не `user.firstName`.\n\n**Важный нюанс:** если задан `alias`, по умолчанию Pydantic ожидает при создании объекта именно алиас (`firstName=...`), а не имя поля (`first_name=...`). Чтобы можно было создавать модель обоими способами (и через алиас, и через имя поля в snake_case — это удобно в тестах, где ты сам формируешь запрос), добавляют:\n\n```python\nfrom pydantic import BaseModel, ConfigDict, Field\n\n\nclass UserSchema(BaseModel):\n    model_config = ConfigDict(populate_by_name=True)\n\n    first_name: str = Field(alias=\"firstName\")\n```\n\n### Обратная сериализация: model_dump(by_alias=True)\n\nКогда модель нужно превратить обратно в словарь для отправки в API, по умолчанию `model_dump()` вернёт ключи в том виде, в котором названы поля модели (`snake_case`). Если API ожидает `camelCase` обратно, нужно явно попросить сериализовать через алиасы:\n\n```python\nuser.model_dump()               # {\"first_name\": \"Alice\", ...} — snake_case\nuser.model_dump(by_alias=True)  # {\"firstName\": \"Alice\", ...} — camelCase, как ждёт API\n```\n\n### А что у нас в демо-API?\n\nОткрой ещё раз `boilerplate/clients/users/users_schema.py`. Там **нет** ни одного `Field(alias=...)`:\n\n```python\nclass CompanySchema(BaseModel):\n    name: str\n    catchPhrase: str  # camelCase-поле оставлено как есть, без alias\n    bs: str\n```\n\nЭто осознанное и вполне рабочее решение: JSONPlaceholder возвращает всего одно по-настоящему \"неудобное\" поле (`catchPhrase`), и ради него не стали городить `Field(alias=...)` — проще один раз назвать поле модели так же, как в JSON. **Alias нужен не всегда** — он оправдан, когда camelCase-полей в API много и хочется единообразного `snake_case` во всём проекте, либо когда важно строго придерживаться PEP 8 в командном коде. Если поле одно и погоды не делает — это решение архитектурного вкуса команды, а не жёсткое правило Pydantic.\n\nЕсли бы мы хотели переименовать `catchPhrase` в `catch_phrase`, выглядело бы это так:\n\n```python\nclass CompanySchema(BaseModel):\n    name: str\n    catch_phrase: str = Field(alias=\"catchPhrase\")\n    bs: str\n```\n\n### alias_generator — когда camelCase-полей много\n\nЕсли бы camelCase был не в одном поле, а во всех, вручную писать `Field(alias=...)` для каждого было бы утомительно. Для этого в Pydantic есть `alias_generator`:\n\n```python\nfrom pydantic import BaseModel, ConfigDict\nfrom pydantic.alias_generators import to_camel\n\n\nclass CourseSchema(BaseModel):\n    model_config = ConfigDict(alias_generator=to_camel, populate_by_name=True)\n\n    max_score: int\n    min_score: int\n```\n\n`to_camel` автоматически превращает имя каждого поля модели (`max_score`) в алиас в camelCase (`maxScore`) — не нужно расставлять `Field(alias=...)` вручную для каждого поля. В нашем демо-API такой необходимости пока нет (camelCase-поле всего одно), но полезно знать про этот механизм — он часто встречается в реальных проектах.\n\n## Пример\n\nПолный пример на модели из репозитория с вложенностью (`UserSchema` → `AddressSchema` → `GeoSchema`):\n\n```python\nfrom pydantic import BaseModel, EmailStr\n\n\nclass GeoSchema(BaseModel):\n    lat: str\n    lng: str\n\n\nclass AddressSchema(BaseModel):\n    street: str\n    suite: str\n    city: str\n    zipcode: str\n    geo: GeoSchema\n\n\nclass CompanySchema(BaseModel):\n    name: str\n    catchPhrase: str\n    bs: str\n\n\nclass UserSchema(BaseModel):\n    id: int\n    name: str\n    username: str\n    email: EmailStr\n    address: AddressSchema\n    phone: str\n    website: str\n    company: CompanySchema\n```\n\nНачинать проектирование модели стоит \"снизу вверх\" — сначала описать самые вложенные структуры (`GeoSchema`), затем те, что их используют (`AddressSchema`), и в конце — главную модель (`UserSchema`). Именно в таком порядке модели и расположены в файле.\n\n## Частые ошибки\n\n- Добавлять `Field(alias=...)` \"на всякий случай\" ко всем полям, даже если имя в JSON и так уже совпадает со `snake_case` — лишний код без пользы.\n- Забыть `populate_by_name=True` (или актуальный аналог в используемой версии Pydantic) и получить ошибку при попытке создать модель через имя поля, а не через алиас.\n- Забыть `by_alias=True` при сериализации запроса обратно в JSON — тогда в API уйдёт `snake_case` там, где он ждёт `camelCase`, и запрос будет отклонён или воспринят неправильно.\n- Проектировать модели \"сверху вниз\" и путаться в структуре — начинай с самых глубоко вложенных объектов.\n\n## Мини-задание\n\nВ отдельном scratch-скрипте (не в общем репозитории) объяви свою копию модели — только сам класс, не весь файл: `class MyCompanySchema(BaseModel): name: str; catch_phrase: str = Field(alias=\"catchPhrase\"); bs: str`. Получи реального пользователя через `requests.get(\"https://jsonplaceholder.typicode.com/users/1\")`, возьми `response.json()[\"company\"]` и создай из него модель: `MyCompanySchema(**response.json()[\"company\"])`. Убедись, что `company.catch_phrase` работает так же, как в оригинальной схеме работал `company.catchPhrase`. Ничего в общем репозитории менять и откатывать не нужно — весь эксперимент живёт в твоём отдельном файле.\n", "hasPractice": true, "quiz": [{"question": "В users_schema.py репозитория поле catchPhrase в CompanySchema объявлено без Field(alias=...), просто как catchPhrase: str. Почему это рабочее решение?", "options": ["Потому что в demo API JSONPlaceholder все поля обязаны быть в camelCase по стандарту Pydantic", "Потому что alias можно использовать только для вложенных моделей, а не для простых строковых полей", "Потому что Pydantic вообще не поддерживает работу с camelCase-полями", "Alias не обязателен — можно просто назвать поле модели так же, как оно называется в JSON от API, если это не создаёт больших неудобств"], "correct": 3, "explain": "Field(alias=...) нужен, когда хочется единообразного snake_case во всём проекте. Если camelCase-полей мало (как в нашем демо-API), проще один раз назвать поле модели так же, как в JSON."}, {"question": "Зачем нужен ConfigDict(populate_by_name=True) в модели, где у полей задан alias?", "options": ["Чтобы можно было создавать модель, передавая значения и через alias, и через имя поля в snake_case", "Чтобы запретить создание модели через словарь", "Чтобы автоматически перевести все поля в camelCase при сериализации", "Чтобы модель вообще могла валидировать данные — без этой настройки Pydantic не работает"], "correct": 0, "explain": "Без populate_by_name Pydantic по умолчанию ожидает при создании объекта именно alias. populate_by_name=True позволяет использовать оба варианта — и alias, и имя поля."}, {"question": "Что вернёт user.model_dump() (без аргументов) для модели, где часть полей объявлена через Field(alias=...)?", "options": ["Ошибку — model_dump() без аргументов не работает с alias-полями", "Ключи в том виде, как названы поля модели (snake_case), а не алиасы", "Ключи всегда в camelCase, независимо от аргументов", "Пустой словарь"], "correct": 1, "explain": "По умолчанию model_dump() возвращает ключи по именам полей модели (snake_case). Чтобы получить camelCase-ключи для отправки в API, нужно явно указать by_alias=True."}, {"question": "В каком порядке рекомендуется проектировать вложенные Pydantic-модели, согласно уроку?", "options": ["В алфавитном порядке названий классов", "Порядок не имеет значения", "Сверху вниз: сначала главную модель, потом разбираться со вложенными полями", "Снизу вверх: сначала самые вложенные структуры (например, GeoSchema), потом модели, которые их используют"], "correct": 3, "explain": "Урок рекомендует идти снизу вверх: сначала описать самые глубоко вложенные структуры, затем модели, которые их используют, и в конце — главную модель."}, {"question": "Когда имеет смысл использовать alias_generator=to_camel вместо ручного Field(alias=...) на каждом поле?", "options": ["Когда в API camelCase-полей много, и вручную прописывать alias для каждого было бы утомительно", "Только для полей с типом EmailStr", "alias_generator нужен всегда, вне зависимости от количества camelCase-полей", "alias_generator заменяет собой populate_by_name и делает его ненужным"], "correct": 0, "explain": "alias_generator=to_camel автоматически генерирует alias в camelCase для каждого поля модели — удобно, когда таких полей много и вручную прописывать Field(alias=...) для каждого было бы избыточно."}]}, {"id": "p57", "section": "Модуль 3 · API-тестирование", "subgroup": "Неделя 7", "isOverview": false, "num": "3.11", "title": "model_validate_json vs response.json()", "content": "# 3.11. model_validate_json vs response.json()\n\n## Зачем это нужно\n\nВ `UsersClient` (урок 3.8) высокоуровневые методы используют `UserSchema.model_validate_json(response.text)`, а не более очевидный на первый взгляд `UserSchema(**response.json())`. Разница между этими двумя подходами — не стилистическая придирка, а вопрос того, насколько твой тест устойчив к неожиданному поведению сервера.\n\n## Теория\n\nЕсть два способа превратить ответ сервера в Pydantic-объект.\n\n### Вариант 1: response.json() + распаковка словаря\n\n```python\ndata = response.json()          # шаг 1: распарсить JSON в dict\nuser = UserSchema(**data)       # шаг 2: распаковать dict в модель\n```\n\nЗдесь работа разбита на два независимых шага. Сначала `requests` сам парсит тело ответа как JSON (используя обычный `json.loads` внутри), и только потом результат передаётся в Pydantic.\n\n**Проблема:** если сервер вернул не JSON (например, HTML-страницу ошибки от прокси, пустое тело при `204`, или просто битый JSON) — упадёт `response.json()`, ещё до того, как в дело вступит Pydantic. Ошибка будет в духе `json.decoder.JSONDecodeError`, и разбираться, что пошло не так, придётся по тексту исключения из чужой библиотеки.\n\n### Вариант 2: model_validate_json\n\n```python\nuser = UserSchema.model_validate_json(response.text)\n```\n\nЗдесь `response.text` — это сырая строка тела ответа, без предварительного парсинга через `requests`. Метод `model_validate_json` сам парсит эту строку **и** сразу валидирует её на соответствие модели — за один шаг, средствами самого Pydantic.\n\n**Почему это надёжнее:**\n\n1. Ошибка парсинга и ошибка валидации происходят в одном и том же месте, с одинаковым типом исключения (`pydantic.ValidationError`) — не нужно ловить два разных типа ошибок в разных библиотеках.\n2. Сообщение об ошибке от Pydantic обычно понятнее и конкретнее, чем стандартное исключение JSON-парсера — оно сразу указывает, какое поле проблемное.\n3. Меньше промежуточных шагов — данные не проходят лишний раз через generic `dict`, а сразу превращаются в типизированный объект.\n\n### Когда какой вариант использовать\n\nЕсли ты уверен, что API всегда возвращает предсказуемый корректный JSON (что в целом верно для стабильных внутренних API), разница между вариантами не критична, и `UserSchema(**response.json())` тоже рабочий вариант. Но `model_validate_json(response.text)` — более защищённый способ по умолчанию, и именно поэтому он используется во всех высокоуровневых методах `UsersClient` в нашем репозитории. Придерживайся этого же паттерна, когда будешь добавлять свои методы в домашнем задании.\n\n## Пример\n\nВот как это выглядит в реальном методе `UsersClient` (`boilerplate/clients/users/users_client.py`):\n\n```python\ndef get_user_api(self, user_id: int) -> Response:\n    return self.get(f\"/users/{user_id}\")\n\ndef get_user(self, user_id: int) -> UserSchema:\n    response = self.get_user_api(user_id)\n    return UserSchema.model_validate_json(response.text)\n```\n\n`get_user_api` возвращает сырой `Response` — им пользуются негативные тесты (урок 3.8). `get_user` берёт этот же `Response`, достаёт `response.text` и валидирует его в `UserSchema` — им пользуются позитивные тесты, которым нужен удобный доступ к полям.\n\nЕсли бы сервер неожиданно вернул, скажем, пустое тело (например, из-за сбоя прокси), `model_validate_json(\"\")` упадёт с понятным `ValidationError`, где будет явно видно, что тело не является валидным JSON-объектом — вместо непрозрачного `JSONDecodeError` где-то в недрах `requests`.\n\n## Частые ошибки\n\n- Смешивать подходы в одном методе без причины — например, один раз использовать `response.json()`, в другом методе того же клиента — `model_validate_json`, без единой логики выбора.\n- Вызывать `model_validate_json` на негативных сценариях (`404`, `422`), где тело ответа заведомо не соответствует основной схеме, — в таких тестах нужно проверять `response.status_code` через `_api`-метод, а не пытаться валидировать ошибку как успешный ответ.\n- Забывать, что `model_validate_json` ожидает именно **строку** (`response.text`), а не уже распарсенный словарь — попытка передать `response.json()` в `model_validate_json` приведёт к ошибке типа.\n\n## Мини-задание\n\nВозьми `users_client.get_user_api(user_id=999)` (несуществующий пользователь, вернёт `404` с пустым или отличным от `UserSchema` телом). Попробуй передать `response.text` в `UserSchema.model_validate_json(...)` и посмотри на текст исключения `ValidationError`. Сравни с тем, что случилось бы при попытке `UserSchema(**response.json())` на том же ответе — оба варианта не сработают, но сообщения об ошибке будут отличаться.\n", "hasPractice": true, "quiz": [{"question": "Почему UserSchema.model_validate_json(response.text) считается более надёжным вариантом, чем UserSchema(**response.json())?", "options": ["response.text всегда возвращает уже провалидированный объект", "response.json() вообще не работает с объектом requests.Response", "Парсинг JSON и валидация происходят за один шаг средствами Pydantic, а не разбиты на отдельный вызов response.json(), который может упасть с непрозрачной ошибкой ещё до валидации", "model_validate_json работает быстрее в несколько раз"], "correct": 2, "explain": "model_validate_json парсит и валидирует строку ответа за один шаг Pydantic-средствами, давая более понятную ошибку. response.json() парсит JSON отдельно и может упасть с непрозрачным JSONDecodeError раньше, чем Pydantic вообще увидит данные."}, {"question": "Что произойдёт при вызове response.json(), если сервер вернул, например, HTML-страницу ошибки вместо JSON?", "options": ["response.json() автоматически преобразует HTML в JSON", "response.json() вернёт HTML как обычный текст без исключения", "response.json() вернёт None без ошибки", "response.json() упадёт с ошибкой вроде json.decoder.JSONDecodeError, ещё до того, как в дело вступит Pydantic"], "correct": 3, "explain": "Если тело ответа — не валидный JSON, response.json() бросит исключение json.decoder.JSONDecodeError раньше, чем Pydantic вообще получит данные для валидации."}, {"question": "Какой тип данных ожидает метод model_validate_json?", "options": ["Сырую строку JSON, например response.text", "Объект requests.Response целиком", "Уже распарсенный Python-словарь (dict), как результат response.json()", "Список байтов response.content без декодирования"], "correct": 0, "explain": "model_validate_json ожидает именно строку — например, response.text. Попытка передать в него уже распарсенный dict из response.json() приведёт к ошибке типа."}, {"question": "Согласно уроку, в каком случае разница между двумя подходами не критична и можно использовать UserSchema(**response.json())?", "options": ["Когда ты уверен, что API всегда возвращает предсказуемый и корректный JSON", "Только для DELETE-запросов", "Никогда — model_validate_json нужно использовать всегда без исключений", "Только если модель не содержит вложенных структур"], "correct": 0, "explain": "Если API стабильно возвращает корректный JSON, оба варианта рабочие — но model_validate_json остаётся более защищённым выбором по умолчанию."}, {"question": "Почему не стоит вызывать model_validate_json на ответе с кодом 404 от get_user_api, ожидая получить UserSchema?", "options": ["Потому что тело ответа на ошибку заведомо не соответствует UserSchema, и попытка валидации приведёт к ValidationError вместо осмысленной проверки статус-кода", "Потому что 404 всегда возвращает пустое тело, а model_validate_json требует непустую строку", "Потому что это вызовет бесконечный цикл повторных запросов", "Потому что model_validate_json физически не работает с кодами ошибок"], "correct": 0, "explain": "На негативных сценариях (404, 422) тело ответа не соответствует основной схеме — валидировать его Pydantic-моделью бессмысленно, нужно проверять response.status_code через _api-метод."}]}, {"id": "p58", "section": "Модуль 3 · API-тестирование", "subgroup": "Неделя 7", "isOverview": false, "num": "3.12", "title": "Разбор test_users.py: всё вместе", "content": "# 3.12. Разбор test_users.py: всё вместе\n\n## Зачем это нужно\n\nТы по отдельности разобрал `APIClient`, `UsersClient`, Pydantic-модели и разницу между `_api`- и обычными методами. Пора увидеть, как всё это работает вместе в настоящем, зелёном тестовом файле — это и есть эталон, на который нужно ориентироваться при написании своих тестов в домашнем задании.\n\n## Теория\n\nОткрой `boilerplate/tests/api/test_users.py` целиком:\n\n```python\nimport allure\nimport pytest\n\nfrom clients.users.users_client import UsersClient\nfrom clients.users.users_schema import CreateUserRequestSchema\nfrom utils.fakers import get_random_email, get_random_username\n\n\n@allure.epic(\"API\")\n@allure.feature(\"Users\")\n@pytest.mark.api\nclass TestUsers:\n\n    @allure.title(\"Получение пользователя по id\")\n    def test_get_user(self, users_client: UsersClient):\n        with allure.step(\"Запрашиваем пользователя с id=1\"):\n            user = users_client.get_user(user_id=1)\n\n        with allure.step(\"Проверяем, что данные пользователя корректны\"):\n            assert user.id == 1\n            assert \"@\" in user.email\n\n    @allure.title(\"Получение несуществующего пользователя возвращает 404\")\n    def test_get_user_not_found(self, users_client: UsersClient):\n        with allure.step(\"Запрашиваем заведомо несуществующего пользователя\"):\n            response = users_client.get_user_api(user_id=999)\n\n        with allure.step(\"Проверяем статус-код ответа\"):\n            assert response.status_code == 404\n\n    @allure.title(\"Создание пользователя\")\n    def test_create_user(self, users_client: UsersClient):\n        request = CreateUserRequestSchema(\n            name=\"QA Student\",\n            username=get_random_username(),\n            email=get_random_email(),\n        )\n\n        with allure.step(\"Отправляем запрос на создание пользователя\"):\n            created_user = users_client.create_user(request)\n\n        with allure.step(\"Проверяем, что вернулись переданные данные\"):\n            assert created_user.name == request.name\n            assert created_user.username == request.username\n            assert created_user.email == request.email\n```\n\nРазберём по частям, связывая с уроками, которые ты уже прошёл.\n\n### Маркеры и Allure-метаданные (`@pytest.mark.api`, `@allure.epic`, `@allure.feature`)\n\n`@pytest.mark.api` — маркер из `pytest.ini` (модуль 1), который позволяет запускать только API-тесты командой `pytest -m api`. `@allure.epic(\"API\")` и `@allure.feature(\"Users\")` — метаданные для группировки в отчёте Allure; подробно про Allure будет модуль 5, сейчас достаточно знать, что эти декораторы не влияют на логику теста.\n\n### Фикстура users_client (урок 3.8)\n\nКаждый тестовый метод принимает `users_client: UsersClient` как параметр — pytest подставляет туда объект, который вернёт фикстура `users_client` из `conftest.py`. Клиент создаётся один раз на сессию и переиспользуется всеми тремя тестами.\n\n### test_get_user — happy path с высокоуровневым методом\n\n```python\nuser = users_client.get_user(user_id=1)\nassert user.id == 1\nassert \"@\" in user.email\n```\n\nИспользуется `get_user` (не `get_user_api`) — потому что тест хочет удобно проверить конкретные поля через атрибуты (`user.id`, `user.email`), а не копаться в сыром `response.json()`. Под капотом `get_user` уже сходил в API и провалидировал ответ через `UserSchema.model_validate_json(...)` (урок 3.11) — если бы сервер вернул что-то не соответствующее `UserSchema`, тест упал бы ещё на этапе вызова `get_user`, с понятной ошибкой валидации, а не на строке `assert`.\n\n### test_get_user_not_found — негативный сценарий с низкоуровневым методом\n\n```python\nresponse = users_client.get_user_api(user_id=999)\nassert response.status_code == 404\n```\n\nЗдесь используется `get_user_api`, а не `get_user` — намеренно (урок 3.8, 3.11). Тело ответа на несуществующего пользователя не соответствует `UserSchema`, и валидировать его Pydantic-схемой не нужно — единственное, что важно проверить в этом сценарии, это статус-код (урок 3.3).\n\n### test_create_user — работа с фейкерами и Pydantic-моделью запроса\n\n```python\nrequest = CreateUserRequestSchema(\n    name=\"QA Student\",\n    username=get_random_username(),\n    email=get_random_email(),\n)\ncreated_user = users_client.create_user(request)\n```\n\nСначала собирается Pydantic-модель запроса `CreateUserRequestSchema` — обрати внимание, что `username` и `email` берутся из `utils/fakers.py` (модуль использует `Faker` под капотом), чтобы каждый прогон теста создавал разные данные и тесты не мешали друг другу при повторных запусках. Затем эта модель целиком передаётся в `create_user(request)` — методу не нужен `dict`, только готовый объект схемы. Внутри `create_user_api` сам вызовет `request.model_dump()` перед отправкой (см. `users_client.py`, урок 3.8).\n\nПроверка `created_user.name == request.name` сравнивает поле ответа с полем исходного запроса напрямую через атрибуты — ещё один пример того, зачем нужны типизированные Pydantic-объекты вместо словарей.\n\n## Пример\n\nЧтобы убедиться, что всё это действительно работает, запусти только API-тесты (маркер из `pytest.ini`, модуль 1):\n\n```bash\npytest -m api -v\n```\n\nТы должен увидеть три зелёных теста: `test_get_user`, `test_get_user_not_found`, `test_create_user`.\n\n## Частые ошибки\n\n- Писать в новом тесте `assert response.json()[\"email\"] == ...` вместо того, чтобы использовать уже готовый высокоуровневый метод клиента и работать через атрибуты — это дублирование логики парсинга, которая уже есть в клиенте.\n- Использовать одинаковые (захардкоженные) `username`/`email` в тесте создания пользователя вместо генерации через `utils/fakers.py` — при повторном запуске это может привести к конфликтам данных на реальном (не фейковом) API.\n- Не разделять позитивные и негативные тесты по методам клиента (`_api` vs без суффикса) — пытаться валидировать ошибочный ответ Pydantic-схемой успешного сценария.\n\n## Мини-задание\n\nЗапусти `pytest -m api -v` локально в форкнутом `boilerplate/`, убедись, что все три теста зелёные. Затем временно измени `user_id=999` на `user_id=1` в `test_get_user_not_found` и запусти тест снова — убедись, что он падает, и разберись, на какой именно строке (`assert`) это происходит. Верни файл в исходное состояние.\n", "hasPractice": true, "quiz": [{"question": "В test_create_user данные username и email генерируются через utils/fakers.py, а не захардкожены строкой. Зачем?", "options": ["Faker обязателен по правилам Pydantic для полей типа EmailStr", "Потому что JSONPlaceholder не принимает захардкоженные строки в принципе", "Чтобы ускорить выполнение теста за счёт меньшего размера данных", "Чтобы каждый прогон теста использовал разные данные и тесты не конфликтовали друг с другом при повторных запусках"], "correct": 3, "explain": "Случайные данные на каждый прогон нужны, чтобы повторные запуски теста не мешали друг другу — например, не создавали конфликтов из-за одинаковых значений полей."}, {"question": "Что делает декоратор @pytest.mark.api в test_users.py?", "options": ["Он позволяет запускать только тесты с этим маркером командой pytest -m api, не затрагивая логику теста", "Он влияет на логику самого теста, добавляя дополнительные проверки", "Он обязателен для того, чтобы фикстура users_client вообще заработала", "Он автоматически создаёт Allure-отчёт"], "correct": 0, "explain": "@pytest.mark.api — это маркер из pytest.ini для выборочного запуска тестов (pytest -m api). Он не влияет на логику теста, только на то, какие тесты будут запущены."}, {"question": "Почему test_get_user использует высокоуровневый метод get_user(), а не get_user_api()?", "options": ["Потому что тест хочет удобно проверить конкретные поля через атрибуты (user.id, user.email), а не разбирать сырой response.json()", "Потому что get_user_api() не поддерживает GET-запросы", "Потому что get_user() выполняется быстрее по сети", "Потому что get_user_api() был удалён из клиента"], "correct": 0, "explain": "get_user() сразу возвращает провалидированный UserSchema, что удобно для happy-path проверок через атрибуты — именно поэтому его использует test_get_user."}, {"question": "Почему test_get_user_not_found проверяет только response.status_code, а не тело ответа?", "options": ["Потому что JSONPlaceholder никогда не возвращает тело на 404", "Потому что тело ответа на несуществующего пользователя не соответствует UserSchema, и это осознанный выбор для базовой негативной проверки", "Потому что status_code — единственный доступный атрибут у Response", "Потому что allure.step запрещает проверку тела ответа"], "correct": 1, "explain": "Тело ответа на несуществующего пользователя не будет соответствовать UserSchema, поэтому для базовой негативной проверки достаточно и осмысленно проверить только статус-код."}, {"question": "Что должно произойти при запуске pytest -m api -v в форкнутом boilerplate после разбора этого урока?", "options": ["Тесты запустятся, но обязательно упадут, так как JSONPlaceholder недоступен без токена", "Три теста (test_get_user, test_get_user_not_found, test_create_user) должны пройти зелёным", "Тест test_create_user всегда падает, так как JSONPlaceholder не сохраняет данные по-настоящему", "Будут запущены все тесты проекта, включая UI-тесты"], "correct": 1, "explain": "Маркер -m api фильтрует только API-тесты, и все три существующих теста в test_users.py должны проходить зелёным на рабочем демо-API."}]}, {"id": "p59", "section": "Модуль 3 · API-тестирование", "subgroup": "Неделя 7", "isOverview": false, "num": "3.13", "title": "Добавляем новый метод в клиент: update_user_api", "content": "# 3.13. Добавляем новый метод в клиент: update_user_api\n\n## Зачем это нужно\n\nЭто последний теоретический урок модуля, и он — прямая репетиция домашнего задания. Ты уже разобрал, как устроен `UsersClient` целиком (уроки 3.7–3.12). Теперь разберём, как **добавить** в него новый метод, не ломая и не переписывая то, что уже есть, — именно так выглядит обычная задача на реальном проекте: \"добавь метод под новый эндпоинт\".\n\n## Теория\n\nВ `UsersClient` уже есть `get_users_api`, `get_user_api`, `create_user_api`, `delete_user_api` (низкоуровневые, возвращают `Response`) и `get_user`, `create_user` (высокоуровневые, возвращают Pydantic-модель). Обрати внимание: **`delete_user_api` уже существует в клиенте**, но в `test_users.py` для него пока нет ни одного теста. Значит, в домашнем задании тебе предстоит не только добавить новый метод, но и написать тесты на уже существующий, но непокрытый метод — тоже частая ситуация в реальной работе.\n\nМетода для обновления пользователя (`PATCH /users/{id}`) в клиенте пока нет вообще — это тот метод, который мы добавим по шагам ниже.\n\n### Шаг 1. Схема запроса на обновление\n\nPATCH — метод частичного обновления (урок 3.2): клиент присылает только те поля, которые хочет изменить. Значит, в схеме запроса все поля должны быть опциональными (урок 3.9):\n\n```python\n# clients/users/users_schema.py — добавляем рядом с существующими схемами\n\nclass UpdateUserRequestSchema(BaseModel):\n    \"\"\"\n    Описание структуры запроса на частичное обновление пользователя.\n    Все поля опциональны — PATCH отправляет только то, что нужно изменить.\n    \"\"\"\n    name: str | None = None\n    username: str | None = None\n    email: EmailStr | None = None\n```\n\nОбрати внимание: используем `EmailStr`, а не простой `str`, точно так же, как в уже существующей `UserSchema`. Это не просто \"для красоты\" — на реальном (а не фейковом) API схема с `EmailStr` не даст тебе даже попытаться отправить в API заведомо невалидный email: `UpdateUserRequestSchema(email=\"not-an-email\")` упадёт с `pydantic.ValidationError` ещё до похода в сеть. Это осмысленный негативный тест сам по себе — подробнее в домашнем задании.\n\nДля ответа переиспользуем уже существующую `UserSchema` — JSONPlaceholder на `PATCH /users/{id}` для \"существующих\" (захардкоженных на сервере) id 1–10 возвращает полноценный объект пользователя той же формы, что и `GET /users/{id}`.\n\n### Шаг 2. Метод в клиенте\n\nДобавляем в `UsersClient`, рядом с остальными методами, по той же схеме \"сначала `_api`-метод, затем — при необходимости — высокоуровневый\":\n\n```python\n# clients/users/users_client.py\n\nclass UsersClient(APIClient):\n    # ...существующие методы без изменений...\n\n    def update_user_api(self, user_id: int, request: UpdateUserRequestSchema) -> Response:\n        return self.patch(\n            f\"/users/{user_id}\",\n            json=request.model_dump(exclude_none=True),\n        )\n\n    def update_user(self, user_id: int, request: UpdateUserRequestSchema) -> UserSchema:\n        response = self.update_user_api(user_id, request)\n        return UserSchema.model_validate_json(response.text)\n```\n\nРазберём то, чего раньше не было в клиенте:\n\n- `self.patch(...)` — метод из базового `APIClient` (урок 3.7), уже готов к использованию, ничего дополнительно реализовывать не нужно.\n- `request.model_dump(exclude_none=True)` — важная деталь. Так как все поля `UpdateUserRequestSchema` опциональны и по умолчанию равны `None`, обычный `model_dump()` отправил бы в API поля со значением `None` для всех незаполненных атрибутов. `exclude_none=True` убирает из итогового словаря поля, равные `None`, — в теле запроса останутся только те поля, которые студент реально захотел изменить. Это именно та семантика, которую и подразумевает PATCH (урок 3.2).\n- `update_user_api` возвращает сырой `Response` — пригодится для негативных тестов и проверки статус-кода.\n- `update_user` сразу возвращает провалидированный `UserSchema` — пригодится для happy-path тестов, где удобно проверить конкретные поля через атрибуты.\n\n### Шаг 3. Импорт новой схемы\n\nНе забудь обновить импорт в начале `users_client.py`:\n\n```python\nfrom clients.users.users_schema import (\n    CreateUserRequestSchema,\n    CreateUserResponseSchema,\n    UpdateUserRequestSchema,  # добавили\n    UserSchema,\n)\n```\n\n## Пример\n\nИспользование нового метода в тесте — по тому же паттерну, что и `test_create_user` из урока 3.12:\n\n```python\ndef test_update_user_name(users_client: UsersClient):\n    request = UpdateUserRequestSchema(name=\"New Name\")\n\n    updated_user = users_client.update_user(user_id=1, request=request)\n\n    assert updated_user.name == \"New Name\"\n```\n\nА вот пример клиентской (не серверной) негативной проверки, о которой шла речь выше — она не делает ни одного сетевого запроса:\n\n```python\nimport pytest\nfrom pydantic import ValidationError\n\n\ndef test_update_user_invalid_email_is_rejected_by_schema():\n    with pytest.raises(ValidationError):\n        UpdateUserRequestSchema(email=\"not-an-email\")\n```\n\nТакой тест ловит ошибку валидации раньше, чем она вообще могла бы стать проблемой на реальном API — это ценно само по себе, независимо от того, как именно ведёт себя конкретный бэкенд.\n\n## Частые ошибки\n\n- Забыть `exclude_none=True` при сериализации `UpdateUserRequestSchema` — тогда в PATCH-запрос уйдут лишние поля со значением `null`, и метод перестанет вести себя как частичное обновление.\n- Сделать все поля в схеме запроса обязательными — тогда придётся передавать вообще все поля пользователя при любом, даже самом маленьком, изменении, что противоречит смыслу PATCH.\n- Добавить новый метод в середину класса произвольным образом, ломая порядок \"сначала все `_api`-методы, потом высокоуровневые\" — нарушение уже сложившегося в файле соглашения затрудняет чтение кода для следующего человека.\n- Не обновить импорты после добавления новой схемы и словить `NameError` при первом запуске.\n\n## Мини-задание\n\nВ своём форке `boilerplate/` добавь `UpdateUserRequestSchema` в `users_schema.py` и `update_user_api`/`update_user` в `users_client.py`, как показано выше. Напиши и запусти локально (`pytest -m api -v`) тест `test_update_user_name`, проверяющий, что после `update_user(user_id=1, request=UpdateUserRequestSchema(name=\"New Name\"))` поле `name` в ответе действительно равно `\"New Name\"`. Это и есть первый шаг домашнего задания — подробное описание и критерии готовности смотри в следующем уроке.\n", "hasPractice": true, "quiz": [{"question": "Почему при сериализации UpdateUserRequestSchema перед отправкой PATCH-запроса используется request.model_dump(exclude_none=True), а не просто request.model_dump()?", "options": ["Чтобы ускорить сериализацию модели в JSON", "Потому что model_dump() без аргументов вообще не работает для моделей с опциональными полями", "Чтобы в тело запроса попали только реально переданные (изменяемые) поля, а не все поля со значением None — иначе PATCH перестанет быть частичным обновлением", "Чтобы автоматически перевести все поля в camelCase перед отправкой"], "correct": 2, "explain": "Все поля UpdateUserRequestSchema опциональны и по умолчанию равны None. exclude_none=True убирает из запроса незаполненные поля, сохраняя семантику PATCH — отправлять только то, что реально нужно изменить."}, {"question": "Что уже существует в UsersClient до выполнения шагов этого урока, но не покрыто тестами в test_users.py?", "options": ["update_user_api", "create_user_api", "delete_user_api", "get_user_api"], "correct": 2, "explain": "В уроке явно указано, что delete_user_api уже существует в клиенте, но для него ещё нет ни одного теста — это нужно исправить в домашнем задании."}, {"question": "Зачем в UpdateUserRequestSchema для поля email используется EmailStr, а не обычный str, как объясняется в уроке?", "options": ["EmailStr автоматически генерирует случайный email, если он не указан", "EmailStr не даст создать запрос с заведомо невалидным email — UpdateUserRequestSchema(email=\"not-an-email\") упадёт с ValidationError ещё до похода в сеть", "EmailStr работает быстрее, чем str, при сериализации", "EmailStr обязателен по правилам PEP 8"], "correct": 1, "explain": "EmailStr валидирует формат email на этапе создания модели — попытка передать некорректный email приведёт к ValidationError ещё до отправки запроса, что само по себе полезный негативный тест."}, {"question": "Почему для ответа update_user используется уже существующая UserSchema, а не отдельная новая схема?", "options": ["Потому что ответ PATCH всегда пустой, и схема не имеет значения", "Потому что Pydantic не позволяет создавать новые схемы для PATCH-запросов", "Потому что JSONPlaceholder на PATCH /users/{id} для существующих id возвращает полноценный объект пользователя той же формы, что и GET /users/{id}", "Потому что UserSchema — единственная доступная схема в проекте"], "correct": 2, "explain": "На демо-API PATCH-запрос к существующему пользователю возвращает полный объект той же формы, что и GET — поэтому переиспользование UserSchema обосновано и не требует новой схемы."}, {"question": "Какого соглашения о порядке методов в классе стоит придерживаться, добавляя update_user_api и update_user в UsersClient, согласно разделу «Частые ошибки»?", "options": ["Сортировать методы строго по алфавиту, независимо от их роли", "Добавлять новые методы в начало класса, перед всеми остальными", "Порядок методов в классе не имеет никакого значения", "Придерживаться уже сложившегося порядка: сначала все _api-методы, затем высокоуровневые — это упрощает чтение кода"], "correct": 3, "explain": "Нарушение уже сложившегося в файле соглашения (сначала _api-методы, потом высокоуровневые) затрудняет чтение кода для следующего человека — стоит следовать уже принятому в проекте порядку."}]}, {"id": "p60", "section": "Модуль 3 · API-тестирование", "subgroup": "Неделя 7", "isOverview": false, "num": "3.14", "title": "Домашнее задание", "content": "# 3.14. Домашнее задание\n\n## Формулировка\n\nОткрой PR в свой форк общего репозитория (`boilerplate/`) с 5–7 новыми API-тестами. Тесты должны опираться на новые методы `UsersClient`, которые ты добавишь по образцу урока 3.13, а не на голые вызовы `requests`.\n\nМинимальный набор изменений:\n\n1. **Добавь `UpdateUserRequestSchema`** в `clients/users/users_schema.py` — все поля опциональны (`name`, `username`, `email`), под частичное обновление через PATCH. Используй `EmailStr` для поля `email`, как в уже существующей `UserSchema`.\n2. **Добавь `update_user_api` и `update_user`** в `clients/users/users_client.py` — по паттерну \"низкоуровневый метод возвращает `Response`, высокоуровневый — Pydantic-модель\", как показано в уроке 3.13. Не забудь `exclude_none=True` при сериализации запроса.\n3. **Напиши тесты на `update_user_api`/`update_user`** — как минимум один happy-path тест (обновление одного поля, проверка через атрибуты ответа).\n4. **Напиши тесты на уже существующий, но пока непокрытый `delete_user_api`** — как минимум один тест, проверяющий успешный статус-код.\n5. **Добавь минимум один \"несчастливый\" тест**, который проверяет не happy path. Хорошие варианты для нашего демо-API (см. пояснение ниже, почему не любой негативный сценарий сюда подходит):\n   - `UpdateUserRequestSchema(email=\"not-an-email\")` должна упасть с `pydantic.ValidationError` ещё до похода в сеть — это валидный и полезный негативный тест, не зависящий от поведения конкретного сервера.\n   - Запрос несуществующего пользователя через `get_user_api` (метод уже есть и уже покрыт тестом в `test_users.py` — используй его как образец, если хочешь написать вариацию, например, с другим граничным id).\n\nИтого у тебя должно получиться 5–7 тестов в `tests/api/test_users.py` (можно дописать в существующий класс `TestUsers` или добавить новые тестовые методы рядом).\n\n### Почему не \"PATCH/DELETE несуществующего пользователя → 404\"\n\nJSONPlaceholder — фейковый API: ничего не сохраняет по-настоящему, а на `PATCH`/`DELETE` для **любого** id (даже несуществующего) отвечает `200 OK`, просто эхом возвращая присланные данные. Это легко проверить самостоятельно:\n\n```bash\ncurl -i -X PATCH https://jsonplaceholder.typicode.com/users/9999 \\\n     -H \"Content-Type: application/json\" -d '{\"name\": \"x\"}'\n# HTTP/1.1 200 OK — а не 404, как можно было бы ожидать от настоящего API\n```\n\nПоэтому тест вида \"обнови несуществующего пользователя и жди 404\" **не сработает** — не из-за ошибки в твоём коде, а потому что сам демо-сервис так не умеет. Это не баг задания, а особенность конкретного публичного API, с которой полезно познакомиться: **не пиши негативный тест, не проверив вручную, как API реально ведёт себя** (через `curl` или Postman) — иначе тест либо не будет иметь смысла, либо будет falsely red/green. Именно поэтому пункт 5 выше явно указывает на клиентскую (Pydantic) валидацию как на надёжный источник негативного сценария для этого демо-API — она не зависит от поведения сервера.\n\n## Критерии \"готово\"\n\n- [ ] Новый метод `update_user_api` (и, по желанию, `update_user`) добавлен в `UsersClient`, который по-прежнему наследуется от `APIClient` — новая архитектура не вводится, используется существующая.\n- [ ] Для запроса на обновление есть Pydantic-схема (`UpdateUserRequestSchema`) с опциональными полями; для ответа переиспользована существующая `UserSchema`.\n- [ ] Все новые тесты используют фикстуру `users_client`, а не создают клиент вручную и не вызывают `requests` напрямую.\n- [ ] Есть минимум 5 тестов, среди них — минимум один явно негативный/граничный сценарий (не только happy path).\n- [ ] Один из тестов проверяет уже существующий `delete_user_api` (ранее непокрытый).\n- [ ] `pytest -m api -v` проходит локально зелёным целиком, включая уже существовавшие до тебя тесты.\n- [ ] PR открыт в общий репозиторий, в описании — что сделано и как проверить (см. правила PR в `boilerplate/README.md`).\n\n## Что не входит в это домашнее задание\n\nAllure-разметка (`allure.step`, `allure.title`) — это тема модуля 5. В существующих тестах она уже есть, и ты можешь по аналогии добавить её в свои новые тесты (это не будет лишним), но отсутствие Allure-декораторов не считается недочётом на этом этапе — критерии \"готово\" выше их не требуют.\n", "hasPractice": false}, {"id": "p61", "section": "Модуль 4 · Playwright + POM", "subgroup": null, "isOverview": true, "num": null, "title": "Модуль 4. Playwright (Python) + Page Object Model", "content": "# Модуль 4. Playwright (Python) + Page Object Model\n\nНедели 8–10. Источник материала: `stepik-playwright-ui-testing` (разделы 03, 04, 06), переписано под этот курс и под `boilerplate/`.\n\nК концу модуля ты умеешь открывать реальную веб-страницу, находить на ней элементы через локаторы, взаимодействовать с формами и проверять результат — и делаешь это не как набор разрозненных вызовов Playwright внутри теста, а через Page Object, наследуемый от общего `BasePage` из `boilerplate/`.\n\n## Неделя 8 — HTML, DOM, локаторы, Playwright\n\n| Урок | Тема |\n|---|---|\n| 4.1 | HTML и DOM: как устроена веб-страница с точки зрения автотеста |\n| 4.2 | DevTools: смотрим на страницу глазами браузера |\n| 4.3 | CSS-локаторы: как объяснить Playwright, что искать |\n| 4.4 | Локаторы учебного приложения: собираем таблицу для будущих тестов |\n| 4.5 | Что такое Playwright и зачем он нужен |\n\n## Неделя 9 — первый скрипт, ожидания, формы, попапы\n\n| Урок | Тема |\n|---|---|\n| 4.6 | Первый Playwright-скрипт: goto, locator, fill, click |\n| 4.7 | Автоматические ожидания и `expect()` |\n| 4.8 | Работа с формами: fill, click, select, чекбоксы |\n| 4.9 | Попапы, алерты и модальные окна |\n| 4.10 | Проверка состояния страницы через `expect()` |\n\n## Неделя 10 — Page Object Model на примере boilerplate\n\n| Урок | Тема |\n|---|---|\n| 4.11 | Зачем нужен PageObject: проблема \"тест знает слишком много\" |\n| 4.12 | Разбираем `BasePage` построчно |\n| 4.13 | Разбираем `RegistrationPage` построчно |\n| 4.14 | Разбираем `DashboardPage` построчно |\n| 4.15 | Фикстуры для Page Object в `conftest.py` |\n| 4.16 | Добавляем новый Page Object: шаблон на примере `LoginPage` |\n| — | Домашнее задание модуля (`99_Домашнее_задание.md`) |\n\n## Итог модуля\n\n2–3 UI-теста на реальном учебном приложении, оформленные как PR в общий репозиторий `boilerplate/`: новый Page Object по образцу `RegistrationPage`/`DashboardPage`, фикстуры в `conftest.py`, тесты с `@pytest.mark.ui` и `allure.step`.\n\n## Что уже должно быть готово к старту модуля\n\n- Форкнутый `boilerplate/` (с модуля 2).\n- Рабочее окружение: `pip install -r requirements.txt`, `playwright install chromium`.\n- Пройденный модуль 1 (pytest, fixtures, conftest) — в модуле 4 мы не объясняем `pytest` заново, только используем уже знакомую фикстуру `page` от `pytest-playwright`.\n", "hasPractice": false}, {"id": "p62", "section": "Модуль 4 · Playwright + POM", "subgroup": "Неделя 10", "isOverview": false, "num": "4.11", "title": "Зачем нужен PageObject: проблема \"тест знает слишком много\"", "content": "# 4.11. Зачем нужен PageObject: проблема \"тест знает слишком много\"\n\n## Зачем это нужно\n\nС этого урока мы переходим от отдельных скриптов к архитектуре, на которой построен весь `boilerplate/` — общий репозиторий, в который ты будешь сдавать домашки начиная с модуля 2. Понимание того, зачем нужен Page Object, важно не для сдачи теста на знание термина, а для того, чтобы твои будущие Page Object'ы (например, `LoginPage` в домашнем задании этого модуля) вписывались в существующую архитектуру, а не ломали её.\n\n## Теория\n\n### Тест, который писали бы без Page Object\n\nК концу недели 9 у нас есть рабочий сценарий регистрации. Если записать его прямо в тестовую функцию, получится примерно так:\n\n```python\npage.goto(\"https://nikita-filonov.github.io/qa-automation-engineer-ui-course/#/auth/registration\")\n\npage.locator(\"[data-testid='registration-form-email-input'] input\").fill(user_data[\"email\"])\npage.locator(\"[data-testid='registration-form-username-input'] input\").fill(user_data[\"username\"])\npage.locator(\"[data-testid='registration-form-password-input'] input\").fill(user_data[\"password\"])\npage.locator(\"[data-testid='registration-page-registration-button']\").click()\n```\n\nСейчас, пока в проекте один тест и один сценарий, это выглядит нормально. Но представим, что проект начал расти — появились новые проверки: регистрация с пустым паролем, с уже занятым email, с некорректным email, логин, выход из системы. Практически каждый такой тест будет заново использовать одни и те же локаторы:\n\n```python\n\"[data-testid='registration-form-email-input'] input\"\n\"[data-testid='registration-form-username-input'] input\"\n\"[data-testid='registration-form-password-input'] input\"\n\"[data-testid='registration-page-registration-button']\"\n```\n\n### Почему дублирование локаторов — это проблема\n\nПредставим, что разработчик поменял разметку и локатор поля email превратился из `[data-testid='registration-form-email-input']` в `[data-testid='registration-email-input']`. Если этот локатор скопирован в десять тестов — исправлять придётся в десяти местах. В пятьдесят тестов — в пятидесяти. Причём проблема не только в объёме правок: чем больше копий одного и того же кода, тем выше шанс что-то пропустить и получить нестабильные тесты, которые проходят или падают в зависимости от того, где именно забыли обновить локатор.\n\n### Почему это делает тест менее читаемым\n\nДаже если бы локаторы никогда не менялись, есть вторая проблема. Представь не четыре строки с `page.locator(...)`, а сорок. Тест начинает описывать не сценарий пользователя, а технические детали реализации страницы: CSS-селекторы, вызовы Playwright, промежуточные переменные. При этом реальный сценарий очень простой:\n\n1. Открыть страницу регистрации.\n2. Заполнить форму.\n3. Нажать кнопку регистрации.\n4. Проверить, что открылся Dashboard.\n\nПолучается, что для компьютера тест понятен, а для человека — уже не очень.\n\n### Идея Page Object\n\nРешение — паттерн **Page Object**. Каждая страница приложения описывается отдельным классом (`RegistrationPage`, `DashboardPage`). Внутри такого класса находятся локаторы, действия пользователя и проверки, относящиеся именно к этой странице. Тест перестаёт работать напрямую с локаторами — вместо этого он работает с объектами страниц.\n\nБыло (тест разговаривает с Playwright напрямую):\n\n```\nнайди поле email\nзаполни поле email\nнайди поле username\nзаполни поле username\nнайди кнопку\nнажми кнопку\n```\n\nСтало (тест разговаривает на уровне пользовательских действий):\n\n```python\nregistration_page.fill_registration_form(...)\nregistration_page.click_registration_button()\n```\n\nПоявляется разделение ответственности: тест отвечает на вопрос \"что делает пользователь\", а класс страницы — на вопрос \"как именно это реализовано технически\" (какие локаторы, как найти кнопку, как проверить состояние). Если локатор поля email изменится, исправление потребуется внести только в одном месте — внутри `RegistrationPage`. Все тесты, использующие эту страницу, продолжат работать без изменений.\n\nВажно понимать: Page Object — это не особенность Playwright и не возможность pytest. Это архитектурный паттерн организации автотестов, который используется во многих инструментах и языках.\n\n## Пример\n\nВ `boilerplate/` этот паттерн уже реализован и работает — не как учебный пример \"как могло бы быть\", а как проверенный код, против которого реально проходит `pytest -m ui`:\n\n```\nboilerplate/\n├── pages/\n│   ├── base_page.py\n│   ├── registration_page.py\n│   └── dashboard_page.py\n├── tests/ui/\n│   └── test_registration.py\n└── conftest.py\n```\n\nВ следующих четырёх уроках мы разберём эти файлы построчно — не для того, чтобы переписать их (их менять не нужно), а чтобы понимать, по какому образцу добавлять новые страницы.\n\n## Частые ошибки\n\n- Считать, что Page Object — это обязательно много кода и сложная архитектура. На практике, как ты увидишь в `DashboardPage`, класс может быть совсем небольшим — ровно настолько большим, насколько того требуют тесты.\n- Пытаться засунуть в один Page Object сразу несколько разных страниц приложения \"для экономии файлов\" — это возвращает ту же проблему дублирования и путаницы, от которой паттерн должен избавлять.\n- Путать Page Object с фикстурами pytest — это разные вещи, которые, как мы увидим на уроке 4.15, отлично работают вместе: фикстура создаёт объект Page Object и передаёт его в тест.\n\n## Мини-задание\n\nОткрой `boilerplate/tests/ui/test_registration.py` и `boilerplate/pages/registration_page.py`. Не читая пока подробностей реализации, просто сосчитай: сколько раз в тесте встречается `page.locator(...)` напрямую и сколько раз — вызов метода объекта `registration_page`. Сравни с тем, как выглядел бы этот же тест без Page Object (пример в начале урока).\n", "hasPractice": true, "quiz": [{"question": "В чём главная проблема, которую решает паттерн Page Object?", "options": ["Он автоматически генерирует локаторы по скриншоту страницы", "Он ускоряет выполнение тестов за счёт параллельного запуска браузеров", "Он убирает необходимость использовать pytest в UI-тестах", "Он устраняет дублирование локаторов и деталей реализации страницы между тест
