<meta charset="utf-8">
<title>QA Course Reader</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<style>
  :root{
    --paper:#f2f4f0;
    --surface:#e7ebe4;
    --surface-2:#dde3d9;
    --line:#cdd5c8;
    --ink:#1a2320;
    --muted:#5c6660;
    --accent:#1f6f5c;
    --accent-ink:#f3faf6;
    --accent-soft:#d9ebe2;
    --danger:#a8432f;
    --code-bg:#e6ebe3;
    --shadow: 0 1px 0 rgba(20,30,25,.04);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#101513;
      --surface:#171d1a;
      --surface-2:#1e2622;
      --line:#2b3530;
      --ink:#e8ede9;
      --muted:#8b9993;
      --accent:#54d8ae;
      --accent-ink:#062018;
      --accent-soft:#1c3a30;
      --danger:#e08a75;
      --code-bg:#151b18;
      --shadow: 0 1px 0 rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"]{
    --paper:#101513;
    --surface:#171d1a;
    --surface-2:#1e2622;
    --line:#2b3530;
    --ink:#e8ede9;
    --muted:#8b9993;
    --accent:#54d8ae;
    --accent-ink:#062018;
    --accent-soft:#1c3a30;
    --danger:#e08a75;
    --code-bg:#151b18;
    --shadow: 0 1px 0 rgba(0,0,0,.3);
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Source Serif 4', Georgia, 'Times New Roman', serif;
    height:100dvh;
    overflow:hidden;
  }
  .mono{font-family:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;}

  a{color:var(--accent);}
  ::selection{background:var(--accent-soft);}

  .app{
    display:grid;
    grid-template-columns: 320px 1fr;
    height:100dvh;
  }

  /* ---------- Sidebar ---------- */
  .sidebar{
    background:var(--surface);
    border-right:1px solid var(--line);
    display:flex;
    flex-direction:column;
    min-width:0;
    height:100dvh;
  }
  .brand{
    padding:20px 18px 14px;
    border-bottom:1px solid var(--line);
  }
  .brand-title{
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size:13px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--ink);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .brand-title .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block;flex:none;}
  .brand-sub{margin-top:4px;font-size:12px;color:var(--muted);}

  .progress-wrap{padding:12px 18px;border-bottom:1px solid var(--line);}
  .progress-line{
    display:flex;justify-content:space-between;align-items:baseline;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;color:var(--muted);letter-spacing:.03em;margin-bottom:6px;
  }
  .progress-line b{color:var(--ink);font-weight:600;}
  .progress-track{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line);}
  .progress-fill{height:100%;background:var(--accent);border-radius:3px 0 0 3px;transition:width .25s ease;}

  .search-wrap{padding:10px 18px;border-bottom:1px solid var(--line);}
  .search-input{
    width:100%;
    font:13px/1.4 'JetBrains Mono', monospace;
    padding:7px 10px;
    border:1px solid var(--line);
    border-radius:6px;
    background:var(--paper);
    color:var(--ink);
  }
  .search-input:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .search-input::placeholder{color:var(--muted);}

  .nav{
    flex:1;
    overflow-y:auto;
    padding:8px 0 24px;
  }
  .nav-section{border-bottom:1px solid var(--line);}
  .nav-section:last-child{border-bottom:none;}
  .nav-section summary{
    list-style:none;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding:10px 18px;
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    font-weight:600;
    letter-spacing:.02em;
    color:var(--ink);
  }
  .nav-section summary::-webkit-details-marker{display:none;}
  .nav-section summary .chev{color:var(--muted);transition:transform .15s ease;flex:none;}
  .nav-section[open] summary .chev{transform:rotate(90deg);}
  .nav-section summary .count{color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums;}
  .nav-body{padding-bottom:6px;}

  .nav-subgroup-label{
    padding:6px 18px 4px 26px;
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--muted);
  }

  .nav-item{
    display:flex;
    width:100%;
    align-items:flex-start;
    gap:8px;
    padding:6px 18px 6px 26px;
    background:none;
    border:none;
    text-align:left;
    cursor:pointer;
    font-family:inherit;
    color:var(--ink);
  }
  .nav-item:hover{background:var(--surface-2);}
  .nav-item.active{background:var(--accent-soft);}
  .nav-item .status{
    flex:none;
    width:9px;height:9px;
    margin-top:5px;
    border-radius:50%;
    border:1.5px solid var(--muted);
    background:transparent;
  }
  .nav-item.done .status{background:var(--accent);border-color:var(--accent);}
  .nav-item .num{
    flex:none;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--muted);
    margin-top:1px;
    min-width:30px;
  }
  .nav-item .label{font-size:13.5px;line-height:1.35;}
  .nav-item.overview .label{font-weight:600;}
  .nav-item[hidden]{display:none;}

  /* ---------- Content ---------- */
  .content-scroll{
    height:100dvh;
    overflow-y:auto;
  }
  .content-header{
    position:sticky;top:0;
    background:var(--paper);
    border-bottom:1px solid var(--line);
    padding:14px 40px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    z-index:2;
  }
  .crumb{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:var(--muted);
    letter-spacing:.02em;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .crumb b{color:var(--ink);}
  .header-actions{display:flex;align-items:center;gap:10px;flex:none;}
  .btn{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    font-weight:600;
    padding:7px 12px;
    border-radius:6px;
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--ink);
    cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;
    white-space:nowrap;
  }
  .btn:hover{border-color:var(--accent);}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .btn.done{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
  .btn.icon{padding:7px 9px;}

  .article-wrap{
    padding:8px 40px 96px;
    display:grid;
    grid-template-columns: minmax(24px,1fr) min(72ch,100%) minmax(180px,1fr);
    gap:0 32px;
  }
  .article{grid-column:2;width:100%;padding-top:28px;min-width:0;}

  .toc-rail{
    grid-column:3;
    justify-self:start;
    position:sticky;
    top:76px;
    width:210px;
    max-width:100%;
    padding-top:28px;
  }
  .toc-rail-title{
    font-family:'JetBrains Mono', monospace;font-size:11px;font-weight:600;
    text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px;
  }
  .toc-rail a{
    display:block;font-size:13px;line-height:1.4;color:var(--muted);text-decoration:none;
    padding:4px 0 4px 11px;border-left:2px solid var(--line);margin-bottom:1px;
  }
  .toc-rail a:hover{color:var(--ink);border-left-color:var(--accent);}
  .toc-rail a.active{color:var(--ink);border-left-color:var(--accent);font-weight:600;}

  @media (max-width:1240px){
    .article-wrap{display:flex;justify-content:center;}
    .toc-rail{display:none;}
  }

  .kicker{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:var(--accent);
    text-transform:uppercase;
    letter-spacing:.08em;
    margin:0 0 10px;
  }

  .article h1{
    font-family:'Source Serif 4', serif;
    font-size:32px;
    font-weight:700;
    line-height:1.2;
    text-wrap:balance;
    margin:0 0 22px;
    padding-bottom:16px;
    border-bottom:2px solid var(--ink);
  }
  .article h2{
    font-family:'JetBrains Mono', monospace;
    font-size:12.5px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--accent);
    margin:36px 0 12px;
    padding-bottom:8px;
    border-bottom:1px solid var(--line);
  }
  .article h3{
    font-family:'JetBrains Mono', monospace;
    font-size:14px;
    font-weight:600;
    margin:26px 0 8px;
    color:var(--ink);
  }
  .article p{font-size:16.5px;line-height:1.68;margin:0 0 16px;}
  .article ul, .article ol{font-size:16.5px;line-height:1.68;margin:0 0 16px;padding-left:1.3em;}
  .article li{margin-bottom:6px;}
  .article li > ul, .article li > ol{margin-top:6px;}
  .article strong{font-weight:700;}
  .article blockquote{
    margin:0 0 16px;
    padding:2px 18px;
    border-left:3px solid var(--accent);
    color:var(--muted);
    font-style:italic;
  }
  .article blockquote p{margin:8px 0;}
  .article hr{border:none;border-top:1px solid var(--line);margin:32px 0;}

  .article code{
    font-family:'JetBrains Mono', monospace;
    font-size:.88em;
    background:var(--code-bg);
    border:1px solid var(--line);
    border-radius:4px;
    padding:.12em .4em;
  }
  .article pre{
    background:var(--code-bg);
    border:1px solid var(--line);
    border-left:3px solid var(--accent);
    border-radius:6px;
    padding:14px 16px;
    overflow-x:auto;
    margin:0 0 20px;
  }
  .article pre code{
    background:none;border:none;padding:0;
    font-size:13px;line-height:1.6;
  }

  .article table{border-collapse:collapse;width:100%;margin:0 0 20px;font-size:14.5px;}
  .article table{overflow-x:auto;display:block;}
  .article th, .article td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top;}
  .article th{background:var(--surface);font-family:'JetBrains Mono', monospace;font-size:12px;text-transform:uppercase;letter-spacing:.03em;}
  .article td code, .article th code{white-space:nowrap;}

  .article img{max-width:100%;border-radius:6px;border:1px solid var(--line);}

  .pager{
    max-width:70ch;margin:44px auto 0;
    display:flex;justify-content:space-between;gap:16px;
    border-top:1px solid var(--line);
    padding-top:20px;
  }
  .pager-btn{
    flex:1;max-width:48%;
    display:flex;flex-direction:column;gap:4px;
    padding:12px 14px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--surface);
    color:var(--ink);
    cursor:pointer;
    text-align:left;
  }
  .pager-btn:hover{border-color:var(--accent);}
  .pager-btn.next{margin-left:auto;text-align:right;align-items:flex-end;}
  .pager-btn .dir{font-family:'JetBrains Mono', monospace;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}
  .pager-btn .ttl{font-size:14px;font-weight:600;}
  .pager-spacer{flex:1;max-width:48%;}
  .pager-btn.disabled{opacity:.5;cursor:not-allowed;}
  .pager-btn.disabled:hover{border-color:var(--line);}

  /* ---------- lock state ---------- */
  .nav-item.locked{opacity:.4;cursor:not-allowed;}
  .nav-item.locked:hover{background:none;}
  .lock-icon{flex:none;width:9px;height:9px;margin-top:5px;color:var(--muted);}
  .lock-icon svg{display:block;width:100%;height:100%;}

  /* ---------- gate: practice check + quiz ---------- */
  .gate{
    margin-top:36px;
    border:1px solid var(--line);
    border-radius:10px;
    background:var(--surface);
    padding:20px 22px;
  }
  .gate-title{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
    color:var(--ink);margin:0 0 16px;
    display:flex;align-items:center;gap:8px;
  }
  .gate-row{margin-bottom:18px;}
  .gate-row:last-child{margin-bottom:0;}
  .gate-check{display:flex;align-items:flex-start;gap:10px;font-size:14.5px;cursor:pointer;line-height:1.5;}
  .gate-check input{margin-top:4px;flex:none;width:15px;height:15px;accent-color:var(--accent);}
  .gate-progress{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:0 0 8px;}
  .gate-q{font-size:15.5px;font-weight:600;margin:0 0 12px;line-height:1.45;}
  .gate-options{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;}
  .gate-option{
    display:flex;align-items:flex-start;gap:10px;
    padding:10px 12px;border:1px solid var(--line);border-radius:7px;
    cursor:pointer;font-size:14.5px;line-height:1.45;background:var(--paper);
  }
  .gate-option:hover{border-color:var(--accent);}
  .gate-option input{margin-top:3px;flex:none;width:14px;height:14px;accent-color:var(--accent);}
  .gate-option.picked{border-color:var(--accent);}
  .gate-option.correct{border-color:var(--accent);background:var(--accent-soft);}
  .gate-option.wrong{border-color:var(--danger);background:rgba(168,67,47,.1);}
  .gate-option.disabled{cursor:default;}
  .gate-feedback{font-size:14px;padding:10px 12px;border-radius:7px;margin-bottom:14px;}
  .gate-feedback.ok{background:var(--accent-soft);color:var(--ink);}
  .gate-feedback.bad{background:rgba(168,67,47,.12);color:var(--ink);}
  .gate-done{display:flex;align-items:center;gap:8px;color:var(--accent);font-weight:600;font-size:14px;margin-bottom:14px;}
  .gate-done-actions{display:flex;flex-wrap:wrap;gap:10px;}
  .gate-retake{color:var(--muted);}
  .gate-retake:hover{color:var(--ink);border-color:var(--danger);}
  .gate-hint{font-size:13px;color:var(--muted);margin-top:10px;}
  .gate-check-btn{margin-top:2px;}

  /* ---------- playground (Pyodide code exercise) ---------- */
  .pg{margin-bottom:4px;}
  .pg-prompt{font-size:14.5px;line-height:1.6;margin:0 0 14px;}
  .pg-editor{
    border:1px solid var(--line);
    border-radius:7px;
    overflow:hidden;
    margin-bottom:10px;
  }
  .pg-editor .CodeMirror{
    height:auto;
    min-height:140px;
    max-height:420px;
    overflow-y:auto;
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    line-height:1.55;
    background:var(--code-bg);
    color:var(--ink);
  }
  .pg-editor .CodeMirror-gutters{background:var(--code-bg);border-right:1px solid var(--line);}
  .pg-editor .CodeMirror-linenumber{color:var(--muted);}
  .pg-editor .CodeMirror-cursor{border-left:1.5px solid var(--accent);}
  .pg-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .pg-status{font-size:12.5px;color:var(--muted);}
  .pg-output{display:flex;flex-direction:column;gap:6px;margin-bottom:6px;}
  .pg-test-row{
    display:flex;align-items:flex-start;gap:8px;
    font-family:'JetBrains Mono', monospace;font-size:12.5px;line-height:1.5;
    padding:7px 10px;border-radius:6px;border:1px solid var(--line);background:var(--paper);
  }
  .pg-test-row.pass{border-color:var(--accent);}
  .pg-test-row.fail{border-color:var(--danger);}
  .pg-test-mark{flex:none;font-weight:700;}
  .pg-test-row.pass .pg-test-mark{color:var(--accent);}
  .pg-test-row.fail .pg-test-mark{color:var(--danger);}
  .pg-test-msg{color:var(--muted);margin-top:2px;}
  .pg-stdout{
    font-family:'JetBrains Mono', monospace;font-size:12.5px;white-space:pre-wrap;
    background:var(--code-bg);border:1px solid var(--line);border-radius:6px;
    padding:10px 12px;margin-top:6px;color:var(--ink);
  }
  .pg-summary{font-size:13.5px;font-weight:600;margin:8px 0 0;}
  .pg-summary.ok{color:var(--accent);}
  .pg-summary.bad{color:var(--danger);}

  /* ---------- Mobile ---------- */
  .menu-btn{display:none;}
  .scrim{
    position:fixed;inset:0;background:rgba(10,14,12,.45);
    opacity:0;pointer-events:none;transition:opacity .2s ease;z-index:9;
  }
  .scrim.show{opacity:1;pointer-events:auto;}
  @media (max-width:820px){
    .app{grid-template-columns:1fr;}
    .sidebar{
      position:fixed;inset:0 auto 0 0;
      width:86vw;max-width:340px;
      transform:translateX(-100%);
      transition:transform .2s ease;
      z-index:10;
      box-shadow:2px 0 24px rgba(0,0,0,.25);
    }
    .sidebar.open{transform:translateX(0);}
    .menu-btn{display:inline-flex;}
    .content-header{padding:12px 18px;}
    .article-wrap{padding:8px 18px 72px;}
    .crumb{display:none;}
  }

  [hidden]{display:none !important;}

  /* ---------- syntax highlighting (hljs classes), tied to tokens ---------- */
  .hljs{color:var(--ink);}
  .hljs-comment, .hljs-quote{color:var(--muted);font-style:italic;}
  .hljs-keyword, .hljs-selector-tag, .hljs-literal, .hljs-subst{color:var(--accent);font-weight:600;}
  .hljs-string, .hljs-doctag, .hljs-regexp{color:#a1662f;}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .hljs-string{color:#e0a86a;} }
  :root[data-theme="dark"] .hljs-string{color:#e0a86a;}
  .hljs-number, .hljs-symbol{color:#7a6fd6;}
  .hljs-title, .hljs-title.function_, .hljs-title.class_, .hljs-section{color:var(--ink);font-weight:700;}
  .hljs-attr, .hljs-attribute, .hljs-variable, .hljs-template-variable, .hljs-params{color:var(--ink);}
  .hljs-built_in, .hljs-type, .hljs-class{color:#3a7bd5;}
  .hljs-meta, .hljs-meta .hljs-keyword{color:var(--muted);}
  .hljs-deletion{background:rgba(168,67,47,.15);}
  .hljs-addition{background:rgba(31,111,92,.15);}
  .hljs-emphasis{font-style:italic;}
  .hljs-strong{font-weight:700;}

  /* ---------- auth gate ---------- */
  .auth-gate{
    position:fixed;inset:0;z-index:50;
    display:flex;align-items:center;justify-content:center;
    background:var(--paper);
  }
  .auth-box{
    width:min(360px, 90vw);
    display:flex;flex-direction:column;gap:12px;
    padding:28px 26px;border:1px solid var(--line);border-radius:10px;
    background:var(--surface);box-shadow:var(--shadow);
  }
  .auth-hint{margin:0 0 4px;color:var(--muted);font-size:13.5px;}
  .auth-input{
    font:inherit;font-family:'JetBrains Mono', monospace;font-size:13.5px;
    padding:10px 12px;border:1px solid var(--line);border-radius:6px;
    background:var(--paper);color:var(--ink);
  }
  .auth-input:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .auth-error{margin:0;color:var(--danger);font-size:12.5px;}
  .btn-accent{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}

  /* ---------- teacher dashboard ---------- */
  .teacher-dash{position:fixed;inset:0;z-index:40;overflow:auto;background:var(--paper);}
  .teacher-dash-inner{max-width:960px;margin:0 auto;padding:40px 24px 80px;}
  .teacher-dash-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .teacher-table{width:100%;border-collapse:collapse;margin-top:20px;font-size:13px;}
  .teacher-table th, .teacher-table td{
    text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);
  }
  .teacher-table th{color:var(--muted);font-weight:600;font-family:'JetBrains Mono', monospace;font-size:11px;text-transform:uppercase;letter-spacing:.04em;}
  .teacher-table td.mono{font-family:'JetBrains Mono', monospace;font-size:12.5px;}
  .user-badge{color:var(--muted);font-size:12px;margin-right:2px;white-space:nowrap;}
</style>

<div class="auth-gate" id="auth-gate" hidden>
  <form class="auth-box" id="auth-form">
    <div class="brand-title"><span class="dot"></span>QA AUTOMATION COURSE</div>
    <p class="auth-hint">Войдите, чтобы продолжить курс</p>
    <input class="auth-input" id="auth-email" type="email" placeholder="Email" autocomplete="username" required>
    <input class="auth-input" id="auth-password" type="password" placeholder="Пароль" autocomplete="current-password" required>
    <button class="btn btn-accent" type="submit" id="auth-submit">Войти</button>
    <p class="auth-error" id="auth-error" hidden></p>

<script id="course-data" type="application/json">[{"id": "p1", "section": "О курсе", "subgroup": null, "isOverview": true, "num": null, "title": "QA Automation Course (Python)", "content": "# QA Automation Course (Python)\n\nКурс подготовки QA Automation Engineer с нуля до уровня \"готов к первой работе\": Python → pytest → Git/командная работа → API-тестирование → Playwright/UI → Allure → CI/CD → работа над тикетами в общем репозитории.\n\nКурс собран на основе трёх исходных курсов (Stepik):\n- `stepik-dobry-python-course` — база Python (С. Балакирев)\n- `stepik-playwright-ui-testing` — UI-автоматизация на Playwright\n- `stepik-api-testing-advanced` — API-автоматизация (главы 1–7; главы 8–15 в источнике оказались заглушками платформы, поэтому весь материал по Pytest/Allure/CI/CD в этом курсе написан заново)\n\nФормат: 14 недель, 8 модулей + постоянный параллельный джобсерч-трек с недели 6.\n\n## Структура репозитория\n\n```\nqa-automation-course/\n├── ROADMAP.md               — недельный план, модули, milestones\n├── STYLE_GUIDE.md           — единый формат урока (для авторов и для проверки консистентности)\n├── course_book/             — теория + код + задания по модулям/неделям\n│   ├── 00_module0_python_base/\n│   ├── 01_module1_pytest_env/\n│   ├── 02_module2_git_teamwork/\n│   ├── 03_module3_api_testing/\n│   ├── 04_module4_playwright_pom/\n│   ├── 05_module5_allure/\n│   ├── 06_module6_ci/\n│   └── 07_module7_final_sprint/\n├── boilerplate/              — \"общий репозиторий\": стартовый фреймворк pytest+requests+playwright,\n│                                который студенты форкают начиная с модуля 2\n└── jobsearch_track/          — резюме/поиск работы/английский, отдельно для РФ и Сербии\n```\n\n## Как это использовать\n\n1. Модули 0–1 студент проходит соло (`course_book/00_...`, `01_...`), сдаёт домашки как файлы.\n2. С модуля 2 студент форкает `boilerplate/` в свой GitHub/GitLab — с этого момента все домашки оформляются как PR в общий репозиторий.\n3. Модули 3–5 — это PR к уже существующему `boilerplate/` (API-клиент, Page Object'ы, Allure-шаги), а не вещи \"с нуля\".\n4. Модуль 6 — студент учится читать CI, а не писать pipeline с нуля.\n5. Модуль 7 — \"боевые\" тикеты: багфиксы, ревью, рефакторинг чужого кода в общем репозитории.\n", "hasPractice": false}, {"id": "p2", "section": "О курсе", "subgroup": null, "isOverview": false, "num": null, "title": "Roadmap курса", "content": "# Roadmap курса\n\n14 недель, 8 модулей. С модуля 2 работа идёт в общем репозитории (`boilerplate/`).\nПараллельно, с модуля 6 (не блокирует техническую часть) — джобсерч-трек (`jobsearch_track/`), отдельный для РФ и Сербии.\n\n| Модуль | Недели | Тема | Источник материала | Итог модуля |\n|---|---|---|---|---|\n| 0 | 1–2 | Python-база: синтаксис, типы, функции, файлы/JSON, базовое ООП | `stepik-dobry-python-course` (главы 01–10) | скрипт-парсер публичного API |\n| 1 | 3–4 | pytest как среда: fixtures, conftest, parametrize, маркеры, assert | `stepik-playwright-ui-testing` (05), собственный материал | 10–15 тестов на простых утилитах |\n| 2 | 5+ | Git и командная работа. Старт общего репозитория | `stepik-api-testing-advanced` (04) | первый смёрженный PR в общий репо |\n| 3 | 6–7 | API-тестирование на `requests`: методы, статусы, auth, Pydantic, API-клиент | `stepik-api-testing-advanced` (05–07, HTTPX→requests) | 5–7 API-тестов, PR к существующему api-модулю |\n| 4 | 8–10 | Playwright + Page Object Model | `stepik-playwright-ui-testing` (01–07) | 2–3 UI-теста, PR в общий репозиторий |\n| 5 | 11 | Allure: шаги, título, вложения, отчёт | написано заново (источник — заглушка) | все тесты студента снабжены allure-шагами |\n| 6 | 12 | CI на уровне пользователя: чтение pipeline, диагностика падений | написано заново (источник — заглушка) | студент сам чинит сломанный тест по логам CI |\n| 7 | 13–14 | Финальный спринт: багфиксы, ревью, рефакторинг чужих тестов | — | 10+ PR с ревью в истории каждого студента |\n\n## Почему источники по Allure/CI/API-практике написаны заново\n\nПри выгрузке `stepik-api-testing-advanced` разделы 8–15 (Pytest-практика, Allure, улучшение автотестов, CI/CD, покрытие, AI Review) оказались заблокированы Stepik progression-gate — в файлах только заголовки уроков, без содержимого. Модули 5 и 6 этого курса, а также практическая часть модуля 3, написаны самостоятельно с опорой на структуру из `stepik-playwright-ui-testing` (там есть рабочий раздел про pytest+Playwright) и на стандартные практики индустрии.\n\n## Job-search трек (параллельно, с модуля 6)\n\n- **RU:** резюме, hh.ru/Habr Career, разбор вакансий junior QA automation.\n- **RS (Сербия):** резюме на английском раньше и активнее, LinkedIn, английский для технического собеседования — стартует с модуля 3, а не с модуля 6, т.к. языковой барьер требует больше времени на разгон.\n", "hasPractice": false}, {"id": "p3", "section": "О курсе", "subgroup": null, "isOverview": false, "num": null, "title": "Style guide для уроков курса", "content": "# Style guide для уроков курса\n\nЕдиный формат — чтобы весь курс читался как одна книга, а не как склейка трёх разных.\n\n## Структура файла урока\n\n```markdown\n# N.M. Название урока\n\n## Зачем это нужно\n2–4 предложения: где это встретится в реальной работе QA automation engineer.\n\n## Теория\nОбъяснение своими словами (не копипаста из источника), с минимумом воды.\nКод — во **fenced code block** с указанием языка (```python, ```bash, ```yaml).\n\n## Пример\nРабочий, самодостаточный пример кода. Если это про boilerplate — показать,\nкак метод/тест встраивается в существующую структуру `boilerplate/`, а не\nкак отдельный файл в вакууме.\n\n## Частые ошибки\n2–4 пункта: что обычно ломается у новичков на этой теме.\n\n## Мини-задание\nНебольшая практическая задача на 10–20 минут, привязанная к теме урока.\n\n## Домашнее задание\n(указывается только в последнем уроке недели/темы)\nЧёткая формулировка + критерии \"готово\" (что именно проверяется).\nНачиная с модуля 2 — явно указано, что сдаётся PR-ом в общий репозиторий.\n```\n\n## Язык и тон\n\n- Русский язык, на \"ты\", без канцелярита.\n- Термины — по-английски там, где так принято в индустрии (fixture, assert, locator, pipeline), не изобретать русские кальки.\n- Код и имена переменных/функций — только на английском.\n- Никаких выдуманных фактов про инструменты — если не уверены в деталях версии/API, пишем общий принцип, а не конкретную цифру.\n\n## Нумерация\n\n`N.M` — модуль.урок (например `3.2` = модуль 3, второй урок). Внутри модуля недели — просто подпапки `weekX/`.\n\n## Проверочные вопросы урока (для ридера)\n\nКаждый обычный урок (не `00_overview.md`, не `99_*.md`) сопровождается файлом\n`<то же имя>.quiz.json` рядом с уроком — набор из **4–6 вопросов** с выбором\nответа, которые ридер показывает по одному, друг за другом, как условие\nразблокировки следующего урока.\n\nФормат:\n\n```json\n{\n  \"questions\": [\n    {\n      \"question\": \"Текст вопроса — строго по содержимому ЭТОГО урока\",\n      \"options\": [\"вариант A\", \"вариант B\", \"вариант C\", \"вариант D\"],\n      \"correct\": 2,\n      \"explain\": \"1-2 предложения, почему это верный ответ (показывается после правильного ответа)\"\n    }\n  ]\n}\n```\n\nПравила:\n- От 4 до 6 вопросов на урок, у каждого ровно 4 варианта и ровно один верный (`correct` — индекс с 0).\n- Вопросы должны бить в **разные** аспекты урока (не переформулировки одного и того же факта пятью способами) — если в уроке есть несколько идей/шагов/частых ошибок, каждый хороший кандидат на отдельный вопрос.\n- Каждый вопрос решаем строго по материалу этого урока — не по будущим темам и не по общей эрудиции.\n- Проверяем то, что реально понадобится QA automation инженеру (решение, частую ошибку, \"почему так, а не иначе\") — не дату выхода Python, не синтаксическую экзотику мимо практики курса.\n- Неверные варианты — правдоподобные ошибки новичка, а не абсурдный отвлекающий мусор.\n- Уровень сложности = уровень изложения теории в уроке: не проще и не сложнее.\n- Если в уроке реально мало самостоятельного материала для 4 разных вопросов (короткий, обзорный урок) — можно 3, но это исключение, не норма.\n\n## Playground: код, который реально проверяется (модули 0-1)\n\nДля уроков модулей 0 и 1 (там, где Мини-задание — это чистый Python без сети/браузера)\nрядом с уроком может лежать файл `<то же имя>.exercise.json` — редактор кода прямо в\nридере, с автопроверкой в браузере (через Pyodide — настоящий Python, без бэкенда).\n\nФормат:\n\n```json\n{\n  \"prompt\": \"Короткая формулировка задания (как в Мини-задании, но для интерфейса кода)\",\n  \"starter\": \"def is_adult(age):\\n    # твой код здесь\\n    pass\\n\",\n  \"tests\": \"def test_adult():\\n    assert is_adult(20) is True\\n\\ndef test_minor():\\n    assert is_adult(10) is False\\n\"\n}\n```\n\nКак это работает: код студента и `tests` выполняются в одном пространстве имён —\nфункции/классы из `tests` обращаются к тому, что определил студент, напрямую, без\nимпорта. Раннер находит в `tests` все функции с именем `test_...` и запускает каждую\nотдельно, ловя `assert`.\n\nПравила:\n- `starter` — ровно тот код, который увидит студент при открытии (обычно — сигнатура\n  функции/класса с `pass` или заглушкой), точно соответствующий тому, что просят в\n  существующем разделе \"Мини-задание\" этого урока — **не придумывай новое задание**,\n  переведи существующее в исполняемую форму.\n- `tests` — 3-6 функций `test_...`, каждая с одним чётким `assert` (или парой связанных\n  assert на один и тот же аспект). Проверяй ровно то поведение, которое описано в\n  Мини-задании — не больше и не меньше.\n- Название функции/класса в `starter` должно точно совпадать с тем, что вызывают `tests`.\n- Никаких внешних библиотек, файлового I/O или сети — Pyodide это либо не потянет,\n  либо потянет ненадёжно. Чистые функции на стандартной библиотеке.\n- Сообщения об ошибке ассертов должны быть человекочитаемыми (второй аргумент assert),\n  чтобы студент понимал, что именно не так, а не только \"AssertionError\".\n\n## Как работает переиспользование источников\n\n- Материал из трёх исходных курсов **переписывается**, а не копируется дословно — сохраняем идею, примеры адаптируем под общий репозиторий и единый стиль.\n- Если пример кода в источнике использует несовместимую с курсом библиотеку (например HTTPX там, где у нас `requests`), — адаптируем на лету, сохраняя суть, но не оставляем несоответствий.\n- Исходные курсы (`stepik-*`) — только на чтение, в них ничего не меняем.\n", "hasPractice": false}, {"id": "p4", "section": "О курсе", "subgroup": null, "isOverview": false, "num": null, "title": "boilerplate — общий репозиторий курса", "content": "# boilerplate — общий репозиторий курса\n\nСтартовый фреймворк: `pytest` + `requests` + `playwright`. Именно этот репозиторий студенты\nфоркают начиная с модуля 2 — дальше все домашки оформляются как PR сюда, а не как отдельные проекты.\n\n## Быстрый старт\n\n```bash\npython -m venv .venv && source .venv/bin/activate\npip install -r requirements.txt\nplaywright install chromium\n```\n\nЗапуск всех тестов:\n\n```bash\npytest\n```\n\nЗапуск по группам (маркеры из `pytest.ini`):\n\n```bash\npytest -m unit   # чистые функции, без сети и браузера — модуль 1\npytest -m api    # API-тесты на requests — модуль 3\npytest -m ui     # UI-тесты на Playwright — модуль 4\n```\n\nС Allure-отчётом:\n\n```bash\npytest --alluredir=allure-results\nallure serve allure-results\n```\n\n## Структура\n\n```\nboilerplate/\n├── clients/            # API-клиенты (модуль 3)\n│   ├── api_client.py   # базовый APIClient + BaseUrlSession поверх requests.Session\n│   └── users/          # UsersClient — https://jsonplaceholder.typicode.com\n├── pages/               # Page Object (модуль 4)\n│   ├── base_page.py\n│   ├── registration_page.py\n│   └── dashboard_page.py\n├── tests/\n│   ├── unit/            # модуль 1 — pytest на чистых функциях\n│   ├── api/             # модуль 3\n│   └── ui/              # модуль 4\n├── utils/               # fakers, string_utils\n├── conftest.py          # общие фикстуры + allure-скриншот при падении UI-теста\n├── pytest.ini\n└── .github/workflows/ci.yml, .gitlab-ci.yml   # модуль 6\n```\n\n## На чём построены примеры\n\n- **UI** — публичное учебное приложение из курса Н. Филонова: https://nikita-filonov.github.io/qa-automation-engineer-ui-course/ (страницы регистрации и Dashboard).\n- **API** — публичный демо-API https://jsonplaceholder.typicode.com/users (не требует авторизации, всегда доступен, подходит для отработки GET/POST/PUT/DELETE и Pydantic-схем).\n\n## Правила для PR (с модуля 2)\n\n1. Одна задача — одна ветка — один PR.\n2. В описании PR — что сделано и как проверить.\n3. Перед мёржем — зелёный CI и минимум одно ревью от одногруппника.\n4. Новый API-клиент/Page Object добавляется **рядом** с существующими, по тому же паттерну — не переписывает архитектуру заново.\n", "hasPractice": false}, {"id": "p5", "section": "Модуль 0 · Python-база", "subgroup": null, "isOverview": true, "num": null, "title": "Модуль 0. Python-база", "content": "# Модуль 0. Python-база\n\nНедели 1–2 курса. Цель модуля — не \"выучить Python\", а дойти ровно до того уровня, на котором можно писать простые самостоятельные скрипты и **читать чужой код**, не пугаясь незнакомых конструкций. Именно с этим уровнем ты придёшь в модуль 1 (pytest) и модуль 2 (общий репозиторий), где уже придётся разбираться в чужих файлах, а не только писать свои.\n\nИсточник материала — `stepik-dobry-python-course` (главы 01–09), переработанный под формат курса. Раздел про классы и наследование в исходном курсе отсутствовал — он написан для этого курса отдельно и сразу привязан к реальному коду из `boilerplate/pages/`, с которым ты будешь работать начиная с модуля 4.\n\n## Неделя 1 — синтаксис и типы данных\n\nОт переменных и чисел до словарей и множеств: как Python хранит и обрабатывает данные, какие у него базовые коллекции (списки, кортежи, множества, словари) и как ими пользоваться — включая условные операторы, циклы и генераторы списков. Это тот минимум, без которого невозможно прочитать ни одну строчку тестового кода.\n\n- [0.1. Переменные, типы данных, type() и id()](#p6)\n- [0.2. Числа, логика и сравнения](#p7)\n- [0.3. Строки: индексы, срезы, методы, f-строки](#p8)\n- [0.4. Списки: индексы, срезы, методы, вложенные списки](#p9)\n- [0.5. Условия: if / elif / else, тернарный оператор](#p10)\n- [0.6. Циклы и генераторы списков](#p11)\n- [0.7. Словари, кортежи и множества](#p12)\n\n## Неделя 2 — функции, ООП, файлы и итог модуля\n\nОт функций и `*args/**kwargs` — к первому знакомству с классами и наследованием (на примере `BasePage`/`RegistrationPage` из `boilerplate/`), затем модули и пакеты, работа с файлами и JSON, и набор функциональных инструментов (`map`, `filter`, `zip`, `sorted`). Неделя и модуль завершаются итоговым проектом — самостоятельным скриптом-парсером публичного API.\n\n- [0.8. Функции: def, return, аргументы](#p13)\n- [0.9. *args, **kwargs, распаковка, лямбды](#p14)\n- [0.10. Базовое ООП: классы, __init__, self](#p15)\n- [0.11. Наследование](#p16)\n- [0.12. Модули и пакеты](#p17)\n- [0.13. Файлы и JSON](#p18)\n- [0.14. Генераторы и полезные функции: map, filter, zip, sorted](#p19)\n- [0.15. Итоговый проект модуля — скрипт-парсер публичного API](#p20)\n", "hasPractice": false}, {"id": "p6", "section": "Модуль 0 · Python-база", "subgroup": "Неделя 1", "isOverview": false, "num": "0.1", "title": "Переменные, типы данных, type() и id()", "content": "# 0.1. Переменные, типы данных, type() и id()\n\n## Зачем это нужно\n\nЛюбой тест начинается с данных: логин, пароль, ожидаемый статус-код, тестовый ID. Всё это — переменные. Прежде чем писать `assert`, нужно понимать, что на самом деле происходит, когда ты пишешь `x = 5`, и почему `a = b` в Python — это не копирование значения, а нечто другое. Ошибки, связанные с этим непониманием, — одна из самых частых причин \"тест ведёт себя не так, как я ожидал\".\n\n## Теория\n\nВ Python переменная — это не \"коробка со значением\", а **ссылка на объект**. Когда ты пишешь:\n\n```python\nuser_id = 42\n```\n\nPython создаёт объект-число `42` где-то в памяти, а переменная `user_id` — это просто именованная ссылка на него. Отсюда важное следствие: если присвоить одну переменную другой,\n\n```python\na = [1, 2, 3]\nb = a\n```\n\nто `a` и `b` указывают на один и тот же объект. Изменишь список через `b` — увидишь изменение и через `a` (подробнее об этом — в уроке про списки, там это критично; для чисел и строк разница не так заметна, потому что они неизменяемые).\n\nТип переменной определяется не в момент объявления, а в момент присваивания значения — это называется **динамической типизацией**. Одна и та же переменная в течение программы может ссылаться сначала на число, потом на строку:\n\n```python\nvalue = 5\nvalue = \"теперь я строка\"\n```\n\nТак поступать в реальном коде не стоит (это сбивает с толку), но знать, что Python это позволяет, важно.\n\nУзнать тип объекта, на который ссылается переменная, можно функцией `type()`:\n\n```python\nprint(type(user_id))   # <class 'int'>\n```\n\nА узнать идентификатор объекта в памяти — функцией `id()`. Она пригодится, когда нужно проверить, ссылаются ли две переменные на один и тот же объект или на разные:\n\n```python\nprint(id(a) == id(b))  # True, если a и b — одна и та же ссылка\n```\n\nPython поддерживает **множественное присваивание** (каждая переменная получает свой объект) и **каскадное** (все переменные ссылаются на один и тот же объект):\n\n```python\na, b = 1, 2          # множественное — разные объекты\nx = y = 0             # каскадное — общий объект\na, b = b, a           # классический обмен значениями без временной переменной\n```\n\n### Имена переменных\n\nПравила простые: имя начинается с буквы или `_`, дальше могут идти буквы, цифры и `_`. Регистр важен: `user` и `User` — разные переменные. Нельзя использовать ключевые слова (`if`, `class`, `True` и т.п.) и не стоит переопределять имена встроенных функций (`print`, `list`, `id`) — это молча \"сломает\" их для остальной программы.\n\nДоговорённость по стилю (PEP8), которой стоит следовать сразу: имена переменных — `snake_case`, осмысленные, отражающие суть данных: `expected_status`, `response_body`, а не `x`, `tmp2`.\n\n## Пример\n\n```python\n# типичные переменные тестового скрипта\nbase_url = \"https://api.example.com\"\nuser_id = 42\nis_active = True\nexpected_status = 200\n\nprint(type(base_url), type(user_id), type(is_active))\n# <class 'str'> <class 'int'> <class 'bool'>\n\n# каскадное присваивание — общий счётчик для нескольких переменных\nretries_left = max_retries = 3\nprint(id(retries_left) == id(max_retries))  # True\n```\n\n## Частые ошибки\n\n- Путать `=` (присваивание) и `==` (сравнение) — придёт позже, но ошибка настолько частая, что стоит запомнить сразу.\n- Обращаться к переменной до её создания (\"сначала присвоить, потом использовать\" — работает только в этом порядке).\n- Давать переменным имена встроенных функций (`list = [1, 2, 3]`), после чего `list()` перестаёт работать в этом файле.\n- Ожидать, что `a = b` создаёт копию данных — для изменяемых типов (списки, словари) это не так.\n\n## Мини-задание\n\nЗаведи пять переменных, описывающих тестового пользователя: `username`, `age`, `email`, `is_admin`, `balance` — подбери подходящие типы данных для каждой. Выведи на экран имя каждой переменной и её тип с помощью `type()`. Затем через каскадное присваивание создай три переменные `attempt_1 = attempt_2 = attempt_3 = 0` и проверь функцией `id()`, что все три ссылаются на один объект.\n", "hasPractice": true, "quiz": [{"question": "После выполнения кода a = [1, 2, 3]; b = a; b.append(4) — что будет в переменной a?", "options": ["Ошибка, так как нельзя присваивать список другой переменной", "[1, 2, 3, 4], потому что b и a ссылаются на один и тот же объект", "[1, 2, 3], потому что b — это независимая копия a", "[4], потому что b перезаписывает содержимое a"], "correct": 1, "explain": "Присваивание b = a не копирует список, а создаёт вторую ссылку на тот же объект в памяти — поэтому изменение через b видно и через a."}, {"question": "Что произойдёт при выполнении кода: value = 5; value = \"text\"; print(value)?", "options": ["Выведется 5 — первое значение сохраняется навсегда", "Выведется \"text\" — тип переменной определяется в момент присваивания, а не при объявлении", "Выведется \"text5\" — Python объединит оба значения", "Ошибка: нельзя присвоить переменной значение другого типа"], "correct": 1, "explain": "Python использует динамическую типизацию: переменная — просто ссылка, и при повторном присваивании она начинает ссылаться на новый объект другого типа."}, {"question": "Почему в реальном коде не стоит писать print = 5?", "options": ["Это сделает переменную print доступной только внутри текущей функции", "Ничего страшного — Python автоматически различает функцию print и переменную print", "Так называть переменные вообще запрещено синтаксисом Python и вызовет ошибку", "После этого имя print будет ссылаться на число 5, и вызов print(...) в этом же файле перестанет работать"], "correct": 3, "explain": "Имя функции — это просто ссылка на объект. Присвоив тому же имени число, ты затираешь ссылку на встроенную функцию, и print(...) перестаёт работать до конца программы."}, {"question": "Для чего используется функция id() применительно к двум переменным a и b?", "options": ["Чтобы узнать тип данных, на который ссылается переменная", "Чтобы удалить переменную из памяти", "Чтобы проверить, ссылаются ли a и b на один и тот же объект в памяти", "Чтобы преобразовать переменную в строку"], "correct": 2, "explain": "id() возвращает идентификатор объекта в памяти. Если id(a) == id(b), обе переменные ссылаются на один и тот же объект, а не на две независимые копии."}, {"question": "Как в Python принято менять местами значения переменных a и b без временной переменной?", "options": ["swap(a, b)", "a = b; b = a", "a = a + b; b = a - b", "a, b = b, a"], "correct": 3, "explain": "Множественное присваивание a, b = b, a сначала вычисляет пару значений (b, a), а затем распаковывает её — в отличие от a = b; b = a, где исходное значение a теряется до того, как его успели сохранить в b."}], "exercise": {"prompt": "Напиши функцию describe_user(username, age, email, is_admin, balance), которая возвращает словарь с именами типов каждого переданного значения (например, {'username': 'str', 'age': 'int', ...}). Затем напиши функцию cascade_triple(value), которая через каскадное присваивание a = b = c = value создаёт три переменные, ссылающиеся на один и тот же объект, и возвращает их кортежем (a, b, c) — как в примере с attempt_1 = attempt_2 = attempt_3 = 0.", "starter": "def describe_user(username, age, email, is_admin, balance):\n    # верни словарь вида {\"username\": \"str\", \"age\": \"int\", ...}\n    # используй type(...).__name__, чтобы получить имя типа строкой\n    pass\n\n\ndef cascade_triple(value):\n    # создай a, b, c через каскадное присваивание: a = b = c = value\n    # верни кортеж (a, b, c)\n    pass\n", "tests": "def test_describe_user_types():\n    result = describe_user(\"ivan\", 25, \"ivan@example.com\", False, 99.9)\n    expected = {\"username\": \"str\", \"age\": \"int\", \"email\": \"str\", \"is_admin\": \"bool\", \"balance\": \"float\"}\n    assert result == expected, f\"ожидались типы {expected}, получено {result}\"\n\n\ndef test_describe_user_int_balance():\n    result = describe_user(\"olga\", 30, \"olga@example.com\", True, 0)\n    assert result[\"is_admin\"] == \"bool\", \"is_admin должен определяться как bool\"\n    assert result[\"balance\"] == \"int\", \"balance здесь передан как int (0), а не float\"\n\n\ndef test_cascade_triple_equal_values():\n    a, b, c = cascade_triple([1, 2, 3])\n    assert a == [1, 2, 3] and b == [1, 2, 3] and c == [1, 2, 3], \"все три переменные должны содержать переданное значение\"\n\n\ndef test_cascade_triple_same_object():\n    a, b, c = cascade_triple([])\n    assert a is b is c, \"при каскадном присваивании a = b = c все три переменные должны ссылаться на один и тот же объект\"\n"}}, {"id": "p7", "section": "Модуль 0 · Python-база", "subgroup": "Неделя 1", "isOverview": false, "num": "0.2", "title": "Числа, логика и сравнения", "content": "# 0.2. Числа, логика и сравнения\n\n## Зачем это нужно\n\nПроверка ожидаемого результата почти всегда сводится к сравнению чисел: код ответа сервера, время выполнения запроса, количество элементов в списке. А булева логика (`and`, `or`, `not`) — это то, из чего потом строятся условия и `assert`-ы в тестах.\n\n## Теория\n\n### Числа\n\nВ Python два основных числовых типа: `int` (целые) и `float` (вещественные). Диапазон `int` практически не ограничен. Базовые арифметические операторы:\n\n| Оператор | Смысл | Пример |\n|---|---|---|\n| `+` `-` `*` | сложение, вычитание, умножение | `2 + 3` |\n| `/` | деление, **всегда** возвращает `float` | `8 / 2` → `4.0` |\n| `//` | целочисленное деление (округление вниз) | `7 // 2` → `3` |\n| `%` | остаток от деления | `10 % 3` → `1` |\n| `**` | возведение в степень | `2 ** 10` → `1024` |\n\nПриоритет операций такой же, как в математике: сначала `**`, потом `*`, `/`, `//`, `%`, потом `+`, `-`. Скобки меняют порядок вычислений. Есть один частый сюрприз: при делении отрицательных чисел `//` и `%` округляются \"в сторону минус бесконечности\", а не к нулю: `-7 // 2` даёт `-4`, а не `-3`.\n\nСокращённые операторы присваивания экономят строки: `i += 1` вместо `i = i + 1`, аналогично `-=`, `*=`, `/=`.\n\nФункция `round()` округляет число, но не по школьным правилам, а по **банковскому округлению** — до ближайшего чётного при равном расстоянии: `round(2.5)` → `2`, `round(3.5)` → `4`. У неё есть второй параметр — количество знаков после запятой: `round(3.14159, 2)` → `3.14`.\n\nДля более сложной математики есть модуль `math`:\n\n```python\nimport math\n\nmath.ceil(4.1)    # 5 — округление вверх\nmath.floor(4.9)   # 4 — округление вниз\nmath.sqrt(49)     # 7.0\nmath.pi           # 3.141592653589793\n```\n\n### Логический тип и сравнения\n\nТип `bool` — это `True`/`False`. Операторы сравнения:\n\n```\n<   >   <=   >=   ==   !=\n```\n\nОбрати внимание: `==` — сравнение, `=` — присваивание, это разные операторы, и путаница между ними — классическая ошибка новичков.\n\nСоставные условия строятся через `and`, `or`, `not`. Приоритет: `not` выше, чем `and`, а `and` выше, чем `or` — то есть `not` выполняется первым. Python также позволяет \"математическую\" запись диапазона:\n\n```python\n-2 <= y <= 5   # эквивалент y >= -2 and y <= 5\n```\n\nФункция `bool()` приводит любое значение к `True`/`False` по правилу \"пустое — ложь\": `0`, `\"\"`, `[]`, `{}`, `None` — все дают `False`, всё остальное — `True`. Это правило часто используется неявно, например в условии `if some_list:` вместо `if len(some_list) > 0:`.\n\n## Пример\n\n```python\nprice = 1999.99\ndiscount_percent = 15\n\ndiscounted_price = round(price * (100 - discount_percent) / 100, 2)\nprint(discounted_price)  # 1699.99\n\nexpected_status = 200\nactual_status = 201\nis_success = 200 <= actual_status < 300\nprint(is_success)  # True — 201 тоже \"успешный\" HTTP-код\n\n# сравнение вещественных чисел \"в лоб\" опасно из-за погрешности округления\nresult = 0.1 + 0.2\nprint(result == 0.3)                  # False, неожиданно!\nprint(abs(result - 0.3) < 1e-9)       # True — правильный способ сравнить float\n```\n\n## Частые ошибки\n\n- Сравнивать вещественные числа через `==` — из-за особенностей хранения `float` в памяти `0.1 + 0.2 != 0.3`. Сравнивай через допустимую погрешность (`abs(a - b) < 1e-9`).\n- Путать `/` и `//` — `/` всегда даёт `float`, даже `10 / 2` → `5.0`.\n- Забывать про банковское округление в `round()` и удивляться, почему `round(0.5)` — это `0`, а не `1`.\n- Писать `if flag == True:` вместо `if flag:` — работает, но не по стилю Python.\n\n## Мини-задание\n\nДан заказ на сумму `price = 2450` рублей со скидкой `discount = 12` (в процентах). Посчитай итоговую сумму с округлением до копеек. Затем напиши составное условие, проверяющее, что HTTP-код `actual_status` находится в диапазоне `[200; 299]` **или** равен `304`, и выведи результат как `bool`.\n", "hasPractice": true, "quiz": [{"question": "Почему в тесте опасно сравнивать результат вычисления с float напрямую через == (например, result == 0.3)?", "options": ["Потому что из-за особенностей хранения float в памяти результат может отличаться на крошечную величину — сравнивать нужно с допустимой погрешностью", "Потому что оператор == в Python не работает с числами типа float", "Потому что float нельзя использовать в условиях if", "Потому что == сравнивает только целые числа, а float нужно сравнивать через is"], "correct": 0, "explain": "Вещественные числа хранятся с погрешностью округления (0.1 + 0.2 != 0.3), поэтому для float используют сравнение через допустимую погрешность, например abs(a - b) < 1e-9."}, {"question": "Какой оператор в Python всегда возвращает float, даже при делении двух целых чисел без остатка (например 8/2)?", "options": ["%", "**", "/", "//"], "correct": 2, "explain": "Оператор / всегда выполняет вещественное деление и возвращает float, даже когда результат — целое число вроде 4.0."}, {"question": "Чему равен round(2.5) в Python?", "options": ["3", "2.5", "Ошибка — round() не принимает вещественные числа", "2"], "correct": 3, "explain": "round() использует банковское округление — до ближайшего чётного числа при равном расстоянии, поэтому round(2.5) даёт 2, а не 3."}, {"question": "Что означает выражение not x % 2 == 0 or x % 3 == 0 (без скобок) по сравнению с not (x % 2 == 0 or x % 3 == 0)?", "options": ["not применяется только к первому подусловию, а не ко всему составному условию", "Это одно и то же выражение — скобки ничего не меняют", "not применяется ко всему выражению целиком, как и со скобками", "Без скобок возникнет SyntaxError"], "correct": 0, "explain": "У not самый высокий приоритет среди and/or/not, поэтому без скобок он инвертирует только ближайшее подусловие (x % 2 == 0), а не всё составное условие."}, {"question": "Чему будет равно bool(0.0) и bool(\"\")?", "options": ["False и True", "True и False", "False и False", "True и True"], "correct": 2, "explain": "Правило bool() — «пустое — это False»: число 0 (и 0.0) и пустая строка считаются пустыми значениями, поэтому оба дают False."}], "exercise": {"prompt": "Дан заказ на сумму price рублей со скидкой discount (в процентах). Напиши функцию calculate_total_with_discount(price, discount), которая считает итоговую сумму с округлением до копеек. Затем напиши функцию is_status_ok(actual_status), которая через составное условие проверяет, что код находится в диапазоне [200; 299] или равен 304, и возвращает результат как bool.", "starter": "def calculate_total_with_discount(price, discount):\n    # верни итоговую сумму после скидки, округлённую до копеек (2 знака после запятой)\n    pass\n\n\ndef is_status_ok(actual_status):\n    # верни True, если actual_status в диапазоне [200; 299] или равен 304, иначе False\n    pass\n", "tests": "def test_discount_basic():\n    assert calculate_total_with_discount(2450, 12) == 2156.0, \"2450 руб. со скидкой 12% должно давать 2156.0\"\n\n\ndef test_discount_zero():\n    assert calculate_total_with_discount(1000, 0) == 1000.0, \"при скидке 0% сумма не должна меняться\"\n\n\ndef test_discount_rounding():\n    assert calculate_total_with_discount(99.99, 15) == 84.99, \"результат должен быть округлён до копеек (двух знаков после запятой)\"\n\n\ndef test_status_ok_in_range():\n    assert is_status_ok(200) is True and is_status_ok(299) is True, \"коды из диапазона [200; 299] должны считаться успешными\"\n\n\ndef test_status_ok_304_and_failure():\n    assert is_status_ok(304) is True, \"304 явно указан как допустимый код\"\n    assert is_status_ok(404) is False, \"404 не входит ни в диапазон [200; 299], ни равен 304\"\n"}}, {"id": "p8", "section": "Модуль 0 · Python-база", "subgroup": "Неделя 1", "isOverview": false, "num": "0.3", "title": "Строки: индексы, срезы, методы, f-строки", "content": "# 0.3. Строки: индексы, срезы, методы, f-строки\n\n## Зачем это нужно\n\nТексты ошибок, тела ответов API, URL, логи — почти всё, с чем сталкивается QA automation engineer на старте, представлено строками. Умение вырезать нужный кусок строки, склеить сообщение об ошибке или отформатировать URL с параметрами — база, без которой не напишешь ни одного полезного скрипта.\n\n## Теория\n\nСтрока задаётся в одинарных или двойных кавычках — разницы нет, кроме удобства (если внутри текста есть кавычки одного вида, снаружи используй другой). Тройные кавычки (`'''` или `\"\"\"`) позволяют задавать многострочный текст.\n\nСтроки в Python — **неизменяемый** тип данных: нельзя поменять символ по индексу (`s[0] = \"H\"` вызовет ошибку). Любая \"модификация\" строки на самом деле создаёт новую строку.\n\n### Индексы и срезы\n\nКаждый символ строки имеет номер (индекс), начиная с `0`. Отрицательные индексы считают с конца:\n\n```python\ns = \"hello python\"\ns[0]     # 'h'\ns[-1]    # 'n'\n```\n\nСрез `s[start:stop:step]` вырезает подстроку от `start` до `stop` (не включая `stop`), с шагом `step`:\n\n```python\ns[0:5]    # 'hello'\ns[:5]     # то же самое\ns[6:]     # 'python'\ns[::-1]   # разворот строки: 'nohtyp olleh'\n```\n\n### Основные методы\n\n| Метод | Что делает |\n|---|---|\n| `.upper()` / `.lower()` | регистр |\n| `.strip()` / `.lstrip()` / `.rstrip()` | удаление пробелов и переносов строк по краям |\n| `.split(sep)` | разбить строку на список по разделителю |\n| `.join(list)` | собрать список строк в одну через разделитель |\n| `.replace(old, new)` | замена подстроки |\n| `.find(sub)` | индекс первого вхождения, `-1` если не найдено |\n| `.startswith(...)` / `.endswith(...)` | проверка начала/конца строки |\n| `.isdigit()` / `.isalpha()` | проверка состава строки |\n\nМетоды **не изменяют** исходную строку — они возвращают новую. `s.upper()` без присваивания результата ни на что не влияет.\n\n### Форматирование строк\n\nСамый удобный способ — **f-строки** (с версии Python 3.6): перед кавычками ставится `f`, а внутри `{}` можно писать любое выражение Python.\n\n```python\nname = \"Sergey\"\nage = 35\nprint(f\"User {name}, age {age}, next year: {age + 1}\")\n```\n\nДо f-строк использовался метод `.format()` — иногда он всё ещё встречается в чужом коде:\n\n```python\n\"User {0}, age {1}\".format(name, age)\n```\n\n## Пример\n\n```python\nlog_line = \"  2024-01-15 12:30:01 ERROR failed to connect  \"\n\n# приводим строку в порядок и разбираем на части\nclean_line = log_line.strip()\nparts = clean_line.split(\" \", maxsplit=2)\ndate, time, message = parts\n\nprint(f\"[{date} {time}] {message}\")\n# [2024-01-15 12:30:01 ERROR failed to connect]\n\nbase_url = \"https://api.example.com\"\nendpoint = \"users\"\nuser_id = 42\nfull_url = f\"{base_url}/{endpoint}/{user_id}\"\nprint(full_url)\n# https://api.example.com/users/42\n```\n\n## Частые ошибки\n\n- Забывать, что строки неизменяемы, и пытаться менять символ по индексу.\n- Вызывать метод и не сохранять результат: `s.strip()` без `s = s.strip()` ничего не меняет в `s`.\n- Путать `.find()` (вернёт `-1`, если не нашёл) и `.index()` (вызовет ошибку, если не нашёл).\n- Склеивать строки через `+` там, где f-строка читается в разы понятнее.\n- Забывать `.strip()` перед сравнением строк, считанных из файла или ввода — лишний `\\n` на конце ломает сравнение.\n\n## Мини-задание\n\nДана строка `\"user@example.com:Qwerty123\"`. Раздели её на email и пароль (разделитель — `:`). Проверь, что email содержит символ `@` и хотя бы одну точку после него. Собери и выведи сообщение через f-строку: `\"Login: <email>, password length: <N>\"`.\n", "hasPractice": true, "quiz": [{"question": "Что будет выведено в результате выполнения кода?\ns = \"hello\"\ns.upper()\nprint(s)", "options": ["None", "HELLO", "Ошибка выполнения", "hello"], "correct": 3, "explain": "Строки неизменяемы: .upper() возвращает новую строку, но не меняет саму s. Без s = s.upper() исходная переменная останется прежней."}, {"question": "Что вернёт выражение \"hello\"[::-1]?", "options": ["\"olleh\"", "Ошибка — отрицательный шаг недопустим", "\"h\"", "\"hello\""], "correct": 0, "explain": "Срез с шагом -1 перебирает строку с конца к началу, разворачивая её целиком — стандартный приём для реверса строки."}, {"question": "В чём разница между .find() и .index() при поиске подстроки, которой нет в строке?", "options": ["Оба метода вернут -1", "Оба метода вызовут ошибку", "find() вернёт -1, а index() вызовет ошибку", "find() вызовет ошибку, а index() вернёт -1"], "correct": 2, "explain": "find() безопасен и возвращает -1, если подстрока не найдена, а index() в этом случае выбрасывает исключение — это единственное отличие в их поведении."}, {"question": "Как правильно собрать список слов ['a', 'b', 'c'] обратно в строку 'a-b-c'?", "options": ["'-'.split(['a', 'b', 'c'])", "'-'.join(['a', 'b', 'c'])", "join('-', ['a', 'b', 'c'])", "['a', 'b', 'c'].join('-')"], "correct": 1, "explain": "Метод join() вызывается на строке-разделителе, а список передаётся аргументом — именно так, а не наоборот."}, {"question": "Что выведет код: name = \"Ivan\"; age = 25; print(f\"User {name}, age {age + 1}\")?", "options": ["User Ivan, age 25", "User Ivan, age 26", "User {name}, age {age + 1}", "Ошибка — внутри f-строки нельзя писать выражения"], "correct": 1, "explain": "Внутри фигурных скобок f-строки можно записывать любое выражение Python, в том числе арифметику — оно вычисляется перед подстановкой в строку."}], "exercise": {"prompt": "Дана строка вида 'user@example.com:Qwerty123'. Напиши функцию parse_credentials(line), которая делит её на email и пароль по разделителю ':'. Напиши функцию is_valid_email(email), проверяющую, что email содержит '@' и хотя бы одну точку после него. Напиши функцию format_login_message(email, password), которая через f-строку возвращает 'Login: <email>, password length: <N>'.", "starter": "def parse_credentials(line):\n    # раздели line по ':' на email и password, верни кортеж (email, password)\n    pass\n\n\ndef is_valid_email(email):\n    # верни True, если email содержит '@' и хотя бы одну точку после '@'\n    pass\n\n\ndef format_login_message(email, password):\n    # верни строку вида \"Login: <email>, password length: <N>\" (используй f-строку)\n    pass\n", "tests": "def test_parse_credentials():\n    email, password = parse_credentials(\"user@example.com:Qwerty123\")\n    assert email == \"user@example.com\", \"email должен быть частью строки до ':'\"\n    assert password == \"Qwerty123\", \"password должен быть частью строки после ':'\"\n\n\ndef test_valid_email():\n    assert is_valid_email(\"user@example.com\") is True, \"в строке есть '@' и точка после него\"\n\n\ndef test_invalid_email_no_at():\n    assert is_valid_email(\"userexample.com\") is False, \"без '@' email не может быть валидным\"\n\n\ndef test_invalid_email_no_dot_after_at():\n    assert is_valid_email(\"user@examplecom\") is False, \"после '@' должна быть хотя бы одна точка\"\n\n\ndef test_format_login_message():\n    result = format_login_message(\"user@example.com\", \"Qwerty123\")\n    assert result == \"Login: user@example.com, password length: 9\", f\"неверный формат сообщения: {result}\"\n"}}, {"id": "p9", "section": "Модуль 0 · Python-база", "subgroup": "Неделя 1", "isOverview": false, "num": "0.4", "title": "Списки: индексы, срезы, методы, вложенные списки", "content": "# 0.4. Списки: индексы, срезы, методы, вложенные списки\n\n## Зачем это нужно\n\nСписок тестовых пользователей, список ожидаемых элементов на странице, набор HTTP-кодов, которые нужно проверить в цикле — списки встречаются в тестовом коде постоянно. В отличие от строк, списки можно изменять \"на месте\", и это удобно, но и источник частых ошибок.\n\n## Теория\n\nСписок задаётся квадратными скобками, элементы через запятую, может содержать данные разных типов:\n\n```python\nmarks = [2, 3, 4, 3, 5, 2]\nmixed = [\"Москва\", 1320, 5.8, True]\n```\n\nСписок — **изменяемый** тип: можно поменять значение по индексу, добавить или удалить элемент, и это не создаёт новый объект, а меняет существующий:\n\n```python\nmarks[0] = 5\n```\n\nИндексация и срезы работают так же, как у строк (`marks[0]`, `marks[-1]`, `marks[1:3]`, `marks[::-1]`). Важное отличие от строк: полный срез `marks[:]` создаёт **копию** списка, а не ссылку на тот же объект (в отличие от кортежей, где `t[:]` вернёт тот же объект — это разберём в уроке 0.7).\n\n### Функции и методы\n\nВстроенные функции, применимые к любой числовой коллекции: `len()`, `max()`, `min()`, `sum()`, `sorted()` (возвращает **новый** отсортированный список, исходный не трогает).\n\nМетоды списка, которые меняют сам список \"на месте\" и обычно ничего не возвращают:\n\n| Метод | Что делает |\n|---|---|\n| `.append(x)` | добавить элемент в конец |\n| `.insert(i, x)` | вставить элемент по индексу |\n| `.remove(x)` | удалить первый элемент со значением `x` |\n| `.pop(i=-1)` | удалить и вернуть элемент (по умолчанию последний) |\n| `.sort(reverse=False)` | отсортировать список на месте |\n| `.reverse()` | развернуть порядок элементов |\n\nЧастая ошибка — писать `a = a.append(1)`: `append()` возвращает `None`, и после такой строчки `a` станет равен `None`, а не изменённому списку.\n\n### Вложенные списки\n\nСписок может содержать другие списки — так представляют таблицы и матрицы:\n\n```python\nusers = [\n    [\"Ivan\", 25, True],\n    [\"Olga\", 30, False],\n]\nusers[0]        # ['Ivan', 25, True]\nusers[0][1]     # 25\n```\n\n## Пример\n\n```python\nresponse_times_ms = [120, 340, 95, 210, 800, 150]\n\nprint(min(response_times_ms), max(response_times_ms))\n# 95 800\n\naverage = sum(response_times_ms) / len(response_times_ms)\nprint(round(average, 1))\n# 285.8\n\nslow_requests = sorted(response_times_ms, reverse=True)[:3]\nprint(slow_requests)\n# [800, 340, 210] — три самых медленных запроса\n\n# добавляем новый результат, не трогая исходный список через sorted()\nresponse_times_ms.append(500)\nprint(response_times_ms)\n# [120, 340, 95, 210, 800, 150, 500]\n```\n\n## Частые ошибки\n\n- Путать `.sort()` (меняет список, ничего не возвращает) и `sorted()` (возвращает новый список, исходный не меняет).\n- Писать `a = a.append(x)` и терять список (получая `None`).\n- Забывать, что `b = a` не копирует список — обе переменные ссылаются на один и тот же объект; для копии нужен срез `a[:]` или `a.copy()`.\n- Путать номер элемента (считая с 1, \"по-человечески\") с индексом (считается с 0).\n\n## Мини-задание\n\nДан список результатов тестового прогона: `results = [True, True, False, True, False, False, True]`. Посчитай количество успешных (`True`) и провалившихся (`False`) тестов без использования `.count()` (циклом — пройдём в следующем уроке — пока можно через `results.count(True)`, если знаком; иначе просто индексами). Выведи сообщение `\"Passed: N, Failed: M\"`. Отдельно получи срез с последними тремя результатами.\n", "hasPractice": true, "quiz": [{"question": "Какая из строк приведёт к тому, что переменная result станет ссылаться на None вместо списка?", "options": ["numbers = [3, 1, 2]; result = list(numbers)", "numbers = [3, 1, 2]; result = numbers[:]", "numbers = [3, 1, 2]; result = sorted(numbers)", "numbers = [3, 1, 2]; result = numbers.append(4)"], "correct": 3, "explain": "Метод append() изменяет список на месте и ничего не возвращает (None). sorted(), list() и срез [:] — все возвращают настоящий список."}, {"question": "Чем метод .sort() отличается от функции sorted() применительно к списку?", "options": ["sort() работает только со строками, а sorted() — только с числами", "Это два одинаковых способа записи одного и того же", "sort() возвращает новый отсортированный список, а sorted() сортирует список на месте", ".sort() сортирует список на месте и возвращает None, а sorted() возвращает новый список, не трогая исходный"], "correct": 3, "explain": "sort() — метод списка, меняющий его на месте (in-place) и возвращающий None. sorted() — функция, которая создаёт и возвращает новый список, оставляя исходный без изменений."}, {"question": "Как получить независимую копию списка a, а не просто вторую ссылку на тот же список?", "options": ["b = a.pop()", "b = a[:]", "b = a", "b == a"], "correct": 1, "explain": "Полный срез a[:] создаёт новый объект-список с теми же элементами, тогда как b = a лишь копирует ссылку на исходный объект."}, {"question": "Дан список users = [['Ivan', 25], ['Olga', 30]]. Как получить возраст Ivan (число 25)?", "options": ["users['Ivan']", "users[1][0]", "users[0][1]", "users[0]"], "correct": 2, "explain": "users[0] — это первый вложенный список ['Ivan', 25], а [1] у него — второй элемент, то есть возраст."}, {"question": "В списке marks = [2, 3, 4, 3, 5, 2] какой индекс у ТРЕТЬЕГО элемента (значения 4)?", "options": ["1", "2", "4", "3"], "correct": 1, "explain": "Индексация начинается с 0, поэтому первый элемент имеет индекс 0, второй — 1, а третий — 2. Не путай порядковый номер элемента (считая с 1) с его индексом."}], "exercise": {"prompt": "Дан список результатов тестового прогона (список True/False). Напиши функцию count_results(results), возвращающую кортеж (passed, failed) — количество True и False. Напиши функцию format_summary(results), возвращающую строку 'Passed: N, Failed: M'. Напиши функцию last_three(results), возвращающую срез с последними тремя результатами.", "starter": "def count_results(results):\n    # верни кортеж (passed, failed) - количество True и False в списке results\n    pass\n\n\ndef format_summary(results):\n    # верни строку \"Passed: N, Failed: M\"\n    pass\n\n\ndef last_three(results):\n    # верни срез с последними тремя результатами\n    pass\n", "tests": "def test_count_results():\n    results = [True, True, False, True, False, False, True]\n    passed, failed = count_results(results)\n    assert passed == 4, f\"ожидалось 4 успешных, получено {passed}\"\n    assert failed == 3, f\"ожидалось 3 провальных, получено {failed}\"\n\n\ndef test_format_summary():\n    results = [True, True, False, True, False, False, True]\n    assert format_summary(results) == \"Passed: 4, Failed: 3\", \"сообщение должно точно соответствовать формату 'Passed: N, Failed: M'\"\n\n\ndef test_last_three():\n    results = [True, True, False, True, False, False, True]\n    assert last_three(results) == [False, False, True], \"срез должен содержать последние три элемента списка в исходном порядке\"\n\n\ndef test_last_three_short_list():\n    assert last_three([True, False]) == [True, False], \"если элементов меньше трёх, срез должен вернуть весь список\"\n"}}, {"id": "p10", "section": "Модуль 0 · Python-база", "subgroup": "Неделя 1", "isOverview": false, "num": "0.5", "title": "Условия: if / elif / else, тернарный оператор", "content": "# 0.5. Условия: if / elif / else, тернарный оператор\n\n## Зачем это нужно\n\nЛюбая проверка вида \"если статус-код не 200 — тест упал\" — это условный оператор. В будущем `assert` в pytest во многом заменит явные `if`, но логика ветвления в тестовом коде (подготовка данных, обработка разных сценариев ответа) остаётся ровно такой же.\n\n## Теория\n\nСинтаксис условного оператора:\n\n```python\nif condition:\n    # выполняется, если condition истинно\nelif other_condition:\n    # проверяется, если предыдущие условия ложны\nelse:\n    # выполняется, если ни одно условие не сработало\n```\n\nКлючевое для Python — **отступы**. Блок кода, относящийся к `if`, определяется отступом (обычно 4 пробела), а не скобками, как в других языках. Это не просто стиль — это часть синтаксиса: неправильный отступ реально меняет логику программы.\n\n`elif` можно повторять сколько угодно раз, `else` — не обязателен и может отсутствовать. Порядок строго такой: сначала `if`, потом (не обязательно) любое число `elif`, потом (не обязательно) один `else`.\n\nВ условии может быть любое выражение, приводимое к `bool` — не только явное сравнение:\n\n```python\nif response_body:      # сработает, если словарь/список не пустой\n    ...\n```\n\n### Тернарный оператор\n\nКомпактная запись условия, которая **возвращает значение** (в отличие от обычного `if`, который сам по себе ничего не возвращает):\n\n```python\nstatus_label = \"OK\" if response.status_code == 200 else \"FAIL\"\n```\n\nСинтаксис: `<значение если True> if <условие> else <значение если False>`. Удобен для простых случаев — присвоить одно из двух значений. Для сложной логики с несколькими шагами тернарный оператор быстро становится нечитаемым, и в таких случаях лучше вернуться к обычному `if/elif/else`.\n\n## Пример\n\n```python\nstatus_code = 404\n\nif 200 <= status_code < 300:\n    result = \"success\"\nelif 400 <= status_code < 500:\n    result = \"client error\"\nelif 500 <= status_code < 600:\n    result = \"server error\"\nelse:\n    result = \"unknown\"\n\nprint(result)  # client error\n\n# то же самое одним выражением для простого бинарного случая\nis_ok = \"yes\" if status_code == 200 else \"no\"\nprint(is_ok)  # no\n```\n\n## Частые ошибки\n\n- Неправильный отступ — код \"уезжает\" в блок `if`, хотя логически должен быть после него.\n- Вложенность условий более 2–3 уровней — код становится нечитаемым; часто это признак того, что стоит пересмотреть структуру, а не самой логики.\n- Попытка засунуть сложную многошаговую логику в тернарный оператор \"для краткости\" — читаемость страдает больше, чем экономится строк.\n- `if flag == True:` вместо `if flag:` — работает, но не идиоматично для Python.\n\n## Мини-задание\n\nНапиши классификатор HTTP-статусов: для введённого `status_code` вывести `\"2xx success\"`, `\"3xx redirect\"`, `\"4xx client error\"`, `\"5xx server error\"` или `\"unknown\"` для всего остального. Затем перепиши проверку \"код успешный или нет\" (только эти два варианта) через тернарный оператор.\n", "hasPractice": true, "quiz": [{"question": "Что будет выведено в результате выполнения кода?\nx = 5\nif x < 0:\n    x = -x\n    print(x)\nprint(\"done\")", "options": ["Ошибка выполнения", "done", "5\ndone", "-5\ndone"], "correct": 1, "explain": "print(x) находится внутри блока if (определяется отступом) и выполнится только при x < 0. Здесь x = 5, условие ложно, поэтому выведется только 'done'."}, {"question": "Чем принципиально отличается цепочка if/elif/elif/else от последовательности независимых if в той же ситуации?", "options": ["elif работает быстрее только для чисел, но не для строк", "elif прекращает проверку остальных условий, как только одно из них истинно, тогда как отдельные if проверяются все по очереди независимо", "Никакой разницы — это два одинаковых способа записи", "elif можно использовать только внутри циклов"], "correct": 1, "explain": "В цепочке if/elif как только одно условие сработало, остальные elif и else пропускаются — это и делает выбор одного варианта из многих компактнее и надёжнее набора независимых if."}, {"question": "В чём принципиальное отличие тернарного оператора от обычного if/else?", "options": ["Тернарный оператор работает быстрее в любых случаях", "Тернарный оператор может содержать несколько строк кода внутри каждой ветки", "Тернарный оператор сам возвращает значение, которое можно сразу присвоить переменной, а обычный if сам по себе ничего не возвращает", "Обычный if нельзя использовать вместе с переменными"], "correct": 2, "explain": "res = a if a > b else b — тернарный оператор сразу возвращает одно из двух значений. Обычный if — это управляющая конструкция, а не выражение, она сама по себе ничего не возвращает."}, {"question": "Когда стоит отказаться от тернарного оператора в пользу обычного if/elif/else?", "options": ["Когда нужно сравнить два числа", "Тернарный оператор нельзя использовать вместе с f-строками", "Когда логика становится многошаговой и сложной — тернарный оператор в таких случаях быстро теряет читаемость", "Никогда — тернарный оператор всегда предпочтительнее"], "correct": 2, "explain": "Тернарный оператор хорош для простого выбора одного из двух значений. Для сложной многошаговой логики он быстро становится нечитаемым, и лучше вернуться к обычному if/elif/else."}, {"question": "Дан код:\nif x % 2 == 0:\n    if 0 <= x <= 9:\n        result = 'even digit'\n    else:\n        result = 'even number'\nelse:\n    result = 'odd'\nЧему будет равен result при x = 12?", "options": ["'even digit'", "'even number'", "Ошибка выполнения", "'odd'"], "correct": 1, "explain": "12 — чётное число (первое условие истинно), но не попадает в диапазон [0; 9], поэтому срабатывает вложенный else и result становится 'even number'."}], "exercise": {"prompt": "Напиши функцию classify_status(status_code), которая возвращает '2xx success', '3xx redirect', '4xx client error', '5xx server error' или 'unknown'. Затем напиши функцию is_success_ternary(status_code), которая с помощью тернарного оператора возвращает True, если код в диапазоне [200; 299], иначе False.", "starter": "def classify_status(status_code):\n    # верни одну из строк: \"2xx success\", \"3xx redirect\", \"4xx client error\", \"5xx server error\", \"unknown\"\n    pass\n\n\ndef is_success_ternary(status_code):\n    # используя тернарный оператор, верни True, если status_code в диапазоне [200; 299], иначе False\n    pass\n", "tests": "def test_classify_2xx():\n    assert classify_status(204) == \"2xx success\", \"204 должен классифицироваться как 2xx success\"\n\n\ndef test_classify_3xx():\n    assert classify_status(301) == \"3xx redirect\", \"301 должен классифицироваться как 3xx redirect\"\n\n\ndef test_classify_4xx():\n    assert classify_status(404) == \"4xx client error\", \"404 должен классифицироваться как 4xx client error\"\n\n\ndef test_classify_5xx():\n    assert classify_status(500) == \"5xx server error\", \"500 должен классифицироваться как 5xx server error\"\n\n\ndef test_classify_unknown():\n    assert classify_status(100) == \"unknown\", \"100 не попадает ни в один из диапазонов 2xx-5xx\"\n\n\ndef test_is_success_ternary():\n    assert is_success_ternary(204) is True, \"204 входит в диапазон [200; 299] - успешный\"\n    assert is_success_ternary(404) is False, \"404 не входит в диапазон [200; 299] - не успешный\"\n"}}, {"id": "p11", "section": "Модуль 0 · Python-база", "subgroup": "Неделя 1", "isOverview": false, "num": "0.6", "title": "Циклы и генераторы списков", "content": "# 0.6. Циклы и генераторы списков\n\n## Зачем это нужно\n\nПрогнать проверку по списку из 50 тестовых пользователей, подождать (с ограничением по попыткам), пока элемент появится на странице, отфильтровать только упавшие тесты из общего списка результатов — всё это циклы. List comprehension (генератор списков) — идиома, которую ты будешь видеть в почти любом чужом Python-коде, включая тестовые фреймворки.\n\n## Теория\n\n### while\n\nВыполняется, пока условие истинно. Хорош для ситуаций, когда заранее не известно число повторений — например, ожидание с ретраями:\n\n```python\nattempts = 0\nmax_attempts = 5\nsuccess = False\n\nwhile attempts < max_attempts and not success:\n    attempts += 1\n    success = try_something()  # условная функция, которую напишем позже\n```\n\n`break` прерывает цикл досрочно, `continue` пропускает оставшуюся часть текущей итерации и переходит к следующей. У циклов (и `while`, и `for`) есть необязательный блок `else` — он выполняется, только если цикл завершился \"штатно\" (по условию), а не через `break`. На практике используется редко, но встречается в чужом коде, поэтому знать про него стоит.\n\n### for и range\n\n`for` перебирает элементы **итерируемого объекта** — списка, строки, результата `range()`:\n\n```python\nfor i in range(5):        # 0, 1, 2, 3, 4 — верхняя граница не включается\n    print(i)\n\nfor user in users_list:\n    print(user)\n```\n\n`enumerate()` даёт одновременно индекс и значение — удобнее, чем городить отдельный счётчик:\n\n```python\nfor index, user in enumerate(users_list):\n    print(index, user)\n```\n\n### List comprehension (генератор списков)\n\nКомпактная запись цикла, который строит новый список:\n\n```python\nsquares = [x ** 2 for x in range(5)]\n# эквивалент:\n# squares = []\n# for x in range(5):\n#     squares.append(x ** 2)\n```\n\nМожно добавить условие фильтрации:\n\n```python\nfailed_only = [name for name, passed in test_results if not passed]\n```\n\nСинтаксис: `[<что положить в список> for <переменная> in <источник> if <условие>]`. Часть `if` — необязательна. Такая запись работает быстрее обычного цикла и считается более \"питоничной\", но злоупотреблять ей не стоит: если выражение перестаёт помещаться в одну понятную строку — лучше вернуться к обычному циклу `for`.\n\n## Пример\n\n```python\ntest_results = [\n    (\"test_login\", True),\n    (\"test_logout\", True),\n    (\"test_registration\", False),\n    (\"test_password_reset\", False),\n]\n\n# обычный цикл: печатаем только упавшие тесты\nfor name, passed in test_results:\n    if not passed:\n        print(f\"FAILED: {name}\")\n\n# то же самое — генератор списков, если нужен именно список имён\nfailed_tests = [name for name, passed in test_results if not passed]\nprint(failed_tests)\n# ['test_registration', 'test_password_reset']\n\n# ретрай с ограничением попыток\nattempts = 0\nmax_attempts = 3\nfound = False\n\nwhile attempts < max_attempts and not found:\n    attempts += 1\n    print(f\"Attempt {attempts}: checking...\")\n    found = attempts == 3  # условно \"получилось\" на третьей попытке\n\nprint(\"Found!\" if found else \"Gave up.\")\n```\n\n## Частые ошибки\n\n- Забыть увеличить счётчик в `while` — бесконечный цикл, который \"подвешивает\" скрипт.\n- Перепутать `range(5)` (числа 0–4) с \"числами от 1 до 5\" — верхняя граница `range()` не включается.\n- Изменять список, по которому в этот момент итерируешься через `for` (`for x in lst: lst.remove(x)`) — элементы будут пропущены непредсказуемым образом.\n- Писать генератор списков с тремя вложенными условиями и двумя `for` \"для краткости\" — такой код сложнее читать, чем обычный цикл.\n\n## Мини-задание\n\nДан список чисел `response_codes = [200, 404, 200, 500, 301, 200, 403]`. С помощью генератора списков получи список только \"успешных\" кодов (200–299). Отдельно — обычным циклом `for` с `enumerate()` — выведи `\"index: code\"` для каждого элемента, у которого код больше или равен 400.\n", "hasPractice": true, "quiz": [{"question": "Сколько чисел и каких выведет цикл for i in range(5): print(i)?", "options": ["6 чисел: 0, 1, 2, 3, 4, 5", "5 чисел: 0, 1, 2, 3, 4", "5 чисел: 1, 2, 3, 4, 5", "4 числа: 1, 2, 3, 4"], "correct": 1, "explain": "range(5) генерирует последовательность от 0 до 4 включительно — верхняя граница в range() не включается в диапазон."}, {"question": "Что произойдёт при выполнении следующего кода?\ni = 0\nwhile i < 5:\n    print(i)", "options": ["Выведет только 0 и завершится", "SyntaxError", "Бесконечный цикл, потому что i никогда не увеличивается", "Выведет 0, 1, 2, 3, 4 и завершится"], "correct": 2, "explain": "Внутри тела цикла нет строчки, увеличивающей i, поэтому условие i < 5 остаётся истинным всегда — классическая ошибка забытого счётчика в while."}, {"question": "Чем break отличается от continue внутри цикла?", "options": ["break пропускает текущую итерацию и переходит к следующей, а continue полностью завершает цикл", "break полностью завершает цикл, а continue пропускает оставшуюся часть текущей итерации и переходит к следующей", "Это два одинаковых оператора с разным названием", "break работает только в for, а continue — только в while"], "correct": 1, "explain": "break досрочно останавливает весь цикл целиком. continue прерывает только текущий проход и сразу переходит к проверке условия для следующей итерации."}, {"question": "Как с помощью генератора списков получить список только чётных чисел от 0 до 9?", "options": ["[x if x % 2 == 0 for x in range(10)]", "[x for x in range(10) if x % 2 == 0]", "(x for x in range(10) if x % 2 == 0) — это тоже список", "[for x in range(10) if x % 2 == 0: x]"], "correct": 1, "explain": "Синтаксис генератора списков: [<что положить> for <переменная> in <источник> if <условие>] — именно в таком порядке, с if в само
