: ["Служебный комментарий Git с объяснением причины конфликта", "Версия кода из ветки, которую ты сливаешь", "Единственно правильный вариант, который нужно оставлять всегда", "Версия кода из твоей текущей ветки"], "correct": 3, "explain": "Всё между <<<<<<< HEAD и ======= — версия из твоей текущей ветки; между ======= и >>>>>>> <имя ветки> — версия из ветки, которую сливаешь."}, {"question": "Где правильно разрешать конфликт при синхронизации своей feature-ветки с main?", "options": ["В своей feature-ветке, выполнив в ней git merge main, а не наоборот", "Прямо в main, потому что там хранится самая актуальная версия кода", "Только через веб-редактор GitHub, локально это сделать невозможно", "Не имеет значения, результат в обоих случаях будет одинаковым"], "correct": 0, "explain": "Конфликт стоит подтягивать и разрешать в своей feature-ветке (git merge main), чтобы неразрешённое промежуточное состояние не оказалось в общей ветке, которой пользуются все остальные."}, {"question": "Почему стоит чаще синхронизировать свою ветку с main, а не откладывать это на конец задачи?", "options": ["Это ускоряет работу CI на удалённом сервере", "Чем дольше ветка живёт отдельно, тем сильнее она успевает разойтись с main, и тем крупнее и сложнее получится итоговый конфликт", "Это требование самого протокола Git — иначе push будет технически заблокирован", "GitHub автоматически удаляет ветки, которые долго не синхронизировались"], "correct": 1, "explain": "Частые небольшие синхронизации превращают потенциально один большой конфликт в несколько маленьких, которые гораздо проще разобрать по отдельности."}, {"question": "Почему после разрешения конфликта важно заново прогнать тесты перед push?", "options": ["Тесты нужны только в том случае, если конфликт произошёл именно в файле с тестами", "Это единственный способ технически убрать маркеры конфликта из файла", "Конфликт мог разрешиться без синтаксических ошибок, но с логической — например, выбрана не та версия функции", "Тесты не обязательны, если файл синтаксически корректен"], "correct": 2, "explain": "Синтаксически «чистое» разрешение конфликта не гарантирует правильности по смыслу — только прогон тестов покажет, что итоговый код действительно работает как надо."}]}, {"id": "p42", "section": "Модуль 2 · Git и командная работа", "subgroup": null, "isOverview": false, "num": "2.7", "title": "Код-ревью: с обеих сторон", "content": "# 2.7 Код-ревью: с обеих сторон\n\n## Зачем это нужно\n\nС этого модуля каждый твой PR смотрит одногруппник, и каждый его PR будешь смотреть ты. Ревью —\nэто не формальная преграда перед merge, а основной канал, через который ты учишься видеть чужие\nрешения и получаешь обратную связь на свои. От того, насколько конструктивно проходит ревью,\nзависит и качество кода в общем репозитории, и то, насколько комфортно в нём работать.\n\n## Теория\n\n### Со стороны ревьюера\n\nПеред тем как открыть вкладку с diff'ом — прочитай описание PR. Не зная намерения автора, легко\nкритиковать решение, которое на самом деле правильно закрывает задачу, просто не так, как сделал\nбы ты.\n\nКомментарии оставляются на конкретных строках кода (GitHub поддерживает это \"из коробки\" —\nнаводишь курсор на строку в diff, нажимаешь \"+\"). Хороший комментарий:\n\n- конкретен: \"здесь не обработан случай пустой строки — `text.split()` вернёт `[]`, и\n  `text.split()[0]` упадёт с `IndexError`\", а не \"тут что-то не так\";\n- предлагает, а не приказывает: \"как насчёт использовать `str.strip()` перед проверкой?\", а не\n  \"переделай\";\n- отделяет обязательное от необязательного — многие ревьюеры договариваются о конвенции\n  `nit:` в начале комментария для необязательных мелочей (\"nit: можно назвать переменную яснее\") —\n  это явно сообщает автору, что мёржу это не мешает.\n\nСтоит отмечать не только проблемы, но и удачные решения — короткое \"хорошо, что вынес это в\nотдельную функцию\" стоит недорого, а атмосферу в команде меняет заметно.\n\nЧто вообще проверять в ревью PR в этом курсе:\n- работает ли код и покрыт ли он тестом;\n- следует ли новый код структуре `boilerplate/` (новый API-клиент — рядом с `UsersClient`, по\n  тому же паттерну, а не с новой архитектурой с нуля);\n- нет ли в diff'е случайного мусора — закомментированного кода, файлов из `.gitignore`.\n\n### Со стороны автора\n\nКомментарий ревьюера — это про код, а не про тебя лично. Это стоит держать в голове особенно на\nпервых PR, когда любая правка к своему первому \"настоящему\" вкладу в общий репозиторий может\nвосприниматься остро.\n\n- Отвечай на каждый комментарий: либо правишь код и коммитишь исправление, либо, если не\n  согласен — объясняешь свою логику спокойно и по существу (не \"и так нормально\", а \"я выбрал\n  этот вариант, потому что …\"). Если непонятен сам комментарий — уточняй, а не додумывай.\n- Правки по ревью — это новые коммиты в ту же ветку (`git add`, `git commit`, `git push`), а не\n  переписывание истории на середине обсуждения: так ревьюеру видно, что именно изменилось в ответ\n  на его комментарий.\n- После того как правка внесена, отмечай соответствующий разговор в GitHub как resolved — это\n  помогает не потерять, что уже разобрано, а что нет.\n\n## Пример\n\nРевьюер оставляет комментарий на строке в `tests/unit/test_string_utils.py`:\n\n> **Комментарий ревьюера:** \"Не хватает кейса с пустой строкой — сейчас непонятно, что вернёт\n> `reverse_words('')`, стоит добавить `assert reverse_words('') == ''` в параметризацию.\"\n\nАвтор отвечает и правит:\n\n> **Ответ автора:** \"Точно, не учёл. Добавил кейс с пустой строкой в `@pytest.mark.parametrize`,\n> заодно проверил вручную — с текущей реализацией всё ок.\" *(пушит новый коммит в ту же ветку,\n> отмечает разговор как resolved)*\n\nОбсуждение осталось в истории PR — через полгода по нему видно не только что изменилось, но и\nпочему.\n\n## Частые ошибки\n\n- Ревьюер: расплывчатые комментарии вроде \"не нравится\" без объяснения, что именно и почему.\n- Ревьюер: придирки к стилю, который вообще-то регулируется линтером/форматтером, вместо разбора\n  сути решения.\n- Автор: молча игнорирует комментарии и пытается смёржить PR как есть.\n- Автор: реагирует на замечания defensively, спорит вместо того, чтобы разобраться в аргументе\n  ревьюера — из-за этого ревью превращается в конфликт, а не в разбор кода.\n\n## Мини-задание\n\nНайди любой открытый Pull Request в публичном open-source репозитории на GitHub (например, в\nнебольшом Python-проекте). Найди в нём 2 примера конструктивных комментариев ревьюера и, если\nполучится, 1-2 примера комментариев, которые можно было бы сформулировать понятнее — перепиши их\nпо правилам из этого урока.\n", "hasPractice": true, "quiz": [{"question": "В tests/unit/test_string_utils.py не хватает проверки на пустую строку. Какой комментарий ревьюера соответствует правилам хорошего ревью из этого урока?", "options": ["Написать автору личным сообщением в чате вместо комментария в самом PR", "«Не хватает кейса с пустой строкой — reverse_words('') может упасть, стоит добавить его в parametrize»", "«Тут что-то не так, переделай»", "Промолчать в комментариях и сразу нажать Request changes без пояснений"], "correct": 1, "explain": "Хороший комментарий ревьюера конкретен (указывает на конкретную проблему), объясняет её причину и предлагает решение — в отличие от общих фраз без объяснений или обсуждения в обход самого PR, где оно потеряется для остальных."}, {"question": "Что означает префикс «nit:» в начале комментария ревьюера?", "options": ["Сокращение, означающее, что комментарий можно полностью игнорировать", "Технический ярлык, который автоматически проставляет сам GitHub", "Это необязательное замечание, которое не блокирует merge PR", "Это блокирующая ошибка, без исправления которой merge невозможен"], "correct": 2, "explain": "Многие команды используют «nit:» в начале комментария, чтобы явно показать автору: это мелочь, желательно поправить, но она не обязательна для merge."}, {"question": "Как правильно реагировать автору PR на комментарий ревьюера, с которым он не согласен?", "options": ["Закрыть текущий PR и открыть новый без этого комментария", "Удалить комментарий ревьюера из обсуждения", "Промолчать и понадеяться, что ревьюер забудет про этот комментарий", "Спокойно и по существу объяснить свою логику выбора решения или уточнить, если комментарий непонятен"], "correct": 3, "explain": "Комментарий — это про код, а не про автора лично; несогласие стоит аргументировать по существу или задать уточняющий вопрос, а не игнорировать и не воспринимать как личную критику."}, {"question": "Как правильно вносить исправления по комментариям ревью в уже открытом PR?", "options": ["Запушить новые коммиты поверх существующих в ту же ветку — так ревьюеру видно, что именно изменилось в ответ на комментарий", "Переписать историю коммитов (rebase -i) прямо посреди обсуждения, чтобы история выглядела чище", "Создать отдельную новую ветку и новый PR под каждое отдельное исправление", "Просто написать в комментарии «исправлено», не меняя сам код"], "correct": 0, "explain": "Новые коммиты в ответ на ревью сохраняют историю обсуждения понятной — ревьюер видит именно то, что изменилось по его комментарию, а не переписанную с нуля историю."}, {"question": "Что, помимо простого «работает ли код», должен проверять ревьюер PR в этом курсе?", "options": ["Только орфографию в комментариях внутри кода", "Только общее количество строк в diff", "Только оформление сообщения коммита", "Покрыт ли новый код тестом и следует ли он уже существующим паттернам репозитория (например, новый клиент — по образцу существующих)"], "correct": 3, "explain": "В ревью PR этого курса важно проверять и покрытие тестами, и соответствие уже принятой структуре boilerplate — а не только формальный факт, что код запускается."}]}, {"id": "p43", "section": "Модуль 2 · Git и командная работа", "subgroup": null, "isOverview": false, "num": "2.8", "title": "Rebase vs merge: коротко о том, что это", "content": "# 2.8 Rebase vs merge: коротко о том, что это\n\n## Зачем это нужно\n\nСлово \"rebase\" рано или поздно встретится: в подсказке GitHub (\"This branch has conflicts that\nmust be resolved\" с предложением rebase или merge), в чужом PR, в статье про Git. Этот урок не\nучит тебя пользоваться rebase каждый день — для домашних заданий курса хватит `merge`, — но\nобъясняет, что это такое, чтобы термин не пугал и чтобы не сделать с ним что-то необратимое.\n\n## Теория\n\nИ `merge`, и `rebase` решают одну и ту же задачу — \"взять изменения из другой ветки\", но по-разному\nобращаются с историей коммитов.\n\n**merge** — создаёт новый, отдельный merge-коммит, который объединяет две истории. Ничего не\nпереписывается, все коммиты обеих веток остаются как есть:\n\n```\nA---B---C-------M   (main)\n         \\     /\n          D---E      (feature)\n```\n\n**rebase** — переносит коммиты твоей ветки так, будто они изначально были написаны поверх нового\nсостояния другой ветки. История становится линейной, но у перенесённых коммитов **меняются\nхэши** — фактически это новые коммиты с тем же содержимым:\n\n```\nA---B---C---D'---E'   (feature, после rebase на main)\n```\n\nЗдесь `D'` и `E'` — не те же коммиты, что `D` и `E` были раньше, а их копии с новой точкой отсчёта.\n\nИз этого следует главное правило: **не делай rebase ветки, которую уже видели/скачали другие\nлюди**. Если кто-то успел сделать `git pull` твоей ветки до rebase, а после rebase историю\nпереписали — у него в локальной копии останутся старые коммиты, а у тебя — новые с другими\nхэшами, и синхронизация превратится в путаницу.\n\nКогда что уместно:\n\n- **merge** — безопасный дефолт для синхронизации своей ветки с `main` (то, что показано в\n  уроке 2.6). Именно так стоит делать в этом курсе.\n- **rebase** — часто используют для того, чтобы почистить историю локальных коммитов перед\n  открытием PR (например, объединить пять коммитов \"wip\", \"wip2\", \"fix typo\" в один осмысленный),\n  или в командах, которые сознательно поддерживают линейную историю `main`. После rebase\n  локальной ветки, которую больше никто не скачивал, для обновления remote нужен `git push\n  --force` (точнее, более безопасный `--force-with-lease`) — обычный `push` откажется, потому что\n  история разошлась.\n\nДля этого курса: тестами и домашками проверяется результат, а не то, каким способом ты\nсинхронизировал ветку с `main` — используй `git pull` / `git merge`, это самый предсказуемый\nвариант, пока ты не наработал привычку понимать, что делает rebase в конкретной ситуации.\n\n## Пример\n\nОдни и те же две ветки — что получится в истории при merge и при rebase:\n\n```\nДо:\nA---B---C           (main)\n     \\\n      D---E          (feature)\n\nПосле git merge main (находясь в feature):\nA---B---C---------M   (feature)\n     \\           /\n      D---------E\n\nПосле git rebase main (находясь в feature):\nA---B---C---D'---E'   (feature)\n```\n\nПосле merge в истории виден отдельный merge-коммит `M` и то, что ветки расходились и снова\nсошлись. После rebase — ровная линия коммитов, как будто `feature` всегда создавалась от текущего\n`C`, а не от старого `B`.\n\n## Частые ошибки\n\n- Сделать rebase ветки, которую уже забрал себе (`git pull`) кто-то ещё, без предупреждения —\n  у него в истории образуется путаница с \"дублирующимися\" коммитами.\n- Перепутать `git pull` (по умолчанию — fetch + merge) с rebase — это разные операции, хотя `git\n  pull --rebase` тоже существует и делает третье: подтягивает изменения и переносит твои коммиты\n  поверх них.\n- Сделать `git push --force` в общую ветку, которой пользуются другие, без согласования — это\n  может стереть чужие коммиты на remote.\n\n## Мини-задание\n\nВ песочнице [Learn Git Branching](https://learngitbranching.js.org/?locale=ru_RU) пройди уровень,\nпосвящённый rebase, и в 2-3 предложениях своими словами опиши, чем результат отличается от того,\nчто получилось бы в том же сценарии через merge.\n", "hasPractice": true, "quiz": [{"question": "Одногруппник уже сделал git pull твоей ветки к себе. Можно ли теперь безопасно сделать rebase этой ветки и запушить её с --force?", "options": ["Нет — rebase меняет хэши уже перенесённых коммитов, и у одногруппника в локальной копии образуется рассинхронизация с твоей веткой", "Это не имеет значения — GitHub автоматически синхронизирует историю у всех участников", "Да, если перед этим сделать git merge main", "Да, rebase всегда безопасен для любой ветки в любой момент"], "correct": 0, "explain": "Rebase создаёт новые коммиты с другими хэшами вместо старых. Если кто-то уже скачал ветку до rebase, после принудительного push его локальная история разойдётся с твоей — именно поэтому rebase нельзя делать над веткой, которую уже видели другие."}, {"question": "Что происходит с историей коммитов при использовании git merge, в отличие от rebase?", "options": ["merge и rebase в любом случае дают абсолютно одинаковый результат в истории", "merge удаляет старые коммиты, оставляя в истории только самый последний", "merge создаёт отдельный merge-коммит, объединяющий две истории, не переписывая уже существующие коммиты", "merge всегда требует последующего git push --force"], "correct": 2, "explain": "merge добавляет новый merge-коммит поверх обеих историй, не трогая уже существующие коммиты — в отличие от rebase, который переносит и фактически пересоздаёт коммиты с новыми хэшами."}, {"question": "Какой способ синхронизации ветки с main рекомендуется использовать по умолчанию в домашних заданиях этого курса?", "options": ["git pull / git merge, как самый предсказуемый и безопасный по умолчанию вариант", "Полное удаление ветки и создание новой при любом расхождении с main", "git push --force перед началом любой новой работы", "git rebase main, потому что он якобы всегда безопаснее merge"], "correct": 0, "explain": "Пока не наработана уверенная привычка понимать, что именно делает rebase в конкретной ситуации, merge/pull — предсказуемый и безопасный вариант по умолчанию для домашних заданий курса."}, {"question": "Чем git pull --rebase отличается от обычного git pull?", "options": ["git pull --rebase работает только внутри GitHub Desktop", "git pull --rebase безвозвратно удаляет удалённую ветку на сервере", "Обычный git pull делает fetch + merge, а git pull --rebase делает fetch и переносит твои локальные коммиты поверх подтянутых изменений", "Ничем — это два разных названия одной и той же команды"], "correct": 2, "explain": "git pull по умолчанию — это fetch + merge (создаётся merge-коммит при расхождении веток), а git pull --rebase вместо этого переносит твои коммиты поверх новых, сохраняя линейную историю."}, {"question": "Почему после rebase у перенесённых коммитов меняются хэши, хотя их содержимое остаётся тем же?", "options": ["Хэши меняются только если дополнительно указан флаг --force", "Rebase технически создаёт новые коммиты с тем же содержимым, но другой точкой отсчёта — это уже не те же самые объекты, что были раньше", "Хэши коммитов в Git вообще никогда не меняются ни при каких операциях", "Это ошибка Git, которую в норме нужно чинить вручную"], "correct": 1, "explain": "Rebase не «двигает» существующие коммиты на новое место, а создаёт их копии поверх нового basis — у этих копий получаются новые хэши, хотя содержимое изменений остаётся тем же."}]}, {"id": "p44", "section": "Модуль 2 · Git и командная работа", "subgroup": null, "isOverview": false, "num": "2.9", "title": "Git flow этого курса: форк → ветка → PR → ревью → merge", "content": "# 2.9 Git flow этого курса: форк → ветка → PR → ревью → merge\n\n## Зачем это нужно\n\nВсе предыдущие уроки модуля были про отдельные кирпичики — ветки, PR, конфликты, ревью. Этот\nурок собирает их в один цикл, который ты будешь повторять для каждого домашнего задания с этого\nмодуля и до конца курса. Дальше в модулях 3–5 в этот же цикл просто подставляются новые задачи\n(API-клиент, Page Object, Allure-шаги) — сам процесс не меняется.\n\n## Теория\n\nПолный цикл одной задачи в общем репозитории `boilerplate/`:\n\n1. **Форк — один раз.** Форкаешь `boilerplate/` в свой GitHub-аккаунт (урок 2.2). Это разовое\n   действие на весь курс, а не на каждую задачу.\n2. **Синхронизация перед стартом.** Перед тем как начинать новую задачу, подтяни актуальный\n   `main`: `git switch main`, `git fetch upstream`, `git merge upstream/main`, `git push origin\n   main`. Это особенно важно начиная с модуля 3 — новые задачи строятся поверх кода, который\n   влили другие студенты (новые API-клиенты, Page Object'ы), и работа от устаревшего `main`\n   почти гарантированно приведёт к конфликтам.\n3. **Новая ветка.** `git switch -c feature/<короткое-описание>` (или `fix/...` для багфиксов) —\n   урок 2.3.\n4. **Реализация — маленькая и по структуре репозитория.** Правишь код, следуя уже существующим\n   паттернам: новая функция — в `utils/`, тест — в соответствующей папке `tests/unit|api|ui/`,\n   новый клиент — рядом с `UsersClient` в `clients/`. Не переписывай архитектуру заново ради одной\n   задачи (это явное правило самого `boilerplate/README.md`).\n5. **Коммиты и локальная проверка.** Осмысленные коммиты (урок 2.1), обязательно `pytest` локально\n   перед тем, как пушить — зелёные тесты снимают половину возможных комментариев ревьюера.\n6. **Push и открытие PR.** `git push -u origin feature/<...>`, затем PR на GitHub (урок 2.4).\n   Уточни у преподавателя/в когорте, куда именно в вашем случае открывается PR — в `main` своего\n   же форка (и тогда ревьюер смотрит форк) или сразу в оригинальный `boilerplate` (если у группы\n   настроен единый репозиторий с правами для всех студентов). Механика PR одинаковая в обоих\n   случаях, разница — только в том, какой репозиторий указан как base.\n7. **Описание по шаблону.** Что сделано / почему / как проверить (урок 2.5).\n8. **Ревью одногруппника.** Просишь ревью в чате когорты, отвечаешь на комментарии, пушишь\n   исправления (урок 2.7).\n9. **Конфликты, если возникли.** Синхронизируешь ветку с `main`, разрешаешь конфликты локально\n   (урок 2.6), снова прогоняешь тесты, пушишь.\n10. **Merge.** После approve (и зелёного CI, если он настроен — модуль 6) PR мёржится. Конкретный\n    способ (обычный merge или squash) обычно закреплён в самом репозитории — придерживайся того,\n    что уже принято, а не выбирай на своё усмотрение.\n11. **Уборка.** Удаляешь смёрженную ветку (`git branch -d feature/...`, GitHub предложит удалить\n    и remote-версию), синхронизируешь `main` ещё раз.\n12. **Следующая задача — с шага 2.**\n\n## Пример\n\nЧек-лист из шагов выше, применённый к конкретной домашней задаче — добавить в `boilerplate/`\nещё одну функцию в `utils/string_utils.py` с тестом (по аналогии с `week3-4` модуля 1):\n\n```bash\ngit switch main && git fetch upstream && git merge upstream/main && git push origin main\n\ngit switch -c feature/add-count-words\n\n# utils/string_utils.py — добавили count_words()\n# tests/unit/test_string_utils.py — добавили тест(ы) для count_words()\n\npytest -m unit\n\ngit add utils/string_utils.py tests/unit/test_string_utils.py\ngit commit -m \"Add count_words util with tests\"\n\ngit push -u origin feature/add-count-words\n# → открыть PR на GitHub, описание по шаблону из урока 2.5\n# → попросить ревью у одногруппника\n# → ответить на комментарии, если есть\n# → merge после approve\n```\n\nИменно эта последовательность — минимально достаточный набор шагов для сдачи домашнего задания\nмодуля (см. `99_Домашнее_задание.md`).\n\n## Частые ошибки\n\n- Создать новую ветку от устаревшего локального `main`, не подтянув `upstream` — это самая частая\n  причина \"необъяснимых\" конфликтов при открытии PR.\n- Взять в одну ветку/PR сразу две задачи — договорённость \"одна задача — одна ветка — один PR\"\n  действует с первого дня общего репозитория.\n- Не уточнить у преподавателя, куда именно в вашей группе открывается PR (в свой форк или в общий\n  upstream-репозиторий), и в итоге открыть PR туда, где его никто не увидит.\n- Забыть удалить смёрженную ветку — со временем список веток превращается в свалку, в которой\n  легко случайно продолжить работу в устаревшей ветке.\n\n## Мини-задание\n\nНе подглядывая в этот урок, распиши по шагам (на бумаге или в заметке) весь цикл от форка до\nудаления смёрженной ветки своими словами. Затем сверься с уроком — какие шаги забыл или перепутал\nпорядок.\n", "hasPractice": true, "quiz": [{"question": "Что нужно сделать первым делом перед тем, как начинать новую задачу в общем репозитории boilerplate/?", "options": ["Удалить локальный репозиторий и заново его склонировать перед каждой задачей", "Сразу открыть Pull Request с пустой веткой, чтобы «застолбить» задачу за собой", "Синхронизировать свой main с upstream (git fetch upstream + git merge upstream/main) и только потом создавать ветку", "Сразу создать новую ветку от текущего локального main, не проверяя его актуальность"], "correct": 2, "explain": "Начиная с модуля 3 новые задачи строятся поверх кода, который уже влили другие студенты — если не синхронизировать main с upstream перед стартом, новая ветка создаётся от устаревшего кода и почти гарантированно приведёт к лишним конфликтам при открытии PR."}, {"question": "Почему именно начиная с модуля 3 особенно важно синхронизировать main с upstream перед каждой новой задачей?", "options": ["upstream используется только один раз при форке репозитория и больше никогда не нужен", "С модуля 3 репозиторий активно растёт за счёт PR других студентов (API-клиенты, Page Object'ы), и работа от устаревшего main почти гарантированно приведёт к конфликтам", "Потому что GitHub блокирует создание веток без предварительной синхронизации", "Это не имеет значения ни в модуле 2, ни в модуле 3, синхронизация нужна только в финальном модуле"], "correct": 1, "explain": "С модуля 3 репозиторий активно растёт за счёт PR других студентов — не синхронизировав main, легко начать работу от кода, который уже устарел, и получить лишние конфликты при открытии PR."}, {"question": "Как правильно добавлять новую функциональность в общий репозиторий boilerplate/ по правилам этого курса?", "options": ["Переписать существующую архитектуру заново, если она кажется неоптимальной", "Каждый раз лично согласовывать структуру нового кода со всеми участниками группы", "Создать полностью отдельную ветку, не основанную на main вообще", "Следовать уже существующим паттернам — например, новый API-клиент добавлять рядом с UsersClient, в том же стиле"], "correct": 3, "explain": "Правило boilerplate/README.md — новый код добавляется рядом с существующим по тому же паттерну, а не переписывает архитектуру заново ради одной небольшой задачи."}, {"question": "Что нужно сделать перед тем, как пушить ветку и открывать по ней Pull Request?", "options": ["Полностью удалить локальную копию репозитория", "Прогнать тесты локально (например, pytest -m unit) и убедиться, что они зелёные", "Обязательно сделать rebase ветки на upstream/main перед любым push", "Ничего специально — тесты в любом случае запустит только CI"], "correct": 1, "explain": "Локальный прогон тестов перед push снимает значительную часть возможных замечаний ревьюера и не тратит время CI на то, что можно было проверить самому за несколько секунд."}, {"question": "Что нужно сделать сразу после того, как твой PR был смёржен в main?", "options": ["Откатить merge, чтобы не мешать работе других студентов", "Ничего — смёрженная ветка со временем удалится сама", "Немедленно продолжить новую задачу в той же самой ветке", "Удалить смёрженную ветку и синхронизировать свой main перед тем, как начинать следующую задачу"], "correct": 3, "explain": "Уборка после merge (удаление ветки, синхронизация main) — обязательная часть цикла: без неё список веток захламляется, и легко случайно продолжить новую работу в уже устаревшей ветке."}]}, {"id": "p45", "section": "Модуль 2 · Git и командная работа", "subgroup": null, "isOverview": false, "num": null, "title": "Домашнее задание. Модуль 2", "content": "# Домашнее задание. Модуль 2\n\n## Что сдаётся\n\nНачиная с этого модуля домашнее задание — не файл и не архив, а **Pull Request в общий\nрепозиторий курса**. Общий репозиторий — это `boilerplate/`, реальный стартовый фреймворк\n(`pytest` + `requests` + `playwright`), на базе которого построены все следующие модули курса:\nв модуле 3 в него добавляются API-тесты, в модуле 4 — Page Object'ы для UI, и так далее. Сейчас\nтвоя задача — не написать что-то сложное, а один раз пройти весь цикл целиком и получить первый\nсмёрженный PR.\n\n## Что нужно сделать\n\n1. **Форкни `boilerplate/`** в свой GitHub-аккаунт, если ещё не сделал этого в уроке 2.2.\n2. **Склонируй свой форк** локально и добавь `upstream`, указывающий на оригинальный репозиторий\n   (урок 2.2).\n3. **Синхронизируй `main`** с `upstream` перед началом работы (урок 2.9, шаг 2).\n4. **Создай ветку** от `main` с понятным именем, например `feature/add-<название-функции>`\n   (урок 2.3).\n5. **Сделай одно маленькое осмысленное изменение.** Проще всего — по аналогии с тем, что уже есть\n   в `utils/string_utils.py` и `tests/unit/test_string_utils.py` (модуль 1, week3-4): добавь ещё\n   одну чистую функцию-утилиту и тест(ы) к ней в том же стиле — без внешних зависимостей, без\n   сети, покрытую `@pytest.mark.unit`. Например: функция, которая считает количество слов в\n   строке, убирает повторяющиеся пробелы, переворачивает порядок символов и т. п. — на твой выбор,\n   главное, чтобы она была маленькой и протестированной.\n6. **Прогони тесты локально** (`pytest -m unit`) и убедись, что всё зелёное.\n7. **Закоммить и запушь** ветку в свой форк.\n8. **Открой Pull Request** с описанием по шаблону из урока 2.5 (что сделано / почему / как\n   проверить).\n9. **Попроси ревью у одногруппника** — в чате когорты или там, где договорились в вашей группе.\n10. **Ответь на комментарии**, если они будут (урок 2.7), и запушь исправления в ту же ветку.\n11. **Дождись merge** после approve.\n12. **Убери за собой**: удали смёрженную ветку, синхронизируй `main` ещё раз.\n\n## Критерий \"готово\"\n\nДомашнее задание засчитано, когда есть **первый смёрженный Pull Request** в общий репозиторий:\n\n- PR открыт из отдельной feature-ветки (не из `main`);\n- содержит одно небольшое, законченное изменение с тестом;\n- есть осмысленные Title и Description (что сделано, как проверить);\n- PR получил хотя бы одно ревью от одногруппника;\n- все замечания ревью либо учтены, либо обсуждены;\n- PR смёржен в `main`.\n\n## Если что-то пошло не так\n\n- Конфликт при синхронизации ветки с `main` — см. урок 2.6, разрешай локально, не удаляя чужой\n  код не глядя.\n- Непонятно, куда именно открывать PR (в свой форк или в общий upstream-репозиторий) — уточни у\n  преподавателя или в чате когорты, это зависит от того, как настроен доступ у вашей группы\n  (урок 2.9).\n- Нет ревьюера — попроси в общем чате когорты, ревью друг другу — часть процесса, а не\n  дополнительная услуга.\n\n## Что дальше\n\nС модуля 3 в этот же `boilerplate/` начнут добавляться API-тесты на `requests` — тем же циклом:\nветка → PR → ревью → merge, только задачи станут содержательнее. Сам процесс, который ты только\nчто прошёл, меняться не будет до конца курса.\n", "hasPractice": false}, {"id": "p46", "section": "Модуль 3 · API-тестирование", "subgroup": null, "isOverview": true, "num": null, "title": "Модуль 3. API-тестирование на requests (недели 6–7)", "content": "# Модуль 3. API-тестирование на requests (недели 6–7)\n\nДо этого момента ты тестировал либо чистые функции (модуль 1), либо разбирался с Git и общим репозиторием (модуль 2). Теперь — первый настоящий слой автотестов: API. Большая часть багов в реальных проектах ловится именно на уровне API — это быстрее, стабильнее и дешевле, чем гонять всё через UI.\n\nМодуль устроен иначе, чем можно ожидать: ты не пишешь API-клиент с нуля. В `boilerplate/` уже есть рабочий, проверенный `APIClient`, `UsersClient` и тесты на них поверх публичного демо-API [jsonplaceholder.typicode.com](https://jsonplaceholder.typicode.com). Твоя задача — сначала построчно разобраться, как это устроено, а затем научиться **наслаивать** на эту структуру новые методы и тесты, как это происходит в любой реальной команде: никто не переписывает фреймворк заново под каждую задачу.\n\nИсточник материала — `stepik-api-testing-advanced` (главы 05–07). Источник построен на библиотеке `httpx`, наш курс — на `requests`; все примеры кода в модуле адаптированы под `requests`, а идея архитектуры (`APIClient` → специализированные клиенты → Pydantic-схемы) сохранена.\n\n## Неделя 6 — HTTP и requests с нуля\n\n1. [Что такое API и HTTP](#p47)\n2. [HTTP-методы: GET, POST, PUT, PATCH, DELETE](#p48)\n3. [Коды состояния HTTP](#p49)\n4. [Заголовки и авторизация](#p50)\n5. [Библиотека requests: первые запросы](#p51)\n6. [От requests.get() в тесте — к API-клиенту](#p52)\n\n## Неделя 7 — устройство API-клиента и Pydantic\n\n7. [Базовый API-клиент: BaseUrlSession и APIClient](#p53)\n8. [UsersClient и фикстура users_client](#p54)\n9. [Знакомство с Pydantic: BaseModel и валидация](#p55)\n10. [Вложенные модели и Field(alias=...)](#p56)\n11. [model_validate_json vs response.json()](#p57)\n12. [Разбор test_users.py: всё вместе](#p58)\n13. [Добавляем новый метод в клиент](#p59)\n14. [Домашнее задание](#p60)\n\n## Итог модуля\n\nСтудент открывает PR в общий репозиторий с 5–7 новыми API-тестами: новые методы `UsersClient` (например, `update_user_api`, `delete_user_api`) наследуются от `APIClient`, у запроса и ответа есть Pydantic-схемы, тесты используют фикстуру `users_client` и проверяют не только счастливый путь, но и ошибки (404, невалидные данные).\n", "hasPractice": false}, {"id": "p47", "section": "Модуль 3 · API-тестирование", "subgroup": "Неделя 6", "isOverview": false, "num": "3.1", "title": "Что такое API и HTTP", "content": "# 3.1. Что такое API и HTTP\n\n## Зачем это нужно\n\nТестировщик, который тестирует только через UI, всегда на шаг медленнее и менее стабилен, чем тот, кто умеет проверять то же самое напрямую через API. Клик по кнопке в браузере в итоге превращается в один или несколько HTTP-запросов — и если ты понимаешь, что происходит на этом уровне, ты можешь проверить бизнес-логику быстрее, надёжнее и без танцев с локаторами.\n\n## Теория\n\n**API (Application Programming Interface)** — это набор правил, по которым одна программа может обращаться к другой за данными или функциональностью. Можно провести аналогию с меню в кафе: тебе не обязательно знать, как устроена кухня — достаточно знать, что можно заказать (доступные \"методы\") и что ты получишь в ответ.\n\nВ вебе самый распространённый вид API — **REST API поверх HTTP**. Именно с ним мы и будем работать весь модуль. Есть и другие подходы (SOAP, GraphQL, gRPC, WebSocket), но в большинстве коммерческих проектов на позиции QA automation тебе для начала хватит HTTP/REST.\n\n### Клиент-серверная модель\n\nВсё взаимодействие строится по схеме \"клиент — сервер\":\n\n- **Клиент** — тот, кто инициирует запрос (браузер, мобильное приложение, твой тест на `requests`).\n- **Сервер** — тот, кто принимает запрос, что-то с ним делает (читает из базы, считает, валидирует) и отправляет ответ.\n\nКлиент отправляет **запрос (request)**, сервер возвращает **ответ (response)**. Это применимо и когда ты открываешь сайт в браузере, и когда пишешь тест — разница только в том, кто выступает клиентом.\n\n### HTTP: протокол, на котором всё это работает\n\n**HTTP (HyperText Transfer Protocol)** — протокол прикладного уровня, по которому передаются запросы и ответы между клиентом и сервером. Две вещи, которые важно понимать про HTTP с самого начала:\n\n1. **HTTP без состояния (stateless).** Каждый запрос обрабатывается независимо от предыдущих — сервер не \"помнит\" тебя между запросами сам по себе. Именно поэтому существуют механизмы вроде токенов и cookie — они переносят \"память\" о состоянии на сторону клиента или в отдельное хранилище на сервере.\n2. **У запроса и ответа есть чёткая структура.** Запрос состоит из метода, URL, заголовков и (не всегда) тела. Ответ — из статус-кода, заголовков и тела. Про методы и статус-коды — в следующих двух уроках.\n\n### Как это выглядит \"на проводе\"\n\nУпрощённо HTTP-запрос выглядит так:\n\n```\nGET /users/123 HTTP/1.1\nHost: jsonplaceholder.typicode.com\nAccept: application/json\n```\n\nА ответ — так:\n\n```\nHTTP/1.1 200 OK\nContent-Type: application/json\n\n{\n  \"id\": 123,\n  \"name\": \"Leanne Graham\"\n}\n```\n\nКогда ты в тесте пишешь `requests.get(...)`, библиотека `requests` формирует именно такой запрос за тебя и парсит именно такой ответ — тебе не нужно писать эти строки руками. Но полезно понимать, что происходит \"под капотом\", когда что-то идёт не так (например, сервер вернул не тот `Content-Type`, а тест падает на `response.json()`).\n\n## Пример\n\nВ нашем общем репозитории (`boilerplate/`) API-тесты ходят на публичный демо-сервис [jsonplaceholder.typicode.com](https://jsonplaceholder.typicode.com). Это фейковый REST API: он ничего реально не сохраняет, но отвечает как настоящий сервер — с корректными статус-кодами и JSON-телом. Именно поэтому он удобен для учёбы: не нужно поднимать локальный сервер или получать доступ к боевому стенду.\n\n```bash\ncurl https://jsonplaceholder.typicode.com/users/1\n```\n\nОтвет придёт в формате JSON — том самом, который мы будем разбирать в тестах весь модуль.\n\n## Частые ошибки\n\n- Путать API вообще и REST API поверх HTTP — думать, что \"API\" обязательно значит \"HTTP-запрос\". API — понятие шире (например, методы класса в Python — тоже API), просто в контексте этого модуля мы всегда говорим про HTTP.\n- Считать, что раз HTTP stateless, то \"сессии\" и \"токены авторизации\" — что-то незначительное. Наоборот: именно из-за stateless-природы HTTP их изобрели, чтобы сервер вообще мог отличать один твой запрос от другого.\n- Игнорировать заголовки ответа и опираться только на тело. Например, `Content-Type` подсказывает, чего вообще ожидать в теле — JSON это, HTML или что-то ещё.\n\n## Мини-задание\n\nВыполни `curl -i https://jsonplaceholder.typicode.com/users/1` (флаг `-i` покажет заголовки ответа). Найди в выводе статус-строку, `Content-Type` и тело ответа. Определи, сколько полей верхнего уровня в JSON-объекте пользователя и есть ли среди них вложенные объекты.\n", "hasPractice": true, "quiz": [{"question": "HTTP — протокол без сохранения состояния (stateless): сервер не помнит предыдущие запросы клиента сам по себе. Что из этого практически следует для тестировщика API?", "options": ["Сервер сам помнит предыдущие запросы клиента без каких-либо дополнительных данных", "Каждый запрос должен быть самодостаточным: если нужна авторизация, её нужно передавать в каждом запросе (или один раз настроить на уровне сессии)", "Stateless означает, что HTTP не поддерживает передачу JSON в теле запроса", "Между двумя запросами от одного клиента сервер обязательно должен использовать одно и то же TCP-соединение"], "correct": 1, "explain": "Именно из-за stateless-природы HTTP существуют токены и cookie — они переносят «память» о состоянии на сторону клиента или в отдельное хранилище, а не в сам протокол."}, {"question": "В клиент-серверной модели, кто инициирует HTTP-запрос?", "options": ["Сервер, ожидая, что клиент ответит", "Прокси-сервер, стоящий между клиентом и сервером", "Клиент — например, браузер, мобильное приложение или тест на requests", "DNS-сервер, который резолвит доменное имя"], "correct": 2, "explain": "Клиент — тот, кто инициирует запрос; сервер только принимает его, обрабатывает и отвечает. В тестах клиентом выступает твой код на requests."}, {"question": "Что вернее всего описывает соотношение между API и «REST API поверх HTTP», о котором говорится в уроке?", "options": ["API — это только методы класса в языке программирования, к вебу отношения не имеет", "REST API поверх HTTP — один из самых распространённых, но не единственный способ реализовать API (есть также SOAP, GraphQL, gRPC, WebSocket)", "Это синонимы — любое API обязательно работает через HTTP", "HTTP — это надстройка над REST, а не наоборот"], "correct": 1, "explain": "API — понятие шире HTTP (например, методы класса — тоже API). В вебе REST поверх HTTP — один из самых распространённых подходов, но не единственный."}, {"question": "Из каких частей состоит HTTP-запрос, согласно уроку?", "options": ["Метод, URL, заголовки и (не всегда) тело", "Статус-код, заголовки и тело", "Только URL и метод, без заголовков", "Только заголовки и тело, без метода"], "correct": 0, "explain": "Запрос состоит из метода (какое действие выполнить), URL (над каким ресурсом), заголовков (метаданные) и не всегда обязательного тела."}, {"question": "Тест вызывает response.json() и получает ошибку парсинга. На какой заголовок ответа стоит посмотреть в первую очередь, чтобы понять, чего вообще ожидать в теле?", "options": ["Accept", "Host", "Content-Type", "User-Agent"], "correct": 2, "explain": "Content-Type подсказывает формат тела ответа — JSON это, HTML или что-то ещё. Игнорировать этот заголовок и опираться только на тело — частая ошибка новичков."}]}, {"id": "p48", "section": "Модуль 3 · API-тестирование", "subgroup": "Неделя 6", "isOverview": false, "num": "3.2", "title": "HTTP-методы: GET, POST, PUT, PATCH, DELETE", "content": "# 3.2. HTTP-методы: GET, POST, PUT, PATCH, DELETE\n\n## Зачем это нужно\n\nВыбор метода — это не формальность, а часть контракта API. Тест, который дергает `POST` там, где по смыслу должен быть `PATCH`, либо не пройдёт, либо (что хуже) пройдёт, но будет проверять не то, что нужно. Умение по описанию эндпоинта понять, каким методом его вызывать, — база, без которой дальше двигаться некуда.\n\n## Теория\n\nHTTP-метод — это часть запроса, которая говорит серверу, **какое действие** клиент хочет выполнить над ресурсом. В REST-подходе есть негласное соглашение: одни и те же URL по-разному ведут себя в зависимости от метода. Например, `/users/5`:\n\n- `GET /users/5` — получить пользователя с id=5.\n- `PUT /users/5` — полностью заменить пользователя с id=5.\n- `PATCH /users/5` — частично обновить пользователя с id=5.\n- `DELETE /users/5` — удалить пользователя с id=5.\n\nРазберём методы, с которыми ты будешь работать чаще всего.\n\n### GET — получить данные\n\nИспользуется для чтения. По конвенции GET-запросы не должны изменять состояние на сервере — это называется **безопасный метод** (safe method). Тело запроса у GET, как правило, не используется — все параметры передаются в URL (path-параметры вроде `/users/5` или query-параметры вроде `/users?userId=1`).\n\n### POST — создать данные / выполнить действие\n\nЧаще всего используется для создания нового ресурса (например, регистрация пользователя) или для операций, которые не укладываются в \"чистый CRUD\" (например, `/login`). Данные передаются в теле запроса, обычно в формате JSON.\n\n### PUT — полностью заменить ресурс\n\nОжидается, что клиент присылает **все** поля ресурса — сервер полностью заменяет старую версию новой. Если ты пришлёшь только часть полей, по строгой семантике REST остальные должны быть сброшены или обнулены (на практике конкретные API иногда ведут себя мягче — это всегда нужно проверять по документации, а не угадывать).\n\n### PATCH — частично обновить ресурс\n\nВ отличие от PUT, PATCH ожидает только те поля, которые нужно изменить. Остальные поля ресурса остаются как были. Это самый частый метод для операций вида \"обнови email пользователя, не трогая остальное\".\n\n### DELETE — удалить ресурс\n\nУдаляет ресурс по идентификатору. Тело запроса обычно не нужно.\n\n### Идемпотентность — важное свойство\n\nМетод называется **идемпотентным**, если повторный вызов с теми же параметрами не меняет результат по сравнению с одним вызовом. `GET`, `PUT` и `DELETE` идемпотентны (удалить уже удалённый ресурс — то же самое, что удалить его один раз, с точки зрения конечного состояния). `POST` — нет: два одинаковых POST-запроса на создание пользователя обычно создадут двух разных пользователей. Это важно держать в голове при написании тестов: если тест несколько раз наступает на один и тот же POST, будь готов к дублям.\n\n## Пример\n\nОтправить эти запросы можно как через `curl`, так и через `requests` (с этой библиотекой подробно познакомимся в уроке 3.5):\n\n```bash\ncurl https://jsonplaceholder.typicode.com/users/1                     # GET\ncurl -X POST https://jsonplaceholder.typicode.com/users \\\n     -H \"Content-Type: application/json\" \\\n     -d '{\"name\": \"QA Student\"}'                                      # POST\ncurl -X PATCH https://jsonplaceholder.typicode.com/users/1 \\\n     -H \"Content-Type: application/json\" \\\n     -d '{\"name\": \"Updated Name\"}'                                    # PATCH\ncurl -X DELETE https://jsonplaceholder.typicode.com/users/1           # DELETE\n```\n\nОбрати внимание: JSONPlaceholder ничего реально не сохраняет — сервер просто отвечает так, как ответил бы настоящий REST API, но данные не персистятся между запросами. Это нормально для учебных целей: мы проверяем, что API **правильно отвечает** на запрос, а не ведём реальную базу данных.\n\n## Частые ошибки\n\n- Использовать POST везде, \"потому что он с телом запроса\" — даже для обновления или удаления. Метод должен соответствовать действию, а не быть выбран по удобству.\n- Путать PUT и PATCH и присылать в PUT только часть полей, ожидая, что остальные не изменятся, — это поведение PATCH, а не PUT.\n- Забывать, что тело GET-запроса — не стандартная практика, и пытаться передать через него JSON вместо query-параметров.\n- Не проверять в тестах именно то поведение, которое подразумевает метод (например, для DELETE — что ресурс действительно перестаёт быть доступен по GET после удаления).\n\n## Мини-задание\n\nОткрой документацию любого публичного API (например, [jsonplaceholder.typicode.com](https://jsonplaceholder.typicode.com/guide/)) и выпиши для ресурса `/posts` все доступные методы и что каждый из них должен делать. Отметь для себя, какие из них идемпотентны.\n\nЗатем проверь себя на практике: отправь `curl`-ом (или через `requests`) `GET`, `PUT`, `PATCH` и `DELETE` на `https://jsonplaceholder.typicode.com/posts/1`, а `POST` — на `https://jsonplaceholder.typicode.com/posts` (обрати внимание: у POST другой адрес — он создаёт новый ресурс в коллекции, а не действует на конкретный `/posts/1`). Запиши рядом с каждым методом из своего списка реальный статус-код и краткое содержание ответа, которые вернул сервер. Сверь с тем, что ты предсказал по документации, — совпало или нет?\n", "hasPractice": true, "quiz": [{"question": "Чем отличается PATCH от PUT при обновлении ресурса?", "options": ["PUT и PATCH — это два названия одного и того же метода, разницы нет", "PATCH используется только для чтения данных, а PUT — для их изменения", "PATCH ожидает только изменяемые поля, а PUT — полную замену ресурса всеми полями", "PATCH нельзя использовать с телом запроса, а PUT — можно"], "correct": 2, "explain": "PUT по семантике REST заменяет ресурс целиком, поэтому клиент должен прислать все поля. PATCH — частичное обновление: присылаются только те поля, которые нужно изменить."}, {"question": "Почему POST считается неидемпотентным методом, в отличие от GET, PUT и DELETE?", "options": ["Потому что POST нельзя использовать с JSON-телом", "Потому что POST не поддерживается публичными демо-API вроде JSONPlaceholder", "Потому что два одинаковых POST-запроса обычно создают два разных ресурса (например, двух пользователей), а не один и тот же результат", "Потому что POST всегда требует авторизации, а остальные методы — нет"], "correct": 2, "explain": "Идемпотентность значит, что повторный вызов не меняет результат по сравнению с одним вызовом. Повторный POST на создание пользователя обычно создаёт ещё одного пользователя — значит, метод неидемпотентен."}, {"question": "Что говорится в уроке про использование тела запроса в GET?", "options": ["GET и POST используют тело запроса одинаковым образом", "Тело GET-запроса — стандартная практика, все параметры передаются только через него", "Тело GET-запроса обязательно должно быть в формате XML", "GET, как правило, не использует тело — параметры передаются через URL (path- или query-параметры)"], "correct": 3, "explain": "GET — безопасный метод для чтения; тело у него обычно не используется, все параметры передаются в URL."}, {"question": "Тест отправляет DELETE вместо PATCH на /users/5, желая изменить только одно поле пользователя. Что, скорее всего, произойдёт?", "options": ["Ресурс будет удалён, а не частично обновлён — метод определяет действие независимо от намерения того, кто пишет тест", "Сервер автоматически поймёт, что имелось в виду, и выполнит PATCH", "Ничего не изменится — DELETE и PATCH взаимозаменяемы для любых ресурсов", "DELETE без тела запроса всегда возвращает ошибку 400"], "correct": 0, "explain": "Метод — часть контракта API: сервер выполнит именно то действие, которое соответствует методу (DELETE — удаление), а не то, что тест «имел в виду»."}, {"question": "Согласно разделу «Частые ошибки» урока, что важно проверить в тесте на DELETE, помимо самого статус-кода успешного ответа?", "options": ["Что DELETE обязательно возвращает тело с полным описанием удалённого объекта", "Что DELETE всегда должен возвращать код 201", "Что после удаления ресурс действительно перестаёт быть доступен по GET (там, где это применимо к реальному API)", "Что DELETE можно вызвать только один раз за всё время жизни приложения"], "correct": 2, "explain": "Частая ошибка новичков — проверить только статус-код DELETE и не проверить, что ресурс действительно стал недоступен, а ведь именно это и есть смысл операции удаления."}]}, {"id": "p49", "section": "Модуль 3 · API-тестирование", "subgroup": "Неделя 6", "isOverview": false, "num": "3.3", "title": "Коды состояния HTTP", "content": "# 3.3. Коды состояния HTTP\n\n## Зачем это нужно\n\nПервое, что проверяет почти любой API-тест, — это статус-код ответа. `assert response.status_code == 200` — самая частая строчка в этом модуле. Чтобы писать осмысленные проверки (а не копировать код отовсюду), нужно понимать, что означает каждая группа кодов и какие коды стоит ожидать в каких сценариях, включая \"несчастливые\" пути.\n\n## Теория\n\nСтатус-код — это трёхзначное число в начале ответа сервера, которое коротко сообщает результат обработки запроса. Коды делятся на пять групп по первой цифре.\n\n- **1xx — информационные.** На практике в API-тестах почти не встречаются, можно не запоминать подробно.\n- **2xx — успех.** Запрос обработан так, как ожидалось.\n  - `200 OK` — успешный запрос (обычно для GET, PUT, PATCH).\n  - `201 Created` — ресурс успешно создан (обычно для POST).\n  - `204 No Content` — запрос выполнен успешно, но в ответе нет тела (часто встречается после DELETE).\n- **3xx — редиректы.** Клиенту нужно сходить по другому адресу. В API-тестах встречается реже, чем в браузерных сценариях.\n- **4xx — ошибка на стороне клиента.** Запрос сформирован неправильно, или у клиента нет прав/данных.\n  - `400 Bad Request` — некорректный запрос (например, невалидный JSON или отсутствует обязательное поле).\n  - `401 Unauthorized` — не пройдена аутентификация (нет токена или он невалиден).\n  - `403 Forbidden` — аутентификация пройдена, но прав на это действие нет.\n  - `404 Not Found` — ресурс не найден (например, запросили пользователя с несуществующим id).\n  - `422 Unprocessable Entity` — запрос синтаксически корректен, но данные не проходят валидацию (например, email не в том формате).\n- **5xx — ошибка на стороне сервера.** Что-то сломалось на бэкенде, и это не вина клиента.\n  - `500 Internal Server Error` — необработанная ошибка сервера.\n  - `502`/`503` — сервер недоступен или перегружен.\n\n### Почему это важно для тестов, а не только \"для справки\"\n\nХороший API-тест никогда не проверяет только happy path (успешный сценарий). Не менее важны так называемые \"негативные\" тесты — когда мы намеренно провоцируем ошибку и проверяем, что сервер отвечает **правильным** кодом ошибки, а не, скажем, `500` там, где должен быть `404`. Если сервер на некорректный запрос возвращает `200 OK` с телом ошибки внутри — это тоже баг, и его тоже можно поймать проверкой статус-кода.\n\n## Пример\n\nВ нашем общем репозитории уже есть пример именно такой негативной проверки — тест на несуществующего пользователя, `boilerplate/tests/api/test_users.py`:\n\n```python\n@allure.title(\"Получение несуществующего пользователя возвращает 404\")\ndef test_get_user_not_found(self, users_client: UsersClient):\n    with allure.step(\"Запрашиваем заведомо несуществующего пользователя\"):\n        response = users_client.get_user_api(user_id=999)\n\n    with allure.step(\"Проверяем статус-код ответа\"):\n        assert response.status_code == 404\n```\n\nОбрати внимание: тест не проверяет тело ответа — только статус-код. Это осознанный выбор для базовой негативной проверки. Мы разберём этот тест целиком в уроке 3.12, когда познакомимся со всей структурой `UsersClient`.\n\n## Частые ошибки\n\n- Проверять в тесте только happy path и не писать ни одного теста на ошибочный сценарий (несуществующий id, невалидные данные, отсутствие авторизации).\n- Путать `401` и `403` — первое означает \"я не знаю, кто ты\", второе — \"я знаю, кто ты, но тебе сюда нельзя\".\n- Считать, что `200 OK` всегда значит \"всё хорошо\" — некоторые (плохо спроектированные) API возвращают `200` с телом вида `{\"error\": \"...\"}`. В таких случаях тест должен проверять и статус-код, и содержимое тела.\n- Не глядя писать `assert response.status_code == 200` для любого запроса — для POST, создающего ресурс, корректный код может быть `201`, а не `200`.\n\n## Мини-задание\n\nОтправь запрос на несуществующий ресурс `https://jsonplaceholder.typicode.com/users/9999` и посмотри на статус-код в ответе. Затем отправь `POST` на `https://jsonplaceholder.typicode.com/posts` с телом `{\"title\": \"test\"}` и сравни статус-код с тем, что ты получил на GET-запрос из урока 3.1. Объясни себе, почему коды разные.\n", "hasPractice": true, "quiz": [{"question": "Чем принципиально отличается 401 Unauthorized от 403 Forbidden?", "options": ["401 означает, что сервер не смог опознать/аутентифицировать клиента, а 403 — что клиент опознан, но у него нет прав на это действие", "401 — это ошибка на стороне сервера, а 403 — ошибка на стороне клиента", "Разницы между 401 и 403 нет, коды взаимозаменяемы", "401 используется только для GET-запросов, а 403 — только для POST-запросов"], "correct": 0, "explain": "401 — это «я не знаю, кто ты» (не пройдена аутентификация), 403 — «я знаю, кто ты, но тебе сюда нельзя» (не хватает прав)."}, {"question": "Тест отправляет POST-запрос, который успешно создаёт новый ресурс. Какой статус-код правильнее ожидать по конвенции, обсуждаемой в уроке?", "options": ["204 No Content, так как тело ответа не нужно", "404 Not Found, так как ресурс ещё не существовал до запроса", "201 Created — для успешного создания ресурса, обычно через POST", "200 OK, как и для любого успешного запроса"], "correct": 2, "explain": "201 Created — код для успешного создания ресурса (обычно POST). Не глядя писать 200 для любого успеха — частая ошибка новичков, отмеченная в уроке."}, {"question": "Почему в уроке подчёркивается, что хороший API-тест не должен проверять только happy path?", "options": ["Потому что негативные тесты ловят ситуации, когда сервер отвечает неправильным кодом ошибки (например, 500 вместо 404) — это тоже баг", "Потому что негативные тесты не требуют проверки статус-кода вообще", "Потому что happy path тесты выполняются медленнее негативных", "Потому что happy path тесты нельзя автоматизировать"], "correct": 0, "explain": "Негативные тесты намеренно провоцируют ошибку и проверяют, что сервер отвечает правильным кодом ошибки — это способно поймать баг, который happy path не увидит."}, {"question": "Что имеется в виду в уроке под «плохо спроектированным API» применительно к статус-коду 200?", "options": ["API, у которого 200 означает то же самое, что и 404", "API, который использует только код 500 для всех ошибок", "API, который никогда не возвращает 200", "API, который возвращает 200 OK, но с телом вида {\"error\": \"...\"} — тогда тест должен проверять не только статус-код, но и содержимое тела"], "correct": 3, "explain": "Некоторые API возвращают 200 даже при ошибке, пряча её в теле ответа. Поэтому нельзя полагаться только на статус-код — иногда нужно проверять и содержимое тела."}, {"question": "К какой группе статус-кодов относится ошибка, при которой запрос сформирован некорректно самим клиентом (например, не передано обязательное поле)?", "options": ["4xx — ошибка клиента", "2xx — успех", "1xx — информационные", "5xx — ошибка сервера"], "correct": 0, "explain": "4xx — группа ошибок клиента: некорректный запрос, отсутствие авторизации, отсутствие прав или несуществующий ресурс — вина того, кто сформировал запрос, а не сервера."}]}, {"id": "p50", "section": "Модуль 3 · API-тестирование", "subgroup": "Неделя 6", "isOverview": false, "num": "3.4", "title": "Заголовки и авторизация", "content": "# 3.4. Заголовки и авторизация\n\n## Зачем это нужно\n\nПочти любой API в коммерческом проекте закрыт авторизацией — открытые демо-эндпоинты вроде JSONPlaceholder скорее исключение, чем правило. Если ты не понимаешь, как работает передача токена через заголовки, ты не сможешь протестировать ни один реальный защищённый API.\n\n## Теория\n\n**Заголовки (headers)** — это метаданные запроса и ответа: пары \"ключ: значение\", которые не являются основным телом сообщения, но управляют тем, как это сообщение обрабатывать. Примеры:\n\n- `Content-Type` — какой формат данных в теле (`application/json`, `application/x-www-form-urlencoded` и т. д.).\n- `Accept` — какой формат ответа клиент готов принять.\n- `Authorization` — данные для аутентификации запроса.\n\n### Идентификация, аутентификация, авторизация — в чём разница\n\nЭти три термина часто путают:\n\n- **Идентификация** — \"кто ты?\" (например, ты вводишь email/логин).\n- **Аутентификация** — \"докажи, что ты это ты\" (например, вводишь пароль, или сервер проверяет твой токен).\n- **Авторизация** — \"что тебе можно?\" (даже успешно аутентифицированный пользователь может не иметь прав на конкретное действие — тогда сервер вернёт `403 Forbidden`).\n\n### Основные схемы передачи авторизации в HTTP\n\n**Basic Authentication.** Логин и пароль склеиваются через двоеточие и кодируются в Base64, результат кладётся в заголовок:\n\n```\nAuthorization: Basic dXNlcm5hbWU6cGFzc3dvcmQ=\n```\n\nBase64 — это не шифрование, а просто кодирование, поэтому Basic Auth имеет смысл только поверх HTTPS. Встречается редко — в основном во внутренних или простых системах.\n\n**Сессионная аутентификация (cookie-based).** После логина сервер создаёт сессию и отдаёт клиенту идентификатор сессии в cookie. Дальше браузер сам прикладывает эту cookie к каждому запросу. Классика для традиционных веб-приложений, менее характерна для API, с которыми мы работаем в этом курсе.\n\n**Токен-based (то, с чем ты будешь работать чаще всего).** После успешного логина сервер выдаёт токен (часто — [JWT](https://jwt.io/)), который клиент дальше передаёт в заголовке `Authorization` в каждом запросе:\n\n```\nAuthorization: Bearer <ACCESS_TOKEN>\n```\n\nСлово `Bearer` буквально означает \"предъявитель\" — сервер доверяет любому, кто предъявит этот токен, не требуя ничего дополнительного при каждом запросе. Именно поэтому токены нужно защищать так же, как пароли: если токен утечёт, им может воспользоваться кто угодно до истечения срока его действия.\n\nЕсть и вариант **API Key** — статичный ключ, который выдаётся один раз и передаётся так же через заголовок (`Authorization: ApiKey <KEY>` или собственный заголовок вроде `X-API-Key`). В отличие от JWT, у API-ключа обычно нет встроенного срока действия — это одновременно и удобство, и риск.\n\n### Почему это важно для архитектуры клиента\n\nЗабегая вперёд (подробно разберём в модуле недели 7): если API требует авторизации, разумно не передавать заголовок `Authorization` вручную в каждом запросе, а настроить его один раз — на уровне HTTP-сессии. Тогда все запросы через эту сессию будут автоматически \"подписаны\" токеном. Именно так устроен `requests.Session` — и именно поэтому наш общий репозиторий строит API-клиенты поверх сессии, а не поверх одиночных вызовов `requests.get(...)`.\n\n## Пример\n\nПередать заголовок с токеном через `requests` можно так:\n\n```python\nimport requests\n\nheaders = {\"Authorization\": \"Bearer my_secret_token\"}\nresponse = requests.get(\"https://httpbin.org/get\", headers=headers)\n\nprint(response.json())  # заголовки будут видны в теле ответа — httpbin их просто отражает\n```\n\nJSONPlaceholder, на котором построены тесты в `boilerplate/`, авторизации не требует — это осознанный выбор для учебного проекта: студент должен сосредоточиться на структуре клиента и Pydantic-схемах, а не тратить время на получение тестового токена. Но `APIClient`, который мы разберём в модуле недели 7, спроектирован так, что добавить заголовок `Authorization` для авторизованного API — это одна строчка в месте создания сессии, а не правки во всех методах клиента.\n\n## Частые ошибки\n\n- Путать аутентификацию и авторизацию — считать, что раз запрос прошёл `401`, то дальше точно можно всё (может прийти `403` на конкретное действие).\n- Хардкодить токен в тексте теста вместо того, чтобы получать его через логин-эндпоинт или переменные окружения — тестовые токены имеют свойство протухать, а хардкод в репозитории — это ещё и риск утечки в реальных проектах.\n- Забывать заголовок `Content-Type: application/json` при отправке JSON вручную (через `curl` или низкоуровневые библиотеки) — без него сервер может не суметь разобрать тело запроса. `requests` при использовании параметра `json=` в `post/put/patch` подставляет этот заголовок сам.\n- Путать `Bearer <token>` и просто `<token>` — без префикса `Bearer` многие серверы не распознают заголовок.\n\n## Мини-задание\n\nВыполни `requests.get(\"https://httpbin.org/headers\", headers={\"Authorization\": \"Bearer test123\"})` (можно и через `curl -H`) и посмотри на тело ответа: `httpbin.org` отражает обратно все заголовки, которые ты отправил. Убедись, что твой заголовок `Authorization` дошёл до сервера именно в том виде, в котором ты его отправил.\n", "hasPractice": true, "quiz": [{"question": "Как токен передаётся серверу в схеме Bearer-авторизации?", "options": ["В URL как query-параметр ?token=...", "В заголовке Content-Type вместе с типом данных", "В теле каждого GET-запроса в виде JSON-поля token", "В заголовке Authorization в виде Bearer <ACCESS_TOKEN>"], "correct": 3, "explain": "Токен передаётся в заголовке Authorization с префиксом Bearer — сервер доверяет любому, кто предъявит этот токен, поэтому его нужно защищать так же, как пароль."}, {"question": "Пользователь успешно вводит правильный пароль после ввода логина. Какой из трёх процессов (идентификация/аутентификация/авторизация) это иллюстрирует?", "options": ["Ни один из трёх процессов — ввод пароля к ним не относится", "Идентификация — пользователь просто сообщает, кто он", "Авторизация — определение прав доступа пользователя", "Аутентификация — подтверждение, что пользователь действительно тот, за кого себя выдаёт"], "correct": 3, "explain": "Ввод пароля — это подтверждение личности, то есть аутентификация. Идентификация — это, например, ввод логина/email; авторизация — уже про права доступа после успешной аутентификации."}, {"question": "Что из перечисленного верно про Basic Authentication?", "options": ["Логин и пароль кодируются в Base64 — это кодирование, а не шифрование, поэтому имеет смысл только поверх HTTPS", "Логин и пароль передаются в заголовке Authorization в открытом виде, без какого-либо кодирования", "Basic Authentication использует JWT-токен вместо пароля", "Basic Authentication работает только через cookie, а не через заголовки"], "correct": 0, "explain": "Base64 — это просто кодирование, легко обратимое, а не шифрование. Поэтому Basic Auth безопасен только поверх HTTPS, иначе логин и пароль легко перехватить."}, {"question": "Почему в уроке рекомендуется настраивать заголовок Authorization один раз на уровне HTTP-сессии, а не передавать его вручную в каждом запросе?", "options": ["Потому что тогда все запросы через эту сессию автоматически будут содержать нужный заголовок, без дублирования кода в каждом методе клиента", "Потому что requests.Session вообще не поддерживает заголовки", "Потому что так делает библиотека httpx, а requests так делать не умеет", "Потому что заголовок Authorization можно передать только один раз за всё время работы приложения"], "correct": 0, "explain": "Настройка заголовка на уровне сессии избавляет от необходимости повторять его в каждом отдельном запросе — именно на этом принципе строится APIClient в общем репозитории."}, {"question": "Чем API Key принципиально отличается от JWT, согласно уроку?", "options": ["JWT нельзя использовать в заголовке Authorization", "API Key передаётся только в теле запроса, а JWT — только в URL", "У API Key обычно нет встроенного срока действия, в отличие от JWT, у которого срок действия ограничен", "API Key всегда короче по длине, чем JWT"], "correct": 2, "explain": "В уроке отмечается, что у API-ключа обычно нет срока действия — это одновременно удобство и риск, в отличие от JWT, срок жизни которого ограничен."}]}, {"id": "p51", "section": "Модуль 3 · API-тестирование", "subgroup": "Неделя 6", "isOverview": false, "num": "3.5", "title": "Библиотека requests: первые запросы", "content": "# 3.5. Библиотека requests: первые запросы\n\n## Зачем это нужно\n\n`requests` — стандартная библиотека Python для HTTP-запросов, на которой построен весь API-слой нашего общего репозитория. Прежде чем разбирать готовый `APIClient` (модуль недели 7), нужно уверенно понимать, что делает сама библиотека без всяких обёрток — иначе абстракции сверху будут выглядеть как магия.\n\n## Теория\n\n`requests` устанавливается через `pip install requests` (в `boilerplate/requirements.txt` она уже зафиксирована) и предоставляет функции по каждому HTTP-методу: `requests.get()`, `requests.post()`, `requests.put()`, `requests.patch()`, `requests.delete()`.\n\n### Базовый запрос и объект Response\n\n```python\nimport requests\n\nresponse = requests.get(\"https://jsonplaceholder.typicode.com/users/1\")\n```\n\nРезультат вызова — объект `Response`. У него есть несколько ключевых атрибутов и методов, которые ты будешь использовать в каждом тесте:\n\n- `response.status_code` — числовой статус-код ответа (`int`), например `200`.\n- `response.json()` — парсит тело ответа как JSON и возвращает Python-объект (обычно `dict` или `list`). Бросит исключение, если тело не является валидным JSON.\n- `response.text` — тело ответа как есть, в виде строки, без парсинга.\n- `response.headers` — заголовки ответа (похоже на словарь).\n\n### Query-параметры\n\nПередаются через именованный аргумент `params` — `requests` сам соберёт из словаря строку запроса:\n\n```python\nresponse = requests.get(\n    \"https://jsonplaceholder.typicode.com/comments\",\n    params={\"postId\": 1},\n)\nprint(response.url)  # https://jsonplaceholder.typicode.com/comments?postId=1\n```\n\n### Тело запроса (JSON)\n\nДля методов, поддерживающих тело (`POST`, `PUT`, `PATCH`), данные передаются через `json=` — `requests` сам сериализует словарь в JSON-строку и выставит заголовок `Content-Type: application/json`:\n\n```python\nresponse = requests.post(\n    \"https://jsonplaceholder.typicode.com/users\",\n    json={\"name\": \"QA Student\", \"username\": \"qa_student\"},\n)\nprint(response.status_code)  # 201\nprint(response.json())       # созданный (не сохранённый по-настоящему) объект с id\n```\n\nЕсли нужно отправить данные в формате `application/x-www-form-urlencoded` (это встречается реже, но иногда требуется, например, для некоторых форм логина), используется аргумент `data=` вместо `json=`.\n\n### Заголовки и таймаут\n\n```python\nresponse = requests.get(\n    \"https://jsonplaceholder.typicode.com/users/1\",\n    headers={\"Authorization\": \"Bearer <token>\"},\n    timeout=10,\n)\n```\n\n`timeout` — не мелочь ради галочки. Без него тест может зависнуть на неопределённое время, если сервер не отвечает. Хорошая практика — всегда задавать таймаут явно.\n\n### requests.get(...) в каждом тесте — рабочий, но не масштабируемый вариант\n\nНа этом этапе у тебя уже достаточно знаний, чтобы написать первый настоящий API-тест:\n\n```python\nimport requests\n\n\ndef test_get_user():\n    response = requests.get(\"https://jsonplaceholder.typicode.com/users/1\")\n\n    assert response.status_code == 200\n    assert response.json()[\"id\"] == 1\n```\n\nЭто рабочий тест. Но если таких тестов станет двадцать, а базовый URL API вдруг изменится (например, добавится версия `/api/v2/...`) — тебе придётся редактировать URL в каждом тесте. Это и есть повод для следующего урока: как убрать повторяющиеся детали (`base_url`, заголовки, таймаут) в одно место.\n\n## Пример\n\nПолный пример работы с `requests`, включающий GET, POST и обработку ошибки:\n\n```python\nimport requests\n\n# Успешный GET\nresponse = requests.get(\"https://jsonplaceholder.typicode.com/users/1\")\nprint(response.status_code, response.json())\n\n# POST с телом\nresponse = requests.post(\n    \"https://jsonplaceholder.typicode.com/users\",\n    json={\"name\": \"QA Student\", \"username\": \"qa_student\", \"email\": \"qa@example.com\"},\n)\nprint(response.status_code, response.json())\n\n# Запрос к несуществующему ресурсу\nresponse = requests.get(\"https://jsonplaceholder.typicode.com/users/9999\")\nprint(response.status_code)  # 404\n```\n\n## Частые ошибки\n\n- Забыть таймаут и получить тест, который зависает на минуты при проблемах с сетью.\n- Вызвать `response.json()` на ответе, у которого тело — не JSON (например, HTML-страница ошибки 502 от прокси-сервера) — упадёт с исключением, а не даст полезное сообщение \"нет JSON\".\n- Перепутать `params` и `json` — например, попытаться передать тело GET-запроса через `json=` (у большинства серверов GET с телом либо игнорируется, либо приводит к ошибке).\n- Не проверять `response.status_code` перед тем, как парсить `response.json()` — если сервер вернул ошибку с пустым телом, `.json()` упадёт раньше, чем ты увидишь осмысленное сообщение об ошибке.\n\n## Мини-задание\n\nНапиши три отдельных вызова `requests` без обёрток: GET на `/users/1`, POST на `/posts` с телом `{\"title\": \"test\", \"body\": \"text\", \"userId\": 1}`, DELETE на `/posts/1`. Для каждого вывода в консоль и `response.status_code`, и `response.json()`. Убедись, что коды ответа соответствуют тому, что ты изучил в уроках 3.2–3.3.\n", "hasPractice": true, "quiz": [{"question": "Как правильно передать тело JSON-запроса в POST-запросе через requests, чтобы библиотека сама сериализовала словарь и выставила заголовок Content-Type?", "options": ["requests.post(url, body=data)", "requests.post(url, json=data)", "requests.post(url, params=data)", "requests.post(url, text=data)"], "correct": 1, "explain": "Аргумент json= сериализует словарь в JSON-строку и сам подставляет заголовок Content-Type: application/json. params используется для query-параметров, а body/text не являются аргументами requests."}, {"question": "Чем отличается response.json() от response.text в объекте Response библиотеки requests?", "options": ["response.json() возвращает строку, а response.text — уже распарсенный Python-объект", "response.json() парсит тело как JSON и возвращает Python-объект (dict/list), а response.text отдаёт тело как есть, строкой, без парсинга", "Это два имени одного и того же метода — разницы нет", "response.text работает только для GET-запросов"], "correct": 1, "explain": "response.json() парсит тело ответа как JSON и падает с исключением, если это не валидный JSON. response.text — сырая строка тела ответа без парсинга."}, {"question": "Как передать query-параметры (например, ?postId=1) в GET-запросе через requests?", "options": ["Через аргумент json, потому что это тоже данные запроса", "Через именованный аргумент params, а не вручную склеивая строку URL", "Через аргумент headers", "Query-параметры нельзя передать через requests, только вручную в URL-строке"], "correct": 1, "explain": "Аргумент params принимает словарь и сам собирает из него строку запроса — не нужно вручную формировать URL с ? и &."}, {"question": "Почему в уроке подчёркивается важность явного указания timeout в запросах requests?", "options": ["Потому что без timeout запрос вообще не будет выполнен", "Потому что timeout ускоряет парсинг JSON в response.json()", "Потому что без timeout тест может зависнуть на неопределённое время, если сервер не отвечает", "Потому что timeout обязателен только для POST-запросов"], "correct": 2, "explain": "Без явного timeout тест может зависнуть на неопределённое время при проблемах с сетью или сервером — поэтому таймаут стоит указывать всегда."}, {"question": "Согласно разделу «Частые ошибки» урока, почему стоит проверять response.status_code до вызова response.json()?", "options": ["Потому что порядок вызовов не имеет значения", "Потому что если сервер вернул ошибку с пустым или не-JSON телом, .json() упадёт раньше, чем ты увидишь осмысленное сообщение об ошибке", "Потому что status_code недоступен после вызова .json()", "Потому что response.json() автоматически проверяет статус-код сам"], "correct": 1, "explain": "Если тело ответа с ошибкой не является валидным JSON (или пустое), response.json() бросит исключение раньше, чем ты успеешь понять, что произошло — поэтому полезно сначала посмотреть на статус-код."}]}, {"id": "p52", "section": "Модуль 3 · API-тестирование", "subgroup": "Неделя 6", "isOverview": false, "num": "3.6", "title": "От requests.get() в тесте — к API-клиенту", "content": "# 3.6. От requests.get() в тесте — к API-клиенту\n\n## Зачем это нужно\n\nЭто последний урок недели, и он — мост к недели 7, где ты начнёшь построчно разбирать готовый `APIClient` из общего репозитория. Прежде чем читать чужой код, полезно самому прочувствовать проблему, которую этот код решает: почему в реальных проектах никто не пишет `requests.get(...)` напрямую в теле теста.\n\n## Теория\n\nВозьмём тесты из прошлого урока и представим, что их не три, а тридцать. Что в них будет повторяться раз за разом?\n\n1. **Базовый URL.** `https://jsonplaceholder.typicode.com` — в каждом тесте, к каждому эндпоинту.\n2. **Заголовки.** Если API требует авторизации — `Authorization: Bearer ...` нужно передавать в каждый запрос.\n3. **Таймаут.** Если ты один раз решил, что таймаут должен быть 10 секунд — нужно не забыть повторить это в каждом вызове.\n4. **Путь до ресурса.** Если у тебя есть логика \"получить пользователя по id\" — она размазана по всем тестам, которые дергают `/users/{id}`, вместо того чтобы жить в одном месте.\n\nЕсли формат ответа API или базовый URL изменится, тебе придётся находить и чинить это в каждом тесте отдельно. Это и называется **дублированием**, и оно — главный враг поддерживаемости тестов.\n\n### Идея API-клиента\n\n**API-клиент** — это класс (или набор классов), который берёт на себя всю \"механику\" общения с конкретным API: базовый URL, заголовки, таймаут, формирование пути к ресурсу — и предоставляет тестам простые, понятные методы вроде `get_user(user_id)` вместо голого `requests.get(f\"{BASE_URL}/users/{user_id}\", headers=..., timeout=...)`.\n\nТест при этом становится короче и, что важнее, **читается как описание бизнес-логики**, а не как рецепт похода в сеть:\n\n```python\n# Было (requests напрямую)\nresponse = requests.get(\n    f\"{BASE_URL}/users/{user_id}\",\n    headers={\"Authorization\": f\"Bearer {token}\"},\n    timeout=10,\n)\n\n# Стало (через клиент)\nresponse = users_client.get_user_api(user_id)\n```\n\n### requests.Session — первый шаг к клиенту\n\nПрежде чем переходить к полноценному клиенту, важно познакомиться с `requests.Session`. Это объект, который хранит настройки (заголовки, cookie) между несколькими запросами и переиспользует TCP-соединение — то есть решает как минимум проблему \"заголовки в каждом запросе\":\n\n```python\nimport requests\n\nsession = requests.Session()\nsession.headers.update({\"Authorization\": \"Bearer my_token\"})\n\nresponse = session.get(\"https://jsonplaceholder.typicode.com/users/1\")\nprint(response.json())\n```\n\nВсё, что попадёт в `session.headers`, будет автоматически подставляться в каждый запрос через эту сессию — заголовок больше не нужно передавать вручную каждый раз.\n\nНо у `requests.Session` нет из коробки понятия `base_url` (в отличие от, например, библиотеки `httpx`, где `httpx.Client(base_url=...)` — встроенная возможность). Поэтому в следующем уроке модуля (уже в рамках недели 7) мы разберём небольшой класс `BaseUrlSession` из `boilerplate/clients/api_client.py`, который добавляет это поведение поверх `requests.Session`, и класс `APIClient`, который строится уже поверх неё.\n\n## Пример\n\nНабросок (пока учебный, не финальный код репозитория) того, к чему мы идём:\n\n```python\nimport requests\n\n\nclass APIClient:\n    def __init__(self, session: requests.Session):\n        self.session = session\n\n    def get(self, url: str, params: dict | None = None) -> requests.Response:\n        return self.session.get(url, params=params)\n\n    def post(self, url: str, json: dict | None = None) -> requests.Response:\n        return self.session.post(url, json=json)\n\n\nclass UsersClient(APIClient):\n    def get_user_api(self, user_id: int) -> requests.Response:\n        return self.get(f\"/users/{user_id}\")\n\n\nsession = requests.Session()\nsession.headers.update({\"Authorization\": \"Bearer my_token\"})\n\nusers_client = UsersClient(session=session)\nresponse = users_client.get_user_api(user_id=1)\n```\n\nЭто уже очень близко к реальной структуре `boilerplate/clients/`. В следующем уроке мы посмотрим на настоящий код — со всеми деталями, которых здесь не хватает (`base_url`, таймаут по умолчанию, полный набор HTTP-методов).\n\n## Частые ошибки\n\n- Пытаться сразу спроектировать \"идеальный\" клиент со всеми возможными фичами вместо того, чтобы начать с простого базового класса и наращивать функциональность по мере необходимости — именно так был построен `APIClient` в общем репозитории.\n- Смешивать транспортный уровень (HTTP-запросы) и уровень схем данных (Pydantic) в одном классе — про правильное разделение поговорим в модуле недели 7.\n- Считать, что раз в проекте уже есть `APIClient`, велосипед изобретать не нужно — но при этом всё равно писать в тестах `requests.get(...)` напрямую \"потому что так быстрее\". Именно ради того, чтобы так не делать, клиент и существует.\n\n## Мини-задание\n\nВозьми три теста, которые ты написал в мини-задании урока 3.5 (голый `requests`). Перепиши их вручную так, чтобы весь код похода в сеть (базовый URL, заголовки) был вынесен в отдельную переменную/функцию, а сам тест обращался к ней, а не к `requests` напрямую. Это не обязано быть полноценным классом — цель упражнения в том, чтобы почувствовать, где именно проходит граница между \"тестовой логикой\" и \"механикой HTTP\".\n", "hasPractice": true, "quiz": [{"question": "Что даёт requests.Session по сравнению с отдельными вызовами requests.get()/post() в разных тестах?", "options": ["Session автоматически добавляет base_url ко всем относительным путям «из коробки»", "Session умеет самостоятельно генерировать HTTP-методы, которых нет в самой библиотеке requests", "Session заменяет собой Pydantic-валидацию ответов", "Session хранит настройки (например, заголовки) и переиспользует их между несколькими запросами, не заставляя дублировать их в каждом вызове"], "correct": 3, "explain": "requests.Session хранит заголовки и переиспользует соединение между запросами. Base_url «из коробки» у неё нет — именно поэтому в общем репозитории для этого написан отдельный класс BaseUrlSession."}, {"question": "Что, согласно уроку, берёт на себя API-клиент, избавляя тесты от повторяющегося кода?", "options": ["Проверку бизнес-логики вместо самого теста", "Базовый URL, заголовки, таймаут и формирование пути к ресурсу — всю «механику» похода в сеть", "Только генерацию случайных тестовых данных", "Запуск тестов в CI"], "correct": 1, "explain": "API-клиент инкапсулирует технические детали запроса (base_url, заголовки, таймаут, путь), оставляя тесту только описание бизнес-логики."}, {"question": "Что в уроке называется «дублированием» и «главным врагом поддерживаемости тестов»?", "options": ["Использование одного и того же клиента в нескольких тестах", "Написание документации к каждому тесту", "Повторение одинаковых assert-ов в разных тестах", "Повторение технических деталей запроса (base_url, заголовки, таймаут) в каждом отдельном тесте"], "correct": 3, "explain": "Если базовый URL, заголовки и таймаут прописаны в каждом тесте отдельно, при их изменении придётся чинить каждый тест по отдельности — это и есть проблемное дублирование."}, {"question": "Чего, согласно уроку, не хватает учебному наброску APIClient на requests.Session, чтобы стать полноценным клиентом, как в общем репозитории?", "options": ["Поддержки base_url, таймаута по умолчанию и полного набора HTTP-методов — это будет добавлено в следующем уроке", "Поддержки GET-запросов — их ещё предстоит реализовать", "Поддержки заголовков — requests.Session вообще не умеет с ними работать", "Ничего не хватает: набросок уже полностью совпадает с реальным кодом репозитория"], "correct": 0, "explain": "Учебный набросок уже близок к реальному коду, но в нём не хватает поддержки base_url «из коробки», таймаута по умолчанию и полного набора методов — это разбирается в уроке 3.7 на примере BaseUrlSession и APIClient."}]}, {"id": "p53", "section": "Модуль 3 · API-тестирование", "subgroup": "Неделя 7", "isOverview": false, "num": "3.7", "title": "Базовый API-клиент: BaseUrlSession и APIClient", "content": "# 3.7. Базовый API-клиент: BaseUrlSession и APIClient\n\n## Зачем это нужно\n\nС этого урока начинается главное отличие модуля 3 от предыдущих: ты больше не пишешь код \"в вакууме\". Ты открываешь уже существующий файл в общем репозитории и построчно разбираешь, как он устроен, — потому что именно на нём тебе предстоит строить домашнее задание. Не разобравшись в этом файле,
