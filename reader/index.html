для автоматизации, которая используется из Python-кода.\n- Забывать, что headless-режим и видимый режим — это один и тот же Playwright, просто разный параметр запуска браузера.\n\n## Мини-задание\n\nОткрой документацию Playwright для Python (playwright.dev/python) и найди раздел про `sync_playwright`. Прочитай первый абзац — не вникай в детали API, просто убедись, что общая идея (синхронный способ работы с Playwright из Python) совпадает с тем, что описано в этом уроке.\n\n## Домашнее задание\n\nЭто домашнее задание относится ко всей неделе 8, а не только к этому уроку.\n\n**Задача:** установи Playwright и его браузеры в своём форке `boilerplate/` (если ещё не установлены):\n\n```bash\npip install -r requirements.txt\nplaywright install chromium\n```\n\nЗатем открой страницу регистрации учебного приложения (`https://nikita-filonov.github.io/qa-automation-engineer-ui-course/#/auth/registration`) через DevTools и самостоятельно, без подглядывания в таблицу из урока 4.4, найди и запиши локаторы для всех трёх полей формы и кнопки Registration.\n\n**Критерии готовности:**\n- `playwright install chromium` выполнен без ошибок.\n- В заметке (можно просто в текстовом файле, PR пока не нужен) выписаны 4 локатора: Email, Username, Password, Registration — и они совпадают с таблицей из урока 4.4.\n- Ты можешь объяснить своими словами, почему у полей формы локатор заканчивается на `input`, а у кнопки — нет.\n", "hasPractice": true, "quiz": {"question": "Что делает параметр headless=False при запуске браузера в Playwright?", "options": ["Ускоряет выполнение теста за счёт отключения проверок", "Запускает браузер в обычном видимом окне, а не в фоновом режиме", "Отключает автоматические ожидания элементов", "Заставляет Playwright использовать Firefox вместо Chromium"], "correct": 1, "explain": "headless=False означает видимый режим браузера: во время выполнения кода можно своими глазами наблюдать, как Playwright открывает страницы и выполняет действия."}}, {"id": "p74", "section": "Модуль 4 · Playwright + POM", "subgroup": "Неделя 9", "isOverview": false, "num": "4.6", "title": "Первый Playwright-скрипт: goto, locator, fill, click", "content": "# 4.6. Первый Playwright-скрипт: goto, locator, fill, click\n\n## Зачем это нужно\n\nЭто первый урок, где ты напишешь реально работающий код на Playwright. Дальше в модуле мы будем постоянно опираться на эти четыре операции — `goto`, `locator`, `fill`, `click` — они встречаются в любом UI-автотесте, независимо от того, что он проверяет.\n\n## Теория\n\nВажное уточнение сразу: то, что мы напишем в этом уроке — ещё не тест. Тест не просто выполняет действия, а ещё и проверяет результат через `assert` или `expect()`. Пока проверок не будет, поэтому правильнее называть файл скриптом. Про `expect()` поговорим в следующем уроке (4.7), а полноценные `pytest`-тесты у нас уже есть в `boilerplate/tests/ui/test_registration.py` — на неделе 10 разберём его архитектуру.\n\n### Запуск браузера и создание страницы\n\nЛюбой Playwright-скрипт в синхронном режиме начинается с одной и той же конструкции:\n\n```python\nfrom playwright.sync_api import sync_playwright\n\nwith sync_playwright() as p:\n    browser = p.chromium.launch(headless=False)\n    page = browser.new_page()\n\n    browser.close()\n```\n\nРазберём по частям:\n\n- `from playwright.sync_api import sync_playwright` — импортирует точку входа в Playwright.\n- `with sync_playwright() as p:` — запускает Playwright и создаёт объект `p`, через который дальше запускается браузер.\n- `browser = p.chromium.launch(headless=False)` — запускает браузер Chromium в видимом режиме.\n- `page = browser.new_page()` — создаёт новую вкладку. `page` — один из главных объектов Playwright: через него выполняется открытие страниц, поиск элементов, ввод текста, клики, проверки.\n- `browser.close()` — закрывает браузер после завершения работы.\n\nЕсли запустить такой скрипт, браузер откроется, создаст пустую вкладку и почти сразу же закроется — между действиями нет пауз, и Python выполняет их за доли секунды.\n\n### `page.goto()` — открываем страницу\n\n```python\npage.goto(\"https://nikita-filonov.github.io/qa-automation-engineer-ui-course/#/auth/registration\")\n```\n\nМетод `page.goto(url)` открывает страницу по указанному адресу. `page` — это объект, через который Playwright управляет открытой вкладкой браузера, и почти вся дальнейшая работа идёт именно через него: `page.goto(...)`, `page.locator(...)`, `page.url`.\n\n### `page.locator()` и `.fill()` — находим поле и вводим текст\n\n```python\npage.locator(\"[data-testid='registration-form-email-input'] input\").fill(\"user@example.com\")\n```\n\n`page.locator(...)` находит элемент на странице по локатору (мы разобрали эти локаторы на неделе 8). `.fill(...)` вводит текст в найденное поле. Важно: `fill` не дописывает текст в конец поля, а сначала очищает его и затем устанавливает новое значение — это то, что обычно и нужно при заполнении формы.\n\n### `.click()` — нажимаем кнопку\n\n```python\npage.locator(\"[data-testid='registration-page-registration-button']\").click()\n```\n\n`.click()` выполняет клик по найденному элементу.\n\n## Пример\n\nПолный сценарий — от открытия страницы до нажатия кнопки Registration:\n\n```python\nfrom playwright.sync_api import sync_playwright\n\nwith sync_playwright() as p:\n    browser = p.chromium.launch(headless=False)\n    page = browser.new_page()\n\n    page.goto(\n        \"https://nikita-filonov.github.io/qa-automation-engineer-ui-course/#/auth/registration\"\n    )\n\n    page.locator(\"[data-testid='registration-form-email-input'] input\").fill(\"user@example.com\")\n    page.locator(\"[data-testid='registration-form-username-input'] input\").fill(\"testuser\")\n    page.locator(\"[data-testid='registration-form-password-input'] input\").fill(\"password123\")\n    page.locator(\"[data-testid='registration-page-registration-button']\").click()\n\n    browser.close()\n```\n\nПорядок действий важен: Playwright выполняет команды сверху вниз, и нельзя заполнить поле до того, как открылась страница, или нажать кнопку раньше, чем заполнены обязательные поля.\n\nЧтобы увидеть результат своими глазами (иначе браузер закроется слишком быстро), временно добавь перед `browser.close()`:\n\n```python\ninput(\"Нажмите Enter для завершения...\")\n```\n\nПосле проверки эту строку нужно убрать — это временный инструмент отладки, а не часть сценария.\n\nСохрани скрипт как `registration_script.py` в корне своего форка `boilerplate/` (это отдельный экспериментальный файл, не путай с тестами в `tests/ui/`) и запусти:\n\n```bash\npython -m registration_script\n```\n\n## Частые ошибки\n\n- Забыть, что `fill()` требует, чтобы элемент уже был на странице — если локатор написан с ошибкой, Playwright будет ждать появления элемента и в итоге упадёт с таймаутом.\n- Перепутать порядок действий: попытаться нажать кнопку до заполнения полей.\n- Не активировать виртуальное окружение перед запуском — тогда Python не найдёт установленный `playwright`.\n- Забыть выполнить `playwright install chromium` — без этого браузер не запустится, и Playwright сам подскажет нужную команду в тексте ошибки.\n\n## Мини-задание\n\nВозьми скрипт из примера и измени значения email, username и password на свои собственные. Добавь `input(\"Нажмите Enter для завершения...\")` перед `browser.close()` и убедись, что все три поля действительно заполнились правильными значениями — глазами, в открывшемся окне браузера.\n", "hasPractice": true, "quiz": {"question": "Что делает метод .fill(...) при заполнении поля ввода в Playwright?", "options": ["Дописывает текст в конец текущего значения поля", "Сначала очищает поле, а затем устанавливает новое значение", "Кликает по полю, но не вводит никакого текста", "Проверяет, что поле уже содержит нужный текст"], "correct": 1, "explain": "fill() не дописывает текст к существующему значению — он сначала очищает поле и затем устанавливает переданное значение целиком."}}, {"id": "p75", "section": "Модуль 4 · Playwright + POM", "subgroup": "Неделя 9", "isOverview": false, "num": "4.7", "title": "Автоматические ожидания и expect()", "content": "# 4.7. Автоматические ожидания и expect()\n\n## Зачем это нужно\n\nРеальные веб-страницы не появляются мгновенно: после клика может произойти переход на другой URL, элемент может отрисоваться с небольшой задержкой, форма может замениться сообщением об успехе. Если тест проверяет состояние страницы раньше, чем оно наступило, тест падает не потому, что приложение сломано, а потому что тест \"не подождал\". Это одна из самых частых причин нестабильных (flaky) UI-тестов, и Playwright решает эту проблему на уровне архитектуры — важно понимать, как именно.\n\n## Теория\n\n### Проблема: страница обновляется не мгновенно\n\nДопустим, мы кликнули на кнопку Registration и сразу проверяем URL:\n\n```python\npage.locator(\"[data-testid='registration-page-registration-button']\").click()\nassert page.url == \"https://nikita-filonov.github.io/qa-automation-engineer-ui-course/#/dashboard\"\n```\n\nЕсли переход на Dashboard занимает даже небольшое время, `assert` может сработать раньше, чем URL успеет измениться, — и тест упадёт, хотя приложение работает правильно.\n\n### Явные ожидания vs автоматические ожидания\n\nОдно из решений этой проблемы, которое встречается в других инструментах автоматизации — явные ожидания: явно прописать в коде \"подожди N секунд\" или \"жди появления элемента до N секунд, проверяя каждые полсекунды\". Такой подход рабочий, но у него есть минусы: фиксированные паузы либо слишком короткие (тест всё равно падает), либо слишком длинные (тест выполняется медленнее, чем нужно).\n\nPlaywright устроен иначе — у него встроены **автоматические ожидания (auto-waiting)**. Большинство действий (`click()`, `fill()`) и все проверки через `expect()` сами ждут, пока элемент не окажется в нужном состоянии (появится в DOM, станет видимым, станет доступным для взаимодействия), и только после этого выполняются. Ждать вручную с помощью `time.sleep()` в Playwright-тестах, как правило, не нужно — это ключевая идея, отличающая Playwright от многих более старых инструментов автоматизации.\n\n### `expect()` — проверки с автоматическим ожиданием\n\nДля проверок в Playwright используется функция `expect`:\n\n```python\nfrom playwright.sync_api import expect\n```\n\nПример проверки URL:\n\n```python\nexpect(page).to_have_url(\"https://nikita-filonov.github.io/qa-automation-engineer-ui-course/#/dashboard\")\n```\n\nЭто не разовая сверка значения, как обычный `assert`. `expect(...)` умеет **повторно проверять условие в течение отведённого времени**, пока оно не станет истинным (или пока не истечёт таймаут). Если переход на Dashboard занимает долю секунды, `expect` дождётся этого перехода и только потом либо подтвердит успех, либо, если условие так и не выполнилось, завершит тест ошибкой с понятным сообщением.\n\nЭто же справедливо для проверок элементов:\n\n```python\ndashboard_title = page.locator(\"[data-testid='dashboard-toolbar-title-text']\")\nexpect(dashboard_title).to_be_visible()\nexpect(dashboard_title).to_have_text(\"Dashboard\")\n```\n\n`to_be_visible()` дожидается, пока элемент не станет видимым на странице. `to_have_text(...)` дожидается, пока текст элемента не совпадёт с ожидаемым.\n\n### Почему `expect()`, а не `assert`\n\nМожно было бы написать:\n\n```python\nassert page.url == expected_url\n```\n\nНо `assert` проверяет значение только один раз, в момент выполнения строки — без повторных попыток и без ожидания. `expect()` устроен так, что умеет ждать нужное состояние страницы, и именно поэтому в Playwright-тестах для проверок почти всегда используется `expect()`, а не обычный `assert`. Ты увидишь этот же принцип в `BasePage.check_current_url()` из `boilerplate/pages/base_page.py` на неделе 10 — там тоже используется `expect(self.page).to_have_url(...)`, а не `assert self.page.url == ...`.\n\n## Пример\n\nПолный фрагмент с проверками после регистрации:\n\n```python\nfrom playwright.sync_api import expect, sync_playwright\n\nwith sync_playwright() as p:\n    browser = p.chromium.launch(headless=False)\n    page = browser.new_page()\n\n    page.goto(\"https://nikita-filonov.github.io/qa-automation-engineer-ui-course/#/auth/registration\")\n\n    page.locator(\"[data-testid='registration-form-email-input'] input\").fill(\"user@example.com\")\n    page.locator(\"[data-testid='registration-form-username-input'] input\").fill(\"testuser\")\n    page.locator(\"[data-testid='registration-form-password-input'] input\").fill(\"password123\")\n    page.locator(\"[data-testid='registration-page-registration-button']\").click()\n\n    expect(page).to_have_url(\n        \"https://nikita-filonov.github.io/qa-automation-engineer-ui-course/#/dashboard\"\n    )\n\n    dashboard_title = page.locator(\"[data-testid='dashboard-toolbar-title-text']\")\n    expect(dashboard_title).to_be_visible()\n    expect(dashboard_title).to_have_text(\"Dashboard\")\n\n    browser.close()\n```\n\nМы проверяем и URL, и заголовок не потому, что это избыточно, а потому что это два разных факта: URL подтверждает, что приложение выполнило переход на нужный маршрут, а заголовок подтверждает, что страница действительно отрисовалась пользователю. Одной проверки URL не всегда достаточно — адрес мог измениться, а сама страница зависнуть на пустом экране.\n\n## Частые ошибки\n\n- Использовать `time.sleep()` \"на всякий случай\" вместо того, чтобы довериться `expect()` — это делает тесты медленнее и не решает проблему по-настоящему (если реальная задержка окажется больше, чем `sleep`, тест всё равно упадёт).\n- Проверять состояние через `assert page.locator(...).is_visible()` сразу после действия — в отличие от `expect(...).to_be_visible()`, такая проверка не ждёт и может сработать до того, как элемент появится.\n- Проверять только один признак результата (например, только URL) там, где для уверенности стоит проверить ещё и содержимое страницы.\n\n## Мини-задание\n\nВозьми скрипт из урока 4.6, добавь импорт `expect` и допиши в конец проверку `expect(page).to_have_url(...)` на страницу Dashboard. Запусти скрипт дважды: один раз с правильным URL в проверке, другой раз — намеренно с опечаткой в адресе, чтобы увидеть, как выглядит сообщение об ошибке, когда `expect()` не может дождаться нужного состояния.\n", "hasPractice": true, "quiz": {"question": "Чем expect(page).to_have_url(...) принципиально отличается от assert page.url == \"...\"?", "options": ["expect() выполняется быстрее, потому что вообще не обращается к браузеру", "expect() умеет повторно проверять условие в течение отведённого времени, ожидая нужное состояние страницы", "assert работает только внутри pytest, а expect — только в обычных скриптах без pytest", "Разницы нет, это два взаимозаменяемых способа записать одну и ту же проверку"], "correct": 1, "explain": "expect() — это проверка с автоматическим ожиданием: она повторяет попытку, пока условие не станет истинным или не истечёт таймаут, тогда как обычный assert сверяет значение только один раз в момент выполнения строки."}}, {"id": "p76", "section": "Модуль 4 · Playwright + POM", "subgroup": "Неделя 9", "isOverview": false, "num": "4.8", "title": "Работа с формами: fill, click, select, чекбоксы", "content": "# 4.8. Работа с формами: fill, click, select, чекбоксы\n\n## Зачем это нужно\n\nФормы регистрации, логина, фильтров, настроек профиля, оформления заказа — это, пожалуй, самый частый объект UI-тестирования. До сих пор мы работали только с текстовыми полями и одной кнопкой. В реальных формах встречаются ещё выпадающие списки (`select`) и чекбоксы (`checkbox`) — с ними тоже нужно уметь работать, даже если в нашем учебном сценарии регистрации их нет.\n\n## Теория\n\nPlaywright предоставляет отдельные методы под разные типы полей — это логично, ведь ввести текст в `input` и выбрать пункт в `select` физически разные действия для пользователя, и код должен их отражать.\n\n### Текстовые поля: `.fill()`\n\nУже знакомый метод для однострочных (`input`) и многострочных (`textarea`) полей:\n\n```python\npage.locator(\"[data-testid='registration-form-email-input'] input\").fill(\"user@example.com\")\n```\n\n`.fill()` полностью заменяет содержимое поля — сначала очищает его, затем вставляет новое значение.\n\n### Кнопки и клики: `.click()`\n\n```python\npage.locator(\"[data-testid='registration-page-registration-button']\").click()\n```\n\n`.click()` подходит не только для кнопок `<button>`, но и для любых кликабельных элементов — ссылок, иконок, пунктов меню.\n\n### Выпадающие списки: `.select_option()`\n\nДля тега `<select>` в Playwright используется отдельный метод — `select_option()`. Он может принимать значение атрибута `value`, видимый текст варианта (`label`) или индекс:\n\n```python\npage.locator(\"select[name='country']\").select_option(value=\"by\")\n```\n\nТак работает выбор пункта в выпадающем списке из стандартного HTML-элемента `<select>`. Если на странице используется кастомный компонент выбора (например, стилизованный дропдаун из UI-библиотеки, где вместо `<select>` набор `<div>` и `<li>`), `select_option()` не подойдёт — там придётся кликать по элементу, который открывает список, а затем по нужному пункту как по обычному элементу через `.click()`. Какой вариант перед тобой — стандартный `<select>` или кастомный компонент — всегда можно понять через DevTools, посмотрев на реальные теги в разметке.\n\n### Чекбоксы и радиокнопки: `.check()` / `.uncheck()`\n\nДля `<input type=\"checkbox\">` и `<input type=\"radio\">` вместо клика используются методы `.check()` и `.uncheck()`:\n\n```python\npage.locator(\"input[name='remember_me']\").check()\n```\n\n`.check()` установит чекбокс в отмеченное состояние, если он ещё не отмечен (если уже отмечен — ничего не сделает, что удобнее, чем обычный `.click()`, который просто переключил бы состояние). `.uncheck()` работает наоборот — снимает отметку.\n\nПроверить состояние чекбокса можно через `expect()`:\n\n```python\nexpect(page.locator(\"input[name='remember_me']\")).to_be_checked()\n```\n\n### Общий принцип\n\nВсе эти методы объединяет одно: сначала мы получаем локатор через `page.locator(...)`, а затем вызываем на нём метод, соответствующий типу элемента и нужному действию. Playwright сам разбирается, как физически \"нажать\" на элемент нужного типа — вам не нужно эмулировать конкретные события мыши или клавиатуры.\n\n## Пример\n\nПредставим гипотетическую (не из нашего учебного приложения) форму с чекбоксом согласия и выбором страны:\n\n```python\nfrom playwright.sync_api import expect, sync_playwright\n\nwith sync_playwright() as p:\n    browser = p.chromium.launch(headless=False)\n    page = browser.new_page()\n\n    page.goto(\"https://example.com/signup\")\n\n    page.locator(\"input[name='email']\").fill(\"user@example.com\")\n    page.locator(\"select[name='country']\").select_option(value=\"by\")\n    page.locator(\"input[name='agreement']\").check()\n\n    expect(page.locator(\"input[name='agreement']\")).to_be_checked()\n\n    page.locator(\"button[type='submit']\").click()\n\n    browser.close()\n```\n\nОбрати внимание: три разных типа полей — три разных метода (`fill`, `select_option`, `check`), но единый подход к поиску элемента через `page.locator(...)`.\n\n## Частые ошибки\n\n- Пытаться заполнить `<select>` через `.fill()` — это текстовый метод, для выпадающих списков он не подходит.\n- Использовать `.click()` для чекбокса вместо `.check()`/`.uncheck()` — клик просто переключит текущее состояние, и если чекбокс уже был отмечен, тест случайно его снимет.\n- Не учитывать, что визуально похожий на `<select>` компонент на самом деле собран из `<div>` — в таком случае `select_option()` не найдёт нужного элемента, потому что физически в разметке нет тега `<select>`.\n\n## Мини-задание\n\nНайди на любом реальном сайте (например, форма регистрации в каком-нибудь публичном сервисе) чекбокс согласия с условиями. Через DevTools определи его локатор и мысленно (не обязательно писать и запускать код) распиши, какой метод Playwright ты бы использовал, чтобы его отметить, и как бы проверил, что он действительно отмечен.\n", "hasPractice": true, "quiz": {"question": "Какой метод Playwright используется для отметки чекбокса (<input type='checkbox'>)?", "options": [".fill()", ".select_option()", ".check()", ".click(), потому что других способов не существует"], "correct": 2, "explain": "Для чекбоксов и радиокнопок в Playwright есть отдельные методы .check()/.uncheck() — они устанавливают нужное состояние явно, а не просто переключают текущее, как это сделал бы обычный клик."}}, {"id": "p77", "section": "Модуль 4 · Playwright + POM", "subgroup": "Неделя 9", "isOverview": false, "num": "4.9", "title": "Попапы, алерты и модальные окна", "content": "# 4.9. Попапы, алерты и модальные окна\n\n## Зачем это нужно\n\nРано или поздно в реальном проекте встретится: браузерное окно подтверждения (\"Вы уверены, что хотите удалить?\"), ссылка, открывающая новую вкладку, или модальное окно с формой поверх страницы. Каждый из этих случаев устроен по-своему, и важно понимать разницу, чтобы не пытаться, например, искать локатором браузерный `alert()` — он не является частью DOM-дерева страницы.\n\n## Теория\n\nЗдесь стоит разделить три разных вещи, которые часто путают под общим словом \"попап\".\n\n### 1. Нативные диалоги браузера: `alert`, `confirm`, `prompt`\n\nЭто встроенные диалоговые окна самого браузера — `window.alert(...)`, `window.confirm(...)`, `window.prompt(...)`, а также диалог подтверждения ухода со страницы (`beforeunload`). Они не являются HTML-элементами и не находятся в DOM, поэтому `page.locator(...)` их не увидит.\n\nPlaywright взаимодействует с ними через событие `dialog`:\n\n```python\ndef handle_dialog(dialog):\n    print(dialog.message)\n    dialog.accept()\n\npage.on(\"dialog\", handle_dialog)\n```\n\nВажный момент поведения: если на странице появляется такой диалог, а обработчик `page.on(\"dialog\", ...)` не зарегистрирован, Playwright автоматически закрывает диалог сам (аналог нажатия \"Отмена\"), чтобы тест не завис в ожидании. Если тебе нужно явно принять или отклонить диалог — регистрируй обработчик и внутри него вызывай `dialog.accept()` (можно передать текст для `prompt`) или `dialog.dismiss()`.\n\n### 2. Новые вкладки и окна: `target=\"_blank\"`, `window.open()`\n\nЕсли клик по ссылке или кнопке открывает не текущую страницу, а новую вкладку, у тебя появляется новый объект `page`, за которым нужно проследить отдельно. Для этого Playwright предоставляет `expect_popup()`:\n\n```python\nwith page.expect_popup() as popup_info:\n    page.locator(\"a[target='_blank']\").click()\n\nnew_page = popup_info.value\nnew_page.wait_for_load_state()\n```\n\n`expect_popup()` — это менеджер контекста, который ждёт появления новой вкладки в момент клика и возвращает её как отдельный объект `page`. Дальше с этим объектом работаем так же, как с обычной страницей: ищем локаторы, кликаем, проверяем.\n\n### 3. Модальные окна внутри страницы (custom-модалки)\n\nЭто самый частый случай в современных SPA-приложениях (React, Vue и подобных) — визуально модальное окно выглядит как всплывающее поверх страницы, но технически это обычный `<div>` с определённым `role=\"dialog\"` или собственным `data-testid`, который просто отрисован поверх остального контента через CSS. Такое окно — часть DOM-дерева, и никакой особой техники не нужно: находишь его как обычный элемент через `page.locator(...)` и работаешь с полями и кнопками внутри него так же, как с любой другой формой.\n\n```python\nmodal = page.locator(\"[data-testid='confirm-delete-modal']\")\nexpect(modal).to_be_visible()\n\nmodal.locator(\"button:has-text('Confirm')\").click()\n```\n\n### Как отличить, с чем ты имеешь дело\n\nОткрой DevTools и посмотри на модальное окно во вкладке Elements. Если это HTML-элемент (`div`, `dialog` и т.п.) — это случай 3, работай через обычные локаторы. Если элемента в DOM нет, а окно всё равно появилось — скорее всего, это нативный `alert`/`confirm`/`prompt`, и нужен `page.on(\"dialog\", ...)`.\n\n## Пример\n\nГипотетический пример регистрации обработчика диалога перед действием, которое его вызывает:\n\n```python\npage.on(\"dialog\", lambda dialog: dialog.accept())\npage.locator(\"[data-testid='delete-account-button']\").click()\n```\n\nОбработчик регистрируется один раз и будет автоматически обрабатывать любые диалоги, которые появятся на странице после этой строки.\n\n## Частые ошибки\n\n- Пытаться найти `alert()` через `page.locator(...)` — он не в DOM, так работать не будет.\n- Забыть зарегистрировать `page.on(\"dialog\", ...)` до клика, который вызывает диалог — обработчик должен быть подписан заранее, а не после того, как диалог уже появился.\n- Принять кастомное модальное окно (обычный `div` с `data-testid`) за нативный диалог и пытаться работать с ним через `dialog.accept()` вместо обычного локатора.\n\n## Мини-задание\n\nОткрой DevTools на любом сайте, где есть модальное окно (например, окно подтверждения удаления, cookie-баннер или окно логина, открывающееся поверх страницы). Определи, элемент ли это HTML-разметки (случай 3) или, наоборот, нативный browser-диалог. Обоснуй вывод тем, что видишь во вкладке Elements.\n", "hasPractice": true, "quiz": {"question": "Как правильно обработать нажатие кнопки, которая вызывает нативный браузерный confirm()?", "options": ["Найти confirm() через page.locator() и кликнуть по нему как по обычному элементу", "Зарегистрировать обработчик page.on(\"dialog\", ...) до клика и вызвать внутри него dialog.accept() или dialog.dismiss()", "Использовать expect_popup(), потому что confirm() всегда открывает новую вкладку браузера", "Ничего не делать — confirm() автоматически становится частью DOM и обрабатывается как обычный элемент"], "correct": 1, "explain": "Нативные диалоги (alert/confirm/prompt) не являются частью DOM и не находятся через locator — для них Playwright предоставляет событие dialog и методы dialog.accept()/dialog.dismiss(), обработчик на которое нужно зарегистрировать заранее."}}, {"id": "p78", "section": "Модуль 4 · Playwright + POM", "subgroup": "Неделя 9", "isOverview": false, "num": "4.10", "title": "Проверка состояния страницы через expect()", "content": "# 4.10. Проверка состояния страницы через expect()\n\n## Зачем это нужно\n\nТест без проверок — это просто скрипт: он что-то делает, но не отвечает на вопрос \"получилось или нет\". Мы уже видели `expect()` в деле на примере URL и заголовка Dashboard. Теперь соберём более полную картину — какие проверки вообще бывают и когда какую использовать. Именно этот набор проверок ты будешь использовать в методах `check_*` при разборе `RegistrationPage` и `DashboardPage` на неделе 10.\n\n## Теория\n\nВсе проверки в Playwright строятся по одному шаблону:\n\n```python\nexpect(объект).to_что-то(ожидаемое_значение)\n```\n\nГде `объект` — это либо `page` (для проверок уровня страницы, например URL), либо результат `page.locator(...)` (для проверок конкретного элемента).\n\n### Проверки видимости\n\n```python\nexpect(locator).to_be_visible()\nexpect(locator).to_be_hidden()\n```\n\n`to_be_visible()` дожидается, пока элемент не появится в DOM и не станет видимым (не скрыт через CSS, не имеет нулевого размера). `to_be_hidden()` — обратная проверка: элемента либо нет в DOM, либо он скрыт.\n\n### Проверки текста\n\n```python\nexpect(locator).to_have_text(\"Dashboard\")\nexpect(locator).to_contain_text(\"Dashboard\")\n```\n\n`to_have_text(...)` проверяет точное совпадение текста элемента. `to_contain_text(...)` — что текст элемента содержит указанную подстроку. Используй `to_contain_text`, когда важна не вся строка целиком, а только её часть (например, сообщение об ошибке, где кроме текста есть ещё и код ошибки).\n\n### Проверки значения поля\n\n```python\nexpect(locator).to_have_value(\"user@example.com\")\n```\n\nПроверяет текущее значение `input` или `textarea` — полезно после `.fill()`, чтобы убедиться, что значение действительно установилось (хотя обычно в этом нет необходимости — `.fill()` сам ждёт, пока поле не будет готово к вводу).\n\n### Проверки состояния элемента\n\n```python\nexpect(locator).to_be_enabled()\nexpect(locator).to_be_disabled()\nexpect(locator).to_be_checked()\n```\n\nЭти проверки полезны там, где интерфейс явно блокирует действия — например, кнопка отправки формы становится активной только после заполнения обязательных полей.\n\n### Проверка URL страницы\n\n```python\nexpect(page).to_have_url(\"https://nikita-filonov.github.io/qa-automation-engineer-ui-course/#/dashboard\")\n```\n\nМы уже использовали эту проверку для перехода на Dashboard. Обрати внимание: здесь в `expect()` передаётся не локатор, а сам объект `page`.\n\n### Проверка количества элементов\n\n```python\nexpect(page.locator(\"[data-testid='user-row']\")).to_have_count(3)\n```\n\nПолезно для списков — например, убедиться, что после фильтрации осталось ровно нужное количество строк таблицы.\n\n### Отрицание проверки\n\nУ любой проверки есть форма с отрицанием — префикс `not_`:\n\n```python\nexpect(locator).not_to_be_visible()\nexpect(locator).not_to_have_text(\"Error\")\n```\n\nЭто удобнее, чем оборачивать проверку в `assert not ...`: `not_to_be_visible()` так же умеет ждать, пока элемент не исчезнет, а не просто проверяет состояние один раз.\n\n## Пример\n\nСобираем несколько проверок в одном сценарии — открыли Dashboard и проверили сразу несколько фактов о странице:\n\n```python\nfrom playwright.sync_api import expect\n\nexpect(page).to_have_url(\"https://nikita-filonov.github.io/qa-automation-engineer-ui-course/#/dashboard\")\n\ndashboard_title = page.locator(\"[data-testid='dashboard-toolbar-title-text']\")\nexpect(dashboard_title).to_be_visible()\nexpect(dashboard_title).to_have_text(\"Dashboard\")\n```\n\nИменно эти три строки в чуть другом виде ты увидишь в методе `DashboardPage.check_visible_toolbar_title()` в `boilerplate/pages/dashboard_page.py` — переход к Page Object в следующем уроке не меняет сути проверок, а просто переносит их в отдельный класс.\n\n## Частые ошибки\n\n- Использовать `to_have_text(...)`, когда нужно проверить только часть текста — тест станет хрупким при малейшем изменении формулировки. В таких случаях лучше `to_contain_text(...)`.\n- Проверять состояние элемента через `.is_visible()` (обычный метод, без ожидания) вместо `expect(...).to_be_visible()` — первый вариант не умеет ждать и может дать ложный отрицательный результат.\n- Забывать про `not_to_...` и писать `assert not expect(...)` — так `expect()` не работает, у него есть собственный синтаксис отрицания.\n\n## Мини-задание\n\nНа странице регистрации учебного приложения найди в DevTools кнопку Registration. Определи, есть ли у неё атрибут, который меняется в зависимости от заполненности формы (например, `disabled`). Если да — распиши, как бы ты проверил через `expect()`, что кнопка неактивна до заполнения формы и становится активной после.\n\n## Домашнее задание\n\nЭто домашнее задание относится ко всей неделе 9.\n\n**Задача:** напиши (и запусти) отдельный Python-скрипт `registration_script.py` в своём форке `boilerplate/`, который выполняет полный сценарий регистрации на учебном приложении: открывает страницу регистрации, заполняет форму, нажимает Registration и проверяет через `expect()` и URL, и заголовок Dashboard.\n\n**Критерии готовности:**\n- Скрипт запускается командой `python -m registration_script` без ошибок.\n- В скрипте использованы `page.goto`, `page.locator`, `.fill`, `.click` и минимум две проверки через `expect()` (URL и заголовок).\n- Ты можешь объяснить, чем `expect()` отличается от обычного `assert` применительно к этому сценарию.\n\nЭто подготовка к неделе 10 — на ней мы возьмём готовый, уже работающий `pytest`-тест с точно таким же сценарием (`boilerplate/tests/ui/test_registration.py`) и разберём, как он устроен внутри через Page Object.\n", "hasPractice": true, "quiz": {"question": "Какую проверку стоит использовать, если нужно убедиться, что элемент содержит только часть ожидаемого текста (например, сообщение об ошибке с дополнительным кодом)?", "options": ["expect(locator).to_have_text(...)", "expect(locator).to_contain_text(...)", "expect(locator).to_be_visible()", "assert locator.text_content() is not None"], "correct": 1, "explain": "to_contain_text() проверяет, что текст элемента содержит указанную подстроку, тогда как to_have_text() требует точного совпадения всей строки целиком."}}, {"id": "p79", "section": "Модуль 5 · Allure и отчётность", "subgroup": null, "isOverview": true, "num": null, "title": "Модуль 5. Allure и отчётность (неделя 11)", "content": "# Модуль 5. Allure и отчётность (неделя 11)\n\nК этому моменту у тебя уже есть тесты в общем репозитории (API — модуль 3, UI — модуль 4). Проблема в том, что \"тест упал\" сам по себе почти ничего не говорит: непонятно, на каком шаге, с каким запросом, с каким скриншотом. Allure превращает список зелёных/красных точек в отчёт, по которому можно разобраться в падении, не перечитывая код теста.\n\nМодуль написан заново (в исходном курсе `stepik-api-testing-advanced` соответствующий раздел оказался пустой заглушкой — см. `ROADMAP.md`), но опирается на уже готовую, проверенную интеграцию Allure в `boilerplate/`.\n\n## Уроки\n\n1. [Зачем нужен Allure](#p80) — что не так с обычным выводом pytest\n2. [allure.step и allure.title](#p81) — размечаем сценарий теста\n3. [Вложения: скриншоты и логи при падении](#p82) — разбираем готовый hook в conftest.py\n4. [Настройка и генерация отчёта](#p83) — allure-pytest, --alluredir, allure serve\n5. [Домашнее задание](#p84)\n\n## Итог модуля\n\nВсе тесты студента в общем репозитории снабжены нормальными allure-шагами (`allure.step`, `allure.title`, epic/feature), падения UI-тестов автоматически прикладывают скриншот.\n", "hasPractice": false}, {"id": "p80", "section": "Модуль 5 · Allure и отчётность", "subgroup": null, "isOverview": false, "num": "5.1", "title": "Зачем нужен Allure", "content": "# 5.1. Зачем нужен Allure\n\n## Зачем это нужно\n\nКогда тестов десять, вывода `pytest -v` в терминале достаточно. Когда тестов двести и часть из них падает в CI по ночам — нужно, чтобы кто угодно (включая тебя самого через неделю) мог открыть отчёт и за 30 секунд понять: что упало, на каком шаге сценария, с каким запросом или на каком экране. Именно это делает Allure.\n\n## Теория\n\nAllure — это не библиотека для написания тестов, а инструмент отчётности. Он состоит из двух частей:\n\n- **`allure-pytest`** — плагин, который во время прогона собирает данные о тестах (шаги, вложения, метаданные) и складывает их в папку с \"сырыми\" JSON-файлами (обычно `allure-results/`).\n- **Allure CLI** — отдельная программа, которая превращает эти JSON-файлы в HTML-отчёт с графиками, деревом тестов, историей запусков.\n\nБез разметки в коде Allure всё равно покажет список тестов и их статус — примерно то же, что и обычный pytest-отчёт. Разметка (`allure.step`, `allure.title`, `allure.epic/feature`) — это то, что превращает отчёт из \"список точек\" в читаемую историю сценария.\n\nВ `boilerplate/requirements.txt` уже есть зависимость:\n\n```\nallure-pytest==2.13.5\n```\n\nЗначит, плагин будет активирован автоматически при установке `pip install -r requirements.txt` — писать конфиг для его подключения не нужно.\n\n## Пример\n\nДостаточно запустить тесты с одним дополнительным флагом:\n\n```bash\npytest --alluredir=allure-results\n```\n\nПосле этого в папке `allure-results/` появятся файлы вида `*-result.json` — по одному на тест, плюс служебные файлы окружения. Как превратить их в HTML-отчёт — в уроке 5.4.\n\n## Частые ошибки\n\n- Ждать красивый отчёт сразу после `pytest --alluredir=...` — это ещё не отчёт, а сырые данные. Нужен отдельный шаг генерации (`allure generate` или `allure serve`).\n- Путать `allure-pytest` (Python-плагин, ставится через pip) и Allure CLI (отдельная программа, ставится отдельно — через brew/scoop/архив с сайта). Это два разных инструмента.\n- Держать старую папку `allure-results/` между прогонами без её очистки — тогда в отчёте копятся результаты вперемешку со старыми запусками. Обычно `allure-results/` добавляют в `.gitignore` (это уже сделано в `boilerplate/.gitignore`) и очищают перед новым прогоном.\n\n## Мини-задание\n\nУстанови зависимости из `boilerplate/requirements.txt`, запусти `pytest --alluredir=allure-results` и открой глазами получившиеся JSON-файлы в `allure-results/` — найди в одном из них поле `\"status\"` и попробуй понять, за какой тест он отвечает по полю `\"fullName\"` или `\"name\"`.\n", "hasPractice": true, "quiz": {"question": "Ты запустил pytest --alluredir=allure-results. Что нужно сделать дальше, чтобы увидеть красивый HTML-отчёт?", "options": ["Ничего — allure-results уже и есть готовый HTML-отчёт", "Отдельно установить и запустить Allure CLI (например, allure serve) поверх этой папки", "Открыть JSON-файлы из allure-results прямо в браузере", "Переустановить allure-pytest с флагом --html"], "correct": 1, "explain": "allure-pytest только пишет сырые JSON-результаты. Превращает их в HTML-отчёт отдельная программа — Allure CLI (allure serve / allure generate)."}}, {"id": "p81", "section": "Модуль 5 · Allure и отчётность", "subgroup": null, "isOverview": false, "num": "5.2", "title": "allure.step и allure.title", "content": "# 5.2. allure.step и allure.title\n\n## Зачем это нужно\n\nНазвание функции теста (`test_get_user`) и её докстринг — это то, что видит разработчик, читающий код. А человек, который просто смотрит отчёт после ночного прогона в CI, кода не открывает. Ему нужно человекочитаемое название сценария и пошаговая раскладка того, что происходило — именно это дают `allure.title` и `allure.step`.\n\n## Теория\n\nТри основных декоратора/контекст-менеджера, с которых стоит начать:\n\n- **`@allure.title(\"...\")`** — задаёт человекочитаемое название теста в отчёте вместо технического `test_get_user`.\n- **`@allure.epic(\"...\")` / `@allure.feature(\"...\")`** — группируют тесты в отчёте по крупным разделам (например epic=\"API\", feature=\"Users\") — по ним строится дерево в интерфейсе Allure.\n- **`with allure.step(\"...\"):`** — оборачивает часть теста в именованный шаг. В отчёте шаги показываются как раскрывающийся список, и если тест упал — видно, на каком именно шаге.\n\nВсё это уже используется в общем репозитории. Открой:\n\n```\nboilerplate/tests/api/test_users.py\nboilerplate/tests/ui/test_registration.py\n```\n\n## Пример\n\nРазбор реального теста из `boilerplate/tests/api/test_users.py`:\n\n```python\n@allure.epic(\"API\")\n@allure.feature(\"Users\")\n@pytest.mark.api\nclass TestUsers:\n\n    @allure.title(\"Получение пользователя по id\")\n    def test_get_user(self, users_client: UsersClient):\n        with allure.step(\"Запрашиваем пользователя с id=1\"):\n            user = users_client.get_user(user_id=1)\n\n        with allure.step(\"Проверяем, что данные пользователя корректны\"):\n            assert user.id == 1\n            assert \"@\" in user.email\n```\n\nЕсли упадёт второй `assert`, в отчёте будет видно: шаг \"Запрашиваем пользователя...\" — зелёный, шаг \"Проверяем, что данные...\" — красный, и именно в нём — traceback. Не нужно перечитывать весь тест, чтобы понять, где именно сломалось.\n\nОбрати внимание на связку `@allure.epic` + `@allure.feature` на уровне класса — это распространяется на все тесты внутри `TestUsers`, повторять на каждом методе не нужно.\n\n## Частые ошибки\n\n- Слишком мелкая разбивка на шаги (`allure.step` на каждую строчку) — отчёт превращается в такой же шум, каким был voir код без разметки. Шаг — это осмысленный кусок сценария (\"открыли форму\", \"заполнили и отправили\", \"проверили результат\"), а не техническая мелочь.\n- `allure.title` дублирует то, что и так понятно из имени функции — тогда декоратор не добавляет пользы. Хорошее название описывает бизнес-сценарий, а не техническую механику.\n- Забыть, что `allure.step` — это context manager (`with allure.step(...):\"`), а не декоратор — синтаксис у него другой, чем у `allure.title`.\n\n## Мини-задание\n\nВозьми любой свой тест из модуля 3 или 4 (API или UI) и добавь в него `@allure.title` с человекочитаемым названием и минимум два `allure.step` — один на подготовку/действие, один на проверку.\n", "hasPractice": true, "quiz": {"question": "Как правильно использовать allure.step внутри теста?", "options": ["Как декоратор над функцией теста: @allure.step(\"...\")", "Как контекстный менеджер: with allure.step(\"...\"):", "Как обычный вызов функции: allure.step(\"...\") без блока", "Только внутри conftest.py, в тестах напрямую не используется"], "correct": 1, "explain": "allure.step — контекстный менеджер: код внутри блока with становится отдельным именованным шагом в отчёте."}}, {"id": "p82", "section": "Модуль 5 · Allure и отчётность", "subgroup": null, "isOverview": false, "num": "5.3", "title": "Вложения: скриншоты и логи при падении", "content": "# 5.3. Вложения: скриншоты и логи при падении\n\n## Зачем это нужно\n\nТекст ошибки (\"`AssertionError: Dashboard != Dashbord`\") — это полезно, но для UI-теста скриншот в момент падения часто говорит больше, чем весь traceback. Не нужно гадать, что творилось на экране — можно просто на него посмотреть.\n\n## Теория\n\n`allure.attach(...)` прикладывает к результату теста произвольные данные: текст, JSON, скриншот, файл лога. Прикладывать вложения можно вручную внутри теста, но гораздо удобнее сделать это автоматически для ЛЮБОГО упавшего UI-теста — через pytest hook, один раз в `conftest.py`.\n\nИменно так уже сделано в общем репозитории. Открой `boilerplate/conftest.py` и найди в конце файла:\n\n```python\n@pytest.hookimpl(hookwrapper=True)\ndef pytest_runtest_makereport(item, call):\n    outcome = yield\n    report = outcome.get_result()\n\n    if report.when == \"call\" and report.failed:\n        page: Page | None = item.funcargs.get(\"page\")\n        if page is not None:\n            allure.attach(\n                page.screenshot(),\n                name=\"screenshot-on-failure\",\n                attachment_type=allure.attachment_type.PNG,\n            )\n```\n\nРазбор по частям:\n\n- `pytest_runtest_makereport` — это стандартный pytest hook, который вызывается после каждой фазы теста (setup / call / teardown) и формирует отчёт (`report`) об этой фазе.\n- `hookwrapper=True` — превращает функцию в обёртку: сначала выполняется оригинальная логика pytest (`yield`), а затем — наш код после неё, уже с готовым `report` на руках.\n- `report.when == \"call\" and report.failed` — нас интересует падение именно в фазе выполнения самого теста (не в фикстурах — `setup`, и не после — `teardown`).\n- `item.funcargs.get(\"page\")` — если тест использовал фикстуру `page` (то есть это UI-тест), Playwright-объект страницы будет доступен через `item.funcargs`. Для API/unit-тестов его там не будет — `page` окажется `None`, и вложение просто не приложится.\n- `page.screenshot()` — Playwright снимает скриншот текущего состояния браузера в байтах, `allure.attach` прикладывает эти байты как PNG к результату теста.\n\nКлючевая идея: **эта логика не встроена в каждый тест** — она в одном месте (`conftest.py`) и работает для всех UI-тестов автоматически, включая те, что напишешь ты сам в будущих PR.\n\n## Пример\n\nНичего дополнительно писать не нужно — попробуй сломать тест специально, чтобы увидеть механизм в действии:\n\n```python\n# временно, для эксперимента — не коммитить\ndef test_broken_on_purpose(dashboard_page):\n    dashboard_page.check_visible_toolbar_title()  # страница ещё не открыта, упадёт\n```\n\nЗапусти `pytest -m ui --alluredir=allure-results`, сгенерируй отчёт (урок 5.4) и найди в упавшем тесте вложение `screenshot-on-failure`.\n\n## Частые ошибки\n\n- Пытаться делать `page.screenshot()` внутри самого теста в каждом `assert` \"на всякий случай\" — вместо этого используй уже готовый общий механизм в `conftest.py`, не дублируй его.\n- Забыть, что hook сработает только если в тесте реально есть параметр `page` — если Page Object спрятан за другой фикстурой без него в сигнатуре, `item.funcargs` его не найдёт (в нашем boilerplate `registration_page`/`dashboard_page` сами зависят от `page`, так что фикстура всё равно попадает в `funcargs`).\n- Прикладывать скриншот и для API-тестов \"по аналогии\" — там это бессмысленно, вместо этого для API-тестов полезнее прикладывать тело запроса/ответа (это уже вне обязательной программы модуля, но логика та же: `allure.attach` с `attachment_type=allure.attachment_type.JSON`).\n\n## Мини-задание\n\nСпециально сломай один свой UI-тест (например, поменяй ожидаемый текст в `expect(...).to_have_text(...)` на заведомо неверный), прогони с `--alluredir`, сгенерируй отчёт и убедись, что скриншот приложился автоматически. Не забудь откатить \"поломку\" после эксперимента.\n", "hasPractice": true, "quiz": {"question": "Хук в conftest.py проверяет условие `report.when == \"call\" and report.failed` перед тем, как приложить скриншот. Зачем нужна проверка именно на 'call'?", "options": ["Чтобы прикладывать скриншот только при падении в самом тесте, а не в setup/teardown фикстур", "Потому что 'call' — единственная фаза, которую поддерживает pytest в принципе", "Чтобы ускорить прогон тестов за счёт пропуска лишних проверок", "Потому что скриншот технически можно снять только во время фазы 'call'"], "correct": 0, "explain": "У теста есть три фазы — setup, call, teardown. Проверка 'when == call' отделяет падение самого сценария от падения, например, фикстуры на этапе подготовки."}}, {"id": "p83", "section": "Модуль 5 · Allure и отчётность", "subgroup": null, "isOverview": false, "num": "5.4", "title": "Настройка и генерация отчёта", "content": "# 5.4. Настройка и генерация отчёта\n\n## Зачем это нужно\n\n`allure-pytest` умеет только собирать сырые данные. Чтобы увидеть красивый HTML-отчёт с деревом тестов, графиками и историей — нужен отдельный инструмент, Allure CLI, и команда, которая превратит JSON в страницы.\n\n## Теория\n\nДва инструмента, которые не стоит путать:\n\n1. **`allure-pytest`** — Python-пакет, ставится через `pip install -r requirements.txt` (уже в зависимостях boilerplate). Он ничего не показывает сам — только пишет `*-result.json` в папку `--alluredir`.\n2. **Allure CLI (`allure`)** — отдельная программа на Java, ставится один раз на машину (через `brew install allure` на macOS, `scoop install allure` на Windows, или вручную из архива с официального сайта). Именно она умеет превращать JSON в HTML.\n\nДве полезные команды CLI:\n\n- `allure serve allure-results` — генерирует отчёт во временную папку и сразу открывает его в браузере. Удобно для локальной разработки.\n- `allure generate allure-results -o allure-report --clean` — генерирует статический HTML-отчёт в постоянную папку `allure-report/`. Именно так обычно делают в CI, чтобы потом отчёт можно было опубликовать как артефакт (см. модуль 6).\n\n## Пример\n\nЛокальный цикл разработки:\n\n```bash\npytest --alluredir=allure-results\nallure serve allure-results\n```\n\nЦикл для CI (генерация в статику, без открытия браузера — на CI-раннере браузера и не будет):\n\n```bash\npytest --alluredir=allure-results\nallure generate allure-results -o allure-report --clean\n```\n\nВ `.github/workflows/ci.yml` и `.gitlab-ci.yml` общего репозитория уже настроена загрузка `allure-results` как артефакта пайплайна (см. `upload-artifact` / `artifacts:` в этих файлах) — этого достаточно, чтобы результаты не терялись после завершения job'а. Полноценную публикацию сгенерированного HTML-отчёта (например, на GitHub Pages или во внешний Allure-сервис) курс намеренно не покрывает — это уже задача уровня \"настройка инфраструктуры\", а не работы автотестера.\n\n## Частые ошибки\n\n- Ставить `allure-pytest` и ждать, что команда `allure` уже доступна в терминале — это разные установки, `allure-pytest` не тянет за собой Java CLI.\n- Коммитить `allure-results/` или `allure-report/` в git — это сгенерированные артефакты конкретного прогона, место им в `.gitignore` (уже сделано в boilerplate).\n- Путать `--alluredir` (флаг pytest, куда писать сырые данные) и `-o` у `allure generate` (куда класть готовый HTML) — это два разных пути в двух разных командах.\n\n## Частые ошибки при первом запуске\n\n- `allure: command not found` — значит, CLI не установлен или не в `PATH`; `pip install allure-pytest` эту проблему не решает, это разные инструменты.\n- Пустой отчёт — обычно означает, что `pytest` запускали без `--alluredir`, и в указанной папке просто нет файлов.\n\n## Мини-задание\n\nУстанови Allure CLI (один раз на свою машину) и прогони полный локальный цикл: `pytest --alluredir=allure-results` → `allure serve allure-results`. Найди в открывшемся отчёте вкладку \"Suites\" и убедись, что видишь дерево `epic -> feature -> test` из своих тестов.\n", "hasPractice": true, "quiz": {"question": "В чём разница между `allure serve allure-results` и `allure generate allure-results -o allure-report --clean`?", "options": ["serve сразу открывает временный отчёт в браузере, generate создаёт постоянную папку с HTML (обычно используется в CI)", "Это два названия одной и той же команды, работают одинаково", "generate работает только в CI и недоступен локально", "serve нужен для API-тестов, а generate — только для UI-тестов"], "correct": 0, "explain": "serve — для быстрой локальной проверки во временной папке, generate -o ... --clean — для сохранения статического отчёта, который потом публикуется как артефакт CI."}}, {"id": "p84", "section": "Модуль 5 · Allure и отчётность", "subgroup": null, "isOverview": false, "num": null, "title": "Домашнее задание модуля 5", "content": "# Домашнее задание модуля 5\n\n## Что нужно сделать\n\nВозьми **все** свои тесты, которые уже есть в общем репозитории (из модулей 3 и 4 — API и UI), и приведи их к единому стандарту Allure-разметки:\n\n1. На каждом тестовом классе — `@allure.epic(...)` и `@allure.feature(...)`.\n2. На каждом тесте — `@allure.title(...)` с человекочитаемым названием сценария (не техническое имя функции).\n3. Внутри каждого теста — минимум 2 `allure.step`: один на подготовку/действие, один на проверку. Для более сложных сценариев (например, полная регистрация) — 3-4 шага, по одному на логичный этап сценария.\n4. Убедиться, что UI-тесты используют фикстуру `page` в цепочке зависимостей (через `registration_page`/`dashboard_page` или напрямую) — тогда автоматическое приложение скриншота при падении из `conftest.py` сработает без дополнительного кода.\n\n## Критерии \"готово\"\n\n- `pytest --alluredir=allure-results` отрабатывает без ошибок.\n- В сгенерированном отчёте (`allure serve allure-results`) видно дерево `epic -> feature -> тест` без \"безымянных\" узлов.\n- В отчёте у каждого теста есть минимум 2 шага.\n- Специально сломанный (временно) UI-тест показывает приложенный скриншот.\n- Изменения оформлены как PR в общий репозиторий (по правилам модуля 2), ревью — от одногруппника.\n\n## Что не нужно делать\n\n- Не нужно настраивать публикацию отчёта на внешнем сервисе (Allure TestOps и подобные) — это вне программы курса.\n- Не нужно приклеивать скриншоты вручную в каждом тесте — это уже сделано один раз в `conftest.py`.\n", "hasPractice": false}, {"id": "p85", "section": "Модуль 6 · CI на уровне пользователя", "subgroup": null, "isOverview": true, "num": null, "title": "Модуль 6. CI на уровне пользователя (неделя 12)", "content": "# Модуль 6. CI на уровне пользователя (неделя 12)\n\nНа реальной работе джуниор почти никогда не пишет CI-пайплайн с нуля — он уже есть, настроен более опытными коллегами. Но джуниору критически важно уметь его **читать**: понимать, на каком стейдже упал прогон, находить нужный лог, отличать \"сломался мой тест\" от \"сломалась инфраструктура\", и уметь перезапустить job вручную.\n\nМодуль написан заново (в исходном курсе `stepik-api-testing-advanced` раздел про CI/CD оказался пустой заглушкой — см. `ROADMAP.md`), но опирается на реальные, рабочие CI-конфиги общего репозитория.\n\n## Уроки\n\n1. [Введение в CI/CD](#p86)\n2. [Читаем GitHub Actions workflow](#p87) — разбор `.github/workflows/ci.yml` построчно\n3. [Читаем .gitlab-ci.yml](#p88) — тот же пайплайн, другой синтаксис\n4. [Диагностика упавшего пайплайна](#p89)\n5. [Домашнее задание](#p90)\n\n## Итог модуля\n\nСтудент может сам диагностировать, почему упал pipeline после его PR — без обращения к куратору \"у меня почему-то красный крестик\".\n", "hasPractice": false}, {"id": "p86", "section": "Модуль 6 · CI на уровне пользователя", "subgroup": null, "isOverview": false, "num": "6.1", "title": "Введение в CI/CD", "content": "# 6.1. Введение в CI/CD\n\n## Зачем это нужно\n\nПока тесты запускаются только вручную с твоего ноутбука, легко забыть их запустить перед мёржем — или запустить, но не заметить упавший тест среди вывода в терминале. CI (Continuous Integration) решает эту проблему: тесты запускаются автоматически на каждый push и PR, независимо от того, вспомнил ли о них человек.\n\n## Теория\n\n**CI (Continuous Integration)** — практика, при которой изменения кода автоматически проверяются (сборка, тесты, линтеры) при каждом коммите/PR, на отдельном сервере (\"раннере\"), а не на машине разработчика.\n\n**CD (Continuous Delivery/Deployment)** — продолжение той же идеи для доставки изменений в тестовые/боевые окружения. В контексте курса нас интересует именно CI — автоматический прогон тестов; деплой приложений выходит за рамки программы.\n\nБазовые понятия, которые встретятся в обеих системах (GitHub Actions и GitLab CI):\n\n- **Pipeline (пайплайн)** — весь процесс проверки одного коммита/PR от начала до конца.\n- **Stage / Job (стейдж / джоба)** — пайплайн разбит на этапы (stages), внутри каждого этапа — одна или несколько задач (jobs), которые могут выполняться параллельно.\n- **Runner (раннер)** — машина (часто — временный контейнер), на которой реально выполняется job.\n- **Artifact (артефакт)** — файлы, которые job сохраняет после выполнения (например, allure-results из модуля 5), чтобы их можно было скачать или передать в следующий stage.\n- **Trigger (триггер)** — событие, которое запускает пайплайн: push в ветку, открытие/обновление PR, ручной запуск, расписание.\n\n## Пример\n\nОбщий репозиторий курса использует **обе** системы для примера (в реальном проекте обычно используется только одна — та, что предоставляет хостинг репозитория):\n\n```\nboilerplate/.github/workflows/ci.yml   — GitHub Actions\nboilerplate/.gitlab-ci.yml             — GitLab CI\n```\n\nОба файла реализуют одну и ту же идею: сначала быстрые unit+API тесты, затем (если они прошли) — более медленные UI-тесты с браузером. В следующих двух уроках разберём каждый файл построчно.\n\n## Частые ошибки\n\n- Считать, что CI и CD — это одно и то же. CI — про проверку, CD — про доставку/деплой. Курс касается только CI.\n- Путать \"упал pipeline\" с \"сломался прод\". Красный пайплайн на PR означает, что проблему нашли ДО того, как код попал в основную ветку — это ровно то, ради чего CI существует.\n- Ожидать, что раннер CI — это та же машина/окружение, что у тебя локально. Обычно это чистый контейнер без твоих локально установленных пакетов — поэтому пайплайн всегда явно устанавливает зависимости (`pip install -r requirements.txt`) с нуля.\n\n## Мини-задание\n\nОткрой `boilerplate/.github/workflows/ci.yml` и `boilerplate/.gitlab-ci.yml` рядом и найди в каждом файле: сколько там jobs/stages, и в каком порядке они выполняются (порядок задаётся через `needs:` в GitHub Actions и через `stages:`/`stage:` в GitLab CI).\n", "hasPractice": true, "quiz": {"question": "В чём ключевое отличие CI от CD применительно к этому курсу?", "options": ["CI — автоматическая проверка кода (тесты) при каждом коммите/PR; CD — доставка изменений дальше (деплой). Курс касается только CI", "Это просто два разных названия одного и того же процесса", "CD — это прогон тестов, а CI — деплой приложения", "CI нужен только для UI-тестов, а CD — только для API-тестов"], "correct": 0, "explain": "CI — про проверку (сборка/тесты на каждый коммит), CD — про доставку/деплой в окружения. Программа курса ограничена именно CI."}}, {"id": "p87", "section": "Модуль 6 · CI на уровне пользователя", "subgroup": null, "isOverview": false, "num": "6.2", "title": "Читаем GitHub Actions workflow", "content": "# 6.2. Читаем GitHub Actions workflow\n\n## Зачем это нужно\n\nЕсли твой репозиторий живёт на GitHub, пайплайн описывается файлом в `.github/workflows/*.yml`. Уметь прочитать такой файл — значит понимать, что именно выполнится при твоём следующем push, ещё до того, как это произойдёт.\n\n## Теория\n\nКлючевые поля YAML-файла GitHub Actions:\n\n- **`on:`** — триггеры запуска (push, pull_request, расписание, ручной запуск).\n- **`jobs:`** — словарь job'ов, каждый со своим именем.\n- **`runs-on:`** — на какой виртуальной машине выполняется job (например `ubuntu-latest`).\n- **`steps:`** — последовательность шагов внутри job'а: либо готовое действие (`uses: actions/checkout@v4`), либо своя команда (`run: pytest ...`).\n- **`needs:`** — job зависит от другого job'а и не начнётся, пока тот не завершится успешно.\n- **`if: always()`** — шаг выполнится, даже если предыдущие шаги упали (полезно для загрузки артефактов при падении тестов).\n\n## Пример\n\nРазбор `boilerplate/.github/workflows/ci.yml` построчно:\n\n```yaml\non:\n  push:\n    branches: [main]\n  pull_request:\n    branches: [main]\n```\n\nПайплайн запускается на push в `main` и на любой PR, целящийся в `main`. Значит, каждый твой PR в общий репозиторий автоматически прогонит этот workflow.\n\n```yaml\njobs:\n  unit-and-api:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-python@v5\n        with:\n          python-version: \"3.12\"\n      - name: Install dependencies\n        run: pip install -r requirements.txt\n      - name: Run unit + API tests\n        run: pytest -m \"unit or api\" --alluredir=allure-results\n      - name: Upload allure results\n        if: always()\n        uses: actions/upload-artifact@v4\n        with:\n          name: allure-results-api\n          path: allure-results\n```\n\nJob `unit-and-api`: скачивает код (`checkout`), ставит Python 3.12, ставит зависимости, запускает только unit- и API-тесты (`-m \"unit or api\"` — тот же синтаксис маркеров из модуля 1!), и в любом случае (`if: always()`, даже если тесты упали) сохраняет папку `allure-results` как артефакт, который потом можно скачать со страницы прогона.\n\n```yaml\n  ui:\n    runs-on: ubuntu-latest\n    needs: unit-and-api\n    steps:\n      ...\n      - name: Install dependencies\n        run: |\n          pip install -r requirements.txt\n          playwright install --with-deps chromium\n      - name: Run UI tests\n        run: pytest -m ui --alluredir=allure-results\n```\n\nJob `ui` зависит от `unit-and-api` (`needs:`) — то есть UI-тесты (медленные, с браузером) запустятся только если быстрые тесты уже прошли. Дополнительно этот job ставит браузер Chromium (`playwright install`) — шаг, которого нет в первом job'е, потому что там браузер не нужен.\n\n## Частые ошибки\n\n- Не заметить `needs:` и удивляться, почему UI job вообще не запустился — если `unit-and-api` упал, `ui` не стартует.\n- Забыть `if: always()` при добавлении своего шага сохранения артефактов — без него шаг выполнится только при успехе предыдущих, и при падении тестов ты не увидишь allure-results вообще.\n- Путать `uses:` (готовое переиспользуемое действие из marketplace) и `run:` (произвольная shell-команда) — это разные механизмы описания шага.\n\n## Мини-задание\n\nНайди в `ci.yml` строку, отвечающую за версию Python, и ответь: что произойдёт, если у тебя локально Python 3.11, а в CI указан 3.12 — где тесты выполнятся \"по-настоящему\", а где — просто для проверки перед мёржем?\n\n## Как посмотреть результат в интерфейсе GitHub\n\nВкладка **Actions** в репозитории → конкретный workflow run → список jobs слева → клик на job открывает лог каждого шага. Красный крестик у шага — именно там нужно искать причину падения (см. урок 6.4).\n", "hasPractice": true, "quiz": {"question": "Job `ui` в boilerplate/.github/workflows/ci.yml объявлен с `needs: unit-and-api`. Что это означает?", "options": ["Job ui запустится параллельно с unit-and-api, needs — просто для документации", "Job ui запустится только после успешного завершения job unit-and-api", "needs подключает те же зависимости из requirements.txt автоматически", "needs передаёт переменные окружения из одного job в другой"], "correct": 1, "explain": "`needs:` создаёт явную зависимость между job'ами: следующий стартует только после успеха предыдущего — поэтому медленные UI-тесты не запускаются впустую, если упали быстрые."}}, {"id": "p88", "section": "Модуль 6 · CI на уровне пользователя", "subgroup": null, "isOverview": false, "num": "6.3", "title": "Читаем .gitlab-ci.yml", "content": "# 6.3. Читаем .gitlab-ci.yml\n\n## Зачем это нужно\n\nМногие компании (особенно в РФ и Сербии) держат репозитории на self-hosted GitLab, а не на GitHub. Синтаксис файла другой, но идея та же — важно уметь мысленно \"переводить\" между ними.\n\n## Теория\n\nКлючевые поля `.gitlab-ci.yml`:\n\n- **`image:`** — Docker-образ, в котором будут выполняться jobs (аналог `runs-on`, но задаётся образом контейнера, а не именем виртуалки).\n- **`stages:`** — список этапов пайплайна по порядку. Все jobs одного stage могут выполняться параллельно; следующий stage стартует только после завершения предыдущего.\n- **`before_script:`** — команды, которые выполняются перед каждым job'ом (или конкретным job'ом, если указаны внутри него).\n- **`script:`** — основные команды job'а (аналог `run:` в GitHub Actions).\n- **`needs:`** — как и в GitHub Actions, явная зависимость job'а от другого (без неё порядок определяется только stage).\n- **`artifacts:`** — файлы, которые сохраняются после job'а; `when: always` — сохранять даже при падении.\n\n## Пример\n\nРазбор `boilerplate/.gitlab-ci.yml`:\n\n```yaml\nimage: python:3.12-slim\n\nstages:\n  - test-fast\n  - test-ui\n\nbefore_script:\n  - pip install -r requirements.txt\n```\n\nВсе jobs выполняются в контейнере `python:3.12-slim`. Пайплайн состоит из двух последовательных этапов. `before_script` на верхнем уровне — общий для всех jobs, чтобы не дублировать установку зависимостей.\n\n```yaml\nunit-and-api:\n  stage: test-fast\n  script:\n    - pytest -m \"unit or api\" --alluredir=allure-results\n  artifacts:\n    when: always\n    paths:\n      - allure-results\n```\n\nJob `unit-and-api` относится к первому этапу (`test-fast`), запускает быстрые тесты и сохраняет `allure-results` как артефакт независимо от результата (`when: always`).\n\n```yaml\nui:\n  stage: test-ui\n  needs: [\"unit-and-api\"]\n  before_script:\n    - pip install -r requirements.txt\n    - playwright install --with-deps chromium\n  script:\n    - pytest -m ui --alluredir=allure-results\n```\n\nJob `ui` относится ко второму этапу и явно указывает `needs: [\"unit-and-api\"]` — переопределяет `before_script` (добавляя установку браузера), потому что для UI-тестов нужен ещё и Chromium.\n\n## Сравнение с GitHub Actions\n\n| GitHub Actions | GitLab CI | Смысл |\n|---|---|---|\n| `runs-on` | `image` | где выполняется job |\n| `jobs.<name>` | `<name>:` (в корне файла) | описание job'а |\n| `needs:` | `needs:` | явная зависимость между job'ами |\n| `if: always()` на шаге | `when: always` на artifacts | сохранять данные при падении |\n| `uses: actions/upload-artifact` | `artifacts: paths:` | сохранение файлов после job'а |\n\nКак только видна эта таблица соответствий, читать любой из двух форматов становится вопросом привычки, а не нового знания.\n\n## Частые ошибки\n\n- Думать, что `before_script` выполняется один раз на весь пайплайн — на самом деле он выполняется перед КАЖДЫМ job'ом заново (в своём чистом контейнере), поэтому установка зависимостей повторяется.\n- Не заметить переопределение `before_script` внутри job'а `ui` — оно полностью заменяет верхнеуровневый `before_script` для этого job'а, а не дополняет его.\n- Путать `stage:` (единственное число, к какому этапу относится job) и `stages:` (список всех этапов пайплайна).\n\n## Мини-задание\n\nОткрой пайплайн своего PR (или пример из `.gitlab-ci.yml`) и найди: какой job выполнится, если stage `test-fast` упадёт — выполнится ли `ui`, и почему.\n", "hasPractice": true, "quiz": {"question": "Если бы before_script job'а 'ui' в .gitlab-ci.yml состоял только из строки playwright install --with-deps chromium (без pip install -r requirements.txt), что произошло бы с зависимостями из requirements.txt для этого job'а?", "options": ["Они всё равно установятся — верхнеуровневый before_script суммируется с job-level", "Они НЕ установятся — before_script job'а полностью заменяет верхнеуровневый, а не дополняет его", "GitLab автоматически допишет их в конец списка команд", "Пайплайн откажется стартовать из-за ошибки конфигурации"], "correct": 1, "explain": "before_script на уровне job'а полностью переопределяет верхнеуровневый — поэтому в реальном ci.yml курса ui-job явно повторяет обе команды: и pip install, и playwright install."}}, {"id": "p89", "section": "Модуль 6 · CI на уровне пользователя", "subgroup": null, "isOverview": false, "num": "6.4", "title": "Диагностика упавшего пайплайна", "content": "# 6.4. Диагностика упавшего пайплайна\n\n## Зачем это нужно\n\nКрасный крестик на PR — самая частая причина, по которой джуниор идёт к более опытному коллеге \"а что это значит\". Цель этого урока — чтобы в 80% случаев ответ находился самостоятельно, за пару минут, по логам.\n\n## Теория\n\nАлгоритм диагностики — один и тот же для GitHub Actions и GitLab CI:\n\n1. **Найти, какой именно job упал.** Если пайплайн состоит из нескольких stages/jobs (как в общем репозитории — сначала `unit-and-api`, потом `ui`), падение одного job'а не означает, что упало всё — смотри конкретно на красный элемент.\n2. **Открыть лог именно упавшего шага**, а не всего job'а целиком. В GitHub Actions шаги разворачиваются по клику, в GitLab CI — лог job'а один сплошной, но упавшая команда обычно выделена и находится в конце.\n3. **Отличить три типа падений:**\n   - **Упал тест** (`assert` не выполнился, exception в тесте) — в логе виден pytest-traceback с именем теста. Это твоя зона ответственности — либо баг в коде, либо баг в тесте.\n   - **Упала установка окружения** (`pip install` не смог поставить пакет, `playwright install` не скачался) — в логе ошибка ДО начала pytest. Часто временная проблема сети/реестра пакетов — можно попробовать перезапустить job.\n   - **Упал сам pipeline-конфиг** (опечатка в YAML, несуществующий job в `needs:`) — тогда тесты вообще не запускаются, ошибка появляется на этапе валидации файла, ещё до логов job'ов.\n4. **Скачать артефакты**, если это не помогло. `allure-results`, которые загружает CI (см. уроки 6.2–6.3), можно скачать и открыть локально через `allure serve` — иногда полный Allure-отчёт нагляднее, чем сырой текстовый лог.\n5. **Перезапустить job вручную**, если причина — временная (сеть, флейковый тест). В GitHub Actions — кнопка \"Re-run jobs\" на странице workflow run. В GitLab CI — кнопка \"Retry\" у конкретного job'а в интерфейсе пайплайна.\n\n## Пример\n\nТипичный сценарий: ты открыл PR с новым API-тестом, job `unit-and-api` красный. Лог показывает:\n\n```\nFAILED tests/api/test_users.py::TestUsers::test_get_user - AssertionError: assert 2 == 1\n```\n\nЭто явно случай 1 — упал тест, а не окружение. Дальше это обычная отладка теста: смотрим, что метод `get_user` вернул `id=2` вместо ожидаемого `id=1` — скорее всего, ошибка в самом тесте (например, скопировали фикстуру и забыли поменять параметр), а не в API.\n\nДругой пример:\n\n```\nERROR: Could not find a version that satisfies the requirement playwright==1.47.0\n```\n\nЭто случай 2 — не установилось окружение, скорее всего временная проблема с реестром пакетов или неверная версия в `requirements.txt`. Здесь сначала стоит попробовать перезапустить job, и только если повторяется — разбираться с версией пакета.\n\n## Частые ошибки\n\n- Смотреть только на итоговый статус (\"Failed\") и не открывать сам лог — почти вся полезная информация внутри развёрнутого шага/job'а.\n- Пытаться чинить локально то, что на самом деле является проблемой самого CI-раннера (например, недоступность внешнего пакетного реестра) — сначала стоит перепроверить: воспроизводится ли падение локально (`pytest -m \"unit or api\"` у себя).\n- Ре-раниться \"на автомате\" при любом падении, не читая лог — если тест действительно падает стабильно (не флейк), повторный запуск просто трижды покажет ту же ошибку и потратит время CI-раннера.\n\n## Мини-задание\n\nСпециально сломай один свой тест (например, поставь заведомо неверный `assert`), запушь ветку/открой PR, дождись падения пайплайна и пройди весь алгоритм: найди упавший job → открой лог упавшего шага → определи тип падения (тест / окружение / конфиг) → откати \"поломку\".\n", "hasPractice": true, "quiz": {"question": "В логе CI видна ошибка: `ERROR: Could not find a version that satisfies the requirement playwright==1.47.0` — ещё до запуска pytest. К какому из трёх типов падений это относится?", "options": ["Упал тест", "Упала установка окружения", "Упал сам pipeline-конфиг (ошибка в YAML)", "Это баг в Allure-отчётности"], "correct": 1, "explain": "Ошибка возникает на этапе pip install, до всякого запуска тестов — значит, дело не в коде и не в тестах, а в установке зависимостей."}}, {"id": "p90", "section": "Модуль 6 · CI на уровне пользователя", "subgroup": null, "isOverview": false, "num": null, "title": "Домашнее задание модуля 6", "content": "# Домашнее задание модуля 6\n\n## Что нужно сделать\n\n1. Открой любой свой предыдущий PR в общем репозитории (или создай новый с любым мелким изменением) и найди в интерфейсе GitHub/GitLab запущенный по нему pipeline.\n2. Опиши текстом (в комментарии к PR или в отдельном файле `ci_report.md` в своей ветке):\n   - сколько jobs/stages в пайплайне и в каком порядке они выполняются;\n   - сколько времени занял прогон каждого job'а;\n   - если что-то падало — какого рода было падение (тест / окружение / конфиг) и как ты это определил.\n3. Специально сломай один тест, дождись красного пайплайна, пройди алгоритм диагностики из урока 6.4, зафиксируй в том же отчёте: какой job упал, что было в логе, как ты бы это чинил. После — верни тест в рабочее состояние отдельным коммитом.\n\n## Критерии \"готово\"\n\n- Отчёт показывает, что ты реально открывал логи конкретных jobs, а не только смотрел на итоговый статус.\n- Правильно определён тип падения (тест / окружение / конфиг) для намеренно сломанного теста.\n- Финальный коммит в ветке — с зелёным пайплайном.\n\n## Что не нужно делать\n\n- Не нужно писать новый pipeline с нуля или менять структуру существующих `.yml`-файлов — модуль про чтение и диагностику, не про авторство CI.\n", "hasPractice": false}, {"id": "p91", "section": "Модуль 7 · Финальный спринт", "subgroup": null, "isOverview": true, "num": null, "title": "Модуль 7. Финальный спринт — \"работа над тикетами\" (недели 13–14)", "content": "# Модуль 7. Финальный спринт — \"работа над тикетами\" (недели 13–14)\n\nЭто не учебные задания в привычном смысле. С этого момента студенты работают с \"боевыми\" тикетами в общем репозитории: багфиксы чужих тестов, ревью PR друг друга, рефакторинг мелких кусков кода. Это имитация первого месяца на реальной работе — с тикет-трекером, чужим кодом и дедлайнами, а не с чистого листа.\n\n## Уроки\n\n1. [Как устроен финальный спринт](#p92) — правила, роли, откуда берутся тикеты\n2. [Багфиксы чужих тестов](#p93)\n3. [Ревью PR друг друга](#p94)\n4. [Рефакторинг без поломок](#p95)\n5. [Итоговые критерии](#p96)\n\n## Итог модуля\n\nУ каждого студента в GitHub — история из 10+ PR с ревью, а не один финальный дамп кода в конце курса.\n", "hasPractice": false}, {"id": "p92", "section": "Модуль 7 · Финальный спринт", "subgroup": null, "isOverview": false, "num": "7.1", "title": "Как устроен финальный спринт", "content": "# 7.1. Как устроен финальный спринт\n\n## Зачем это нужно\n\nНа реальной работе никто не выдаёт джуниору чистый лист \"напиши тест с нуля\" каждую неделю. Реальность — это тикет-трекер с чужими задачами: где-то тест стал нестабильным (флейкует), где-то нужно добавить проверку к уже существующему сценарию, где-то коллега попросил посмотреть его PR. Последние две недели курса имитируют именно это.\n\n## Теория\n\nК началу модуля 7 в общем репозитории уже накопилось: API-клиенты и тесты от модуля 3, Page Object'ы и UI-тесты от модуля 4, allure-разметка от модуля 5 — от **всех** студентов потока. Это уже не игрушечный проект одного человека, а полноценная кодовая база с чужим стилем, чужими решениями и, неизбежно, чужими недочётами.\n\nФормат работы:\n\n- Тикеты формулируются как в обычном таск-трекере: короткое название, описание проблемы или желаемого результата, критерии готовности. Тикет не объясняет, как чинить — только что не так или что нужно.\n- Тикеты не привязаны к тому, кто писал исходный код — багфиксить чужой тест обычной практикой является и на реальной работе.\n- Каждый тикет закрывается отдельным PR (маленьким, по правилам модуля 2) — не накапливаем изменения на неделю в одной ветке.\n- Ревью обязательно от другого студента, не от автора кода, который чинится.\n\n## Пример типов тикетов, которые встретятся в модуле 7\n\n- \"Тест `test_get_user` иногда падает на CI, но проходит локально\" — флейковый тест, нужно разобраться в причине (обычно — гонка состояний или недостаточное ожидание в UI-тесте) и стабилизировать.\n- \"В `UsersClient` не хватает метода для обновления пользователя\" — расширение существующего клиента по уже знакомому из модуля 3 шаблону.\n- \"Дублируется код между `RegistrationPage` и новым `LoginPage`, стоит вынести общее в `BasePage`\" — рефакторинг (см. урок 7.4).\n- \"Проверь мой PR с новым тестом на негативный сценарий\" — чистое ревью, без своего кода.\n\n## Частые ошибки\n\n- Пытаться переписать чужой код \"как я считаю правильным\", вместо того чтобы решить именно то, что написано в тикете. Не каждый тикет — повод для масштабного рефакторинга.\n- Закрывать несколько тикетов одним PR \"чтобы не плодить ветки\" — это усложняет ревью и откат в случае проблем, нарушает правило модуля 2 (\"одна задача — одна ветка — один PR\").\n- Игнорировать существующий стиль кода в репозитории и вносить изменения \"своим\" стилем — согласованность важнее личных предпочтений в общем проекте.\n\n## Мини-задание\n\nПрежде чем брать первый тикет, изучи содержимое `boilerplate/` целиком (или уже разросшийся репозиторий потока, если он общий) — раздели для себя код на три категории: \"это я понимаю полностью\", \"это я примерно понимаю\", \"это я вижу впервые\". Начни с тикетов из первой категории.\n", "hasPractice": true, "quiz": {"question": "Почему в финальном спринте один тикет должен закрываться ровно одним отдельным PR, а не несколькими тикетами в одном PR?", "options": ["Так быстрее писать код — меньше переключений между ветками", "Чтобы ревью было проще, а откат в случае проблемы — точечным, без побочных изменений", "GitHub технически не позволяет открыть два PR из одной ветки", "Это требование действует только для API-тестов"], "correct": 1, "explain": "Маленький PR на одну задачу проще ревьюить и, если что-то пошло не так, откатить — без риска задеть несвязанные изменения."}}, {"id": "p93", "section": "Модуль 7 · Финальный спринт", "subgroup": null, "isOverview": false, "num": "7.2", "title": "Багфиксы чужих тестов", "content": "# 7.2. Багфиксы чужих тестов\n\n## Зачем это нужно\n\nЧинить чужой тест сложнее, чем свой: нет контекста \"почему я это так написал\", приходится восстанавливать логику по коду и по allure-отчёту. Это ровно тот навык, который отличает \"прошёл курс\" от \"готов работать в команде\".\n\n## Теория\n\nАлгоритм работы с чужим упавшим/сломанным тестом:\n\n1. **Воспроизведи падение локально.** Не чини \"на глаз\" по одному только описанию тикета — сначала запусти тест сам и увидь то же самое.\n2. **Прочитай allure-отчёт теста** (модуль 5) — шаги и, для UI, скриншот на падении часто сразу показывают, где расходится ожидание с реальностью.\n3. **Определи тип проблемы:**\n   - **Баг в тесте** — тест написан некорректно (неверные ожидания, гонка состояний, копипаста без изменения параметров).\n   - **Баг в тестируемом коде** — тест написан верно, а код (Page Object, API-клиент) действительно ведёт себя не так, как ожидается.\n   - **Флейковость** — тест то падает, то проходит без изменений кода; чаще всего из-за недостаточного ожидания в UI или из-за общего состояния данных в API-тестах.\n4. **Исправь минимально необходимое.** Тикет \"почини тест X\" не означает \"перепиши файл с нуля\".\n5. **Прогони весь набор тестов**, не только починенный — исправление могло задеть соседние тесты, использующие тот же Page Object/клиент.\n\n## Пример: разбор флейкового UI-теста\n\nДопустим, тест из `boilerplate/tests/ui/test_registration.py` изредка падает на CI со скриншотом, где форма ещё не полностью прогрузилась. Частая причина — клик или проверка происходят до того, как элемент на самом деле стал интерактивным. В Playwright это почти всегда лечится не добавлением `time.sleep(...)` (антипаттерн — не решает причину и просто тратит время), а использованием встроенных ожиданий (`expect(...)`), которые уже применяются в `RegistrationPage.check_visible_registration_form()`. Если ожидание уже есть, но проблема сохраняется — стоит проверить, не выполняется ли действие с элементом, для которого явного ожидания видимости ещё не добавили.\n\n## Частые ошибки\n\n- Чинить симптом, а не причину: например, просто ослабить проверку (`assert response.status_code in [200, 404]` вместо разбора, почему код вдруг стал 404).\n- Добавлять `time.sleep()` как \"быстрое решение\" флейковости в UI-тестах — маскирует проблему, но не решает её и замедляет весь набор тестов.\n- Не читать существующие комментарии/docstring в коде перед правкой — иногда странное на первый взгляд решение уже было осознанным компромиссом.\n\n## Мини-задание\n\nВозьми любой существующий тест в общем репозитории и сознательно найди в нём одно потенциальное слабое место (жёстко захардкоженное тестовое значение, отсутствие проверки граничного случая, недостаточно узкий assert) — опиши это как тикет для одногруппника по формату из урока 7.1.\n", "hasPractice": true, "quiz": {"question": "Тест изредка падает на CI, но всегда проходит локально. Какое решение урок явно называет антипаттерном?", "options": ["Заменить недостаточное ожидание на expect() из Playwright", "Разобраться, какого именно элемента не хватает ожидания", "Добавить time.sleep() перед проблемным действием", "Прогнать тест несколько раз локально, чтобы попытаться воспроизвести падение"], "correct": 2, "explain": "time.sleep() маскирует симптом флейковости, но не устраняет причину, и просто замедляет весь набор тестов — урок прямо называет это антипаттерном."}}, {"id": "p94", "section": "Модуль 7 · Финальный спринт", "subgroup": null, "isOverview": false, "num": "7.3", "title": "Ревью PR друг друга", "content": "# 7.3. Ревью PR друг друга\n\n## Зачем это нужно\n\nВ модуле 2 ты уже открывал PR и получал ревью. Теперь — обратная роль: ты ревьюер. Умение читать чужой diff и задавать правильные вопросы — отдельный навык, который на реальной работе занимает значимую часть времени automation-инженера.\n\n## Теория\n\nЧто проверять в PR с автотестами (чек-лист):\n\n1. **Тест действительно проверяет то, что заявлено в названии/allure.title.** Частая проблема — название говорит одно, а assert проверяет совсем другое или не проверяет вообще ничего осмысленного.\n2. **Тест изолирован** — не зависит от порядка запуска других тестов, не оставляет после себя \"мусор\" (созданного пользователя, файл), который повлияет на следующий прогон.\n3. **Новый код следует существующим паттернам** — новый API-клиент наследуется от `APIClient`, как остальные; новый Page Object наследуется от `BasePage`, как остальные (см. модули 3–4).\n4. **Нет \"мёртвого\" кода** — закомментированные старые версии, неиспользуемые импорты, тестовые `print()` для отладки.\n5. **Allure-разметка на месте** (модуль 5) — title, минимум пара шагов.\n6. **CI зелёный** (модуль
