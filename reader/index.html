са и ответа есть Pydantic-схемы, тесты используют фикстуру `users_client` и проверяют не только счастливый путь, но и ошибки (404, невалидные данные).\n", "hasPractice": false}, {"id": "p47", "section": "Модуль 3 · API-тестирование", "subgroup": "Неделя 6", "isOverview": false, "num": "3.1", "title": "Что такое API и HTTP", "content": "# 3.1. Что такое API и HTTP\n\n## Зачем это нужно\n\nТестировщик, который тестирует только через UI, всегда на шаг медленнее и менее стабилен, чем тот, кто умеет проверять то же самое напрямую через API. Клик по кнопке в браузере в итоге превращается в один или несколько HTTP-запросов — и если ты понимаешь, что происходит на этом уровне, ты можешь проверить бизнес-логику быстрее, надёжнее и без танцев с локаторами.\n\n## Теория\n\n**API (Application Programming Interface)** — это набор правил, по которым одна программа может обращаться к другой за данными или функциональностью. Можно провести аналогию с меню в кафе: тебе не обязательно знать, как устроена кухня — достаточно знать, что можно заказать (доступные \"методы\") и что ты получишь в ответ.\n\nВ вебе самый распространённый вид API — **REST API поверх HTTP**. Именно с ним мы и будем работать весь модуль. Есть и другие подходы (SOAP, GraphQL, gRPC, WebSocket), но в большинстве коммерческих проектов на позиции QA automation тебе для начала хватит HTTP/REST.\n\n### Клиент-серверная модель\n\nВсё взаимодействие строится по схеме \"клиент — сервер\":\n\n- **Клиент** — тот, кто инициирует запрос (браузер, мобильное приложение, твой тест на `requests`).\n- **Сервер** — тот, кто принимает запрос, что-то с ним делает (читает из базы, считает, валидирует) и отправляет ответ.\n\nКлиент отправляет **запрос (request)**, сервер возвращает **ответ (response)**. Это применимо и когда ты открываешь сайт в браузере, и когда пишешь тест — разница только в том, кто выступает клиентом.\n\n### HTTP: протокол, на котором всё это работает\n\n**HTTP (HyperText Transfer Protocol)** — протокол прикладного уровня, по которому передаются запросы и ответы между клиентом и сервером. Две вещи, которые важно понимать про HTTP с самого начала:\n\n1. **HTTP без состояния (stateless).** Каждый запрос обрабатывается независимо от предыдущих — сервер не \"помнит\" тебя между запросами сам по себе. Именно поэтому существуют механизмы вроде токенов и cookie — они переносят \"память\" о состоянии на сторону клиента или в отдельное хранилище на сервере.\n2. **У запроса и ответа есть чёткая структура.** Запрос состоит из метода, URL, заголовков и (не всегда) тела. Ответ — из статус-кода, заголовков и тела. Про методы и статус-коды — в следующих двух уроках.\n\n### Как это выглядит \"на проводе\"\n\nУпрощённо HTTP-запрос выглядит так:\n\n```\nGET /users/123 HTTP/1.1\nHost: jsonplaceholder.typicode.com\nAccept: application/json\n```\n\nА ответ — так:\n\n```\nHTTP/1.1 200 OK\nContent-Type: application/json\n\n{\n  \"id\": 123,\n  \"name\": \"Leanne Graham\"\n}\n```\n\nКогда ты в тесте пишешь `requests.get(...)`, библиотека `requests` формирует именно такой запрос за тебя и парсит именно такой ответ — тебе не нужно писать эти строки руками. Но полезно понимать, что происходит \"под капотом\", когда что-то идёт не так (например, сервер вернул не тот `Content-Type`, а тест падает на `response.json()`).\n\n## Пример\n\nВ нашем общем репозитории (`boilerplate/`) API-тесты ходят на публичный демо-сервис [jsonplaceholder.typicode.com](https://jsonplaceholder.typicode.com). Это фейковый REST API: он ничего реально не сохраняет, но отвечает как настоящий сервер — с корректными статус-кодами и JSON-телом. Именно поэтому он удобен для учёбы: не нужно поднимать локальный сервер или получать доступ к боевому стенду.\n\n```bash\ncurl https://jsonplaceholder.typicode.com/users/1\n```\n\nОтвет придёт в формате JSON — том самом, который мы будем разбирать в тестах весь модуль.\n\n## Частые ошибки\n\n- Путать API вообще и REST API поверх HTTP — думать, что \"API\" обязательно значит \"HTTP-запрос\". API — понятие шире (например, методы класса в Python — тоже API), просто в контексте этого модуля мы всегда говорим про HTTP.\n- Считать, что раз HTTP stateless, то \"сессии\" и \"токены авторизации\" — что-то незначительное. Наоборот: именно из-за stateless-природы HTTP их изобрели, чтобы сервер вообще мог отличать один твой запрос от другого.\n- Игнорировать заголовки ответа и опираться только на тело. Например, `Content-Type` подсказывает, чего вообще ожидать в теле — JSON это, HTML или что-то ещё.\n\n## Мини-задание\n\nВыполни `curl -i https://jsonplaceholder.typicode.com/users/1` (флаг `-i` покажет заголовки ответа). Найди в выводе статус-строку, `Content-Type` и тело ответа. Определи, сколько полей верхнего уровня в JSON-объекте пользователя и есть ли среди них вложенные объекты.\n", "hasPractice": true, "quiz": {"question": "HTTP — протокол без сохранения состояния (stateless): сервер не помнит предыдущие запросы клиента сам по себе. Что из этого практически следует для тестировщика API?", "options": ["Между двумя запросами от одного клиента сервер обязательно должен использовать одно и то же TCP-соединение", "Сервер сам помнит предыдущие запросы клиента без каких-либо дополнительных данных", "Каждый запрос должен быть самодостаточным: если нужна авторизация, её нужно передавать в каждом запросе (или один раз настроить на уровне сессии)", "Stateless означает, что HTTP не поддерживает передачу JSON в теле запроса"], "correct": 2, "explain": "Именно из-за stateless-природы HTTP существуют токены и cookie — они переносят «память» о состоянии на сторону клиента или в отдельное хранилище, а не в сам протокол."}}, {"id": "p48", "section": "Модуль 3 · API-тестирование", "subgroup": "Неделя 6", "isOverview": false, "num": "3.2", "title": "HTTP-методы: GET, POST, PUT, PATCH, DELETE", "content": "# 3.2. HTTP-методы: GET, POST, PUT, PATCH, DELETE\n\n## Зачем это нужно\n\nВыбор метода — это не формальность, а часть контракта API. Тест, который дергает `POST` там, где по смыслу должен быть `PATCH`, либо не пройдёт, либо (что хуже) пройдёт, но будет проверять не то, что нужно. Умение по описанию эндпоинта понять, каким методом его вызывать, — база, без которой дальше двигаться некуда.\n\n## Теория\n\nHTTP-метод — это часть запроса, которая говорит серверу, **какое действие** клиент хочет выполнить над ресурсом. В REST-подходе есть негласное соглашение: одни и те же URL по-разному ведут себя в зависимости от метода. Например, `/users/5`:\n\n- `GET /users/5` — получить пользователя с id=5.\n- `PUT /users/5` — полностью заменить пользователя с id=5.\n- `PATCH /users/5` — частично обновить пользователя с id=5.\n- `DELETE /users/5` — удалить пользователя с id=5.\n\nРазберём методы, с которыми ты будешь работать чаще всего.\n\n### GET — получить данные\n\nИспользуется для чтения. По конвенции GET-запросы не должны изменять состояние на сервере — это называется **безопасный метод** (safe method). Тело запроса у GET, как правило, не используется — все параметры передаются в URL (path-параметры вроде `/users/5` или query-параметры вроде `/users?userId=1`).\n\n### POST — создать данные / выполнить действие\n\nЧаще всего используется для создания нового ресурса (например, регистрация пользователя) или для операций, которые не укладываются в \"чистый CRUD\" (например, `/login`). Данные передаются в теле запроса, обычно в формате JSON.\n\n### PUT — полностью заменить ресурс\n\nОжидается, что клиент присылает **все** поля ресурса — сервер полностью заменяет старую версию новой. Если ты пришлёшь только часть полей, по строгой семантике REST остальные должны быть сброшены или обнулены (на практике конкретные API иногда ведут себя мягче — это всегда нужно проверять по документации, а не угадывать).\n\n### PATCH — частично обновить ресурс\n\nВ отличие от PUT, PATCH ожидает только те поля, которые нужно изменить. Остальные поля ресурса остаются как были. Это самый частый метод для операций вида \"обнови email пользователя, не трогая остальное\".\n\n### DELETE — удалить ресурс\n\nУдаляет ресурс по идентификатору. Тело запроса обычно не нужно.\n\n### Идемпотентность — важное свойство\n\nМетод называется **идемпотентным**, если повторный вызов с теми же параметрами не меняет результат по сравнению с одним вызовом. `GET`, `PUT` и `DELETE` идемпотентны (удалить уже удалённый ресурс — то же самое, что удалить его один раз, с точки зрения конечного состояния). `POST` — нет: два одинаковых POST-запроса на создание пользователя обычно создадут двух разных пользователей. Это важно держать в голове при написании тестов: если тест несколько раз наступает на один и тот же POST, будь готов к дублям.\n\n## Пример\n\nОтправить эти запросы можно как через `curl`, так и через `requests` (с этой библиотекой подробно познакомимся в уроке 3.5):\n\n```bash\ncurl https://jsonplaceholder.typicode.com/users/1                     # GET\ncurl -X POST https://jsonplaceholder.typicode.com/users \\\n     -H \"Content-Type: application/json\" \\\n     -d '{\"name\": \"QA Student\"}'                                      # POST\ncurl -X PATCH https://jsonplaceholder.typicode.com/users/1 \\\n     -H \"Content-Type: application/json\" \\\n     -d '{\"name\": \"Updated Name\"}'                                    # PATCH\ncurl -X DELETE https://jsonplaceholder.typicode.com/users/1           # DELETE\n```\n\nОбрати внимание: JSONPlaceholder ничего реально не сохраняет — сервер просто отвечает так, как ответил бы настоящий REST API, но данные не персистятся между запросами. Это нормально для учебных целей: мы проверяем, что API **правильно отвечает** на запрос, а не ведём реальную базу данных.\n\n## Частые ошибки\n\n- Использовать POST везде, \"потому что он с телом запроса\" — даже для обновления или удаления. Метод должен соответствовать действию, а не быть выбран по удобству.\n- Путать PUT и PATCH и присылать в PUT только часть полей, ожидая, что остальные не изменятся, — это поведение PATCH, а не PUT.\n- Забывать, что тело GET-запроса — не стандартная практика, и пытаться передать через него JSON вместо query-параметров.\n- Не проверять в тестах именно то поведение, которое подразумевает метод (например, для DELETE — что ресурс действительно перестаёт быть доступен по GET после удаления).\n\n## Мини-задание\n\nОткрой документацию любого публичного API (например, [jsonplaceholder.typicode.com](https://jsonplaceholder.typicode.com/guide/)) и выпиши для ресурса `/posts` все доступные методы и что каждый из них должен делать. Отметь для себя, какие из них идемпотентны.\n", "hasPractice": true, "quiz": {"question": "Чем отличается PATCH от PUT при обновлении ресурса?", "options": ["PATCH используется только для чтения данных, а PUT — для их изменения", "PUT и PATCH — это два названия одного и того же метода, разницы нет", "PATCH нельзя использовать с телом запроса, а PUT — можно", "PATCH ожидает только изменяемые поля, а PUT — полную замену ресурса всеми полями"], "correct": 3, "explain": "PUT по семантике REST заменяет ресурс целиком, поэтому клиент должен прислать все поля. PATCH — частичное обновление: присылаются только те поля, которые нужно изменить."}}, {"id": "p49", "section": "Модуль 3 · API-тестирование", "subgroup": "Неделя 6", "isOverview": false, "num": "3.3", "title": "Коды состояния HTTP", "content": "# 3.3. Коды состояния HTTP\n\n## Зачем это нужно\n\nПервое, что проверяет почти любой API-тест, — это статус-код ответа. `assert response.status_code == 200` — самая частая строчка в этом модуле. Чтобы писать осмысленные проверки (а не копировать код отовсюду), нужно понимать, что означает каждая группа кодов и какие коды стоит ожидать в каких сценариях, включая \"несчастливые\" пути.\n\n## Теория\n\nСтатус-код — это трёхзначное число в начале ответа сервера, которое коротко сообщает результат обработки запроса. Коды делятся на пять групп по первой цифре.\n\n- **1xx — информационные.** На практике в API-тестах почти не встречаются, можно не запоминать подробно.\n- **2xx — успех.** Запрос обработан так, как ожидалось.\n  - `200 OK` — успешный запрос (обычно для GET, PUT, PATCH).\n  - `201 Created` — ресурс успешно создан (обычно для POST).\n  - `204 No Content` — запрос выполнен успешно, но в ответе нет тела (часто встречается после DELETE).\n- **3xx — редиректы.** Клиенту нужно сходить по другому адресу. В API-тестах встречается реже, чем в браузерных сценариях.\n- **4xx — ошибка на стороне клиента.** Запрос сформирован неправильно, или у клиента нет прав/данных.\n  - `400 Bad Request` — некорректный запрос (например, невалидный JSON или отсутствует обязательное поле).\n  - `401 Unauthorized` — не пройдена аутентификация (нет токена или он невалиден).\n  - `403 Forbidden` — аутентификация пройдена, но прав на это действие нет.\n  - `404 Not Found` — ресурс не найден (например, запросили пользователя с несуществующим id).\n  - `422 Unprocessable Entity` — запрос синтаксически корректен, но данные не проходят валидацию (например, email не в том формате).\n- **5xx — ошибка на стороне сервера.** Что-то сломалось на бэкенде, и это не вина клиента.\n  - `500 Internal Server Error` — необработанная ошибка сервера.\n  - `502`/`503` — сервер недоступен или перегружен.\n\n### Почему это важно для тестов, а не только \"для справки\"\n\nХороший API-тест никогда не проверяет только happy path (успешный сценарий). Не менее важны так называемые \"негативные\" тесты — когда мы намеренно провоцируем ошибку и проверяем, что сервер отвечает **правильным** кодом ошибки, а не, скажем, `500` там, где должен быть `404`. Если сервер на некорректный запрос возвращает `200 OK` с телом ошибки внутри — это тоже баг, и его тоже можно поймать проверкой статус-кода.\n\n## Пример\n\nВ нашем общем репозитории уже есть пример именно такой негативной проверки — тест на несуществующего пользователя, `boilerplate/tests/api/test_users.py`:\n\n```python\n@allure.title(\"Получение несуществующего пользователя возвращает 404\")\ndef test_get_user_not_found(self, users_client: UsersClient):\n    with allure.step(\"Запрашиваем заведомо несуществующего пользователя\"):\n        response = users_client.get_user_api(user_id=999)\n\n    with allure.step(\"Проверяем статус-код ответа\"):\n        assert response.status_code == 404\n```\n\nОбрати внимание: тест не проверяет тело ответа — только статус-код. Это осознанный выбор для базовой негативной проверки. Мы разберём этот тест целиком в уроке 3.12, когда познакомимся со всей структурой `UsersClient`.\n\n## Частые ошибки\n\n- Проверять в тесте только happy path и не писать ни одного теста на ошибочный сценарий (несуществующий id, невалидные данные, отсутствие авторизации).\n- Путать `401` и `403` — первое означает \"я не знаю, кто ты\", второе — \"я знаю, кто ты, но тебе сюда нельзя\".\n- Считать, что `200 OK` всегда значит \"всё хорошо\" — некоторые (плохо спроектированные) API возвращают `200` с телом вида `{\"error\": \"...\"}`. В таких случаях тест должен проверять и статус-код, и содержимое тела.\n- Не глядя писать `assert response.status_code == 200` для любого запроса — для POST, создающего ресурс, корректный код может быть `201`, а не `200`.\n\n## Мини-задание\n\nОтправь запрос на несуществующий ресурс `https://jsonplaceholder.typicode.com/users/9999` и посмотри на статус-код в ответе. Затем отправь `POST` на `https://jsonplaceholder.typicode.com/posts` с телом `{\"title\": \"test\"}` и сравни статус-код с тем, что ты получил на GET-запрос из урока 3.1. Объясни себе, почему коды разные.\n", "hasPractice": true, "quiz": {"question": "Чем принципиально отличается 401 Unauthorized от 403 Forbidden?", "options": ["401 означает, что сервер не смог опознать/аутентифицировать клиента, а 403 — что клиент опознан, но у него нет прав на это действие", "401 — это ошибка на стороне сервера, а 403 — ошибка на стороне клиента", "401 используется только для GET-запросов, а 403 — только для POST-запросов", "Разницы между 401 и 403 нет, коды взаимозаменяемы"], "correct": 0, "explain": "401 — это «я не знаю, кто ты» (не пройдена аутентификация), 403 — «я знаю, кто ты, но тебе сюда нельзя» (не хватает прав)."}}, {"id": "p50", "section": "Модуль 3 · API-тестирование", "subgroup": "Неделя 6", "isOverview": false, "num": "3.4", "title": "Заголовки и авторизация", "content": "# 3.4. Заголовки и авторизация\n\n## Зачем это нужно\n\nПочти любой API в коммерческом проекте закрыт авторизацией — открытые демо-эндпоинты вроде JSONPlaceholder скорее исключение, чем правило. Если ты не понимаешь, как работает передача токена через заголовки, ты не сможешь протестировать ни один реальный защищённый API.\n\n## Теория\n\n**Заголовки (headers)** — это метаданные запроса и ответа: пары \"ключ: значение\", которые не являются основным телом сообщения, но управляют тем, как это сообщение обрабатывать. Примеры:\n\n- `Content-Type` — какой формат данных в теле (`application/json`, `application/x-www-form-urlencoded` и т. д.).\n- `Accept` — какой формат ответа клиент готов принять.\n- `Authorization` — данные для аутентификации запроса.\n\n### Идентификация, аутентификация, авторизация — в чём разница\n\nЭти три термина часто путают:\n\n- **Идентификация** — \"кто ты?\" (например, ты вводишь email/логин).\n- **Аутентификация** — \"докажи, что ты это ты\" (например, вводишь пароль, или сервер проверяет твой токен).\n- **Авторизация** — \"что тебе можно?\" (даже успешно аутентифицированный пользователь может не иметь прав на конкретное действие — тогда сервер вернёт `403 Forbidden`).\n\n### Основные схемы передачи авторизации в HTTP\n\n**Basic Authentication.** Логин и пароль склеиваются через двоеточие и кодируются в Base64, результат кладётся в заголовок:\n\n```\nAuthorization: Basic dXNlcm5hbWU6cGFzc3dvcmQ=\n```\n\nBase64 — это не шифрование, а просто кодирование, поэтому Basic Auth имеет смысл только поверх HTTPS. Встречается редко — в основном во внутренних или простых системах.\n\n**Сессионная аутентификация (cookie-based).** После логина сервер создаёт сессию и отдаёт клиенту идентификатор сессии в cookie. Дальше браузер сам прикладывает эту cookie к каждому запросу. Классика для традиционных веб-приложений, менее характерна для API, с которыми мы работаем в этом курсе.\n\n**Токен-based (то, с чем ты будешь работать чаще всего).** После успешного логина сервер выдаёт токен (часто — [JWT](https://jwt.io/)), который клиент дальше передаёт в заголовке `Authorization` в каждом запросе:\n\n```\nAuthorization: Bearer <ACCESS_TOKEN>\n```\n\nСлово `Bearer` буквально означает \"предъявитель\" — сервер доверяет любому, кто предъявит этот токен, не требуя ничего дополнительного при каждом запросе. Именно поэтому токены нужно защищать так же, как пароли: если токен утечёт, им может воспользоваться кто угодно до истечения срока его действия.\n\nЕсть и вариант **API Key** — статичный ключ, который выдаётся один раз и передаётся так же через заголовок (`Authorization: ApiKey <KEY>` или собственный заголовок вроде `X-API-Key`). В отличие от JWT, у API-ключа обычно нет встроенного срока действия — это одновременно и удобство, и риск.\n\n### Почему это важно для архитектуры клиента\n\nЗабегая вперёд (подробно разберём в модуле недели 7): если API требует авторизации, разумно не передавать заголовок `Authorization` вручную в каждом запросе, а настроить его один раз — на уровне HTTP-сессии. Тогда все запросы через эту сессию будут автоматически \"подписаны\" токеном. Именно так устроен `requests.Session` — и именно поэтому наш общий репозиторий строит API-клиенты поверх сессии, а не поверх одиночных вызовов `requests.get(...)`.\n\n## Пример\n\nПередать заголовок с токеном через `requests` можно так:\n\n```python\nimport requests\n\nheaders = {\"Authorization\": \"Bearer my_secret_token\"}\nresponse = requests.get(\"https://httpbin.org/get\", headers=headers)\n\nprint(response.json())  # заголовки будут видны в теле ответа — httpbin их просто отражает\n```\n\nJSONPlaceholder, на котором построены тесты в `boilerplate/`, авторизации не требует — это осознанный выбор для учебного проекта: студент должен сосредоточиться на структуре клиента и Pydantic-схемах, а не тратить время на получение тестового токена. Но `APIClient`, который мы разберём в модуле недели 7, спроектирован так, что добавить заголовок `Authorization` для авторизованного API — это одна строчка в месте создания сессии, а не правки во всех методах клиента.\n\n## Частые ошибки\n\n- Путать аутентификацию и авторизацию — считать, что раз запрос прошёл `401`, то дальше точно можно всё (может прийти `403` на конкретное действие).\n- Хардкодить токен в тексте теста вместо того, чтобы получать его через логин-эндпоинт или переменные окружения — тестовые токены имеют свойство протухать, а хардкод в репозитории — это ещё и риск утечки в реальных проектах.\n- Забывать заголовок `Content-Type: application/json` при отправке JSON вручную (через `curl` или низкоуровневые библиотеки) — без него сервер может не суметь разобрать тело запроса. `requests` при использовании параметра `json=` в `post/put/patch` подставляет этот заголовок сам.\n- Путать `Bearer <token>` и просто `<token>` — без префикса `Bearer` многие серверы не распознают заголовок.\n\n## Мини-задание\n\nВыполни `requests.get(\"https://httpbin.org/headers\", headers={\"Authorization\": \"Bearer test123\"})` (можно и через `curl -H`) и посмотри на тело ответа: `httpbin.org` отражает обратно все заголовки, которые ты отправил. Убедись, что твой заголовок `Authorization` дошёл до сервера именно в том виде, в котором ты его отправил.\n", "hasPractice": true, "quiz": {"question": "Как токен передаётся серверу в схеме Bearer-авторизации?", "options": ["В теле каждого GET-запроса в виде JSON-поля token", "В заголовке Authorization в виде Bearer <ACCESS_TOKEN>", "В URL как query-параметр ?token=...", "В заголовке Content-Type вместе с типом данных"], "correct": 1, "explain": "Токен передаётся в заголовке Authorization с префиксом Bearer — сервер доверяет любому, кто предъявит этот токен, поэтому его нужно защищать так же, как пароль."}}, {"id": "p51", "section": "Модуль 3 · API-тестирование", "subgroup": "Неделя 6", "isOverview": false, "num": "3.5", "title": "Библиотека requests: первые запросы", "content": "# 3.5. Библиотека requests: первые запросы\n\n## Зачем это нужно\n\n`requests` — стандартная библиотека Python для HTTP-запросов, на которой построен весь API-слой нашего общего репозитория. Прежде чем разбирать готовый `APIClient` (модуль недели 7), нужно уверенно понимать, что делает сама библиотека без всяких обёрток — иначе абстракции сверху будут выглядеть как магия.\n\n## Теория\n\n`requests` устанавливается через `pip install requests` (в `boilerplate/requirements.txt` она уже зафиксирована) и предоставляет функции по каждому HTTP-методу: `requests.get()`, `requests.post()`, `requests.put()`, `requests.patch()`, `requests.delete()`.\n\n### Базовый запрос и объект Response\n\n```python\nimport requests\n\nresponse = requests.get(\"https://jsonplaceholder.typicode.com/users/1\")\n```\n\nРезультат вызова — объект `Response`. У него есть несколько ключевых атрибутов и методов, которые ты будешь использовать в каждом тесте:\n\n- `response.status_code` — числовой статус-код ответа (`int`), например `200`.\n- `response.json()` — парсит тело ответа как JSON и возвращает Python-объект (обычно `dict` или `list`). Бросит исключение, если тело не является валидным JSON.\n- `response.text` — тело ответа как есть, в виде строки, без парсинга.\n- `response.headers` — заголовки ответа (похоже на словарь).\n\n### Query-параметры\n\nПередаются через именованный аргумент `params` — `requests` сам соберёт из словаря строку запроса:\n\n```python\nresponse = requests.get(\n    \"https://jsonplaceholder.typicode.com/comments\",\n    params={\"postId\": 1},\n)\nprint(response.url)  # https://jsonplaceholder.typicode.com/comments?postId=1\n```\n\n### Тело запроса (JSON)\n\nДля методов, поддерживающих тело (`POST`, `PUT`, `PATCH`), данные передаются через `json=` — `requests` сам сериализует словарь в JSON-строку и выставит заголовок `Content-Type: application/json`:\n\n```python\nresponse = requests.post(\n    \"https://jsonplaceholder.typicode.com/users\",\n    json={\"name\": \"QA Student\", \"username\": \"qa_student\"},\n)\nprint(response.status_code)  # 201\nprint(response.json())       # созданный (не сохранённый по-настоящему) объект с id\n```\n\nЕсли нужно отправить данные в формате `application/x-www-form-urlencoded` (это встречается реже, но иногда требуется, например, для некоторых форм логина), используется аргумент `data=` вместо `json=`.\n\n### Заголовки и таймаут\n\n```python\nresponse = requests.get(\n    \"https://jsonplaceholder.typicode.com/users/1\",\n    headers={\"Authorization\": \"Bearer <token>\"},\n    timeout=10,\n)\n```\n\n`timeout` — не мелочь ради галочки. Без него тест может зависнуть на неопределённое время, если сервер не отвечает. Хорошая практика — всегда задавать таймаут явно.\n\n### requests.get(...) в каждом тесте — рабочий, но не масштабируемый вариант\n\nНа этом этапе у тебя уже достаточно знаний, чтобы написать первый настоящий API-тест:\n\n```python\nimport requests\n\n\ndef test_get_user():\n    response = requests.get(\"https://jsonplaceholder.typicode.com/users/1\")\n\n    assert response.status_code == 200\n    assert response.json()[\"id\"] == 1\n```\n\nЭто рабочий тест. Но если таких тестов станет двадцать, а базовый URL API вдруг изменится (например, добавится версия `/api/v2/...`) — тебе придётся редактировать URL в каждом тесте. Это и есть повод для следующего урока: как убрать повторяющиеся детали (`base_url`, заголовки, таймаут) в одно место.\n\n## Пример\n\nПолный пример работы с `requests`, включающий GET, POST и обработку ошибки:\n\n```python\nimport requests\n\n# Успешный GET\nresponse = requests.get(\"https://jsonplaceholder.typicode.com/users/1\")\nprint(response.status_code, response.json())\n\n# POST с телом\nresponse = requests.post(\n    \"https://jsonplaceholder.typicode.com/users\",\n    json={\"name\": \"QA Student\", \"username\": \"qa_student\", \"email\": \"qa@example.com\"},\n)\nprint(response.status_code, response.json())\n\n# Запрос к несуществующему ресурсу\nresponse = requests.get(\"https://jsonplaceholder.typicode.com/users/9999\")\nprint(response.status_code)  # 404\n```\n\n## Частые ошибки\n\n- Забыть таймаут и получить тест, который зависает на минуты при проблемах с сетью.\n- Вызвать `response.json()` на ответе, у которого тело — не JSON (например, HTML-страница ошибки 502 от прокси-сервера) — упадёт с исключением, а не даст полезное сообщение \"нет JSON\".\n- Перепутать `params` и `json` — например, попытаться передать тело GET-запроса через `json=` (у большинства серверов GET с телом либо игнорируется, либо приводит к ошибке).\n- Не проверять `response.status_code` перед тем, как парсить `response.json()` — если сервер вернул ошибку с пустым телом, `.json()` упадёт раньше, чем ты увидишь осмысленное сообщение об ошибке.\n\n## Мини-задание\n\nНапиши три отдельных вызова `requests` без обёрток: GET на `/users/1`, POST на `/posts` с телом `{\"title\": \"test\", \"body\": \"text\", \"userId\": 1}`, DELETE на `/posts/1`. Для каждого вывода в консоль и `response.status_code`, и `response.json()`. Убедись, что коды ответа соответствуют тому, что ты изучил в уроках 3.2–3.3.\n", "hasPractice": true, "quiz": {"question": "Как правильно передать тело JSON-запроса в POST-запросе через requests, чтобы библиотека сама сериализовала словарь и выставила заголовок Content-Type?", "options": ["requests.post(url, params=data)", "requests.post(url, body=data)", "requests.post(url, json=data)", "requests.post(url, text=data)"], "correct": 2, "explain": "Аргумент json= сериализует словарь в JSON-строку и сам подставляет заголовок Content-Type: application/json. params используется для query-параметров, а body/text не являются аргументами requests."}}, {"id": "p52", "section": "Модуль 3 · API-тестирование", "subgroup": "Неделя 6", "isOverview": false, "num": "3.6", "title": "От requests.get() в тесте — к API-клиенту", "content": "# 3.6. От requests.get() в тесте — к API-клиенту\n\n## Зачем это нужно\n\nЭто последний урок недели, и он — мост к недели 7, где ты начнёшь построчно разбирать готовый `APIClient` из общего репозитория. Прежде чем читать чужой код, полезно самому прочувствовать проблему, которую этот код решает: почему в реальных проектах никто не пишет `requests.get(...)` напрямую в теле теста.\n\n## Теория\n\nВозьмём тесты из прошлого урока и представим, что их не три, а тридцать. Что в них будет повторяться раз за разом?\n\n1. **Базовый URL.** `https://jsonplaceholder.typicode.com` — в каждом тесте, к каждому эндпоинту.\n2. **Заголовки.** Если API требует авторизации — `Authorization: Bearer ...` нужно передавать в каждый запрос.\n3. **Таймаут.** Если ты один раз решил, что таймаут должен быть 10 секунд — нужно не забыть повторить это в каждом вызове.\n4. **Путь до ресурса.** Если у тебя есть логика \"получить пользователя по id\" — она размазана по всем тестам, которые дергают `/users/{id}`, вместо того чтобы жить в одном месте.\n\nЕсли формат ответа API или базовый URL изменится, тебе придётся находить и чинить это в каждом тесте отдельно. Это и называется **дублированием**, и оно — главный враг поддерживаемости тестов.\n\n### Идея API-клиента\n\n**API-клиент** — это класс (или набор классов), который берёт на себя всю \"механику\" общения с конкретным API: базовый URL, заголовки, таймаут, формирование пути к ресурсу — и предоставляет тестам простые, понятные методы вроде `get_user(user_id)` вместо голого `requests.get(f\"{BASE_URL}/users/{user_id}\", headers=..., timeout=...)`.\n\nТест при этом становится короче и, что важнее, **читается как описание бизнес-логики**, а не как рецепт похода в сеть:\n\n```python\n# Было (requests напрямую)\nresponse = requests.get(\n    f\"{BASE_URL}/users/{user_id}\",\n    headers={\"Authorization\": f\"Bearer {token}\"},\n    timeout=10,\n)\n\n# Стало (через клиент)\nresponse = users_client.get_user_api(user_id)\n```\n\n### requests.Session — первый шаг к клиенту\n\nПрежде чем переходить к полноценному клиенту, важно познакомиться с `requests.Session`. Это объект, который хранит настройки (заголовки, cookie) между несколькими запросами и переиспользует TCP-соединение — то есть решает как минимум проблему \"заголовки в каждом запросе\":\n\n```python\nimport requests\n\nsession = requests.Session()\nsession.headers.update({\"Authorization\": \"Bearer my_token\"})\n\nresponse = session.get(\"https://jsonplaceholder.typicode.com/users/1\")\nprint(response.json())\n```\n\nВсё, что попадёт в `session.headers`, будет автоматически подставляться в каждый запрос через эту сессию — заголовок больше не нужно передавать вручную каждый раз.\n\nНо у `requests.Session` нет из коробки понятия `base_url` (в отличие от, например, библиотеки `httpx`, где `httpx.Client(base_url=...)` — встроенная возможность). Поэтому в следующем уроке модуля (уже в рамках недели 7) мы разберём небольшой класс `BaseUrlSession` из `boilerplate/clients/api_client.py`, который добавляет это поведение поверх `requests.Session`, и класс `APIClient`, который строится уже поверх неё.\n\n## Пример\n\nНабросок (пока учебный, не финальный код репозитория) того, к чему мы идём:\n\n```python\nimport requests\n\n\nclass APIClient:\n    def __init__(self, session: requests.Session):\n        self.session = session\n\n    def get(self, url: str, params: dict | None = None) -> requests.Response:\n        return self.session.get(url, params=params)\n\n    def post(self, url: str, json: dict | None = None) -> requests.Response:\n        return self.session.post(url, json=json)\n\n\nclass UsersClient(APIClient):\n    def get_user_api(self, user_id: int) -> requests.Response:\n        return self.get(f\"/users/{user_id}\")\n\n\nsession = requests.Session()\nsession.headers.update({\"Authorization\": \"Bearer my_token\"})\n\nusers_client = UsersClient(session=session)\nresponse = users_client.get_user_api(user_id=1)\n```\n\nЭто уже очень близко к реальной структуре `boilerplate/clients/`. В следующем уроке мы посмотрим на настоящий код — со всеми деталями, которых здесь не хватает (`base_url`, таймаут по умолчанию, полный набор HTTP-методов).\n\n## Частые ошибки\n\n- Пытаться сразу спроектировать \"идеальный\" клиент со всеми возможными фичами вместо того, чтобы начать с простого базового класса и наращивать функциональность по мере необходимости — именно так был построен `APIClient` в общем репозитории.\n- Смешивать транспортный уровень (HTTP-запросы) и уровень схем данных (Pydantic) в одном классе — про правильное разделение поговорим в модуле недели 7.\n- Считать, что раз в проекте уже есть `APIClient`, велосипед изобретать не нужно — но при этом всё равно писать в тестах `requests.get(...)` напрямую \"потому что так быстрее\". Именно ради того, чтобы так не делать, клиент и существует.\n\n## Мини-задание\n\nВозьми три теста, которые ты написал в мини-задании урока 3.5 (голый `requests`). Перепиши их вручную так, чтобы весь код похода в сеть (базовый URL, заголовки) был вынесен в отдельную переменную/функцию, а сам тест обращался к ней, а не к `requests` напрямую. Это не обязано быть полноценным классом — цель упражнения в том, чтобы почувствовать, где именно проходит граница между \"тестовой логикой\" и \"механикой HTTP\".\n", "hasPractice": true, "quiz": {"question": "Что даёт requests.Session по сравнению с отдельными вызовами requests.get()/post() в разных тестах?", "options": ["Session автоматически добавляет base_url ко всем относительным путям «из коробки»", "Session хранит настройки (например, заголовки) и переиспользует их между несколькими запросами, не заставляя дублировать их в каждом вызове", "Session заменяет собой Pydantic-валидацию ответов", "Session умеет самостоятельно генерировать HTTP-методы, которых нет в самой библиотеке requests"], "correct": 1, "explain": "requests.Session хранит заголовки и переиспользует соединение между запросами. Base_url «из коробки» у неё нет — именно поэтому в общем репозитории для этого написан отдельный класс BaseUrlSession."}}, {"id": "p53", "section": "Модуль 3 · API-тестирование", "subgroup": "Неделя 7", "isOverview": false, "num": "3.7", "title": "Базовый API-клиент: BaseUrlSession и APIClient", "content": "# 3.7. Базовый API-клиент: BaseUrlSession и APIClient\n\n## Зачем это нужно\n\nС этого урока начинается главное отличие модуля 3 от предыдущих: ты больше не пишешь код \"в вакууме\". Ты открываешь уже существующий файл в общем репозитории и построчно разбираешь, как он устроен, — потому что именно на нём тебе предстоит строить домашнее задание. Не разобравшись в этом файле, дальше двигаться некуда: все специализированные клиенты (`UsersClient` и те, что добавишь ты) наследуются именно от него.\n\n## Теория\n\nОткрой файл `boilerplate/clients/api_client.py` — он небольшой, разберём его целиком.\n\n### Проблема: у requests.Session нет base_url\n\nВ уроке 3.6 мы остановились на том, что `requests.Session` умеет хранить общие заголовки, но не умеет хранить базовый URL — в отличие от `httpx.Client(base_url=...)` из библиотеки, на которой изначально построен курс-источник. Наш курс использует `requests`, а не `httpx`, поэтому в репозитории уже написано небольшое решение для этой конкретной проблемы — класс `BaseUrlSession`.\n\n### Разбор BaseUrlSession\n\n```python\nclass BaseUrlSession(Session):\n    def __init__(self, base_url: str):\n        super().__init__()\n        self.base_url = base_url.rstrip(\"/\")\n\n    def request(self, method: str, url: str | bytes, *args: Any, **kwargs: Any) -> Response:\n        full_url = f\"{self.base_url}/{str(url).lstrip('/')}\"\n        return super().request(method, full_url, *args, **kwargs)\n```\n\nРазбираем построчно:\n\n- Класс **наследуется от `requests.Session`** — то есть `BaseUrlSession` это и есть сессия `requests`, просто с добавленным поведением, а не что-то отдельное.\n- `__init__` принимает `base_url`, вызывает конструктор родителя (`super().__init__()`, чтобы сессия проинициализировалась как обычно), а затем сохраняет URL, убрав завершающий слэш (`rstrip(\"/\")`) — это защита от двойного слэша при склейке (`https://example.com/` + `/users` не должно превращаться в `.../ /users`).\n- Метод `request` — это тот самый метод, который `requests.Session` вызывает внутри себя при **любом** обращении: `session.get(...)` под капотом всё равно приходит к `session.request(\"GET\", ...)`, то же самое для `post`, `put`, `patch`, `delete`. Переопределив именно `request`, мы гарантируем, что подстановка `base_url` сработает **для всех** методов сразу, а не только для, скажем, `get`.\n- Внутри `request` мы склеиваем `base_url` и переданный `url`, обрезая лишние слэши с обеих сторон (`str(url).lstrip('/')` — убираем слэш в начале пути, если он там есть), и вызываем оригинальную реализацию через `super().request(...)`, подставляя уже полный URL.\n\nИтог: `BaseUrlSession(\"https://jsonplaceholder.typicode.com\")` ведёт себя как обычная `requests.Session`, но её методы (`.get(\"/users\")`, `.post(\"/users\", json=...)` и т. д.) принимают **относительные** пути, а не полные URL.\n\n### Разбор APIClient\n\n```python\nclass APIClient:\n    def __init__(self, session: Session):\n        self.session = session\n\n    def get(self, url: str, params: dict | None = None) -> Response:\n        return self.session.get(url, params=params)\n\n    def post(self, url, json=None, data=None, files=None) -> Response:\n        return self.session.post(url, json=json, data=data, files=files)\n\n    def put(self, url: str, json: Any | None = None) -> Response:\n        return self.session.put(url, json=json)\n\n    def patch(self, url: str, json: Any | None = None) -> Response:\n        return self.session.patch(url, json=json)\n\n    def delete(self, url: str) -> Response:\n        return self.session.delete(url)\n```\n\n`APIClient` — это базовый класс, от которого будут наследоваться **все** специализированные клиенты проекта (`UsersClient` и любые другие, которые появятся позже). Он не знает ничего про конкретный API или конкретные эндпоинты — он просто задаёт единый интерфейс поверх `requests.Session`: `get`, `post`, `put`, `patch`, `delete`. Обрати внимание, что каждый метод — это тонкая обёртка вокруг одноимённого метода сессии, ничего лишнего.\n\nЗачем нужен этот промежуточный слой, если можно вызывать `self.session.get(...)` напрямую? Дело в том, что именно на этом уровне в будущем удобно добавлять сквозную функциональность — например, логирование каждого запроса, единую обработку ошибок или ретраи. Если это добавить в `APIClient.get`, оно автоматически заработает во всех клиентах, которые от него наследуются, — не придётся править каждый специализированный клиент по отдельности.\n\n### build_http_session — фабрика готовой сессии\n\n```python\ndef build_http_session(base_url: str, timeout: int = 10) -> Session:\n    session = BaseUrlSession(base_url=base_url)\n    session.request = _with_default_timeout(session.request, timeout)\n    return session\n```\n\nЭта функция собирает сессию, готовую к использованию: подставляет `base_url` через `BaseUrlSession` и оборачивает метод `request` так, чтобы у всех запросов был таймаут по умолчанию (10 секунд), даже если вызывающий код не укажет его явно:\n\n```python\ndef _with_default_timeout(request_func, timeout: int):\n    def wrapper(method: str, url: str, *args: Any, **kwargs: Any) -> Response:\n        kwargs.setdefault(\"timeout\", timeout)\n        return request_func(method, url, *args, **kwargs)\n\n    return wrapper\n```\n\n`kwargs.setdefault(\"timeout\", timeout)` — ключевой момент: если вызывающий код **уже** передал свой `timeout`, значение не перезаписывается; таймаут по умолчанию подставляется только тогда, когда его никто не указал.\n\n## Пример\n\nЧтобы получить рабочий клиент \"с нуля\", в терминале (например, в `python -i` или в отдельном скрипте) можно сделать так:\n\n```python\nfrom clients.api_client import APIClient, build_http_session\n\nsession = build_http_session(base_url=\"https://jsonplaceholder.typicode.com\")\nclient = APIClient(session=session)\n\nresponse = client.get(\"/users/1\")\nprint(response.status_code, response.json())\n```\n\nОбрати внимание: мы передали относительный путь `\"/users/1\"`, а не полный URL — именно это и обеспечивает `BaseUrlSession`.\n\n## Частые ошибки\n\n- Пытаться переопределить `get`/`post`/... вместо `request` при попытке добавить сквозную логику в `BaseUrlSession` — тогда логика сработает не для всех методов, а только для переопределённых.\n- Забывать про `rstrip`/`lstrip` при самостоятельной реализации похожего класса и получать URL вида `https://example.com//users` (двойной слэш) — большинство серверов такое не примут как ожидаемый путь.\n- Путать уровень `APIClient` (общие HTTP-методы) и уровень специализированных клиентов вроде `UsersClient` (конкретные эндпоинты) — специфичного для `/users` в `api_client.py` быть не должно.\n\n## Мини-задание\n\nВ интерактивной консоли Python (или отдельном скрипте) создай `APIClient` через `build_http_session` с `base_url=\"https://jsonplaceholder.typicode.com\"`. Вызови `client.get(\"/users\")`, `client.get(\"/users/1\")` и `client.post(\"/posts\", json={\"title\": \"x\"})`. Убедись, что во всех случаях путь подставляется относительный, а полный URL собирается автоматически.\n", "hasPractice": true, "quiz": {"question": "Почему BaseUrlSession в общем репозитории переопределяет именно метод request(), а не отдельно get(), post() и т.д.?", "options": ["Потому что requests.Session не позволяет переопределять метод get() вообще", "Потому что метод request() — единственный метод, который умеет работать с JSON", "Потому что requests.Session вызывает request() внутри любого метода (get/post/put/...), и переопределение request() гарантирует подстановку base_url для всех методов сразу", "Потому что переопределение request() ускоряет выполнение HTTP-запросов"], "correct": 2, "explain": "session.get(...), session.post(...) и остальные методы внутри себя вызывают session.request(...). Переопределив только request(), мы получаем подстановку base_url сразу для всех HTTP-методов."}}, {"id": "p54", "section": "Модуль 3 · API-тестирование", "subgroup": "Неделя 7", "isOverview": false, "num": "3.8", "title": "UsersClient и фикстура users_client", "content": "# 3.8. UsersClient и фикстура users_client\n\n## Зачем это нужно\n\n`APIClient` из прошлого урока ничего не знает про `/users` — и это правильно, он универсальный. Конкретную логику под конкретный ресурс добавляют специализированные клиенты. `UsersClient` — первый такой клиент в репозитории, и он же — прямой образец для твоего домашнего задания: новые методы ты будешь добавлять именно в него, по тому же паттерну.\n\n## Теория\n\nОткрой `boilerplate/clients/users/users_client.py`:\n\n```python\nfrom requests import Response\n\nfrom clients.api_client import APIClient, build_http_session\nfrom clients.users.users_schema import (\n    CreateUserRequestSchema,\n    CreateUserResponseSchema,\n    UserSchema,\n)\n\nBASE_URL = \"https://jsonplaceholder.typicode.com\"\n\n\nclass UsersClient(APIClient):\n    def get_users_api(self) -> Response:\n        return self.get(\"/users\")\n\n    def get_user_api(self, user_id: int) -> Response:\n        return self.get(f\"/users/{user_id}\")\n\n    def create_user_api(self, request: CreateUserRequestSchema) -> Response:\n        return self.post(\"/users\", json=request.model_dump())\n\n    def delete_user_api(self, user_id: int) -> Response:\n        return self.delete(f\"/users/{user_id}\")\n\n    def get_user(self, user_id: int) -> UserSchema:\n        response = self.get_user_api(user_id)\n        return UserSchema.model_validate_json(response.text)\n\n    def create_user(self, request: CreateUserRequestSchema) -> CreateUserResponseSchema:\n        response = self.create_user_api(request)\n        return CreateUserResponseSchema.model_validate_json(response.text)\n\n\ndef get_users_client() -> UsersClient:\n    return UsersClient(session=build_http_session(base_url=BASE_URL))\n```\n\n### Наследование от APIClient\n\n`class UsersClient(APIClient):` — `UsersClient` получает все методы `get/post/put/patch/delete` бесплатно, просто по факту наследования. Ему остаётся только описать, **какие именно** запросы имеют смысл для ресурса `/users`, и под какими именами их удобно вызывать из тестов.\n\n### Два уровня методов: `_api` и обычные\n\nОбрати внимание на закономерность в названиях:\n\n- `get_users_api`, `get_user_api`, `create_user_api`, `delete_user_api` — методы с суффиксом `_api`. Они возвращают **сырой** `requests.Response`, ничего не валидируя и не преобразуя. Это низкоуровневый слой — нужен, например, когда в тесте важно проверить именно статус-код или сырое тело ответа (в том числе для негативных сценариев, где сервер возвращает не то, что ожидалось).\n- `get_user`, `create_user` — методы **без** суффикса `_api`. Они вызывают соответствующий `_api`-метод и сразу возвращают уже провалидированный Pydantic-объект (`UserSchema`, `CreateUserResponseSchema`) вместо сырого `Response`. Это высокоуровневый слой — удобен, когда тест хочет сразу работать с типизированными полями (`user.email`, `user.id`), а не лезть в `response.json()[\"email\"]`.\n\nТакое разделение — не случайность и не лишняя сложность: оно даёт тесту выбор. Если тест проверяет happy path и хочет удобный доступ к полям — он берёт `get_user()`. Если тест целенаправленно проверяет ошибку (несуществующий пользователь, `404`) — валидировать тело ответа Pydantic-схемой бессмысленно (там и не будет корректного пользователя), поэтому тест берёт `get_user_api()` и проверяет только `response.status_code`.\n\n### get_users_client — фабрика клиента\n\n```python\ndef get_users_client() -> UsersClient:\n    return UsersClient(session=build_http_session(base_url=BASE_URL))\n```\n\nЭто обычная функция (не метод класса), которая скрывает детали сборки: откуда взять `base_url`, как собрать сессию (`build_http_session` из урока 3.7). Тестам и фикстурам не нужно знать эти детали — они просто вызывают `get_users_client()` и получают готовый к работе объект.\n\n### Фикстура users_client в conftest.py\n\nВ `boilerplate/conftest.py` есть:\n\n```python\n@pytest.fixture(scope=\"session\")\ndef users_client() -> UsersClient:\n    return get_users_client()\n```\n\n`scope=\"session\"` означает, что клиент создаётся **один раз** за весь прогон тестов, а не заново для каждого теста — так как `UsersClient` не хранит состояние конкретного теста (никаких \"текущих данных пользователя\" внутри клиента нет), пересоздавать его каждый раз бессмысленно и просто тратит время.\n\nЛюбой тест, которому нужен доступ к API `/users`, просто объявляет параметр `users_client: UsersClient` в сигнатуре теста — pytest сам подставит туда готовый объект благодаря механизму фикстур (это ты уже проходил в модуле 1).\n\n## Пример\n\nИспользование клиента в тесте выглядит так (полный разбор `test_users.py` будет в уроке 3.12):\n\n```python\ndef test_get_user(users_client: UsersClient):\n    user = users_client.get_user(user_id=1)\n    assert user.id == 1\n```\n\nА вот негативный сценарий, где нужен именно `_api`-метод:\n\n```python\ndef test_get_user_not_found(users_client: UsersClient):\n    response = users_client.get_user_api(user_id=999)\n    assert response.status_code == 404\n```\n\n## Частые ошибки\n\n- Добавлять в `UsersClient` метод, который не относится к `/users` (например, работу с постами) — специализированный клиент должен отвечать только за свой ресурс. Для другого ресурса — новый клиент рядом, по тому же паттерну.\n- Реализовывать только высокоуровневый метод (`get_user`) без низкоуровневого (`get_user_api`) — тогда написать негативный тест на ошибку станет неудобно или невозможно, ведь Pydantic-валидация ответа с ошибкой просто упадёт с исключением вместо понятного `assert`.\n- Создавать `UsersClient` вручную в каждом тесте вместо использования фикстуры `users_client` — дублирование той же природы, что и с голым `requests.get(...)` в модуле недели 6.\n\n## Мини-задание\n\nБез изменения файлов репозитория, в отдельном скрипте импортируй `get_users_client`, вызови `get_users_api()` и распечатай `response.status_code` и длину списка `response.json()`. Затем вызови `get_user(user_id=1)` и распечатай `user.email` — обрати внимание, что это уже не словарь, а объект с атрибутами.\n", "hasPractice": true, "quiz": {"question": "В UsersClient есть get_user_api() (возвращает сырой Response) и get_user() (возвращает провалидированный UserSchema). В каком тесте уместнее использовать именно get_user_api()?", "options": ["В любом тесте — разницы между методами нет", "В негативном тесте, где ожидается ошибка (например, 404) и тело ответа не соответствует UserSchema", "Только когда нужно ускорить выполнение теста", "В тесте, где нужно получить данные пользователя в виде Pydantic-объекта с валидацией полей"], "correct": 1, "explain": "get_user() сразу валидирует ответ через Pydantic-схему и упадёт с ошибкой валидации, если тело не соответствует UserSchema — это мешает негативным тестам. Для них нужен сырой Response из get_user_api()."}}, {"id": "p55", "section": "Модуль 3 · API-тестирование", "subgroup": "Неделя 7", "isOverview": false, "num": "3.9", "title": "Знакомство с Pydantic: BaseModel и валидация", "content": "# 3.9. Знакомство с Pydantic: BaseModel и валидация\n\n## Зачем это нужно\n\nВ прошлом уроке ты видел `UserSchema`, `CreateUserRequestSchema` — но пока как чёрный ящик. Пора понять, что это такое и почему в API-тестировании принято описывать структуру запросов и ответов именно через Pydantic, а не работать напрямую со словарями из `response.json()`.\n\n## Теория\n\n**Pydantic** — библиотека для описания структур данных и их автоматической валидации на основе аннотаций типов Python. В `boilerplate/requirements.txt` уже зафиксирована версия `pydantic==2.9.2`.\n\n### Базовая модель\n\n```python\nfrom pydantic import BaseModel\n\n\nclass User(BaseModel):\n    id: int\n    name: str\n    email: str\n\n\nuser = User(id=1, name=\"Alice\", email=\"alice@example.com\")\nprint(user.id)  # 1 — обращение через атрибут, а не user[\"id\"]\n```\n\n`BaseModel` — базовый класс, от которого наследуются все модели Pydantic. При создании объекта Pydantic **проверяет** типы каждого поля. Если типы не совпадают и не могут быть безопасно приведены — будет выброшено исключение `ValidationError`:\n\n```python\nUser(id=\"not_a_number\", name=\"Alice\", email=\"alice@example.com\")\n# pydantic_core._pydantic_core.ValidationError: 1 validation error for User\n# id: Input should be a valid integer, unable to parse string as an integer\n```\n\nОбрати внимание на слово \"приведены\": Pydantic по умолчанию делает разумные автоматические преобразования. Если передать `id=\"123\"` (строку), Pydantic превратит её в `int(123)`, потому что строка однозначно представляет число. А вот `\"not_a_number\"` преобразовать некуда — отсюда ошибка.\n\n### Обязательные и опциональные поля\n\nПоле без значения по умолчанию — обязательное:\n\n```python\nclass User(BaseModel):\n    id: int\n    name: str\n    is_active: bool = True  # опциональное поле со значением по умолчанию\n```\n\nЕсли `is_active` не передать при создании объекта, оно возьмёт `True`. А вот если не передать `id` или `name` — Pydantic бросит ошибку валидации, потому что у этих полей нет значения по умолчанию.\n\nДля полей, которые могут отсутствовать и не иметь никакого разумного значения по умолчанию, используется `| None` вместе с `= None`:\n\n```python\nclass UpdateUserRequestSchema(BaseModel):\n    email: str | None = None\n    username: str | None = None\n```\n\nТакая модель годится для PATCH-запроса: студент передаёт только те поля, которые хочет изменить, а остальные остаются `None` и просто не участвуют в запросе (об этом — в уроке 3.13, когда будем реализовывать `update_user_api`).\n\n### Вложенные модели\n\nPydantic позволяет использовать одну модель как тип поля в другой — так описываются вложенные JSON-объекты:\n\n```python\nclass GeoSchema(BaseModel):\n    lat: str\n    lng: str\n\n\nclass AddressSchema(BaseModel):\n    street: str\n    city: str\n    geo: GeoSchema  # вложенная модель\n\n\naddress = AddressSchema(street=\"Main St\", city=\"Springfield\", geo={\"lat\": \"10\", \"lng\": \"20\"})\nprint(address.geo.lat)  # \"10\" — Pydantic сам превратил вложенный словарь в GeoSchema\n```\n\nВажный момент: даже если ты передашь вложенный объект как обычный словарь (`geo={\"lat\": \"10\", \"lng\": \"20\"}`), Pydantic автоматически провалидирует и превратит его в объект `GeoSchema`. Это ровно та ситуация, которая возникает при разборе ответа реального API — JSON приходит как вложенные словари, а Pydantic превращает всю эту структуру в дерево объектов одним вызовом.\n\n### Три способа создать модель\n\n1. **Через именованные аргументы** — как в примерах выше, `User(id=1, name=\"Alice\", ...)`.\n2. **Через распаковку словаря** — `User(**data)`, где `data` — обычный `dict`. Именно так удобно работать с результатом `response.json()`.\n3. **Через JSON-строку** — `User.model_validate_json(json_string)`. Этот способ мы подробно разберём в уроке 3.11, потому что именно его использует `UsersClient`.\n\n## Пример\n\nНастоящая модель из репозитория — `boilerplate/clients/users/users_schema.py`:\n\n```python\nfrom pydantic import BaseModel, EmailStr\n\n\nclass UserSchema(BaseModel):\n    \"\"\"\n    Описание структуры пользователя из https://jsonplaceholder.typicode.com/users.\n    \"\"\"\n    id: int\n    name: str\n    username: str\n    email: EmailStr\n    address: AddressSchema\n    phone: str\n    website: str\n    company: CompanySchema\n```\n\nОбрати внимание на `EmailStr` вместо обычного `str` — это встроенный в Pydantic тип, который не просто хранит строку, а проверяет, что она похожа на email. Если в ответе API окажется `\"email\": \"not-an-email\"`, модель не соберётся, и ты сразу узнаешь об этом на этапе валидации, а не где-то глубже в тесте.\n\n## Частые ошибки\n\n- Путать `BaseModel` с обычным `dict` и пытаться обращаться к полям через `user[\"id\"]` вместо `user.id`.\n- Забывать, что поле без `= значение` — обязательное, и удивляться `ValidationError` при попытке создать модель без всех полей.\n- Пытаться засунуть в Pydantic-модель бизнес-логику или сетевые вызовы (например, метод, который сам ходит в API) — модель должна отвечать только за структуру и валидацию данных, а не выполнять запросы.\n- Не устанавливать дополнительную зависимость для `EmailStr` (`pydantic[email]`) — без неё этот тип попросту не будет работать.\n\n## Мини-задание\n\nОпиши Pydantic-модель `PostSchema` для ресурса `/posts` API JSONPlaceholder (поля: `userId: int`, `id: int`, `title: str`, `body: str`). Получи через `requests` любой пост (`GET /posts/1`), передай `response.json()` в модель через распаковку словаря (`PostSchema(**response.json())`) и распечатай `post.title` через атрибут.\n", "hasPractice": true, "quiz": {"question": "В Pydantic-модели поле объявлено как email: str, без значения по умолчанию. Что произойдёт, если создать объект модели, не передав это поле?", "options": ["Поле автоматически получит значение None", "Поле получит пустую строку \"\"", "Pydantic выбросит ValidationError, так как поле без значения по умолчанию обязательно", "Модель создастся успешно, а поле просто не будет существовать у объекта"], "correct": 2, "explain": "Поле без значения по умолчанию (или без | None = None) — обязательное. Если его не передать при создании объекта, Pydantic бросит ValidationError."}}, {"id": "p56", "section": "Модуль 3 · API-тестирование", "subgroup": "Неделя 7", "isOverview": false, "num": "3.10", "title": "Вложенные модели и Field(alias=...): camelCase vs snake_case", "content": "# 3.10. Вложенные модели и Field(alias=...): camelCase vs snake_case\n\n## Зачем это нужно\n\nРеальные API редко возвращают данные в питоновском стиле именования. Рано или поздно тебе встретится поле вроде `firstName` или `createdAt`, и нужно будет решить: либо жить с некрасивым `snake_case`-нарушением в коде, либо настроить Pydantic так, чтобы он сам сопоставлял `camelCase` из JSON с `snake_case` в Python. Разберём оба варианта на реальном примере из репозитория.\n\n## Теория\n\n### Откуда берётся проблема camelCase / snake_case\n\nВ Python принят стиль именования `snake_case` (`first_name`, `created_at`). Во многих API (особенно написанных на JavaScript/TypeScript-бэкендах) принят `camelCase` (`firstName`, `createdAt`). Когда мы описываем Pydantic-модель под такой API, у нас есть выбор:\n\n1. Назвать поле модели точно так же, как в JSON (`firstName: str`) — просто, но нарушает питоновский код-стиль внутри проекта.\n2. Назвать поле в `snake_case` (`first_name: str`), а связь с JSON-ключом `firstName` настроить через `Field(alias=...)`.\n\n### Field(alias=...)\n\n```python\nfrom pydantic import BaseModel, Field\n\n\nclass UserSchema(BaseModel):\n    id: str\n    email: str\n    first_name: str = Field(alias=\"firstName\")\n    last_name: str = Field(alias=\"lastName\")\n```\n\nТеперь при создании модели из JSON-словаря `{\"id\": \"1\", \"email\": \"a@b.com\", \"firstName\": \"Alice\", \"lastName\": \"Smith\"}` Pydantic сам сопоставит `firstName` → `first_name`. В Python-коде дальше работаем как обычно: `user.first_name`, а не `user.firstName`.\n\n**Важный нюанс:** если задан `alias`, по умолчанию Pydantic ожидает при создании объекта именно алиас (`firstName=...`), а не имя поля (`first_name=...`). Чтобы можно было создавать модель обоими способами (и через алиас, и через имя поля в snake_case — это удобно в тестах, где ты сам формируешь запрос), добавляют:\n\n```python\nfrom pydantic import BaseModel, ConfigDict, Field\n\n\nclass UserSchema(BaseModel):\n    model_config = ConfigDict(populate_by_name=True)\n\n    first_name: str = Field(alias=\"firstName\")\n```\n\n### Обратная сериализация: model_dump(by_alias=True)\n\nКогда модель нужно превратить обратно в словарь для отправки в API, по умолчанию `model_dump()` вернёт ключи в том виде, в котором названы поля модели (`snake_case`). Если API ожидает `camelCase` обратно, нужно явно попросить сериализовать через алиасы:\n\n```python\nuser.model_dump()               # {\"first_name\": \"Alice\", ...} — snake_case\nuser.model_dump(by_alias=True)  # {\"firstName\": \"Alice\", ...} — camelCase, как ждёт API\n```\n\n### А что у нас в демо-API?\n\nОткрой ещё раз `boilerplate/clients/users/users_schema.py`. Там **нет** ни одного `Field(alias=...)`:\n\n```python\nclass CompanySchema(BaseModel):\n    name: str\n    catchPhrase: str  # camelCase-поле оставлено как есть, без alias\n    bs: str\n```\n\nЭто осознанное и вполне рабочее решение: JSONPlaceholder возвращает всего одно по-настоящему \"неудобное\" поле (`catchPhrase`), и ради него не стали городить `Field(alias=...)` — проще один раз назвать поле модели так же, как в JSON. **Alias нужен не всегда** — он оправдан, когда camelCase-полей в API много и хочется единообразного `snake_case` во всём проекте, либо когда важно строго придерживаться PEP 8 в командном коде. Если поле одно и погоды не делает — это решение архитектурного вкуса команды, а не жёсткое правило Pydantic.\n\nЕсли бы мы хотели переименовать `catchPhrase` в `catch_phrase`, выглядело бы это так:\n\n```python\nclass CompanySchema(BaseModel):\n    name: str\n    catch_phrase: str = Field(alias=\"catchPhrase\")\n    bs: str\n```\n\n### alias_generator — когда camelCase-полей много\n\nЕсли бы camelCase был не в одном поле, а во всех, вручную писать `Field(alias=...)` для каждого было бы утомительно. Для этого в Pydantic есть `alias_generator`:\n\n```python\nfrom pydantic import BaseModel, ConfigDict\nfrom pydantic.alias_generators import to_camel\n\n\nclass CourseSchema(BaseModel):\n    model_config = ConfigDict(alias_generator=to_camel, populate_by_name=True)\n\n    max_score: int\n    min_score: int\n```\n\n`to_camel` автоматически превращает имя каждого поля модели (`max_score`) в алиас в camelCase (`maxScore`) — не нужно расставлять `Field(alias=...)` вручную для каждого поля. В нашем демо-API такой необходимости пока нет (camelCase-поле всего одно), но полезно знать про этот механизм — он часто встречается в реальных проектах.\n\n## Пример\n\nПолный пример на модели из репозитория с вложенностью (`UserSchema` → `AddressSchema` → `GeoSchema`):\n\n```python\nfrom pydantic import BaseModel, EmailStr\n\n\nclass GeoSchema(BaseModel):\n    lat: str\n    lng: str\n\n\nclass AddressSchema(BaseModel):\n    street: str\n    suite: str\n    city: str\n    zipcode: str\n    geo: GeoSchema\n\n\nclass CompanySchema(BaseModel):\n    name: str\n    catchPhrase: str\n    bs: str\n\n\nclass UserSchema(BaseModel):\n    id: int\n    name: str\n    username: str\n    email: EmailStr\n    address: AddressSchema\n    phone: str\n    website: str\n    company: CompanySchema\n```\n\nНачинать проектирование модели стоит \"снизу вверх\" — сначала описать самые вложенные структуры (`GeoSchema`), затем те, что их используют (`AddressSchema`), и в конце — главную модель (`UserSchema`). Именно в таком порядке модели и расположены в файле.\n\n## Частые ошибки\n\n- Добавлять `Field(alias=...)` \"на всякий случай\" ко всем полям, даже если имя в JSON и так уже совпадает со `snake_case` — лишний код без пользы.\n- Забыть `populate_by_name=True` (или актуальный аналог в используемой версии Pydantic) и получить ошибку при попытке создать модель через имя поля, а не через алиас.\n- Забыть `by_alias=True` при сериализации запроса обратно в JSON — тогда в API уйдёт `snake_case` там, где он ждёт `camelCase`, и запрос будет отклонён или воспринят неправильно.\n- Проектировать модели \"сверху вниз\" и путаться в структуре — начинай с самых глубоко вложенных объектов.\n\n## Мини-задание\n\nПерепиши `CompanySchema` из примера так, чтобы поле называлось `catch_phrase` (snake_case) с `Field(alias=\"catchPhrase\")`. Получи реального пользователя через `users_client.get_user(user_id=1)` (после того как внесёшь изменение локально, не в общем репозитории) и убедись, что `user.company.catch_phrase` работает так же, как раньше работал `user.company.catchPhrase`. Верни файл в исходное состояние после эксперимента — модель менять в общем репозитории пока не нужно.\n", "hasPractice": true, "quiz": {"question": "В users_schema.py репозитория поле catchPhrase в CompanySchema объявлено без Field(alias=...), просто как catchPhrase: str. Почему это рабочее решение?", "options": ["Потому что Pydantic вообще не поддерживает работу с camelCase-полями", "Потому что в demo API JSONPlaceholder все поля обязаны быть в camelCase по стандарту Pydantic", "Потому что alias можно использовать только для вложенных моделей, а не для простых строковых полей", "Alias не обязателен — можно просто назвать поле модели так же, как оно называется в JSON от API, если это не создаёт больших неудобств"], "correct": 3, "explain": "Field(alias=...) нужен, когда хочется единообразного snake_case во всём проекте. Если camelCase-полей мало (как в нашем демо-API), проще один раз назвать поле модели так же, как в JSON."}}, {"id": "p57", "section": "Модуль 3 · API-тестирование", "subgroup": "Неделя 7", "isOverview": false, "num": "3.11", "title": "model_validate_json vs response.json()", "content": "# 3.11. model_validate_json vs response.json()\n\n## Зачем это нужно\n\nВ `UsersClient` (урок 3.8) высокоуровневые методы используют `UserSchema.model_validate_json(response.text)`, а не более очевидный на первый взгляд `UserSchema(**response.json())`. Разница между этими двумя подходами — не стилистическая придирка, а вопрос того, насколько твой тест устойчив к неожиданному поведению сервера.\n\n## Теория\n\nЕсть два способа превратить ответ сервера в Pydantic-объект.\n\n### Вариант 1: response.json() + распаковка словаря\n\n```python\ndata = response.json()          # шаг 1: распарсить JSON в dict\nuser = UserSchema(**data)       # шаг 2: распаковать dict в модель\n```\n\nЗдесь работа разбита на два независимых шага. Сначала `requests` сам парсит тело ответа как JSON (используя обычный `json.loads` внутри), и только потом результат передаётся в Pydantic.\n\n**Проблема:** если сервер вернул не JSON (например, HTML-страницу ошибки от прокси, пустое тело при `204`, или просто битый JSON) — упадёт `response.json()`, ещё до того, как в дело вступит Pydantic. Ошибка будет в духе `json.decoder.JSONDecodeError`, и разбираться, что пошло не так, придётся по тексту исключения из чужой библиотеки.\n\n### Вариант 2: model_validate_json\n\n```python\nuser = UserSchema.model_validate_json(response.text)\n```\n\nЗдесь `response.text` — это сырая строка тела ответа, без предварительного парсинга через `requests`. Метод `model_validate_json` сам парсит эту строку **и** сразу валидирует её на соответствие модели — за один шаг, средствами самого Pydantic.\n\n**Почему это надёжнее:**\n\n1. Ошибка парсинга и ошибка валидации происходят в одном и том же месте, с одинаковым типом исключения (`pydantic.ValidationError`) — не нужно ловить два разных типа ошибок в разных библиотеках.\n2. Сообщение об ошибке от Pydantic обычно понятнее и конкретнее, чем стандартное исключение JSON-парсера — оно сразу указывает, какое поле проблемное.\n3. Меньше промежуточных шагов — данные не проходят лишний раз через generic `dict`, а сразу превращаются в типизированный объект.\n\n### Когда какой вариант использовать\n\nЕсли ты уверен, что API всегда возвращает предсказуемый корректный JSON (что в целом верно для стабильных внутренних API), разница между вариантами не критична, и `UserSchema(**response.json())` тоже рабочий вариант. Но `model_validate_json(response.text)` — более защищённый способ по умолчанию, и именно поэтому он используется во всех высокоуровневых методах `UsersClient` в нашем репозитории. Придерживайся этого же паттерна, когда будешь добавлять свои методы в домашнем задании.\n\n## Пример\n\nВот как это выглядит в реальном методе `UsersClient` (`boilerplate/clients/users/users_client.py`):\n\n```python\ndef get_user_api(self, user_id: int) -> Response:\n    return self.get(f\"/users/{user_id}\")\n\ndef get_user(self, user_id: int) -> UserSchema:\n    response = self.get_user_api(user_id)\n    return UserSchema.model_validate_json(response.text)\n```\n\n`get_user_api` возвращает сырой `Response` — им пользуются негативные тесты (урок 3.8). `get_user` берёт этот же `Response`, достаёт `response.text` и валидирует его в `UserSchema` — им пользуются позитивные тесты, которым нужен удобный доступ к полям.\n\nЕсли бы сервер неожиданно вернул, скажем, пустое тело (например, из-за сбоя прокси), `model_validate_json(\"\")` упадёт с понятным `ValidationError`, где будет явно видно, что тело не является валидным JSON-объектом — вместо непрозрачного `JSONDecodeError` где-то в недрах `requests`.\n\n## Частые ошибки\n\n- Смешивать подходы в одном методе без причины — например, один раз использовать `response.json()`, в другом методе того же клиента — `model_validate_json`, без единой логики выбора.\n- Вызывать `model_validate_json` на негативных сценариях (`404`, `422`), где тело ответа заведомо не соответствует основной схеме, — в таких тестах нужно проверять `response.status_code` через `_api`-метод, а не пытаться валидировать ошибку как успешный ответ.\n- Забывать, что `model_validate_json` ожидает именно **строку** (`response.text`), а не уже распарсенный словарь — попытка передать `response.json()` в `model_validate_json` приведёт к ошибке типа.\n\n## Мини-задание\n\nВозьми `users_client.get_user_api(user_id=999)` (несуществующий пользователь, вернёт `404` с пустым или отличным от `UserSchema` телом). Попробуй передать `response.text` в `UserSchema.model_validate_json(...)` и посмотри на текст исключения `ValidationError`. Сравни с тем, что случилось бы при попытке `UserSchema(**response.json())` на том же ответе — оба варианта не сработают, но сообщения об ошибке будут отличаться.\n", "hasPractice": true, "quiz": {"question": "Почему UserSchema.model_validate_json(response.text) считается более надёжным вариантом, чем UserSchema(**response.json())?", "options": ["response.json() вообще не работает с объектом requests.Response", "Парсинг JSON и валидация происходят за один шаг средствами Pydantic, а не разбиты на отдельный вызов response.json(), который может упасть с непрозрачной ошибкой ещё до валидации", "model_validate_json работает быстрее в несколько раз", "response.text всегда возвращает уже провалидированный объект"], "correct": 1, "explain": "model_validate_json парсит и валидирует строку ответа за один шаг Pydantic-средствами, давая более понятную ошибку. response.json() парсит JSON отдельно и может упасть с непрозрачным JSONDecodeError раньше, чем Pydantic вообще увидит данные."}}, {"id": "p58", "section": "Модуль 3 · API-тестирование", "subgroup": "Неделя 7", "isOverview": false, "num": "3.12", "title": "Разбор test_users.py: всё вместе", "content": "# 3.12. Разбор test_users.py: всё вместе\n\n## Зачем это нужно\n\nТы по отдельности разобрал `APIClient`, `UsersClient`, Pydantic-модели и разницу между `_api`- и обычными методами. Пора увидеть, как всё это работает вместе в настоящем, зелёном тестовом файле — это и есть эталон, на который нужно ориентироваться при написании своих тестов в домашнем задании.\n\n## Теория\n\nОткрой `boilerplate/tests/api/test_users.py` целиком:\n\n```python\nimport allure\nimport pytest\n\nfrom clients.users.users_client import UsersClient\nfrom clients.users.users_schema import CreateUserRequestSchema\nfrom utils.fakers import get_random_email, get_random_username\n\n\n@allure.epic(\"API\")\n@allure.feature(\"Users\")\n@pytest.mark.api\nclass TestUsers:\n\n    @allure.title(\"Получение пользователя по id\")\n    def test_get_user(self, users_client: UsersClient):\n        with allure.step(\"Запрашиваем пользователя с id=1\"):\n            user = users_client.get_user(user_id=1)\n\n        with allure.step(\"Проверяем, что данные пользователя корректны\"):\n            assert user.id == 1\n            assert \"@\" in user.email\n\n    @allure.title(\"Получение несуществующего пользователя возвращает 404\")\n    def test_get_user_not_found(self, users_client: UsersClient):\n        with allure.step(\"Запрашиваем заведомо несуществующего пользователя\"):\n            response = users_client.get_user_api(user_id=999)\n\n        with allure.step(\"Проверяем статус-код ответа\"):\n            assert response.status_code == 404\n\n    @allure.title(\"Создание пользователя\")\n    def test_create_user(self, users_client: UsersClient):\n        request = CreateUserRequestSchema(\n            name=\"QA Student\",\n            username=get_random_username(),\n            email=get_random_email(),\n        )\n\n        with allure.step(\"Отправляем запрос на создание пользователя\"):\n            created_user = users_client.create_user(request)\n\n        with allure.step(\"Проверяем, что вернулись переданные данные\"):\n            assert created_user.name == request.name\n            assert created_user.username == request.username\n            assert created_user.email == request.email\n```\n\nРазберём по частям, связывая с уроками, которые ты уже прошёл.\n\n### Маркеры и Allure-метаданные (`@pytest.mark.api`, `@allure.epic`, `@allure.feature`)\n\n`@pytest.mark.api` — маркер из `pytest.ini` (модуль 1), который позволяет запускать только API-тесты командой `pytest -m api`. `@allure.epic(\"API\")` и `@allure.feature(\"Users\")` — метаданные для группировки в отчёте Allure; подробно про Allure будет модуль 5, сейчас достаточно знать, что эти декораторы не влияют на логику теста.\n\n### Фикстура users_client (урок 3.8)\n\nКаждый тестовый метод принимает `users_client: UsersClient` как параметр — pytest подставляет туда объект, который вернёт фикстура `users_client` из `conftest.py`. Клиент создаётся один раз на сессию и переиспользуется всеми тремя тестами.\n\n### test_get_user — happy path с высокоуровневым методом\n\n```python\nuser = users_client.get_user(user_id=1)\nassert user.id == 1\nassert \"@\" in user.email\n```\n\nИспользуется `get_user` (не `get_user_api`) — потому что тест хочет удобно проверить конкретные поля через атрибуты (`user.id`, `user.email`), а не копаться в сыром `response.json()`. Под капотом `get_user` уже сходил в API и провалидировал ответ через `UserSchema.model_validate_json(...)` (урок 3.11) — если бы сервер вернул что-то не соответствующее `UserSchema`, тест упал бы ещё на этапе вызова `get_user`, с понятной ошибкой валидации, а не на строке `assert`.\n\n### test_get_user_not_found — негативный сценарий с низкоуровневым методом\n\n```python\nresponse = users_client.get_user_api(user_id=999)\nassert response.status_code == 404\n```\n\nЗдесь используется `get_user_api`, а не `get_user` — намеренно (урок 3.8, 3.11). Тело ответа на несуществующего пользователя не соответствует `UserSchema`, и валидировать его Pydantic-схемой не нужно — единственное, что важно проверить в этом сценарии, это статус-код (урок 3.3).\n\n### test_create_user — работа с фейкерами и Pydantic-моделью запроса\n\n```python\nrequest = CreateUserRequestSchema(\n    name=\"QA Student\",\n    username=get_random_username(),\n    email=get_random_email(),\n)\ncreated_user = users_client.create_user(request)\n```\n\nСначала собирается Pydantic-модель запроса `CreateUserRequestSchema` — обрати внимание, что `username` и `email` берутся из `utils/fakers.py` (модуль использует `Faker` под капотом), чтобы каждый прогон теста создавал разные данные и тесты не мешали друг другу при повторных запусках. Затем эта модель целиком передаётся в `create_user(request)` — методу не нужен `dict`, только готовый объект схемы. Внутри `create_user_api` сам вызовет `request.model_dump()` перед отправкой (см. `users_client.py`, урок 3.8).\n\nПроверка `created_user.name == request.name` сравнивает поле ответа с полем исходного запроса напрямую через атрибуты — ещё один пример того, зачем нужны типизированные Pydantic-объекты вместо словарей.\n\n## Пример\n\nЧтобы убедиться, что всё это действительно работает, запусти только API-тесты (маркер из `pytest.ini`, модуль 1):\n\n```bash\npytest -m api -v\n```\n\nТы должен увидеть три зелёных теста: `test_get_user`, `test_get_user_not_found`, `test_create_user`.\n\n## Частые ошибки\n\n- Писать в новом тесте `assert response.json()[\"email\"] == ...` вместо того, чтобы использовать уже готовый высокоуровневый метод клиента и работать через атрибуты — это дублирование логики парсинга, которая уже есть в клиенте.\n- Использовать одинаковые (захардкоженные) `username`/`email` в тесте создания пользователя вместо генерации через `utils/fakers.py` — при повторном запуске это может привести к конфликтам данных на реальном (не фейковом) API.\n- Не разделять позитивные и негативные тесты по методам клиента (`_api` vs без суффикса) — пытаться валидировать ошибочный ответ Pydantic-схемой успешного сценария.\n\n## Мини-задание\n\nЗапусти `pytest -m api -v` локально в форкнутом `boilerplate/`, убедись, что все три теста зелёные. Затем временно измени `user_id=999` на `user_id=1` в `test_get_user_not_found` и запусти тест снова — убедись, что он падает, и разберись, на какой именно строке (`assert`) это происходит. Верни файл в исходное состояние.\n", "hasPractice": true, "quiz": {"question": "В test_create_user данные username и email генерируются через utils/fakers.py, а не захардкожены строкой. Зачем?", "options": ["Потому что JSONPlaceholder не принимает захардкоженные строки в принципе", "Чтобы ускорить выполнение теста за счёт меньшего размера данных", "Faker обязателен по правилам Pydantic для полей типа EmailStr", "Чтобы каждый прогон теста использовал разные данные и тесты не конфликтовали друг с другом при повторных запусках"], "correct": 3, "explain": "Случайные данные на каждый прогон нужны, чтобы повторные запуски теста не мешали друг другу — например, не создавали конфликтов из-за одинаковых значений полей."}}, {"id": "p59", "section": "Модуль 3 · API-тестирование", "subgroup": "Неделя 7", "isOverview": false, "num": "3.13", "title": "Добавляем новый метод в клиент: update_user_api", "content": "# 3.13. Добавляем новый метод в клиент: update_user_api\n\n## Зачем это нужно\n\nЭто последний теоретический урок модуля, и он — прямая репетиция домашнего задания. Ты уже разобрал, как устроен `UsersClient` целиком (уроки 3.7–3.12). Теперь разберём, как **добавить** в него новый метод, не ломая и не переписывая то, что уже есть, — именно так выглядит обычная задача на реальном проекте: \"добавь метод под новый эндпоинт\".\n\n## Теория\n\nВ `UsersClient` уже есть `get_users_api`, `get_user_api`, `create_user_api`, `delete_user_api` (низкоуровневые, возвращают `Response`) и `get_user`, `create_user` (высокоуровневые, возвращают Pydantic-модель). Обрати внимание: **`delete_user_api` уже существует в клиенте**, но в `test_users.py` для него пока нет ни одного теста. Значит, в домашнем задании тебе предстоит не только добавить новый метод, но и написать тесты на уже существующий, но непокрытый метод — тоже частая ситуация в реальной работе.\n\nМетода для обновления пользователя (`PATCH /users/{id}`) в клиенте пока нет вообще — это тот метод, который мы добавим по шагам ниже.\n\n### Шаг 1. Схема запроса на обновление\n\nPATCH — метод частичного обновления (урок 3.2): клиент присылает только те поля, которые хочет изменить. Значит, в схеме запроса все поля должны быть опциональными (урок 3.9):\n\n```python\n# clients/users/users_schema.py — добавляем рядом с существующими схемами\n\nclass UpdateUserRequestSchema(BaseModel):\n    \"\"\"\n    Описание структуры запроса на частичное обновление пользователя.\n    Все поля опциональны — PATCH отправляет только то, что нужно изменить.\n    \"\"\"\n    name: str | None = None\n    username: str | None = None\n    email: EmailStr | None = None\n```\n\nОбрати внимание: используем `EmailStr`, а не простой `str`, точно так же, как в уже существующей `UserSchema`. Это не просто \"для красоты\" — на реальном (а не фейковом) API схема с `EmailStr` не даст тебе даже попытаться отправить в API заведомо невалидный email: `UpdateUserRequestSchema(email=\"not-an-email\")` упадёт с `pydantic.ValidationError` ещё до похода в сеть. Это осмысленный негативный тест сам по себе — подробнее в домашнем задании.\n\nДля ответа переиспользуем уже существующую `UserSchema` — JSONPlaceholder на `PATCH /users/{id}` для \"существующих\" (захардкоженных на сервере) id 1–10 возвращает полноценный объект пользователя той же формы, что и `GET /users/{id}`.\n\n### Шаг 2. Метод в клиенте\n\nДобавляем в `UsersClient`, рядом с остальными методами, по той же схеме \"сначала `_api`-метод, затем — при необходимости — высокоуровневый\":\n\n```python\n# clients/users/users_client.py\n\nclass UsersClient(APIClient):\n    # ...существующие методы без изменений...\n\n    def update_user_api(self, user_id: int, request: UpdateUserRequestSchema) -> Response:\n        return self.patch(\n            f\"/users/{user_id}\",\n            json=request.model_dump(exclude_none=True),\n        )\n\n    def update_user(self, user_id: int, request: UpdateUserRequestSchema) -> UserSchema:\n        response = self.update_user_api(user_id, request)\n        return UserSchema.model_validate_json(response.text)\n```\n\nРазберём то, чего раньше не было в клиенте:\n\n- `self.patch(...)` — метод из базового `APIClient` (урок 3.7), уже готов к использованию, ничего дополнительно реализовывать не нужно.\n- `request.model_dump(exclude_none=True)` — важная деталь. Так как все поля `UpdateUserRequestSchema` опциональны и по умолчанию равны `None`, обычный `model_dump()` отправил бы в API поля со значением `None` для всех незаполненных атрибутов. `exclude_none=True` убирает из итогового словаря поля, равные `None`, — в теле запроса останутся только те поля, которые студент реально захотел изменить. Это именно та семантика, которую и подразумевает PATCH (урок 3.2).\n- `update_user_api` возвращает сырой `Response` — пригодится для
