6) — ревью содержательного кода имеет смысл начинать после того, как пайплайн уже прошёл; красный CI — это сначала к автору, а не сразу вопросы по логике.\n\n## Как оставлять комментарии\n\n- Комментарий должен объяснять **почему**, а не просто \"переделай\". \"Тут будет падать, если пользователь не найден — стоит явно проверить 404\" полезнее, чем \"тут плохо\".\n- Разделяй blocking-комментарии (без этого мёржить нельзя — баг, нарушение архитектуры) и nit/предложения (стилистика, вкусовщина, \"можно, но не обязательно\").\n- Не превращай ревью в переписывание чужого решения в комментариях целиком — если правка большая, лучше обсудить голосом/в чате и предложить созвониться, а не вести архитектурный спор в комментариях к строчкам кода.\n\n## Как реагировать на комментарии к своему PR\n\n- Комментарий к коду — не комментарий к тебе как автору. Не нужно защищаться, если в комментарии прямо указана техническая проблема.\n- Если не согласен — аргументируй технически (\"этот тест специально не изолирован, потому что...\"), а не просто отклоняй правку.\n- Отвечай на каждый комментарий явно (fix / already fixed / disagree because..., а не тишина) — это ускоряет повторное ревью.\n\n## Частые ошибки ревьюера\n\n- Аппрувить PR, не запустив тесты и не прочитав diff внимательно, \"потому что автор — надёжный человек\".\n- Придираться только к стилистике (пробелы, порядок импортов), игнорируя логические проблемы — для стилистики в реальных проектах обычно есть линтеры, ревьюер нужен для смысловых вещей.\n- Оставлять расплывчатые комментарии (\"не уверен, что это верно\") без конкретного объяснения, что именно смущает.\n\n## Мини-задание\n\nСделай полноценное ревью одного PR одногруппника по чек-листу выше: минимум 2 конкретных комментария (один — обязательный к исправлению, один — предложение) и явный вердикт (approve / request changes).\n", "hasPractice": true, "quiz": {"question": "В PR все тесты зелёные, но ревьюер видит, что allure.title теста не соответствует тому, что реально проверяет assert внутри. Это повод для...", "options": ["Автоматического отклонения PR без объяснений", "Blocking-комментария с объяснением расхождения", "Ничего — раз тесты зелёные, замечание не нужно", "Только nit-комментария, потому что это стилистика"], "correct": 1, "explain": "Несоответствие названия теста и того, что он реально проверяет — первый пункт чек-листа ревью: это смысловая проблема, а не стилистика, значит комментарий блокирующий."}}, {"id": "p95", "section": "Модуль 7 · Финальный спринт", "subgroup": null, "isOverview": false, "num": "7.4", "title": "Рефакторинг без поломок", "content": "# 7.4. Рефакторинг без поломок\n\n## Зачем это нужно\n\nК концу курса в общем репозитории накопилось дублирование: несколько похожих Page Object'ов, несколько похожих API-клиентов, возможно — повторяющиеся фикстуры. Рефакторинг мелких кусков — последний практический навык курса: изменить структуру кода, не сломав ни одного существующего теста.\n\n## Теория\n\nБезопасный рефакторинг подчиняется простому правилу: **до и после рефакторинга набор тестов должен быть зелёным, и сами тесты (если они не являются предметом рефакторинга) не должны меняться.** Если для рефакторинга кода пришлось переписать тесты на него — это уже не совсем рефакторинг, а изменение поведения, и тикет стоит переформулировать.\n\nПрактический алгоритм:\n\n1. **Убедись, что зона рефакторинга покрыта тестами.** Если метод, который собираешься менять, вообще не тестируется — рефакторинг рискованный: некому подтвердить, что поведение не изменилось. В этом случае первый шаг — написать тест на текущее поведение, и только потом рефакторить.\n2. **Меняй маленькими шагами.** Например, вынося общий метод из двух Page Object в `BasePage`: сначала добавь метод в `BasePage`, прогони тесты (ничего не должно сломаться, старый код ещё используется); потом замени использование в одном классе, прогони тесты; потом в другом.\n3. **Не смешивай рефакторинг с добавлением новой функциональности** в одном PR — это разные по духу изменения, и в случае проблемы откатить/понять причину гораздо сложнее, если они перемешаны.\n\n## Пример: вынос общего кода из двух Page Object\n\nДопустим, у `RegistrationPage` и нового `LoginPage` появился одинаковый метод проверки видимости всех полей формы. Вместо дублирования:\n\n```python\n# было — похожий код в двух классах\nclass RegistrationPage(BasePage):\n    def check_visible_registration_form(self) -> None:\n        expect(self.email_input).to_be_visible()\n        expect(self.username_input).to_be_visible()\n        expect(self.password_input).to_be_visible()\n        expect(self.registration_button).to_be_visible()\n```\n\nМожно вынести в `BasePage` общий вспомогательный метод, принимающий список локаторов:\n\n```python\n# стало — общая логика в BasePage\nclass BasePage:\n    ...\n    def check_all_visible(self, *locators) -> None:\n        for locator in locators:\n            expect(locator).to_be_visible()\n\n\nclass RegistrationPage(BasePage):\n    def check_visible_registration_form(self) -> None:\n        self.check_all_visible(\n            self.email_input,\n            self.username_input,\n            self.password_input,\n            self.registration_button,\n        )\n```\n\nКлючевой момент: после такого изменения `test_successful_registration` из `boilerplate/tests/ui/test_registration.py` не меняется вообще — он по-прежнему вызывает `registration_page.check_visible_registration_form()` и ожидает того же поведения. Именно так выглядит \"безопасный\" рефакторинг: тест не заметил изменения реализации.\n\n## Частые ошибки\n\n- Рефакторить сразу всё, что \"не нравится\", вместо конкретного тикета — рефакторинг без чёткой границы легко превращается в незаконченный PR на тысячу строк.\n- Не прогонять полный набор тестов после рефакторинга, ограничиваясь только тестами \"по смыслу\" затронутого модуля — используемые повсеместно базовые классы (`BasePage`, `APIClient`) могут повлиять на тесты, которые визуально с рефакторингом не связаны.\n- Переименовывать публичные методы/классы, которые используются в тестах других студентов, без согласования — в общем репозитории это ломает чужой код, а не только свой.\n\n## Мини-задание\n\nНайди в общем репозитории (или предположи по структуре boilerplate) один кандидат на рефакторинг — повторяющийся кусок кода в двух похожих местах — и опиши план: что именно выносится, куда, и какие тесты должны остаться зелёными после изменения, не меняя своего текста.\n", "hasPractice": true, "quiz": {"question": "Какой признак того, что рефакторинг Page Object выполнен безопасно, согласно уроку?", "options": ["Тесты, использующие этот Page Object, пришлось переписать под новую реализацию", "Тесты, использующие этот Page Object, остались без изменений и всё ещё проходят", "Количество строк кода в файле сократилось минимум вдвое", "Ревьюер не заметил изменений в диффе PR"], "correct": 1, "explain": "Безопасный рефакторинг меняет реализацию, но не поведение — существующие тесты не должны меняться и должны оставаться зелёными до и после."}}, {"id": "p96", "section": "Модуль 7 · Финальный спринт", "subgroup": null, "isOverview": false, "num": null, "title": "Итоговые критерии курса", "content": "# Итоговые критерии курса\n\n## Что должно быть в GitHub/GitLab у каждого студента к концу недели 14\n\n- **10+ смёрженных PR** в общий репозиторий за весь курс (не только за модуль 7) — багфиксы, новые тесты, ревью, рефакторинг.\n- **Минимум 3 PR за модуль 7**, закрывающих тикеты из разных категорий: минимум один багфикс чужого теста, минимум одно проведённое ревью с содержательными комментариями, минимум один рефакторинг без изменения поведения тестов.\n- Все тесты студента в общем репозитории — с allure-разметкой (модуль 5) и зелёным CI (модуль 6).\n- Нет ни одного открытого PR \"зависшего\" без ревью или ответа на комментарии дольше нескольких дней — умение доводить задачу до мёржа не менее важно, чем умение её начать.\n\n## Что это даёт на собеседовании\n\nИстория из реальных PR (не один финальный \"дамп\" кода в конце курса) — это готовый материал для разговора на собеседовании: \"расскажи о PR, где ты нашёл баг в чужом тесте\" или \"расскажи о ревью, где не согласился с автором\" — конкретные истории всегда убедительнее общих фраз \"я изучил pytest и Playwright\".\n\n## Дальше — джобсерч-трек\n\nПараллельно с модулем 6 уже должен был начаться джобсерч-трек (см. `jobsearch_track/`) — к этому моменту у тебя уже должно быть готово резюме и понимание, куда откликаться. Модуль 7 даёт финальный материал для раздела \"опыт\" в резюме и для портфолио-ссылки на GitHub.\n", "hasPractice": false}, {"id": "p97", "section": "Job-search", "subgroup": null, "isOverview": true, "num": null, "title": "Job-search трек", "content": "# Job-search трек\n\nПараллельный трек, стартует с модуля 6 (не блокирует техническую часть курса) — за исключением трека для Сербии, который стартует раньше (с модуля 3), потому что языковой барьер требует больше времени на разгон.\n\nМатериал написан заново — в исходных курсах раздел про резюме/собеседования (`stepik-api-testing-advanced`, глава 15) оказался пустой заглушкой (см. `ROADMAP.md`).\n\n- [`ru/`](ru/) — резюме, hh.ru/Habr Career, разбор вакансий junior QA automation в РФ.\n- [`rs/`](rs/) — резюме на английском, LinkedIn, технический английский — для студентов, ориентированных на рынок Сербии/международный рынок.\n\n## Почему треки разные\n\nТребования к junior QA automation в РФ и на международном/сербском рынке отличаются не по сути навыков (стек тот же — Python, pytest, Playwright, API), а по формату подачи: язык резюме, платформы поиска, ожидания от технического интервью на английском. Разделение треков — не про разный уровень, а про разную \"упаковку\" одних и тех же навыков.\n", "hasPractice": false}, {"id": "p98", "section": "Job-search", "subgroup": "RU", "isOverview": false, "num": null, "title": "RU. Резюме junior QA automation engineer", "content": "# RU. Резюме junior QA automation engineer\n\n## Зачем это нужно\n\nРезюме — это фильтр до собеседования. У рекрутера обычно 20-30 секунд на первый просмотр; резюме без конкретики про автоматизацию (\"занимался тестированием\", \"изучал Python\") отсеивается раньше, чем кто-то дочитает до опыта.\n\n## Структура резюме под этот курс\n\n1. **Заголовок и позиция.** \"QA Automation Engineer (Junior)\" — конкретно, не \"тестировщик\" общим словом, если цель именно автоматизация.\n2. **Стек технологий.** Список без воды: Python, pytest, requests, Pydantic, Playwright, Allure, Git, базовое понимание CI (GitHub Actions/GitLab CI). Пиши только то, чем реально пользовался в курсе — на собеседовании про каждый пункт могут спросить.\n3. **Проект/опыт.** Вместо \"проходил курс по автоматизации тестирования\" — конкретно: \"Разработал и поддерживал автотесты (API + UI) в командном репозитории на Python/pytest/Playwright, участвовал в code review, настраивал allure-отчётность\". Это честное описание того, что реально происходило в модулях 2-7.\n4. **Ссылка на GitHub.** Обязательно — ссылка на общий репозиторий курса (или свой форк) с историей PR. Это ЕДИНСТВЕННОЕ, что реально доказывает навыки джуниору без коммерческого опыта — работодатель может открыть и увидеть реальный код, реальные PR, реальные ревью.\n5. **Образование/курсы.** Кратко, в конце. Название курса, продолжительность — не расписывай подробно программу, это не главное.\n\n## Частые ошибки\n\n- Резюме на 2-3 страницы для позиции junior — эйчар не читает длинные резюме от кандидатов без опыта, максимум одна страница.\n- Перечисление технологий, которых не было в реальной практике курса (\"Selenium, TestNG, Java\") \"для солидности\" — на собеседовании это быстро вскрывается и работает против кандидата.\n- Отсутствие ссылки на GitHub — для automation-инженера без коммерческого опыта это самый весомый аргумент, отсутствие ссылки выглядит как нежелание показать код.\n- Общие фразы без цифр/фактов: \"ответственный, обучаемый, коммуникабельный\" — для технической позиции это не то, что решает.\n\n## Мини-задание\n\nНапиши раздел \"Опыт/проект\" своего резюме, опираясь на реальные PR из общего репозитория курса — минимум 3 конкретных пункта (например: \"Реализовал API-клиент для работы с /users, покрыл 5 тестами позитивные и негативные сценарии\", \"Настроил автоматическое приложение скриншотов в Allure при падении UI-тестов\").\n", "hasPractice": true}, {"id": "p99", "section": "Job-search", "subgroup": "RU", "isOverview": false, "num": null, "title": "RU. Где искать вакансии", "content": "# RU. Где искать вакансии\n\n## Зачем это нужно\n\nJunior automation-позиции на массовых площадках теряются среди сотен вакансий \"тестировщик без опыта\" — часто ручного тестирования. Нужно знать, где искать именно автоматизацию и как фильтровать поток вакансий.\n\n## Площадки\n\n- **hh.ru** — основная площадка в РФ. Фильтр по ключевым словам \"QA automation\", \"автотестер\", \"SDET\" даёт более релевантную выдачу, чем просто \"тестировщик\". Стоит настроить сохранённый поиск с уведомлениями.\n- **Habr Career** — более техническая аудитория, чаще встречаются вакансии, где явно указан стек (pytest/Playwright/Selenium) — проще заранее понять, подходит ли вакансия под навыки курса.\n- **Телеграм-каналы с вакансиями QA** — быстрее обновляются, чем агрегаторы, но требуют больше ручного отбора.\n- **Прямые карьерные страницы компаний**, в которых интересно работать — часто вакансии джуниоров туда даже не доходят до агрегаторов.\n\n## Как читать вакансию \"junior QA automation\"\n\nПризнаки, что вакансия реально про автоматизацию (а не ручное тестирование с формальной припиской \"плюсом будет\"):\n\n- В требованиях явно указан язык программирования (Python/Java/JS) и фреймворк тестирования.\n- Есть упоминание CI/CD, Git, code review — значит, ожидают работу в команде с существующим репозиторием, а не соло-написание с нуля.\n- \"Плюсом будет\" про автоматизацию, а обязательный стек — только ручное тестирование, это, скорее всего, позиция ручного тестировщика с перспективой роста в автоматизацию, а не готовая automation-роль.\n\n## Частые ошибки\n\n- Откликаться только на вакансии, где написано \"требуется опыт от 1 года\" и пропускать те, где не указан опыт вообще — многие компании не пишут \"junior\" явно, а просто не указывают требование к опыту.\n- Не адаптировать отклик под конкретную вакансию — сопроводительное письмо в 2-3 предложения о том, почему стек вакансии совпадает с пройденным курсом, повышает шанс на ответ.\n- Останавливаться после первых 5-10 неответов — воронка junior-позиций длинная, отклик без ответа за 1-2 недели — норма, а не сигнал \"я не гожусь\".\n\n## Мини-задание\n\nНайди 5 реальных вакансий \"junior QA automation\" на hh.ru или Habr Career, для каждой отметь: какой стек требуется, совпадает ли он с пройденным курсом, и что из требований у тебя уже закрыто, а что — нет.\n", "hasPractice": true}, {"id": "p100", "section": "Job-search", "subgroup": "RU", "isOverview": false, "num": null, "title": "RU. Подготовка к техническому собеседованию", "content": "# RU. Подготовка к техническому собеседованию\n\n## Зачем это нужно\n\nТехническое интервью на позицию junior automation почти всегда строится вокруг тем, которые уже закрыты этим курсом — вопрос в том, чтобы уметь их объяснить вслух, а не только применять в коде.\n\n## Типичная структура интервью на junior automation\n\n1. **Общие вопросы про опыт** — тут и пригодится история PR из модуля 7 и конкретные формулировки из резюме (урок 01).\n2. **Вопросы про Python** — базовый синтаксис, различие изменяемых/неизменяемых типов, что такое `*args`/`**kwargs`, ООП (модуль 0).\n3. **Вопросы про pytest** — фикстуры и их scope, параметризация, маркеры, чем conftest.py отличается от обычного файла с тестами (модуль 1).\n4. **Вопросы про Git** — разница merge/rebase, что такое конфликт и как его решать, зачем нужны маленькие PR (модуль 2).\n5. **Вопросы про API-тестирование** — разница PUT/PATCH, что проверяют кроме статус-кода, зачем нужна schema validation (модуль 3).\n6. **Вопросы про UI-автоматизацию** — зачем нужен Page Object, разница explicit/implicit wait, как бороться с флейковыми тестами (модуль 4, модуль 7).\n7. **Практическое задание** — часто просят написать небольшой тест или Page Object на месте/дома. Именно поэтому важно реально понимать код в общем репозитории, а не просто скопировать готовое решение с прошлого PR.\n\n## Как готовиться\n\n- Пройдись по каждому модулю курса и сформулируй вслух (можно самому себе, можно с одногруппником) ответ на вопрос \"объясни, что это и зачем\" — не \"покажи код\", а именно объясни словами.\n- Пересмотри свои же PR из модуля 7 — вспомни, какие решения принимал и почему, это частый вопрос на интервью (\"расскажи о задаче, где пришлось разбираться в чужом коде\").\n- Подготовь 2-3 своих вопроса к интервьюеру про процесс тестирования в компании (как устроен CI, кто пишет тест-план, как часто ревьюят PR) — это работает и как демонстрация вовлечённости, и как реальный способ понять, подходит ли тебе команда.\n\n## Частые ошибки\n\n- Зазубривать формулировки без понимания — на уточняющий вопрос \"а почему именно так\" заученный ответ разваливается.\n- Отвечать только теоретически, не имея возможности показать реальный код (отсюда — важность ссылки на GitHub из урока 01).\n- Не признавать честно \"не знаю, но вот как бы я стал разбираться\" — на junior-позиции интервьюер не ждёт, что кандидат знает всё, но ждёт адекватной реакции на пробел в знаниях.\n\n## Мини-задание\n\nПроведи с одногруппником взаимное мини-интервью по списку тем выше (15-20 минут в каждую сторону) — попроси честную обратную связь, где ответ звучал неуверенно.\n", "hasPractice": true}, {"id": "p101", "section": "Job-search", "subgroup": "RS", "isOverview": false, "num": null, "title": "RS. CV на английском", "content": "# RS. CV на английском\n\n## Зачем это нужно\n\nНа сербском и международном рынке резюме на русском не рассматривается почти нигде за пределами русскоязычных компаний. CV на английском — не перевод русского резюме дословно, а отдельный документ со своими принятыми форматами.\n\n## Структура CV (принятый международный формат отличается от привычного российского резюме)\n\n1. **Header.** Имя, роль (\"QA Automation Engineer\"), контакты, ссылка на LinkedIn и GitHub — без фото (в отличие от принятого в РФ формата, на международном рынке фото в CV обычно не ожидается и иногда даже избегается из-за политики non-discrimination).\n2. **Summary (2-3 строки).** Кратко: кто ты, какой стек, что ищешь. Пример: \"Junior QA Automation Engineer with hands-on experience in Python, pytest, Playwright and API testing (requests, Pydantic). Comfortable working in a team repository with Git/PR workflow and CI pipelines.\"\n3. **Skills.** Списком, по категориям: Languages (Python), Testing (pytest, Playwright, API testing, Allure), Tools (Git, GitHub Actions/GitLab CI), Soft skills — по минимуму, международные CV меньше внимания уделяют soft skills в резюме джуниора, больше — на самом интервью.\n4. **Experience/Projects.** Так же, как в русскоязычном треке (см. `ru/01_Резюме.md`) — конкретные формулировки на основе реальных PR, но на английском. Использовать action verbs (Implemented, Built, Configured, Reviewed), избегать пассивного залога.\n5. **Education.** Кратко, в конце.\n\n## Частые ошибки при переводе резюме на английский\n\n- Дословный перевод русских формулировок (\"занимался написанием автотестов\") вместо естественных английских (\"wrote and maintained automated tests\") — резюме, переведённое машинально, заметно рекрутеру.\n- Использование российского формата с фото и датой рождения — на международном рынке это не ожидается и иногда выглядит нестандартно.\n- Не указывать уровень английского явно, если он не C1+ — честная оценка (B1/B2) с указанием того, что достаточно для рабочей переписки и код-ревью, воспринимается лучше, чем невыполненное молчаливое \"по умолчанию свободно\".\n\n## Мини-задание\n\nПереведи свой раздел \"Опыт\" из русскоязычного резюме (`ru/01_Резюме.md`, мини-задание) на английский, используя action verbs, и попроси одногруппника с более уверенным английским проверить формулировки.\n", "hasPractice": true}, {"id": "p102", "section": "Job-search", "subgroup": "RS", "isOverview": false, "num": null, "title": "RS. Где искать и LinkedIn", "content": "# RS. Где искать и LinkedIn\n\n## Зачем это нужно\n\nМеждународный поиск работы устроен иначе, чем в РФ: меньше централизованных агрегаторов вакансий, больше — прямых откликов через LinkedIn и нетворкинг. Профиль LinkedIn для junior automation-инженера — фактически второе резюме, которое видят чаще, чем сам файл CV.\n\n## LinkedIn как основной инструмент\n\n- **Заголовок профиля** — не просто \"Student\" или \"Looking for opportunities\", а конкретно: \"Junior QA Automation Engineer | Python, pytest, Playwright\".\n- **About-секция** — по сути то же summary, что и в CV (см. `01_CV_на_английском.md`), чуть более развёрнуто.\n- **Featured/Projects** — прямая ссылка на GitHub с общим репозиторием курса. Это основной актив junior-профиля без коммерческого опыта.\n- **Активность** — комментарии/репосты по теме QA automation, подключение к людям из индустрии (рекрутерам, automation-инженерам) увеличивают охват профиля, даже если не откликаться на вакансии напрямую.\n\n## Где искать вакансии\n\n- **LinkedIn Jobs** — фильтр по \"QA Automation\", \"SDET\", \"Test Automation Engineer\", уровень \"Entry level\"/\"Internship\" при отсутствии опыта.\n- **Локальные площадки Сербии** (например, HelloWorld.rs, Poslovi.infostud.com) — часто там публикуются вакансии локальных и региональных IT-компаний, которые не всегда доходят до LinkedIn.\n- **Компании с удалённым international-hiring** — многие продуктовые компании нанимают QA automation удалённо без привязки к стране, стоит искать напрямую на карьерных страницах.\n\n## Частые ошибки\n\n- Полностью пустой или заполненный \"для галочки\" профиль LinkedIn — для международного рынка это часто первое, что смотрит рекрутер, ещё до CV.\n- Массовая рассылка одного и того же сообщения в LinkedIn без персонализации — сообщения с конкретной причиной, почему интересна именно эта компания/позиция, получают ответ значительно чаще.\n- Ждать входящих предложений вместо активного отклика — на junior-уровне рынок соискателя, а не наоборот, нужна инициатива.\n\n## Мини-задание\n\nЗаполни/обнови профиль LinkedIn по структуре выше (заголовок, About, Featured со ссылкой на GitHub) и найди 5 вакансий junior QA automation на LinkedIn Jobs или локальных площадках, подходящих под пройденный стек.\n", "hasPractice": true}, {"id": "p103", "section": "Job-search", "subgroup": "RS", "isOverview": false, "num": null, "title": "RS. Английский для технического собеседования", "content": "# RS. Английский для технического собеседования\n\n## Зачем это нужно\n\nТехнические термины (fixture, assert, locator, pipeline) большинство студентов уже используют по-английски (см. `STYLE_GUIDE.md` всего курса) — но объяснить свой код и опыт связной английской речью на интервью значительно сложнее, чем понимать документацию.\n\n## На чём фокусироваться\n\nТехнический английский для собеседования — это не грамматика уровня экзамена, а свободное владение конкретным ограниченным набором конструкций:\n\n1. **Объяснение решения задним числом.** \"I implemented a `UsersClient` that inherits from a base `APIClient`, because it lets us reuse the same GET/POST/PATCH/DELETE logic across all API clients.\" — конструкция \"I did X, because Y\" покрывает большую часть ответов на технические вопросы.\n2. **Описание проблемы и её решения.** \"The test was flaky because the assertion ran before the page finished loading, so I replaced it with an explicit `expect()` wait.\" — эта же конструкция из модуля 7 (багфиксы), но на английском.\n3. **Уточняющие вопросы.** \"Could you clarify what environment this would run in?\", \"Do you mean the request body or the response?\" — уметь переспрашивать важнее, чем бояться показаться не понявшим с первого раза.\n4. **Мышление вслух.** На многих live-coding интервью ожидают, что кандидат объясняет ход мыслей в процессе, а не молча пишет код и объясняет в конце. Фразы вроде \"Let me think about edge cases here\" помогают держать разговор, пока формулируется решение.\n\n## Как готовиться, используя материал курса\n\n- Пройдись по своим PR из модуля 7 и опиши на английском вслух (или письменно) каждый: что за проблема, как её нашёл, как исправил — это прямая тренировка структуры \"I did X because Y\".\n- Прогони mock-интервью с одногруппником полностью на английском по чек-листу тем из `ru/03_Подготовка_к_собеседованию.md` (темы те же, язык другой).\n- Запиши себя на видео/аудио, отвечая на 2-3 типовых вопроса — часто ошибки слышны самому при пересмотре лучше, чем в моменте разговора.\n\n## Частые ошибки\n\n- Учить фразы, не связанные с реальным опытом — заученный ответ \"расскажи о своём проекте\" звучит неестественно без конкретики из собственных PR.\n- Молчать при незнакомом слове/термине вместо того, чтобы переспросить — на реальном собеседовании переспросить нормально, тишина работает против кандидата сильнее.\n- Готовиться только к вопросам \"расскажи о себе\", игнорируя техническую лексику по конкретным темам курса (pytest, Git, API, Playwright) — именно там будут специфичные термины, которые не всплывают в бытовом английском.\n\n## Мини-задание\n\nЗапиши голосовую заметку (2-3 минуты) с ответом на вопрос \"Tell me about a bug you found and fixed in a teammate's test\" на английском, опираясь на реальный PR из модуля 7. Прослушай сам и отметь, какие фразы дались тяжелее всего.\n", "hasPractice": true}]</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
(function(){
  "use strict";

  var PAGES = JSON.parse(document.getElementById('course-data').textContent);
  var byId = {};
  PAGES.forEach(function(p){ byId[p.id] = p; });

  marked.setOptions({
    gfm:true,
    breaks:false,
    highlight:function(code, lang){
      try{
        if(lang && hljs.getLanguage(lang)){
          return hljs.highlight(code, {language:lang}).value;
        }
        return hljs.highlightAuto(code).value;
      }catch(e){ return code; }
    }
  });

  // ---------- progress storage ----------
  var STORE_KEY = 'qa-course-reader-progress-v1';
  var LAST_KEY = 'qa-course-reader-last-v1';

  function loadProgress(){
    try{
      var raw = localStorage.getItem(STORE_KEY);
      return raw ? JSON.parse(raw) : {};
    }catch(e){ return {}; }
  }
  function saveProgress(p){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(p)); }catch(e){}
  }
  function loadLast(){
    try{ return localStorage.getItem(LAST_KEY); }catch(e){ return null; }
  }
  function saveLast(id){
    try{ localStorage.setItem(LAST_KEY, id); }catch(e){}
  }

  var progress = loadProgress();

  function isDone(id){ return !!progress[id]; }
  function setDone(id, val){
    if(val) progress[id] = true; else delete progress[id];
    saveProgress(progress);
    renderProgress();
    refreshLocks();
    var row = navEl.querySelector('[data-id="'+id+'"]');
    if(row) row.classList.toggle('done', isDone(id));
  }
  function toggleDone(id){ setDone(id, !isDone(id)); }

  // ---------- build grouped structure ----------
  var groups = []; // { section, entries:[ {subgroup, items:[page,...]} ], flatIds:[...] }
  PAGES.forEach(function(p){
    var g = groups[groups.length-1];
    if(!g || g.section !== p.section){
      g = { section:p.section, entries:[] };
      groups.push(g);
    }
    var e = g.entries[g.entries.length-1];
    if(!e || e.subgroup !== p.subgroup){
      e = { subgroup:p.subgroup, items:[] };
      g.entries.push(e);
    }
    e.items.push(p);
  });
  groups.forEach(function(g){
    g.flatIds = g.entries.flatMap(function(e){ return e.items.map(function(p){ return p.id; }); });
  });

  // id -> { list, index } within its own section, for sequential-lock checks
  var lockIndex = {};
  groups.forEach(function(g){
    g.flatIds.forEach(function(id, i){ lockIndex[id] = { list:g.flatIds, index:i }; });
  });
  function isLocked(id){
    var pos = lockIndex[id];
    if(!pos || pos.index === 0) return false;
    var prevId = pos.list[pos.index-1];
    return !isDone(prevId);
  }
  function lockRequirement(id){
    // the immediately preceding lesson in the same section that must be done first
    var pos = lockIndex[id];
    if(!pos || pos.index === 0) return null;
    return byId[pos.list[pos.index-1]];
  }
  function refreshLocks(){
    navEl.querySelectorAll('.nav-item').forEach(function(item){
      var locked = isLocked(item.dataset.id);
      item.classList.toggle('locked', locked);
      var statusEl = item.querySelector('.status, .lock-icon');
      if(statusEl){
        if(locked && statusEl.classList.contains('status')){
          var lock = document.createElement('span');
          lock.className = 'lock-icon';
          lock.innerHTML = LOCK_SVG;
          statusEl.replaceWith(lock);
        } else if(!locked && statusEl.classList.contains('lock-icon')){
          var dot = document.createElement('span');
          dot.className = 'status';
          statusEl.replaceWith(dot);
        }
      }
    });
  }
  var LOCK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="9" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>';

  var navEl = document.getElementById('nav');
  var totalCount = PAGES.length;
  document.getElementById('progress-total').textContent = totalCount;

  function countDoneIn(list){
    var n=0; list.forEach(function(p){ if(isDone(p.id)) n++; }); return n;
  }

  groups.forEach(function(g, gi){
    var details = document.createElement('details');
    details.className = 'nav-section';
    if(gi === 0) details.open = true;

    var allIds = [];
    g.entries.forEach(function(e){ e.items.forEach(function(p){ allIds.push(p.id); }); });

    var summary = document.createElement('summary');
    summary.innerHTML =
      '<span><span class="chev">▸</span> ' + escapeHtml(g.section) + '</span>' +
      '<span class="count mono" data-count-for="'+gi+'">'+countDoneIn(g.entries.flatMap(function(e){return e.items;}))+'/'+allIds.length+'</span>';
    details.appendChild(summary);

    var body = document.createElement('div');
    body.className = 'nav-body';

    g.entries.forEach(function(e){
      if(e.subgroup){
        var lbl = document.createElement('div');
        lbl.className = 'nav-subgroup-label';
        lbl.textContent = e.subgroup;
        body.appendChild(lbl);
      }
      e.items.forEach(function(p){
        var locked = isLocked(p.id);
        var btn = document.createElement('button');
        btn.className = 'nav-item' + (isDone(p.id) ? ' done':'') + (p.isOverview ? ' overview':'') + (locked ? ' locked':'');
        btn.dataset.id = p.id;
        btn.dataset.search = (p.title + ' ' + (p.num||'')).toLowerCase();
        btn.innerHTML =
          (locked ? '<span class="lock-icon">'+LOCK_SVG+'</span>' : '<span class="status"></span>') +
          (p.num ? '<span class="num mono">'+escapeHtml(p.num)+'</span>' : '<span class="num mono">·</span>') +
          '<span class="label">'+escapeHtml(p.title)+'</span>';
        btn.addEventListener('click', function(){
          if(isLocked(p.id)) return;
          navigate(p.id); closeMobileNav();
        });
        body.appendChild(btn);
      });
    });

    details.appendChild(body);
    navEl.appendChild(details);
  });

  function renderProgress(){
    var done = PAGES.filter(function(p){ return isDone(p.id); }).length;
    document.getElementById('progress-count').textContent = done;
    document.getElementById('progress-fill').style.width = (totalCount ? (done/totalCount*100) : 0) + '%';
    groups.forEach(function(g, gi){
      var all = g.entries.flatMap(function(e){ return e.items; });
      var el = navEl.querySelector('[data-count-for="'+gi+'"]');
      if(el) el.textContent = countDoneIn(all) + '/' + all.length;
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  // ---------- rendering current page ----------
  var articleEl = document.getElementById('article');
  var crumbEl = document.getElementById('crumb');
  var doneBtn = document.getElementById('done-btn');
  var pagerEl = document.getElementById('pager');
  var scrollEl = document.getElementById('content-scroll');

  var currentId = null;

  function navigate(id){
    var page = byId[id];
    if(!page) return;
    currentId = id;
    saveLast(id);

    navEl.querySelectorAll('.nav-item.active').forEach(function(el){ el.classList.remove('active'); });
    var row = navEl.querySelector('[data-id="'+id+'"]');
    if(row){
      row.classList.add('active');
      var parentDetails = row.closest('details');
      if(parentDetails) parentDetails.open = true;
      row.scrollIntoView({block:'nearest'});
    }

    var crumbParts = [page.section];
    if(page.subgroup) crumbParts.push(page.subgroup);
    crumbEl.innerHTML = crumbParts.map(function(c,i){
      return (i===crumbParts.length-1) ? '<b>'+escapeHtml(c)+'</b>' : escapeHtml(c);
    }).join(' <span style="opacity:.5">›</span> ');

    var kicker = page.subgroup ? page.section + ' · ' + page.subgroup : page.section;
    articleEl.innerHTML =
      '<p class="kicker">'+escapeHtml(kicker)+'</p>' +
      marked.parse(page.content);

    articleEl.querySelectorAll('a[href^="#p"]').forEach(function(a){
      var targetId = a.getAttribute('href').slice(1);
      a.addEventListener('click', function(ev){
        ev.preventDefault();
        if(isLocked(targetId)) return;
        navigate(targetId);
      });
    });

    var gateNode = buildGate(page);
    if(gateNode) articleEl.appendChild(gateNode);
    doneBtn.hidden = !!(page.quiz || page.hasPractice);
    if(!doneBtn.hidden) updateDoneBtn();

    renderPager();
    scrollEl.scrollTop = 0;
  }

  function updateDoneBtn(){
    var done = isDone(currentId);
    doneBtn.textContent = done ? '✓ Пройдено' : 'Отметить пройденным';
    doneBtn.classList.toggle('done', done);
  }
  doneBtn.addEventListener('click', function(){
    toggleDone(currentId);
    updateDoneBtn();
  });

  // ---------- gate: mini-task self-check + quiz question ----------
  function buildGate(page){
    var quiz = page.quiz;
    if(!quiz && !page.hasPractice) return null;

    var wrap = document.createElement('div');
    wrap.className = 'gate';

    if(isDone(page.id)){
      wrap.innerHTML =
        '<p class="gate-title">✓ Проверка урока</p>' +
        '<p class="gate-done">Мини-задание и тест пройдены</p>' +
        (quiz ? '<button type="button" class="btn gate-check-btn" id="gate-review-btn">Показать вопрос ещё раз</button>' +
                '<div id="gate-review" hidden></div>' : '');
      if(quiz){
        var reviewBtn = wrap.querySelector('#gate-review-btn');
        var reviewBox = wrap.querySelector('#gate-review');
        reviewBtn.addEventListener('click', function(){
          reviewBox.hidden = !reviewBox.hidden;
          if(!reviewBox.hidden && !reviewBox.dataset.filled){
            reviewBox.dataset.filled = '1';
            reviewBox.style.marginTop = '14px';
            reviewBox.innerHTML =
              '<p class="gate-q">'+escapeHtml(quiz.question)+'</p>' +
              '<div class="gate-options">' + quiz.options.map(function(opt, i){
                return '<div class="gate-option disabled'+(i===quiz.correct?' correct':'')+'">'+escapeHtml(opt)+'</div>';
              }).join('') + '</div>' +
              '<div class="gate-feedback ok">'+escapeHtml(quiz.explain)+'</div>';
          }
        });
      }
      return wrap;
    }

    var practiceChecked = !page.hasPractice;
    var quizPassed = !quiz;
    var picked = null;

    var html = '<p class="gate-title">Проверка урока</p>';
    if(page.hasPractice){
      html += '<div class="gate-row"><label class="gate-check"><input type="checkbox" id="gate-practice"> Я выполнил(а) мини-задание из этого урока</label></div>';
    }
    if(quiz){
      html += '<div class="gate-row">' +
        '<p class="gate-q">'+escapeHtml(quiz.question)+'</p>' +
        '<div class="gate-options" id="gate-options">' +
        quiz.options.map(function(opt, i){
          return '<label class="gate-option" data-i="'+i+'"><input type="radio" name="gate-quiz"> <span>'+escapeHtml(opt)+'</span></label>';
        }).join('') +
        '</div>' +
        '<div id="gate-feedback"></div>' +
        '<button type="button" class="btn gate-check-btn" id="gate-check-btn">Проверить ответ</button>' +
        '</div>';
    }
    html += '<p class="gate-hint">Следующий урок откроется, когда ' +
      (page.hasPractice && quiz ? 'чекбокс отмечен и тест решён верно.' : quiz ? 'тест решён верно.' : 'чекбокс отмечен.') +
      '</p>';
    wrap.innerHTML = html;

    function tryComplete(){
      if(practiceChecked && quizPassed){
        setDone(page.id, true);
        navigate(page.id);
      }
    }

    if(page.hasPractice){
      wrap.querySelector('#gate-practice').addEventListener('change', function(ev){
        practiceChecked = ev.target.checked;
        tryComplete();
      });
    }

    if(quiz){
      var optionsEl = wrap.querySelector('#gate-options');
      var feedbackEl = wrap.querySelector('#gate-feedback');
      var checkBtn = wrap.querySelector('#gate-check-btn');

      optionsEl.querySelectorAll('.gate-option').forEach(function(optEl){
        optEl.addEventListener('click', function(){
          if(quizPassed) return;
          picked = parseInt(optEl.dataset.i, 10);
          optionsEl.querySelectorAll('.gate-option').forEach(function(o){ o.classList.remove('picked'); });
          optEl.classList.add('picked');
          optEl.querySelector('input').checked = true;
        });
      });

      checkBtn.addEventListener('click', function(){
        if(picked === null){
          feedbackEl.innerHTML = '<div class="gate-feedback bad">Выбери один из вариантов.</div>';
          return;
        }
        if(picked === quiz.correct){
          quizPassed = true;
          optionsEl.querySelectorAll('.gate-option').forEach(function(o){
            o.classList.add('disabled');
            if(parseInt(o.dataset.i, 10) === quiz.correct) o.classList.add('correct');
          });
          checkBtn.disabled = true;
          feedbackEl.innerHTML = '<div class="gate-feedback ok">Верно! '+escapeHtml(quiz.explain)+'</div>';
          tryComplete();
        } else {
          feedbackEl.innerHTML = '<div class="gate-feedback bad">Неверно, попробуй ещё раз.</div>';
        }
      });
    }

    return wrap;
  }

  function renderPager(){
    var idx = PAGES.findIndex(function(p){ return p.id === currentId; });
    var prev = idx > 0 ? PAGES[idx-1] : null;
    var next = idx < PAGES.length-1 ? PAGES[idx+1] : null;
    pagerEl.innerHTML = '';
    if(prev){
      var pb = document.createElement('button');
      pb.className = 'pager-btn prev';
      pb.innerHTML = '<span class="dir">← Назад</span><span class="ttl">'+escapeHtml(prev.title)+'</span>';
      pb.addEventListener('click', function(){ navigate(prev.id); });
      pagerEl.appendChild(pb);
    } else {
      var sp = document.createElement('div'); sp.className='pager-spacer'; pagerEl.appendChild(sp);
    }
    if(next){
      var nb = document.createElement('button');
      var locked = isLocked(next.id);
      nb.className = 'pager-btn next' + (locked ? ' disabled' : '');
      if(locked){
        nb.disabled = true;
        nb.innerHTML = '<span class="dir">Заблокировано</span><span class="ttl">Сначала пройди этот урок</span>';
      } else {
        nb.innerHTML = '<span class="dir">Далее →</span><span class="ttl">'+escapeHtml(next.title)+'</span>';
        nb.addEventListener('click', function(){ navigate(next.id); });
      }
      pagerEl.appendChild(nb);
    } else {
      var sp2 = document.createElement('div'); sp2.className='pager-spacer'; pagerEl.appendChild(sp2);
    }
  }

  renderProgress();

  // ---------- search ----------
  var searchInput = document.getElementById('search');
  searchInput.addEventListener('input', function(){
    var q = searchInput.value.trim().toLowerCase();
    navEl.querySelectorAll('.nav-item').forEach(function(item){
      var match = !q || item.dataset.search.indexOf(q) !== -1;
      item.hidden = !match;
    });
    navEl.querySelectorAll('.nav-section').forEach(function(section){
      var visible = section.querySelectorAll('.nav-item:not([hidden])').length > 0;
      section.hidden = q && !visible;
      if(q && visible) section.open = true;
    });
    navEl.querySelectorAll('.nav-subgroup-label').forEach(function(lbl){
      var next = lbl.nextElementSibling;
      var any = false;
      while(next && next.classList && next.classList.contains('nav-item')){
        if(!next.hidden) any = true;
        next = next.nextElementSibling;
      }
      lbl.hidden = q && !any;
    });
  });

  // ---------- mobile nav ----------
  var sidebar = document.getElementById('sidebar');
  var scrim = document.getElementById('scrim');
  document.getElementById('menu-btn').addEventListener('click', function(){
    sidebar.classList.add('open'); scrim.classList.add('show');
  });
  function closeMobileNav(){
    sidebar.classList.remove('open'); scrim.classList.remove('show');
  }
  scrim.addEventListener('click', closeMobileNav);

  // ---------- initial page ----------
  var startId = loadLast();
  if(!startId || !byId[startId]) startId = PAGES[0].id;
  navigate(startId);
})();
</script>
