чем это нужно\n\nВсё, что мы делали на этой неделе — HTML, DOM, DevTools, локаторы — было подготовкой к тому, чтобы понимать, с чем работает инструмент автоматизации. Теперь пора познакомиться с самим инструментом, который будет открывать браузер, находить элементы по нашим локаторам и выполнять действия. В этом курсе это [Playwright](https://playwright.dev/python/).\n\n## Теория\n\n**Playwright** — библиотека для автоматизации браузеров. Из Python-кода она умеет открывать страницы, находить элементы, вводить текст, кликать по кнопкам и проверять результат — то есть выполнять программно те же действия, которые обычно делает руками пользователь.\n\nНапример, пользователь открывает страницу регистрации, заполняет Email, Username, Password, нажимает Registration и видит Dashboard. Для Playwright это последовательность команд: открыть страницу → найти поле → ввести текст → найти кнопку → кликнуть → проверить результат. Именно такую последовательность мы соберём в следующих уроках.\n\n### Как это устроено в общих чертах\n\nПочти любой сценарий на Playwright строится по одной схеме:\n\n1. Запустить браузер.\n2. Открыть нужную страницу по URL.\n3. Найти элементы через локаторы.\n4. Выполнить действия (ввод текста, клики).\n5. Проверить, что приложение отработало правильно.\n\nЛокатор поля Email мы уже знаем с прошлой недели:\n\n```python\npage.locator(\"[data-testid='registration-form-email-input'] input\")\n```\n\nНа прошлой неделе это была просто строка из урока про CSS-локаторы. Теперь она станет частью настоящего кода на Playwright.\n\n### Какой браузер используем\n\nPlaywright умеет управлять разными браузерами, в курсе мы используем **Chromium** — движок, на котором построены Chrome, Edge, Brave и другие. Запуск браузера выглядит так:\n\n```python\nbrowser = p.chromium.launch(headless=False)\n```\n\nПока не нужно разбирать эту строку целиком — в следующем уроке пройдёмся по каждой части. Важно понять главное: эта команда запускает браузер, которым дальше управляет Playwright.\n\n### Что значит `headless=False`\n\nПараметр `headless=False` означает, что браузер откроется в обычном видимом окне — ты своими глазами увидишь, как Playwright заполняет поля и нажимает кнопки. Это удобно на старте: не нужно гадать, что происходит внутри теста.\n\nКогда тесты уже стабильны, их часто запускают в `headless`-режиме — без видимого окна. Это удобно для серверов и CI/CD (об этом — в модуле 6), но пока видимый браузер понятнее.\n\n## Пример\n\nПока у нас нет кода — только идея. В следующем уроке (4.6) мы напишем первый рабочий скрипт, который запускает Chromium, открывает вкладку и закрывает браузер. Это и станет первым практическим применением всего, что мы обсудили.\n\n## Частые ошибки\n\n- Ожидать, что Playwright \"видит\" страницу так же, как человек — на самом деле он всегда работает через DOM и локаторы, а не через распознавание картинки.\n- Путать Playwright с расширением браузера или инструментом для вёрстки — это библиотека для автоматизации, которая используется из Python-кода.\n- Забывать, что headless-режим и видимый режим — это один и тот же Playwright, просто разный параметр запуска браузера.\n\n## Мини-задание\n\nОткрой документацию Playwright для Python (playwright.dev/python) и найди раздел про `sync_playwright`. Прочитай первый абзац — не вникай в детали API, просто убедись, что общая идея (синхронный способ работы с Playwright из Python) совпадает с тем, что описано в этом уроке.\n\n## Домашнее задание\n\nЭто домашнее задание относится ко всей неделе 8, а не только к этому уроку.\n\n**Задача:** установи Playwright и его браузеры в своём форке `boilerplate/` (если ещё не установлены):\n\n```bash\npip install -r requirements.txt\nplaywright install chromium\n```\n\nЗатем открой страницу регистрации учебного приложения (`https://nikita-filonov.github.io/qa-automation-engineer-ui-course/#/auth/registration`) через DevTools и самостоятельно, без подглядывания в таблицу из урока 4.4, найди и запиши локаторы для всех трёх полей формы и кнопки Registration.\n\n**Критерии готовности:**\n- `playwright install chromium` выполнен без ошибок.\n- В заметке (можно просто в текстовом файле, PR пока не нужен) выписаны 4 локатора: Email, Username, Password, Registration — и они совпадают с таблицей из урока 4.4.\n- Ты можешь объяснить своими словами, почему у полей формы локатор заканчивается на `input`, а у кнопки — нет.\n", "hasPractice": true, "quiz": [{"question": "Что делает параметр headless=False при запуске браузера в Playwright?", "options": ["Заставляет Playwright использовать Firefox вместо Chromium", "Отключает автоматические ожидания элементов", "Ускоряет выполнение теста за счёт отключения проверок", "Запускает браузер в обычном видимом окне, а не в фоновом режиме"], "correct": 3, "explain": "headless=False означает видимый режим браузера: во время выполнения кода можно своими глазами наблюдать, как Playwright открывает страницы и выполняет действия."}, {"question": "Что такое Playwright?", "options": ["Инструмент для вёрстки HTML-страниц", "Расширение для браузера Chrome, устанавливаемое вручную", "Библиотека для автоматизации браузеров из кода", "Плагин IDE для подсветки синтаксиса Python"], "correct": 2, "explain": "Playwright — библиотека, которая позволяет из Python-кода открывать страницы, находить элементы, вводить текст и кликать по кнопкам, то есть автоматизировать действия пользователя в браузере."}, {"question": "Какой браузерный движок используется в этом курсе по умолчанию?", "options": ["Trident", "WebKit", "Gecko", "Chromium"], "correct": 3, "explain": "В курсе используется Chromium — движок, на котором построены Google Chrome, Microsoft Edge и другие современные браузеры."}, {"question": "Какая общая последовательность действий описывает почти любой сценарий на Playwright?", "options": ["Написать HTML → сохранить файл → открыть в блокноте → закрыть редактор", "Запустить браузер → открыть страницу → найти элементы → выполнить действия → проверить результат", "Установить pytest → написать assert → запустить CI", "Открыть DevTools → скопировать селектор → вставить в Excel"], "correct": 1, "explain": "Практически любой UI-сценарий на Playwright строится по одной схеме: запуск браузера, открытие страницы, поиск элементов, выполнение действий и проверка результата."}, {"question": "Когда обычно переключаются на headless-режим вместо видимого браузера?", "options": ["Headless — это устаревший режим, использовавшийся до появления Playwright", "Когда тесты уже стабильны и запускаются на сервере или в CI/CD", "Только при тестировании мобильных приложений", "Никогда, headless вообще не используется в реальных проектах"], "correct": 1, "explain": "Headless-режим (без видимого окна) удобен для серверов и CI/CD, когда тесты уже отлажены; на старте обучения видимый браузер понятнее."}]}, {"id": "p74", "section": "Модуль 4 · Playwright + POM", "subgroup": "Неделя 9", "isOverview": false, "num": "4.6", "title": "Первый Playwright-скрипт: goto, locator, fill, click", "content": "# 4.6. Первый Playwright-скрипт: goto, locator, fill, click\n\n## Зачем это нужно\n\nЭто первый урок, где ты напишешь реально работающий код на Playwright. Дальше в модуле мы будем постоянно опираться на эти четыре операции — `goto`, `locator`, `fill`, `click` — они встречаются в любом UI-автотесте, независимо от того, что он проверяет.\n\n## Теория\n\nВажное уточнение сразу: то, что мы напишем в этом уроке — ещё не тест. Тест не просто выполняет действия, а ещё и проверяет результат через `assert` или `expect()`. Пока проверок не будет, поэтому правильнее называть файл скриптом. Про `expect()` поговорим в следующем уроке (4.7), а полноценные `pytest`-тесты у нас уже есть в `boilerplate/tests/ui/test_registration.py` — на неделе 10 разберём его архитектуру.\n\n### Запуск браузера и создание страницы\n\nЛюбой Playwright-скрипт в синхронном режиме начинается с одной и той же конструкции:\n\n```python\nfrom playwright.sync_api import sync_playwright\n\nwith sync_playwright() as p:\n    browser = p.chromium.launch(headless=False)\n    page = browser.new_page()\n\n    browser.close()\n```\n\nРазберём по частям:\n\n- `from playwright.sync_api import sync_playwright` — импортирует точку входа в Playwright.\n- `with sync_playwright() as p:` — запускает Playwright и создаёт объект `p`, через который дальше запускается браузер.\n- `browser = p.chromium.launch(headless=False)` — запускает браузер Chromium в видимом режиме.\n- `page = browser.new_page()` — создаёт новую вкладку. `page` — один из главных объектов Playwright: через него выполняется открытие страниц, поиск элементов, ввод текста, клики, проверки.\n- `browser.close()` — закрывает браузер после завершения работы.\n\nЕсли запустить такой скрипт, браузер откроется, создаст пустую вкладку и почти сразу же закроется — между действиями нет пауз, и Python выполняет их за доли секунды.\n\n### `page.goto()` — открываем страницу\n\n```python\npage.goto(\"https://nikita-filonov.github.io/qa-automation-engineer-ui-course/#/auth/registration\")\n```\n\nМетод `page.goto(url)` открывает страницу по указанному адресу. `page` — это объект, через который Playwright управляет открытой вкладкой браузера, и почти вся дальнейшая работа идёт именно через него: `page.goto(...)`, `page.locator(...)`, `page.url`.\n\n### `page.locator()` и `.fill()` — находим поле и вводим текст\n\n```python\npage.locator(\"[data-testid='registration-form-email-input'] input\").fill(\"user@example.com\")\n```\n\n`page.locator(...)` находит элемент на странице по локатору (мы разобрали эти локаторы на неделе 8). `.fill(...)` вводит текст в найденное поле. Важно: `fill` не дописывает текст в конец поля, а сначала очищает его и затем устанавливает новое значение — это то, что обычно и нужно при заполнении формы.\n\n### `.click()` — нажимаем кнопку\n\n```python\npage.locator(\"[data-testid='registration-page-registration-button']\").click()\n```\n\n`.click()` выполняет клик по найденному элементу.\n\n## Пример\n\nПолный сценарий — от открытия страницы до нажатия кнопки Registration:\n\n```python\nfrom playwright.sync_api import sync_playwright\n\nwith sync_playwright() as p:\n    browser = p.chromium.launch(headless=False)\n    page = browser.new_page()\n\n    page.goto(\n        \"https://nikita-filonov.github.io/qa-automation-engineer-ui-course/#/auth/registration\"\n    )\n\n    page.locator(\"[data-testid='registration-form-email-input'] input\").fill(\"user@example.com\")\n    page.locator(\"[data-testid='registration-form-username-input'] input\").fill(\"testuser\")\n    page.locator(\"[data-testid='registration-form-password-input'] input\").fill(\"password123\")\n    page.locator(\"[data-testid='registration-page-registration-button']\").click()\n\n    browser.close()\n```\n\nПорядок действий важен: Playwright выполняет команды сверху вниз, и нельзя заполнить поле до того, как открылась страница, или нажать кнопку раньше, чем заполнены обязательные поля.\n\nЧтобы увидеть результат своими глазами (иначе браузер закроется слишком быстро), временно добавь перед `browser.close()`:\n\n```python\ninput(\"Нажмите Enter для завершения...\")\n```\n\nПосле проверки эту строку нужно убрать — это временный инструмент отладки, а не часть сценария.\n\nСохрани скрипт как `registration_script.py` в корне своего форка `boilerplate/` (это отдельный экспериментальный файл, не путай с тестами в `tests/ui/`) и запусти:\n\n```bash\npython -m registration_script\n```\n\n## Частые ошибки\n\n- Забыть, что `fill()` требует, чтобы элемент уже был на странице — если локатор написан с ошибкой, Playwright будет ждать появления элемента и в итоге упадёт с таймаутом.\n- Перепутать порядок действий: попытаться нажать кнопку до заполнения полей.\n- Не активировать виртуальное окружение перед запуском — тогда Python не найдёт установленный `playwright`.\n- Забыть выполнить `playwright install chromium` — без этого браузер не запустится, и Playwright сам подскажет нужную команду в тексте ошибки.\n\n## Мини-задание\n\nВозьми скрипт из примера и измени значения email, username и password на свои собственные. Добавь `input(\"Нажмите Enter для завершения...\")` перед `browser.close()` и убедись, что все три поля действительно заполнились правильными значениями — глазами, в открывшемся окне браузера.\n", "hasPractice": true, "quiz": [{"question": "Что делает метод .fill(...) при заполнении поля ввода в Playwright?", "options": ["Проверяет, что поле уже содержит нужный текст", "Кликает по полю, но не вводит никакого текста", "Дописывает текст в конец текущего значения поля", "Сначала очищает поле, а затем устанавливает новое значение"], "correct": 3, "explain": "fill() не дописывает текст к существующему значению — он сначала очищает поле и затем устанавливает переданное значение целиком."}, {"question": "Чем скрипт из этого урока принципиально отличается от полноценного теста?", "options": ["Скрипт использует другой язык программирования", "Скрипт не умеет открывать страницы", "Скрипт не содержит проверок результата, только выполняет действия", "Скрипт нельзя запустить из терминала"], "correct": 2, "explain": "Тест не просто выполняет действия, а ещё и проверяет результат через assert или expect(); пока в скрипте таких проверок нет, поэтому это скрипт, а не тест."}, {"question": "Что делает конструкция with sync_playwright() as p:?", "options": ["Открывает файл с локаторами", "Создаёт новую вкладку браузера", "Запускает Playwright и создаёт объект, через который управляют браузерами", "Запускает pytest в синхронном режиме"], "correct": 2, "explain": "Это обязательная точка входа в Playwright: она запускает Playwright и создаёт объект p, через который дальше запускается браузер."}, {"question": "Какой метод открывает страницу по указанному URL?", "options": ["browser.navigate()", "page.goto()", "page.url()", "page.open()"], "correct": 1, "explain": "page.goto(url) — метод, который открывает страницу по переданному адресу."}, {"question": "Почему в скрипте важен порядок вызовов page.goto(...), .fill(...), .click()?", "options": ["Playwright выполняет команды последовательно сверху вниз, и нельзя, например, нажать кнопку раньше, чем заполнены поля", "Порядок не важен, Playwright сам расставит вызовы правильно", "Порядок влияет только на скорость выполнения, но не на результат", "Порядок важен только при запуске в headless-режиме"], "correct": 0, "explain": "Python и Playwright выполняют команды сверху вниз: сценарий теряет смысл, если поменять местами открытие страницы, заполнение формы и клик по кнопке."}]}, {"id": "p75", "section": "Модуль 4 · Playwright + POM", "subgroup": "Неделя 9", "isOverview": false, "num": "4.7", "title": "Автоматические ожидания и expect()", "content": "# 4.7. Автоматические ожидания и expect()\n\n## Зачем это нужно\n\nРеальные веб-страницы не появляются мгновенно: после клика может произойти переход на другой URL, элемент может отрисоваться с небольшой задержкой, форма может замениться сообщением об успехе. Если тест проверяет состояние страницы раньше, чем оно наступило, тест падает не потому, что приложение сломано, а потому что тест \"не подождал\". Это одна из самых частых причин нестабильных (flaky) UI-тестов, и Playwright решает эту проблему на уровне архитектуры — важно понимать, как именно.\n\n## Теория\n\n### Проблема: страница обновляется не мгновенно\n\nДопустим, мы кликнули на кнопку Registration и сразу проверяем URL:\n\n```python\npage.locator(\"[data-testid='registration-page-registration-button']\").click()\nassert page.url == \"https://nikita-filonov.github.io/qa-automation-engineer-ui-course/#/dashboard\"\n```\n\nЕсли переход на Dashboard занимает даже небольшое время, `assert` может сработать раньше, чем URL успеет измениться, — и тест упадёт, хотя приложение работает правильно.\n\n### Явные ожидания vs автоматические ожидания\n\nОдно из решений этой проблемы, которое встречается в других инструментах автоматизации — явные ожидания: явно прописать в коде \"подожди N секунд\" или \"жди появления элемента до N секунд, проверяя каждые полсекунды\". Такой подход рабочий, но у него есть минусы: фиксированные паузы либо слишком короткие (тест всё равно падает), либо слишком длинные (тест выполняется медленнее, чем нужно).\n\nPlaywright устроен иначе — у него встроены **автоматические ожидания (auto-waiting)**. Большинство действий (`click()`, `fill()`) и все проверки через `expect()` сами ждут, пока элемент не окажется в нужном состоянии (появится в DOM, станет видимым, станет доступным для взаимодействия), и только после этого выполняются. Ждать вручную с помощью `time.sleep()` в Playwright-тестах, как правило, не нужно — это ключевая идея, отличающая Playwright от многих более старых инструментов автоматизации.\n\n### `expect()` — проверки с автоматическим ожиданием\n\nДля проверок в Playwright используется функция `expect`:\n\n```python\nfrom playwright.sync_api import expect\n```\n\nПример проверки URL:\n\n```python\nexpect(page).to_have_url(\"https://nikita-filonov.github.io/qa-automation-engineer-ui-course/#/dashboard\")\n```\n\nЭто не разовая сверка значения, как обычный `assert`. `expect(...)` умеет **повторно проверять условие в течение отведённого времени**, пока оно не станет истинным (или пока не истечёт таймаут). Если переход на Dashboard занимает долю секунды, `expect` дождётся этого перехода и только потом либо подтвердит успех, либо, если условие так и не выполнилось, завершит тест ошибкой с понятным сообщением.\n\nЭто же справедливо для проверок элементов:\n\n```python\ndashboard_title = page.locator(\"[data-testid='dashboard-toolbar-title-text']\")\nexpect(dashboard_title).to_be_visible()\nexpect(dashboard_title).to_have_text(\"Dashboard\")\n```\n\n`to_be_visible()` дожидается, пока элемент не станет видимым на странице. `to_have_text(...)` дожидается, пока текст элемента не совпадёт с ожидаемым.\n\n### Почему `expect()`, а не `assert`\n\nМожно было бы написать:\n\n```python\nassert page.url == expected_url\n```\n\nНо `assert` проверяет значение только один раз, в момент выполнения строки — без повторных попыток и без ожидания. `expect()` устроен так, что умеет ждать нужное состояние страницы, и именно поэтому в Playwright-тестах для проверок почти всегда используется `expect()`, а не обычный `assert`. Ты увидишь этот же принцип в `BasePage.check_current_url()` из `boilerplate/pages/base_page.py` на неделе 10 — там тоже используется `expect(self.page).to_have_url(...)`, а не `assert self.page.url == ...`.\n\n## Пример\n\nПолный фрагмент с проверками после регистрации:\n\n```python\nfrom playwright.sync_api import expect, sync_playwright\n\nwith sync_playwright() as p:\n    browser = p.chromium.launch(headless=False)\n    page = browser.new_page()\n\n    page.goto(\"https://nikita-filonov.github.io/qa-automation-engineer-ui-course/#/auth/registration\")\n\n    page.locator(\"[data-testid='registration-form-email-input'] input\").fill(\"user@example.com\")\n    page.locator(\"[data-testid='registration-form-username-input'] input\").fill(\"testuser\")\n    page.locator(\"[data-testid='registration-form-password-input'] input\").fill(\"password123\")\n    page.locator(\"[data-testid='registration-page-registration-button']\").click()\n\n    expect(page).to_have_url(\n        \"https://nikita-filonov.github.io/qa-automation-engineer-ui-course/#/dashboard\"\n    )\n\n    dashboard_title = page.locator(\"[data-testid='dashboard-toolbar-title-text']\")\n    expect(dashboard_title).to_be_visible()\n    expect(dashboard_title).to_have_text(\"Dashboard\")\n\n    browser.close()\n```\n\nМы проверяем и URL, и заголовок не потому, что это избыточно, а потому что это два разных факта: URL подтверждает, что приложение выполнило переход на нужный маршрут, а заголовок подтверждает, что страница действительно отрисовалась пользователю. Одной проверки URL не всегда достаточно — адрес мог измениться, а сама страница зависнуть на пустом экране.\n\n## Частые ошибки\n\n- Использовать `time.sleep()` \"на всякий случай\" вместо того, чтобы довериться `expect()` — это делает тесты медленнее и не решает проблему по-настоящему (если реальная задержка окажется больше, чем `sleep`, тест всё равно упадёт).\n- Проверять состояние через `assert page.locator(...).is_visible()` сразу после действия — в отличие от `expect(...).to_be_visible()`, такая проверка не ждёт и может сработать до того, как элемент появится.\n- Проверять только один признак результата (например, только URL) там, где для уверенности стоит проверить ещё и содержимое страницы.\n\n## Мини-задание\n\nВозьми скрипт из урока 4.6, добавь импорт `expect` и допиши в конец проверку `expect(page).to_have_url(...)` на страницу Dashboard. Запусти скрипт дважды: один раз с правильным URL в проверке, другой раз — намеренно с опечаткой в адресе, чтобы увидеть, как выглядит сообщение об ошибке, когда `expect()` не может дождаться нужного состояния.\n", "hasPractice": true, "quiz": [{"question": "Чем expect(page).to_have_url(...) принципиально отличается от assert page.url == \"...\"?", "options": ["Разницы нет, это два взаимозаменяемых способа записать одну и ту же проверку", "expect() выполняется быстрее, потому что вообще не обращается к браузеру", "assert работает только внутри pytest, а expect — только в обычных скриптах без pytest", "expect() умеет повторно проверять условие в течение отведённого времени, ожидая нужное состояние страницы"], "correct": 3, "explain": "expect() — это проверка с автоматическим ожиданием: она повторяет попытку, пока условие не станет истинным или не истечёт таймаут, тогда как обычный assert сверяет значение только один раз в момент выполнения строки."}, {"question": "В чём главный недостаток фиксированных пауз (например, time.sleep(3)) в UI-тестах?", "options": ["Такая пауза автоматически увеличивает таймаут expect() вдвое", "Playwright технически не поддерживает time.sleep()", "Пауза либо слишком короткая (тест всё равно падает), либо слишком длинная (тест выполняется медленнее, чем нужно)", "time.sleep() ломает синтаксис Python"], "correct": 2, "explain": "Фиксированная пауза — это угадывание нужного времени ожидания: она либо избыточна, либо недостаточна, в отличие от auto-waiting, который ждёт ровно столько, сколько нужно."}, {"question": "Что делает expect(locator).to_be_visible()?", "options": ["Удаляет элемент со страницы после проверки", "Кликает по элементу, если он виден", "Немедленно возвращает True или False без ожидания", "Ждёт, пока элемент не появится в DOM и не станет видимым, и только потом завершает проверку"], "correct": 3, "explain": "to_be_visible() — это проверка с автоматическим ожиданием: она дожидается, пока элемент не станет видимым, а не проверяет состояние один раз в момент вызова."}, {"question": "Как называется встроенный механизм Playwright, благодаря которому действия и проверки сами ждут нужное состояние элемента?", "options": ["Manual polling", "Lazy loading", "Deferred execution", "Auto-waiting (автоматическое ожидание)"], "correct": 3, "explain": "Auto-waiting — ключевая идея Playwright: большинство действий и все проверки через expect() сами ждут нужное состояние элемента, без ручных пауз."}, {"question": "Почему тест может упасть, если сразу после клика проверить page.url через обычный assert?", "options": ["assert в принципе не работает с URL страницы", "URL нельзя сравнивать оператором == в Python", "Переход на новую страницу может занять время, а assert проверяет значение только один раз, не дожидаясь изменения", "page.url всегда возвращает пустую строку сразу после клика"], "correct": 2, "explain": "Если переход на другую страницу происходит не мгновенно, обычный assert может сработать раньше, чем URL успеет измениться, и тест упадёт, хотя приложение работает правильно."}]}, {"id": "p76", "section": "Модуль 4 · Playwright + POM", "subgroup": "Неделя 9", "isOverview": false, "num": "4.8", "title": "Работа с формами: fill, click, select, чекбоксы", "content": "# 4.8. Работа с формами: fill, click, select, чекбоксы\n\n## Зачем это нужно\n\nФормы регистрации, логина, фильтров, настроек профиля, оформления заказа — это, пожалуй, самый частый объект UI-тестирования. До сих пор мы работали только с текстовыми полями и одной кнопкой. В реальных формах встречаются ещё выпадающие списки (`select`) и чекбоксы (`checkbox`) — с ними тоже нужно уметь работать, даже если в нашем учебном сценарии регистрации их нет.\n\n## Теория\n\nPlaywright предоставляет отдельные методы под разные типы полей — это логично, ведь ввести текст в `input` и выбрать пункт в `select` физически разные действия для пользователя, и код должен их отражать.\n\n### Текстовые поля: `.fill()`\n\nУже знакомый метод для однострочных (`input`) и многострочных (`textarea`) полей:\n\n```python\npage.locator(\"[data-testid='registration-form-email-input'] input\").fill(\"user@example.com\")\n```\n\n`.fill()` полностью заменяет содержимое поля — сначала очищает его, затем вставляет новое значение.\n\n### Кнопки и клики: `.click()`\n\n```python\npage.locator(\"[data-testid='registration-page-registration-button']\").click()\n```\n\n`.click()` подходит не только для кнопок `<button>`, но и для любых кликабельных элементов — ссылок, иконок, пунктов меню.\n\n### Выпадающие списки: `.select_option()`\n\nДля тега `<select>` в Playwright используется отдельный метод — `select_option()`. Он может принимать значение атрибута `value`, видимый текст варианта (`label`) или индекс:\n\n```python\npage.locator(\"select[name='country']\").select_option(value=\"by\")\n```\n\nТак работает выбор пункта в выпадающем списке из стандартного HTML-элемента `<select>`. Если на странице используется кастомный компонент выбора (например, стилизованный дропдаун из UI-библиотеки, где вместо `<select>` набор `<div>` и `<li>`), `select_option()` не подойдёт — там придётся кликать по элементу, который открывает список, а затем по нужному пункту как по обычному элементу через `.click()`. Какой вариант перед тобой — стандартный `<select>` или кастомный компонент — всегда можно понять через DevTools, посмотрев на реальные теги в разметке.\n\n### Чекбоксы и радиокнопки: `.check()` / `.uncheck()`\n\nДля `<input type=\"checkbox\">` и `<input type=\"radio\">` вместо клика используются методы `.check()` и `.uncheck()`:\n\n```python\npage.locator(\"input[name='remember_me']\").check()\n```\n\n`.check()` установит чекбокс в отмеченное состояние, если он ещё не отмечен (если уже отмечен — ничего не сделает, что удобнее, чем обычный `.click()`, который просто переключил бы состояние). `.uncheck()` работает наоборот — снимает отметку.\n\nПроверить состояние чекбокса можно через `expect()`:\n\n```python\nexpect(page.locator(\"input[name='remember_me']\")).to_be_checked()\n```\n\n### Общий принцип\n\nВсе эти методы объединяет одно: сначала мы получаем локатор через `page.locator(...)`, а затем вызываем на нём метод, соответствующий типу элемента и нужному действию. Playwright сам разбирается, как физически \"нажать\" на элемент нужного типа — вам не нужно эмулировать конкретные события мыши или клавиатуры.\n\n## Пример\n\nПредставим гипотетическую (не из нашего учебного приложения) форму с чекбоксом согласия и выбором страны:\n\n```python\nfrom playwright.sync_api import expect, sync_playwright\n\nwith sync_playwright() as p:\n    browser = p.chromium.launch(headless=False)\n    page = browser.new_page()\n\n    page.goto(\"https://example.com/signup\")\n\n    page.locator(\"input[name='email']\").fill(\"user@example.com\")\n    page.locator(\"select[name='country']\").select_option(value=\"by\")\n    page.locator(\"input[name='agreement']\").check()\n\n    expect(page.locator(\"input[name='agreement']\")).to_be_checked()\n\n    page.locator(\"button[type='submit']\").click()\n\n    browser.close()\n```\n\nОбрати внимание: три разных типа полей — три разных метода (`fill`, `select_option`, `check`), но единый подход к поиску элемента через `page.locator(...)`.\n\n## Частые ошибки\n\n- Пытаться заполнить `<select>` через `.fill()` — это текстовый метод, для выпадающих списков он не подходит.\n- Использовать `.click()` для чекбокса вместо `.check()`/`.uncheck()` — клик просто переключит текущее состояние, и если чекбокс уже был отмечен, тест случайно его снимет.\n- Не учитывать, что визуально похожий на `<select>` компонент на самом деле собран из `<div>` — в таком случае `select_option()` не найдёт нужного элемента, потому что физически в разметке нет тега `<select>`.\n\n## Мини-задание\n\nОткрой в браузере `https://httpbin.org/forms/post` (тот же httpbin, что и в уроке 3.4, только с обычной HTML-формой вместо API) — там есть текстовое поле, радиокнопки и чекбоксы `topping` (`bacon`, `cheese`, `onion`, `mushroom`). По образцу скрипта из урока 4.6 напиши и запусти Playwright-скрипт: заполни поле `custname` через `.fill()`, отметь минимум два чекбокса из `topping` через `.check()`, проверь оба через `expect(...).to_be_checked()`, затем нажми кнопку отправки формы. После сабмита httpbin показывает страницу с тем, что было отправлено, — проверь на ней через `expect(page.locator(\"body\")).to_contain_text(...)`, что твои данные (например, значение `custname`) действительно попали в отправленную форму.\n", "hasPractice": true, "quiz": [{"question": "Какой метод Playwright используется для отметки чекбокса (<input type='checkbox'>)?", "options": [".select_option()", ".click(), потому что других способов не существует", ".check()", ".fill()"], "correct": 2, "explain": "Для чекбоксов и радиокнопок в Playwright есть отдельные методы .check()/.uncheck() — они устанавливают нужное состояние явно, а не просто переключают текущее, как это сделал бы обычный клик."}, {"question": "Какой метод Playwright используется для выбора пункта в стандартном HTML-элементе <select>?", "options": [".fill()", ".check()", ".pick_option()", ".select_option()"], "correct": 3, "explain": "Для тега <select> используется отдельный метод select_option(), который может принимать value, видимый текст варианта или индекс."}, {"question": "Почему .select_option() может не сработать для компонента, который визуально выглядит как выпадающий список?", "options": ["select_option() устарел и заменён на .fill()", "Если это кастомный компонент (набор div/li вместо тега select), в разметке физически нет тега select, и метод не найдёт нужный элемент", "select_option() требует предварительного вызова .click()", "select_option() работает только в Firefox"], "correct": 1, "explain": "Если вместо стандартного <select> используется стилизованный компонент из div и li, select_option() не подойдёт — нужно кликать по элементам как по обычным DOM-узлам."}, {"question": "Как проверить, что чекбокс действительно находится в отмеченном состоянии?", "options": ["expect(locator).to_be_visible()", "expect(locator).to_be_checked()", "assert locator.value == True", "expect(locator).to_have_text(\"checked\")"], "correct": 1, "explain": "to_be_checked() — специальная проверка для чекбоксов и радиокнопок, подтверждающая, что элемент находится в отмеченном состоянии."}, {"question": "Чем .check() отличается от обычного .click() применительно к чекбоксу?", "options": [".check() работает только с радиокнопками, а не с чекбоксами", ".check() устанавливает отмеченное состояние, если оно ещё не установлено, тогда как .click() просто переключает текущее состояние", "Разницы нет, это синонимы", ".check() всегда снимает отметку, а .click() устанавливает"], "correct": 1, "explain": ".check() идемпотентен: если чекбокс уже отмечен, повторный вызов ничего не изменит, тогда как .click() всегда переключает состояние на противоположное."}]}, {"id": "p77", "section": "Модуль 4 · Playwright + POM", "subgroup": "Неделя 9", "isOverview": false, "num": "4.9", "title": "Попапы, алерты и модальные окна", "content": "# 4.9. Попапы, алерты и модальные окна\n\n## Зачем это нужно\n\nРано или поздно в реальном проекте встретится: браузерное окно подтверждения (\"Вы уверены, что хотите удалить?\"), ссылка, открывающая новую вкладку, или модальное окно с формой поверх страницы. Каждый из этих случаев устроен по-своему, и важно понимать разницу, чтобы не пытаться, например, искать локатором браузерный `alert()` — он не является частью DOM-дерева страницы.\n\n## Теория\n\nЗдесь стоит разделить три разных вещи, которые часто путают под общим словом \"попап\".\n\n### 1. Нативные диалоги браузера: `alert`, `confirm`, `prompt`\n\nЭто встроенные диалоговые окна самого браузера — `window.alert(...)`, `window.confirm(...)`, `window.prompt(...)`, а также диалог подтверждения ухода со страницы (`beforeunload`). Они не являются HTML-элементами и не находятся в DOM, поэтому `page.locator(...)` их не увидит.\n\nPlaywright взаимодействует с ними через событие `dialog`:\n\n```python\ndef handle_dialog(dialog):\n    print(dialog.message)\n    dialog.accept()\n\npage.on(\"dialog\", handle_dialog)\n```\n\nВажный момент поведения: если на странице появляется такой диалог, а обработчик `page.on(\"dialog\", ...)` не зарегистрирован, Playwright автоматически закрывает диалог сам (аналог нажатия \"Отмена\"), чтобы тест не завис в ожидании. Если тебе нужно явно принять или отклонить диалог — регистрируй обработчик и внутри него вызывай `dialog.accept()` (можно передать текст для `prompt`) или `dialog.dismiss()`.\n\n### 2. Новые вкладки и окна: `target=\"_blank\"`, `window.open()`\n\nЕсли клик по ссылке или кнопке открывает не текущую страницу, а новую вкладку, у тебя появляется новый объект `page`, за которым нужно проследить отдельно. Для этого Playwright предоставляет `expect_popup()`:\n\n```python\nwith page.expect_popup() as popup_info:\n    page.locator(\"a[target='_blank']\").click()\n\nnew_page = popup_info.value\nnew_page.wait_for_load_state()\n```\n\n`expect_popup()` — это менеджер контекста, который ждёт появления новой вкладки в момент клика и возвращает её как отдельный объект `page`. Дальше с этим объектом работаем так же, как с обычной страницей: ищем локаторы, кликаем, проверяем.\n\n### 3. Модальные окна внутри страницы (custom-модалки)\n\nЭто самый частый случай в современных SPA-приложениях (React, Vue и подобных) — визуально модальное окно выглядит как всплывающее поверх страницы, но технически это обычный `<div>` с определённым `role=\"dialog\"` или собственным `data-testid`, который просто отрисован поверх остального контента через CSS. Такое окно — часть DOM-дерева, и никакой особой техники не нужно: находишь его как обычный элемент через `page.locator(...)` и работаешь с полями и кнопками внутри него так же, как с любой другой формой.\n\n```python\nmodal = page.locator(\"[data-testid='confirm-delete-modal']\")\nexpect(modal).to_be_visible()\n\nmodal.locator(\"button:has-text('Confirm')\").click()\n```\n\n### Как отличить, с чем ты имеешь дело\n\nОткрой DevTools и посмотри на модальное окно во вкладке Elements. Если это HTML-элемент (`div`, `dialog` и т.п.) — это случай 3, работай через обычные локаторы. Если элемента в DOM нет, а окно всё равно появилось — скорее всего, это нативный `alert`/`confirm`/`prompt`, и нужен `page.on(\"dialog\", ...)`.\n\n## Пример\n\nГипотетический пример регистрации обработчика диалога перед действием, которое его вызывает:\n\n```python\npage.on(\"dialog\", lambda dialog: dialog.accept())\npage.locator(\"[data-testid='delete-account-button']\").click()\n```\n\nОбработчик регистрируется один раз и будет автоматически обрабатывать любые диалоги, которые появятся на странице после этой строки.\n\n## Частые ошибки\n\n- Пытаться найти `alert()` через `page.locator(...)` — он не в DOM, так работать не будет.\n- Забыть зарегистрировать `page.on(\"dialog\", ...)` до клика, который вызывает диалог — обработчик должен быть подписан заранее, а не после того, как диалог уже появился.\n- Принять кастомное модальное окно (обычный `div` с `data-testid`) за нативный диалог и пытаться работать с ним через `dialog.accept()` вместо обычного локатора.\n\n## Мини-задание\n\nОткрой `https://the-internet.herokuapp.com/javascript_alerts` — учебная страница с тремя кнопками, каждая вызывает нативный диалог браузера. Напиши Playwright-скрипт: сначала кликни по кнопке \"Click for JS Alert\" БЕЗ зарегистрированного `page.on(\"dialog\", ...)` — по теории выше Playwright должен закрыть диалог сам. Затем зарегистрируй обработчик с `dialog.accept()` и кликни ещё раз — проверь через `expect(page.locator(\"#result\")).to_have_text(\"You successfully clicked an alert\")`. Повтори для кнопки \"Click for JS Confirm\", но один раз прими диалог (`dialog.accept()`) и проверь `#result` на текст `\"You clicked: Ok\"`, а другой раз — отклони (`dialog.dismiss()`) и проверь `\"You clicked: Cancel\"`.\n", "hasPractice": true, "quiz": [{"question": "Как правильно обработать нажатие кнопки, которая вызывает нативный браузерный confirm()?", "options": ["Использовать expect_popup(), потому что confirm() всегда открывает новую вкладку браузера", "Найти confirm() через page.locator() и кликнуть по нему как по обычному элементу", "Ничего не делать — confirm() автоматически становится частью DOM и обрабатывается как обычный элемент", "Зарегистрировать обработчик page.on(\"dialog\", ...) до клика и вызвать внутри него dialog.accept() или dialog.dismiss()"], "correct": 3, "explain": "Нативные диалоги (alert/confirm/prompt) не являются частью DOM и не находятся через locator — для них Playwright предоставляет событие dialog и методы dialog.accept()/dialog.dismiss(), обработчик на которое нужно зарегистрировать заранее."}, {"question": "Что происходит с нативным диалогом браузера (например, confirm()), если обработчик page.on(\"dialog\", ...) не зарегистрирован?", "options": ["Тест зависает навсегда в ожидании ручного нажатия", "Playwright автоматически закрывает диалог сам, чтобы тест не завис", "Playwright выбрасывает исключение сразу при запуске браузера", "Диалог остаётся открытым до конца выполнения всего тестового прогона"], "correct": 1, "explain": "Если обработчик не зарегистрирован, Playwright автоматически закрывает нативный диалог сам, аналогично нажатию Отмена — это защищает тест от зависания."}, {"question": "Как в Playwright отследить новую вкладку, которая открылась после клика по ссылке с target='_blank'?", "options": ["Новую вкладку невозможно отследить в Playwright", "Через обычный page.locator(), потому что новая вкладка — часть DOM текущей страницы", "Через менеджер контекста page.expect_popup(), который возвращает новый объект page", "Через dialog.accept()"], "correct": 2, "explain": "page.expect_popup() — менеджер контекста, который ждёт появления новой вкладки в момент клика и возвращает её как отдельный объект page для дальнейшей работы."}, {"question": "Как правильно работать с модальным окном, которое визуально выглядит как попап, но в DevTools видно, что это обычный <div> с data-testid?", "options": ["Обязательно использовать page.on(\"dialog\", ...)", "Такие модальные окна нельзя автоматизировать", "Использовать только dialog.dismiss()", "Работать с ним как с обычным элементом DOM — через page.locator(...) и стандартные методы"], "correct": 3, "explain": "Кастомные модальные окна (обычные div, отрисованные поверх страницы через CSS) — часть DOM, поэтому с ними работают через обычные локаторы, без специальной техники для диалогов."}, {"question": "Как отличить нативный browser-диалог от кастомного модального окна на странице?", "options": ["Нужно посмотреть во вкладке Elements DevTools: если элемента окна нет в DOM, это, скорее всего, нативный диалог", "Нативный диалог всегда красного цвета", "Разницы нет, оба случая обрабатываются одинаково", "Кастомные модальные окна нельзя закрыть кнопкой"], "correct": 0, "explain": "Если модальное окно — это HTML-элемент, видимый во вкладке Elements, работаем через locator; если элемента в DOM нет, а окно всё равно появилось — это нативный диалог, и нужен page.on(\"dialog\", ...)."}]}, {"id": "p78", "section": "Модуль 4 · Playwright + POM", "subgroup": "Неделя 9", "isOverview": false, "num": "4.10", "title": "Проверка состояния страницы через expect()", "content": "# 4.10. Проверка состояния страницы через expect()\n\n## Зачем это нужно\n\nТест без проверок — это просто скрипт: он что-то делает, но не отвечает на вопрос \"получилось или нет\". Мы уже видели `expect()` в деле на примере URL и заголовка Dashboard. Теперь соберём более полную картину — какие проверки вообще бывают и когда какую использовать. Именно этот набор проверок ты будешь использовать в методах `check_*` при разборе `RegistrationPage` и `DashboardPage` на неделе 10.\n\n## Теория\n\nВсе проверки в Playwright строятся по одному шаблону:\n\n```python\nexpect(объект).to_что-то(ожидаемое_значение)\n```\n\nГде `объект` — это либо `page` (для проверок уровня страницы, например URL), либо результат `page.locator(...)` (для проверок конкретного элемента).\n\n### Проверки видимости\n\n```python\nexpect(locator).to_be_visible()\nexpect(locator).to_be_hidden()\n```\n\n`to_be_visible()` дожидается, пока элемент не появится в DOM и не станет видимым (не скрыт через CSS, не имеет нулевого размера). `to_be_hidden()` — обратная проверка: элемента либо нет в DOM, либо он скрыт.\n\n### Проверки текста\n\n```python\nexpect(locator).to_have_text(\"Dashboard\")\nexpect(locator).to_contain_text(\"Dashboard\")\n```\n\n`to_have_text(...)` проверяет точное совпадение текста элемента. `to_contain_text(...)` — что текст элемента содержит указанную подстроку. Используй `to_contain_text`, когда важна не вся строка целиком, а только её часть (например, сообщение об ошибке, где кроме текста есть ещё и код ошибки).\n\n### Проверки значения поля\n\n```python\nexpect(locator).to_have_value(\"user@example.com\")\n```\n\nПроверяет текущее значение `input` или `textarea` — полезно после `.fill()`, чтобы убедиться, что значение действительно установилось (хотя обычно в этом нет необходимости — `.fill()` сам ждёт, пока поле не будет готово к вводу).\n\n### Проверки состояния элемента\n\n```python\nexpect(locator).to_be_enabled()\nexpect(locator).to_be_disabled()\nexpect(locator).to_be_checked()\n```\n\nЭти проверки полезны там, где интерфейс явно блокирует действия — например, кнопка отправки формы становится активной только после заполнения обязательных полей.\n\n### Проверка URL страницы\n\n```python\nexpect(page).to_have_url(\"https://nikita-filonov.github.io/qa-automation-engineer-ui-course/#/dashboard\")\n```\n\nМы уже использовали эту проверку для перехода на Dashboard. Обрати внимание: здесь в `expect()` передаётся не локатор, а сам объект `page`.\n\n### Проверка количества элементов\n\n```python\nexpect(page.locator(\"[data-testid='user-row']\")).to_have_count(3)\n```\n\nПолезно для списков — например, убедиться, что после фильтрации осталось ровно нужное количество строк таблицы.\n\n### Отрицание проверки\n\nУ любой проверки есть форма с отрицанием — префикс `not_`:\n\n```python\nexpect(locator).not_to_be_visible()\nexpect(locator).not_to_have_text(\"Error\")\n```\n\nЭто удобнее, чем оборачивать проверку в `assert not ...`: `not_to_be_visible()` так же умеет ждать, пока элемент не исчезнет, а не просто проверяет состояние один раз.\n\n## Пример\n\nСобираем несколько проверок в одном сценарии — открыли Dashboard и проверили сразу несколько фактов о странице:\n\n```python\nfrom playwright.sync_api import expect\n\nexpect(page).to_have_url(\"https://nikita-filonov.github.io/qa-automation-engineer-ui-course/#/dashboard\")\n\ndashboard_title = page.locator(\"[data-testid='dashboard-toolbar-title-text']\")\nexpect(dashboard_title).to_be_visible()\nexpect(dashboard_title).to_have_text(\"Dashboard\")\n```\n\nИменно эти три строки в чуть другом виде ты увидишь в методе `DashboardPage.check_visible_toolbar_title()` в `boilerplate/pages/dashboard_page.py` — переход к Page Object в следующем уроке не меняет сути проверок, а просто переносит их в отдельный класс.\n\n## Частые ошибки\n\n- Использовать `to_have_text(...)`, когда нужно проверить только часть текста — тест станет хрупким при малейшем изменении формулировки. В таких случаях лучше `to_contain_text(...)`.\n- Проверять состояние элемента через `.is_visible()` (обычный метод, без ожидания) вместо `expect(...).to_be_visible()` — первый вариант не умеет ждать и может дать ложный отрицательный результат.\n- Забывать про `not_to_...` и писать `assert not expect(...)` — так `expect()` не работает, у него есть собственный синтаксис отрицания.\n\n## Мини-задание\n\nНа странице регистрации учебного приложения кнопка Registration заблокирована (атрибут `disabled`), пока форма не заполнена, — убедись в этом сам через DevTools. Затем напиши и запусти скрипт: открой страницу регистрации и сразу, до заполнения формы, проверь `expect(registration_button).to_be_disabled()`; затем заполни все поля формы через `.fill()` и проверь `expect(registration_button).to_be_enabled()`.\n\n## Домашнее задание\n\nЭто домашнее задание относится ко всей неделе 9.\n\n**Задача:** напиши (и запусти) отдельный Python-скрипт `registration_script.py` в своём форке `boilerplate/`, который выполняет полный сценарий регистрации на учебном приложении: открывает страницу регистрации, заполняет форму, нажимает Registration и проверяет через `expect()` и URL, и заголовок Dashboard.\n\n**Критерии готовности:**\n- Скрипт запускается командой `python -m registration_script` без ошибок.\n- В скрипте использованы `page.goto`, `page.locator`, `.fill`, `.click` и минимум две проверки через `expect()` (URL и заголовок).\n- Ты можешь объяснить, чем `expect()` отличается от обычного `assert` применительно к этому сценарию.\n\nЭто подготовка к неделе 10 — на ней мы возьмём готовый, уже работающий `pytest`-тест с точно таким же сценарием (`boilerplate/tests/ui/test_registration.py`) и разберём, как он устроен внутри через Page Object.\n", "hasPractice": true, "quiz": [{"question": "Какую проверку стоит использовать, если нужно убедиться, что элемент содержит только часть ожидаемого текста (например, сообщение об ошибке с дополнительным кодом)?", "options": ["expect(locator).to_be_visible()", "expect(locator).to_have_text(...)", "expect(locator).to_contain_text(...)", "assert locator.text_content() is not None"], "correct": 2, "explain": "to_contain_text() проверяет, что текст элемента содержит указанную подстроку, тогда как to_have_text() требует точного совпадения всей строки целиком."}, {"question": "Какая проверка используется для подтверждения текущего адреса страницы?", "options": ["expect(page).to_have_url(...)", "expect(locator).to_have_url(...)", "expect(page).to_be_visible()", "assert page.locator(\"url\").text() == ..."], "correct": 0, "explain": "Проверка URL выполняется на уровне всей страницы: в expect() передаётся объект page, а не локатор конкретного элемента."}, {"question": "Какая проверка подходит, чтобы убедиться, что в списке ровно 3 строки таблицы?", "options": ["assert len(locator) == 3", "expect(locator).to_be_visible()", "expect(locator).to_have_text(3)", "expect(locator).to_have_count(3)"], "correct": 3, "explain": "to_have_count(3) проверяет количество элементов, найденных локатором — полезно для списков и таблиц."}, {"question": "Как записать проверку с отрицанием, что элемент не виден на странице?", "options": ["assert not expect(locator).to_be_visible()", "expect(locator).not_to_be_visible()", "not expect(locator).visible()", "expect(locator).to_be_hidden(False)"], "correct": 1, "explain": "У любой проверки expect() есть форма отрицания с префиксом not_ — она так же умеет ждать нужное состояние, в отличие от оборачивания в assert not."}, {"question": "Какая проверка подтверждает, что кнопка заблокирована и недоступна для клика?", "options": ["expect(locator).to_be_hidden()", "expect(locator).to_be_disabled()", "expect(locator).to_have_value(\"disabled\")", "expect(locator).not_to_have_text(\"\")"], "correct": 1, "explain": "to_be_disabled() — специальная проверка состояния элемента, подтверждающая, что он заблокирован для взаимодействия."}]}, {"id": "p79", "section": "Модуль 5 · Allure и отчётность", "subgroup": null, "isOverview": true, "num": null, "title": "Модуль 5. Allure и отчётность (неделя 11)", "content": "# Модуль 5. Allure и отчётность (неделя 11)\n\nК этому моменту у тебя уже есть тесты в общем репозитории (API — модуль 3, UI — модуль 4). Проблема в том, что \"тест упал\" сам по себе почти ничего не говорит: непонятно, на каком шаге, с каким запросом, с каким скриншотом. Allure превращает список зелёных/красных точек в отчёт, по которому можно разобраться в падении, не перечитывая код теста.\n\nМодуль написан заново (в исходном курсе `stepik-api-testing-advanced` соответствующий раздел оказался пустой заглушкой — см. `ROADMAP.md`), но опирается на уже готовую, проверенную интеграцию Allure в `boilerplate/`.\n\n## Уроки\n\n1. [Зачем нужен Allure](#p80) — что не так с обычным выводом pytest\n2. [allure.step и allure.title](#p81) — размечаем сценарий теста\n3. [Вложения: скриншоты и логи при падении](#p82) — разбираем готовый hook в conftest.py\n4. [Настройка и генерация отчёта](#p83) — allure-pytest, --alluredir, allure serve\n5. [Домашнее задание](#p84)\n\n## Итог модуля\n\nВсе тесты студента в общем репозитории снабжены нормальными allure-шагами (`allure.step`, `allure.title`, epic/feature), падения UI-тестов автоматически прикладывают скриншот.\n", "hasPractice": false}, {"id": "p80", "section": "Модуль 5 · Allure и отчётность", "subgroup": null, "isOverview": false, "num": "5.1", "title": "Зачем нужен Allure", "content": "# 5.1. Зачем нужен Allure\n\n## Зачем это нужно\n\nКогда тестов десять, вывода `pytest -v` в терминале достаточно. Когда тестов двести и часть из них падает в CI по ночам — нужно, чтобы кто угодно (включая тебя самого через неделю) мог открыть отчёт и за 30 секунд понять: что упало, на каком шаге сценария, с каким запросом или на каком экране. Именно это делает Allure.\n\n## Теория\n\nAllure — это не библиотека для написания тестов, а инструмент отчётности. Он состоит из двух частей:\n\n- **`allure-pytest`** — плагин, который во время прогона собирает данные о тестах (шаги, вложения, метаданные) и складывает их в папку с \"сырыми\" JSON-файлами (обычно `allure-results/`).\n- **Allure CLI** — отдельная программа, которая превращает эти JSON-файлы в HTML-отчёт с графиками, деревом тестов, историей запусков.\n\nБез разметки в коде Allure всё равно покажет список тестов и их статус — примерно то же, что и обычный pytest-отчёт. Разметка (`allure.step`, `allure.title`, `allure.epic/feature`) — это то, что превращает отчёт из \"список точек\" в читаемую историю сценария.\n\nВ `boilerplate/requirements.txt` уже есть зависимость:\n\n```\nallure-pytest==2.13.5\n```\n\nЗначит, плагин будет активирован автоматически при установке `pip install -r requirements.txt` — писать конфиг для его подключения не нужно.\n\n## Пример\n\nДостаточно запустить тесты с одним дополнительным флагом:\n\n```bash\npytest --alluredir=allure-results\n```\n\nПосле этого в папке `allure-results/` появятся файлы вида `*-result.json` — по одному на тест, плюс служебные файлы окружения. Как превратить их в HTML-отчёт — в уроке 5.4.\n\n## Частые ошибки\n\n- Ждать красивый отчёт сразу после `pytest --alluredir=...` — это ещё не отчёт, а сырые данные. Нужен отдельный шаг генерации (`allure generate` или `allure serve`).\n- Путать `allure-pytest` (Python-плагин, ставится через pip) и Allure CLI (отдельная программа, ставится отдельно — через brew/scoop/архив с сайта). Это два разных инструмента.\n- Держать старую папку `allure-results/` между прогонами без её очистки — тогда в отчёте копятся результаты вперемешку со старыми запусками. Обычно `allure-results/` добавляют в `.gitignore` (это уже сделано в `boilerplate/.gitignore`) и очищают перед новым прогоном.\n\n## Мини-задание\n\nУстанови зависимости из `boilerplate/requirements.txt`, запусти `pytest --alluredir=allure-results` и открой глазами получившиеся JSON-файлы в `allure-results/` — найди в одном из них поле `\"status\"` и попробуй понять, за какой тест он отвечает по полю `\"fullName\"` или `\"name\"`.\n", "hasPractice": true, "quiz": [{"question": "Ты запустил pytest --alluredir=allure-results. Что нужно сделать дальше, чтобы увидеть красивый HTML-отчёт?", "options": ["Переустановить allure-pytest с флагом --html", "Отдельно установить и запустить Allure CLI (например, allure serve) поверх этой папки", "Открыть JSON-файлы из allure-results прямо в браузере", "Ничего — allure-results уже и есть готовый HTML-отчёт"], "correct": 1, "explain": "allure-pytest только пишет сырые JSON-результаты. Превращает их в HTML-отчёт отдельная программа — Allure CLI (allure serve / allure generate)."}, {"question": "Что реально производит плагин allure-pytest во время прогона тестов?", "options": ["PDF-документ с результатами", "Сырые JSON-файлы с данными о тестах — без какого-либо HTML", "Ничего, он только печатает результат в консоль", "Готовый HTML-отчёт сразу"], "correct": 1, "explain": "allure-pytest собирает данные во время прогона и складывает их как JSON в папку --alluredir. HTML появляется только после отдельного шага генерации."}, {"question": "Студент установил только пакет allure-pytest (через pip) и не ставил Allure CLI отдельно. Что произойдёт при попытке выполнить команду allure serve allure-results?", "options": ["pip install allure-pytest автоматически подтянет и CLI при следующем запуске pytest", "Откроется пустой отчёт без данных", "Команда завершится ошибкой — Allure CLI не установлен как отдельная программа", "Команда сработает — allure-pytest уже включает CLI внутри себя"], "correct": 2, "explain": "allure-pytest (pip-пакет) и Allure CLI (отдельная программа, обычно через brew/scoop/архив) — два разных инструмента, их нужно ставить по отдельности."}, {"question": "Зачем нужен флаг --alluredir у команды pytest?", "options": ["Указывает pytest, куда сохранять сырые данные о тестах для последующей генерации отчёта", "Отключает предупреждения (warnings) pytest", "Ускоряет прогон тестов за счёт параллельного запуска", "Включает более подробный вывод прямо в консоли"], "correct": 0, "explain": "--alluredir=<папка> — это единственное, что нужно указать pytest, чтобы allure-pytest начал писать результаты именно туда."}, {"question": "Почему папку allure-results обычно добавляют в .gitignore?", "options": ["GitHub технически запрещает хранить JSON-файлы в репозитории", "Это сгенерированные артефакты конкретного прогона, а не часть исходного кода", "Потому что размер папки всегда превышает лимиты GitHub", "Чтобы скрыть от коллег информацию о падающих тестах"], "correct": 1, "explain": "allure-results — результат конкретного локального/CI прогона, он не должен коммититься в репозиторий, как и любые другие сгенерированные артефакты."}]}, {"id": "p81", "section": "Модуль 5 · Allure и отчётность", "subgroup": null, "isOverview": false, "num": "5.2", "title": "allure.step и allure.title", "content": "# 5.2. allure.step и allure.title\n\n## Зачем это нужно\n\nНазвание функции теста (`test_get_user`) и её докстринг — это то, что видит разработчик, читающий код. А человек, который просто смотрит отчёт после ночного прогона в CI, кода не открывает. Ему нужно человекочитаемое название сценария и пошаговая раскладка того, что происходило — именно это дают `allure.title` и `allure.step`.\n\n## Теория\n\nТри основных декоратора/контекст-менеджера, с которых стоит начать:\n\n- **`@allure.title(\"...\")`** — задаёт человекочитаемое название теста в отчёте вместо технического `test_get_user`.\n- **`@allure.epic(\"...\")` / `@allure.feature(\"...\")`** — группируют тесты в отчёте по крупным разделам (например epic=\"API\", feature=\"Users\") — по ним строится дерево в интерфейсе Allure.\n- **`with allure.step(\"...\"):`** — оборачивает часть теста в именованный шаг. В отчёте шаги показываются как раскрывающийся список, и если тест упал — видно, на каком именно шаге.\n\nВсё это уже используется в общем репозитории. Открой:\n\n```\nboilerplate/tests/api/test_users.py\nboilerplate/tests/ui/test_registration.py\n```\n\n## Пример\n\nРазбор реального теста из `boilerplate/tests/api/test_users.py`:\n\n```python\n@allure.epic(\"API\")\n@allure.feature(\"Users\")\n@pytest.mark.api\nclass TestUsers:\n\n    @allure.title(\"Получение пользователя по id\")\n    def test_get_user(self, users_client: UsersClient):\n        with allure.step(\"Запрашиваем пользователя с id=1\"):\n            user = users_client.get_user(user_id=1)\n\n        with allure.step(\"Проверяем, что данные пользователя корректны\"):\n            assert user.id == 1\n            assert \"@\" in user.email\n```\n\nЕсли упадёт второй `assert`, в отчёте будет видно: шаг \"Запрашиваем пользователя...\" — зелёный, шаг \"Проверяем, что данные...\" — красный, и именно в нём — traceback. Не нужно перечитывать весь тест, чтобы понять, где именно сломалось.\n\nОбрати внимание на связку `@allure.epic` + `@allure.feature` на уровне класса — это распространяется на все тесты внутри `TestUsers`, повторять на каждом методе не нужно.\n\n## Частые ошибки\n\n- Слишком мелкая разбивка на шаги (`allure.step` на каждую строчку) — отчёт превращается в такой же шум, каким был voir код без разметки. Шаг — это осмысленный кусок сценария (\"открыли форму\", \"заполнили и отправили\", \"проверили результат\"), а не техническая мелочь.\n- `allure.title` дублирует то, что и так понятно из имени функции — тогда декоратор не добавляет пользы. Хорошее название описывает бизнес-сценарий, а не техническую механику.\n- Забыть, что `allure.step` — это context manager (`with allure.step(...):\"`), а не декоратор — синтаксис у него другой, чем у `allure.title`.\n\n## Мини-задание\n\nВозьми любой свой тест из модуля 3 или 4 (API или UI) и добавь в него `@allure.title` с человекочитаемым названием и минимум два `allure.step` — один на подготовку/действие, один на проверку.\n", "hasPractice": true, "quiz": [{"question": "Как правильно использовать allure.step внутри теста?", "options": ["Как обычный вызов функции: allure.step(\"...\") без блока", "Как контекстный менеджер: with allure.step(\"...\"):", "Как декоратор над функцией теста: @allure.step(\"...\")", "Только внутри conftest.py, в тестах напрямую не используется"], "correct": 1, "explain": "allure.step — контекстный менеджер: код внутри блока with становится отдельным именованным шагом в отчёте."}, {"question": "Где обычно размещают декораторы allure.epic и allure.feature, чтобы не дублировать их на каждом тесте?", "options": ["На уровне тестового класса — тогда они действуют на все методы внутри", "Только внутри conftest.py", "Их обязательно нужно повторять на каждом отдельном тесте", "В отдельном YAML-файле конфигурации"], "correct": 0, "explain": "@allure.epic и @allure.feature, поставленные над классом, распространяются на все тестовые методы внутри — повторять их на каждом методе не нужно."}, {"question": "Зачем нужен allure.title, если у теста уже есть имя функции test_get_user?", "options": ["Чтобы задать человекочитаемое название сценария — его видят не только разработчики, но и все, кто смотрит отчёт", "Это формальное требование PEP8", "Чтобы pytest быстрее находил и запускал тест", "Без allure.title тест вообще не запустится"], "correct": 0, "explain": "Техническое имя функции понятно разработчику, но не тому, кто просто открывает отчёт после ночного прогона — для него нужно человекочитаемое название."}, {"question": "Тест упал именно на втором из двух allure.step. Что покажет Allure-отчёт?", "options": ["Только общий traceback без привязки к конкретному шагу", "Оба шага станут красными одновременно", "Первый шаг — зелёный, второй — красный, и именно в нём traceback", "Allure не показывает информацию о шагах при падении теста"], "correct": 2, "explain": "Именно в этом ценность шагов: видно, какой конкретно шаг сценария сломался, не перечитывая весь код теста."}, {"question": "Какая разбивка на allure.step считается СЛИШКОМ мелкой, по мнению урока?", "options": ["Разбивка на шаги вообще не нужна в API-тестах", "Один шаг на каждую строчку кода, включая технически мелкие операции", "Один шаг на весь тест целиком", "Один шаг на подготовку/действие, один — на проверку результата"], "correct": 1, "explain": "Шаг — это осмысленный кусок сценария, а не техническая мелочь; слишком мелкая разбивка превращает отчёт в такой же шум, каким был код без разметки."}]}, {"id": "p82", "section": "Модуль 5 · Allure и отчётность", "subgroup": null, "isOverview": false, "num": "5.3", "title": "Вложения: скриншоты и логи при падении", "content": "# 5.3. Вложения: скриншоты и логи при падении\n\n## Зачем это нужно\n\nТекст ошибки (\"`AssertionError: Dashboard != Dashbord`\") — это полезно, но для UI-теста скриншот в момент падения часто говорит больше, чем весь traceback. Не нужно гадать, что творилось на экране — можно просто на него посмотреть.\n\n## Теория\n\n`allure.attach(...)` прикладывает к результату теста произвольные данные: текст, JSON, скриншот, файл лога. Прикладывать вложения можно вручную внутри теста, но гораздо удобнее сделать это автоматически для ЛЮБОГО упавшего UI-теста — через pytest hook, один раз в `conftest.py`.\n\nИменно так уже сделано в общем репозитории. Открой `boilerplate/conftest.py` и найди в конце файла:\n\n```python\n@pytest.hookimpl(hookwrapper=True)\ndef pytest_runtest_makereport(item, call):\n    outcome = yield\n    report = outcome.get_result()\n\n    if report.when == \"call\" and report.failed:\n        page: Page | None = item.funcargs.get(\"page\")\n        if page is not None:\n            allure.attach(\n                page.screenshot(),\n                name=\"screenshot-on-failure\",\n                attachment_type=allure.attachment_type.PNG,\n            )\n```\n\nРазбор по частям:\n\n- `pytest_runtest_makereport` — это стандартный pytest hook, который вызывается после каждой фазы теста (setup / call / teardown) и формирует отчёт (`report`) об этой фазе.\n- `hookwrapper=True` — превращает функцию в обёртку: сначала выполняется оригинальная логика pytest (`yield`), а затем — наш код после неё, уже с готовым `report` на руках.\n- `report.when == \"call\" and report.failed` — нас интересует падение именно в фазе выполнения самого теста (не в фикстурах — `setup`, и не после — `teardown`).\n- `item.funcargs.get(\"page\")` — если тест использовал фикстуру `page` (то есть это UI-тест), Playwright-объект страницы будет доступен через `item.funcargs`. Для API/unit-тестов его там не будет — `page` окажется `None`, и вложение просто не приложится.\n- `page.screenshot()` — Playwright снимает скриншот текущего состояния браузера в байтах, `allure.attach` прикладывает эти байты как PNG к результату теста.\n\nКлючевая идея: **эта логика не встроена в каждый тест** — она в одном месте (`conftest.py`) и работает для всех UI-тестов автоматически, включая те, что напишешь ты сам в будущих PR.\n\n## Пример\n\nНичего дополнительно писать не нужно — попробуй сломать тест специально, чтобы увидеть механизм в действии:\n\n```python\n# временно, для эксперимента — не коммитить\ndef test_broken_on_purpose(dashboard_page):\n    dashboard_page.check_visible_toolbar_title()  # страница ещё не открыта, упадёт\n```\n\nЗапусти `pytest -m ui --alluredir=allure-results`, сгенерируй отчёт (урок 5.4) и найди в упавшем тесте вложение `screenshot-on-failure`.\n\n## Частые ошибки\n\n- Пытаться делать `page.screenshot()` внутри самого теста в каждом `assert` \"на всякий случай\" — вместо этого используй уже готовый общий механизм в `conftest.py`, не дублируй его.\n- Забыть, что hook сработает только если в тесте реально есть параметр `page` — если Page Object спрятан за другой фикстурой без него в сигнатуре, `item.funcargs` его не найдёт (в нашем boilerplate `registration_page`/`dashboard_page` сами зависят от `page`, так что фикстура всё равно попадает в `funcargs`).\n- Прикладывать скриншот и для API-тестов \"по аналогии\" — там это бессмысленно, вместо этого для API-тестов полезнее прикладывать тело запроса/ответа (это уже вне обязательной программы модуля, но логика та же: `allure.attach` с `attachment_type=allure.attachment_type.JSON`).\n\n## Мини-задание\n\nСпециально сломай один свой UI-тест (например, поменяй ожидаемый текст в `expect(...).to_have_text(...)` на заведомо неверный), прогони с `--alluredir`, сгенерируй отчёт и убедись, что скриншот приложился автоматически. Не забудь откатить \"поломку\" после эксперимента.\n", "hasPractice": true, "quiz": [{"question": "Хук в conftest.py проверяет условие `report.when == \"call\" and report.failed` перед тем, как приложить скриншот. Зачем нужна проверка именно на 'call'?", "options": ["Потому что 'call' — единственная фаза, которую поддерживает pytest в принципе", "Потому что скриншот технически можно снять только во время фазы 'call'", "Чтобы прикладывать скриншот только при падении в самом тесте, а не в setup/teardown фикстур", "Чтобы ускорить прогон тестов за счёт пропуска лишних проверок"], "correct": 2, "explain": "У теста есть три фазы — setup, call, teardown. Проверка 'when == call' отделяет падение самого сценария от падения, например, фикстуры на этапе подготовки."}, {"question": "Упал API-тест, у которого нет фикстуры page в параметрах. Приложится ли к нему скриншот?", "options": ["Тест в этом случае вообще не запустится", "Нет — item.funcargs.get('page') вернёт None, и код внутри if не выполнится", "Да, скриншот прикладывается к любому упавшему тесту всегда", "Да, но вместо скриншота будет чёрный квадрат"], "correct": 1, "explain": "Хук ищет фикстуру page именно в funcargs текущего теста. У API-теста её нет — get('page') вернёт None, и вложение просто не добавится."}, {"question": "Зачем в хуке используется @pytest.hookimpl(hookwrapper=True)?", "options": ["Чтобы хук срабатывал только при запуске в CI", "Это обязательный синтаксис для абсолютно любого хука в pytest", "Чтобы искусственно ускорить прогон тестов", "Чтобы выполнить свой код ПОСЛЕ стандартной логики pytest, уже имея готовый объект report"], "correct": 3, "explain": "hookwrapper=True превращает функцию в обёртку: сначала выполняется оригинальная логика pytest (yield), а затем наш код, уже имея на руках готовый report."}, {"question": "Где нужно разместить логику автоматического приложения скриншота, чтобы она работала для ВСЕХ будущих UI-тестов без дублирования кода в каждом из них?", "options": ["Один раз в conftest.py как pytest-хук", "В pytest.ini", "В каждом тесте отдельно, в конце функции", "В конструкторе BasePage.__init__"], "correct": 0, "explain": "Ключевая идея урока: логика в одном месте (conftest.py) работает для всех UI-тестов автоматически, включая ещё не написанные."}, {"question": "Что возвращает вызов page.screenshot() в Playwright?", "options": ["Путь к файлу скриншота на диске", "Текстовое HTML-описание страницы", "Ничего — скриншот сохраняется автоматически без участия кода", "Байты изображения (PNG), которые можно сразу передать в allure.attach"], "correct": 3, "explain": "page.screenshot() без параметров возвращает бинарные данные PNG-картинки в память — их и передают в allure.attach(..., attachment_type=allure.attachment_type.PNG)."}]}, {"id": "p83", "section": "Модуль 5 · Allure и отчётность", "subgroup": null, "isOverview": false, "num": "5.4", "title": "Настройка и генерация отчёта", "content": "# 5.4. Настройка и генерация отчёта\n\n## Зачем это нужно\n\n`allure-pytest` умеет только собирать сырые данные. Чтобы увидеть красивый HTML-отчёт с деревом тестов, графиками и историей — нужен отдельный инструмент, Allure CLI, и команда, которая превратит JSON в страницы.\n\n## Теория\n\nДва инструмента, которые не стоит путать:\n\n1. **`allure-pytest`** — Python-пакет, ставится через `pip install -r requirements.txt` (уже в зависимостях boilerplate). Он ничего не показывает сам — только пишет `*-result.json` в папку `--alluredir`.\n2. **Allure CLI (`allure`)** — отдельная программа на Java, ставится один раз на машину (через `brew install allure` на macOS, `scoop install allure` на Windows, или вручную из архива с официального сайта). Именно она умеет превращать JSON в HTML.\n\nДве полезные команды CLI:\n\n- `allure serve allure-results` — генерирует отчёт во временную папку и сразу открывает его в браузере. Удобно для локальной разработки.\n- `allure generate allure-results -o allure-report --clean` — генерирует статический HTML-отчёт в постоянную папку `allure-report/`. Именно так обычно делают в CI, чтобы потом отчёт можно было опубликовать как артефакт (см. модуль 6).\n\n## Пример\n\nЛокальный цикл разработки:\n\n```bash\npytest --alluredir=allure-results\nallure serve allure-results\n```\n\nЦикл для CI (генерация в статику, без открытия браузера — на CI-раннере браузера и не будет):\n\n```bash\npytest --alluredir=allure-results\nallure generate allure-results -o allure-report --clean\n```\n\nВ `.github/workflows/ci.yml` и `.gitlab-ci.yml` общего репозитория уже настроена загрузка `allure-results` как артефакта пайплайна (см. `upload-artifact` / `artifacts:` в этих файлах) — этого достаточно, чтобы результаты не терялись после завершения job'а. Полноценную публикацию сгенерированного HTML-отчёта (например, на GitHub Pages или во внешний Allure-сервис) курс намеренно не покрывает — это уже задача уровня \"настройка инфраструктуры\", а не работы автотестера.\n\n## Частые ошибки\n\n- Ставить `allure-pytest` и ждать, что команда `allure` уже доступна в терминале — это разные установки, `allure-pytest` не тянет за собой Java CLI.\n- Коммитить `allure-results/` или `allure-report/` в git — это сгенерированные артефакты конкретного прогона, место им в `.gitignore` (уже сделано в boilerplate).\n- Путать `--alluredir` (флаг pytest, куда писать сырые данные) и `-o` у `allure generate` (куда класть готовый HTML) — это два разных пути в двух разных командах.\n\n## Частые ошибки при первом запуске\n\n- `allure: command not found` — значит, CLI не установлен или не в `PATH`; `pip install allure-pytest` эту проблему не решает, это разные инструменты.\n- Пустой отчёт — обычно означает, что `pytest` запускали без `--alluredir`, и в указанной папке просто нет файлов.\n\n## Мини-задание\n\nУстанови Allure CLI (один раз на свою машину) и прогони полный локальный цикл: `pytest --alluredir=allure-results` → `allure serve allure-results`. Найди в открывшемся отчёте вкладку \"Suites\" и убедись, что видишь дерево `epic -> feature -> test` из своих тестов.\n", "hasPractice": true, "quiz": [{"question": "В чём разница между `allure serve allure-results` и `allure generate allure-results -o allure-report --clean`?", "options": ["serve сразу открывает временный отчёт в браузере, generate создаёт постоянную папку с HTML (обычно используется в CI)", "serve нужен для API-тестов, а generate — только для UI-тестов", "Это два названия одной и той же команды, работают одинаково", "generate работает только в CI и недоступен локально"], "correct": 0, "explain": "serve — для быстрой локальной проверки во временной папке, generate -o ... --clean — для сохранения статического отчёта, который потом публикуется как артефакт CI."}, {"question": "Что нужно установить ОТДЕЛЬНО от pip install -r requirements.txt, чтобы команда allure вообще заработала в терминале?", "options": ["Playwright browsers", "Node.js", "Allure CLI — отдельную программу (например, через brew/scoop/архив с сайта)", "Ничего — allure-pytest из requirements.txt уже включает CLI"], "correct": 2, "explain": "allure-pytest (pip-пакет) и Allure CLI (Java-программа) ставятся отдельно друг от друга — это два разных инструмента."}, {"question": "Как allure-results используется в CI-конфигах общего репозитория (.github/workflows/ci.yml, .gitlab-ci.yml)?", "options": ["Никак не используется в CI", "Автоматически комментируется в Pull Request", "Публикуется как артефакт пайплайна, который можно скачать после прогона", "Отправляется как email-уведомление"], "correct": 2, "explain": "И GitHub Actions, и GitLab CI в этом курсе настроены сохранять allure-results как artifact — независимо от того, прошли тесты или упали."}, {"question": "Почему в CI обычно используют `allure generate`, а не `allure serve`?", "options": ["Разницы нет, выбор произвольный", "generate работает в 10 раз быстрее serve", "allure serve открывает браузер локально и не годится для безголового CI-раннера; generate просто пишет статический HTML в папку", "serve вообще не существует в CLI"], "correct": 2, "explain": "На CI-раннере нет браузера, который можно было бы открыть — поэтому там имеет смысл только генерация статического отчёта в файл."}]}, {"id": "p84", "section": "Модуль 5 · Allure и отчётность", "subgroup": null, "isOverview": false, "num": null, "title": "Домашнее задание модуля 5", "content": "# Домашнее задание модуля 5\n\n## Что нужно сделать\n\nВозьми **все** свои тесты, которые уже есть в общем репозитории (из модулей 3 и 4 — API и UI), и приведи их к единому стандарту Allure-разметки:\n\n1. На каждом тестовом классе — `@allure.epic(...)` и `@allure.feature(...)`.\n2. На каждом тесте — `@allure.title(...)` с человекочитаемым названием сценария (не техническое имя функции).\n3. Внутри каждого теста — минимум 2 `allure.step`: один на подготовку/действие, один на проверку. Для более сложных сценариев (например, полная регистрация) — 3-4 шага, по одному на логичный этап сценария.\n4. Убедиться, что UI-тесты используют фикстуру `page` в цепочке зависимостей (через `registration_page`/`dashboard_page` или напрямую) — тогда автоматическое приложение скриншота при падении из `conftest.py` сработает без дополнительного кода.\n\n## Критерии \"готово\"\n\n- `pytest --alluredir=allure-results` отрабатывает без ошибок.\n- В сгенерированном отчёте (`allure serve allure-results`) видно дерево `epic -> feature -> тест` без \"безымянных\" узлов.\n- В отчёте у каждого теста есть минимум 2 шага.\n- Специально сломанный (временно) UI-тест показывает приложенный скриншот.\n- Изменения оформлены как PR в общий репозиторий (по правилам модуля 2), ревью — от одногруппника.\n\n## Что не нужно делать\n\n- Не нужно настраивать публикацию отчёта на внешнем сервисе (Allure TestOps и подобные) — это вне программы курса.\n- Не нужно приклеивать скриншоты вручную в каждом тесте — это уже сделано один раз в `conftest.py`.\n", "hasPractice": false}, {"id": "p85", "section": "Модуль 6 · CI на уровне пользователя", "subgroup": null, "isOverview": true, "num": null, "title": "Модуль 6. CI на уровне пользователя (неделя 12)", "content": "# Модуль 6. CI на уровне пользователя (неделя 12)\n\nНа реальной работе джуниор почти никогда не пишет CI-пайплайн с нуля — он уже есть, настроен более опытными коллегами. Но джуниору критически важно уметь его **читать**: понимать, на каком стейдже упал прогон, находить нужный лог, отличать \"сломался мой тест\" от \"сломалась инфраструктура\", и уметь перезапустить job вручную.\n\nМодуль написан заново (в исходном курсе `stepik-api-testing-advanced` раздел про CI/CD оказался пустой заглушкой — см. `ROADMAP.md`), но опирается на реальные, рабочие CI-конфиги общего репозитория.\n\n## Уроки\n\n1. [Введение в CI/CD](#p86)\n2. [Читаем GitHub Actions workflow](#p87) — разбор `.github/workflows/ci.yml` построчно\n3. [Читаем .gitlab-ci.yml](#p88) — тот же пайплайн, другой синтаксис\n4. [Диагностика упавшего пайплайна](#p89)\n5. [Домашнее задание](#p90)\n\n## Итог модуля\n\nСтудент может сам диагностировать, почему упал pipeline после его PR — без обращения к куратору \"у меня почему-то красный крестик\".\n", "hasPractice": false}, {"id": "p86", "section": "Модуль 6 · CI на уровне пользователя", "subgroup": null, "isOverview": false, "num": "6.1", "title": "Введение в CI/CD", "content": "# 6.1. Введение в CI/CD\n\n## Зачем это нужно\n\nПока тесты запускаются только вручную с твоего ноутбука, легко забыть их запустить перед мёржем — или запустить, но не заметить упавший тест среди вывода в терминале. CI (Continuous Integration) решает эту проблему: тесты запускаются автоматически на каждый push и PR, независимо от того, вспомнил ли о них человек.\n\n## Теория\n\n**CI (Continuous Integration)** — практика, при которой изменения кода автоматически проверяются (сборка, тесты, линтеры) при каждом коммите/PR, на отдельном сервере (\"раннере\"), а не на машине разработчика.\n\n**CD (Continuous Delivery/Deployment)** — продолжение той же идеи для доставки изменений в тестовые/боевые окружения. В контексте курса нас интересует именно CI — автоматический прогон тестов; деплой приложений выходит за рамки программы.\n\nБазовые понятия, которые встретятся в обеих системах (GitHub Actions и GitLab CI):\n\n- **Pipeline (пайплайн)** — весь процесс проверки одного коммита/PR от начала до конца.\n- **Stage / Job (стейдж / джоба)** — пайплайн разбит на этапы (stages), внутри каждого этапа — одна или несколько задач (jobs), которые могут выполняться параллельно.\n- **Runner (раннер)** — машина (часто — временный контейнер), на которой реально выполняется job.\n- **Artifact (артефакт)** — файлы, которые job сохраняет после выполнения (например, allure-results из модуля 5), чтобы их можно было скачать или передать в следующий stage.\n- **Trigger (триггер)** — событие, которое запускает пайплайн: push в ветку, открытие/обновление PR, ручной запуск, расписание.\n\n## Пример\n\nОбщий репозиторий курса использует **обе** системы для примера (в реальном проекте обычно используется только одна — та, что предоставляет хостинг репозитория):\n\n```\nboilerplate/.github/workflows/ci.yml   — GitHub Actions\nboilerplate/.gitlab-ci.yml             — GitLab CI\n```\n\nОба файла реализуют одну и ту же идею: сначала быстрые unit+API тесты, затем (если они прошли) — более медленные UI-тесты с браузером. В следующих двух уроках разберём каждый файл построчно.\n\n## Частые ошибки\n\n- Считать, что CI и CD — это одно и то же. CI — про проверку, CD — про доставку/деплой. Курс касается только CI.\n- Путать \"упал pipeline\" с \"сломался прод\". Красный пайплайн на PR означает, что проблему нашли ДО того, как код попал в основную ветку — это ровно то, ради чего CI существует.\n- Ожидать, что раннер CI — это та же машина/окружение, что у тебя локально. Обычно это чистый контейнер без твоих локально установленных пакетов — поэтому пайплайн всегда явно устанавливает зависимости (`pip install -r requirements.txt`) с нуля.\n\n## Мини-задание\n\nОткрой `boilerplate/.github/workflows/ci.yml` и `boilerplate/.gitlab-ci.yml` рядом и найди в каждом файле: сколько там jobs/stages, и в каком порядке они выполняются (порядок задаётся через `needs:` в GitHub Actions и через `stages:`/`stage:` в GitLab CI).\n", "hasPractice": true, "quiz": [{"question": "В чём ключевое отличие CI от CD применительно к этому курсу?", "options": ["CD — это прогон тестов, а CI — деплой приложения", "Это просто два разных названия одного и того же процесса", "CI — автоматическая проверка кода (тесты) при каждом коммите/PR; CD — доставка изменений дальше (деплой). Курс касается только CI", "CI нужен только для UI-тестов, а CD — только для API-тестов"], "correct": 2, "explain": "CI — про проверку (сборка/тесты на каждый коммит), CD — про доставку/деплой в окружения. Программа курса ограничена именно CI."}, {"question": "Что из перечисленного — пример TRIGGER (события, запускающего пайплайн)?", "options": ["Скачивание артефакта прошлого прогона", "Комментарий в issue-трекере", "Push в ветку или открытие Pull Request", "Просмотр логов уже завершившегося job'а"], "correct": 2, "explain": "Триггер — событие, запускающее весь пайплайн: push, PR, ручной запуск или расписание."}, {"question": "Чем JOB отличается от STAGE в терминологии CI?", "options": ["Stage существует только в GitHub Actions", "Job — это весь пайплайн целиком", "Это одно и то же слово на разных языках", "Stage — этап пайплайна; job — конкретная задача внутри этапа (в одном stage может быть несколько job'ов)"], "correct": 3, "explain": "Пайплайн делится на stages (этапы), а внутри каждого этапа выполняются один или несколько jobs, которые могут идти параллельно."}, {"question": "Что такое RUNNER в контексте CI?", "options": ["Файл конфигурации пайплайна", "Человек, отвечающий за настройку CI в команде", "Библиотека Python для тестировани
